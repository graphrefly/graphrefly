\* TLC config — synchronous feedback-cycle rejection (conformance C-6, R-reentrancy, D37).
\* Cyclic case: E feeds back into S; the wave is REJECTED at E with an ERROR.
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_reentrancy.cfg wave_reentrancy

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    HasFeedback = TRUE
    KickNode    = "E"
    MaxDepth    = 6

INVARIANTS
    TypeOK
    NoReentrantCompute
    InWaveConsistent
    StackBounded
    CycleRejectedAtCompute
    AcyclicNeverErrors
