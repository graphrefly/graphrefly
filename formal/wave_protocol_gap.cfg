\* TLC config — gap-aware (substrate-faithful) historical model for
\* wave_protocol.tla. Documents the pre-fix substrate where multi-parent
\* derived handshakes synthesized the gap-aware shape `<<START, DIRTY,
\* RESOLVED, DIRTY, DATA>>` instead of the clean `<<START, DIRTY, DATA>>`.
\*
\* Run with:
\*   java -cp <tla2tools.jar> tlc2.TLC -config wave_protocol_gap.cfg wave_protocol_gap_MC
\*
\* Status: substrate has been fixed (see docs/optimizations.md "Multi-dep
\* push-on-subscribe ordering" — fast-check #10 + TLC clean MC both pass
\* post-fix). This MC is RETAINED as a historical artifact: it models the
\* pre-fix substrate to confirm that the gap-aware shape, while non-ideal,
\* doesn't break ANY OTHER protocol invariant. `MultiDepHandshakeClean`
\* is intentionally OMITTED from the INVARIANTS list below — it would trip
\* in 2 steps under `GapAwareActivation = TRUE` with the documented
\* counter-example handshake `<<START, DIRTY, RESOLVED, DIRTY, DATA>>`.
\* That counter-example is preserved in the comment at the top of
\* `wave_protocol_gap_MC.tla`; the test sweep verifies all other invariants
\* still hold under the gap-aware substrate so the `MultiDepHandshakeClean`
\* failure remains a precisely-targeted, single-invariant demonstration.
\*
\* To re-run the historical counter-example (e.g. as a regression check
\* if `GapAwareActivation` is ever flipped back to TRUE in the substrate):
\* manually add `MultiDepHandshakeClean` back to INVARIANTS below and TLC
\* will reproduce the original 2-step counter-example.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    NodeIds             <- NodeIdsMC
    SourceIds           <- SourceIdsMC
    SinkIds             <- SinkIdsMC
    Edges               <- EdgesMC
    Values              <- ValuesMC
    DefaultInitial      <- DefaultInitMC
    MaxEmits            <- MaxEmitsMC
    BatchSeqs           <- BatchSeqsMC
    GapAwareActivation  <- GapAwareActivationMC
    SinkNestedEmits     <- SinkNestedEmitsMC
    MaxNestedEmits      <- MaxNestedEmitsMC
    LockIds             <- LockIdsMC
    Pausable            <- PausableMC
    ResubscribableNodes <- ResubscribableNodesMC
    MaxPauseActions     <- MaxPauseActionsMC
    UpOriginators       <- UpOriginatorsMC
    MaxUpActions        <- MaxUpActionsMC
    ExtraSinks          <- ExtraSinksMC
    ResetOnTeardownNodes <- ResetOnTeardownNodesMC
    InvalidateOriginators <- InvalidateOriginatorsMC
    MaxInvalidates       <- MaxInvalidatesMC
    BatchInvSeqs        <- BatchInvSeqsMC
    AutoCompleteOnDepsComplete <- AutoCompleteOnDepsCompleteMC
    AutoErrorOnDepsError       <- AutoErrorOnDepsErrorMC
    ReplayBufferSize <- ReplayBufferSizeMC
    MetaCompanions   <- MetaCompanionsMC
    MaxTeardowns     <- MaxTeardownsMC

INVARIANTS
    TypeOK
    InvalidateNotInValueDomain
    NoDataWithoutDirty
    BalancedWaves
    TerminalAbsorbing
    DiamondConvergence
    VersionPerChange
    StartHandshakeValid
    \* MultiDepHandshakeClean — intentionally omitted under GapAwareActivation = TRUE.
    \* See header comment for rationale. The counter-example handshake
    \* `<<START, DIRTY, RESOLVED, DIRTY, DATA>>` is documented in
    \* `wave_protocol_gap_MC.tla` and `wave_protocol.tla` invariant #8.
    NestedDrainPeerConsistency
    TerminalClearsPauseState
    BufferImpliesLockedAndResumeAll
    BufferHoldsOnlyDeferredTiers
    ResubscribeYieldsCleanState

    UpQueuesCarryControlPlane
    UpPauseOriginatorBound
    MultiSinkTracesConverge
    MultiSinkIterationCoherent
    CleanupWitnessInValueDomain
    ReplayBufferBounded
    MetaTeardownObservedPreReset
    PausableOffStructural
    LateSubscriberReceivesReplay
    CleanupWitnessNotSentinel
    NoDepCascadeTerminalWhenGateFalse
    CleanupWitnessAccounting
    MultiSinkIterationDriftClean
    TerminatedImpliesBatchIdle
    InvalidateSettlesWave
    MergeRulesRespected
