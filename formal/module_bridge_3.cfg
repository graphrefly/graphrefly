\* module_bridge_3: as module_bridge.cfg with three sender waves.
CONSTANTS
  Edges = {x, y}
  Vals = {1, 2}
  NoVal = NoVal
  Done = Done
  MaxWaves = 3
  MaxSessions = 2
  MaxChan = 4
  Faults = TRUE
  RoundTrip = FALSE
  Mutant = "none"
SPECIFICATION Spec
\* Runs end when MaxWaves and MaxSessions are reached and the channel is empty.
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ViewIsSenderState
INVARIANT OneWavePerCause
INVARIANT AtMostOnce
INVARIANT InOrder
INVARIANT EventsMatch
INVARIANT QuiescentAgreement
INVARIANT GapReported
INVARIANT SameVersion
INVARIANT NoFalseDivergence
