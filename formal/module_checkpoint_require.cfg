\* module_checkpoint — D797 draft module rule R-checkpoint: a node restored by
\* reference/modules/checkpoint.mjs against the original it was captured from, over MaxSteps steps, in a graph
\* created to require a recipe on every computed node (R-node@3, D812).
CONSTANTS
  Require = TRUE
  MaxSteps = 7
SPECIFICATION Spec
\* Runs end when MaxSteps is reached.
CHECK_DEADLOCK FALSE
INVARIANT StateMatches
INVARIANT ResourceMatches
INVARIANT OutMatches
INVARIANT NoNeedlessRun
INVARIANT RestoreBuilds
INVARIANT LocalOnlyRefused
INVARIANT RestoredAsInstance
INVARIANT PendingMatches
INVARIANT RefusalMatches
INVARIANT RequiredNeverLocal
