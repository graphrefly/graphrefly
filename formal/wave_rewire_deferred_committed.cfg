\* TLC config -- ctx.rewireNext committed-boundary gating (B24 / C-25).
\* Exercises the combined case: request issued during a run while a batch is
\* open and a pause lock is held. TLC explores commit/resume and rollback
\* orderings; the queued boundary task may apply only after commit + final
\* RESUME, and must be discarded after rollback.
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_rewire_deferred_committed.cfg wave_rewire_deferred_committed

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    BatchInitiallyOpen = TRUE
    PauseInitiallyHeld = TRUE

INVARIANTS
    TypeOK
    NoDrainDuringRun
    NoDrainBeforeBatchCommit
    NoDrainAfterRollback
    NoDrainWhilePaused
    AppliedOnlyOnCommittedView
    DroppedTaskDoesNotMutate
    OldShapeUntilReady
