\* wave_terminal_dirty — R-terminal-settles-dirty (B35) / conformance C-15.
\* Two deps = the diamond's two legs (one terminates mid-dirty, the other settles).
CONSTANTS
  Deps = {d1, d2}
  MaxSteps = 8
SPECIFICATION Spec
\* A fully-settled wave (all deps terminal/settled) is an expected terminal state.
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT PendingCountsDirty
INVARIANT NoWedge
