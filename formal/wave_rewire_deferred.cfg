\* TLC config — wave-boundary deferred SELF-rewire (conformance C-11,
\* R-rewire-deferred, decision D47).
\* Companion to wave_rewire.cfg: wave_rewire models EXTERNAL/immediate rewire
\* between waves; this models the SELF/deferred path — a fn issues
\* ctx.rewireNext(add/remove) during its run (insideRunWave), drained + applied
\* at the committed boundary in FIFO order. 2 candidate deps exercise
\* add / remove / no-op (add-existing, remove-absent) / removed-dep silencing.
\* D62 revises the terminal facet: queued requests still drain after OP goes
\* terminal; terminal only seals downstream output.
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_rewire_deferred.cfg wave_rewire_deferred

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Deps          = {"d1", "d2"}
    MaxRuns       = 3
    MaxReqs       = 3
    MaxMsgs       = 2
    MaxDeliveries = 3

INVARIANTS
    TypeOK
    DeferredAppliedAtBoundary
    DrainExactlyOnce
    RemovedDepSilenced
    NoBoundaryDrainLoop
    NoPostTerminalOutput
