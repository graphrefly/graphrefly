\* TLC config — rewire × equals × multi-sink (conformance C-8, R-rewire, D42 SD-2 / B14).
\* Companion to wave_rewire.cfg: supplies C's downstream emit (equals DATA→RESOLVED) +
\* multi-sink fanout, composed with rewire. 2 sinks; rewire preserves cache (Q7).
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_rewire_emit.cfg wave_rewire_emit

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Sinks         = {"k1", "k2"}
    Values        = {"v0", "v1"}
    MaxEmits      = 3
    MaxRewires    = 2
    MaxDeliveries = 4

INVARIANTS
    TypeOK
    MultiSinkConsistent
    CacheMatchesLastData
    RewirePreservesCacheEmit
