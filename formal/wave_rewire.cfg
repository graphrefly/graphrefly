\* TLC config — intra-graph runtime rewire (conformance C-8, R-rewire, D42 / CSP-2.5).
\* 3-node topology A,B (sources) + C (compute, initial deps {A}, candidates {A,B}).
\* Exercises: internal SetDeps(C,{B}) models replaceDeps(C,{B}) / internal SetDeps(C,{A,B}) models subscribeDep(B) / internal SetDeps(C,{}) models unsubscribe all
\* full removal / internal SetDeps(C,{A}) models idempotent replaceDeps / rewire while paused / rewire mid-wave /
\* rewire to a dep with cached DATA (push-on-subscribe) / rewire removing the sole DIRTY dep /
\* rewire x INVALIDATE (removed-dep INVALIDATE drained) / rewire x terminal (reject on
\* terminal this; reject adding non-resubscribable terminal B).
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_rewire.cfg wave_rewire

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Values        = {"v0", "v1"}
    LockIds       = {10}
    MaxEmits      = 2
    MaxRewires    = 2
    MaxPauses     = 1
    MaxDeliveries = 4
    MaxTerminals  = 1

INVARIANTS
    TypeOK
    RewireDirtyConsistency
    DepRecordDomainConsistency
    RewirePreservesFirstRun
    RewirePreservesPauseLocks
    RewirePreservesPauseBuffer
    RewirePreservesCache
    WaveClosesWhenSoleDirtyDepRemoved
    NoStaleEdgeMessages
    RewireOnlyOnLiveNode
