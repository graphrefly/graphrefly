\* TLC config — async-result at a paused node: resumeAll mode (production-gating → buffers, incl leaf).
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_async_paused_resumeall.cfg wave_async_paused

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Values      = {1, 2}
    LockIds     = {"la", "lb"}
    MaxDispatch = 2
    Mode        = "resumeAll"
    IsLeaf      = TRUE

INVARIANTS
    TypeOK
    BufferImpliesPaused
    NoAsyncResultLost
    NoBufferWhenIgnoring
