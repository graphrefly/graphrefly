\* module_bridge: R-bridge@1, one wire edge group of reference/modules/bridge.mjs over a transport
\* that duplicates, delivers late copies and loses frames, with one restart (a new session).
CONSTANTS
  Edges = {x, y}
  Vals = {1, 2}
  NoVal = NoVal
  MaxWaves = 2
  MaxSessions = 2
  MaxChan = 4
  Faults = TRUE
  RoundTrip = FALSE
  Mutant = "none"
SPECIFICATION Spec
\* Runs end when MaxWaves and MaxSessions are reached and the channel is empty.
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ViewIsSenderState
INVARIANT OneWavePerCause
INVARIANT AtMostOnce
INVARIANT InOrder
INVARIANT EventsMatch
INVARIANT QuiescentAgreement
INVARIANT GapReported
INVARIANT SameVersion
