\* wave_deps_complete — R-deps-terminal (B42) / conformance C-17.
\* Two deps so one can ERROR (absorbed) and the other COMPLETE, in either order;
\* the auto-COMPLETE must fire once BOTH are terminal regardless of which lands last.
CONSTANTS
  Deps = {d1, d2}
  MaxSteps = 6
SPECIFICATION Spec
\* All-deps-terminal is the expected terminal state (no further action enabled).
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT AllDepsTerminalCompletes
