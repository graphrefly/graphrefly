\* TLC config — INVALIDATE arriving at a paused compute node (D50 / C-13).
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_paused_invalidate.cfg wave_paused_invalidate
\* 2 deps exercise the multi-dep attribution (sole-dep INVALIDATE cancels; a
\* surviving dep still recomputes). 2 locks exercise the multi-lock RESUME.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Deps     = {1, 2}
    Values   = {1, 2}
    LockIds  = {"la", "lb"}
    MaxSteps = 7

INVARIANTS
    TypeOK
    ChangedImpliesLive
    PendingReflectsChanges
    NoAllSentinelRecompute
