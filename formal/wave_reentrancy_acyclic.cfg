\* TLC config — acyclic control (conformance C-6, R-reentrancy, D37).
\* No feedback edge: the forward chain S->D->E quiesces with NO ERROR — proves
\* the re-entry guard does not false-positive on an acyclic graph (scan-style
\* ctx.state accumulation is acyclic).
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_reentrancy_acyclic.cfg wave_reentrancy

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    HasFeedback = FALSE
    KickNode    = "S"
    MaxDepth    = 6

INVARIANTS
    TypeOK
    NoReentrantCompute
    InWaveConsistent
    StackBounded
    CycleRejectedAtCompute
    AcyclicNeverErrors
