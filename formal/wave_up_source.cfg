\* TLC config — upstream control at a depless source (conformance C-7, R-up-at-source, D38).
\* upKind ranges over {INVALIDATE, DIRTY, TEARDOWN}: INVALIDATE is honored
\* (self-invalidate + down-cascade), DIRTY/TEARDOWN are dropped at the terminus.
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config wave_up_source.cfg wave_up_source

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    UpMsgs  = {"INVALIDATE", "DIRTY", "TEARDOWN"}
    InitVal = "v0"

INVARIANTS
    TypeOK
    InvalidateHonored
    DirtyDropped
    TeardownDropped
    DropNoDownCascade
