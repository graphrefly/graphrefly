\* kernel_lifetime — D797 draft rules R-lifetime and R-request-order.
\* Up to MaxReq requests and MaxBatches batch bodies over S -> P -> A -> M, with N rewired or replaced over P and A.
CONSTANTS
  MaxReq = 4
  MaxBatches = 1
SPECIFICATION Spec
\* Runs end when MaxReq is reached; nothing waits at that point (IdleDrained checks the queue).
CHECK_DEADLOCK FALSE
INVARIANT ActiveIffDemand
INVARIANT EdgesMatchDeps
INVARIANT OpenIffLive
INVARIANT InactiveHoldsNothing
INVARIANT StateKeeps
INVARIANT PrivOfCurrentLifetime
INVARIANT RetainedFromCurrentLifetime
INVARIANT CleanupOnce
INVARIANT ClosedRan
INVARIANT OpenNotRun
INVARIANT OneCleanupPerLifetime
INVARIANT RunOncePerRequest
INVARIANT KeptUpstreamStays
INVARIANT RewireKeeps
INVARIANT DeclaredWhenClosed
INVARIANT RewireOfThisLifetime
INVARIANT EndedHoldsNoPriv
INVARIANT FIFO
INVARIANT AfterMaker
INVARIANT IdleDrained
INVARIANT BodyAfterCommit
INVARIANT ThrownDropped
INVARIANT BatchThrowNothing
INVARIANT Acyclic
