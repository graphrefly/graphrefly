// GraphReFly wave-protocol contract IDL.
//
// Single source (DR-2 / D33): this .proto is BOTH the cross-runtime wire format
// AND the protocol-contract IDL each runtime codegens an interface skeleton from
// (a light structural guarantee on top of behavioral conformance, spec/conformance.jsonl).
//
// In-process messages are language-native tuples (D11); this protobuf shape is the
// representation at the wire-bridge boundary only (D13). Implementation is DEFERRED
// (backlog B2 — protobuf wire codec lands with the cross-runtime wire bridge, L2.F);
// the schema is locked now so all three runtimes codegen against one source.
//
// status: draft (flips to active when B2 lands + conformance C-1 cross-graph passes).
// The wire edge group's frame follows R-bridge@1 (graphrefly:D803, 2026-11-11).

syntax = "proto3";

package graphrefly.protocol.v1;

// ── Message types — CLOSED set (R-messages; graphrefly:D797, active by D798) ──
// 7 types: START handshake + 6 protocol types. No open set, no custom types.
// Adding a type is a constitutional spec change, not a wire-compatible extension.
// Control (pausing, demand, restart) is not a message: a controller writes a state node
// its target declares as a dependency, so control is DATA on a declared edge (D797).
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;  // proto3 zero guard — never a valid wire type
  MSG_START = 1;                 // subscribe handshake, then the snapshot (R-subscription)
  MSG_PENDING = 2;               // kernel-only first message of each settling array (R-wave); was MSG_DIRTY
  MSG_DATA = 3;                  // value delivery (payload required, non-SENTINEL)
  MSG_RESOLVED = 4;              // settles a pending node that sent nothing (R-wave)
  MSG_INVALIDATE = 5;            // clears the retained value (R-invalidation)
  MSG_COMPLETE = 6;              // clean end of the current instance (R-terminals)
  MSG_ERROR = 7;                 // error end of the current instance (payload required, non-SENTINEL)
  // TEARDOWN, PAUSE, RESUME and PULL were decided away by D797 (no upward channel,
  // no TEARDOWN; pause and demand are modules). Their numbers stay reserved.
  reserved 8, 9, 10, 11;
  reserved "MSG_DIRTY", "MSG_TEARDOWN", "MSG_PAUSE", "MSG_RESUME", "MSG_PULL";
}

// There is no Tier table and no Direction since D798 (2026-11-10): an array keeps the
// order its author wrote (R-wave), so nothing is sorted by class, and nothing travels
// up the graph (R-messages), so every wave goes toward sinks.

// One protocol message = the tuple [Type, Data?] (R-messages).
message Message {
  MessageType type = 1;
  // Present only for DATA / ERROR. Opaque codec-encoded value bytes — the value
  // type is per-language; the protocol never inspects it (R-messages). Absence
  // of `data` on a DATA/ERROR message is a violation; SENTINEL is never encoded.
  optional bytes data = 2;
  // lock_id (PAUSE/RESUME), pull_id and params (PULL) went with those types.
  reserved 3, 4, 5;
  reserved "lock_id", "pull_id", "params";
}

// One array of messages delivered in one call (R-wave). It keeps its written order:
// a terminal is last, DATA and RESOLVED never share it, and it is split at its last
// INVALIDATE before delivery.
message Wave {
  repeated Message messages = 1;
  reserved 2;
  reserved "direction";
}

// Dispatcher handle — pure data, no methods (R-handle / D7). A serializable index
// into a pool's dispatch table; snapshottable and wire-transferable. node != handle.
message Handle {
  uint64 pool_id = 1;
  uint64 handle_id = 2;
}

// ── Wire bridge envelope (D134 / D140 / D141) ──
// A bridge envelope is graph/application adapter data, not a protocol message and
// not a remote ordinary dependency. The local wave ends at the bridge boundary;
// remote receipt starts a later local wave in the owning graph.
message WireBridgeMetadata {
  uint64 seq = 1;
  uint64 cursor = 2;
  string idempotency_key = 3;
  uint32 attempt = 4;
  uint32 max_attempts = 5;
  optional uint64 timestamp_ms = 6;
  optional uint64 ack_for_seq = 7;
  optional string request_id = 8;
}

message WireBridgeStartPayload {}

message WireBridgeDataPayload {
  oneof body {
    // Opaque codec-encoded bridge DATA fact bytes. Runtime adapters validate that
    // raw Node/Ctx handles, live topology, functions, and mutable graph-owned state
    // do not cross this boundary (D141 / D496).
    bytes value = 1;
    // A wire edge group's cause (R-bridge) is a DATA-envelope payload, not a new
    // protocol message, remote ordinary dep, or distributed same-wave handle.
    WireEdgeCause edge_cause = 3;
  }
  // Field 2 carried the per-edge WireEdgeFrame until D803 (2026-11-11).
  reserved 2;
  reserved "wire_edge";
}

message WireBridgeErrorPayload {
  // Bridge error fact bytes. This is not a local protocol ERROR terminal.
  bytes error = 1;
}

message WireBridgeAckPayload {}

message WireBridgeNackPayload {
  // Nack/error fact bytes. Correlation stays in metadata.ack_for_seq.
  optional bytes error = 1;
}

message WireBridgeStatusPayload {
  bytes status = 1;
}

message WireBridgeClosePayload {
  optional bytes reason = 1;
}

message WireBridgeEnvelope {
  string session_id = 1;
  WireBridgeMetadata metadata = 2;

  // This oneof is the envelope tag. It intentionally avoids a second envelope
  // type enum that can disagree with the payload case.
  oneof payload {
    WireBridgeStartPayload start = 3;
    WireBridgeDataPayload data = 4;
    WireBridgeAckPayload ack = 5;
    WireBridgeNackPayload nack = 6;
    WireBridgeStatusPayload status = 7;
    WireBridgeErrorPayload error = 8;
    WireBridgeClosePayload close = 9;
  }
}

// ── Wire edge group cause (R-bridge; graphrefly:D803) ──
// One frame per cause. A cause is one wave of the sender graph: the group's outbound
// node ran once on its edges, and the frame carries, for each edge that brought input,
// what it brought: an INVALIDATE, then the arrays that carried DATA, in order, then its
// terminal. Each Wave here holds only DATA, INVALIDATE, COMPLETE and ERROR; PENDING,
// RESOLVED and START are each graph's kernel's own and never cross. DATA values and ERROR
// payloads are the application's bytes. `session` names one lifetime of the outbound
// node; `cause` counts from 1 within it, and the receiver's gate releases a session's
// causes in order and each at most once. Until D803 an edge travelled as its own
// WireEdgeFrame of kind PENDING (ex-DIRTY) or DATA; that message and WireEdgeKind are gone.
message WireEdgeCause {
  string group = 1;
  string session = 2;
  uint64 cause = 3;
  repeated WireEdgeArrays edges = 4;
}

message WireEdgeArrays {
  string edge_id = 1;
  repeated Wave arrays = 2;
}
