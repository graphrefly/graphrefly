P<<M for the append-heavy/occasionally-read niche the pull port exists to serve). demand-on-no-change delivers nothing (R-pull coalesce). (3) The snapshot node has NO persistent value of its own -- its fn reads the backend on demand, so the backend stays the single source of truth (no companion cache that can drift). (4) MUTATION INPUT = D54 A3 hybrid: imperative .append/.set/... (state-verb-legitimate, D4) call backend.mutate directly (no effect); the T|Node<T> widening wires an in-graph producer as a declared dep whose handler calls backend.mutate (an INPUT-side fold -- appends, does NOT build snapshots; orthogonal to the output ports). (5) SHARED CORE: an internal collectionCore<Backend> (NOT exported) provides {version-gated delta emit + the pull-snapshot node + the widening hook}; reactiveList/Map/Index/Log = core + their backend + typed method surface (D54 same-skeleton survey). SNAPSHOT-NODE TOPOLOGY (reactiveList /design-review 2026-05-31, impl guidance not a new D#): the DELTA stream is the structure's BACKBONE and the snapshot pull-node SNAP declares dep=[delta] -- each mutation's delta wave puts SNAP into quiet-absorb (R-pull keeps per-dep dirty/pending accounting while suppressing the downstream DIRTY), so demand-on-no-change coalesces to no-delivery FOR FREE via R-pull's own accounting (no imperative mark-dirty glue, no separate pending tracker), and SNAP->delta is a real protocol edge describe can show (D3). Consequence: delta is NOT an opt-in companion log (as in the frozen ref's mutationLog) but a mandatory structural port; an opt-in DELTA-LOG (retained history) MAY still layer on top. PER-STRUCTURE SPECIALIZATION (#3-#5 /design-review 2026-05-31, impl guidance not a new D#): reactiveMap -- (a) active-TTL is LAZY-ONLY first cut: expiry checked on read/prune + before snapshot materialization, NO background timer; active periodic sweep (interval-source composition, D52) is DEFERRED (backlog, no-silent-cap doc); (b) a read (get/has) that discovers an expired key prunes it but does NOT push -- under the lazy-pull snapshot model the pruning is reflected on the NEXT demand, which DISSOLVES the old core's spec-5.8 'read-as-observable-side-effect' emission (cleaner than the frozen ref); (c) delete-reason enum {expired|lru-evict|archived|explicit} RETAINED (delta-port semantics); (d) retention (score-archive) + LRU maxSize RETAINED -- archival is part of the atomic mutation (NOT a second wave / feedback cycle, D37/D45-aligned); LRU touch does not bump version (D60 version-gated emit covers it). reactiveIndex -- secondary lookup = Z (user): has/get/rangeByPrimary are SYNC point-reads over the backend's parallel Map (NOT topology, like .cache); byPrimary stays an OPTIONAL reactive derived over the ordered snapshot (D54 'byPrimary=derived') but LAZILY activated (no default keepalive -- live only while externally subscribed, R-rom-ram RAM), dispose releases it; the two coexist (derived = reactive reverse-lookup port, sync read = point query). reactiveLog -- (a) entries full-snapshot = lazy pull like the others, BUT view(tail/slice/fromCursor)/scan re-derive as INCREMENTAL derived deps on the DELTA backbone (tail/scan are inherently incremental -> natural fit; not on a pushed full array); (b) empty/never-set lastValue = SENTINEL (prevData===undefined), NOT the frozen ref's [[RESOLVED]]-for-empty dual-role (D49 narrowed RESOLVED to undirty-only); (c) append(undefined) throws -- reason updated to 'undefined is the substrate SENTINEL, not a valid DATA payload' (R-data-payload), not the retired hasLatest disambiguation; (d) attach(upstream) = the D54 Node<T> widening in log form = a declared input-fold dep (describe-visible), NOT the frozen ref's imperative upstream.subscribe; skipCachedReplay handles push-on-subscribe (feedback_subscribe_before_kick); (e) mergeReactiveLogs MUST-FIX: the frozen ref's internal logs[i].subscribe is a D45 island ('invisible in describe') -> re-derive as a DECLARED-DEP merge/concat combinator (deps=[...logs], partial), same class as D56's stratifyBranch island fix; (f) attachStorage = D57 (binding-layer observe-sink, async out of wave core), out of data-structure scope. SNAPSHOT MATERIALIZATION (per-language impl, D6/D24): first-cut default = defensive toArray() copy (safe, the pull read is O(n); matches the frozen-ref NativeListBackend.toArray [...buf]); an immutable/persistent backend (zero-copy O(1) pull of the read-only cache) is a pluggable ListBackend option, deferred. Per-language (D6/D24, never parity, no conformance -- the substrate pull is already C-16). Carries D54 dissolutions: equals removed (version-counter idempotency, D49), describeKind dropped, empty/never-set log = SENTINEL, index.byPrimary = derived over the ordered snapshot.","rationale":"The backend already accumulates deltas into a materialized state; re-deriving that state through an ACC node + effect duplicates an intrinsic cost for nothing -- the snapshot port should read the backend directly (user correction of the prior review's ACC/effect misdesign). Two ports (cheap delta watch + lazy O(n) snapshot-on-demand) is exactly the D55 STREAM+SNAPSHOT shape and exactly what R-pull/C-16 already implement: a large collection never push-fans the full array per change, and the snapshot is materialized only when a consumer actually pulls (P*O(n), not M*O(n)). Lazy is load-bearing: an eager companion state.set(copy) on every mutation re-imposes the per-change O(n) and strips the pull port of its only justification. The backend (a closure, not a node) carries durability structurally, so node ROM/RAM is moot. The Node<T> widening is an input-side append fold, unrelated to snapshot output -- correcting the prior review's conflation of the two. Shared core avoids 4 near-identical impls (D5/F-NO-WEDGE-CUT).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D61","layer":"L1.5","date":"2026-05-31","question":"CSP-2.8 reactiveCollection corrections after QA: must input folds be graph-bound/describe-visible, and should TTL materialized prune push a delta?","decision":"Two D60 sub-clauses are corrected/locked. (1) Reactive collection input folds MUST be graph-bound and describe-visible: any T|Node<T> widening / bindSource / attach-style input that causes an upstream Node to mutate the collection backend is a declared graph dependency, wired through a graph-owned factory/funnel (for example g.reactiveList(...) or reactiveList(...,{graph}) / equivalent per-language shape). It MUST NOT subscribe to a graph node internally from an invisible closure. This keeps D3/D39/D45 truthful: the input edge that drives backend mutation appears in describe() and uses the normal dispatcher + D30 throw-to-ERROR boundary. (2) TTL expiry materialized by get/has/prune/snapshot-prep is a real backend mutation and therefore emits the normal DELTA delete event with reason:'expired'. A read that only observes time without changing the backend emits nothing; a read/prune that deletes an expired entry changes backend version/content and MUST push the delete delta. This replaces D60's narrower 'read prune does NOT push' guidance. Active/background TTL sweep remains deferred; lazy expiry is still the first cut.","rationale":"QA found that an invisible bindSource would recreate the exact island D45 banned: topology affects behavior but describe cannot show it. Graph-bound input folds preserve the graph-first/narrow-waist model while keeping collectionCore internal and per-language (D6/D24). For TTL, the user's correction is decisive: if prune changes the backend, it is not merely a read; suppressing the delta leaves subscribers with a stale event view and makes the DELTA port incomplete. The accepted caveat is explicit: get/has can be observable only when they materialize expiry; this is a bounded GC-like mutation, not arbitrary read-as-side-effect. D60 otherwise remains intact: one backend, delta+pull snapshot ports, lazy snapshots, lazy-only TTL first cut.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D62","layer":"L2-Q23","date":"2026-05-31","question":"Should ctx.rewireNext requests queued by a node fn be discarded if the node becomes terminal in the same wave, or should terminal only guard downstream output while deferred topology still drains?","decision":"Terminal is an OUTPUT/LIFECYCLE guard, not a deferred-topology cancellation condition. A node that becomes terminal during its fn run still drains its already-queued ctx.rewireNext addDep/removeDep/setDeps requests at the committed wave boundary, in the same FIFO/order semantics as any other deferred rewire. The terminal status remains final: the node MUST NOT emit any post-terminal downstream DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR, non-resubscribable late subscribe remains rejected by R-terminal, and a resubscribable reset starts the next lifecycle from the node's current dep set after the drained topology changes. Immediate/external rewire of a terminal node remains rejected by R-rewire/C-8; this exception is only for self-triggered deferred rewire requests that were issued before terminal and apply at the boundary. This supersedes the D47/R-rewire-deferred sub-rule that terminal discarded the pending queue.","rationale":"The earlier terminal-discard rule was a conservative zombie-work guard: if addDep applied after COMPLETE, a dead node could subscribe to a new timer/inner and start upstream work even though no downstream output could legally escape. The user correction narrows the actual invariant: terminal must seal output, not freeze topology. Rewire expresses the author/agent's topology intent; if that intent includes a post-terminal cleanup removeDep (bufferTime interval teardown) or even an add/set, the substrate should apply it while preserving terminal-is-forever. This removes the need for a special owned-dep cleanup API and lets ordinary rewireNext.removeDep release helper-owned resources. Accepted cost: a mis-authored addDep after terminal can start upstream work that the terminal guard drops; this is a resource bug in that operator, not a wave-protocol violation. No message tier or ctx.up/down shape changes.","supersedes":["D47"],"status":"locked","session":"DS-1"},{"id":"D63","layer":"L2-Q22","date":"2026-05-31","question":"B47 / R-up-routing diamond: when a routed RESUME(pullId) broadcast reaches the same pullId-holder through multiple declared paths, should the holder fire once per path or once per routed demand wave?","decision":"A routed RESUME(pullId) is idempotent per holder per routed control wave. If a demander can reach the same pullId-holder through 2+ declared paths, the holder releases/fires at most once for that RESUME wave; later duplicate arrivals for the same pullId in the same routed wave are consumed silently and do not trigger another delivery. This tightens D59: the 1:1 pull delivery guarantee must be a routing guarantee, not merely an accidental consequence of quiet coalescing after the first delivery. Directed ctx.up(towardDep, msgs) remains the branch-pruning escape hatch; broadcast routing remains valid over DAGs.","rationale":"The D59 formal model only covered a tree. The TS implementation currently can invoke the holder once per path in a diamond, with the second delivery silent today because the first demand drains the pending value. That is observationally harmless for current reactiveList snapshots, but it leaves a latent semantic gap for any future multi-path pull consumer where the second fire could have side effects or consume a new pending state. Idempotence per holder per routed wave preserves graph-first inspectability, keeps RESUME as the demand (no new tier), and matches the existing one-delivery promise in R-pull.","supersedes":["D59"],"status":"locked","session":"DS-1"},{"id":"D64","layer":"L2-Q21","date":"2026-05-31","question":"B39 / terminal-or-invalidating dep releases dirty while the receiver is in resumeAll pause or an open batch: should the balancing undirty RESOLVED bypass normal pause/batch delivery or follow the normal delivery gates?","decision":"A substrate-synthesized undirty RESOLVED that balances a previously broadcast DIRTY follows normal delivery timing. In default pausable:true mode it may deliver immediately, matching D50's immediate default INVALIDATE behavior. Under pausable:'resumeAll' it is buffered and replayed on the final-lock RESUME. Inside an open batch it is deferred until the outermost batch commit. This applies to both terminal dirty-release (R-terminal-settles-dirty) and INVALIDATE dirty-clear arms; the implementation path should route the balancing RESOLVED through the same delivery machinery as other tier-3/4 settle slices rather than bare-sending to subscribers.","rationale":"The existing non-paused/non-batch behavior is correct and conformance-covered by C-15. The gap is only the cross-axis timing: bare subscriber emission bypasses resumeAll buffering and batch deferral, making the balancing RESOLVED observable on an uncommitted or paused view. Routing the undirty settle through the normal delivery path preserves default-mode immediacy while honoring R-pause-modes and R-wave-boundary. This is the terminal/undirty analogue of the D50 paused-INVALIDATE clarification, not a new message tier or API surface.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D65","layer":"L2-Q20","date":"2026-05-31","question":"B33 / TEARDOWN relay past a node's own terminal state: does terminal-is-forever block upstream TEARDOWN from crossing an already-COMPLETEd/ERRORed intermediate?","decision":"TEARDOWN is a destroy/unwire signal and may relay through an already-terminal intermediate. terminal-is-forever seals value/lifecycle output (DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR) and prevents resurrection, but it does not drop TEARDOWN needed by downstream bridge/resource subscribers. A non-terminal node receiving TEARDOWN still synthesizes COMPLETE before TEARDOWN when no COMPLETE/ERROR is already present. An already-terminal node relays TEARDOWN only; it does not emit another COMPLETE/ERROR, does not clear terminal, and does not accept post-terminal DATA.","rationale":"Wire/bridge unwire needs TEARDOWN to reach subscribers even if a firstValueFrom-style intermediate already completed. Dropping TEARDOWN at the terminal guard turns terminal-is-forever into a resource-leak hazard. The exception is narrow: TEARDOWN is not a value settle and does not resurrect the node; it is a destroy cascade. This keeps R-terminal intact for value output while pinning R-teardown-complete's terminal branch.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D66","layer":"L2-Q18","date":"2026-05-31","question":"B17 / async late ctx after rewire: when a deferred async invocation later calls ctx.up/down after the node's deps changed, should it route through the live dep set or the invocation-time dep snapshot?","decision":"Late async ctx emission uses the node's LIVE dep set at emission time. A ctx captured by an async pool callback represents the node as it exists now, not a hidden invocation-snapshot topology. If the node is rewired before the async callback calls ctx.up/ctx.down, upstream routing and downstream dep-index behavior observe the current deps/fn shape; removed deps are drained and no longer receive late ctx traffic, added deps are the live topology. Terminal output guards still apply, and stale async work that should not affect the node must be cancelled by the owning operator/source via ordinary lifecycle cleanup.","rationale":"Live-edge ctx matches current TS behavior and the graph-first inspection model: describe reads live deps, and adding a hidden invocation-snapshot edge would create topology that describe cannot show. It also matches the D42/D47 framing that rewire changes what the node is from the committed boundary onward. Snapshot ctx would be heavier, harder to inspect, and would keep removed deps semantically alive after topology says they were removed. Async remains outside the sync wave core; the callback re-enters through the normal live node boundary.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D67","layer":"L2-Q19","date":"2026-05-31","question":"B19 / rewire while batch has an uncommitted tier-3/4 slice: should rewire reject, apply before commit, or wait until the batch commits?","decision":"Batch commit precedes rewire application. If setDeps/addDep/removeDep is requested while an outer batch is open and the target node has an uncommitted batched settle slice, the rewire request is accepted but boundary-deferred: the outermost batch first commits the pending wave against the pre-rewire topology/fn shape; then queued rewire requests drain in FIFO order, each as a fresh boundary wave. This mirrors ctx.rewireNext's committed-boundary discipline: topology mutation never applies to an uncommitted view, and pending old-shape DATA is never committed against the new dep set. Immediate/external rewire outside a batch remains immediate between waves.","rationale":"The user correction rejects a special-case error for batch-open rewire. Deferring until after commit aligns external rewire with ctx.rewireNext: both express topology intent, both wait for a committed boundary when the current view is not safe to mutate, and both avoid applying a new topology to old pending wave data. Applying rewire before batch commit would create ghost semantics (old fn/deps producing into a new topology); rejecting would add an unnecessary exception. This is a precedence rule only, not a new API or message tier.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D68","layer":"L1.5","date":"2026-05-31","question":"For reactiveMap TTL/LRU/retention and recurring value|Node options, should policies remain backend-internal options or become graph-bound node-as-opt policies?","decision":"Reactive options that can affect backend mutation, pruning, eviction, or emitted deltas are node-as-opt policies. A static value is a constant policy configuration; a Node value is a declared dependency. reactiveMap TTL/LRU/retention policies are installed as graph-visible internal policy/apply nodes; public outputs remain delta and snapshot. Policy nodes may keep implementation state such as LRU order or TTL min-heaps, but all visible backend mutations flow through the map apply/delta path. No internal subscribe islands and no raw timers outside sanctioned sources.","rationale":"This generalizes D61 beyond bindSource: any reactive option that changes backend behavior must be inspectable and wave-ordered. It also prevents collectionCore from hardcoding cache-policy mechanics while preserving D60's single backend and delta/snapshot ports. Active TTL can use one policy node plus one timer source and a priority queue, so many TTL entries do not inflate topology.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D69","layer":"L1.5","date":"2026-06-01","question":"How may graph-layer helpers keep internal nodes active without recreating D45 subscribe islands, and must collection internals expose every implementation edge in describe()?","decision":"Graph-owned retain is the sanctioned internal activation shape. A helper may ask its owning Graph to retain an internal node and receives a disposer; ad-hoc closure-owned keepalive subscriptions remain banned. Retain is an activation/lifecycle root, not a public data edge. Helpers may keep internal wiring opaque when the public abstraction owns it (for example reactiveMap's intent/apply/backend path, like higher-order operator internals), but any external Node input or Node-valued option that affects backend mutation/pruning/eviction/deltas must be graph-local, wave-ordered, and owned by the same graph or rejected. Cross-graph in-process deps are rejected; cross-graph coupling goes through the wire bridge.","rationale":"This preserves D3/D39 graph-first inspectability at the abstraction boundary without forcing every helper to expose implementation-private wiring as public topology. It also gives D68 a non-island way to keep policy/apply paths hot: the graph owns activation and disposal. The same graph-local ownership check enforces D22/D32 for node-as-opt policies and input folds without adding a graph back-reference to the thin Node.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D70","layer":"L1.5","date":"2026-06-01","question":"What is the first internal implementation shape for graph-layer eviction, retention, and capacity policy plumbing after D68/D69, before exposing public policy factories?","decision":"Add a non-exported TS graph-layer policy helper module for collection eviction/retention/capacity mechanics. It may define internal `PolicyOpt<T> = T | Node<T>`, `PolicyInputs`/`PolicyReader` helpers for node-as-opt dependencies, key-order/deadline helpers such as LRU ordering and TTL deadlines, a shared `trimHeadOverflow` capacity helper, and a selection-only `selectRetentionVictims(scoredEntries, config)`. reactiveMap TTL/LRU plumbing should use the module without changing observable behavior, and reactiveLog head-trim capacity may share the capacity helper. Public policy factories, retention scorer callbacks, generic reactiveList/reactiveIndex maxSize, and retention-side backend mutation are explicitly out of this first slice; visible backend mutations and delta emission remain owned by each structure's apply/mutation path per D60/D61/D68/D69.","rationale":"D68/D69 lock the graph-visible node-as-opt policy shape and graph-owned retain boundary, but the TS implementation still has policy mechanics embedded in reactiveMap/log code. A small internal module keeps the repeated policy/capacity mechanics single-sourced without freezing a public API or moving mutation ownership out of the structures. Selection-only retention keeps the future scorer surface testable while preserving the current no-public-retention-factories boundary.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D71","layer":"L6 sequencing","date":"2026-06-01","question":"May Rust act as the pre-1.0 proving ground for B49 centralized wave bookkeeping / thin Node view, and what does that imply for D32?","decision":"Rust may run a pre-1.0 B49 probe and, if the probes show clear performance, memory, or profiling wins without observable protocol drift, the Rust arm may land B49 before the original post-1.0 timing. The probe must compare the current per-node bookkeeping against a GraphCore/PropagationEngine-style arena/CSR/sparse-frontier design for DIRTY/INVALIDATE traversal, diamond pending resolution, rewire churn, subscriber fanout, cache locality, and retained heap. This decision changes B49 sequencing only: D32 remains locked. Other language packages remain self-contained clean-slate packages, and cross-language coupling remains the coarse wire bridge unless a separate future decision explicitly reopens D32.","rationale":"B49's risk is implementation architecture and performance, not a desired protocol change. Rust is the best early proving ground because its conformance arm is already largely green and its ownership model makes arena bookkeeping pressure visible. Advancing Rust lets the project learn before 1.0 without blocking TS's D40/D41 intent-migration work. The guardrail is explicit: if the experiment changes wave ordering, ctx.depRecords semantics, describe/GraphSpec observability, or any conformance-observable behavior, it must route through design/spec before landing. The user's proposed native-to-Rust language strategy is intentionally not locked here because it would supersede D32 and needs its own design review after B49 data exists.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D72","layer":"L1.5","date":"2026-06-01","question":"After D70, how should TS expose public collection policy surfaces for retention, capacity, and node-as-opt policy composition?","decision":"Expose structure-owned public policy options first, not standalone exported policy factory symbols. reactiveMap may add retention as an options-level policy with a static scorer callback and value-or-Node retention.maxSize; visible backend mutations flow through reactiveMap.apply and emit delete{reason:'archived'} deltas. reactiveList may add maxSize as a value-or-Node head-trim capacity option. reactiveIndex maxSize is deferred until its eviction order is separately locked, because primary/secondary/LRU order are not equivalent. Standalone public policy factories remain deferred until two structures need the same exported user-facing policy object shape.","rationale":"This extends D68/D69 without violating D70's boundary. Mutation ownership stays with each structure's apply/mutation path, so D60's single backend and delta ownership remain intact; Node-valued numeric options remain graph-local declared deps; retention scorer callbacks stay static local functions and do not become invisible subscribe islands or function-valued DATA. Deferring standalone factories avoids freezing an abstraction before at least two public consumers prove the shape.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D73","layer":"L1.5","date":"2026-06-01","question":"How should reactiveIndex expose maxSize when eviction order can be secondary/primary/LRU?","decision":"reactiveIndex capacity is an explicit policy object, not a bare maxSize number: capacity.{maxSize,order}. order is required and selects eviction semantics (secondary | primary | lru). maxSize may be value-or-Node under the D68 node-as-opt model, and capacity-driven backend mutations emit normal index deltas through the structure-owned mutation path. No implicit default eviction order is introduced.","rationale":"D72 deferred reactiveIndex maxSize because primary/secondary/LRU are not equivalent. Requiring explicit order prevents hidden behavior, preserves explainability, and keeps the API forward-compatible. It aligns with D68/D69: policy options that affect backend mutation are declared/inspectable and remain structure-owned.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D74","layer":"L3","date":"2026-06-01","question":"CSP-2.8 TS storage first-cut: what public surface should clean-slate expose without inheriting the frozen attachSnapshotStorage/tier stack?","decision":"The first public @graphrefly/ts storage surface is a graph-layer binding helper over Graph.observe() read-only egress, not a substrate primitive and not a full Graph.attachSnapshotStorage port. The first cut exposes observe/event-log attachment only; snapshot checkpoints, WAL/content-addressed tier taxonomies, hydration/restore, and any Graph method alias are deferred until a real consumer forces that contract. Async durability work remains adapter-owned and outside the sync wave core.","rationale":"This matches D57's binding-layer ruling and F-SYNC-CORE: persistence integrates through the D39 observe egress, while async durability stays outside the synchronous wave core. It also avoids prematurely freezing the old monolithic attachSnapshotStorage/tier stack into clean-slate TS before snapshot/restore semantics are re-derived. An observe-sink first cut keeps topology truthful, reuses existing graph-layer inspection patterns, and leaves room for a later thin Graph convenience alias if a real consumer proves it worthwhile.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D75","layer":"L3","date":"2026-06-01","question":"For the D74 TS observe-sink first-cut, what control surface should flush/rollback/dispose use without introducing raw Promise-owned barriers into GraphReFly?","decision":"The first public observe-sink handle uses done-only callbacks, not Promise-returning barriers and not callback error channels: `flush(done?)`, `rollback(done?)`, and `dispose(done?)`. The helper still serializes writes and lifecycle hooks in observe order; any mapper/write/hook failure routes through `onError`, while the optional done callback is a pure completion notification that fires once after the queued work for that control call settles, regardless of success or failure. `dispose(done?)` first stops further observe intake, then drains already-queued work and the adapter `dispose` hook before calling done. `rollback` remains adapter-owned best-effort only, not a graph/batch rollback guarantee.","rationale":"This keeps D74's binding helper small and graph-layer only: the control surface expresses queue-drain completion without freezing a richer durability contract or adding raw Promise construction inside GraphReFly. Reusing callbacks matches the project's existing callback-heavy control style, keeps `onError` as the single error channel, and avoids inventing a pseudo-transaction/result API before snapshot/WAL/hydration semantics are designed.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D76","layer":"L6 sequencing / TS implementation architecture","date":"2026-06-02","question":"May @graphrefly/ts adopt B49 centralized wave bookkeeping / thin Node view during the current TS migration, now that the Rust B49 probe validated feasibility and narrowed the losing paths?","decision":"TS may adopt B49 during the current migration as an internal implementation-architecture migration, using the Rust D71/B49 work as feasibility evidence but not as a structural parity requirement. The TS package remains self-contained per D32: no Rust substrate dependency, no in-process native peer, and no reopened TS-on-Rust strategy. The migration target is a JS/TS-native GraphCore/PropagationEngine-style shape: Node becomes a stable public view/handle over graph-local slots or side tables; dep-record bookkeeping, dirty/pending/terminal dep-slot state, own output state, pause/batch/deferred-boundary sidecars, subscriber lists, and rewire queues may move behind the graph-local core if doing so avoids double bookkeeping and preserves the public API. Rust shapes are reference evidence, not a mandatory layout. ctx.depRecords remains a logical per-wave contract, not an object-identity guarantee. This is not a protocol change and needs no spec-amend while observable behavior is preserved. If the migration changes wave ordering, DIRTY-before-DATA, diamond pending resolution, batch boundaries, PAUSE/RESUME timing, terminal/teardown semantics, ctx.depRecords timing/contents, describe/GraphSpec observability, or any conformance-observable behavior, halt and route through design/spec before landing.","rationale":"D71 proved B49 is primarily implementation architecture/performance risk, and the Rust slices preserved conformance while exposing useful migration hazards: centralize ownership progressively, keep public handles stable, drop sidecar closures borrow-free, rollback partial activation/rewire work, avoid double-write designs, and reject partial frontier/adjacency rewrites that layer a second source of truth over the old subscriber cascade (B50-B52). The current TS migration is the right window because node.ts still concentrates wave state and graph-layer work is already moving toward graph-owned retain/policy boundaries. Advancing TS now reduces later churn and aligns the implementation with R-node-thin/D5 without changing D24 behavioral parity or D32 self-contained packages. F-PERF is guarded by TS-local test/bench checks rather than importing Rust numbers: V8 object/array layout, hidden classes, and GC pressure differ from Rust arenas. Design-review Q5-Q9 recommendation: choose a staged internal GraphCore side-table migration over a full PropagationEngine rewrite or no-op delay; keep the first slices behavior-preserving and conformance-gated, and defer full centralized adjacency/frontier transport unless TS-local measurements show a real non-linear traversal or retained-memory problem.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D77","layer":"L1.11","date":"2026-06-02","question":"What is the raw ctx dep-input value surface: keep latest/prevData aliases, or expose one canonical two-dimensional wave structure?","decision":"Raw ctx exposes exactly one dep-value input surface: `ctx.waveData`. `waveData[i]` is a list of wave projections delivered by dep i to the current fn invocation; each inner list corresponds to exactly one upstream msgs array / wave (D8). No wave delivered for dep i is `waveData[i] = []`. A RESOLVED-only wave is an inner empty list: `waveData[i] = [[]]`. DATA payloads are stored directly in the inner wave list, in order. INVALIDATE is represented in the inner list by the protocol SENTINEL marker (TS `undefined`, Rust/Py sentinel equivalent); DATA(SENTINEL) is already illegal, so this cannot collide with a legal DATA payload. Examples: `[[DATA,1],[DATA,2],[INVALIDATE]] -> [[1,2,SENTINEL]]`; DATA null -> `[[null]]`; DATA [] -> `[[[]]]`; DATA null then DATA [] in two waves -> `[[null],[[]]]`. COMPLETE/ERROR terminal information is not written into waveData because terminal is not value data; raw ctx keeps separate `ctx.terminal[i]` metadata for the same invocation: false = no COMPLETE/ERROR, true = COMPLETE, error payload = ERROR. Raw ctx does NOT store `latest`, `prevData`, `latestData`, or any parallel dep-value alias. Any ergonomic current/latest/track helper is a pure derived read from `waveData` plus implementation-owned dep cache, not a second source of truth.","rationale":"The prior authority text mixed `depRecords.latest`, `prevData`, and later `depRecords.batch`, which recreated the exact ambiguity the clean-slate floor tries to avoid. D49 makes occurrence fidelity load-bearing and D53 relies on the fn being able to tell which deps delivered waves. A single two-dimensional waveData structure preserves no-wave vs RESOLVED/no-occurrence vs sentinel-clearing INVALIDATE vs DATA payloads (including null and `[]`) without letting implementations drift into duplicate raw ctx value fields. Keeping terminal separate avoids treating COMPLETE/ERROR as values while still letting terminal dirty-clear logic distinguish no terminal vs COMPLETE vs ERROR. This is a ctx contract cleanup, not a new tier or wave-ordering change.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D78","layer":"L1.11","date":"2026-06-02","question":"What is the ERROR payload domain, and can D77 keep the false/true/error-payload terminal metadata shorthand without collisions?","decision":"ERROR requires an explicit payload, but the payload domain excludes the protocol SENTINEL and booleans. In TS terms, `[[ERROR, undefined]]`, `[[ERROR, false]]`, and `[[ERROR, true]]` are invalid protocol waves at the dispatch boundary. Binding/source adapters that receive undefined or boolean host-language failures (for example Promise.reject(false) or throw undefined) must coerce them to a real diagnostic payload such as Error before emitting ERROR. Therefore D77 terminal metadata keeps the lightweight shorthand: `ctx.terminal[i] === false` means no COMPLETE/ERROR for this invocation, `true` means COMPLETE, and any non-boolean non-SENTINEL ERROR payload means ERROR. COMPLETE/ERROR still never enter `ctx.waveData`; terminal remains separate metadata, not a value source.","rationale":"D77 used false/true/error-payload terminal metadata. That shape is only ambiguous if ERROR payloads may be boolean. The intended protocol was never bare ERROR, and the clean shape is to make ERROR payloads diagnostic rather than arbitrary booleans. Excluding booleans preserves the cheap terminal metadata representation, avoids per-slot tagged objects in TS, maps naturally to Rust/Py terminal enums internally, and still keeps all ERROR waves explicit and non-SENTINEL.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D79","layer":"L1.5 / Rust graph-layer implementation architecture","date":"2026-06-02","question":"In the Rust clean-slate graph/profile slice, should profile-enabled Graph nodes register through the process default dispatcher, or should Graph own/inject the dispatcher used by its graph-owned nodes?","decision":"Use graph-bound dispatcher injection, aligned with the TS shape. A Rust clean-slate Graph binds exactly one Dispatcher at construction; callers may inject one, otherwise the Graph binds the thread-local default dispatcher (D21/D26). Every graph-owned factory path (state, producer, node, derived, effect, init_node/operator) registers node fns through that bound dispatcher. Bare substrate Node constructors also default to the default dispatcher unless their own explicit dispatcher path is used. Graph profile recording toggles and reads the bound dispatcher, while profile() remains graph-scoped by summing only the Graph's registered entries (and mounted subgraph entries via each child Graph's own bound dispatcher), not dispatcher-global totals. Profiling isolation is explicit: pass a dedicated Dispatcher when a graph must not share default-dispatcher recorder state.","rationale":"This is option C from design-review, corrected to preserve D21/D26's default-dispatcher semantics and align with @graphrefly/ts. The architectural lock is the ownership/injection route: graph-owned nodes must register through the Graph's bound dispatcher, and profile reads that same bound dispatcher. The isolation boundary is therefore explicit dispatcher injection, not a silent private dispatcher default. Option A's bug was not that the default dispatcher exists, but that graph-owned nodes/profile could ignore the Graph-bound dispatcher and accidentally read or write the wrong owner. Option B (filtering a wrongly-owned/default-only profile read) still leaves registration ownership wrong. The corrected option C keeps D5/R-node-thin because counters stay in the dispatcher, preserves D26's only global singleton, supports multi-tenant/sandbox isolation via explicit dedicated dispatchers, and changes no wave-protocol behavior, ctx contract, or conformance-observable ordering.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D80","layer":"L1.5","date":"2026-06-02","question":"Should recurring collection retention/eviction/capacity shapes become a general public API?","decision":"Expose a small public policy vocabulary/type layer, not a generic public eviction engine. Shared public shapes may include ReactiveOpt<T>, CapacityPolicy<Order>, RetentionPolicy<Entry>, and static ViewCachePolicy. Each reactive structure still owns backend mutation, victim application, delta emission, delete/archive reason, graph-bound node-as-opt wiring, and graph-owned retain. Standalone public policy factories and imperative release/keepalive APIs remain deferred until two or more structures need the same runtime policy object, not merely the same type vocabulary.","rationale":"TS now has repeated policy callsites across reactiveMap, reactiveList, reactiveIndex, reactiveLog, and view memo caches. The shared part is the option vocabulary and node-as-opt plumbing; the non-shared part is mutation semantics. Keeping mutation ownership in each structure preserves D60/D61/D68/D69 while reducing public type drift and avoiding a premature engine abstraction.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D81","layer":"L1.5","date":"2026-06-03","question":"For TS higher-order *Map operators, should source ERROR / inner ERROR / projector ERROR leave sibling inners subscribed, complete/error sibling sources, or detach live inner deps before terminal ERROR?","decision":"TS *Map operators detach all live inner deps on terminal ERROR. Source ERROR, inner ERROR, or projector failure are operator-terminal error edges; the operator queues ctx.rewireNext.removeDep for every currently-live runtime-added inner, clears its inner tracking state, then emits [[ERROR,e]]. The queued removals drain after terminal via D62, so terminal seals downstream output while still releasing the operator's subscription to helper-owned upstream work. The operator does not send COMPLETE or ERROR to inner sources, does not affect an inner's other subscribers, and does not introduce public cancel/release/keepalive APIs or a cancelSiblingsOnError option in this first lock. Source COMPLETE is unchanged: *Map waits for live inners to complete normally and only emits COMPLETE when the source is done and no inner is live/pending.","rationale":"Leaving runtime inners subscribed after operator-terminal ERROR is a resource-lifecycle leak: downstream output is sealed, but timers, async iterators, fetch/LLM streams, sockets, and other onDeactivation-backed sources may keep working solely because the terminal *Map still holds deps. D47's load-bearing reason for removeDep is exactly this distinction: read-gating masks output, while removeDep->_deactivate->onDeactivation can stop abandoned upstream work. D62 already permits queued cleanup removals to drain after terminal, so this is a graph-layer operator policy, not a protocol change. Detaching deps preserves graph-first inspectability because describe() after cleanup reflects no live inner deps, while avoiding global source termination and public API churn.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D82","layer":"L3","date":"2026-06-03","question":"B55 TS storage completeness should re-derive the frozen pure-ts storage stack as one full snapshot/WAL/hydration port, or split storage binding APIs from graph restore semantics?","decision":"Split B55 into storage-binding completion and restore/hydration gates. The next @graphrefly/ts storage expansion may add binding-layer storage vocabulary and helpers: bytes backend, codecs, KV/append-log tiers, environment backends, content-addressed KV helpers, diff/change codecs, and observe-event WAL/event-log sinks built on attachObserveSink. These APIs remain per-language, adapter-owned, async outside the sync wave core, and do not add Graph methods or mutate topology. Graph snapshot checkpoints, hydration/restore, factory-name replay, incremental restore semantics, and content-addressed graph snapshots require a separate design/spec gate before implementation. Reactive cascading-cache is also a separate graph-layer design item because it creates/drives nodes rather than being a passive storage adapter.","rationale":"D57 already classifies storage as binding-layer and D74 deliberately limited the first TS cut to observe-sink egress. Re-deriving backend/codec/KV/log/content-addressed/diff helpers preserves the useful frozen pure-ts storage knowledge without smuggling old attachSnapshotStorage/restoreSnapshot semantics back into clean-slate. Diff/event-log storage is foundational for real-time observe: it gives observers and external systems durable, replayable facts about what changed without pretending that the same layer defines graph restoration. Snapshot/restore touches R-snapshot/R-restore and lifecycle semantics, so it must not be silently frozen through a storage convenience API. The split keeps topology inspectable, async out of the sync core, and lets B55 close the deletion-risk knowledge gap while leaving graph restore as an explicit later decision.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D83","layer":"L3","date":"2026-06-03","question":"How should Graph snapshot, hydration, and restore be specified now that D82 split storage binding APIs from graph restore semantics?","decision":"Snapshot/restore is a graph lifecycle protocol surface, distinct from storage tiers and WAL envelopes. A graph snapshot checkpoint captures the graph's live inspectable topology (the same live-deps/mount path truth source as describe), each restorable node's factory reference/name, cache/value state including SENTINEL absence, terminal/lifecycle state when represented, and ALL node-private ctx.state regardless of ctx.state.persist flags. Function bodies are never serialized; restore re-resolves factories through the dispatcher/graph factory registry. Anonymous or unregistered inline functions are marked local-only in the snapshot and cannot restore cross-process; missing factory references fail restore honestly rather than falling back to a placeholder. Hydration/restore performs async I/O and decode outside the sync wave core, then commits the resolved checkpoint at a graph boundary as one bootstrap/batch restore transaction. Restore is not a fresh-lifecycle transition: it MUST NOT wipe ctx.state, reset restored caches to SENTINEL, re-arm first-run as if never run, or fire fresh lifecycle cleanup hooks merely because the graph was restored. Restored cached values participate in normal push-on-subscribe after the graph is ready. Incremental restore/diff replay, when supported, applies changes through the normal graph boundary/wave machinery rather than mutating live graph state invisibly. Storage tiers, WAL frame shape, codecs, content addressing, and durability policy remain presentation/binding-layer APIs governed by D82, not substrate rules.","rationale":"D25 already fixed the factory-name snapshot model and DS-1 flagged restore-vs-fresh-lifecycle as a spec gap. D57 placed hydration's async work outside the sync core and D82 separated storage substrate from graph restore semantics. The missing lock is the observable restore lifecycle contract: a restored graph must resume from the checkpointed graph state, not behave like a resubscribable fresh lifecycle that wiped ctx.state and caches. Factory-name resolution keeps function serialization honest and graph-first inspectability intact; local-only labeling prevents silent cross-process lies. Committing restoration at a graph boundary preserves F-SYNC-CORE and keeps live observers/diff consumers ordered by the normal wave/observe path while avoiding storage-envelope decisions in the protocol layer.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D84","layer":"L3","date":"2026-06-03","question":"For D82 storage interoperability, how should timestamp metadata, strict JSON codecs, and append-log multi-writer semantics be shaped before Rust/Python storage consumers land?","decision":"D82 storage frames use a cross-runtime storage timestamp scalar, not JS unsafe numeric nanoseconds: `t_ns` is a decimal integer string (`StorageTimestampNs`) representing nanosecond-unit wall-clock metadata, with TS `nowNs()` returning `(BigInt(Date.now()) * 1_000_000n).toString()`. This is storage metadata only, not graph-local protocol time. Strict canonical JSON is a separate codec surface (`strictJsonCodecFor` / `strictJsonCodec`) rather than a behavior change to the existing permissive `jsonCodecFor`; strict-v1 must use fatal UTF-8 decode, require the decoded value to pass `stableJsonString`, and require canonical re-encode byte equality. Duplicate-key rejection is desirable but may land as strict-v2 if it requires a scanner/parser. Append-log multi-writer support requires explicit backend capability, not hidden best-effort behavior over plain KV: no-CAS KV logs remain single-writer, while multi-writer append logs require a passive backend primitive such as `putIfAbsent`/CAS and scenarios proving unique per-prefix sequence allocation under competing writers. Observe-event logs remain D82 durable fact streams for audit/projection/external replay; they do not define graph restore. Graph restore remains D83 checkpoint lifecycle over topology/factory/cache/SENTINEL/terminal/ctx.state, committed at graph boundary.","rationale":"D82 deliberately owns storage vocabulary, codecs, KV/log tiers, content addressing, and event-log sinks, while D83 owns graph snapshot/restore lifecycle. JS numeric nanoseconds exceed `Number.MAX_SAFE_INTEGER`, which is unsafe for cross-runtime JSON and Rust/Python readers. A separate strict codec preserves current permissive JSON compatibility while creating a canonical byte surface for shared storage. Multi-writer append logs cannot be made correct over plain list+set KV because concurrent writers can allocate the same seq; correctness needs an explicit backend atomicity capability. Keeping observe-event replay separate from graph restore prevents storage facts from smuggling in D83 lifecycle semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D85","layer":"L3","date":"2026-06-03","question":"How should D84 append-log multi-writer support enter storage without pretending plain KV is atomic?","decision":"Add an explicit passive conditional-create capability (`putIfAbsent`) at the byte backend / typed KV layer and a separate multi-writer append-log helper that allocates sequence keys by retrying conditional creates. Existing plain KV append logs remain single-writer and must not claim multi-writer correctness. No Graph restore, WAL replay, or wave protocol behavior is introduced.","rationale":"D84 requires explicit backend atomicity for multi-writer append logs. Conditional create is the smallest capability that prevents sequence-slot collisions while preserving the current append-log key ordering and keeping storage interop in the D82 binding layer. General compare-and-set, locks/leases, transaction protocols, and tail-pointer WAL schemes are deferred until a backend or consumer needs them.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D86","layer":"L3","date":"2026-06-03","question":"What public API shape should implement D83 graph checkpoint/restore without re-coupling it to storage tiers?","decision":"Expose graph checkpoint/restore as a graph lifecycle surface: `Graph#checkpoint()` captures a restorable checkpoint from the graph's live topology/state, and `restoreGraph(checkpoint,{registry,graph?})` constructs a fresh graph from an already-loaded checkpoint using an explicit factory registry. Storage loading/decoding remains outside this API; old `attachSnapshotStorage`/`restoreSnapshot` storage-shaped methods remain absent. The first implementation supports fresh-graph restore only; live incremental restore/diff replay remains deferred.","rationale":"D83 makes snapshot/restore graph lifecycle protocol, while D82 keeps storage tiers/WAL/codecs separate. `checkpoint()` belongs on Graph because Graph owns live topology, ids, mounts, and inspection; `restoreGraph` is a free constructor-like helper because no partially restored graph should leak during hydration. An explicit registry keeps function serialization honest and lets anonymous/unregistered inline functions fail as local-only. Deferring live incremental restore avoids silently freezing hidden mutation semantics beyond C-24's first runtime arm.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D87","layer":"L3","date":"2026-06-03","question":"Should strict canonical JSON duplicate-key rejection land as an additive v2 codec or upgrade the existing strict JSON codec surface now?","decision":"Upgrade the existing strict canonical JSON surface in place: `strictJsonCodecFor<T>()` and `strictJsonCodec` become the strict-v2 contract, preserving all D84 strict-v1 guarantees while adding explicit duplicate object-key rejection before JSON.parse's last-wins behavior. The duplicate-key check uses a small JSON-aware scanner that tracks object member keys per object frame, unescapes key strings for comparison so escaped-equivalent keys collide, and checks nested objects including objects inside arrays. `jsonCodecFor` remains permissive. No separate `strictJsonCodecV2` export is added unless a later consumer needs versioned coexistence.","rationale":"The clean-slate branch has no external compatibility burden yet, so keeping both v1 and v2 strict surfaces would preserve an intentionally incomplete residual for little value. D84 already identified duplicate-key rejection as the desired strict-v2 completion, and upgrading the existing strict codec makes the canonical storage contract simpler for Rust/Python interop: strict means fatal UTF-8, lossless stable JSON values, canonical bytes, and no ambiguous duplicate object members. A JSON-aware scanner is dependency-free and keeps the change in the D82 storage codec layer without changing graph restore, WAL replay, or wave protocol behavior.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D88","layer":"L3","date":"2026-06-03","question":"How should BigInt-backed numeric metadata generalize across storage JSON without relying on unsafe JS numbers or implicit BigInt JSON encoding?","decision":"Introduce a shared storage decimal-integer scalar vocabulary: canonical decimal integer strings are the wire/storage representation for integers that may exceed JavaScript safe-number range, while `bigint` is only the TypeScript in-memory computation form. Provide reusable decimal-string validation and BigInt conversion helpers, with a non-negative specialization used by `StorageTimestampNs`; `nowNs()` continues to compute with BigInt and returns the canonical decimal string. `stableJsonString`, `jsonCodecFor`, and `strictJsonCodec` must not implicitly encode BigInt values; callers convert BigInt to the decimal scalar explicitly. Domain aliases such as `StorageTimestampNs` reuse the shared scalar helpers instead of owning private regexes.","rationale":"D84 already made `t_ns` a decimal integer string because JSON numbers cannot safely carry nanosecond timestamps across TS/Rust/Python. Generalizing that scalar avoids repeated ad hoc regexes for future storage metadata while keeping JSON canonicality honest: JSON stores strings, not host-language BigInt objects. Explicit conversion makes lossy boundaries visible, preserves strict canonical JSON as a language-neutral byte contract, and keeps the change in the D82 storage binding layer rather than changing graph restore or wave protocol behavior.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D89","layer":"L3","date":"2026-06-03","question":"After D85 putIfAbsent, how should multi-writer append-log maintenance and real backend capabilities evolve without overclaiming atomicity?","decision":"Keep storage backend capabilities narrow, passive, and method-shaped. `putIfAbsent` remains the only multi-writer append allocation capability for now. A multi-writer append log must not expose list+delete truncation or retention as multi-writer-safe. Compaction/truncation/retention require a separate explicit backend capability or remain unsupported on the multi-writer helper. Do not introduce general CAS, locks, leases, transactions, or a broad capabilities registry until a concrete backend or consumer needs that exact capability.","rationale":"D85 only makes sequence-slot creation safe; it does not make deletion, range mutation, compaction, or retention atomic. Narrow method-shaped capabilities avoid hidden best-effort behavior while keeping storage in the D82 binding layer and outside graph restore/wave protocol. A broad capability registry would duplicate methods and invite drift, while general CAS/locks/transactions are premature.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D90","layer":"L3","date":"2026-06-03","question":"What concrete public checkpoint data shape should `Graph#checkpoint()` and `restoreGraph` use before a dual in-memory/persisted checkpoint surface exists?","decision":"Use a strict-JSON-compatible public checkpoint data shape first. `Graph#checkpoint()` produces a versioned, restorable checkpoint whose topology, factory references, cache state, terminal state when represented, mounts, and node-private ctx.state are all encoded as strict JSON-compatible data with explicit discriminants for SENTINEL-vs-DATA and terminal state. Non-encodable cache values, ctx.state values, terminal payloads, or factory references must fail honestly or be explicitly marked local-only/non-restorable; they must not be silently dropped, coerced, or restored as placeholders. A future dual-surface design may add a same-process host-value checkpoint shape, but that is deferred.","rationale":"D83/D86 make checkpoint/restore graph lifecycle while D82 keeps storage codecs separate. For the first public checkpoint surface, pre-1.0 strict JSON is the simplest cross-process contract and avoids an immediate second in-memory-only shape. The load-bearing constraint is honesty: D83's all-state preservation is satisfied only when every captured field is encoded, and unencodable state must make the checkpoint non-restorable rather than partially captured. Explicit discriminants avoid omission-based SENTINEL ambiguity and preserve factory/local-only failure semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D91","layer":"L3","date":"2026-06-03","question":"How should cascading cache enter clean-slate TS without becoming passive storage or an imperative cache object?","decision":"Cascading cache is a graph-layer reactive read-through cache factory, not a passive storage helper and not an imperative `getOrLoad` object. Requests, keys, and reactive policies are declared graph dependencies; cache hits, misses, fills, invalidations, and visible cache state changes flow through graph nodes. Async storage/fetch work lives at source/pool boundaries, and passive storage helpers remain backing adapters only. The first cut should favor a small request-node to value/status-node factory with lazy entry creation and explicit retention policy, not standalone public policy engines or hidden subscribe islands.","rationale":"D82 separates cascading cache from passive storage because it creates/drives nodes. D57 confines async I/O outside the sync wave core, while D68/D80 establish node-as-opt policy precedent. A graph-layer factory keeps topology inspectable, avoids imperative trigger APIs, and lets cache policy/miss behavior compose through declared deps without changing wave protocol.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D92","layer":"L3","date":"2026-06-03","question":"How should observe-event logs be consumed without turning them into graph restore input or an official projection semantics?","decision":"Expose observe-event log consumption as ordered storage-level iteration only. Users may transform or fold iterated `ObserveEventFrame` records into their own external read models, audit views, exports, or projections, but GraphReFly does not provide an official projection/fold helper in the first cut. Iteration must not mutate a graph, reconstruct graph lifecycle state, or be named/treated as restore. A graph-facing wrapper over projected output requires a separate graph-layer design, and replaying observe logs into graph state requires a new restore/spec decision.","rationale":"D84 states observe-event logs are durable fact streams for audit/projection/external replay, not restore input; D83/R-restore define restore from checkpoints. Ordered iteration is the shared primitive all consumers need, while projection/fold logic is domain-specific (path selection, DATA/ERROR/COMPLETE interpretation, stream merging, and materialized-view semantics vary by user). Keeping projection user-owned preserves the D82/D83 boundary and avoids freezing a premature official read-model semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D93","layer":"L3","date":"2026-06-03","question":"Should storage checkpoint durability failures roll back graph wave/batch commits, and should clean-slate expose a shared imperative mutation rollback framework?","decision":"Storage checkpoint durability failures do not roll back graph wave or batch commits by default. Durable checkpoint workflows should be modeled as reactive durable-result gates: a node or source requests checkpoint/persistence work at an async boundary, then emits an explicit success fact, failure diagnostic, retry signal, or compensation path. A storage write failure may prevent a downstream success node from advancing, but it does not retroactively undo already-committed graph state. Graph/batch rollback continues to cover only in-band reactive emissions in the current wave/batch; it does not promise to roll back closure-state mutations, backend mutations, or external side effects. Structure-owned imperative mutations may use local preflight, inverse, or compensation helpers where needed, but GraphReFly does not add a public shared `up/down` inverse-mutation framework in the first cut. Any future design that makes storage durability a graph commit barrier, or makes storage failure roll back wave/batch state, requires a protocol spec amendment first.","rationale":"D12/R-wave-boundary keep graph batch commit synchronous and wave-local, while D57/D82 keep storage I/O async and binding-layer/passive. Pulling storage durability into graph commit would create a new protocol-level durability barrier and change observable batch/restore ordering, so it cannot be introduced as a storage helper. The useful old pure-ts imperative-audit lesson is narrower: validate/freeze inputs, emit audit/delta facts, and keep failure facts visible, while admitting that ordinary JS/host closure mutations and external side effects are not automatically reversible. Structure-owned mutation paths already fit D60/D68/D80 better than a premature generic rollback engine.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D94","layer":"L3","date":"2026-06-03","question":"How should the first TS restoreGraph implementation resolve factories and commit restored node state without re-coupling graph restore to storage or exposing node internals?","decision":"Implement fresh-graph restore with an explicit descriptor registry keyed by checkpoint factory refs. A registry descriptor constructs graph-registered nodes from resolved deps and checkpoint metadata, but does not write runtime cache/terminal/ctx.state itself. restoreGraph first validates the entire already-loaded checkpoint, rejects local-only/missing factories and graph? live-restore attempts, constructs the fresh topology, then performs a single internal restore commit that installs checkpointed runtime state directly into graph-owned nodes before returning the ready graph. This commit is not represented as an input node, node-as-opt, public hook, or protocol wave; node-as-opt applies only to factory options that were actual graph dependencies or static factory config, not to restored cache/terminal/ctx.state. No storage loading/writing, observe-event replay, live incremental restore, or durability barrier is introduced.","rationale":"D83/D86 make restore a graph lifecycle constructor over already-loaded checkpoint data, while D82 keeps storage bindings separate. A descriptor registry keeps function serialization honest and lets factory reconstruction remain explicit without exposing Node restore mutators as public API. Separating topology construction from internal state commit preserves R-restore's no-fresh-lifecycle-wipe requirement, prevents partial restored state from leaking before restoreGraph returns, and avoids misrepresenting restored runtime state as reactive input topology.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D95","layer":"L3","date":"2026-06-03","question":"How should checkpoint factory metadata support configured/restorable factories without serializing closures or turning static config into fake graph inputs?","decision":"Extend the public strict-JSON checkpoint factory metadata from a bare registry name to an explicit restorable factory reference with optional strict-JSON config, e.g. registry-ref {ref, config?, configVersion?}, while preserving local-only markers for inline, anonymous, unregistered, or closure-only factories. A node is restorable only when it was constructed through a factory/descriptor that explicitly supplies a restore ref and JSON-compatible static config. Reactive options remain real graph dependencies and restore through topology; static options may be encoded as factory config. restoreGraph resolves refs through the descriptor registry, validates config before construction, and then the internal restore commit applies cache/SENTINEL/terminal/ctx.state. Same-process host-value/closure checkpointing remains deferred as a future dual-surface design.","rationale":"D83/D86/D90 require factory-name replay and honest failure without function serialization. A bare factory name is sufficient for built-ins like state but insufficient for configured operators; strict JSON config gives cross-process restore a stable public shape while keeping reactive options inspectable as deps. Marking closure-only factories local-only avoids silent placeholder restores and keeps storage/WAL/observe logs out of graph restore semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D96","layer":"L3","date":"2026-06-03","question":"Where should strict JSON validation live now that both storage bindings and graph checkpoints need the same strict-JSON-compatible data contract?","decision":"Move strict JSON / stable JSON utilities to a neutral JSON/encoding module that is neither graph lifecycle nor storage binding. Storage codecs and graph checkpoint validation both import the neutral implementation; existing storage/root exports may continue to re-export the same public names. Do not duplicate strict JSON scanners in graph code, and do not make graph checkpoint depend on storage-shaped modules for validation.","rationale":"D82 keeps storage bindings separate from graph checkpoint/restore, while D90 requires checkpoint data to be strict-JSON-compatible. Strict JSON is a shared data contract, not storage I/O or graph lifecycle behavior. A neutral module preserves a single source of truth for canonical bytes, duplicate-key rejection, unpaired-surrogate rejection, and host-value failure while avoiding a graph-to-storage layer dependency smell.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D97","layer":"L3","date":"2026-06-03","question":"How should restorable closure-backed operators be authored so one user definition covers runtime dispatch and fresh restore?","decision":"Use a lightweight named definition surface as the canonical DX for restorable user functions/operators, e.g. `const inc = transform(\"inc\", fn)` and `g.initNode(map(inc), [src])`. The named definition is the single source of truth: graph construction uses it to build the operator body and internally register the resulting runtime closure with the dispatcher, while checkpoint metadata uses the same definition to stamp an explicit registry-ref/config, and `restoreGraph` consumes a restore registry derived from the same definitions (for example `restoreRegistry([inc, ...builtins])`). Restart restore works when the same application code loads the same definition catalog before calling `restoreGraph`; the checkpoint stores stable refs/config, not JS function bodies or dispatcher handles. Built-in static-config operators may auto-supply restore metadata; arbitrary inline closures such as `map((x) => x + 1)` remain local-only unless wrapped in a named definition or given an explicit restore ref that resolves in the restore registry. Node `name` and default factory names such as `map` must not silently become restore refs. The dispatcher fn table remains an internal runtime handle table, not a user-maintained restore registry; same-process host-value/closure checkpointing remains a separate deferred surface.","rationale":"D83/D90 require honest strict-JSON checkpoints without serializing functions, and D95 requires explicit restorable refs/config for configured factories. A named definition catalog keeps DX thin by avoiding two user-maintained registries: users define a semantic function/operator once, and the graph layer derives both runtime dispatcher registration and restore descriptors from it. Requiring the same code/catalog at restore time matches durable restore reality while preventing fake recovery from node names, default factory names, fn.toString(), or process-local dispatcher handle ids.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D98","layer":"L3","date":"2026-06-03","question":"Should the first public restoreGraph API retain a placeholder graph? option for future live restore?","decision":"No. The 1.0 checkpoint/restore public surface is fresh-restore only: `restoreGraph(checkpoint, { registry })` constructs a new graph from an already-loaded checkpoint. It must not expose a `graph?` option, hot restore, live graph mutation, incremental restore, observe-event replay, or diff replay in the first public API. Live/incremental restore is post-1.0 and requires a separate design/API, likely a distinct name, because applying restore effects to an already-observed graph must go through graph-boundary/wave/observe ordering rather than the fresh restore internal commit.","rationale":"D86/D94 already defer live incremental restore and the current TS implementation rejects `graph?`; keeping a rejected future-shaped parameter in the public surface creates API ambiguity with no 1.0 capability. The clean-slate/no-backward-compat value favors the honest smaller surface now: most restore starts from an empty graph, and live restore should not be accidentally frozen by a placeholder.","supersedes":["D86"],"status":"locked","session":"DS-1"},{"id":"D99","layer":"L3","date":"2026-06-03","question":"What checkpoint id/path shape should mounted child graphs use?","decision":"Mounted graph checkpoints should preserve child-local node ids inside the child checkpoint; the parent mount record owns the mount path (`at`) and restore/inspection composes the mounted path from that boundary. Do not prefix child checkpoint node ids with the parent mount path in the public checkpoint shape, and do not carry a backward-compat shim for the prefixed first sketch. Restore validation should ensure mount path boundaries are unambiguous without making the child checkpoint depend on where it was mounted.","rationale":"Child-local checkpoints keep each graph snapshot reusable and avoid double-prefix/public-data pollution when the same child graph shape is mounted elsewhere. The parent mount edge is the single source of mount context, matching the graph-first inspection model while preserving a cleaner strict-JSON checkpoint shape pre-1.0 with no compatibility burden.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D100","layer":"L3","date":"2026-06-03","question":"How should named restorable definitions choose restore registries and runtime dispatchers without thickening DX?","decision":"Named restorable definitions are registry-agnostic by default and may optionally register with a chosen restoreRegistry at definition time. The restore registry is the semantic table from stable refs to definitions/descriptors; it is derived from the same definitions used during graph construction. Runtime dispatcher choice remains graph-scoped, not definition-scoped: graph construction chooses the dispatcher through `graph({dispatcher})`, and fresh restore chooses the dispatcher for the newly constructed graph through `restoreGraph(checkpoint,{registry,dispatcher?})`. A transform/operator definition must not own dispatcher handles, checkpoint dispatcher ids, or a dispatcher registry; dispatcher registration happens only when a node is constructed in a graph. The default DX stays lightweight: `const inc = transform(\"inc\", fn)`, `g.initNode(map(inc), [src])`, and `restoreGraph(checkpoint,{registry: restoreRegistry([inc, ...builtins]), dispatcher?})`, with optional sugar for adding a definition to a specific restoreRegistry.","rationale":"D97 makes named definitions the single source for both runtime construction and restore metadata, but dispatcher handles are process-local runtime indexes (D7/R-handle) while restore refs are durable semantic keys (D83/D95). Letting definitions bind dispatcher state would couple reusable semantic definitions to one graph causal domain and thicken DX with a fake dispatcher registry. Keeping dispatcher selection at `graph`/`restoreGraph` preserves graph-local runtime ownership, while optional restoreRegistry registration lets users organize definitions without maintaining separate restore and dispatcher registries.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D101","layer":"L3","date":"2026-06-03","question":"Should named restorable function definitions know their operator role, or should the operator use-site carry role/factory meaning?","decision":"Named restorable function definitions are role-agnostic semantic function refs. The canonical user-facing shape is `define(ref, fn, opts?)`: it answers only how restore resolves a stable semantic ref to a runtime JS closure. Operator/factory use-sites consume definitions and own the role-specific reconstruction meaning. For example, `g.initNode(map(define(\"inc\", fn)), [src])` checkpoints as the map factory/descriptor with strict-JSON config pointing at function ref `inc`, rather than making `inc` itself the node factory ref. Restore resolves the node factory descriptor (e.g. `map`) and then resolves any named function refs inside its config through the same restore registry/catalog. Definitions remain dispatcher-agnostic, do not store dispatcher handles, and do not serialize functions; dispatcher registration still happens only when a graph node is constructed by `graph()` or `restoreGraph()`. The prior `transform(\"inc\", fn)` shape is a first-cut too-specific surface and should migrate pre-1.0 to role-agnostic `define`.","rationale":"D97's named-definition goal is one user-maintained semantic function catalog, but tying the function ref itself to the node factory role couples two separate facts: which closure to load (`inc`) and how a node consumes it (`map`, `filter`, `scan`, etc.). The use-site already determines the operator role at runtime, so checkpoint metadata should preserve that same split: factory ref names the reconstructing descriptor, while strict-JSON config names durable function refs. This keeps the DX to one public definition primitive, avoids role-family or per-operator API sprawl, preserves D100's registry-vs-dispatcher separation, and prevents fn.toString/dispatcher-handle restore shortcuts.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D102","layer":"L3","date":"2026-06-03","question":"How should restorable operator use-sites lower positional args into checkpoint config after D101 define?","decision":"Restorable operator descriptors own role-specific checkpoint config. Named function arguments supplied via define(ref, fn) serialize as semantic ref strings under operator-specific argument keys, while strict-JSON static positional args serialize under their public argument names. Definitions remain role-agnostic and registry entries share one restore registry with descriptors. Do not add namespacing, version fields, or a second catalog without a later concrete need.","rationale":"D101 separates function refs from node factory refs, and D95 allows strict-JSON factory config. Lowering use-site args directly into semantic descriptor config preserves readable checkpoints, avoids role-specific definition families, and keeps restoreRegistry the single runtime authority.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D103","layer":"L3","date":"2026-06-03","question":"How should B55 close out storage completeness without reintroducing old storage-shaped graph restore?","decision":"Close B55 as passive storage completion: keep byte backends, typed KV, append-log, conditional-create multi-writer append-log, storage scalar/codecs, change envelopes, observe-event logs, content-addressed KV helpers, and environment backends as binding-layer APIs. Do not reintroduce Graph.attachSnapshotStorage, restoreSnapshot, replayWAL-as-restore, storage-owned hydration, graph checkpoint WAL replay, same-process host-value checkpoint, or cascading-cache under B55. Graph checkpoints may be stored as ordinary strict-JSON values by user code or thin storage helpers, but restore remains restoreGraph(checkpoint,{registry}) over an already-loaded checkpoint. CSP-8 durable messaging should persist topics/messages/read cursors as domain facts over KV/append-log storage, with graph checkpoints only as optional runtime acceleration.","rationale":"D82 split storage binding from graph restore semantics; D83/D86 define restore as graph lifecycle over already-loaded checkpoints; D90 keeps the first checkpoint surface strict JSON; D92 keeps observe logs as ordered facts rather than restore input. Passive storage completion preserves useful pure-ts storage material while avoiding the old monolithic attachSnapshotStorage/restoreSnapshot coupling. CSP-8 needs durable domain facts more than generic graph WAL replay.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D104","layer":"L3","date":"2026-06-03","question":"How should clean-slate TS separate reusable cascading read-through mechanics from the graph reactive cascading cache factory?","decision":"Split cascading cache into two surfaces: a graph-agnostic passive read-through cascade helper for KV/storage/domain callers, and a graph-layer reactive cache factory that wraps such helpers into declared request/policy deps with value/status/event nodes. The passive helper may perform tiered lookup, hit promotion, and return explicit hit/miss/error facts, but it must not create graph nodes, own graph hydration/restore, replay observe logs, or act as a graph commit barrier. The graph factory remains D91's reactive surface: requests, invalidations, policies, fills, and visible cache state changes flow through graph nodes.","rationale":"The cascade algorithm is useful outside Graph, especially for storage/domain facts and CSP-8 durable messaging, but D91/D103 prohibit smuggling that utility back as an imperative graph cache or B55 storage-owned hydration mechanism. Splitting the surfaces preserves reuse while keeping graph topology inspectable, async work outside the sync wave core, and passive storage helpers free of graph lifecycle semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D105","layer":"L3","date":"2026-06-03","question":"What public API shape should TS D104 layer-2 reactive cascading cache use?","decision":"Expose a free-standing graph-layer factory `reactiveCascadingCache`, not a Graph method and not an imperative getOrLoad object. The factory takes declared request/policy/invalidation deps plus passive tiers/load options, wraps passive `tieredReadThrough` work at source/pool boundaries, and returns graph nodes for visible value, status, and events. Cache hits, misses, fills, invalidations, promotions, and visible state changes flow through declared graph topology; passive helpers remain backing adapters only.","rationale":"D91/D104 require cascading cache to be reactive and inspectable while preserving the passive read-through helper for non-graph callers. A free-standing factory avoids reviving storage-shaped Graph methods, keeps topology visible in describe(), and confines async storage/fetch work outside the sync wave core.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D106","layer":"L3","date":"2026-06-03","question":"How should B55 finish passive backend and iteration coverage without reopening graph restore?","decision":"Finish B55 with environment backends and storage-level iteration helpers only: browser IndexedDB byte backend, optional node SQLite byte backend when runtime support is explicit, and ordered append/observe-event log iteration/page helpers. These APIs operate over StorageBackend/KvStorageTier/AppendLogStorageTier facts and must not mutate graphs, replay WAL as restore, project observe logs into official graph state, or add Graph storage methods. Snapshot checkpoints may be stored as ordinary strict-JSON KV values by user code, but restore remains `restoreGraph(checkpoint,{registry})` over an already-loaded checkpoint.","rationale":"D103 closes B55 as passive storage completion, while D83/R-restore own graph lifecycle restore and D92 limits observe-event log consumption to ordered storage iteration. Environment backends and iteration close useful frozen-reference gaps for CSP-8 durable domain facts without smuggling old attachSnapshotStorage/restoreSnapshot semantics back into clean-slate TS.
