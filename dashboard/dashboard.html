ribe; the pausable mode then determines the DEMAND DELIVERY CONTENT (true → coalesced latest; 'resumeAll' → buffered backlog drained). pull+pausable:false is REJECTED (pull needs RESUME as the demand signal).","rationale":"PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job. D44 pins the precedence over R-async-paused -- production is gated only by resumeAll, never by true/false (formal wave_async_paused.tla: ShouldBuffer + NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified). D55 adds the orthogonal pull axis (delivery-content = mode).","status":"active","since":"D10,D44,D55","covers_by":["C-5","C-9","C-10","C-16"]},{"id":"R-async-paused","area":"control","statement":"an async result arriving at a paused node buffers and replays on final-lock RESUME -- BUT this is GATED by pausable mode (D44), not unconditional: it applies only when pausable in {true,'resumeAll'} and, in true mode, only to a COMPUTE node (deps>0). A pausable:false node never buffers (ignores PAUSE, keeps producing); a true-mode depless leaf source delivers its own async production immediately (R-pause-modes). The buffered result enters the node-level pause_lockset-scoped buffer (lock_id scope = node-level pause_lockset).","rationale":"DR-3; D44 conditions the buffering on pausable mode + node kind -- the C-2 node is an async COMPUTE node (deps>0), which is why it buffers; pausable:false (B20) and the async leaf source (B20's twin) are the cases the unconditional reading got wrong.","status":"active","since":"DR-3,D44","covers_by":["C-2","C-9","C-10"]},{"id":"R-teardown-complete","area":"control","statement":"a [[TEARDOWN]] arriving at a non-terminal node synthesizes a [COMPLETE] prefix in the same wave ([[COMPLETE],[TEARDOWN]]) so bridge subscribers resolve before unwiring. Idempotent (subsequent TEARDOWN arrives alone); skipped when the wave already carries COMPLETE/ERROR","rationale":"clean complete-then-teardown lifecycle pair; firstValueFrom-style bridges need the COMPLETE","status":"draft","since":"D9","covers_by":[]},{"id":"R-replay-buffer","area":"control","statement":"replayBuffer:N → node keeps a circular buffer of the last N outgoing DATA values; a late subscriber receives buffered DATA after the START handshake and before live updates","rationale":"replaces the replay() operator + subscribe-hook monkeypatching","status":"draft","since":"D9","covers_by":[]},{"id":"R-restore","area":"lifecycle","statement":"restore/hydration is a graph lifecycle operation, NOT a fresh-lifecycle transition and NOT a sync-core I/O operation. Async loading, decoding, storage reads, and WAL/diff materialization happen outside the sync wave core; the resolved checkpoint commits at a graph boundary as one bootstrap/batch restore transaction. Restore restores the checkpointed graph state: all serialized ctx.state (including non-persist state), serialized caches/value absence, terminal/lifecycle state when represented, topology/factory bindings, and collection backendState when a D160 collection-owned contributor is present. It MUST NOT wipe ctx.state, reset serialized restored caches to SENTINEL, re-arm first-run as if never run, fire fresh-lifecycle cleanup hooks merely because a checkpoint was restored, or mutate a live graph invisibly behind subscribers. Reactive collection snapshot/helper caches are non-authoritative D160 derived views; restore ignores any such cached DATA and seeds the collection from backendState. After ready/commit, restored cached values participate in normal push-on-subscribe: a late subscriber to a restored dep-bearing/derived node receives that node's restored cache directly, and dependency activation/push-on-subscribe caused by reconnecting restored topology MUST NOT by itself recompute, overwrite, or clear the restored cache. Post-commit upstream DATA/INVALIDATE/terminal events are ordinary waves and may update restored nodes normally. Incremental restore/diff replay, when supported, applies changes through the normal graph boundary/wave machinery rather than direct hidden state mutation. A restore with a missing or local-only factory reference fails honestly; it does not synthesize placeholder function bodies.","rationale":"D83 closes DS-1 Flag 1: restore is state-preserving, while wipe occurs only on an actual fresh-lifecycle reset (R-terminal resubscribable reset / deactivation lifecycle). D117 closes the restored-derived late-subscribe ambiguity: checkpointed serialized cache/state is load-bearing, and restored topology activation is not a hidden recompute pass. D160 makes collection backendState the authority for reactive collections and treats collection snapshot/helper caches as derived non-authoritative views. D57 keeps hydration's async work outside F-SYNC-CORE, and D82 keeps storage/WAL/envelope APIs in the binding layer. The protocol obligation is the observable lifecycle: a restored graph resumes from the checkpointed graph state and any live/diff observers see restore effects only through graph-boundary ordering, not hidden mutation.","status":"draft","since":"DR-5,D57,D82,D83,D117,D160","covers_by":["C-24"]},{"id":"R-snapshot","area":"lifecycle","statement":"snapshot/checkpoint captures the graph's live inspectable topology (the same current/live dep + mount path truth source as R-describe/R-edges-derived), each restorable node's factory reference/name, cache/value state including SENTINEL absence, terminal/lifecycle state when represented, and ALL node-private ctx.state regardless of ctx.state.persist flags. Reactive collection snapshot/helper caches are the D160 exception: they are non-authoritative derived views of the collection backend, so checkpoint records them as SENTINEL/absence while the collection-owned backendState contributor is authoritative. Function bodies are never serialized; restore re-resolves nodes by factory reference through the dispatcher/graph factory registry. Anonymous inline or unregistered functions are marked local-only and cannot restore cross-process; missing factory refs fail restore honestly. Snapshot records may carry incremental changeset/diff intent, but storage tiers, WAL frame shape, codecs, content addressing, and durability policy are presentation/binding-layer concerns, not substrate rules.","rationale":"D25 pins factory-name refs because fn bodies cannot serialize; D51/R-describe pins live topology as the truthful graph snapshot source after rewire; D83 adds the explicit ctx.state/cache/lifecycle payload and local-only failure contract. D160 keeps reactive collection backends as the single materialized authority and makes snapshot node caches non-authoritative derived views; checkpoint therefore stores collection backendState rather than duplicating collection snapshot caches. D82 deliberately keeps storage substrate and WAL/diff codecs separate from graph restore semantics.","status":"draft","since":"D25,D51,D82,D83,D160","covers_by":["C-24"]},{"id":"R-graph-role","area":"graph","statement":"Graph = convenience + inspection entry: register/name/find/describe/observe/profile/snapshot/mount/batch/operators. g.* sugar desugars to dispatcher.register + Node + auto-registers into the graph inspection index. Graph is optional convenience, not a mandatory container; multi-graph is natural","rationale":"D5 Graph holds all convenience+inspection; D3 graph-first mental anchor","status":"draft","since":"D5","covers_by":[]},{"id":"R-edges-derived","area":"graph","statement":"edges are derived on-demand from each node's CURRENT/LIVE deps (the node's live _deps, RE-READ at describe() call time — NOT a construction-time snapshot, so a rewire C-8/C-11 is reflected; D51) + the mount hierarchy; there is no stored edge registry and no connect/disconnect. Every edge shown in describe has a real protocol subscription behind it — decorative edges are not representable (the live-deps reading is what KEEPS this true post-rewire: a construction-time edge would be decorative after unsubscribeDep). A live dep absent from the graph inspection index (a runtime *Map inner / bare graph-less node) is auto-discovered as a snapshot node, factory from its NodeOptions.factory (R-describe); auto-discovery follows transitive live reachability through unregistered deps, so an auto-discovered inner's own current deps are also emitted as nodes+edges when reachable.","rationale":"D3 topology is a pure function of (nodes, CURRENT deps, mounts); D51 — 'construction-time deps' self-contradicted 'every edge has a real subscription' once rewire (D42/D47) made topology dynamic (a unsubscribeDep'd construction edge is decorative after unsubscribeDep). Live-deps reading restores truthfulness + realizes D47/C-11 'describe shows currently-live inners'. B38 resolves the D51 follow-up by treating auto-discovery as a live-reachability walk rather than a one-level leaf capture, preserving edge truthfulness for composed graph-less inners.","status":"draft","since":"D3,D51","covers_by":[]},{"id":"R-rewire","area":"graph","statement":"replaceDeps/subscribeDep/unsubscribeDep = runtime topology rewire, INTRA-graph only (D22 single causal domain; no inter-graph form — cross-graph wiring is only via the wire bridge). Surgical/Option-C: a dep in both old and new sets is left untouched (subscription + DepRecord survive); only removed deps unsubscribe + discard their DepRecord, only added deps fresh-subscribe; DepRecord-ref dispatch lets kept deps reorder freely. Across a rewire: the first-run gate (_hasCalledFnOnce) is PRESERVED, never re-armed (re-arming would re-gate unchanged deps); an added dep enters prevData=SENTINEL and the fn guards via prevData===SENTINEL; the activated compute-node cache is PRESERVED (R-rom-ram); pause lockset + buffer PRESERVED. An added dep with a cached DATA pushes [DIRTY,DATA] on subscribe (R-push-subscribe); a SENTINEL dep delivers START only. unsubscribeDep clears the removed dep's dirty contribution; if it was the sole dirty contributor and the node was dirty, the wave auto-settles. A removed dep's queued messages (DIRTY/DATA/INVALIDATE) are DRAINED — nothing strands downstream. Rejects: self-dependency; a cycle (DFS O(V+E)); a terminal this (completed/errored) for IMMEDIATE/external rewire; adding a non-resubscribable terminal dep (would wedge — resubscribable terminal deps are allowed). Deferred self-rewire queued before terminal is the D62 exception: R-rewire-deferred may apply subscribeDep/unsubscribeDep/replaceDeps after the owner becomes terminal, while terminal remains an output guard. unsubscribeDep to zero deps is allowed (degenerate fn-no-deps; cache preserved; no auto-deactivate). Mid-wave rewire (between dep deliveries) is allowed; mid-fn rewire (while the node's fn is executing, _insideRunWave) and reentrant rewire (another replaceDeps/subscribeDep/unsubscribeDep in flight) are REJECTED — a fn mutating its own topology mid-wave is the synchronous feedback-cycle ERROR (D37/R-reentrancy). Topology change does not bump a version counter (topology ≠ DATA). Every rewire API requires an explicit fn (fn-deps pairing: user fns read data[i]/prevData[i] positionally, so a dep-shape change must re-declare the fn). A SELF-triggered mutation (a fn changing its OWN deps in response to its own data) must use the deferred ctx.rewireNext path (R-rewire-deferred / D47), NOT an immediate in-fn call.","rationale":"D42 ratifies the TLA+-verified (port-model wave_protocol_rewire, 126k states) rewire design Q1–Q7 for the clean-slate substrate; D22 bounds it to one causal domain; the mid-fn reject is floor-mandated by D37/R-reentrancy; surgical/Option-C + required-fn come from the Phase 13.8 design iteration. D62 narrows the terminal-this reject to immediate/external rewire only: queued self-rewire drains after terminal, with terminal sealing output rather than freezing topology. Per D42 SD-2, the cross-axis formal coverage is COMPLETE (wave_rewire.tla INVALIDATE+terminal + wave_rewire_emit.tla equals+multi-sink, all TLC-green + mutation-verified) and the TS C-8 arm is green; flipped ACTIVE 2026-05-28 on the TS-arm-green+formal precedent (R-reentrancy/R-up-at-source/R-dirty-before-data), rust/py conformance arms tracked separately in C-8 runtimes","status":"active","since":"D22,D42","covers_by":["C-8"]},{"id":"R-mount","area":"graph","statement":"graph.mount(subgraph,{at}) embeds a child graph addressable under the parent namespace (:: delimited paths); lifecycle signals propagate parent→mounted children; mount has no deps (exempt from deps-first ordering)","rationale":"D4 mount verb; L4-Q4 mount exemption","status":"draft","since":"D4","covers_by":[]},{"id":"R-describe","area":"graph","statement":"describe(opts?) = static, JSON-serializable structure snapshot: {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}. DNode = {id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (operator real name per D6/L1.5, not 'derived'), status (R-status-enum), value? (field ABSENT = SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}. edges are derived from each node's CURRENT/LIVE deps + the mount hierarchy (R-edges-derived / D51) — re-read at call time, so a rewire (C-8 immediate / C-11 *Map deferred) is reflected (the snapshot is point-in-time live, NOT a construction snapshot). A live dep absent from the graph index (a runtime *Map inner / bare graph-less node) is AUTO-DISCOVERED as a snapshot node: synthesized stable id, status/value from the node getters, factory from its OWN NodeOptions.factory (the field D43 reserved for standalone graph-less operators, set by the free initNode) else '?'; auto-discovered inners are NOT persistently registered in the graph index (best-effort live capture, no register/unregister churn — D51 chose B2 over a persistent registry). Auto-discovery is a transitive live-reachability walk: after the registered-node pass, every discovered unregistered node is recursively expanded through its own CURRENT/LIVE deps, emitting reachable unregistered nodes+edges with stable synthesized ids; cycles are represented by edges but each discovered node is emitted once per snapshot. value carries the cache snapshot at call time; fn bodies are never serialized (factory-name ref only, D25). describe({explain:{from,to}}) = causal-chain subset (same shape, filtered to the from→to chain). Renderers (pretty/mermaid/d2) are pure functions over the snapshot — NOT methods and NOT a describe({format}) option; there is no graph.explain(). Live-topology streaming (rewire deltas) is an observe topology-event, deferred to CSP-2 viz","rationale":"D3 describe first-class; D39 pins the field set; L4-Q8 renderers pure fns; D25 snapshot same source; per-language (D24, never in parity — documented contract, not conformance-tested); D51 — the snapshot reflects LIVE deps (truthful post-rewire) + auto-discovers unregistered inners (factory via the D43-reserved NodeOptions.factory); B38 closes the D51 transitive-discovery follow-up by making auto-discovery a live-reachability walk rather than a one-level leaf capture; live-topology STREAMING (deltas) stays deferred to viz (a point-in-time read is not streaming)","status":"draft","since":"D3,D39,D51","covers_by":[]},{"id":"R-observe","area":"graph","statement":"observe(path?) = read-only live message tap returning a subscribable EGRESS ({subscribe(sink)→unsubscribe}) — NOT a graph node (no self-observation island). observe is a REAL (lazily-activating) subscriber: it uses subscribe internally, so observing a COLD node activates it + its upstream (running their fns), and observing a cached node receives the [DATA,cached] push (R-push-subscribe). 'Read-only' (D19) means observe never EMITS or MUTATES node state — it does NOT mean activation-free; observing a cold graph activates it. Each stream item is an enveloped ObserveEvent = {path, msg (the Message), tier (messageTier), seq (graph-local monotonic clock, D26)}; the envelope carries node identity so single-node / subtree / whole-graph observe share ONE shape. Upstream control is a separate Graph affordance: single-node up(msgs) / all-nodes up(path,msgs) (e.g. PAUSE); a node guard denying an upstream message drops it silently (R-up-at-source)","rationale":"D5 Graph IS the introspection layer; D39 pins the ObserveEvent envelope + read-only egress (not a node); D19 inspection read-only; per-language (D24, never in parity)","status":"draft","since":"D5,D39","covers_by":[]},{"id":"R-inspection-set","area":"graph","statement":"inspection surface = describe (incl explain mode) + observe + profile — 3 first-class methods on Graph; no separate Inspector object","rationale":"L4-Q8 inspection consolidation","status":"draft","since":"D5","covers_by":[]},{"id":"R-meta-presentation","area":"graph","statement":"meta companion stores are presentation/graph-layer, NOT substrate. Static annotations (description/type/range/format/access/tags/unit) → describe metadata attached via g.node opts. Reactive annotations (a status/error that changes over time) → explicit nodes + dep (R-ctx-state / D23). The substrate node carries zero meta machinery. meta.owner ABAC is presentation/multi-agent, out of substrate scope","rationale":"D36; D5 node=thinnest, meta is annotation feeding describe (graph owns inspection)","status":"draft","since":"D36","covers_by":[]},{"id":"R-graph-lifecycle","area":"graph","statement":"graph.signal(msgs) broadcasts a message to all registered nodes (e.g. [[PAUSE,lockId]] or [[INVALIDATE]]); graph.destroy() broadcasts [[TEARDOWN]]. graph.set(name,v) = node.down([[DATA,v]]) sugar; graph.get(name) = cache read","rationale":"D5 graph convenience; L4-Q1 state.set = node.down sugar","status":"draft","since":"D5","covers_by":[]},{"id":"R-clock","area":"runtime","statement":"monotonic time = a graph-local counter (causal-domain ordering, folded into the graph); wall-clock = a system call; there is NO global clock singleton","rationale":"D26 / L3-Q9 config dissolution; graph = single-thread concurrency domain so ordering is domain-local (refined 2026-05-31 with D22 option-A; was 'causal domain', see R-graph-domain)","status":"draft","since":"D26","covers_by":[]},{"id":"R-dispatch-all","area":"runtime","statement":"all fn go through the dispatcher / FactoryRegistry; node((ctx)=>...) also runs through the LocalSync pool. There is no inline-fn-bypasses-dispatcher path","rationale":"F-DISPATCH-ALL; sacred L0.7 (all fn through dispatcher)","status":"draft","since":"D21","covers_by":[]},{"id":"R-sync-core","area":"runtime","statement":"dispatcher.invoke is sync void — wave-state mutation always serializes onto the graph's single thread; async/remote execution returns via a pool callback. 1.0 pools = LocalSync + LocalAsync; dispatcher keeps a pluggable pool trait for WorkerPool/RemotePool","rationale":"F-SYNC-CORE; D20 pool set; sacred L0.7 (wave protocol impl is sync)","status":"draft","since":"D20,D21","covers_by":[]},{"id":"R-handle","area":"runtime","statement":"handle = pure data (pool_id, handle_id), NO methods — serializable/snapshottable/wire-transferable; it is a dispatcher-table index. node ≠ handle (node has up/down methods at the external-world boundary)","rationale":"D7 handle is pure data","status":"draft","since":"D7","covers_by":[]},{"id":"R-graph-domain","area":"runtime","statement":"graph = single-thread CONCURRENCY domain (the unit of concurrency, NOT the bound of causal influence). In-domain propagation is ONE synchronous causal wave: same-tick, glitch-free, diamonds RESOLVED-merged so a fan-in sees one consistent version of its source. Causal influence is NOT bounded by the graph — it CROSSES domains via the async wire bridge as DELAYED CONSISTENCY (a value produced in wave N is consumed one tick later in the peer domain; the two-phase wire gate preserves cross-domain consistency — wave_xgraph.tla L2.F). Compute parallelism is via pool callback (results serialize back to the domain's thread); true parallelism is via multiple graphs + wire bridge. Disjoint waves in the same graph do not parallelize (one concurrency domain = one dispatcher).","rationale":"D22 wave protocol is lock-free because the graph boundary is the CONCURRENCY boundary. Wording refined 2026-05-31 (D22 option-A in-place edit; SESSION-reactive-linear-and-git M4): 'causal domain = concurrency domain' conflated two things — causal influence spans the wire bridge, so the graph bounds the concurrency unit, not the causal range; cross-domain causal propagation is delayed-consistency (wave_xgraph.tla L2.F two-phase gate). Behavior unchanged (C-1/C-4 unaffected).","status":"active","since":"D22","covers_by":["C-1","C-4"]},{"id":"R-no-polling","area":"principle","statement":"state changes propagate reactively via messages; never poll a node's value on a timer or busy-wait for status; periodic behavior is a reactive timer source emitting through the graph","rationale":"spec §5.8 durable value","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-imperative","area":"principle","statement":"no imperative side-channel triggers (event emitters, callbacks, setTimeout+set) to drive graph behavior; all coordination uses ctx.up signals + message flow through topology; remove imperative paths when no caller depends on them","rationale":"spec §5.9 durable value (feedback_no_imperative)","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-raw-async","area":"principle","statement":"no bare async primitives in the reactive layer (TS: Promise/queueMicrotask/setTimeout/process.nextTick; PY: asyncio.create_task/threading.Timer/raw coroutines). Async boundaries live only in sources (fromPromise/fromAsyncIter) and the pool/runner layer","rationale":"spec §5.10; F-SYNC-CORE async only at pool/wire boundary","status":"draft","since":"D20","covers_by":[]},{"id":"R-data-not-peek","area":"principle","statement":"all data propagation — including initial values at connection time — flows through messages [[DATA,v]]; nodes do not peek a dep's .cache to seed computation; .cache is a read-only accessor for external consumers","rationale":"spec §5.12 single mental model: if data moved, a message carried it","status":"draft","since":"D3","covers_by":[]},{"id":"R-primary-api-clean","area":"principle","statement":"protocol internals (DIRTY/RESOLVED/bitmask) never surface in the value-level primary API (derived/effect/operator); ctx-level primitives (node/producer) intentionally expose tier as a power surface (DR-1 §5.11 amend). A developer using value-level sugar never reads the spec to start","rationale":"DR-1 ctx-level is a deliberate protocol-facing power surface; value-level is §5.11-compliant primary","status":"draft","since":"DR-1","covers_by":[]},{"id":"R-reentrancy","area":"wave","statement":"a synchronous feedback cycle — a node fn that, during its invocation, transitively re-drives one of its own (direct or indirect) deps so the same node's fn would re-enter before its wave completes — is a wave-level protocol ERROR. Detection is node-local and free: a node refuses to enter its fn-run while its own in-wave flag (_insideRunWave) is already set, and throws; the graph layer catches the throw and converts it to [[ERROR, e]] down (D30 — value-level throw → graph-layer ERROR), located at a node ON the cycle (the value-level catch nearest the throw on the synchronous unwind — implementation-determined, NOT necessarily the re-entered node), aborting the wave. The core neither queues nor bounds-then-runs the cycle (reject, not iterate). Legitimate accumulation uses per-node ctx.state (e.g. scan): not a topological cycle, never re-enters. Async feedback that crosses a turn boundary via an async pool is out of scope — it is not synchronous re-entry and does not desync the wave. No numeric rerun-depth cap is needed (precise in-wave flag detection supersedes the blunt maxFnRerunDepth)","rationale":"D37; surfaced by CSP-1 /qa (backlog B10); reject (B) over queue-to-wave-end (A) because A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; detection reuses the existing _insideRunWave flag, dispatcher stays a pure funnel (F-DISPATCH-ALL), error ownership graph-level (D30)","status":"active","since":"D37","covers_by":["C-6"]},{"id":"R-up-at-source","area":"protocol","statement":"a depless source is the terminus of upstream control forwarding (R-ctx-up). It self-ACTS only on a message with a coherent round-trip action: INVALIDATE → HONOR the invalidate-request (clear cache to SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never arrives). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediate nodes never self-act on upstream control — they forward toward deps only; the source is the single actor and the down-cascade is the effect (D59/R-up-routing) A forwarded RESUME (a routed pull DEMAND, R-pull) whose pullId this depless source does NOT hold -> DROP at the terminus, like DIRTY; a source that DOES hold the pullId (a pull source) releases its quiet lock and FIRES one delivery (R-pull). Dep-bearing intermediates forward an unheld RESUME up toward deps (release-if-held-else-forward-up), never self-acting.","rationale":"D38; B11; R-ctx-up/DR-5 lists INVALIDATE up-allowed and the only self-consistent reason is terminus honoring (DS-1 L1.11 'invalidate-request'); INVALIDATE-up is a cache-drop request not an imperative write, so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN lack a coherent terminus action","status":"active","since":"D38,D59","covers_by":["C-7","C-16"]},{"id":"R-profile","area":"graph","statement":"profile(opts?) = opt-in accumulated-counter snapshot: {waves; nodes:Record<path, NodeProfile>}, NodeProfile = {invokes, emits, resolved, errored, lastDurationNs?, totalDurationNs?}. Counters are backed by an opt-in dispatcher/graph-level recorder (DS-1 inspectorEnabled / globalInspector→dispatcher hook), NEVER stored on the thin node (R-node-thin); the dispatcher is the invoke funnel (F-DISPATCH-ALL) so it is the natural source of invoke counts + fn duration. Default OFF = zero runtime overhead (F-PERF). profile is a point-in-time snapshot (like describe); a streaming profile is an observe-aggregation, not a new mechanism. Shares the mount-aware :: path key with describe/observe","rationale":"D39; L4-Q8 third inspection method; R-node-thin keeps counters off the node; F-DISPATCH-ALL dispatcher sees every invoke; F-PERF opt-in; per-language (D24, never in parity)","status":"draft","since":"D39","covers_by":[]},{"id":"R-rewire-deferred","area":"graph","statement":"A node fn may, DURING its run, request a mutation of its OWN dep set via ctx.rewireNext(op), op in {subscribeDep(node,fn) | unsubscribeDep(node,fn) | replaceDeps(nodes,fn)} (R-rewire surgical/Option-C semantics, D42). The request is QUEUED, not applied in place; the dispatcher DRAINS the queue at the COMMITTED wave boundary — after the current wave settles, and after a batch() commits or the final-lock RESUME (never on an un-committed or paused view) — applying each mutation as a fresh wave. Drain order is deterministic: per-node FIFO in issue order, nodes drained in causal order. This deferral is the ONLY legal self-triggered rewire: IMMEDIATE in-fn self-rewire remains the D37 mid-fn feedback-cycle ERROR (R-reentrancy); rewireNext moves application to a turn boundary where _insideRunWave is false. An added dep with cached DATA pushes [DIRTY,DATA] on the boundary wave (R-push-subscribe); a removed dep is unsubscribed and DRAINED, and if it loses its last subscriber it _deactivates and fires onDeactivation (input-side teardown — the basis for operator cancellation / abortInFlight). The first-run gate is PRESERVED across a deferred rewire (never re-armed, R-rewire). If the node goes terminal during the wave, its pending rewireNext queue is still drained: terminal is an output/lifecycle guard, NOT a deferred-topology cancellation condition. Applied subscribeDep/unsubscribeDep/replaceDeps may change live deps after terminal, but terminal status remains final and no post-terminal downstream DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR may escape; non-resubscribable late subscribe is still rejected by R-terminal, while a resubscribable reset starts the next lifecycle from the current drained dep set. A rewireNext producing no net dep-set change is a no-op; a net-changing rewireNext re-issued every boundary (oscillation) is a user-level runaway (like an infinite producer), not a substrate-detected error. The wave-boundary drain ALSO hosts a SELF-TRIGGERED DEMAND — a CONE-ROUTED RESUME(pullId) demand to a pull-mode node (R-pull / R-up-routing / D55,D59), not only dep-set mutations — for the same D37-avoidance reason (an immediate in-fn demand whose delivery loops back re-enters the consumer); same committed-boundary drain, same deferral semantics. INTRA-graph only (D22).","rationale":"D47; *Map operators must grow/shrink their own dep set in response to their own data; the D37 mid-fn reject + the async-pool probe (the async pool does NOT defer the fn — _insideRunWave is set during any fn run, dispatcher/index.ts:48 + node.ts:692) leave the wave boundary as the only legal application point. unsubscribeDep is the only thing that stops an abandoned inner's source (read-gate masks output only), and D62 extends that cleanup through terminal waves so helper-owned timer/interval deps can be released by ordinary rewireNext.unsubscribeDep. Complements R-rewire (external/immediate) with a self/deferred form, reusing its surgical semantics. Pre-D62 this rule flipped active on 2026-05-30 with TS/Rust arms green under the terminal-discards-queue facet. D62 revises that facet to terminal-drains-queue; wave_rewire_deferred.tla is TLC-green with the new NoPostTerminalOutput invariant; TS re-passed the amended C-11 arm on 2026-05-31, so the rule returns to active on TS-arm-green + formal precedent. rust/py arms remain todo (CSP-5/7). Batch/pause cross-axis drain timing is split into R-rewire-deferred-committed-boundary / C-25 (B24); describe-renders-live-inners (R-edges-derived construction-deps tension) = backlog B34. D55 reuses this boundary to host a self-triggered pull DEMAND (R-pull).","status":"active","since":"D47,D55,D59,D62","covers_by":["C-11","C-16","C-25"]},{"id":"R-rewire-deferred-committed-boundary","area":"graph","statement":"A queued self-triggered boundary task from ctx.rewireNext(op) or ctx.upNext(msgs) MUST apply only on a committed, unpaused boundary view. If requested while an outer batch is open, the pending batched tier-3/4 settle slice commits first against the pre-task topology/fn shape; the queued task drains only after the outermost batch commits, as a fresh boundary wave. If that batch rolls back explicitly, throws before commit, or fails before it is marked committed, all boundary tasks whose cause belongs to that uncommitted batch are discarded: no dep topology mutation, added-dep activation/push-on-subscribe, unsubscribeDep cleanup, replaceDeps, or self-demand RESUME effect survives the rollback. The already-visible DIRTY from the rolled-back batch is balanced by the normal rollback RESOLVED (R-resolved-undirty). If the owner remains paused when the current wave settles, the queued task does not drain on the paused view; it waits until the final-lock RESUME releases the owner, then drains as a fresh boundary wave, provided any owning batch committed. Implementations MUST NOT mutate dep topology, route a self-demand, activate an added dep, or replay added-dep cached DATA while the requesting node is still inside its fn, while the batch view is uncommitted or rolled back, or while the owner is still paused. This rule adds no new message/tier/API and remains intra-graph only (D22).","rationale":"B24 closes the cross-axis gap left by C-11: R-rewire-deferred already said committed boundary, but wave_rewire_deferred.tla modeled the boundary only as EndRun. D47 locks deferred self-triggered boundary work; D67 locks batch commit-before-rewire for external/immediate rewire; D110 locks rollback fate for self-boundary tasks. This rule composes those existing locks for ctx.rewireNext/ctx.upNext without changing operator lifecycle semantics, pull demand semantics, or the 10-message closed set. The cleanup-only rollback exception is deliberately rejected: unsubscribeDep is topology mutation too, and unconditional cleanup must be expressed through committed terminal/deactivation paths, including D62 terminal-drain behavior when that terminal wave commits. Formal: wave_rewire_deferred_committed.tla models run-end + batch commit/rollback + final RESUME gating. FLIPPED ACTIVE 2026-06-04 on the TS-arm-green + formal precedent (C-25 ts:pass; rust/py remain todo), matching the existing R-rewire/R-resolved-undirty activation pattern.","status":"active","since":"D47,D67,D55,D59,D110","covers_by":["C-25"]},{"id":"R-resolved-undirty","area":"wave","statement":"RESOLVED is the UNDIRTY / no-occurrence settle: a node DIRTY'd in phase 1 that produces NO tier-3 value this wave emits exactly one RESOLVED to clear the downstream dirty (filter-reject / no-emit fn, zero-dep un-dirty, INVALIDATE at a never-populated cache, batch-rollback DIRTY-balance). RESOLVED NEVER substitutes for a DATA and NEVER signals 'value unchanged' -- every value-occurrence is emitted as DATA regardless of value-equality (no auto-equals-substitution; the substrate does not inspect per-wave DATA count for substitution). The undirty RESOLVED is SUBSTRATE-SYNTHESIZED: a value-level operator simply returns without emitting and the substrate emits the balancing RESOLVED (R-primary-api-clean -- operator bodies carry no protocol tier); an operator MAY emit its own DATA/RESOLVED explicitly as an escape hatch. Tier-3 wave exclusivity holds: one node's settle this wave is >=1 DATA (occurrence) XOR exactly 1 RESOLVED (undirty), never mixed. RESOLVED is preceded by DIRTY in the same wave (R-dirty-before-data) like DATA. Dedup (suppress an unchanged emission / skip an expensive recompute) is OPT-IN at the operator layer (distinctUntilChanged / fn early-return), never a substrate behavior; NodeOptions.equals does not exist.","rationale":"D49 supersedes D15/R-equals: equals-absorption overloaded RESOLVED (occurrence-unchanged vs dirty-clear) and destroyed occurrence info, breaking event-counting operators. Narrowing RESOLVED to undirty-only keeps occurrences as DATA (take/scan/snapshot correct) and simplifies the emit path. Glitch-free diamond (R-two-phase/R-diamond) is orthogonal and preserved.","status":"active","since":"D49","covers_by":["C-12"]},{"id":"R-paused-invalidate","area":"control","statement":"INVALIDATE × PAUSE precedence (default/'true' mode). A dep's INVALIDATE arriving while a compute node N is paused: (1) PROPAGATES downstream immediately (consistent with immediate DIRTY — not buffered in default mode; the downstream's N-DIRTY is balanced by this INVALIDATE's dirty-clear); (2) SUPERSEDES that dep's buffered paused dep-wave — N clears the dep to SENTINEL + drops its pending change, then re-derives the pending-recompute flag from whether ANY dep still carries a buffered value-change (ATTRIBUTED). On final-lock RESUME N recomputes once with the latest dep values ONLY if some dep still has a live buffered change; if none remains the recompute is CANCELLED (N already settled to SENTINEL via its own INVALIDATE — it never recomputes against an all-SENTINEL dep set). A later DATA on the same dep re-arms the buffer ([DATA,INVALIDATE,DATA2] → recompute with DATA2). resumeAll mode buffers+replays tier-3/4 on its own path; this rule is the default-mode coalesce semantics.","rationale":"D50; the INVALIDATE-side analogue of D44 (async×PAUSE). Prevents a spurious recompute against a vanished input — a redundant undirty RESOLVED (guarded fn) or a spurious terminal ERROR (non-guarding fn → panic → D30). Attributed cancellation preserves multi-dep updates (no lost update). Formal wave_paused_invalidate.tla (ChangedImpliesLive + PendingReflectsChanges + NoAllSentinelRecompute), TLC-green + mutation-verified. FLIPPED ACTIVE 2026-05-29 on the TS+Rust-arms-green + formal precedent (C-13 ts:pass+rust:pass, both impl-fixes teeth-verified); py arm CSP-7.","status":"active","since":"D50","covers_by":["C-13"]},{"id":"R-terminal-settles-dirty","area":"wave","statement":"A dep's TERMINAL (COMPLETE/ERROR) RELEASES that dep's outstanding in-wave DIRTY contribution: if the dep went DIRTY this wave (phase 1) and has NOT yet settled with DATA/RESOLVED, the receiving node clears that dep's dirty flag and decrements its pending count — exactly as the DATA/RESOLVED/INVALIDATE arms do. This is the EXACTLY-ONE-SETTLE invariant: every dep that goes DIRTY in phase 1 has its contribution released in phase 2 by exactly one settle-class event in {DATA, RESOLVED, INVALIDATE, COMPLETE, ERROR}. It applies in the ABSORBED-terminal cases where the node stays live — completeWhenDepsComplete:false (last/reduce, the *Map higher-order operators) and errorWhenDepsError:false (rescue/catch, R-deps-terminal); the AUTO-CASCADE cases (completeWhenDepsComplete && all deps complete -> node COMPLETE; errorWhenDepsError && a dep errors -> node ERROR) make the node itself terminal, so pending is moot there. If releasing the terminal dep's contribution drains pending to 0 while the node has already broadcast DIRTY this wave AND no terminal cascade fires, the node SETTLES: it recomputes (-> DATA from the remaining live deps' latest values) or, producing no tier-3 value, the substrate synthesizes exactly one undirty RESOLVED (R-resolved-undirty) to balance the downstream DIRTY. WITHOUT this release, a dep that emits DIRTY-then-COMPLETE/ERROR-without-a-value strands pending>0 -> the node never recomputes/settles and the DIRTY it broadcast wedges the downstream cone (the deadlock R-invalidate-idempotent already prevents for the INVALIDATE case). Restores R-diamond / R-two-phase for a diamond whose one leg terminates mid-wave. SCOPE: COMPLETE/ERROR only; a TEARDOWN arriving at a dirtied dep is the terminal-relay question (R-teardown-complete / B33), out of scope here.","rationale":"surfaced by the CSP-2.7 /qa (edge-case review of the *Map operators): node._receiveFromDep's COMPLETE/ERROR arms did not clear a dep's dirty contribution the way the DATA/RESOLVED/INVALIDATE arms do, so a DIRTY-then-terminal-without-DATA dep wedged a multi-dep node (B35). Pins TERMINAL as a settle-class event for dirty-accounting — the missing exactly-one-settle invariant — mirroring the INVALIDATE wedge-guard (the EC3 fix). Locked via /design-review (recommendation A-via-partial-C: a shared release-dirty + post-settle-undirty helper called by COMPLETE/ERROR alongside DATA/RESOLVED). PRE-EXISTING latent gap since CSP-1 (NOT introduced by D47); parity-consistent — the Rust dep-terminal receive arm is not yet built (node.rs _ => {}), so lock-BEFORE-build. No new D# (a dirty-accounting clarification of the two-phase contract D9, surfaced under D30 terminal handling). Formal: wave_terminal_dirty.tla (PendingCountsDirty + NoWedge, mutation-verified — dropping the terminal's release trips PendingCountsDirty). FLIPPED ACTIVE 2026-05-30 on the TS-arm-green + formal precedent (R-rewire/R-reentrancy/R-rewire-deferred): TS impl = node.ts _receiveFromDep COMPLETE/ERROR arms _releaseDepDirty(idx) + _settleAfterAbsorbedTerminal (sawData→recompute, else undirty RESOLVED) / _maybeRun for terminalAsRealInput; C-15 ts:pass (a/b/c). rust:todo = the CSP-6 dep-terminal slice (builds the propagation machinery WITH the release first time, lock-before-build); py:todo CSP-7.","status":"active","since":"D9,D30","covers_by":["C-15"]},{"id":"R-pull","area":"node","statement":"pull-mode node (NodeOptions.pullId:<LockId> -- an author-supplied UNIQUE Symbol written verbatim into the demander's fn; NEVER the node name (non-load-bearing debug metadata), NEVER a bare string (string-equality collides with a same-string pause lock); REPLACES the D55 pull:true boolean) = a quiet-until-demanded source; the demand is a RESUME (NO new message type -- R-msg-closed-set's 10-message set is intact). QUIET (default -- the node self-holds its pullId as its demand lock): (1) ABSORBS an upstream DIRTY WITHOUT relaying it downstream -- internal per-dep dirty/pending accounting is kept, only the DOWNSTREAM DIRTY broadcast is suppressed (the WEDGE FIX); (2) does NOT push-on-subscribe its cached value (START only) -- overrides R-push-subscribe while quiet; (3) tracks dep changes per its ORTHOGONAL pausable mode (true -> coalesce to latest; 'resumeAll' -> buffer the backlog). DEMAND = a CONE-ROUTED RESUME of the node's pullId (R-up-routing): the demander issues ctx.up([[RESUME, pullId]]) (broadcast up the declared cone) or ctx.up(towardDep, [[RESUME, pullId]]) (directed first-hop prune) WITHOUT holding the node's reference; the RESUME travels up declared edges to the pullId-holder, matched by SYMBOL IDENTITY (zero collision; siblings disambiguated). The holder fires EXACTLY ONE delivery then RE-QUIETS (1:1), emitting a fresh DIRTY-before-DATA wave (R-dirty-before-data) so the downstream dirty is balanced. Delivery CONTENT = the pausable mode: true -> the coalesced LATEST (one DATA); 'resumeAll' -> the buffered BACKLOG drained (first-demand backlog INCLUDES the activation value). A demand with NO intervening change -> NO delivery (silent). A demand arriving while a dep DIRTY is in flight (pending>0) fires once the node is settle-ready. pullId + pausable:false is REJECTED at construction (contradiction -- pull needs RESUME as the demand). A SELF-triggered demand (a consumer fn demanding a dep it ALSO reads) MUST defer to the committed wave boundary via R-rewire-deferred (D47) -- an immediate routed RESUME whose delivery loops back re-enters the consumer (D37/R-reentrancy); the consumer accepts one-wave latency. INTRA-graph only (D22). String-LABEL ergonomics (a label->pullId mint + a label->token registry with DUPLICATE-DETECTION) are graph-layer sugar (D6/D24). pull is SUBSTRATE (conformance C-16); the reactiveList two-port shape (stream push + snapshot pull) built on it is per-language (D6/D24, never parity).","rationale":"D55 introduced the pull-mode node + delivery; D59 REVISES the TRIGGER/ROUTING + API (supersedes D55's per-node-opaque-symbol + direct-target ctx.demandNext, RETAINS delivery). A demand must reach the pull node WITHOUT a node reference -- a reference IS the .cache anti-pattern (reach the node, read .cache, an UNORDERED + invisible side-channel) -- so the demand is a RESUME routed up the DECLARED cone (R-up-routing): inspectable (describe/observe), wave-ORDERED (DIRTY-before-DATA), needs only the author-known pullId. RESUME reused (no new message): a pull node is a perpetually-self-paused node, a demand a momentary resume. pullId = author Symbol via pullId:<id> (identity match, zero collision; bare string collides with pause-lock strings; name is non-load-bearing); RESUME payload type LockId=string|symbol UNCHANGED. label ergonomics + duplicate-detection are graph-layer sugar. The original probe-verified delivery (P0b wedge -> absorb-DIRTY fix; P4/P5 matrix) is unchanged.","status":"active","since":"D55,D59","covers_by":["C-16"]},{"id":"R-up-routing","area":"control","statement":"Up-going control messages (R-ctx-up) route along DECLARED dep-edges. ctx.up(msgs) broadcasts up ALL deps; ctx.up(towardDep, msgs) routes up ONE declared edge (directed -- prunes other branches; also for branch-targeted PAUSE/RESUME/INVALIDATE). RESUME routing = RELEASE-IF-HELD-ELSE-FORWARD-UP: a node HOLDING the lock releases it LOCALLY and does NOT forward (normal pause/resume -- a controller targets the holder directly; a pull node holds its own pullId-lock); a node NOT holding it FORWARDS the RESUME up its deps (broadcast or the single towardDep edge) to find the holder. This makes a DEMAND (R-pull) a CONE-ROUTED RESUME of a pull node's pullId that travels up declared edges (inspectable, wave-ordered) WITHOUT the demander holding the target's reference; the pullId disambiguates which holder fires (siblings up one branch are told apart by pullId identity). PAUSE stays NODE-TARGETED (it ACQUIRES a lock, so there is no pre-existing holder to find -- a controller targets the node directly). DIRTY/INVALIDATE/TEARDOWN forward toward deps to the depless-source terminus (R-up-at-source). A forwarded RESUME whose lock NO node up the cone holds reaches the source terminus and is DROPPED (net no-op, R-pause-lockset / R-up-at-source). INTRA-graph only (D22).","rationale":"D59. A demand must reach an upstream pull node WITHOUT a node reference (a reference IS the .cache anti-pattern: reach the node, read .cache) and WITHOUT an out-of-protocol side-channel; routing a RESUME up the DECLARED cone keeps the demand on inspectable, wave-ordered edges (describe/observe see it; .cache is an unordered invisible side-channel that bypasses wave ordering). 'release-if-held-else-forward-up' preserves normal pause/resume (the holder is targeted directly -> local release) while enabling cone-routed demand (a pull node pre-holds its pullId-lock from birth, so a routed RESUME always finds it); PAUSE needs no symmetric change (it creates a lock, no holder to find). Supersedes the old node-local-only RESUME: R-pause-lockset's 'RESUME of an unknown lock is a no-op' becomes 'forward up; drop at the terminus if unheld'. ctx.up(towardDep) prunes dead branches and is the general branch-targeted-control primitive.","status":"active","since":"D59","covers_by":["C-16"]},{"id":"R-up-routing-diamond","area":"control","statement":"A broadcast routed RESUME(pullId) over a DAG is idempotent per pullId-holder per routed control wave. If the same holder is reachable through multiple declared paths, it releases/fires at most once for that RESUME wave; duplicate same-wave arrivals at the already-fired holder are consumed silently and do not trigger a second pull delivery. This is a routing guarantee, not a reliance on R-pull's quiet coalescing after the first delivery. Directed ctx.up(towardDep,msgs) may still prune to one branch when the author wants a single path.","rationale":"D63 / B47. D59's tree model left a diamond-to-one-holder gap: the current impl can invoke the holder once per path, harmless today only because the second delivery is silent. Idempotence per holder per routed wave preserves R-pull's exactly-one-demand delivery promise for future multi-path pull consumers and keeps routing truthful over declared DAG topology.","status":"active","since":"D63","covers_by":["C-18"]},{"id":"R-undirty-settle-timing","area":"wave","statement":"A substrate-synthesized undirty RESOLVED used to balance a previously broadcast DIRTY follows normal tier-3/4 delivery timing. In pausable:true default mode it may deliver immediately even while a pause lock is held; in pausable:'resumeAll' it is buffered and replayed on final-lock RESUME; inside an open batch it is deferred until the outermost batch commit. This applies to undirty RESOLVED produced by terminal dirty-release (R-terminal-settles-dirty) and by INVALIDATE dirty-clear paths. Implementations must not bypass the normal delivery path with a bare subscriber send for these balancing RESOLVEDs.","rationale":"D64 / B39. Non-paused terminal dirty-release is already correct under C-15; the latent gap is only resumeAll/batch timing. Routing the balancing RESOLVED through normal delivery preserves D50 default-mode immediacy while honoring R-pause-modes and R-wave-boundary.","status":"active","since":"D64","covers_by":["C-19"]},{"id":"R-teardown-terminal-relay","area":"control","statement":"TEARDOWN relays through an already-terminal intermediate. A terminal node receiving upstream TEARDOWN forwards TEARDOWN downstream without emitting a new COMPLETE/ERROR, without clearing terminal, and without allowing post-terminal DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR. A non-terminal node receiving TEARDOWN keeps R-teardown-complete behavior: synthesize COMPLETE before TEARDOWN unless the same wave already carries COMPLETE/ERROR. TEARDOWN is a destroy/unwire cascade, not a value/lifecycle resurrection.","rationale":"D65 / B33. terminal-is-forever seals value output, but bridge/resource unwire must still reach downstream subscribers. Dropping TEARDOWN at a terminal guard leaks resources; relaying TEARDOWN is a narrow exception that does not reopen the node.","status":"active","since":"D65","covers_by":["C-20"]},{"id":"R-rewire-async-live-edge","area":"graph","statement":"A ctx captured by an async pool callback routes through the node's LIVE topology at emission time. If the node is rewired after the async invocation starts and before the callback calls ctx.up/ctx.down, the callback observes the current dep set/fn shape, not an invocation-time dep snapshot. Removed deps are drained and receive no late ctx traffic; added deps participate if they are live at emission time. Terminal output guards still seal post-terminal down emission.","rationale":"D66 / B17. Live-edge ctx matches graph-first inspection and current TS behavior: describe shows live deps, and hidden invocation-snapshot edges would be invisible topology. Async remains outside the sync wave core; the callback re-enters through the normal live node boundary.","status":"active","since":"D66","covers_by":["C-21"]},{"id":"R-rewire-batch-boundary","area":"graph","statement":"If replaceDeps/subscribeDep/unsubscribeDep is requested while an outer batch is open and the target node has an uncommitted batched tier-3/4 settle slice, the rewire is accepted but deferred until after the outermost batch commits. The pending batched wave commits first against the pre-rewire topology/fn shape; then queued rewire requests drain FIFO as fresh boundary waves. Topology mutation never applies to an uncommitted batch view, and old-shape pending DATA is never committed against the new dep set. Outside an open batch, immediate/external rewire remains immediate between waves.","rationale":"D67 / B19. This aligns external/immediate rewire with ctx.rewireNext's committed-boundary discipline while avoiding both a special reject and the unsafe rewire-before-commit ordering. Batch owns the current wave; topology changes begin after that wave commits.","status":"active","since":"D67","covers_by":["C-22"]}],"conformance":[{"id":"C-1","name":"cross-graph diamond coalesce","covers":["R-diamond","R-tier","R-two-phase","R-dirty-before-data","R-graph-domain"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"A in g1; B,C in g2 (reached from g1 via wire bridge); D in g1. Edges A→B, A→C, B→D, C→D — a diamond split across two single-threaded graphs.","input":"A.down([[DATA, v]]) (one wave).","expect":"DIRTY crosses the wire to B and C at the same priority as DATA (R12). Phase 1 DIRTY reaches D via both legs before any phase-2 DATA. D recomputes EXACTLY ONCE after both B and C settle in the same logical wave; D's outgoing wave contains a single DATA. No glitch (D never fires on a half-settled diamond).","note":"L2.F mixed-locality survival proof — the diamond stays glitch-free even though B/C live in a different causal domain reached over the wire bridge.","blocked":"wire bridge (backlog B2) — not yet implementable; the in-process diamond core it leans on is green in packages/ts core.test.ts (R-diamond/R-two-phase)","ref":"DR-5"},{"id":"C-2","name":"async-result arriving at paused node","covers":["R-async-paused","R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"Producer P backed by an async (LocalAsync) pool → node N. N has one active pause lock.","input":"1) N.up([[PAUSE, L1]]). 2) P's async fn resolves while N is paused, delivering [[DATA, r]] toward N. 3) N.up([[RESUME, L1]]).","expect":"The async result does NOT drop and does NOT deliver mid-pause; it enters N's pause buffer. On final-lock RESUME (L1 released, lockset empty) the buffered result replays as a wave to N's sinks. lock_id scope = the node-level pause_lockset (consistent with PAUSE buffering DATA).","note":"DR-3 — async-result-at-paused-node is buffer+RESUME-replay, identical to how PAUSE buffers a synchronous DATA. Rust arm GREEN 2026-05-30 (CSP-6 Slice A): graphrefly-rs LocalAsync pool (dispatcher Vec<Pool> + register_async; invoke stays sync void, R-sync-core) + DeferredCtx (ctx.defer() owned late-emit, the Rust analogue of TS capturing ctx) + node pause_buffer. should_buffer_on_pause True-branch buffers an async COMPUTE node (deps>0); on_resume drains+replays [DIRTY,DATA]. Teeth-verified (disable the async-compute buffer → DATA delivers mid-pause). conformance.rs::c2_async_result_at_paused_node.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-3,DR-5"},{"id":"C-3","name":"INVALIDATE × ctx.state × onInvalidate","covers":["R-invalidate-idempotent","R-ctx-state","R-cleanup-hooks","R-sentinel"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"source S → derived D. D's fn sets ctx.state on each run and registers ctx.onInvalidate(flush). A second parent S2 → D exists (diamond) to exercise fan-in idempotency.","input":"1) S settles [[DATA, v]] → D runs, caches, sets ctx.state. 2) S.down([[INVALIDATE]]) — cascades to D via both fan-in paths in one wave.","expect":"D broadcasts INVALIDATE downstream exactly ONCE (not once per fan-in path). D's onInvalidate hook fires exactly once (external flush). ctx.state is NOT wiped — INVALIDATE is lifecycle-continue, not a fresh-lifecycle transition; any internal reset must be done manually in onInvalidate. D's per-dep prevData returns to SENTINEL so a downstream prevData===SENTINEL never-emitted detector reads correctly. A second INVALIDATE arrival in the same wave is a no-op (hook + broadcast do not re-fire).","note":"distinguishes lifecycle-continue (INVALIDATE) from fresh-lifecycle wipe (deactivation / resubscribable reset). TS arm covers single-parent cascade + idempotent no-op + state-preservation; fan-in-in-one-wave needs batch (covered by R-invalidate-idempotent _hasData guard). Rust arm GREEN 2026-05-29 (CSP-5 control/terminal slice): graphrefly-rs node.rs INVALIDATE branch (idempotent !has_data guard, dep_prev→SENTINEL, dirty un-wedge) + ctx.on_invalidate (re-callable, cleared on deactivate); conformance.rs::c3 covers single-parent cascade + idempotent no-op + state-preservation, matching the TS arm (diamond fan-in-in-one-wave still needs batch, deferred).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-4","name":"mixed sync/async diamond","covers":["R-diamond","R-two-phase","R-graph-domain","R-first-run-gate","R-dirty-before-data"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"A → B (sync LocalSync leg) and A → C (async LocalAsync pool leg); B→D, C→D. One diamond, one sync leg + one remote/async leg.","input":"A.down([[DATA, v]]).","expect":"D joins EXACTLY ONCE after BOTH legs settle, even though the async leg C settles later via a pool callback. The async pool callback's wave-state mutation serializes back onto the graph's single thread (R-graph-domain), so D's dirty-dep accounting reconciles the sync and async settlements into one recompute. The first-run gate holds D until both deps have delivered real DATA. R-dirty-before-data: a post-activation re-join emits DIRTY before DATA in the same logical wave (observed ['DIRTY','DATA'], glitch-free two-phase).","note":"R8/R9 PoC validated; TS arm now a full conformance test (sync + async pool, same process — no wire bridge needed). R-dirty-before-data earned here via the post-activation re-join DIRTY-before-DATA assertion (CSP-3, 2026-05-28). Rust arm GREEN 2026-05-30 (CSP-6 Slice A): the async leg is a derived_async node whose fn stashes ctx.defer() and emits later; the first-run gate holds the join until it delivers, and the async leg's no-emit run is EXEMPT from the undirty-RESOLVED synthesis (deferred ≠ rejected — else the join settles early). Teeth-verified (remove the async exemption → the join fires before the async leg settles, runs=2 not 1). conformance.rs::c4_mixed_sync_async_diamond.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-5","name":"PAUSE lockset multi-source","covers":["R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"node N with two independent pause controllers, A and B.","input":"1) A.up([[PAUSE, LA]]). 2) B.up([[PAUSE, LB]]). 3) A.up([[PAUSE, LA]]) again (duplicate). 4) A.up([[RESUME, LA]]). 5) B.up([[RESUME, LX]]) for an unknown LX. 6) B.up([[RESUME, LB]]).","expect":"After step 1-2 lockset = {LA, LB}, N paused. Step 3 (same-id repeat PAUSE) is idempotent — lockset unchanged. Step 4 removes LA; lockset = {LB}; N STILL paused (B's lock holds). Step 5 (unknown id) is a no-op. Step 6 removes LB; lockset empty; N truly resumes (fires once with latest dep values under default mode). Releasing one controller never resumes the node while another's lock is held.","note":"multi-pauser correctness by construction — paused state derives from lockset.size > 0. Rust arm GREEN 2026-05-29 (CSP-5): graphrefly-rs node.rs pause_lockset (HashSet) + up() PAUSE/RESUME (same-id idempotent, unknown-RESUME no-op) + default-mode coalesce (maybe_run skip-while-paused → on_resume fire-once-with-latest); conformance.rs::c5. de (the innermost fn that ran = the effect E). Whole-cascade wave-flag recovery via the thread-local WaveScope touched-set closes B25 (conformance.rs::c6 also asserts the post-error source re-emits its leading DIRTY — teeth-verified by disabling the emitted_dirty reset). Per-language impl (D24, like the AnyValue value-rep decision) — no spec-amend / no D#.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D37"},{"id":"C-7","name":"upstream control at a depless source","covers":["R-up-at-source"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"depless source S (cached value) → derived D → sink. D (or a sink on D) originates ctx.up([msg]) which forwards upstream to the terminus S.","input":"Three independent runs, one per upstream-allowed non-pause control kind: 1) D.up([[INVALIDATE]]). 2) D.up([[DIRTY]]). 3) D.up([[TEARDOWN]]).","expect":"INVALIDATE: S HONORS the invalidate-request — S.cache returns to SENTINEL, S's onInvalidate hook fires once, and S broadcasts INVALIDATE downstream so D (and the whole downstream cone) clears (D.cache → SENTINEL, D's onInvalidate fires). DIRTY: DROPPED at S — S unchanged (cache + status intact), NO downstream DIRTY, downstream is NOT left wedged awaiting a settle. TEARDOWN: DROPPED at S — S not terminated, NO downstream TEARDOWN. A node guard on S may deny the INVALIDATE (drops silently) — opt-out, not the default.","note":"B11 / D38. Closes the F-NO-IMPL-DEFINED gap on upstream control reaching a depless source. INVALIDATE-up is a cache-drop request (not an imperative write); DIRTY/TEARDOWN have no coherent terminus action. Dep-bearing intermediates forward only; source is the single actor, down-cascade the effect. Formal: wave_up_source.tla. Rust arm GREEN 2026-05-30 (CSP-6): Core::up — PAUSE/RESUME self-handle the lockset; otherwise a depless source (deps empty) is the terminus (INVALIDATE → self.down([INVALIDATE]) honor, DIR hed dep, atomic multi-add settle (in_dep_mutation defers maybe_run → ONE two-phase DIRTY→DATA via settle_rewire), Q6 unsubscribe_dep auto-settle (+ zero-dep un-dirty RESOLVED), first-run gate + cache preserved (Q2/Q7). Rejects panic-propagate externally (self-dep/cycle-DFS/terminal-self/terminal-dep/reentrant); a MID-FN rewire becomes [[ERROR,e]] via the wave-owner catch (R-reentrancy/D37, Rust substrate bundles the D30 catch). conformance.rs::c8 (surgical + terminal-reject) + node.rs 11 rewire unit tests; teeth-verified (disable box-reroute → reorder fails; disable atomic defer → fires on a partial SENTINEL view). rust uses the existing TLA+ (wave_rewire.tla + wave_rewire_emit.tla, SD-2 already met). py:todo (CSP-7).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D22,D42"},{"id":"C-9","name":"pausable:false async source ignores PAUSE (keeps producing)","covers":["R-pause-modes","R-async-paused"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"depless async-pool source S with pausable:false (timer/interval-class) -> sink.","input":"1) subscribe a sink to S. 2) S.up([[PAUSE, L1]]). 3) S's async fn resolves, emitting [[DATA, r]] while the lock is held.","expect":"DATA is delivered to the sink IMMEDIATELY (DIRTY+DATA), NOT buffered -- pausable:false ignores PAUSE/RESUME entirely; the lockset is never consulted and production continues through the PAUSE (contrast C-2, where a pausable compute node buffers). A subsequent RESUME is a no-op (nothing buffered).","note":"D44 -- pausable mode is the outer gate over R-async-paused; false dominates (resolves B20). Rust arm GREEN 2026-05-30 (CSP-6 Slice A): Node::producer_opts(pool:Async, pausable:False); should_buffer_on_pause returns false for Pausable::False, so the leaf source's deferred production delivers immediately ([DIRTY,DATA]) under a held lock. conformance.rs::c9_pausable_false_async_source_ignores_pause.","harness":"packages/ts/src/__tests__/conformance.test.ts + is observable (a flag set in onDeactivation).","input":"1) S [[DATA,v1]] -> OP requests subscribeDep(innerA). 2) wave settles -> drain -> innerA added+subscribed, cached DATA pushed [DIRTY,DATA]. 3) innerA DATA -> forwarded. 4) (switch) S [[DATA,v2]] -> OP requests unsubscribeDep(innerA)+subscribeDep(innerB). 5) drain -> innerA unsubscribed+drained, loses last subscriber -> _deactivate -> onDeactivation fires (cancellation observable); innerB added. 6) (merge) two inners live -> both forward. 7) an inner COMPLETEs -> unsubscribeDep -> drain removes it (bounding). Variants: IMMEDIATE in-fn this.subscribeDep (not via rewireNext) -> REJECTED (D37); rewireNext then OP terminal same wave -> queue still drains after terminal; no-net-change rewireNext -> no-op.","expect":"A rewireNext NEVER mutates _deps while _insideRunWave is true (deferred to the post-settle drain). The drain runs at the COMMITTED boundary (after batch commit / final-lock RESUME, never on an un-committed/paused view). Each queued op applied exactly once, in deterministic order (per-node FIFO, causal node order), as a fresh wave. Added cached dep pushes [DIRTY,DATA]; first-run gate NOT re-armed. Removed dep DRAINED (no stale DIRTY/DATA/INVALIDATE strands) and, if last subscriber, _deactivates + fires onDeactivation = observable input-side teardown (switchMap cancel/abortInFlight; mergeMap bounding). switch: only the current inner forwarded AND the superseded inner's source torn down (not merely masked). IMMEDIATE in-fn self-rewire still throws -> graph-layer ERROR (D37). Terminal OP still drains pending rewireNext requests at the boundary: unsubscribeDep releases the auxiliary dep (observable deactivation), subscribeDep/replaceDeps may change topology, and any later dep messages are absorbed by the terminal output guard (no downstream post-terminal DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR). No-net-change rewireNext = no-op (no boundary-drain loop). INTRA-graph only.","note":"D47/R-rewire-deferred, amended invalidate. The INVALIDATE×PAUSE analogue of D44/C-9/C-10 (async×PAUSE). Surfaced by the CSP-5 Rust /qa (finding A): the impl left paused_dep_wave_occurred set after an INVALIDATE → resume recompute against a SENTINEL dep → spurious ERROR (Rust) / garbage value (TS). Formal: wave_paused_invalidate.tla (ChangedImpliesLive + PendingReflectsChanges + NoAllSentinelRecompute), TLC-green 327 states + ChangedImpliesLive mutation-verified. BOTH ARMS GREEN 2026-05-29: TS (node.ts INVALIDATE branch + conformance.test.ts C-13 a/b/c) + Rust (node.rs receive_from_dep INVALIDATE branch attributed-cancellation + conformance.rs::c13) — both impl-fixes teeth-verified (disable the cancellation → C-13(a) fails: superseded wave recomputes). R-paused-invalidate flipped active. py:todo (CSP-7).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D50,D44"},{"id":"C-14","name":"cleanup hooks are per-run (cleared + re-registered each fn run)","covers":["R-cleanup-hooks"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"source S → derived D. D's fn registers BOTH ctx.onInvalidate(flush++) and ctx.onDeactivation(cleanup++) on EVERY run, then emits.","input":"1) S settles [[DATA,v1]] → D runs (registers run-1 hooks). 2) S [[DATA,v2]] → D re-runs. 3) S [[DATA,v3]] → D re-runs (D has now run 3×). 4) S.down([[INVALIDATE]]). 5) unsubscribe D's last sink (D deactivates).","expect":"After 3 runs, the INVALIDATE (step 4) fires onInvalidate EXACTLY ONCE (the current/run-3 registration), NOT 3× — the prior runs' onInvalidate registrations were cleared at each run-start and discarded without firing (D28 onRerun-cut). Deactivation (step 5) fires onDeactivation EXACTLY ONCE (run-3's), NOT 3×. A single-run node keeps its one registration (no re-run → no clear). Both hooks behave uniformly (clear-and-re-register).","note":"R-cleanup-hooks per-run lifecycle (D28 clarification, no new D#). Surfaced by the CS  No delivered wave is `[]`; a RESOLVED-only wave is `[[]]`; `[[DATA,1],[DATA,2],[INVALIDATE]]` projects as `[[1,2,SENTINEL]]`; DATA null projects as `[[null]]`; DATA [] projects as `[[[]]]`; two waves DATA null then DATA [] project as `[[null],[[]]]`. INVALIDATE uses the protocol SENTINEL marker (TS undefined / Rust-Py sentinel equivalent), which cannot collide with DATA because DATA(SENTINEL) is rejected by R-data-payload. COMPLETE/ERROR do not enter waveData; `ctx.terminal[i]` is false for no terminal, true for COMPLETE, or the legal non-boolean ERROR payload for ERROR. A helper such as track/current/latest, if present, is derived and must not change the raw ctx value shape. The dynamicNode variant can inspect `waveData[i]` to early-return on an unread-dep-only wave, producing only the substrate undirty RESOLVED, while a read dep DATA propagates normally.","note":"D77+D78. This conformance scenario replaces the ambiguous `depRecords.latest`/`prevData`/`batch` raw ctx wording with one canonical two-dimensional waveData contract: dep -> waves -> values/settle markers, plus separate lightweight terminal metadata. It is a ctx input-shape scenario, not a new message tier or wave-ordering rule. Formal: wave_ctx_wave_data.tla pins the distinguishability of no-wave vs RESOLVED vs DATA(null) vs DATA([]) vs DATA+INVALIDATE, the absence of a second modeled latest/prevData value source, and the terminal distinction between none/COMPLETE/ERROR payload. D78 also pins that ERROR false/true are invalid payloads, preserving the false/true terminal shorthand. TS ARM GREEN 2026-06-02 (D78 revised): @graphrefly/ts keeps ctx.terminal lightweight (false none, true COMPLETE, legal ERROR payload), rejects explicit ERROR undefined/false/true at the down boundary, coerces source-layer undefined/boolean host failures to Error before emitting ERROR, and C-23/raw ctx tests plus lifecycle/sources payload tests pass; pnpm --filter @graphrefly/ts test passes 349 tests. Rust ARM GREEN 2026-06-02: e to SENTINEL, did NOT re-arm N as never-run, and did NOT fire fresh cleanup hooks merely because the graph restored. A late subscriber after ready receives N's restored cached value directly through normal push-on-subscribe; restored dependency activation/push-on-subscribe does not by itself recompute, overwrite, or clear N's restored cache. Ordinary upstream DATA/INVALIDATE/terminal events after the restore commit may update N normally. The graph is not externally ready during async hydration; no partial restored state leaks before the restore commit. The restore commit is graph-boundary ordered: if applied to a live graph or via incremental diff replay, externally visible changes pass through the normal batch/wave/observe path rather than hidden mutation. The local-only anonymous node L is honestly marked non-cross-process-restorable and fails restore; a missing factory reference also fails restore. Storage tiers, WAL frame bytes, codecs, and content-addressed envelopes are not asserted by this scenario.","note":"D83 / B55 restore gate; D117 locks restored-cache late-subscribe semantics. This scenario promotes DS-1 Flag 1 into conformance: restore is state-preserving and distinct from fresh lifecycle. It also pins D25's factory-name model and D82's separation between graph restore semantics and storage binding/WAL details. Formal: wave_snapshot_restore.tla models async load outside the core, a single restore commit, state/cache/topology preservation, direct restored-cache late subscribe, local-only/missing-factory failure, and no ready/partial state before commit. TS ARM GREEN 2026-06-06: @graphrefly/ts restoreGraph coverage includes restored-cache late subscribe, no recompute from restored dep activation/push-on-subscribe, post-commit source activation as an ordinary wave, pre-activation rewire clearing restored seed state, local-only/missing factory failure, strict checkpoint JSON/version checks, terminal restore, built-in factory restore, and restore dispatcher coverage; pnpm --filter @graphrefly/ts test => 609 pass; pnpm run lint => green; pnpm run build => green. Py runtime arm remains todo until snapshot/restore APIs land. Rust ARM GREEN 2026-06-06: graphrefly-rs conformance.rs::c24_snapshot_restore_preserves_state_and_rejects_local_only_factories covers restored-cache late subscribe, restored dep activation/push-on-subscribe no hidden recompute, restored ctx.state preservation, post-commit upstream DATA as an ordinary wave, describe-visible edge, local-only restore failure, missing registry descriptor failure, V0 node runtime version metadata restore after B68, strict canonical JSON number validation, and ERROR terminal payload fail-honestly behavior. Verified with `mise exec -- cargo test -p graphrefly-rs --test conformance -- --nocapture`, `mise exec -- cargo test -p graphrefly-rs --test graph_layer -- --nocapture`, `mise exec -- cargo test -p graphrefly-rs restore_preserves_ctx_state_for_later_runs -- --nocapture`, `mise exec -- cargo test -p graphrefly-rs`, `mise exec -- cargo clippy --workspace --all-targets`, and `mise exec -- cargo build`.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs + graphrefly-py tests/conformance","ref":"D25,D57,D82,D83,D117,R-snapshot,R-restore"},{"id":"C-25","name":"deferred self-boundary tasks drain only after batch commit and final RESUME","covers":["R-rewire-deferred-committed-boundary","R-rewire-deferred","R-rewire-batch-boundary"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"One graph (D22). Source S feeds operator OP. OP owns a ctx.rewireNext.subscribeDep boundary task variant and a ctx.upNext RESUME(pullId) self-demand variant; helper dep H is an already-cached source so added-dep push-on-subscribe would be observable. OP has an external observer that records emitted waves and describe-visible deps. Batch facet uses g.batch(() => S.down([[DATA,v]])); pause facet queues the boundary task in a wave where OP becomes paused before the outer boundary drain.","input":"(a) batch commit: inside an open batch, S DATA causes OP to issue ctx.rewireNext.subscribeDep(H, fn). The batch has a pending old-shape settle. Observe OP before the batch returns, at batch commit, and after the post-commit boundary drain. (b) batch rollback: the same setup, but the batch throws or bctx.rollback() is called before commit completes after the boundary task has been queued under the uncommitted batch. Variants cover subscribeDep, unsubscribeDep cleanup, replaceDeps, and ctx.upNext self-demand. (c) pause: OP issues ctx.rewireNext.subscribeDep(H, fn) or ctx.upNext([[RESUME,pullId]]) in a wave; before the outermost wave boundary drains, OP holds a pause lock. Release a non-final lock first if multiple locks exist, then release the final lock. (d) combined ordering: when both an open batch and a pause lock exist, commit and RESUME may occur in either order; the task is ready only after both gates open, and never after rollback.","expect":"The queued self-triggered task is not applied inside OP's fn, not while batch() is open, not after a rolled-back/non-committed batch, and not while OP remains paused. During a successful batch, describe-visible deps stay old-shape and the pending old-shape settle commits before H is added or a self-demand routes; added H does not activate/push cached DATA until after the batch commit. During rollback, the deferred tier-3/4 settle slice is discarded, the already-visible DIRTY is balanced by RESOLVED, and no queued boundary task survives: subscribeDep does not add/activate H, unsubscribeDep does not unsubscribe/deactivate helper work, replaceDeps does not mutate topology, and ctx.upNext does not route demand. During pause, deps/topology/demand state stay unchanged after non-final RESUME and until the final-lock RESUME; only then does a committed queued task drain as a fresh wave. In the combined facet, draining requires run-ended AND batch-committed AND unpaused. FIFO/order and terminal/no-net-change semantics remain inherited from C-11; external rewire batch ordering remains inherited from C-22.","note":"B24 + D110 spec-amend. This is a committed-boundary timing and rollback-fate scenario, not a new rewire operation and not a new protocol message. Formal: wave_rewire_deferred_committed.tla TLC-green on 2026-06-04 after the D110 rollback extension (91 generated / 33 distinct / depth 6), modeling run-end + batch commit/rollback + final RESUME gating with invariants NoDrainDuringRun, NoDrainBeforeBatchCommit, NoDrainAfterRollback, NoDrainWhilePaused, AppliedOnlyOnCommittedView, DroppedTaskDoesNotMutate, OldShapeUntilReady. TS ARM GREEN 2026-06-04: @graphrefly/ts tags queued ctx.rewireNext/ctx.upNext boundary tasks with their causing batch frame and owner-readiness predicate; rollback/throw/commit-failure drops uncommitted tasks, successful batch commit drains after the old-shape batched settle, and paused owners drain only after final RESUME. Focused C-25 tests cover successful batch old-shape settle before subscribeDep drain, rollback dropping subscribeDep/unsubscribeDep/replaceDeps/upNext effects, pause final-lock gating, and combined batch+pause orderings. Rust ARM GREEN 2026-06-05: graphrefly-rs defers self boundary Rewire/Up tasks while the owner remains paused, re-registers a batch boundary root when final RESUME happens inside an open batch, and passes the C-25 rollback/commit/pause/combined facets in crates/graphrefly/tests/conformance.rs. py remains todo. Storage durability failure remains governed by D93 and does not retroactively roll back graph commits.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs + graphrefly-py tests/conformance","ref":"D47,D67,D110,R-rewire-deferred,R-rewire-batch-boundary,B24"}],"flowcharts":[{"id":"FC-1","title":"wave propagation (diamond coalesce)","area":"wave","explains":["R-diamond","R-tier"],"me
