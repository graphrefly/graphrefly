e pull port pointless; lazy makes it P*O(n) with P<<M for the append-heavy/occasionally-read niche the pull port exists to serve). demand-on-no-change delivers nothing (R-pull coalesce). (3) The snapshot node has NO persistent value of its own -- its fn reads the backend on demand, so the backend stays the single source of truth (no companion cache that can drift). (4) MUTATION INPUT = D54 A3 hybrid: imperative .append/.set/... (state-verb-legitimate, D4) call backend.mutate directly (no effect); the T|Node<T> widening wires an in-graph producer as a declared dep whose handler calls backend.mutate (an INPUT-side fold -- appends, does NOT build snapshots; orthogonal to the output ports). (5) SHARED CORE: an internal collectionCore<Backend> (NOT exported) provides {version-gated delta emit + the pull-snapshot node + the widening hook}; reactiveList/Map/Index/Log = core + their backend + typed method surface (D54 same-skeleton survey). SNAPSHOT-NODE TOPOLOGY (reactiveList /design-review 2026-05-31, impl guidance not a new D#): the DELTA stream is the structure's BACKBONE and the snapshot pull-node SNAP declares dep=[delta] -- each mutation's delta wave puts SNAP into quiet-absorb (R-pull keeps per-dep dirty/pending accounting while suppressing the downstream DIRTY), so demand-on-no-change coalesces to no-delivery FOR FREE via R-pull's own accounting (no imperative mark-dirty glue, no separate pending tracker), and SNAP->delta is a real protocol edge describe can show (D3). Consequence: delta is NOT an opt-in companion log (as in the frozen ref's mutationLog) but a mandatory structural port; an opt-in DELTA-LOG (retained history) MAY still layer on top. PER-STRUCTURE SPECIALIZATION (#3-#5 /design-review 2026-05-31, impl guidance not a new D#): reactiveMap -- (a) active-TTL is LAZY-ONLY first cut: expiry checked on read/prune + before snapshot materialization, NO background timer; active periodic sweep (interval-source composition, D52) is DEFERRED (backlog, no-silent-cap doc); (b) a read (get/has) that discovers an expired key prunes it but does NOT push -- under the lazy-pull snapshot model the pruning is reflected on the NEXT demand, which DISSOLVES the old core's spec-5.8 'read-as-observable-side-effect' emission (cleaner than the frozen ref); (c) delete-reason enum {expired|lru-evict|archived|explicit} RETAINED (delta-port semantics); (d) retention (score-archive) + LRU maxSize RETAINED -- archival is part of the atomic mutation (NOT a second wave / feedback cycle, D37/D45-aligned); LRU touch does not bump version (D60 version-gated emit covers it). reactiveIndex -- secondary lookup = Z (user): has/get/rangeByPrimary are SYNC point-reads over the backend's parallel Map (NOT topology, like .cache); byPrimary stays an OPTIONAL reactive derived over the ordered snapshot (D54 'byPrimary=derived') but LAZILY activated (no default keepalive -- live only while externally subscribed, R-rom-ram RAM), dispose releases it; the two coexist (derived = reactive reverse-lookup port, sync read = point query). reactiveLog -- (a) entries full-snapshot = lazy pull like the others, BUT view(tail/slice/fromCursor)/scan re-derive as INCREMENTAL derived deps on the DELTA backbone (tail/scan are inherently incremental -> natural fit; not on a pushed full array); (b) empty/never-set lastValue = SENTINEL (prevData===undefined), NOT the frozen ref's [[RESOLVED]]-for-empty dual-role (D49 narrowed RESOLVED to undirty-only); (c) append(undefined) throws -- reason updated to 'undefined is the substrate SENTINEL, not a valid DATA payload' (R-data-payload), not the retired hasLatest disambiguation; (d) attach(upstream) = the D54 Node<T> widening in log form = a declared input-fold dep (describe-visible), NOT the frozen ref's imperative upstream.subscribe; skipCachedReplay handles push-on-subscribe (feedback_subscribe_before_kick); (e) mergeReactiveLogs MUST-FIX: the frozen ref's internal logs[i].subscribe is a D45 island ('invisible in describe') -> re-derive as a DECLARED-DEP merge/concat combinator (deps=[...logs], partial), same class as D56's stratifyBranch island fix; (f) attachStorage = D57 (binding-layer observe-sink, async out of wave core), out of data-structure scope. SNAPSHOT MATERIALIZATION (per-language impl, D6/D24): first-cut default = defensive toArray() copy (safe, the pull read is O(n); matches the frozen-ref NativeListBackend.toArray [...buf]); an immutable/persistent backend (zero-copy O(1) pull of the read-only cache) is a pluggable ListBackend option, deferred. Per-language (D6/D24, never parity, no conformance -- the substrate pull is already C-16). Carries D54 dissolutions: equals removed (version-counter idempotency, D49), describeKind dropped, empty/never-set log = SENTINEL, index.byPrimary = derived over the ordered snapshot.","rationale":"The backend already accumulates deltas into a materialized state; re-deriving that state through an ACC node + effect duplicates an intrinsic cost for nothing -- the snapshot port should read the backend directly (user correction of the prior review's ACC/effect misdesign). Two ports (cheap delta watch + lazy O(n) snapshot-on-demand) is exactly the D55 STREAM+SNAPSHOT shape and exactly what R-pull/C-16 already implement: a large collection never push-fans the full array per change, and the snapshot is materialized only when a consumer actually pulls (P*O(n), not M*O(n)). Lazy is load-bearing: an eager companion state.set(copy) on every mutation re-imposes the per-change O(n) and strips the pull port of its only justification. The backend (a closure, not a node) carries durability structurally, so node ROM/RAM is moot. The Node<T> widening is an input-side append fold, unrelated to snapshot output -- correcting the prior review's conflation of the two. Shared core avoids 4 near-identical impls (D5/F-NO-WEDGE-CUT).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D61","layer":"L1.5","date":"2026-05-31","question":"CSP-2.8 reactiveCollection corrections after QA: must input folds be graph-bound/describe-visible, and should TTL materialized prune push a delta?","decision":"Two D60 sub-clauses are corrected/locked. (1) Reactive collection input folds MUST be graph-bound and describe-visible: any T|Node<T> widening / bindSource / attach-style input that causes an upstream Node to mutate the collection backend is a declared graph dependency, wired through a graph-owned factory/funnel (for example g.reactiveList(...) or reactiveList(...,{graph}) / equivalent per-language shape). It MUST NOT subscribe to a graph node internally from an invisible closure. This keeps D3/D39/D45 truthful: the input edge that drives backend mutation appears in describe() and uses the normal dispatcher + D30 throw-to-ERROR boundary. (2) TTL expiry materialized by get/has/prune/snapshot-prep is a real backend mutation and therefore emits the normal DELTA delete event with reason:'expired'. A read that only observes time without changing the backend emits nothing; a read/prune that deletes an expired entry changes backend version/content and MUST push the delete delta. This replaces D60's narrower 'read prune does NOT push' guidance. Active/background TTL sweep remains deferred; lazy expiry is still the first cut.","rationale":"QA found that an invisible bindSource would recreate the exact island D45 banned: topology affects behavior but describe cannot show it. Graph-bound input folds preserve the graph-first/narrow-waist model while keeping collectionCore internal and per-language (D6/D24). For TTL, the user's correction is decisive: if prune changes the backend, it is not merely a read; suppressing the delta leaves subscribers with a stale event view and makes the DELTA port incomplete. The accepted caveat is explicit: get/has can be observable only when they materialize expiry; this is a bounded GC-like mutation, not arbitrary read-as-side-effect. D60 otherwise remains intact: one backend, delta+pull snapshot ports, lazy snapshots, lazy-only TTL first cut.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D62","layer":"L2-Q23","date":"2026-05-31","question":"Should ctx.rewireNext requests queued by a node fn be discarded if the node becomes terminal in the same wave, or should terminal only guard downstream output while deferred topology still drains?","decision":"Terminal is an OUTPUT/LIFECYCLE guard, not a deferred-topology cancellation condition. A node that becomes terminal during its fn run still drains its already-queued ctx.rewireNext addDep/removeDep/setDeps requests at the committed wave boundary, in the same FIFO/order semantics as any other deferred rewire. The terminal status remains final: the node MUST NOT emit any post-terminal downstream DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR, non-resubscribable late subscribe remains rejected by R-terminal, and a resubscribable reset starts the next lifecycle from the node's current dep set after the drained topology changes. Immediate/external rewire of a terminal node remains rejected by R-rewire/C-8; this exception is only for self-triggered deferred rewire requests that were issued before terminal and apply at the boundary. This supersedes the D47/R-rewire-deferred sub-rule that terminal discarded the pending queue.","rationale":"The earlier terminal-discard rule was a conservative zombie-work guard: if addDep applied after COMPLETE, a dead node could subscribe to a new timer/inner and start upstream work even though no downstream output could legally escape. The user correction narrows the actual invariant: terminal must seal output, not freeze topology. Rewire expresses the author/agent's topology intent; if that intent includes a post-terminal cleanup removeDep (bufferTime interval teardown) or even an add/set, the substrate should apply it while preserving terminal-is-forever. This removes the need for a special owned-dep cleanup API and lets ordinary rewireNext.removeDep release helper-owned resources. Accepted cost: a mis-authored addDep after terminal can start upstream work that the terminal guard drops; this is a resource bug in that operator, not a wave-protocol violation. No message tier or ctx.up/down shape changes.","supersedes":["D47"],"status":"locked","session":"DS-1"}],"phases":[{"id":"CSP-0","title":"spec finalize (rules + .proto IDL + .tla + conformance scenarios)","status":"done","deps":[],"sessions":["DS-1"],"gap":false,"note":"DONE 2026-05-28: 52 rules (B7 migration), protocol.proto IDL (DR-2), conformance C-1..C-5 detailed, formal modules wave_xgraph/wave_async/wave_async_paused (C-1/C-4/C-2) TLC-green + existing wave_protocol (C-3/C-5); dashboard gate green. Rules status=draft until CSP-1+ impl arms flip them active. Unblocks CSP-1/CSP-5/CSP-7"},{"id":"CSP-1","title":"TS substrate: node/dispatcher/pool(LocalSync+LocalAsync)/wave protocol","status":"impl","deps":["CSP-0"],"sessions":["DS-1"],"gap":true,"note":"kernel landed @graphrefly/ts 2026-05-28 (packages/ts): node + dispatcher + LocalSync/LocalAsync pools + wave protocol + lifecycle + control(PAUSE/async) + batch + dynamicNode; 36 tests + tsc + tsup(ESM/CJS/DTS) + biome all green. /qa DONE 2026-05-28 (41 tests; fixes EC1/EC2/EC3/BH1/BH3/BH6). Pending: CSP-3 conformance to flip draft rules active. Deferred refinements B8/B9 (impl polish). B10 (re-entrancy reject, D37/R-reentrancy) + B11 (up-at-source, D38/R-up-at-source) LANDED 2026-05-28 (node.ts _runWave guard + _up terminus rule; reentrancy.test + up-source.test). R-reentrancy/R-up-at-source flipped active via C-6/C-7 TS arm"},{"id":"CSP-2","title":"TS graph layer: graph/sugar(8 verb)/operators/inspection(describe·observe·profile)","status":"impl","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"graph layer landed @graphrefly/ts 2026-05-28: Graph + 8-verb sugar (node/state/producer/derived/effect/batch/mount + StateNode.set) with D27 sugar→ctx-fn wrapping + D30 throw→ERROR boundary; core operators map/filter/scan/merge/take/distinctUntilChanged (D6 real factory names); inspection describe (D39 flat snapshot + explain + mount ::) / observe (read-only enveloped egress) / profile (opt-in dispatcher-recorder, counters off the thin node). 76 tests + tsup(ESM/CJS/DTS) green. C-6/C-7 TS conformance green. /qa DONE 2026-05-28 (77 tests; fixes A-1 observe :: subtree boundary, A-2 up-INVALIDATE via _down for batch/pause consistency, D-2 profile totalInvokes graph-scoped; spec precision D-1 R-reentrancy/C-6 'located at a node on the cycle' + D-3 R-observe/D19 'read-only≠activation-free'; QA-deferred → B12/B13). rust/py arms (CSP-5/7) + R-describe/observe/profile per-language. Inspection streaming/live-topology deferred to viz | D43 (2026-05-29): the 6 operators refactored from g.* methods to free-standing factory definitions instantiated via the generic g.initNode funnel (CSP-2.6); describe/observe/profile inspection UNCHANGED (_entries-based)."},{"id":"CSP-2.5","title":"substrate rewire (setDeps/addDep/removeDep, intra-graph; R-rewire active via C-8)","status":"impl","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"D40 Catalog-first prerequisite: rewire is SUBSTRATE (not sugar) — needed by higher-order operators (mergeMap/switchMap/concatMap/exhaustMap/flatMap = runtime inner-subscription). SEMANTICS LOCKED D42 (ratifies port-model Q1–Q7 + clean-slate floor; SD-1 required-fn; SD-2 cross-axis formal before active). SPEC-AMEND DONE 2026-05-28: R-rewire refined; formal/wave_rewire.tla (per-node Q1–Q7 + rewire×INVALIDATE + rewire×terminal) TLC-green 603k states, 2 new invariants mutation-verified; C-8 finalized. TS IMPL LANDED 2026-05-28: setDeps/addDep/removeDep on @graphrefly/ts Node (dynamic-index dep dispatch for surgical reorder, fn-swap re-register, push-on-subscribe for added cached dep, drain-on-remove, Q6 auto-settle, all D42 rejects); C-8 TS arm GREEN + rewire.test.ts (12 unit) → 91 tests pass, lint clean. B14 DONE 2026-05-28: formal/wave_rewire_emit.tla (rewire×equals + rewire×multi-sink) TLC-green 3003 states, 2 mer triggers rewire/throw from within a push-driven recompute (or a user onDeactivation hook / added-dep activation fn panics mid-rewire); harden with a try/rollback around the added-dep subscribe loop (TS) / perform the full dep-array rebuild BEFORE any re-entrant u()/subscribe and roll back on a rewire-internal panic (Rust), or restructure subscribe() to hand back the unsub before the sync push","lang":"all","ref":"D42,R-rewire,/qa-2026-05-28,/qa-2026-05-30"},{"id":"B17","title":"rewire × async-pool late ctx: a deferred async invocation whose ctx.up/ctx.down fires AFTER the node was rewired routes to the NEW dep set (ctx closes over `this`), not the deps live when the fn started. Arguably correct ('the node is whatever it is now') but unmodeled — R-rewire vs R-async-paused interaction","state":"deferred","trigger":"a consumer observes a surprising late-emit routing after rewiring an async-backed node; decide + spec-note the scoping (live-edge vs wave-snapshot) and add a conformance scenario","lang":"all","ref":"D42,R-rewire,R-async-paused,/qa-2026-05-28"},{"id":"B18","title":"rewire × paused coalesce flag: _pausedDepWaveOccurred is not reconciled when a rewire removes the very dep whose pending wave set it → one spurious post-RESUME recompute (self-heals on next settle, no corruption)","state":"deferred","trigger":"observed spurious recompute after resume-following-rewire; clear/recompute _pausedDepWaveOccurred consistency in _rewire","lang":"ts","ref":"D42,R-rewire,R-pause-modes,/qa-2026-05-28"},{"id":"B19","title":"rewire × batch: a tier-3 wave deferred into an open batch() (deferToBatch) then a rewire of the same node within the same batch → __commitBatchedWave commits the PRE-rewire value/fn against the rewired node at commit; ordering vs the rewire's atomic settle undefined. wave_rewire.tla models no batch axis","state":"deferred","trigger":"a consumer rewires a node mid-batch; either reject rewire while a batch defer is pending on this node, or model+pin the  a sources/ dir (biome noRestrictedGlobals override or a packages/ts layer-boundary analog), else R-no-raw-async leaks anywhere in the clean-slate package. — RESOLVED 2026-05-29: added scripts/check-no-raw-async.ts (comment-aware scan of packages/ts/src, allowlist=graph/sources.ts only; matches setTimeout/setInterval/setImmediate/queueMicrotask/process.nextTick/new Promise/Promise.<combinator>/for await/async/await) wired into `pnpm lint` (+ lint:no-raw-async). Baseline green (sources.ts is the sole sanctioned boundary), teeth-verified (a probe setTimeout/new Promise is flagged). Matches the check-layer-boundary.ts custom-script precedent (biome GritQL/noRestrictedGlobals can't express the full R-no-raw-async surface). Add the pool/runner file to ALLOW when a real async pool (D20) lands.","lang":"ts","ref":"D43,R-no-raw-async,F-SYNC-CORE"},{"id":"B23","title":"wall-clock time-source primitive for time operators (delay/debounce(Time)/throttle(Time)/audit/timeout/bufferTime/windowTime): a resettable/cancellable timer source so these operators get elapsed-time without a raw setTimeout in the operator body","state":"resolved","trigger":"a consumer needs a wall-clock time operator; design a resettable/cancellable time-source (async confined to sources.ts, R-no-raw-async) or wait for a mature async pool (D20/B1). Until then the first CSP-2.7 cut ships only notifier-driven forms (sample/buffer/window). RESOLVED 2026-05-30 by D52: no new primitive needed — wall-clock time operators decompose into *Map(switchMap/exhaustMap/mergeMap/concatMap)+timer (the timer's onDeactivation clearTimeout = the reset/cancel) and buffer/window(notifier)+interval; probe-verified (switchMap+timer debounce, boundary-deferred cancel). They REJOIN the CSP-2.7 implementable catalog (per-language, no substrate change). The original 'design a resettable time-source primitive' framing is dissolved (stale premise: predated the D47 *Map landing).","lang":"ts","ref":"D46,R-no-raw-async,D20"},{"id":"B24","title":"rewire-deferred drain x batch/pause timing: R-rewire-deferred drains the ctx.rewireNext queue at the COMMITTED boundary (after batch() commit / final-lock RESUME), but wave_rewire_deferred.tla models the boundary as EndRun (insideRunWave false) WITHOUT a batch/pause-deferral axis (design-review option b)","state":"deferred","trigger":"a consumer issues ctx.rewireNext inside an open batch() or while a pause lock is held; pin + model the committed-boundary gating (shared semantics with the immediate-rewire x batch axis B19) + add a conformance variant","lang":"all","ref":"D47,R-rewire-deferred,B19,D12"},{"id":"B25","title":"graphrefly-rs: a panicking user fn corrupts wave-flags on the unwind path (source down() + receive_from_dep leave emitted_dirty/dep_batch stale; only run_wave's own node is reset by WaveGuard inside_run_wave)","state":"done","trigger":"RESOLVED 2026-05-29 (CSP-5 control/terminal slice, /dev-dispatch) — chose 'catch at a single wave-owner boundary and reset the touched set' (the second listed option; user-approved Phase 2). A thread-local WaveScope {owner, touched: Vec<Core>, blamed} is installed by the outermost public mutating entry (subscribe/down/up/set via with_wave_owner); the cascade runs under catch_unwind. Every node that mutates a transient wave-flag enrolls in touched (receive_from_dep / down / run_wave). On a caught panic, reset_wave_flags() restores each touched node to its between-wave baseline (inside_run_wave/emitted_dirty/emitted_tier3/pending/dep_batch/dep_dirty), leaving PERSISTED state (cache/dep_prev/dep_has_data/status/ctx.state) intact; then [[ERROR,e]] is emitted from blamed (the innermost fn that ran = a node ON the cycle, D30). The decentralized RAII alternative was rejected (can't cleanly reset dep-level dep_dirty/pending that span multiple receive calls). Teeth-verified: disabling the emitted_dirty reset makes conformance.rs::c6 fail (source drops its leading DIRTY). The WaveScope is forward-load-bearing — the same committed wave boundary batch (D12) + ctx.rewire_next deferred drain (D47) will reuse. Per-language impl (D24), no spec-amend/D#. node.rs + tests/conformance.rs::c6.","lang":"rust","ref":"D30,D37,R-dirty-before-data,CSP-5,C-6"},{"id":"B26","title":"formal cleanup: sweep the now-dead perSourceEmitCount ghost var in wave_protocol.tla — write-only since D49 removed its only reader (EqualsFaithful); decl/init/var-list/increment sites remain, accurately annotated at ~line 378","state":"deferred","trigger":"a future wave_protocol.tla pass; PURE-COSMETIC (no behavior/correctness impact, all 16 MCs green with it present). Removal touches ~6 sites + re-runs the 16 wave_protocol MCs; not worth a standalone pass.","lang":"all","ref":"D49,R-resolved-undirty"},{"id":"B27","title":"D49 TS substrate impl -- NEXT /dev-dispatch (packages/ts): remove auto-equals-substitution per D49/R-resolved-undirty (Opt-3). Queued continuation of the D49 spec-amend; spec + formal are already DONE.","state":"done","trigger":"next chat session, via /dev-dispatch on packages/ts. STEPS: (1) node.ts -- remove the DATA->RESOLVED equals-substitution (~lines 846-849: if dataCount===1 && _hasData && _equals(cache,v) -> emit RESOLVED) so every value-occurrence emits DATA; remove NodeOptions.equals + the _equals field + defaultEquals; KEEP every undirty RESOLVED path (filter-reject/no-emit, zero-dep un-dirty ~421, INVALIDATE-no-populate ~527, batch-rollback balance ~1053) -- those are R-resolved-undirty (substrate-synthesized). The tier-3 exclusivity guard (~814-820) stays, re-justified as occurrence(>=1 DATA) XOR undirty(1 RESOLVED). (2) drive conformance C-12 green (fromIter([1,1,1])->3 DATA; take(3)->[1,1,1]; filter-reject-all->synthesized undirty RESOLVED, no wedge; distinctUntilChanged->[1,2] opt-in dedup) -> flip R-resolved-undirty draft->active. (3) landed operators: distinctUntilChanged is THE dedup primitive (own eq via ctx.state, unchanged); map/filter/scan/take/merge now emit DATA on unchanged output (behavior change) -- fix any test asserting RESOLVED-on-unchanged. (4) FOLD packages/ts/src/__tests__/_probe.test.ts (the fromIter([1,1,1])/take(3)/state-set-same probes that surfaced this) into C-12 regression tests, then remove _probe.test.ts. (5) rust/py substrate arms + C-12 rust/py (CSP-5/7). THEN CSP-2.7 Slice A resumes correct-by-construction (occurrences are DATA -> take/scan count occurrences). Run /qa after. — DONE 2026-05-29 (/dev-dispatch TS arm): node.ts removed equals-substitution (NodeOptions.equals/_equals/defaultEquals deleted) + ADDED substrate-synthesized undirty RESOLVED (_emittedSettleThisWave flag; status resolved/sentinel by cache freshness; ASYNC-pool exempt -- deferred fn-return != reject, else premature diamond settle C-4); operators.ts unchanged (already D49-style); C-12 ts:pass (folded _probe + trashed); R-resolved-undirty flipped active; dynamicNode Option A (read-mask -> B28); 117 tests + lint + build green. rust D49 substrate ALREADY landed (CSP-5); C-12 rust/py + py substrate pending CSP-6/7. /qa next.","lang":"ts","ref":"D49,R-resolved-undirty,C-12"},{"id":"B28","title":"dynamicNode unread-dep silence via read-mask (D47 'track=read-mask'): under D49 a dynamicNode re-emits as DATA on an unread-dep change (no equals-absorption), losing its auto-quiet-on-unread-deps property; restore via a substrate read-mask that suppresses a wave driven only by untracked deps","state":"resolved","trigger":"a consumer needs dynamicNode to stay silent when only unread deps change (today: pair with distinctUntilChanged). Design via /design-review + /spec-amend (amend R-dynamic-node behavior + add a conformance scenario + formal); D47 frames track() as a read-mask. NOT in D49/B27 scope (D49 chose opt-in dedup everywhere, user-approved Option A 2026-05-29) RESOLVED 2026-05-30 by D53: substrate read-mask REJECTED -- dynamicNode auto-quiet is opt-in composition (dynamicNode + distinctUntilChanged), consistent with D49. The read-mask (A) was verified SOUND (causal-irrelevance absorption) but is documented + re-openable, not implemented (noise-not-correctness, trigger-gated, F-PERF). Zero behavior change; R-dynamic-node statement updated.","lang":"all","ref":"D49,D35,D47,R-dynamic-node,R-resolved-undirty"},{"id":"B29","title":"graphrefly-rs D30 catch depends on panic=unwind: the CSP-5 wave-owner catch_unwind converts a feedback-cycle / user-fn panic -> [[ERROR,e]] (the Rust throw analogue). Under a consumer's panic=abort release profile catch_unwind is a no-op and the process aborts instead -> the C-6 mechanism fails (no ERROR, hard crash on a sync feedback cycle)","state":"open","trigger":"before the Rust pre-1.0 release, or as soon as a consumer ships with panic=abort. Two-part fix: (1) NEAR-TERM document the panic=unwind requirement on the crate (and consider a compile-time assert / build.rs guard so panic=abort is caught loudly). (2) CLEANER LONG-TERM once the Rust graph layer (CSP-2-rs) lands: give value-level sugar a Result-returning fn channel (Err -> [[ERROR,e]] WITHOUT panic), reserving panic-catch only for the reentrancy guard + genuine substrate bugs. Constraint to weigh: R-sync-core's fn is Fn(&Ctx)->() (no Result today) and R-reentrancy mandates an UNWIND (the guard must throw, not gracefully return) -> panic-catch can be narrowed but not fully eliminated. Surfaced by the CSP-5 control/terminal slice /dev-dispatch (D30 catch landed via catch_unwind).","lang":"rust","ref":"D30,D37,R-reentrancy,R-sync-core,CSP-5,C-6"},{"id":"B30","title":"@graphrefly/ts node.ts _down lacks a terminal-is-forever guard at entry: a self-emit DATA via set()/ctx.down on a Completed/Errored node runs the DATA arm unconditionally and resurrects the node (overwrites cache, emits DATA). Only the COMPLETE/ERROR arms self-guard; terminal-is-forever is enforced only in _receiveFromDep — DONE 2026-05-30 (@graphrefly/ts /dev-dispatch + /qa): node._down gained an entry terminal-is-forever guard (if (_terminal !== undefined) return) so a post-terminal self-emit (state.set / ctx.down) is a no-op — DATA/RESOLVED/INVALIDATE had no entry guard before, only COMPLETE/ERROR self-guarded; matches the upstream _receiveFromDep guard + the Rust Core::down blanket guard (D17/R-terminal). lifecycle.test.ts B30 self-emit test, mutation-verified. NOTE: QA F1 (TEARDOWN-relay-past-COMPLETE) was mis-attributed to B30 — the drop is the pre-existing _receiveFromDep terminal guard, a separate spec gap filed as B33; QA F3.1 (rollback post-terminal RESOLVED) is unreachable (batch defers all tier≥3 incl COMPLETE, so a node cannot go terminal synchronously mid-batch). Both reverted; only the F2.1 stat-clear hardening landed (folded into B15).","state":"done","trigger":"the Rust arm fixed this in the CSP-5 control/terminal slice (node.rs Core::down early-returns when terminal — QA finding F, parity-consistent gap found in BOTH arms). Mirror in @graphrefly/ts: add an `if (this._terminal !== undefined) return;` (or per-arm guards on DATA/RESOLVED/INVALIDATE) at the top of _down so self-emission after terminal is a no-op (terminal-is-forever, R-terminal / D17). Low reachability (a state node explicitly completed then set()), but it is an active-rule invariant. Add a regression test (set on a terminal node is a no-op).","lang":"ts","ref":"D17,R-terminal,CSP-5"},{"id":"B31","title":"on_invalidate (+ on_deactivation) cleanup hooks accumulate across fn re-runs (push-only, cleared only on deactivate) -> the K-th INVALIDATE fires K hooks (unbounded growth + multi-flush). Parity-consistent: BOTH @graphrefly/ts and @graphrefly/rust","state":"done","trigger":"RESOLUTION CHOSEN 2026-05-29 (/qa finding E, user pick = option 1): clear-at-run-start + re-register (React effect-cleanup semantics) -- at run_wave start clear on_invalidate before the fn re-registers, so only the current run's hooks survive. DESIGN NUANCE to settle: on_deactivation may want DIFFERENT semantics per-hook (a fn that acquires a NEW resource each run + registers its release wants accumulate-all; a fn re-registering ONE logical cleanup wants clear-and-re-register). Route via /spec-amend (refine R-cleanup-hooks per-run lifecycle) + a conformance scenario, applied to BOTH arms together (NOT a unilateral per-arm patch). Not urgent (C-3 invalidates once, doesn't expose it). — DONE 2026-05-29 (/spec-amend, user-approved: on_deactivation UNIFIED with on_invalidate = clear-and-re-register both; no new D# = D28 clarification). R-cleanup-hooks amended (per-run lifecycle: clear both hook lists before each fn invoke, re-register from the fn body, superseded discarded WITHOUT firing per the onRerun-cut); C-14 added ts:pass+rust:pass. TS: _runWave clears both lists + effect sugar simplified (dropped register-once+ctx.state pattern → re-register every run, since the per-run clear makes accumulation impossible). Rust: run_wave clears both. Both teeth-verified (disable clear → C-14 flush=3 not 1). 123 TS + 19 Rust tests + lint/clippy/fmt green; dashboard gate green. py:todo (CSP-7).","lang":"all","ref":"D28,R-cleanup-hooks,C-14"},{"id":"B32","title":"@graphrefly/rust dispatcher Pool::fns (Vec<NodeFn>) only pushes, never removes -- a registered fn (capturing Node/Core handles) lives for the process; deactivate/drop never frees it, so the node's NodeInner never drops. Node:Clone (CSP-5) makes capturing handles-into-fns idiomatic (C-6 does it), so the leak bites harder","state":"done","trigger":"RESOLUTION CHOSEN 2026-05-29 (/qa finding H, user pick = option 3): slotmap/generational pool -- handle = (slot, generation); deactivate/drop recycles the slot, invoke validates the generation. Replaces the index-as-handle_id Vec. RUST-ONLY -- TS is UNAFFECTED (TS has its own FactoryRegistry; the pool/registry is a per-language impl detail D24; conformance does not test pool internals). Sibling of B15 (TS rewire fn-swap handle GC): same problem shape, separate code -- design together for consistency, fix separately. Trigger: before CSP-2.7 higher-order operators (frequent rewire/fn-swap) ship, or if a long-running graph's pool growth is observed. Pre-existing (dispatcher predates the control/terminal slice). — DONE 2026-05-29 (/dev-dispatch, Rust-only): dispatcher.rs Pool = slotmap {slots: Vec<Slot{f:Option<NodeFn>, generation}>, free: Vec<u32>}; register reuses freed slots, unregister frees+bumps-gen+recycles, invoke validates generation (stale handle -> silent no-op, forward-safe for the future async pool's deferred callbacks). UNREGISTER TRIGGER = NodeInner::Drop (the only point a node is truly gone; deactivate can't, the node doesn't hold its fn to re-register). KEY INSIGHT: the registering node isn't pinned by the pool (the fn captures UPSTREAMS, not self), so its Drop fires and unregisters, releasing the captured Core(s). CAVEAT: a fn capturing its OWN node is a genuine Rc cycle this can't break (pool keeps it alive -> Drop never runs) -- documented as a user-level self-cycle (Weak self-handle). HANDLE WIDENED to {pool_id, handle_id, generation} (user-approved 2026-05-29): generation is a PER-LANGUAGE impl detail (D24), NOT in the protocol/IDL Handle (D7/DR-2 stays (pool_id, handle_id)) -- wire-meaningless, dropped at the wire boundary. Recorded in CLEAN-SLATE.md. b32 leak test (a fn-captured guard's Drop fires when the node drops) + 20 Rust tests + clippy + fmt green. B15 (TS sibling) still OPEN; Rust rewire fn-swap unregister lands when Rust rewire (C-8) does.","lang":"rust","ref":"D20,D21,B15,CSP-5,D7,DR-2"},{"id":"B33","title":"TEARDOWN relay past a node's own COMPLETE: a terminal intermediate currently DROPS an upstream TEARDOWN at _receiveFromDep (the terminal-is-forever guard), so downstream never receives it for wire/bridge unwire. Pre-existing since CSP-1, NOT introduced by B30; B30's _down terminal guard is a second drop point on the same axis.","state":"deferred","trigger":"a real consumer (firstValueFrom-style bridge / wire-bridge resource release, D33/B2) needs TEARDOWN to propagate through an already-COMPLETEd intermediate to unwire downstream. Resolve via /spec-amend on draft R-teardown-complete (pin whether terminal nodes relay TEARDOWN) + a conformance scenario; mirror in both TS (_receiveFromDep + _down) and Rust (Core::down) arms. Surfaced by /qa on B30 2026-05-30 (QA F1 was mis-attributed to B30; the actual drop is the pre-existing _receiveFromDep terminal guard).","lang":"all","ref":"D17,R-terminal,R-teardown-complete,B30"},{"id":"B34","title":"higher-order *Map first-cut limitations (@graphrefly/ts, D47/CSP-2.7 landed 2026-05-30): (a) describe does NOT render runtime-added inner deps — graph.describe reads construction-time entry.deps (R-edges-derived) and inners are bare fromAny nodes not registered in the graph index, so a switchMap/mergeMap snapshot shows only [S]->op, NOT the live inners. SPEC TENSION: R-edges-derived 'edges from construction-time deps' + R-describe 'live-topology deferred to viz' vs the D47/C-11 rationale 'a describe snapshot shows currently-live inners'. (b) projected inners coerced via fromAny bind to the DEFAULT dispatcher (D26), not the operator's own — wrong for a non-default-dispatcher graph + a non-Node projection (a Node projection stays dispatcher-correct, keeping its own). (c) a terminal operator does not tear down still-subscribed siblings, and a source ERROR does not explicitly removeDep all inners (errorWhenDepsError auto-errors the op; inners orphaned until GC).","state":"open","trigger":"(a) LOCKED D51 2026-05-30 (/design-review, B2 over A over B1): describe() = LIVE point-in-time snapshot — edges from each node's CURRENT _deps (re-read at call time, so rewire C-8/C-11 reflected, truthful per D3); a live dep absent from _entries (a runtime *Map inner) is AUTO-DISCOVERED as a snapshot node, factory from the inner's own NodeOptions.factory (D43-reserved, set by the free initNode) else '?'; inners NEVER persistently registered (best-effort live capture, no churn — B1 persistent-registry/graph-in-body REJECTED as it pierces D27/R-node-thin); streaming-deltas stay deferred to viz/B4; first cut ONE level deep (transitive auto-discovery = follow-up). R-edges-derived ('construction-time'->'current/live') + R-describe amended. (a) DONE 2026-05-30 (/dev-dispatch @graphrefly/ts): Node.deps readonly getter (live _deps) + Node.factory public field realizing NodeOptions.factory? (set in the free initNode = op.factory, so bare *Map inners self-carry their name) + graph.describe reads LIVE deps (entry.node.deps, not construction entry.deps) + one-level auto-discovers unregistered live deps via a per-graph WeakMap<Node,id>+_synthSeq (synth id `~<factory|?>#n`, can't collide with registered name/factory#seq; describe bumps _synthSeq only, not _seq, so registered ids are describe-call-independent); discovered inners shown as LEAVES (deps:[]). Tests: higher-order.test.ts (live inner after S emits; bare initNode(of) dep named 'of') — static graphs render identically (inspect/graph tests unchanged), 159 tests + lint + build green. Transitive sub-dep discovery = B38. (b)(c) STILL OPEN. (b) give the higher-order operator body its node's dispatcher (a ctx affordance or instantiation-capture) so coerced inners share the causal domain (D22). (c) a consumer needs sibling/source-error inner teardown. None block the first cut: Node projections + the default dispatcher are correct, and describe shows truthful CONSTRUCTION topology.","lang":"ts","ref":"D47,R-rewire-deferred,R-edges-derived,R-describe,D22,D45,CSP-2.7"},{"id":"B35","title":"COMPLETE-from-a-dep does NOT release that dep's pending DIRTY contribution (wedges a multi-dep node): a dep that emits DIRTY then COMPLETE WITHOUT an intervening DATA/RESOLVED leaves _depDirty[idx]=true and _pending>0 — the INVALIDATE arm clears this (EC3) but the COMPLETE/ERROR arms do not. A multi-dep node (e.g. deps [D,E], D dirties then completes, E live) then has _pending stuck >0 → _maybeRun/_tryRun is gated forever → the node never recomputes or settles. PRE-EXISTING since CSP-1 (not introduced by D47); surfaced by the CSP-2.7 /qa Edge-Case review of the *Map operators (an inner that DIRTY-then-COMPLETEs without a value would wedge the operator). NOT hit by the normal inner lifecycle (sources emit DATA-then-COMPLETE, or bare COMPLETE with no prior DIRTY), so the *Map first cut is unaffected.","state":"deferred","trigger":"TS and Rust are DONE for C-15/R-terminal-settles-dirty; only the py arm remains (CSP-7). Reopen only when implementing py C-15 or when TEARDOWN-at-a-dirtied-dep / terminal x PAUSE/batch timing is in scope (see B39/B33). No current TS design-review blocker.","lang":"all","ref":"R-terminal-settles-dirty,R-invalidate-idempotent,R-deps-terminal,R-dirty-before-data,C-15,CSP-1,CSP-2.7","note":"TS ARM DONE 2026-05-30; RUST ARM DONE 2026-05-30; py:todo per conformance C-15. Historical design/spec context retained in the title."},{"id":"B36","title":"@graphrefly/ts resumeAll spurious undirty RESOLVED while paused: a buffered tier-3 emit does NOT set _emittedSettleThisWave (it is set only in the post-buffer down loop, node.ts ~line 900), so a COMPUTE node recomputing while paused under pausable:'resumeAll' has its DATA buffered yet still hits the _runWave undirty synthesis (wasDirty && !_emittedSettleThisWave) → emits a spurious RESOLVED via _emitToSubs that BYPASSES the pause buffer and reaches subscribers mid-pause","state":"resolved","trigger":"RESOLVED. Reopen only if B9 expands resumeAll baseline/equality replay semantics or if a future conformance scenario requires changing the raw-subscriber duplicate-DIRTY replay shape.","lang":"ts","ref":"D44,D49,R-resolved-undirty,R-pause-modes,B9","resolved_by":"@graphrefly/ts node.ts + control.test.ts (2026-05-31)","resolution":"TS now marks _emittedSettleThisWave when a tier-3/4 settle slice is buffered by pause/resumeAll, so _runWave does not synthesize a mid-pause undirty RESOLVED. Regression coverage: control.test.ts resumeAll compute DATA stays buffered while paused (subscriber sees DIRTY only), then resume replays DATA. This aligns TS with the Rust reading that a buffered settle counts as a produced settle."},{"id":"B37","title":"graphrefly-rs DeferredCtx holds a STRONG Core (Rc<RefCell<NodeInner>>): an async fn that stashes ctx.defer() and never emits (abandoned/cancelled work, a never-resolving backend) pins the node's NodeInner — and thus its fn slot (blocking the B32 unregister), its captured upstream Cores, and its dep_unsubs subscriptions — alive until the DeferredCtx drops. In correct usage the DeferredCtx drops when the async work completes/aborts (no leak), and the strong hold MATCHES TS's GC-reachability (the async callback closure keeps the TS node alive until it resolves). But it makes the dispatcher invoke's stale-handle no-op comment unreachable for this path (a strong Core can't have dropped+recycled), and a switchMap-style cancel that drops the DeferredCtx late over-retains until then","state":"deferred","trigger":"the real async-pool runner lands (B1) — decide strong-vs-Weak hold for DeferredCtx. Weak<RefCell<NodeInner>> (upgrade at emit, drop silently if gone — matching the dep-sink discipline) makes Drop/B32 reachable + the stale-handle no-op real, but silently drops an async result if the Node handle was dropped first (arguably wrong for an async source you want the result from). Surfaced by the CSP-6 Slice A /qa (2026-05-30, Blind Hunter). Low urgency: no leak in correct usage, no conformance path; revisit with the async runner.","lang":"rust","ref":"D20,B1,R-sync-core,DR-3"},{"id":"B38","title":"describe() transitive auto-discovery of unregistered live deps (D51 follow-up): the D51 first cut auto-discovers ONE level — a registered node's DIRECT live deps that aren't in _entries (a *Map inner). An inner that ITSELF carries a subtree of unregistered nodes (e.g. project returns a composed node, not a leaf source) shows the inner but NOT its sub-deps. Reframe describe as a call-time LIVE-REACHABILITY walk (seed = registered nodes, follow live _deps, emit every reached node incl. transitively-unregistered ones) so deeper inner topology falls out for free.","state":"deferred","trigger":"a USER wants clearer / deeper live topology — i.e. a real consumer composes *Map inners that are non-leaf (carry their own unregistered sub-graph) and needs describe to show below the first inner level. Until then one-level is enough (most inners are leaf sources of/fromPromise). Per-language inspection (D24), no conformance; needs a per-graph WeakMap<Node,syntheticId> for stable unregistered ids.","lang":"ts","ref":"D51,R-describe,R-edges-derived,B34"},{"id":"B39","title":"R-terminal-settles-dirty x PAUSE/batch cross-axis (CSP-2.7 /qa 2026-05-30): the absorbed-terminal undirty RESOLVED (node.ts _settleAfterAbsorbedTerminal) emits via bare _emitToSubs. FRAMING (matters — do NOT prejudge as a plain bug): default('true')-mode is ALREADY correct — D50/R-paused-invalidate Q1 locked the INVALIDATE-side undirty as IMMEDIATE in default mode (buffer-replay is resumeAll's job), and this terminal undirty is its DIRECT analogue, so the current bare immediate emit is right for default-pause. The gap is ONLY resumeAll-pause (must buffer the tier-3 settle slice, R-pause-modes) + open-batch (must defer to commit, D12) — a PARTIAL LATENT VIOLATION of those already-locked rules, not a fresh open question. The SAME bare-emit sits in the PRE-EXISTING INVALIDATE receive-arm (node.ts ~616-621, since CSP-1) with the same partial violation. The fix = route BOTH undirty RESOLVEDs through _down, which PRESERVES default-mode immediacy (_shouldBufferOnPause returns false for a default-mode sync emit) while buffering resumeAll + deferring batch. (The sawData->_maybeRun recompute already coalesces correctly under pause via _pausedDepWaveOccurred; only the RESOLVED balance bypasses.) Non-paused/non-batch is correct + conformance-covered (C-15 a-d, mutation-verified). THEORETICAL — no consumer, no failing test — parallel to B24 (rewireNext x batch/pause), deferred; contrast D44/D50 which were locked on a CONCRETE /qa symptom (garbage value / spurious ERROR), which this lacks. User chose DEFER 2026-05-30.","state":"deferred","trigger":"a consumer terminates/INVALIDATEs a dirtied dep while the receiving node is in resumeAll-pause or an open batch() AND needs precise settle timing (default-pause is already fine per D50); OR a deliberate cross-axis cleanup pass. THEN /spec-amend (the terminal analogue of D50): pin the undirty-RESOLVED settle timing — default immediate / resumeAll buffer / batch defer (= route through _down) — in R-resolved-undirty (or a focused new rule) + a conformance variant (C-16: terminal-mid-dirty under resumeAll + under batch) + formal coverage; fix BOTH receive-arms together for consistency (terminal _settleAfterAbsorbedTerminal AND the pre-existing INVALIDATE arm); then the Rust dep-terminal slice (B35) builds it in first time. NOT urgent (default-mode correct, no consumer); do NOT silently patch node.ts (spec-first — it is a resumeAll/batch wave-behavior change).","lang":"all","ref":"R-terminal-settles-dirty,R-resolved-undirty,R-pause-modes,D12,D50,B24,C-15"},{"id":"B42","title":"RESOLVED 2026-05-30 (/design-review approved option A -> /spec-amend, TS+Rust arms green; py CSP-7): completeWhenDepsComplete now counts an absorbed-error dep as TERMINAL-done. R-deps-terminal amended (all-deps-complete -> all-deps-TERMINAL) + active; C-17 (ts+rust pass) + formal wave_deps_complete.tla (TLC-green + mutation-verified); impl = _allDepsComplete->_allDepsTerminal (block on live) + the ERROR-absorbed receive-arm mirrors the COMPLETE arm (both TS node.ts + Rust node.rs). ORIGINAL: completeWhenDepsComplete x an absorbed (errorWhenDepsError:false) errored dep never auto-completes [renumbered from a duplicate B40 2026-05-30 -- the protocol-pull Fork-B item keeps B40]: all_deps_complete requires EVERY dep_terminal==Some(Complete), so a dep that ERRORed (recorded Some(Error)) blocks the auto-COMPLETE cascade forever, even after all OTHER deps complete. A rescue/catch operator (errorWhenDepsError:false + completeWhenDepsComplete:true) over a stream whose one source errors-then-others-complete never emits its terminal COMPLETE. Parity-consistent: TS _allDepsComplete is identical (tm!==true -> false for an errored dep). Surfaced by the CSP-6 Rust /qa (Blind Hunter, finding 4).","state":"resolved","trigger":"RESOLVED; no further design-review needed. Reopen only if TEARDOWN is added to the terminal-counting semantics or py implementation surfaces a spec/code conflict.","lang":"all","ref":"R-deps-terminal,D31,CSP-6","resolved_by":"R-deps-terminal + C-17 (TS/Rust pass; py todo tracked in conformance)","resolution":"D/R decision completed: an absorbed-error dep counts as TERMINAL for completeWhenDepsComplete. R-deps-terminal active; C-17 TS+Rust pass; py remains tracked by conformance/CSP-7, not by this backlog item."},{"id":"B40","title":"PROTOCOL-PULL design question (Fork B blocker, deferred to a NEW /design-review session): should GraphReFly add a protocol-level PULL -- a DEMAND/REQUEST tier (the callbag type-1-up analogue) so a sink can REQUEST data UP the conveyor belt and the source responds with DATA DOWN on demand, creating a DECLARED, inspectable pull-edge? USER'S LOAD-BEARING FRAMING (reframes the naive view): a PROTOCOL pull HONORS the guard -- a declared DEMAND edge appears in describe (D3/L0.7 inspectable topology satisfied); whereas the EXISTING method-pull (node.cache / lineage get()) is the actual BYPASS -- an invisible side-channel read outside the protocol. So 'pull breaks inspectability' is TRUE ONLY for method-pull (.cache); a declared protocol-pull is inspectable. LINEAGE: raw callbag HAS talkback pull (sink sends type-1-up no-payload = 'give me' -> source sends type-1-down = value; same type-1 both directions); callbag-recharge (the foundation GraphReFly is built on) ALREADY dropped it -- REFLOW-SPEC §1.4 up = PAUSE/RESUME/INVALIDATE/TEARDOWN (control only), chose METHOD-pull node.get() (cached read, MAY recompute-when-disconnected) over message-pull because of F-SYNC-CORE (message-pull is an async-style request/response round-trip, awkward in a sync wave core; get() is synchronous recursive DAG eval, glitch-free by construction); clean-slate inherited this (.cache = renamed get(), node.ts:200; R-data-not-peek scopes .cache to EXTERNAL consumers, bans in-graph .cache-peek to keep topology inspectable).","state":"resolved","resolved_by":"D55","resolution":"RESOLVED 2026-05-30 by D55: NO new DEMAND tier. Protocol-pull is realized as a SUBSTRATE pull-mode node (NodeOptions.pull:true) reusing RESUME as the demand + the D47 wave-boundary for self-demands. The naive design wedged downstream (a quiet compute node relayed phase-1 DIRTY but withheld the settle) -- the fix is quiet-DIRTY ABSORPTION + no-push-on-subscribe + deferred demand; spike-verified (_probe-pull P0b/P4/P5). pull:true -> R-pull/wave_pull.tla/C-1x via /spec-amend; reactiveList two-port (stream push + snapshot pull) is per-language. DESIGN CHALLENGES dissolved: no DAG pull-coordination (demand targets one cache-warm source), no F-SYNC-CORE round-trip (synchronous cache-warm flush), no constitutional D9 change.","trigger":"DONE -- /spec-amend (B) pending to land R-pull. Original trigger (for record): a fresh /decision-guard -> /design-review -> (if approved) /spec-amend to assess 'how much trouble vs how much benefit' of protocol-pull. BLOCKERS to amend: D9 (closed 9-tier set has NO DEMAND/REQUEST tier -- 'adding a tier is a constitutional change') + D8/R-ctx-up (up = control-tier only). DESIGN CHALLENGES to assess: (1) DAG pull-coordination -- a sink D pulling through a diamond (B,C over A): request fan-out, response fan-in, compute-A-once memoization; (2) F-SYNC-CORE reconciliation -- a synchronous request/response round-trip in the sync wave core (the reason the lineage chose method-pull); (3) interaction with two-phase push + ROM/RAM caching + lazy activation (does protocol-pull COMPLEMENT push or REPLACE part of it?); (4) tier/wave semantics (is DEMAND its own tier? how does it coexist with DIRTY/DATA?). BENEFITS to weigh: inspectable on-demand pull (vs the invisible .cache bypass), restored callbag pull/push duality, lazy eval through the protocol, a cleaner reactiveCollection (delta-stream push + snapshot pull ALL through the belt -- no external .cache side-channel). GATES Fork B (CSP-2.8 data-structures emit/delivery shape): whether reactiveCollection's snapshot is delivered via lazy-push items (no protocol change) OR a protocol-pull determines the emit design. Until resolved, Fork B (D55) is NOT locked; CSP-2.8 data-structures is ~90% designed (Fork A=D54 locked, shared scan-accumulator core + mechanical dissolutions set, composition=D56, storage=D57, render mechanical) with ONLY the snapshot-delivery/emit shape pending on this.","lang":"all","ref":"D8,D9,R-ctx-up,R-data-not-peek,D1,D3,D54,callbag-recharge REFLOW-SPEC,CSP-2.8,Fork-B"},{"id":"B41","title":"RESOLVED TS catalog deferred operators: D58 intentionally does not port window/windowCount/windowTime; repeat(factory,count), audit/auditTime, timeout(source,ms), and bufferTime(source,ms) are landed in @graphrefly/ts with tests. Historical context: these were the CSP-2.7 tail operators excluded from the first ~30-op cut because they needed D47/D52/D62 shapes beyond a clean declared-dep node / simple *Map+timer projector.","state":"resolved","trigger":"RESOLVED. Reopen only if a real consumer needs one of the deferred alternatives: opaque live window sub-streams despite D58 default; same-node repeat requiring force-resubscribe; debounce RxJS immediate complete-flush; throttle trailing option; or a different bufferTime windowing shape.","lang":"ts","ref":"D40,D45,D46,D52,B23,B38,CSP-2.7","resolved_by":"D58 + TS time.ts B41 tail (2026-05-31)","resolution":"Resolved for TS: window/windowCount/windowTime are intentionally NOT ported by D58; repeat(factory,count) landed in higher-order.ts; audit/auditTime landed as value-triggered trailing operators; timeout(source,ms) and bufferTime(source,ms) landed as subscribe-armed helper nodes with tests in time.test.ts. Future enhancements (opaque live sub-window escape hatch, repeat over same resubscribable node, debounce immediate complete-flush, throttle trailing option) are trigger-gated and should get separate backlog/design records if needed."},{"id":"B43","title":"single-dep transform/take operators read ctx.depRecords[0].latest (last-of-batch), NOT iterate .batch -- so under a COALESCED multi-DATA batch they see only the last value + counters under-count. Affects map/filter/scan/distinctUntilChanged (pre-existing since CSP-2.6) + the CSP-2.7 additions skip/take/takeWhile/first/pairwise; contrast reduce/last/find/elementAt/tap/settle/merge/bufferCount which DO iterate r.batch. Surfaced by the CSP-2.7 /qa (Blind Hunter + Edge Case Hunter). REACHABILITY is narrow: for a SINGLE dep, _depBatch only accumulates >1 value before one fn run via pause-coalescing (R-pause-modes default mode = fire-once-with-latest-on-RESUME, where latest-only is the SPEC'd behavior, NOT a bug) or a first-run-gate-held / diamond-gated window; in the normal one-DATA-per-wave path each DATA drives its own _runWave (node.ts:886 resets _depBatch), so .latest == the only value. So this is an INTERNAL-CONSISTENCY + D49-occurrence-fidelity observation, NOT a confirmed correctness bug (the only reachable multi-batch path is pause-coalescing, which is latest-only by R-pause-modes).","state":"deferred","trigger":"a real multi-emit-per-wave source feeds a counting/transform op OUTSIDE pause-coalescing AND the dropped intermediate occurrences matter; OR a deliberate occurrence-fidelity pass. THEN decide (per-language, NO spec change -- operators never in parity): make skip/take/takeWhile/first/pairwise/map/filter/scan/distinctUntilChanged iterate r.batch for D49 occurrence-fidelity, vs keep .latest and document that a coalesced batch counts as one occurrence. Resolve the counting semantics (does take(2) over a coalesced [a,b,c] count 1 or 3?) before changing -- it interacts with R-pause-modes coalescing.","lang":"ts","ref":"D49,R-pause-modes,R-sentinel,CSP-2.6,CSP-2.7"},{"id":"B44","title":"RxJS-7 time-operator complete-edge reference (context7-verified /reactivex/rxjs 7.8.2, 2026-05-30) -- pins the per-operator source-COMPLETE behavior so it is settled BEFORE implementation, NOT left to discover. (A) DEFERRED ops (B41), the behavior to MATCH when authored: audit/auditTime -> FLUSH the pending latest value on source COMPLETE (RxJS 6->7 CHANGE: v6 dropped it, v7 emits the last value; the frozen pure-ts audit also flushes -> agree, author with flush-on-complete). bufferTime -> FLUSH the final buffer on COMPLETE (RxJS 7 'final buffered values are always emitted'; matches the LANDED buffer/bufferCount which already flush remainder + COMPLETE). timeout -> NO flush edge (it ERRORs only on an idle gap > ms; a normal source COMPLETE just forwards COMPLETE). (B) LANDED ops -- known RxJS DIVERGENCES (acceptable, recorded): debounce/debounceTime (switchMap+timer) emits its pending trailing value at (last-value-time + ms) when the in-flight timer fires -- RxJS debounceTime instead FLUSHES the pending value IMMEDIATELY at source-COMPLETE time (its _complete calls debouncedNext() before complete()). So if the source completes mid-window, RxJS emits the trailing value at complete-time; this impl emits it ms later (the *Map+timer composition cannot flush early without detecting COMPLETE inside the switchMap inner -- inherent to the declarative composition). throttle/throttleTime is leading-ONLY (matches RxJS default leading:true/trailing:false) but does NOT expose the leading/trailing options RxJS provides (a capability gap, not a divergence).","state":"deferred","trigger":"B41 time-tail implementation is DONE. Reopen only if a consumer hits a remaining RxJS divergence/capability gap: debounce/debounceTime flushes pending trailing value at timer-fire time rather than immediately on source COMPLETE; throttle/throttleTime exposes only the RxJS default leading:true/trailing:false shape. Per-language (D6/D24), NO /spec-amend.","lang":"ts","ref":"D52,B41,B23,CSP-2.7,rxjs-7.8.2","resolution":"Reference behavior was applied to the landed B41 tail: audit/auditTime flush pending latest on source COMPLETE; bufferTime flushes final buffer on COMPLETE; timeout forwards normal source COMPLETE without error. Remaining divergence/capability notes stay trigger-gated in this backlog row."},{"id":"B45","title":"Rust perf track toward the Stage-3 ceiling (DR-7+DR-8): de-erasure (hybrid typed-internal / erased-boundary) THEN arena + index/generational handles -- move the hot path off Rc<RefCell> (refcount + dynamic-borrow tax) onto arena-owned nodes addressed by index handles (the dispatcher slotmap pattern B32, generalized to the node graph). Beats both Rc<RefCell> and a GC; reclaims the CPU edges where Rust structurally beats TS (GC/alloc, cache-bound, integer/bit, cold-start, polymorphic-no-deopt, SIMD, latency). Probes (crates/graphrefly/examples/perf_probe.rs + perf-probes/ts_probe.mjs) are AUTHORED but NOT RUN.","state":"open","trigger":"Runs IN PARALLEL with the ongoing TS implementation (DR-8 scheduling). STEPS: (a) RUN the authored probes for REAL numbers (own-measurement was deferred) + add a Python/GIL + arena-vs-GC + complex-marshal probe; (b) de-erasure per DR-7 (hybrid) keeping the conformance arm C-2..C-15 GREEN (D24 behavior-preserving); (c) arena+index refactor; stop at the ceiling-ratio target (within 1.5-2x of hand-rolled, near-linear core scaling). Per-language (F-PERF/L5-Q1), NO spec-amend.","lang":"rust","ref":"DR-7,DR-8,B32,D22,F-PERF,L5-Q1"},{"id":"B46","title":"R-pull DEMAND-TRIGGER surface + routing (the per-language trigger of a pull demand, NOT the delivery). User (CSP-2.8 /dev-dispatch+/qa 2026-05-30) prefers NOT a new ctx.demandNext API but a CONE-PROPAGATING ctx.up([[RESUME, lock_id]]): the RESUME travels UP the declared dep-cone like DIRTY does and STOPS at the node holding that lock (the pull:true node / source), which fires DATA down -- so the demand follows DECLARED edges (inspectable). The landed TS impl instead uses DIRECT-TARGET: ctx.demandNext(dep) (a new ctx affordance) / node.up([[RESUME, node.demandLock]]) calls _up on the pull node itself; _up handles PAUSE/RESUME LOCALLY and does NOT propagate them up the cone (only DIRTY/INVALIDATE/TEARDOWN propagate). Folds in 3 QA findings the routing model resolves: (F3) demandNext does not verify dep is a DECLARED dep -- a non-pull dep is a silent no-op (no typo signal) and a non-dep pull node can be demanded, creating an undeclared (uninspectable) demand edge -- contradicts the user's own declared-edge-not-.cache-bypass principle; (F4/F5) a demand coinciding with an EXTERNAL pause lock is LOST -- the per-node demand lock shares the single _pauseLockset with ordinary PAUSE locks, so a RESUME(demandLock) with another lock still held early-returns without servicing and drops the lock (pull x pausable not truly orthogonal -- entangled through one Set); (B1/F6) an owed demand (pin 5, demand-while-_pending>0) is STRANDED/misfired when the in-flight dep settles via INVALIDATE or COMPLETE/ERROR -- those receive-arms drain _pending without calling _fireOwedDemandIfReady (only the DATA/RESOLVED arms do). The DELIVERY behavior (quiet-absorb-DIRTY / no-push-on-subscribe / fire-once-DIRTY-before-DATA / re-quiet / true=latest, resumeAll=backlog) is UNAFFECTED and stays conformant -- R-pull ACTIVE + C-16 ts:pass + wave_pull.tla stand; only C-16's (defer)/(immediate) facets and the trigger surface would change.","state":"resolved","trigger":"A /design-review to LOCK the demand-trigger routing model (cone-propagate-RESUME vs direct-target), reconciling: (1) per-node-lock precision (D55 (d)) -- cone-propagation still needs the lock id, so the consumer needs the pull node's demandLock either way; (2) the SELF-demand D37 deferral (R-pull / R-rewire-deferred) -- ctx.up is IMMEDIATE, so a self-read demand via it re-enters (D37); a deferred path is still required regardless of name; (3) whether _up should propagate RESUME up the cone (stop-at-holder) -- this CHANGES control-message routing in _up (today PAUSE/RESUME are node-local; DIRTY/INVALIDATE/TEARDOWN propagate) and interacts with how PAUSE targets a node, so it is a WAVE-PROTOCOL behavior change -> /spec-amend (clarify R-ctx-up routing + possibly R-pause-lockset PAUSE/RESUME targeting; R-pull's routing semantic (d)); (4) make the demand a DECLARED, inspectable edge (resolve F3) and decide demandNext-on-non-pull = throw vs no-op; (5) separate the demand lock from _pauseLockset (or route owed-demand through it) to make pull x pausable orthogonal (resolve F4/F5) and wire _fireOwedDemandIfReady into the INVALIDATE/terminal settle paths (resolve B1/F6). Then re-implement the trigger surface + add C-16 routing/cross-axis facets (demand-up-the-cone, demand x external-PAUSE, demand x INVALIDATE/terminal) and model in wave_pull.tla if routing becomes spec.","lang":"all","ref":"R-pull,R-ctx-up,R-pause-lockset,R-rewire-deferred,D55,D37,D47,D8,CSP-2.8,Fork-B,C-16","resolved_by":"D59 + /dev-dispatch impl 2026-05-31","resolution":"RESOLVED by D59 (RESUME-routed pull: pullId + R-up-routing release-if-held-else-forward-up + ctx.upNext deferred self-demand, drop ctx.demandNext) + the TS impl 2026-05-31. F3 (declared-edge) -> demand routes the DECLARED cone (inspectable); F4/F5 (demand x external PAUSE) + B1/F6 (owed-demand on INVALIDATE/terminal) -> unified _demandOwed serviced across all settle/resume paths (_onDemand/_canFireDemand/_deliverPullDemand + _fireOwedDemandIfReady in DATA/RESOLVED/INVALIDATE/terminal arms + _pauseRelease). C-16 ts:pass (routing facets) + wave_pull_routing.tla TLC-green (RoutedResumeReachesHolder + DisambiguatesSiblings, both mutation-verified). rust=CSP-6 / py=CSP-7."},{"id":"B47","title":"R-up-routing: a BROADCAST routed RESUME (no towardDep) over a DIAMOND (the pullId-holder reachable from one demander via 2+ declared paths) invokes the holder's _onDemand ONCE PER PATH. Harmless TODAY -- the 1st delivers, the 2nd is SILENT (true mode: _pausedDepWaveOccurred cleared by the 1st; resumeAll: buffer already drained), so net delivery is 1 (1:1 preserved by COALESCING, not by routing). wave_pull_routing.tla models a strict TREE (G->{F,H}, distinct holders), so the impl diverges from the model in a diamond-to-single-holder topology. _forwardUp (node.ts) broadcasts to all deps with NO visited-set; adding one would also change the PRE-EXISTING DIRTY/INVALIDATE/TEARDOWN up-broadcast (idempotent today) -> out of scope for the D59 QA. Surfaced by the D59 /qa (3 reviewers).","state":"deferred","trigger":"Before a MULTI-PATH pull consumer ships (a pullId-holder reachable from one demander via 2+ declared paths). The reactiveList Fork-B snapshot is single-holder/tree, so NOT hit today. Then: add a per-routed-wave visited / already-demanded guard (or make _onDemand idempotent within one routed RESUME), + a diamond facet to C-16 + a diamond topology in wave_pull_routing.tla asserting fire-once.","lang":"all","ref":"R-up-routing,D59,C-16,wave_pull_routing.tla"}],"antipatterns":[{"id":"AP1","pattern":"wrapping an imperative helper as a reactive primitive","why":"the primitive inevitably re-exposes the imperative helper as a method","instead":"widen the helper's args to T|Node<T>; let the caller opt into reactive control","ref":"feedback_no_imperative_wrap_as_primitive"},{"id":"AP2","pattern":"eager-placeholder upstream pollutes SENTINEL","why":"ctx can never observe the true absence-of-DATA state","instead":"fix the upstream to stop eager-emitting; use prevData[i]===undefined as the never-emitted detector","ref":"feedback_use_prevdata_for_sentinel"},{"id":"AP3","pattern":";-chaining background cargo / long commands","why":"deadlock≠thrash confusion; the process group can't be killed cleanly","instead":"one target at a time; bounded -j; kill by process group; direct log + DONE sentinel","ref":"feedback_no_chained_background_cargo"},{"id":"AP4","pattern":"stale premise propagation","why":"the design session task table lags the code; opening a 9Q on a stale premise","instead":"grep the named symbols + check the landed marker; surface the stale premise as a HALT","ref":"feedback_verify_premise_before_greenfield"},{"id":"AP5","pattern":"making architectural decisions on your own initiative","why":"silently picking a side masks a spec↔code conflict","instead":"surface the conflict for the user to call; review multi-file rewrites file by file","ref":"feedback_no_autonomous_decisions"},{"id":"AP6","pattern":"marking active/superseded with prose inside the archive","why":"markers rot; active and superseded end up mixed in one directory","instead":"split active/archive into physical directories; put the state in a jsonl status field","ref":"P3"},{"id":"AP7","pattern":"canonical responsibility split across multiple documents","why":"the sequencer/decision-log is scattered in many places, causing migration-period confusion","instead":"a single canonical per responsibility; decisions in a single D# sequence","ref":"P1,P2"}],"rules":[{"id":"R-msg-format","area":"message","statement":"message = array of [Type, Data?] tuples; one array passed to ctx.down/ctx.up = one wave; in-process representation = tuple, wire representation = protobuf, decoupled at the wire-bridge boundary","rationale":"D8 up/down(msgs); D11 tuple/protobuf decoupled","status":"draft","since":"D8,D11","covers_by":[]},{"id":"R-msg-closed-set","area":"message","statement":"10 message types, CLOSED: START + DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN/PAUSE/RESUME. No open set, no user-defined custom types, no MessageTypeRegistry; the old unknown-type-forwarding rule is retired (vacuous under a closed set). Adding a tier/type = spec change (constitutional)","rationale":"D9 9-type closed set + START handshake; D18 messageTier compile-time const, custom types CUT","status":"draft","since":"D9,D18","covers_by":[]},{"id":"R-tier","area":"message","statement":"messageTier const table (7 tiers): 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN. Tiers <3 dispatch immediately; tiers ≥3 are batch-deferred (DATA/RESOLVED in the settle slice, INVALIDATE alongside, terminal after, TEARDOWN last). Closed const table — adding a tier is constitutional","rationale":"D34 ratified numbering (old-spec with PAUSE/RESUME↔DIRTY swap so control precedes notification); D9 closed set","status":"active","since":"D9,D34","covers_by":["C-1"]},{"id":"R-data-payload","area":"message","statement":"[DATA,v] requires a non-SENTINEL payload (v ≠ undefined/None/per-language sentinel); [ERROR,e] requires a non-SENTINEL payload; bare [DATA]/[ERROR] and [DATA,SENTINEL] are rejected at the dispatch boundary; null is a valid DATA value (domain-level absence)","rationale":"D16 SENTINEL = absence-of-DATA must stay decidable; DATA(SENTINEL) would be indistinguishable from never-emitted","status":"draft","since":"D16","covers_by":[]},{"id":"R-wave-boundary","area":"wave","statement":"outside batch: one ctx.down(msgs) = one wave; inside batch: accumulation until commit = one wave","rationale":"","status":"active","since":"D8,D12","covers_by":[]},{"id":"R-dirty-before-data","area":"wave","statement":"every tier-3 (DATA/RESOLVED) emission is preceded by DIRTY in the same wave; the dispatcher synthesizes a [DIRTY] prefix when the caller omits it and the node is not already dirty; raw and framed emission paths are observationally identical on the wire","rationale":"glitch-free two-phase contract; D9 mechanism is impl freedom but the DIRTY-before-DATA ordering is observable","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-two-phase","area":"wave","statement":"DIRTY (phase 1) propagates through the entire reachable graph before DATA/RESOLVED (phase 2) begins — glitch-free diamond. Activation exemption: a compute fn's first run during subscribe() does not require a preceding DIRTY","rationale":"two-phase push guarantees a fan-in node sees all settled deps before recompute","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-diamond","area":"wave","statement":"diamond/fan-in: D recomputes exactly once after all changed deps settle in same wave","rationale":"the spec only describes observable behavior; the mechanism (dirtyMask) is impl freedom","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-equals","area":"wave","statement":"the equals substitution (DATA→RESOLVED) fires only when there is exactly 1 DATA within the wave; 0 is irrelevant; with ≥2 they are all DATA. Within one wave at one node the tier-3 slot is ≥1 DATA XOR exactly 1 RESOLVED — never mixed (tier-3 wave exclusivity). Default equals = Object.is/is; custom equals via node opts; never invoked while cache is SENTINEL","rationale":"multiple DATA yield no skip-fn benefit; exclusivity keeps cache coherent with last-delivered DATA -- RETIRED by D49 (Opt-3: no auto-equals-substitution; replaced by R-resolved-undirty)","status":"retired","since":"D15","covers_by":[]},{"id":"R-same-wave-merge","area":"wave","statement":"multiple settle-class messages on one node in one wave are resolved by tier-sort (DATA advances cache, a trailing INVALIDATE clears it; subscribers observe the full sequence). The sole explicit merge rule is INVALIDATE+INVALIDATE collapse (cleanup hook fires at most once). DATA+RESOLVED in the same wave on the same node is a protocol violation (R-resolved-undirty / D49)","rationale":"tier ordering produces the right end-state without silently eliding messages","status":"draft","since":"D8","covers_by":[]},{"id":"R-invalidate-idempotent","area":"wave","statement":"INVALIDATE is broadcast at most once per node per wave (diamond fan-in cascades it once, not once per arriving path); an INVALIDATE arriving at an already-reset OR never-populated cache is a no-op — neither the cleanup hook nor the downstream broadcast fires again","rationale":"prevents double-cleanup and wedged-DIRTY deadlock; the two reset states are observationally equivalent downstream","status":"active","since":"D9","covers_by":["C-3"]},{"id":"R-sentinel","area":"wave","statement":"SENTINEL = absence-of-DATA, protocol-decidable; the concrete sentinel value is per-language (TS undefined/Rust None/Py sentinel)","rationale":"","status":"active","since":"D16","covers_by":[]},{"id":"R-push-subscribe","area":"wave","statement":"push-on-subscribe: in the SENTINEL state push [START]; in the dirty state push [START,DIRTY]; cached DATA is pushed to the new subscriber. START is the handshake — the first message any sink receives on a subscription, emitted before any other downstream delivery, not forwarded through intermediate nodes. EXCEPTION (R-pull / D55): a pull-mode node while QUIET pushes [START] ONLY — its cached value is NOT pushed on subscribe (it stays silent until demanded).","rationale":"","status":"active","since":"D9,D55","covers_by":[]},{"id":"R-terminal","area":"wave","statement":"terminal-is-forever by default; resubscribable opt-in triggers a fresh-lifecycle reset. A late subscribe to a non-resubscribable terminal node is REJECTED (idiomatic error); to a resubscribable terminal node it resets the lifecycle (clears terminal/has-fired-once/DepRecords, drains pause lockset, re-arms first-run gate) before installing the sink. TEARDOWN does not block reset","rationale":"D17; resubscribable IS the property gating late-subscribe re-activation","status":"active","since":"D17","covers_by":[]},{"id":"R-deps-terminal","area":"wave","statement":"completeWhenDepsComplete (default true): node auto-emits COMPLETE when ALL deps are TERMINAL — each dep has reached COMPLETE *or* an ABSORBED ERROR (errorWhenDepsError:false); an absorbed-error dep COUNTS as terminal-done (it is settled — no more input can arrive), it does NOT block completion (B42). Completion is 'all deps TERMINAL', NOT 'all deps Complete' and NOT 'ANY' (combineLatest semantics — fires once all sources settle). errorWhenDepsError (default true): node auto-emits ERROR when any dep errors (this auto-ERROR fires BEFORE the complete-check, so an error-terminal dep only reaches the completion logic when errorWhenDepsError:false has absorbed it). Terminal-emission operators (last/reduce) set completeWhenDepsComplete:false; rescue/catch operators set errorWhenDepsError:false and read ctx.depRecords[i].terminal explicitly. SCOPE: a dep TERMINAL = COMPLETE | ERROR; TEARDOWN is a destroy-cascade (tears the node down, not a settle) and does NOT count (B33-adjacent, out of scope). IMPL (TWO parts): (1) _allDepsComplete counts a TERMINAL dep as done — block only on a LIVE dep (TS `dep_terminal === undefined` blocks; NOT `!== true/Complete`), Rust all_deps_complete mirrors. (2) BOTH the COMPLETE receive-arm AND the absorbed-ERROR receive-arm (errorWhenDepsError:false) must check `completeWhenDepsComplete && all-deps-terminal -> COMPLETE`: the COMPLETE arm already does, but the ERROR-absorbed arm currently routes straight to _settleAfterAbsorbedTerminal/_maybeRun WITHOUT the check, so an absorbed-error dep terminating LAST would not fire the cascade — it must MIRROR the COMPLETE arm's check (Rust receive_from_dep ERROR arm same). Order-independent: whichever terminal lands last triggers the auto-COMPLETE.","rationale":"effect/derived completion is the join of all deps reaching a terminal state — once every dep is terminal (Complete or absorbed-Error) no more input can arrive, so the node MUST settle (COMPLETE); rescue needs explicit terminal handling. B42 fix: the prior 'all deps Complete' (TS _allDepsComplete `tm!==true`, Rust all_deps_complete) wedged a node whose errorWhenDepsError:false dep ERRORed (terminal=payload≠Complete) — it never auto-completed even after all OTHER deps completed. Counting an absorbed-error dep as terminal-done fixes the wedge AND lets a rescue/catch operator with completeWhenDepsComplete:true auto-COMPLETE after recovery (RxJS catchError(()=>of(x)) parity). NOT hit by the landed catalog (rescue/race/sample use completeWhenDepsComplete:false so the auto-cascade is skipped → zero behavior change; a dep error on a default errorWhenDepsError:true node auto-ERRORs before the complete-check) — a pure latent-wedge fix. FLIPPED ACTIVE 2026-05-30 on the TS-arm-green (C-17 a/b/c ts:pass) + formal (wave_deps_complete.tla TLC-green + mutation-verified) precedent, like R-terminal-settles-dirty/R-rewire; rust+py arms (C-17 rust/py) follow in CSP-6/7.","status":"active","since":"D30","covers_by":["C-17"]},{"id":"R-ctx-up","area":"protocol","statement":"ctx.up is control-tier only (DIRTY/PAUSE/RESUME/INVALIDATE/TEARDOWN); DATA/RESOLVED/COMPLETE/ERROR are down-only","rationale":"directional semantics; added in DR-5","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-node-thin","area":"node","statement":"node = thinnest primitive: holds fn handle + deps + wave state machine (dep_records, dirty_mask, pending_count, cache, status, subscribers, pause_lockset); ZERO inspection cruft. Bare node() works at the substrate level but loses naming/find/describe — those are graph-layer","rationale":"D5 Node↔Graph responsibility split; thin node ports cleanly to Rust","status":"draft","since":"D5","covers_by":[]},{"id":"R-node-iface","area":"node","statement":"node exposes: cache (readonly getter, never throws, never triggers computation), status, down(msgs), up(msgs) (restricted to control tier per R-ctx-up), subscribe(sink)→unsubscribe. cache replaces the old get()","rationale":"D5 minimal node surface; D8 up/down boundary","status":"draft","since":"D5,D8","covers_by":[]},{"id":"R-status-enum","area":"node","statement":"status ∈ {sentinel, pending, dirty, settled, resolved, completed, errored}; status is the source of truth for cache freshness (dirty → stale prior value, settled/resolved → fresh, completed/errored → final). cache never throws, never computes","rationale":"D5 inspection reads status not raw cache","status":"draft","since":"D5","covers_by":[]},{"id":"R-rom-ram","area":"node","statement":"state node (no deps) retains cache across disconnect — value is intrinsic/non-volatile (ROM). Compute node (deps and/or fn) clears cache on deactivation → status sentinel (RAM); reconnect re-runs fn from scratch with cleared DepRecords","rationale":"D5; compute value is a function of live subscriptions","status":"draft","since":"D5","covers_by":[]},{"id":"R-fn-contract","area":"node","statement":"node fn = (ctx)=>void; ctx = {up(msgs), down(msgs), depRecords[{latest, tier, prevData, terminal}], state, onDeactivation, onInvalidate}. NO return-value framing — all emission is explicit via ctx.down. Sugar (derived/effect/operator) value-level fn is wrapped to a ctx-fn in the graph layer at register time; node/producer are ctx-level (intentional tier power surface, DR-1)","rationale":"D8 ctx.up/down; D27 sugar→ctx-fn conversion strictly in graph layer feeds behavioral parity","status":"draft","since":"D8,D27","covers_by":[]},{"id":"R-cleanup-hooks","area":"node","statement":"two cleanup hooks: ctx.onDeactivation(fn) (release external resources on deactivation) + ctx.onInvalidate(fn) (flush on INVALIDATE). onRerun (0 callsites) and onResubscribableReset (1 callsite → absorbed by ctx.state lifecycle) are cut. fn return value is freed for sugar mapping. PER-RUN LIFECYCLE (D28 clarification): both hook lists are CLEARED before each fn invocation and re-registered by the fn body — only the LATEST run's registrations are live (React effect-cleanup model). A re-run SUPERSEDES the prior run's hooks; superseded registrations are DISCARDED WITHOUT firing (consistent with the cut onRerun — there is no fire-on-rerun hook). So after K fn runs, an INVALIDATE fires onInvalidate exactly once (the current run's), and deactivation fires onDeactivation exactly once (NOT K times). Contract: a fn must (re-)register its cleanup on EVERY run that needs it (a registration guarded to a single run is dropped on the next run). A single-run node keeps its single registration (no re-run = no clear). deactivate() fires the live onDeactivation hooks then clears both lists.","rationale":"D28; internal state reset belongs to ctx.state lifecycle, cleanup hooks only manage external resources + INVALIDATE. Per-run clear (D28 clarification) fixes the push-only accumulation bug surfaced by the CSP-5 Rust /qa (finding E, parity-consistent in both arms): re-registering each run grew the hook list unbounded and fired K stale hooks on the K-th INVALIDATE. Uniform clear-and-re-register for BOTH hooks (user-approved 2026-05-29); discard-without-firing keeps D28's onRerun-cut (fire-on-rerun would resurrect it).","status":"active","since":"D28","covers_by":["C-14"]},{"id":"R-ctx-state","area":"node","statement":"ctx.state = per-node private cross-wave state (implicit OK — node-private, not shared). Default fresh-lifecycle wipe; ctx.state.persist(on?) keeps across lifecycle. Shared/observable state must be an explicit node + dep (not ctx.state). INVALIDATE is lifecycle-continue (not fresh-lifecycle) so it does NOT wipe ctx.state — manual flush via onInvalidate","rationale":"D23 private state OK, shared memory explicit; D29 fresh-lifecycle wipe + persist","status":"active","since":"D23,D29","covers_by":["C-3"]},{"id":"R-first-run-gate","area":"node","statement":"compute fn first-fires only after every declared dep has settled (delivered ≥1 real DATA this or a prior wave) under partial:false — producing one combined initial wave. partial:true turns the gate OFF (fn fires as soon as dirty-dep-count hits 0; fn body MUST guard SENTINEL per dep). terminalAsRealInput:true also lets a dep terminal settle the gate (Reduce-class). The gate is first-run-only (has-called-fn-once); INVALIDATE does not re-arm it; a resubscribable terminal reset does","rationale":"clean multi-dep activation handshake without phantom partial waves","status":"active","since":"D9,D17","covers_by":[]},{"id":"R-initial","area":"node","statement":"initial (non-SENTINEL): pre-populates cache and a source pushes [DATA,initial] on subscribe; first emit runs equals against initial. Absent/undefined initial → cache holds SENTINEL, no push-on-subscribe, first emit is always DATA. INVALIDATE and resetOnTeardown return cache to SENTINEL","rationale":"D16 sentinel semantics; initial is T|null never T|undefined","status":"draft","since":"D16","covers_by":[]},{"id":"R-dynamic-node","area":"node","statement":"dynamicNode = node construction variant (NOT a verb): declares a superset of all possible deps at construction, fn reads a subset per invocation via track(dep). All declared deps participate in wave tracking; an unread dep's update fires the fn (a ctx-fn with explicit ctx.down). The fn DECIDES whether to propagate: it inspects which deps delivered this wave (ctx.depRecords[i].batch) and either re-emits via ctx.down (DATA) OR early-returns to stay QUIET, in which case the substrate synthesizes ONE undirty RESOLVED (D49: RESOLVED = UNDIRTY) that clears the downstream dirty WITHOUT a redundant DATA (D53). The suppress-vs-propagate decision on an unread-dep change is use-case-dependent, so it belongs to the fn (D53), NOT an automatic substrate read-mask (REJECTED D53 -- it would hard-code one policy and be the lone exception to D49's opt-in-dedup-everywhere). A downstream distinctUntilChanged remains an alternative for value-based dedup. track() is a pure per-invocation value-reader (depRecords[i].latest). Same first-run gate as static nodes. Intra-graph only — cross-graph deps go through the wire bridge (no inter-graph dynamicNode)","rationale":"D35 distinct from rewire (per-invocation read-selection vs dep-set
