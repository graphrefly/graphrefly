y depend on @graphrefly/ts rather than root @graphrefly/graphrefly or @graphrefly/pure-ts. Use examples as acceptance tests for package consolidation, not as the implementation owner.","lang":"ts","ref":"CSP-9,D32,D41","note":"The basic state-and-derived example is already migrated as the first cut. 2026-06-09 TS B64 batch 1 migrated examples/compat/{zustand,jotai,nanostores} and examples/framework/{react,vue,solid,svelte} to @graphrefly/ts plus @graphrefly/ts/adapters only. The framework hook code is tiny example-local glue over reactExternalStore/subscribeNodeValues/svelteReadableStore/svelteWritableStore; no @graphrefly/ts/compat/* subpath, framework hook API, public Graph-owned Zustand create factory, public Jotai atom(read), public Nanostores computed, protocol, storage restore, or dynamic topology semantics were added. 2026-06-09 user direction: pause further examples migration until retained functionality surfaces settle; examples should become a later acceptance/cleanup sweep, not a reason to design new APIs or keep old root surfaces alive. Spending-alerts and NestJS/order-flow may be revisited later with existing public surfaces, but they are no longer the immediate next slice. Deferred/design-gated examples remain AI/harness/refine-loop/inbox-reducer, knowledgeGraph memory, and reactive-layout/fromRaf until their retained patterns/solutions/API shape is reviewed or landed."},{"id":"B65","title":"CSP-9 deprecate root @graphrefly/graphrefly package after retained-surface migration","state":"open","trigger":"Once @graphrefly/ts owns the retained implementation surface and live consumers can move, deprecate root @graphrefly/graphrefly rather than investing in a transition shell. It must not keep independent implementation under src/.","lang":"ts","ref":"CSP-9,D32,D41","note":"2026-06-09 user direction: root @graphrefly/graphrefly should be deprecated directly, not preserved as a long-lived transition shell, because the only known real consumer is memo:Re. No backward compatibility is required pre-1.0. Do not spend effort migrating examples solely to keep the root package viable; finish retained functionality in @graphrefly/ts, then use B65 for the deprecation/retirement step and B66 for frozen pure-ts deletion when consumers are retired."},{"id":"B66","title":"CSP-9 delete frozen @graphrefly/pure-ts after intent-parity and consumer retirement","state":"open","trigger":"Delete packages/pure-ts only after B58-B65 leave no retained functionality or live consumers depending on it. Update workspace/package manifests, lockfile, docs, examples, tests, and any root shell references in one cleanup pass.","lang":"ts","ref":"CSP-9,D41,D40,D32","note":"Until then pure-ts remains frozen reference-only: no new development, no new product direction, and no dependency as the future TS substrate."},{"id":"B67","title":"CSP-10 Rust TS-CSP9 retained-surface gap ledger: keep graphrefly-rs catch-up queued from @graphrefly/ts, not from repeated ad-hoc prompts.","state":"open","trigger":"At the start and close of each TS CSP-9 slice, audit the newly retained @graphrefly/ts surface against graphrefly-rs and update B67-B75 or add a new Rust CSP-10 backlog row. Classify every gap as already implemented in Rust, intentionally TS-only, needs Rust-native re-derivation, needs design-review, or needs spec-amend. This ledger is the source for future Rust product-completeness dispatch after B57, under B53.","lang":"rust","ref":"CSP-10,CSP-9,B53,B58,B59,D24,D32,D40,D41,F-GRAPH-FIRST-API,D142,D145,D151","note":"Intent parity only: do not copy TS package layout, framework adapters, old pure-ts/root symbols, or retired facade/Impl/port shapes. Storage remains B57-resolved unless a TS CSP-9 slice exposes genuinely new retained passive-storage knowledge outside the D103/D106/D123 closeout; graph restore/hydration/storage-owned replay remains out of scope without a new gate. 2026-06-08 close ledger for TS/Rust D142 CQRS slice: CQRS is Rust-relevant application infrastructure and now has a Rust-native facts-first bundle in graphrefly-rs with command/runtime/events/status/errors/audit/cursor/projection nodes and static bounded command/event dedupe policy matching TS intent. The Rust surface does not copy TS symbols structurally, revive Graph subclasses, hidden process managers, storage-owned restore, or protocol changes. 2026-06-08 D145 topology-events first slice landed in both TS and Rust: observeTopology/observe_topology expose read-only node-registered and deps-changed lifecycle events over the existing Graph registry, with deps matching describe-visible live edges. No second node registry, hidden event hub, protocol message/tier/ctx semantics, structural parity requirement, release group, mount lifecycle stream, or dynamic topic node mutation was added. 2026-06-08 D151 follow-up: TS and Rust now align CQRS/wireBridge idempotency vocabulary by intent only. CQRS keeps command/event id membership windows; wireBridge keeps ordered seq/cursor receipt state and ackForSeq/ack_for_seq correlation. No generic dedupe engine, key-store, storage-owned replay, hidden event hub, or structural parity requirement was added. 2026-06-09 B67/B75 ledger pass: refreshed TS-CSP9-to-Rust retained-surface audit. Rust already has native intent coverage for graph/core substrate, operators/combinators/higher-order/time, render/describe/observe/profile basics, topology events/groups including node-released/mount-changed forwarding, passive storage/observe-storage/reactive cascading cache, reactive data structures/views, environment drivers/sources/outbound adapters/resilience/worker_derived, messaging bus/dynamic_hub, CQRS, wire_bridge/remote_call/remote_responder, and ProcessBundle/process_effect_runner. Intentional TS-only surfaces remain framework/package/platform adapters such as adapters/store, adapters/nestjs, sources/browser IDB helpers, TS sources/node packaging, storage/browser IndexedDB, storage/node SQLite, testing/core/subpath barrels, and framework examples; do not clone these into Rust as structural parity. Candidate Rust gaps for later audit: B73 profileSummary-style inspection ergonomics only; observeTrace was removed/deferred from @graphrefly/ts on 2026-06-10 because Graph.observe() is sufficient until real callsites appear. B72 generic source-wrapper ergonomics such as fromAny/firstValueFrom/singleFromAny where Rust-native value exists; B72 D133 WebSocket SessionBundle equivalent because Rust has websocket sources/sinks/drivers but not a bidirectional session bundle; B74 passive TopicMessage/JsonSchema/standard-topic vocabulary only after design-review of Rust representation. D158 semantic memory remains design locked with no TS implementation landed and no Rust API yet. No protocol/tier/message/ctx/batch/restore semantics gap or spec-amend item surfaced."},{"id":"B78","title":"RESOLVED TS/Rust D142 CQRS bounded dedupe policy","state":"resolved","trigger":"Completed 2026-06-08 after design-review: CQRS duplicate command/event id state needed an explicit bounded production policy without turning storage or hidden maps into restore owners.","lang":"ts/rust","ref":"D142,B63,B67,D125,D129,D80,R-restore,R-describe,R-no-imperative","note":"D142 locks CQRS dedupe as application-infrastructure policy, not protocol. TS @graphrefly/ts/cqrs now exposes CqrsDedupePolicy/CqrsDedupeWindow with unbounded exact default and optional bounded command/event windows; bounded cursor facts expose retained/evicted id counts. Rust graphrefly-rs now exposes a Rust-native cqrs module and crate exports for cqrs/cqrs_with_options/cqrs_command_handler/cqrs_projection plus CqrsDedupePolicy/CqrsDedupeWindow and graph-visible command/runtime/events/status/errors/audit/cursor/projection facts. Runtime dedupe state remains graph-owned and JSON/checkpoint friendly; bounded eviction is insertion-order and evicted ids are no longer duplicate-recognized. Dynamic Node-valued policies and generic public dedupe engines remain deferred. No spec, tier, message, ctx.up/down, terminal, storage-owned restore, or conformance behavior changed. QA hardening 2026-06-08: TS/Rust timestamp provider failures now emit graph-visible CQRS clock-threw/ClockThrew error/status/audit facts without committing events; Rust empty command id/type is MalformedCommand before dedupe insertion; D22/R-graph-domain violations are rethrown rather than downgraded into handler/projection facts.","tests":["packages/ts/src/__tests__/cqrs.test.ts","crates/graphrefly/tests/cqrs.rs"],"verification":["pnpm --filter @graphrefly/ts test -- src/__tests__/cqrs.test.ts src/__tests__/subpaths.test.ts","mise exec -- cargo test -p graphrefly-rs --test cqrs","mise exec -- cargo clippy -p graphrefly-rs --all-targets"]},{"id":"B79","title":"RESOLVED Generic idempotency/dedupe vocabulary review across CQRS and wire bridge","state":"resolved","trigger":"RESOLVED 2026-06-08 by D151: the shared shape across CQRS command/event id windows and wireBridge ordered idempotency/cursor/ack envelopes is a narrow vocabulary/contract, not a standalone public reducer engine.","lang":"ts/rust","ref":"D80,D134,D140,D141,D142,D149,D150,D151,R-describe,R-edges-derived,R-no-imperative,R-restore","note":"D151 locks Option B from the design review. Shared public types/helpers may exist only for passive vocabulary/validation: dedupe windows are membership-based duplicate recognition; ordered receipt uses monotonic seq/cursor; idempotencyKey is correlation/idempotency metadata unless a surface explicitly owns key-based recognition; ack/nack correlation uses ackForSeq/ack_for_seq. CQRS and wireBridge keep domain-specific graph-visible reducers/status/error/cursor facts and graph-owned state. A public reducer bundle, dynamic Node-valued policy, key-store/replay/idempotency engine, hidden Map/EventEmitter, storage-owned restore, or cross-surface structural parity still requires a later design review with another concrete consumer and ordinary graph nodes/declared deps for accepted/duplicate/error/cursor/status facts.","implementation_2026_06_08_d151":{"added":[{"target":["packages/ts/src/cqrs/index.ts","crates/graphrefly/src/cqrs.rs"],"note":"CQRS dedupe window vocabulary is documented as membership-based duplicate recognition owned separately by command/event id state, not a shared reducer engine."},{"target":["packages/ts/src/adapters/bridge.ts","crates/graphrefly/src/adapters/bridge.rs"],"note":"wireBridge metadata documents seq/cursor as ordered receipt state, idempotencyKey/idempotency_key as metadata, and ackForSeq/ack_for_seq as receipt correlation. Public ack/nack command/event/projection facts use ackForSeq/ack_for_seq for the correlation target."}],"tests":["packages/ts/src/__tests__/cqrs.test.ts","packages/ts/src/__tests__/wire-bridge.test.ts","packages/ts/src/__tests__/subpaths.test.ts","crates/graphrefly/tests/cqrs.rs","crates/graphrefly/tests/wire_bridge.rs"],"verification":["pnpm --filter @graphrefly/ts test -- src/__tests__/cqrs.test.ts src/__tests__/wire-bridge.test.ts src/__tests__/subpaths.test.ts","pnpm --filter @graphrefly/ts test","pnpm run lint","pnpm run build","mise exec -- cargo test -p graphrefly-rs --test cqrs","mise exec -- cargo test -p graphrefly-rs --test wire_bridge","mise exec -- cargo test -p graphrefly-rs","mise exec -- cargo clippy -p graphrefly-rs --all-targets","mise exec -- cargo build -p graphrefly-rs","mise exec -- cargo fmt --all -- --check"]}},{"id":"B68","title":"CSP-10 Rust node runtime versioning: implement D109/D112/D113 V0/V1 over Rust graph nodes and checkpoint metadata.","state":"done","trigger":"DONE 2026-06-07 in graphrefly-rs: added Rust-native NodeVersion/NodeVersioningPolicy/default_node_version_hash equivalents, default nodev0 counters, optional V1 cid/prev over strict canonical JSON bytes, graph/default and per-node policy wiring, public read-only version access, DATA-only advancement, describe/checkpoint preservation, and restore validation/fail-honest behavior. V2/V3 remain B3-deferred.","lang":"rust","ref":"CSP-10,B53,B3,D109,D112,D113,D116,D117,D96,R-snapshot,R-restore","note":"Landed as a Rust-native intent-parity slice without protocol/tier/message/ctx/batch changes: versioning is constructor-time policy + node runtime side-table metadata, not a global config singleton, companion node, storage generation, or public imperative mutation surface. Invalid V1 DATA fails before cache/version/DATA mutation; under Rust's D30 wave-owner catch this can surface as node ERROR rather than a caller-thrown exception. Tests/gates: `mise exec -- cargo test -p graphrefly-rs`, `mise exec -- cargo clippy -p graphrefly-rs --all-targets`, `mise exec -- cargo build -p graphrefly-rs`."},{"id":"B69","title":"CSP-10 Rust crate surface: align graphrefly-rs public modules/exports with the retained @graphrefly/ts package surface where Rust-relevant.","state":"resolved","trigger":"RESOLVED 2026-06-07 in graphrefly-rs: Rust crate surface is aligned to the D125 Rust-relevant package DAG without TS-style structural subpath parity. Public modules/exports remain Rust-native and discoverable for graph/node/message types, graph layer, operators, sources, storage, render, composition, data-structures, testing, and available adapters. Storage stays passive-only; graph-bound observe storage attachment lives under adapters::observe_storage; crate root does not re-export graph-bound observe attachment from storage; no empty facade modules are created for messaging, orchestration, cqrs, patterns, or solutions.","lang":"rust","ref":"CSP-10,B53,B58,D32,D40,D41,D123,D125,F-GRAPH-FIRST-API","note":"Rust does not need TS-style subpath exports or package consolidation. Resolved by auditing graphrefly-rs lib.rs/modules/features after the D125 TS package DAG and keeping only Rust-relevant landed surfaces. Acceptance target is a coherent self-contained crate surface, not structural parity with @graphrefly/ts package.json; missing Rust implementation areas such as B70 composition/residual helpers and remaining B71 collection/index/map/view surfaces stay as their own backlog items.","resolved_by":"2026-06-07 graphrefly-rs CSP-10 B69 D125 crate DAG alignment QA","resolution":"B69 closed with Rust-native module/export alignment and layering guardrails intact: passive storage has no Graph dependency or observe attachment ownership, graph-bound observe event log attachment remains in adapters::observe_storage, root exports passive storage only, and unimplemented application-infrastructure/pattern/solution areas are not represented by empty facade modules. Rust gates passed in the QA slice: cargo test -p graphrefly-rs, cargo clippy -p graphrefly-rs --all-targets, cargo build -p graphrefly-rs, cargo fmt --all -- --check, and git diff --check."},{"id":"B70","title":"CSP-10 Rust composition and retired-base residual helpers: re-derive retained TS capability/adapters/patterns surfaces onto clean-slate Rust graph APIs.","state":"open","trigger":"When TS B60 rehomes retained root src/base residuals into D125 @graphrefly/ts capability/adapters/patterns/solutions subpaths, compare the Rust-relevant composition, IO, resilience, worker, render/meta/mutation, and graph helper utilities against graphrefly-rs. Implement closable Rust-native slices for product-relevant helpers such as topologyDiff-style snapshot diffs, pipe/composition helpers, graph construction utilities, and pure metadata utilities where they preserve D39/D51 inspection semantics.","lang":"rust","ref":"CSP-10,B53,B60,D32,D39,D40,D41,D45,D118,D125,F-GRAPH-FIRST-API","note":"Do not revive fake watchTopology, old GraphSpec-as-runtime-owner, hidden graph-node subscribe islands, old base barrels, or old APIs that bypass declared topology. Anything that changes live topology semantics, observe semantics, or graph lifecycle must route through design/spec first."},{"id":"B71","title":"CSP-10 Rust reactive data structures and view surfaces: catch up retained TS collection/log/index/map/view capability after CSP-9 triage.","state":"open","trigger":"Use after TS CSP-9 clarifies retained data-structure/view surfaces. Implement graphrefly-rs slices for Rust-relevant reactive collections, logs, indexes, maps, delta/snapshot ports, pull snapshots, and ReactiveView-style derived views according to D80/D121/D122/D124. Keep storage and graph lifecycle boundaries explicit and add focused tests for describe/checkpoint/profile visibility of graph-registered ephemeral view groups.","lang":"rust","ref":"CSP-10,B53,D54,D55,D57,D60,D61,D68,D80,D121,D122,D124,F-GRAPH-FIRST-API","note":"Do not mix this into B57 storage. Views are graph-layer/data-structure products, not passive storage helpers. dispose is quiescent-only per D124, not a public Node.dispose or protocol TEARDOWN/COMPLETE synthesis. If a view needs new message/tier/pull semantics, halt for spec-amend."},{"id":"B72","title":"CSP-10 Rust sources, IO, resilience, and worker-style integrations: re-derive retained TS utility surfaces where Rust has a native analogue.","state":"open","trigger":"After TS B60/B63 identify retained source/IO/resilience/worker utilities, map them to Rust-native graphrefly-rs surfaces using the existing D111/D114 async-driver and source/time architecture. Candidate slices include missing source factories, file/process/network/domain event adapters, retry/backoff/resilience compositions, and worker/pool-style adapters that remain outside the sync wave core.","lang":"rust","ref":"CSP-10,B53,B60,B63,D32,D40,D41,D52,D111,D114,F-SYNC-CORE,F-GRAPH-FIRST-API,D130,D131,D132,D137,D138","note":"No ambient async runtime in the core, no hidden imperative triggers, and no raw async inside operators. TS browser/node adapters should become Rust-relevant adapters only when there is a concrete native analogue and an injectable driver/pool boundary. 2026-06-07 Rust B72 progressed with two source-boundary slices in graphrefly-rs: (1) universal cron source surface parse_cron/matches_cron/from_cron/from_cron_with_options plus CronSchedule/CronInstant/CronTick/FromCronOptions, driven by graph-local LocalAsyncDriver::interval and emitting at most once per matching minute; (2) node/native git hook source from_git_hook/from_git_hook_with_options plus GitEvent/GitHookType/FromGitHookOptions, using first-poll baseline + driver-callback polling of local git metadata with include/exclude filters and max-consecutive-error ERROR routing. Both preserve F-SYNC-CORE by confining clock/git work to source/driver boundaries and add no protocol/conformance changes. D130 upgrades B72 from ad-hoc source catch-up to production-grade Rust environment adapters: introduce graph-local EnvironmentDrivers, then implement process, HTTP/SSE/WebSocket/webhook, messaging, and unified resilience slices as concrete drivers/adapters while keeping remote graph deps/remote dispatcher functions design-gated. D131 locks the implementation shape for the next Rust slice: introduce graph-owned EnvironmentDrivers first, migrate local_async_driver into it, and add new adapters against ctx-accessible environment drivers rather than Dispatcher-owned IO. 2026-06-07 Rust B72 second slice landed D130/D131 EnvironmentDrivers ownership and concrete driver-backed source surfaces: GraphOptions.environment now installs graph-owned EnvironmentDrivers, node ctx carries the environment, local_async migrated into the bag while Dispatcher stays a temporary local_async fallback only, and new process/network source factories run_process/run_process_with_options/from_process/from_http/from_http_with_options/from_sse/from_sse_with_options/from_websocket/from_websocket_with_options emit graph-visible DATA/COMPLETE/ERROR through LocalProcessDriver/LocalHttpDriver/LocalSseDriver/LocalWebSocketDriver. Process nonzero exits are ProcessResult DATA, while driver/spawn failures are ERROR. Added passive BackoffPolicy/RetryPolicy/RetryStatus in Rust resilience for shared bounded observable retry/reconnect policy without scheduler ownership or protocol changes. 2026-06-07 Rust B72 webhook bridge slice landed after design-review approval: EnvironmentDrivers gained LocalWebhookDriver plus WebhookRegistration/WebhookEvent/WebhookDriverEvent, and from_webhook/from_webhook_with_options register graph-visible inbound webhook DATA/COMPLETE/ERROR through the graph-local driver with active/cancel fencing and missing-driver ERROR on activation; no protocol/conformance changes. 2026-06-07 Rust B72 D132 slice completed native outbound/message-bus/resilience surfaces: adapters::environment exports to_http/to_process/to_websocket plus *_with_options outbound bundles with declared graph deps, observable attempts/status/errors, bounded RetryPolicy retry scheduling through graph-local LocalAsyncDriver sleep, and EnvironmentDrivers transport callbacks; messaging.rs exports finite-topic MessageBus/message_bus/from_topic/to_topic/topic_core over graph-owned topic nodes; resilience.rs now exports retry_status_node, breaker_status_node, rate_limit_bundle, and timeout_bundle, reusing passive BackoffPolicy/RetryPolicy and existing time::timeout. SSE remains inbound-only because SSE has no standard outbound send surface. No protocol/conformance changes. Still open for later B72 slices: optional concrete runtime drivers beyond the existing TokioProcessDriver where a native dependency choice is explicitly wanted. 2026-06-08 Rust B72 optional runtime-driver closeout landed concrete feature-gated TokioHttpDriver and TokioWebSocketDriver alongside existing TokioProcessDriver: tokio-http uses reqwest for LocalHttpDriver request/response facts, tokio-websocket uses tokio-tungstenite for LocalWebSocketDriver connect events plus one-shot send capability, and all async work remains at the graph-owned EnvironmentDrivers boundary. Default features stay dependency-light; no protocol/conformance change. D137 classifies later worker-style integrations: graph-external task/runtime work belongs behind EnvironmentDrivers and graph-visible adapter/session bundles; graph-internal compute execution belongs to a dispatcher WorkerPool design-review; cross-graph remote deps/functions belong to the D134 wire-bridge line, not ordinary intra-graph deps. D138 narrows any graph-internal compute pool slice to a graph-helper-first WorkerPool v0: prepare owned input on the graph thread, compute off-thread, and emit completion through DeferredCtx as a later new wave; low-level scheduler APIs and remote workers stay deferred. 2026-06-08 Rust B72 WorkerPool v0 slice landed feature-gated worker_derived behind tokio-worker: the graph-thread kickoff node reads deps through ctx, prepares an owned Send/static input, runs only that compute input on Tokio spawn_blocking, then awaits completion on the graph-local LocalAsyncDriver and emits DATA/ERROR via DeferredCtx as a fresh later wave. Ctx/Node/Rc graph state/AnyValue/live topology never cross the worker boundary, default features stay dependency-light, remote workers and low-level scheduler controls remain deferred, and no protocol/conformance behavior changed. 2026-06-08 Rust B72 WorkerPool backend closeout landed the B1/D138 follow-up: worker_derived still remains the only public helper, but owned compute submission now goes through a feature-gated dispatcher-owned internal WorkerPool backend instead of helper-local ambient spawn_blocking. Missing backend and missing Tokio runtime surface graph-visible ERROR before spawning a local waiter; stale completion, panic/error, dep terminal/pending result, and describe-visible topology tests cover the closure. No GraphOptions/DispatcherOptions public shape, worker trait exposure, protocol, conformance, or EnvironmentDrivers task mixing was added. QA for the WorkerPool backend closeout fixed two edge cases: dispatcher submission now creates a cold WorkerJob so spawn_blocking does not start before the graph-local waiter/cancel path is installed, and worker_derived advances its invocation fence at the start of every invocation so prepare-none or immediate ERROR waves invalidate older in-flight completions.","implementation_2026_06_07_d132":{"added":[{"target":["crates/graphrefly/src/adapters/environment.rs","crates/graphrefly/src/adapters/mod.rs"],"exports":["to_http","to_http_with_options","to_process","to_process_with_options","to_websocket","to_websocket_with_options","OutboundBundle","OutboundEvent","OutboundStatus"],"note":"Rust-native outbound bundles over EnvironmentDrivers with visible attempt/sent/retry/exhausted/status/error facts."},{"target":["crates/graphrefly/src/messaging.rs"],"exports":["MessageBus","MessageEnvelope","MessageBusEvent","message_bus","from_topic","to_topic","topic_core"],"note":"Finite graph-owned topic nodes and declared to_topic producer node."},{"target":["crates/graphrefly/src/resilience.rs"],"exports":["retry_status_node","breaker_status_node","rate_limit_bundle","timeout_bundle","RetryEvent","BreakerStatus","RateLimitStatus","TimeoutStatus"],"note":"Graph-visible retry/breaker/rate-limit/timeout projections; timeout bundle wraps existing time::timeout."}],"tests":["crates/graphrefly/src/adapters/environment.rs","crates/graphrefly/src/messaging.rs","crates/graphrefly/src/resilience.rs"],"verification":["mise exec -- cargo test -p graphrefly-rs --lib","mise exec -- cargo test -p graphrefly-rs","mise exec -- cargo clippy -p graphrefly-rs --all-targets","mise exec -- cargo build -p graphrefly-rs"]},"implementation_2026_06_08_runtime_drivers":{"added":[{"target":["crates/graphrefly/src/environment.rs","crates/graphrefly/src/lib.rs","crates/graphrefly/Cargo.toml"],"exports":["TokioHttpDriver","TokioWebSocketDriver"],"note":"Optional concrete runtime drivers behind tokio-http/tokio-websocket features; process/http/websocket outbound adapters keep using the existing D132 graph-visible bundles and EnvironmentDrivers traits."}],"tests":["crates/graphrefly/src/environment.rs feature-gated runtime-driver tests"],"verification":["mise exec -- cargo fmt --all -- --check","mise exec -- cargo test -p graphrefly-rs","mise exec -- cargo test -p graphrefly-rs --features tokio-http,tokio-websocket","node /Users/davidchenallio/src/graphrefly/dashboard/build.mjs --check"]},"implementation_2026_06_08_worker_v0":{"added":[{"target":["crates/graphrefly/src/worker.rs","crates/graphrefly/src/lib.rs","crates/graphrefly/Cargo.toml"],"exports":["worker_derived"],"note":"Feature-gated tokio-worker graph helper for owned-input CPU compute; completion returns through graph-local DeferredCtx as a later wave."}],"tests":["crates/graphrefly/src/worker.rs feature-gated worker_derived tests"],"verification":["mise exec -- cargo fmt --all -- --check","mise exec -- cargo test -p graphrefly-rs","mise exec -- cargo test -p graphrefly-rs --features tokio-worker","mise exec -- cargo clippy -p graphrefly-rs --all-targets --features tokio-worker"]},"qa_2026_06_08_worker_v0":{"fixes":["Captured an explicit Tokio runtime Handle before spawning the local waiter; missing runtime emits graph-visible ERROR.","Added latest-invocation fencing so superseded worker completions cannot overwrite newer results.","Disabled dep COMPLETE auto-terminalization for worker_derived so pending owned compute can still emit its later DATA/ERROR.","Added panic, stale completion, missing runtime, and dep-complete-before-result regression tests."],"deferred":["Dispatcher-owned generic WorkerPool infrastructure follow-up was closed by the 2026-06-08 WorkerPool backend slice; future broad scheduler controls or remote workers require a new design gate."],"verification":["mise exec -- cargo test -p graphrefly-rs --features tokio-worker worker_derived"]},"implementation_2026_06_08_worker_backend":{"added":[{"target":["crates/graphrefly/src/dispatcher.rs"],"exports":[],"note":"Feature-gated crate-private WorkerBackend plus cold WorkerJob/Dispatcher::submit_worker for owned Send/static compute jobs; no public scheduler API."},{"target":["crates/graphrefly/src/ctx.rs","crates/graphrefly/src/worker.rs"],"exports":[],"note":"Ctx exposes dispatcher only crate-private under tokio-worker; worker_derived delegates compute submission to dispatcher and keeps completion via graph-local DeferredCtx."}],"tests":["crates/graphrefly/src/worker.rs feature-gated worker_derived backend/missing-runtime/local-waiter/stale/no-submit/panic/dep-terminal/describe tests"],"verification":["mise exec -- cargo test -p graphrefly-rs --features tokio-worker worker_derived"]},"qa_2026_06_08_worker_backend":{"fixes":["Changed dispatcher worker submission from eager spawn_blocking to a cold WorkerJob that is spawned inside the installed local async waiter.","Moved latest-invocation fencing to the start of every worker_derived invocation so no-submit/early-error waves drop older completions."],"tests":["worker_derived_does_not_start_worker_before_local_waiter_is_scheduled","worker_derived_no_submit_invocation_fences_prior_worker_result"],"verification":["mise exec -- cargo test -p graphrefly-rs --features tokio-worker worker_derived"]}},{"id":"B73","title":"CSP-10 Rust render, inspection, observe, profile, and testing helpers: catch retained TS diagnostics/tooling surface without changing protocol behavior.","state":"open","trigger":"After TS CSP-9 settles retained render/testing/diagnostic helpers, compare graphrefly-rs describe/render/observe/profile/testing support and implement Rust-native missing pieces in closable slices. Prioritize pure snapshot renderers, topology diff/explain diagnostics, observe-event testing utilities, profile aggregations, and harness helpers that make Rust product examples and QA easier.","lang":"rust","ref":"CSP-10,B53,B58,B60,B63,D32,D39,D51,D118,D145,R-describe,R-observe,R-profile","note":"Observe remains read-only egress and describe remains a snapshot. Profile additions must be derived from observe/inspection data or existing runtime counters, not new protocol messages. 2026-06-08 D145 first slice now provides real live topology-event egress in TS and Rust for node registered + deps changed only; remaining topology lifecycle events (node released, mount changed, release/topology groups) stay out of that slice unless a later D145 implementation explicitly adds and tests them. Parent-observer forwarding of already-mounted child graph topology events into mount-aware paths stayed deferred until the mount-changed lifecycle slice rather than silently widening the first slice. 2026-06-09 D152 follow-up adds explicit TS/Rust graph-owned topology/release group handles plus node-released lifecycle coverage; B83 later resolves mount-changed and mounted-child forwarding, and groups remain handles over registered ids rather than registries."},{"id":"B74","title":"CSP-10 Rust presets and domain utilities: triage TS CSP-9 retained presets/utils and re-derive only clean-slate-compatible Rust value.","state":"open","trigger":"When TS B62/B63 classifies retained presets and utils, decide which have Rust product value and implement them as Rust-native modules or examples after design-review where public shape is not obvious. Pay special attention to AI, memory, messaging, orchestration, process, reactive-layout, reduction, resilience, surface, graphspec/topology-view, and domain templates.","lang":"rust","ref":"CSP-10,B53,B62,B63,D32,D39,D40,D41,D45,F-GRAPH-FIRST-API","note":"Do not silently revive Actor, guard/policy, factoryTag, old inspect/audit semantics, old GraphSpec runtime ownership, or imperative orchestration APIs as substrate concepts. Each retained utility should either be presentation metadata, observe/audit tooling, graph description data, ordinary graph composition, passive storage/domain facts, or be retired. 2026-06-09 D159 locked the Rust TopicMessage C-lite shape: TopicMessage<T>, JsonSchema, standard topic string constants, and explicit pure JSON validation helpers belong under messaging as core reusable vocabulary. Hubs/buses do not auto-validate; schema metadata does not imply registry, compatibility, storage/restore, expiration scheduling, topic authorization, semantic-memory runtime, or protocol behavior. 2026-06-09 Rust D159 passive messaging vocabulary slice landed: graphrefly-rs messaging now exports TopicMessage<T>, JsonSchema/JsonSchemaType* representation, the seven standard topic constants plus STANDARD_TOPICS, and explicit caller-invoked validate_json_schema/is_json_schema_valid/validate_topic_message_payload helpers over serde_json::Value. Validation remains synchronous, side-effect-free, JSON-like, and never called by MessageBus or DynamicHub. No schema registry, compatibility policy, hub/bus auto-validation, expiration scheduler, topic auth, storage/restore/hydration, semantic-memory runtime, protocol/tier/message/ctx/conformance change, or structural TS parity was added."},{"id":"B75","title":"CSP-10 Rust examples and acceptance closeout: examples consume graphrefly-rs retained surface and B53 can be judged without oral context.","state":"open","trigger":"After B67-B74 land enough Rust catch-up slices, migrate/add graphrefly-rs examples and acceptance tests so the retained product surface is exercised from the public Rust crate only. Close or narrow B53 only when the Rust gap ledger has no open TS-retained product surface that should exist in Rust, all intentional TS-only gaps are recorded, and gates cover storage, graph layer, conformance, clippy, build, and dashboard checks for touched jsonl.","lang":"rust","ref":"CSP-10,B53,B64,D24,D32,D40,D41,F-GRAPH-FIRST-API","note":"This is not a demand for structural parity or framework-adapter cloning. It is the closeout mechanism that turns the Rust catch-up plan into public examples, tests, and documented deferrals so future sessions can continue from backlog state instead of conversational memory. 2026-06-09 B67/B75 ledger pass: acceptance remains open but narrowed. Do not start new Rust primitives from examples. Future closeout should first resolve or explicitly defer the B67 candidate rows (B73 profileSummary-style inspection ergonomics, B72 generic source wrappers, B72 D133 WebSocket session bundle, B74 passive TopicMessage vocabulary, D158 TS passive semantic-memory vocabulary landed; Rust/API follow-up and KG/retrieval/agentic graph surfaces still gated; observeTrace is not a Rust gap unless real TS/Rust callsites reintroduce it), then add public Rust examples/acceptance tests over the already-landed Rust-native surface. Ledger confirms no structural parity requirement, no framework adapter cloning, no GraphSpec/Actor/guard/factoryTag revival, no storage restore/hydration/WAL replay-as-restore, no hidden EventEmitter/scheduler/runtime owner, and no spec-amend item."},{"id":"B76","title":"RESOLVED Rust D140 wire-bridge request-response foundation","state":"resolved","trigger":"Completed 2026-06-08 in graphrefly-rs as the Rust-side D134/D140 bridge foundation. Reopen only for regressions in the transport-free envelope/bundle contract; real transports, auth, discovery, remote execution bridge helpers, remote ordinary deps, and cross-graph causal propagation remain separate design/spec gates.","lang":"rust","ref":"B72,D134,D137,D138,D139,D140,D141,R-sync-core,R-dispatch-all,R-graph-domain,R-no-raw-async,R-describe,R-edges-derived","note":"graphrefly-rs added adapters::bridge::wire_bridge plus public envelope/helper types. The bundle exposes command/outbound/inbound/events/acks/nacks/status/errors/cursor/attempts graph nodes. Envelopes include session_id, type, seq, cursor, idempotency_key, attempt/max_attempts, timestamp_ms, ack_for_seq, and request_id; D141 adds tagged data/error/status/close payload variants so control payloads are explicit bridge facts rather than casts into the data type parameter. Command helpers publish command DATA facts only; outbound start/data/ack/nack/close commands generate ordered envelope facts. Inbound is guarded so local protocol ERROR/COMPLETE/non-DATA misuse becomes a graph-visible bridge error fact rather than terminalizing bridge nodes; remote error/close remain inbound DATA envelope facts and never participate in local pending/diamond terminal settlement. Optional ack-timeout retry uses graph-owned LocalAsyncDriver::sleep and emits timeout/retry/exhausted/attempt/status/error facts. Focused Rust tests cover envelope validation/idempotency, command facts, describe-visible topology, ack cursor/pending clearing, nack/error/status visibility, duplicate/late/out-of-order/session-mismatch inbound handling, malformed inbound/command rejection, remote protocol/error envelope non-terminalization, close status clearing, and bounded retry attempts. No protocol spec, tier/message set, ctx.up/down semantics, WorkerPool/EnvironmentDrivers taxonomy, public scheduler shape, transport/auth/discovery, or conformance behavior changed.","resolved_by":"2026-06-08 graphrefly-rs D140 wire_bridge foundation"},{"id":"B77","title":"RESOLVED Rust D135 dynamic messaging hub foundation","state":"resolved","trigger":"Completed 2026-06-08 in graphrefly-rs as the Rust-side D135 dynamic hub first slice. Reopen only for regressions in the facts-dynamic/topology-static hub contract; true runtime topic node creation/deletion, topology events, and ephemeral topology lifecycle remain deferred design gates.","lang":"rust","ref":"CSP-10,B72,B74,D24,D32,D39,D51,D132,D135,R-describe,R-edges-derived,R-no-imperative,R-no-raw-async","note":"graphrefly-rs added messaging::dynamic_hub/dynamic_hub_with_options plus DynamicHub, DynamicHubCommand, DynamicHubEvent, DynamicHubStatus, DynamicHubError, DynamicHubDeadLetter, DynamicHubMetadata, DynamicHubUnknownTopicPolicy, from_hub_topic/from_hub_topic_with_name, and to_hub_topic. The bundle exposes fixed command/events/status/errors/optional-dead-letter nodes; helper methods and to_hub_topic publish ordinary command DATA facts only. Topic create/delete/publish/subscribe/close are DATA facts with seq/cursor/timestamp metadata, not graph node lifecycle. Unknown topic policy is explicit: drop, graph-visi isappear from find/describe/checkpoint only after release commits, and failed non-quiescent/downstream-dependent release emits no node-released event and leaves describe/find/checkpoint visible for retry. Cleanup failures after commit are non-vetoing cleanup faults: committed releases still emit node-released and then rethrow/report the first cleanup failure. Topology events remain read-only inspection egress, not graph nodes, DATA facts, protocol messages, control messages, or hidden EventEmitter/processManager/GraphSpec owners. This slice does not add release/topology group registries, public imperative triggers, mount-changed, mounted-child forwarding, dynamic topic node mutation, tier/message/ctx semantics, conformance changes, or structural parity requirements. 2026-06-09 D152 follow-up adds public topology/release group handles in TS/Rust on top of this release path, still without a release-group registry, protocol synthesis, dynamic topic mutation, or structural parity requirement.","tests":["packages/ts/src/__tests__/graph.test.ts","crates/graphrefly/tests/data_structures.rs"],"verification":["pnpm --filter @graphrefly/ts test","pnpm run lint","pnpm --filter @graphrefly/ts build","mise exec -- cargo test","mise exec -- cargo clippy --all-targets -- -D warnings","mise exec -- cargo build","node /Users/davidchenallio/src/graphrefly/dashboard/build.mjs --check","git diff --check in touched repos"]},{"id":"B81","title":"RESOLVED TS/Rust D152 explicit topology/release group surface","state":"resolved","trigger":"Completed 2026-06-09 after D152 locked true dynamic topic/view/router node lifecycle behind explicit graph-owned topology/release groups.","lang":"ts/rust","ref":"D145,D152,D153,D122,D124,D135,D39,D51,D24,D32,R-describe,R-edges-derived,R-no-imperative,R-node-thin,R-graph-domain","note":"TS @graphrefly/ts now exposes Graph.topologyGroup(opts) and Rust graphrefly-rs now exposes Graph::topology_group()/topology_group_opts(). A group is a graph-owned handle over ordinary graph-registered nodes: it may create/add child nodes, but membership is only a release memo and the graph registry remains the source of truth for find/describe/profile/checkpoint and id retirement. Release delegates to the existing quiescent-only atomic graph release path, emits node-released topology lifecycle events after commit, and synthesizes no COMPLETE/ERROR/TEARDOWN/control/protocol messages. The first concrete consumer in both runtimes is the graph-bound light reactive view delta/snapshot pair. DynamicHub/dynamic_hub remains facts-dynamic/topology-static by default, and unknown topic/data/publish keys still do not create/delete graph topology. No hidden second registry/EventEmitter, public Node.dispose, protocol/tier/message/ctx semantic change, conformance change, or structural parity requirement was added.","tests":["packages/ts/src/__tests__/graph.test.ts","packages/ts/src/__tests__/data-structures.test.ts","packages/ts/src/__tests__/messaging.test.ts","packages/ts/src/__tests__/subpaths.test.ts","crates/graphrefly/tests/graph_layer.rs","crates/graphrefly/tests/data_structures.rs"],"verification":["pnpm --filter @graphrefly/ts test -- src/__tests__/graph.test.ts src/__tests__/messaging.test.ts src/__tests__/data-structures.test.ts src/__tests__/subpaths.test.ts","pnpm --filter @graphrefly/ts test","pnpm run lint","pnpm run build","mise exec -- cargo test -p graphrefly-rs","mise exec -- cargo clippy -p graphrefly-rs --all-targets","mise exec -- cargo build -p graphrefly-rs","mise exec -- cargo fmt --all -- --check","node /Users/davidchenallio/src/graphrefly/dashboard/build.mjs --check","git diff --check in touched repos"],"resolved_by":"2026-06-09 TS/Rust D152 topology/release group surface"},{"id":"B82","title":"RESOLVED Rust D147 remote dispatcher helper over wire_bridge facts","state":"resolved","trigger":"Completed 2026-06-09 as the Rust-side D147/D153 remote dispatcher helper slice on top of the existing D134/D140/D141 wire_bridge foundation.","lang":"rust","ref":"CSP-10,B67,B75,D24,D32,D134,D140,D141,D147,D153,R-graph-domain,R-describe,R-edges-derived,R-no-imperative,R-no-raw-async,R-dispatch-all","note":"graphrefly-rs now exposes remote_call/remote_call_with_options plus remote_responder/remote_responder_handler under adapters::bridge and crate root exports. remote_call sends RemoteCallRequest DATA payloads through WireBridgeCommand::Send and exposes graph-visible responses/results/status/errors/timeouts nodes; local timeout is a local status/error DATA fact, not a remote protocol terminal, and stale/unknown responses are ignored by the remote_call projection unless their request_id is pending. QA tightened the call reducer so Status responses remain non-terminal, same-batch response/request ordering is handled without accepting closed late results, unknown timeouts do not consume unrelated pending calls, and Nack/Exhausted clear pending state while preserving request_id/operation correlation where the bridge facts contain it. remote_responder consumes guarded inbound request facts, invokes first-slice sync handlers, and emits RemoteCallResponse DATA facts through a declared responseCommands -> bridge/command edge using the existing bridge command reducer. Responders ignore non-owned operations by default so multiple responders can share one bridge; full-owner responders may opt into graph-visible unknown-operation DATA error responses. Handler errors become graph-visible DATA error responses. request_id is logical call correlation while seq/cursor/ack_for_seq remain bridge transport metadata. Tests cover later-wave and same-batch response projection, non-terminal status responses, stale-response filtering, local timeout facts, Nack correlation, describe-visible helper edges, response command DATA facts, multi-responder ownership, full-owner unknown-operation error responses, non-DATA ordering frames, and cursor-regression rejection. No protocol spec, tier/message/ctx semantics, conformance behavior, remote ordinary deps, distributed same-wave semantics, public WorkerPool submit API, hidden EventEmitter/processManager/GraphSpec owner, or structural parity requirement was added. B75 remains open for public examples/acceptance closeout across the retained Rust product surface.","tests":["crates/graphrefly/tests/wire_bridge.rs"],"verification":["mise exec -- cargo test -p graphrefly-rs --test wire_bridge","mise exec -- cargo test","mise exec -- cargo clippy --all-targets -- -D warnings","mise exec -- cargo build","mise exec -- cargo fmt --all -- --check","node /Users/davidchenallio/src/graphrefly/dashboard/build.mjs --check","git diff --check in graphrefly-rs and graphrefly"],"resolved_by":"2026-06-09 graphrefly-rs D147 remote dispatcher helper slice"},{"id":"B83","title":"RESOLVED TS/Rust D153 mount-changed topology event and mounted-child forwarding","state":"resolved","trigger":"Completed 2026-06-09 as the locked topology-events-only D153 closeout after design-review confirmed no new primitive or protocol change was needed.","lang":"ts/rust","ref":"D145,D153,D39,D51,D24,D32,R-describe,R-observe,R-no-imperative,R-no-raw-async","note":"TS @graphrefly/ts and Rust graphrefly-rs now add mount-changed/MountChanged to the existing read-only topology lifecycle egress and forward mounted child graph topology events through parent observeTopology/observe_topology with mount-aware path/deps prefixes. The mount-changed event is emitted from the existing graph mount mutation point with path=<mount path>, factory=mount, deps=[], and graph-local seq. Mounted child forwarding is active only while the parent has topology observers, so no-parent-observer use does not install a child topology observer or allocate topology events beyond existing bookkeeping; the last parent topology unsubscribe releases child forwarding. Forwarded child node-registered/deps-changed/node-released/mount-changed events keep their kind/factory and remap path/deps/prevDeps under the mount prefix while using the parent graph topology clock. Tests cover mount-changed path filtering, mounted child node registration and deps-changed forwarding matching describe-visible mounted deps, and forwarding release after unsubscribe. No protocol spec, tier/message/ctx semantics, conformance behavior, topology graph nodes, DATA facts, second registry, hidden EventEmitter/processManager/GraphSpec owner, dynamic topic node mutation, structural parity requirement, or release/topology group semantic change was added.","tests":["packages/ts/src/__tests__/graph.test.ts","crates/graphrefly/tests/graph_layer.rs"],"verification":["pnpm --filter @graphrefly/ts test -- src/__tests__/graph.test.ts","mise exec -- cargo test -p graphrefly-rs --test graph_layer"],"resolved_by":"2026-06-09 TS/Rust D153 mount-changed topology-event slice"},{"id":"B84","title":"RESOLVED Rust D136 ProcessBundle and D156 effect-runner follow-up","state":"resolved","trigger":"Completed 2026-06-09 as the Rust D136 ProcessBundle plus D146/D156 visible effect-runner outcome-command adapter over ProcessBundle.","lang":"rust","ref":"CSP-10,B53,B67,B74,B75,D128,D129,D136,D146,D153,D154,D156,R-describe,R-edges-derived,R-no-imperative,R-no-raw-async,R-restore","note":"2026-06-09 Rust D136 first slice landed graphrefly-rs process::ProcessBundle as a Rust-native facts-plus-reducer bundle with graph-visible command, state, events, audit, effect_request, status, error, and cursor nodes. The reducer owns process state as graph-visible facts through a graph-owned runtime node; Rust TState is serde JSON-roundtripped for the runtime ledger so reducer state is checkpoint-friendly and not shared by shallow Clone aliasing, while command/event/effect payload facts remain ordinary graph values. Command dispatch convenience only publishes ordinary command DATA facts; event/effect/status/error/audit/cursor projections are declared deps from the runtime node; process.cursor follows D154 high-water vocabulary after command attempt audit/status/error bookkeeping closes. Focused tests cover ordered facts, cursor high-water semantics, describe-visible deps, reducer failure without hidden state mutation, malformed/duplicate ids, ordinary graph reductions from process.state, checkpoint-friendly runtime state, cache-mutation non-aliasing, and QA hardening that malformed persisted runtime ledger fields are rejected rather than normalized into cursor/dedupe rewind. The slice does not add process/saga DSLs, D156 effect runners, hidden processManager/EventEmitter, private retry timers/maps, hidden subscriptions, storage-owned restore/hydration, protocol messages, remote ordinary deps, or structural TS parity copying. 2026-06-09 Rust D156 effect-runner follow-up landed graphrefly-rs process_effect_runner / ProcessEffectRunnerBundle as a Rust-native graph-visible outcome-command adapter over ProcessBundle. The runner exposes requests, outcomes, commands, status, errors, and release; consumes ProcessBundle.effect_request plus explicit outcome fact nodes; maps effect.result/effect.failure/effect.cancel/effect.timeout outcomes into visible ProcessCommand facts whose payload carries effect_id/effect_type, optional process_id/correlation_id/causation_id, and value/error/reason; and wires runner.commands into process.command through declared command-source fan-in. Release is idempotent and rollback-safe: it preflights helper topology quiescence, detaches runner.commands before graph-owned release, releases the private runtime plus visible helper nodes, preserves command-source order, and avoids cached command replay on failed release retry. Focused tests cover result projection into the process reducer, describe-visible effect_request/outcome/command edges, malformed/contradictory outcomes as DATA error/status facts, requested/commanded/rejected counters, failure/cancel/timeout payloads, multiple runner command-source fan-in, idempotent release, retry after live-subscriber failure without command replay, and post-release topology cleanup. No process/saga DSL, async handler runtime, private in-flight authority maps/timers, EnvironmentDriver/session/wireBridge integration, hidden subscriptions/EventEmitter/processManager, storage restore/hydration, protocol tier/message/ctx changes, remote ordinary deps, or structural TS parity copying was added. B84 is resolved; future process DSLs or boundary producers for outcome facts require separate backlog/design gates.","resolved_by":"2026-06-09 graphrefly-rs D156 process_effect_runner slice","tests":["crates/graphrefly/tests/process.rs"],"verification":["mise exec -- cargo fmt --all -- --check","mise exec -- cargo test -p graphrefly-rs --test process","mise exec -- cargo test","mise exec -- cargo clippy --all-targets -- -D warnings","mise exec -- cargo build"]},{"id":"B85","title":"TS D146 ProcessBundle effect-runner command-fact vocabulary/API shape","state":"resolved","trigger":"Resolved by D156 on 2026-06-09. Reopen only if the TS processEffectRunner outcome-command adapter regresses into a hidden async handler runtime, private process state owner, or non-visible command publication path.","lang":"ts","ref":"D136,D146,D153,D154,D156,R-describe,R-edges-derived,R-no-imperative,R-no-raw-async,R-restore","note":"D156 locks the first public TS effect-runner helper as a graph-visible outcome-command adapter bundle. It consumes ProcessBundle.effectRequests plus explicit outcome fact nodes, projects effect.result/effect.failure/effect.cancel/effect.timeout ProcessCommand facts through a declared runner.commands node, and wires that node into ProcessBundle.command as a real graph edge. The runner may expose requests/outcomes/commands/status/errors/release, but it does not own process state, raw async handlers, private timers/maps, hidden subscriptions, storage restore/hydration, or a workflow engine. Rust remains governed by B84: implement a Rust-native ProcessBundle first before adding effect runners."},{"id":"B86","title":"TS remoteResponder responseCommands attach/release lifecycle design","state":"resolved","trigger":"Resolved by D157 on 2026-06-09. Reopen only if dynamic remoteResponder release over a long-lived bridge leaves stale responseCommands deps or introduces a hidden command publication path.","lang":"ts/rust","ref":"D147,D153,D155,D157,D145,D152,R-describe,R-edges-derived,R-no-imperative,R-no-raw-async","note":"D157 locks remoteResponder responseCommands attachment as graph-owned and releasable. A responder release handle must detach responseCommands from bridge.command by rewiring bridge.command to remaining command sources, then release the responder topology group through the existing quiescent graph-owned path. The path is idempotent and rollback-safe: detach or release failure restores/keeps bridge deps and attachment memo coherent for retry. No EventEmitter, second topology registry, protocol COMPLETE/TEARDOWN, imperative bridge command publication, auth/discovery/schema runtime, or remote ordinary dep is added."},{"id":"B87","title":"TS D160 reactive data-structure backend checkpoint/persistence contract","state":"resolved","trigger":"Resolved 2026-06-10 in @graphrefly/ts. Reopen only if KG/semantic-memory needs policy-bearing reactiveMap TTL/capacity checkpoint restore, non-strict-JSON backend restore, or storage-owned graph hydration.","lang":"ts","ref":"CSP-9,B63,D57,D60,D61,D68,D80,D83,D90,D103,D116,D158,D160,D161,R-snapshot,R-restore,R-describe,R-edges-derived","note":"D161 storage/restore slice landed in @graphrefly/ts on 2026-06-10: passive strict-JSON snapshot/change-log load/fold helpers for reactiveList/reactiveLog/reactiveMap/reactiveIndex; synchronous restoreReactive* helpers that seed collection-owned backends without storage I/O; graph-bound persistReactiveCollection sidecar with ready/status/error/persistence.cursor facts, flush/dispose, same-graph collection validation, write-error status handling, and queued-work cancellation on dispose; openPersistentReactive* wrappers compose load -> restore -> persist. D160 graph checkpoint integration is now landed for TS: reactiveList/reactiveLog/reactiveIndex/reactiveMap register collection-owned backendState contributors or built-in factory restore descriptors, restoreGraph seeds backends without using snapshot-node cache authority, and malformed/non-restorable state fails honestly. Current intentional limits: policy-bearing collection variants that cannot be represented by strict JSON backendState stay local-only or fail honestly; reactiveMap per-entry TTL checkpoint restore is rejected because backendState would otherwise silently lose expiry metadata. Storage remains passive: restore never reads storage, persist never restores, and storage owns no graph hydration/WAL replay. KG/semantic-memory can build on this foundation without storing semantic state as large ctx.state blobs.","resolved_by":"2026-06-10 @graphrefly/ts D160/D161 reactive collection storage plus checkpoint/restore slice","tests":["packages/ts/src/__tests__/reactive-collection-storage.test.ts","packages/ts/src/__tests__/graph.test.ts"],"verification":["pnpm --filter @graphrefly/ts test","pnpm run lint","pnpm run build"]}],"antipatterns":[{"id":"AP1","pattern":"wrapping an imperative helper as a reactive primitive","why":"the primitive inevitably re-exposes the imperative helper as a method","instead":"widen the helper's args to T|Node<T>; let the caller opt into reactive control","ref":"feedback_no_imperative_wrap_as_primitive"},{"id":"AP2","pattern":"eager-placeholder upstream pollutes SENTINEL","why":"ctx can never observe the true absence-of-DATA state","instead":"fix the upstream to stop eager-emitting; use prevData[i]===undefined as the never-emitted detector","ref":"feedback_use_prevdata_for_sentinel"},{"id":"AP3","pattern":";-chaining background cargo / long commands","why":"deadlock≠thrash confusion; the process group can't be killed cleanly","instead":"one target at a time; bounded -j; kill by process group; direct log + DONE sentinel","ref":"feedback_no_chained_background_cargo"},{"id":"AP4","pattern":"stale premise propagation","why":"the design session task table lags the code; opening a 9Q on a stale premise","instead":"grep the named symbols + check the landed marker; surface the stale premise as a HALT","ref":"feedback_verify_premise_before_greenfield"},{"id":"AP5","pattern":"making architectural decisions on your own initiative","why":"silently picking a side masks a spec↔code conflict","instead":"surface the conflict for the user to call; review multi-file rewrites file by file","ref":"feedback_no_autonomous_decisions"},{"id":"AP6","pattern":"marking active/superseded with prose inside the archive","why":"markers rot; active and superseded end up mixed in one directory","instead":"split active/archive into physical directories; put the state in a jsonl status field","ref":"P3"},{"id":"AP7","pattern":"canonical responsibility split across multiple documents","why":"the sequencer/decision-log is scattered in many places, causing migration-period confusion","instead":"a single canonical per responsibility; decisions in a single D# sequence","ref":"P1,P2"}],"rules":[{"id":"R-msg-format","area":"message","statement":"message = array of [Type, Data?] tuples; one array passed to ctx.down/ctx.up = one wave; in-process representation = tuple, wire representation = protobuf, decoupled at the wire-bridge boundary","rationale":"D8 up/down(msgs); D11 tuple/protobuf decoupled","status":"draft","since":"D8,D11","covers_by":[]},{"id":"R-msg-closed-set","area":"message","statement":"10 message types, CLOSED: START + DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN/PAUSE/RESUME. No open set, no user-defined custom types, no MessageTypeRegistry; the old unknown-type-forwarding rule is retired (vacuous under a closed set). Adding a tier/type = spec change (constitutional)","rationale":"D9 9-type closed set + START handshake; D18 messageTier compile-time const, custom types CUT","status":"draft","since":"D9,D18","covers_by":[]},{"id":"R-tier","area":"message","statement":"messageTier const table (7 tiers): 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN. Tiers <3 dispatch immediately; tiers ≥3 are batch-deferred (DATA/RESOLVED in the settle slice, INVALIDATE alongside, terminal after, TEARDOWN last). Closed const table — adding a tier is constitutional","rationale":"D34 ratified numbering (old-spec with PAUSE/RESUME↔DIRTY swap so control precedes notification); D9 closed set","status":"active","since":"D9,D34","covers_by":["C-1"]},{"id":"R-data-payload","area":"message","statement":"[DATA,v] requires a non-SENTINEL payload (v ≠ undefined/None/per-language sentinel); [ERROR,e] requires an explicit non-SENTINEL, non-boolean diagnostic payload; bare [DATA]/[ERROR], [DATA,SENTINEL], [ERROR,SENTINEL], [ERROR,false], and [ERROR,true] are rejected at the dispatch boundary; binding/source adapters that receive host-language undefined/boolean failures must coerce them to a valid diagnostic payload before emitting ERROR; null is a valid DATA value (domain-level absence)","rationale":"D16 SENTINEL = absence-of-DATA must stay decidable; DATA(SENTINEL) would be indistinguishable from never-emitted. D78 keeps D77 terminal metadata lightweight (`false` none, `true` COMPLETE, payload ERROR) by excluding boolean ERROR payloads, so ERROR false/true cannot collide with terminal shorthand.","status":"draft","since":"D16,D78","covers_by":["C-23"]},{"id":"R-wave-boundary","area":"wave","statement":"outside batch: one ctx.down(msgs) = one wave; inside batch: accumulation until commit = one wave","rationale":"","status":"active","since":"D8,D12","covers_by":[]},{"id":"R-dirty-before-data","area":"wave","statement":"every tier-3 (DATA/RESOLVED) emission is preceded by DIRTY in the same wave; the dispatcher synthesizes a [DIRTY] prefix when the caller omits it and the node is not already dirty; raw and framed emission paths are observationally identical on the wire","rationale":"glitch-free two-phase contract; D9 mechanism is impl freedom but the DIRTY-before-DATA ordering is observable","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-two-phase","area":"wave","statement":"DIRTY (phase 1) propagates through the entire reachable graph before DATA/RESOLVED (phase 2) begins — glitch-free diamond. Activation exemption: a compute fn's first run during subscribe() does not require a preceding DIRTY","rationale":"two-phase push guarantees a fan-in node sees all settled deps before recompute","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-diamond","area":"wave","statement":"diamond/fan-in: D recomputes exactly once after all changed deps settle in same wave","rationale":"the spec only describes observable behavior; the mechanism (dirtyMask) is impl freedom","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-equals","area":"wave","statement":"the equals substitution (DATA→RESOLVED) fires only when there is exactly 1 DATA within the wave; 0 is irrelevant; with ≥2 they are all DATA. Within one wave at one node the tier-3 slot is ≥1 DATA XOR exactly 1 RESOLVED — never mixed (tier-3 wave exclusivity). Default equals = Object.is/is; custom equals via node opts; never invoked while cache is SENTINEL","rationale":"multiple DATA yield no skip-fn benefit; exclusivity keeps cache coherent with last-delivered DATA -- RETIRED by D49 (Opt-3: no auto-equals-substitution; replaced by R-resolved-undirty)","status":"retired","since":"D15","covers_by":[]},{"id":"R-same-wave-merge","area":"wave","statement":"multiple settle-class messages on one node in one wave are resolved by tier-sort (DATA advances cache, a trailing INVALIDATE clears it; subscribers observe the full sequence). The sole explicit merge rule is INVALIDATE+INVALIDATE collapse (cleanup hook fires at most once). DATA+RESOLVED in the same wave on the same node is a protocol violation (R-resolved-undirty / D49)","rationale":"tier ordering produces the right end-state without silently eliding messages","status":"draft","since":"D8","covers_by":[]},{"id":"R-invalidate-idempotent","area":"wave","statement":"INVALIDATE is broadcast at most once per node per wave (diamond fan-in cascades it once, not once per arriving path); an INVALIDATE arriving at an already-reset OR never-populated cache is a no-op — neither the cleanup hook nor the downstream broadcast fires again","rationale":"prevents double-cleanup and wedged-DIRTY deadlock; the two reset states are observationally equivalent downstream","status":"active","since":"D9","covers_by":["C-3"]},{"id":"R-sentinel","area":"wave","statement":"SENTINEL = absence-of-DATA, protocol-decidable; the concrete sentinel value is per-language (TS undefined/Rust None/Py sentinel)","rationale":"","status":"active","since":"D16","covers_by":[]},{"id":"R-push-subscribe","area":"wave","statement":"push-on-subscribe: in the SENTINEL state push [START]; in the dirty state push [START,DIRTY]; cached DATA is pushed to the new subscriber. START is the handshake — the first message any sink receives on a subscription, emitted before any other downstream delivery, not forwarded through intermediate nodes. EXCEPTION (R-pull / D55): a pull-mode node while QUIET pushes [START] ONLY — its cached value is NOT pushed on subscribe (it stays silent until demanded).","rationale":"","status":"active","since":"D9,D55","covers_by":[]},{"id":"R-terminal","area":"wave","statement":"terminal-is-forever by default; resubscribable opt-in triggers a fresh-lifecycle reset. A late subscribe to a non-resubscribable terminal node is REJECTED (idiomatic error); to a resubscribable terminal node it resets the lifecycle (clears terminal/has-fired-once/DepRecords, drains pause lockset, re-arms first-run gate) before installing the sink. TEARDOWN does not block reset","rationale":"D17; resubscribable IS the property gating late-subscribe re-activation","status":"active","since":"D17","covers_by":[]},{"id":"R-deps-terminal","area":"wave","statement":"completeWhenDepsComplete (default true): node auto-emits COMPLETE when ALL deps are TERMINAL — each dep has reached COMPLETE *or* an ABSORBED ERROR (errorWhenDepsError:false); an absorbed-error dep COUNTS as terminal-done (it is settled — no more input can arrive), it does NOT block completion (B42). Completion is 'all deps TERMINAL', NOT 'all deps Complete' and NOT 'ANY' (combineLatest semantics — fires once all sources settle). errorWhenDepsError (default true): node auto-emits ERROR when any dep errors (this auto-ERROR fires BEFORE the complete-check, so an error-terminal dep only reaches the completion logic when errorWhenDepsError:false has absorbed it). Terminal-emission operators (last/reduce) set completeWhenDepsComplete:false; rescue/catch operators set errorWhenDepsError:false and read ctx.depRecords[i].terminal explicitly. SCOPE: a dep TERMINAL = COMPLETE | ERROR; TEARDOWN is a destroy-cascade (tears the node down, not a settle) and does NOT count (B33-adjacent, out of scope). IMPL (TWO parts): (1) _allDepsComplete counts a TERMINAL dep as done — block only on a LIVE dep (TS `dep_terminal === undefined` blocks; NOT `!== true/Complete`), Rust all_deps_complete mirrors. (2) BOTH the COMPLETE receive-arm AND the absorbed-ERROR receive-arm (errorWhenDepsError:false) must check `completeWhenDepsComplete && all-deps-terminal -> COMPLETE`: the COMPLETE arm already does, but the ERROR-absorbed arm currently routes straight to _settleAfterAbsorbedTerminal/_maybeRun WITHOUT the check, so an absorbed-error dep terminating LAST would not fire the cascade — it must MIRROR the COMPLETE arm's check (Rust receive_from_dep ERROR arm same). Order-independent: whichever terminal lands last triggers the auto-COMPLETE.","rationale":"effect/derived completion is the join of all deps reaching a terminal state — once every dep is terminal (Complete or absorbed-Error) no more input can arrive, so the node MUST settle (COMPLETE); rescue needs explicit terminal handling. B42 fix: the prior 'all deps Complete' (TS _allDepsComplete `tm!==true`, Rust all_deps_complete) wedged a node whose errorWhenDepsError:false dep ERRORed (terminal=payload≠Complete) — it never auto-completed even after all OTHER deps completed. Counting an absorbed-error dep as terminal-done fixes the wedge AND lets a rescue/catch operator with completeWhenDepsComplete:true auto-COMPLETE after recovery (RxJS catchError(()=>of(x)) parity). NOT hit by the landed catalog (rescue/race/sample use completeWhenDepsComplete:false so the auto-cascade is skipped → zero behavior change; a dep error on a default errorWhenDepsError:true node auto-ERRORs before the complete-check) — a pure latent-wedge fix. FLIPPED ACTIVE 2026-05-30 on the TS-arm-green (C-17 a/b/c ts:pass) + formal (wave_deps_complete.tla TLC-green + mutation-verified) precedent, like R-terminal-settles-dirty/R-rewire; rust+py arms (C-17 rust/py) follow in CSP-6/7.","status":"active","since":"D30","covers_by":["C-17"]},{"id":"R-ctx-up","area":"protocol","statement":"ctx.up is control-tier only (DIRTY/PAUSE/RESUME/INVALIDATE/TEARDOWN); DATA/RESOLVED/COMPLETE/ERROR are down-only","rationale":"directional semantics; added in DR-5","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-node-thin","area":"node","statement":"node = thinnest primitive: holds fn handle + deps + wave state machine (dep_records, dirty_mask, pending_count, cache, status, subscribers, pause_lockset); ZERO inspection cruft. Bare node() works at the substrate level but loses naming/find/describe — those are graph-layer","rationale":"D5 Node↔Graph responsibility split; thin node ports cleanly to Rust","status":"draft","since":"D5","covers_by":[]},{"id":"R-node-iface","area":"node","statement":"node exposes: cache (readonly getter, never throws, never triggers computation), status, down(msgs), up(msgs) (restricted to control tier per R-ctx-up), subscribe(sink)→unsubscribe. cache replaces the old get()","rationale":"D5 minimal node surface; D8 up/down boundary","status":"draft","since":"D5,D8","covers_by":[]},{"id":"R-status-enum","area":"node","statement":"status ∈ {sentinel, pending, dirty, settled, resolved, completed, errored}; status is the source of truth for cache freshness (dirty → stale prior value, settled/resolved → fresh, completed/errored → final). cache never throws, never computes","rationale":"D5 inspection reads status not raw cache","status":"draft","since":"D5","covers_by":[]},{"id":"R-rom-ram","area":"node","statement":"state node (no deps) retains cache across disconnect — value is intrinsic/non-volatile (ROM). Compute node (deps and/or fn) clears cache on deactivation → status sentinel (RAM); reconnect re-runs fn from scratch with cleared DepRecords","rationale":"D5; compute value is a function of live subscriptions","status":"draft","since":"D5","covers_by":[]},{"id":"R-fn-contract","area":"node","statement":"node fn = (ctx)=>void; ctx = {up(msgs), down(msgs), waveData, terminal, state, onDeactivation, onInvalidate}. `ctx.waveData` is the ONLY raw ctx dep-value input surface (R-ctx-wave-data): a two-dimensional structure indexed as dep -> waves -> per-wave value/dirty-clear projection. `ctx.terminal[i]` is separate terminal metadata for the same invocation, NOT a value source: false = dep i did not deliver COMPLETE/ERROR, true = dep i delivered COMPLETE, any non-boolean non-SENTINEL ERROR payload = dep i delivered ERROR with that payload. R-data-payload rejects boolean ERROR payloads, so the false/true shorthand cannot collide with legal ERROR payloads. No stored `latest`, `prevData`, `latestData`, or parallel dep-value alias exists on raw ctx; any current/latest/read helper is derived from waveData plus node-owned cache/state outside the raw ctx value contract, never a second source of truth. NO return-value framing — all emission is explicit via ctx.down. Sugar (derived/effect/operator) value-level fn is wrapped to a ctx-fn in the graph layer at register time; node/producer are ctx-level (intentional tier power surface, DR-1)","rationale":"D8 ctx.up/down; D27 sugar→ctx-fn conversion strictly in graph layer feeds behavioral parity; D77 removes the ambiguous raw ctx `latest`/`prevData` aliases and pins waveData as the single canonical per-wave dep value input while keeping terminal metadata separate; D78 narrows ERROR payloads so the lightweight false/true/error-payload terminal metadata shape remains collision-free.","status":"draft","since":"D8,D27,D77,D78","covers_by":["C-23"]},{"id":"R-ctx-wave-data","area":"node","statement":"ctx.waveData is indexed by declared dep position. `waveData[i]` is a list of wave projections delivered by dep i to THIS fn invocation; each inner projection corresponds to exactly one upstream msgs array / wave (D8). An empty outer list `waveData[i] = []` means dep i delivered NO wave to this invocation. An inner empty list represents a RESOLVED-only wave: `waveData[i] = [[]]` means one RESOLVED wave. DATA payloads are stored directly in the inner list, in order: upstream `[[DATA,1],[DATA,2],[INVALIDATE]]` projects as `[[1,2,SENTINEL]]` for that dep. INVALIDATE is represented inside the inner list by the protocol SENTINEL marker (TS `undefined`, Rust/Py sentinel equivalent); DATA(SENTINEL) is already illegal by R-data-payload, so this marker cannot collide with a legal DATA payload. DATA null remains legal and projects as `[[null]]`; DATA with empty-array payload projects as `[[[]]]`; two waves DATA null then DATA [] project as `[[null],[[]]]`. RESOLVED never appears as a DATA payload and, by R-resolved-undirty, is not mixed with DATA in the same inner wave. COMPLETE/ERROR terminal information is NOT written into waveData because it is not value data; use ctx.terminal[i] (R-fn-contract) to distinguish false/no terminal, true/COMPLETE, or a legal non-boolean ERROR payload while a dirty contribution is being cleared. Implementations may store caches or dep bookkeeping internally, but raw ctx must expose exactly one dep-value input structure: waveData. Any ergonomic read/track/current helper MUST be a pure derivation from waveData plus the implementation-owned dep cache; it MUST NOT add a second raw ctx field that can drift from waveData.","rationale":"D77. The raw fn input must preserve the distinctions the protocol needs: no wave this invocation vs RESOLVED/no-occurrence vs INVALIDATE/SENTINEL-clearing vs DATA with any legal payload including null or an empty array. A single two-dimensional waveData structure avoids `latest`/`prevData` ambiguity and keeps occurrence information intact under D49; terminal is separate metadata, not a value alias. D78 keeps the false/true/error-payload terminal shape collision-free by excluding boolean ERROR payloads.","status":"draft","since":"D77,D78","covers_by":["C-23"]},{"id":"R-cleanup-hooks","area":"node","statement":"two cleanup hooks: ctx.onDeactivation(fn) (release external resources on deactivation) + ctx.onInvalidate(fn) (flush on INVALIDATE). onRerun (0 callsites) and onResubscribableReset (1 callsite → absorbed by ctx.state lifecycle) are cut. fn return value is freed for sugar mapping. PER-RUN LIFECYCLE (D28 clarification): both hook lists are CLEARED before each fn invocation and re-registered by the fn body — only the LATEST run's registrations are live (React effect-cleanup model). A re-run SUPERSEDES the prior run's hooks; superseded registrations are DISCARDED WITHOUT firing (consistent with the cut onRerun — there is no fire-on-rerun hook). So after K fn runs, an INVALIDATE fires onInvalidate exactly once (the current run's), and deactivation fires onDeactivation exactly once (NOT K times). Contract: a fn must (re-)register its cleanup on EVERY run that needs it (a registration guarded to a single run is dropped on the next run). A single-run node keeps its single registration (no re-run = no clear). deactivate() fires the live onDeactivation hooks then clears both lists.","rationale":"D28; internal state reset belongs to ctx.state lifecycle, cleanup hooks only manage external resources + INVALIDATE. Per-run clear (D28 clarification) fixes the push-only accumulation bug surfaced by the CSP-5 Rust /qa (finding E, parity-consistent in both arms): re-registering each run grew the hook list unbounded and fired K stale hooks on the K-th INVALIDATE. Uniform clear-and-re-register for BOTH hooks (user-approved 2026-05-29); discard-without-firing keeps D28's onRerun-cut (fire-on-rerun would resurrect it).","status":"active","since":"D28","covers_by":["C-14"]},{"id":"R-ctx-state","area":"node","statement":"ctx.state = per-node private cross-wave state (implicit OK — node-private, not shared). Default fresh-lifecycle wipe; ctx.state.persist(on?) keeps across lifecycle. Shared/observable state must be an explicit node + dep (not ctx.state). INVALIDATE is lifecycle-continue (not fresh-lifecycle) so it does NOT wipe ctx.state — manual flush via onInvalidate","rationale":"D23 private state OK, shared memory explicit; D29 fresh-lifecycle wipe + persist","status":"active","since":"D23,D29","covers_by":["C-3"]},{"id":"R-first-run-gate","area":"node","statement":"compute fn first-fires only after every declared dep has settled (delivered ≥1 real DATA this or a prior wave) under partial:false — producing one combined initial wave. partial:true turns the gate OFF (fn fires as soon as dirty-dep-count hits 0; fn body MUST guard SENTINEL per dep). terminalAsRealInput:true also lets a dep terminal settle the gate (Reduce-class). The gate is first-run-only (has-called-fn-once); INVALIDATE does not re-arm it; a resubscribable terminal reset does","rationale":"clean multi-dep activation handshake without phantom partial waves","status":"active","since":"D9,D17","covers_by":[]},{"id":"R-initial","area":"node","statement":"initial (non-SENTINEL): pre-populates cache and a source pushes [DATA,initial] on subscribe; first emit runs equals against initial. Absent/undefined initial → cache holds SENTINEL, no push-on-subscribe, first emit is always DATA. INVALIDATE and resetOnTeardown return cache to SENTINEL","rationale":"D16 sentinel semantics; initial is T|null never T|undefined","status":"draft","since":"D16","covers_by":[]},{"id":"R-dynamic-node","area":"node","statement":"dynamicNode = node construction variant (NOT a verb): declares a superset of all possible deps at construction, fn reads a subset per invocation via track(dep). All declared deps participate in wave tracking; an unread dep's update fires the fn (a ctx-fn with explicit ctx.down). The fn DECIDES whether to propagate: it inspects which deps delivered waves via ctx.waveData[i] (R-ctx-wave-data) and either re-emits via ctx.down (DATA) OR early-returns to stay QUIET, in which case the substrate synthesizes ONE undirty RESOLVED (D49: RESOLVED = UNDIRTY) that clears the downstream dirty WITHOUT a redundant DATA (D53). The suppress-vs-propagate decision on an unread-dep change is use-case-dependent, so it belongs to the fn (D53), NOT an automatic substrate read-mask (REJECTED D53 -- it would hard-code one policy and be the lone exception to D49's opt-in-dedup-everywhere). A downstream distinctUntilChanged remains an alternative for value-based dedup. track() is a pure per-invocation value-reader derived from ctx.waveData plus the implementation-owned dep cache; it is NOT a stored raw ctx `latest` field. Same first-run gate as static nodes. Intra-graph only — cross-graph deps go through the wire bridge (no inter-graph dynamicNode)","rationale":"D35 distinct from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds tracked deps to one causal domain; D77 replaces depRecords.latest/batch wording with the single raw ctx waveData contract","status":"draft","since":"D35,D77","covers_by":["C-23"]},{"id":"R-pause-lockset","area":"control","statement":"PAUSE/RESUME carry a lock_id; lockset semantics: a true resume occurs only when every lock has RESUMEd; same-id is idempotent; RESUME of an unknown lock is a no-op (D59) The routing of a RESUME for a lock NOT held HERE is governed by R-up-routing -- it FORWARDS up the declared cone to find the holder (release-if-held-else-forward-up) rather than a flat no-op; a lock no node up the cone holds drops at the depless-source terminus (net no-op). The held-release/idempotent/every-lock-resumed lockset semantics above are unchanged.","rationale":"","status":"active","since":"D10,D59","covers_by":["C-5"]},{"id":"R-pause-modes","area":"control","statement":"pausable {true | 'resumeAll' | false}. true (default): skip fn while any lock held, fire fn once on final-lock RESUME with latest dep values; a leaf source's (depless) own external down() -- sync OR async (timer tick / promise resolve / state.set) -- is NOT gated in default mode (delivered immediately). 'resumeAll': buffer the node's own tier-3/4 settle slice while paused (incl a leaf source's own sync/async down()), replay per-entry in arrival order on final-lock RESUME against a pre-pause baseline (equals references the conceptual-timeline cache); tier-5/6 bypass the buffer. false: ignore PAUSE/RESUME ENTIRELY (timer sources that must keep producing) -- the lockset is never consulted, neither dep-driven recompute nor any (sync/async) own production is gated or buffered. pausable mode is the OUTER gate over R-async-paused (D44): an async-pool late emit buffers ONLY when pausable in {true,'resumeAll'} AND (for true) the node is a COMPUTE node (deps>0); a depless async leaf source delivers immediately in true mode (leaf-vs-compute discriminator = deps.length===0). The ORTHOGONAL pull axis (NodeOptions.pull:true, R-pull / D55) sits ON TOP of pausable mode: a pull node is quiet-by-default (self-holds a per-node demand lock) and RE-QUIETS after each demand pulse; while quiet it suppresses the downstream DIRTY relay + push-on-subsc
