:"substrate 固定，不可替换；观察用 inspector(read-only — 不改/不发 node state，但 observe 经 subscribe 仍会激活冷节点，见 R-observe)，插逻辑加 node","rationale":"F-NO-IMPL-DEFINED；砍 user 自定义协议栈","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D20","layer":"L3-Q1","date":"2026-05-27","question":"pool 1.0 必备?","decision":"LocalSync + LocalAsync；dispatcher 留 pluggable pool trait","rationale":"WorkerPool/RemotePool 等 wire bridge 成熟再加","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D21","layer":"L3-Q2","date":"2026-05-27","question":"dispatcher/pool 归属?","decision":"dispatcher first-class；pool 挂 dispatcher；graph 绑 dispatcher(默认 process-global)","rationale":"多租户/sandbox 隔离自然","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D22","layer":"L3.C","date":"2026-05-27","question":"并发单位?","decision":"graph = 因果域 = 并发域 = 单线程；计算并行靠 pool callback；真并行靠多 graph+wire bridge；Rust 废 actor model；Py 废 subgraph 锁；rewire 仅 intra-graph","rationale":"wave 协议无锁；graph 边界=并发边界可解释；subgraph 回归纯组织","supersedes":["D221","D222"],"status":"locked","session":"DS-1"},{"id":"D23","layer":"L3-Q6","date":"2026-05-27","question":"store?","decision":"ctx.state per-node 私有(隐式 OK)；graph-level 共享 memory = 显式 node+dep","rationale":"私有 state 不违反 graph-first；共享 memory 必须可 inspect","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D24","layer":"L3-Q7","date":"2026-05-27","question":"parity 机制?","decision":"behavioral conformance 替代 structural Impl；cross-track-ledger 退役","rationale":"parity 从符号集对齐降维成协议行为符合；operator/sugar/inspection 各语言独立永不进 parity","supersedes":["D196"],"status":"locked","session":"DS-1"},{"id":"D25","layer":"L3-Q8","date":"2026-05-27","question":"snapshot/restore?","decision":"拓扑+cache+factory-name；restore 按 name re-resolve；增量 changeset；inline fn 标 local-only","rationale":"fn 不能 serialize，factory registry 模式","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D26","layer":"L3-Q9/Q10/Q11","date":"2026-05-27","question":"central config singleton?","decision":"完全消解：messageTier=const；onMessage/onSubscribe=substrate 固定；operational config=graph/dispatcher opts；clock=graph-local monotonic；唯一 global singleton=default dispatcher；freeze 机制消失","rationale":"L3.C graph=因果域天然隔离；config drift+freeze 时序复杂性消除","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D27","layer":"L4-Q2","date":"2026-05-27","question":"sugar 怎么注册?","decision":"sugar→ctx-fn 转换严格在 graph layer；dispatcher/node 只认 (ctx)=>void","rationale":"各语言 sugar 自由，dispatcher/node 统一 → 喂 behavioral parity(D24)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D28","layer":"L4-Q5","date":"2026-05-27","question":"cleanup hook?","decision":"ctx.onDeactivation + ctx.onInvalidate (2 hook)；砍 onRerun(0 callsite)/onResubscribableReset(1→ctx.state)","rationale":"内部 state reset 归 ctx.state lifecycle，cleanup 只管外部资源+INVALIDATE","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D29","layer":"L4-Q6","date":"2026-05-27","question":"ctx.state lifecycle?","decision":"默认 fresh-lifecycle wipe；ctx.state.persist(boolean?) 保留","rationale":"frozen-context 等 latch 自动清；persist 跨 lifecycle","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D30","layer":"L4-Q10","date":"2026-05-27","question":"error+cancellation?","decision":"throw→ERROR(graph-layer catch)；cancellation 默认不取消，{switch:true} opt-in+AbortSignal via ctx","rationale":"JS/Py throw 是常态；取消是 async pool 特性最少惊讶","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D31","layer":"L4-Q11","date":"2026-05-27","question":"error typed?","decision":"error=unknown(Node<T> 单泛型)","rationale":"error typed 类型组合爆炸；跨语言 Box<dyn Error>/Exception 是顶类型","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D32","layer":"L6-Q1","date":"2026-05-27","question":"包结构?","decision":"每语言独立完整包(@graphrefly/ts·rust·py)+粗粒度 wire bridge；无跨语言 peer-deps","rationale":"甩掉 D080/D206+9.5× 机器税；放弃 never-functional 的 TS-on-Rust-substrate 幻想","supersedes":["D080","D206"],"status":"locked","session":"DS-1"},{"id":"D33","layer":"L6-Q3","date":"2026-05-27","question":"wire codec?","decision":"wire=protobuf schema-codegen(单 .proto 兼 wire+protocol contract IDL)；实现 defer post-1.0","rationale":"DR-2 IDL 单源","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-1","layer":"design-review","date":"2026-05-27","question":"§5.11 ctx-level 暴露 tier?","decision":"§5.11 amend：ctx-level(node/producer)是 protocol-facing power surface 有意暴露 tier；value-level(derived/effect/operator)是 §5.11-compliant primary","rationale":"ctx.down 一-wave-多-tier 原子性(terminal-with-final-value)是 emit/error 方法表达不了的","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-2","layer":"design-review","date":"2026-05-27","question":"parity 加 IDL?","decision":"A+C: behavioral conformance + L6-Q3 的 .proto 兼 protocol contract IDL；codegen 接口骨架(轻 structural 单源)","rationale":"纯 behavioral 失去 structural 保证；.proto 本就要写，零额外成本买接口形状一致","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-3","layer":"design-review","date":"2026-05-27","question":"async-result-at-paused-node?","decision":"进 pause buffer + RESUME replay","rationale":"与 PAUSE 缓冲 DATA 一致；lock_id 作用域=node-level pause_lockset","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-4","layer":"design-review","date":"2026-05-27","question":"graph 职责过载?","decision":"先不引入独立 domain 概念(narrow-waist 优先)；记逃生口","rationale":"若 inspection 边界 vs 并发边界冲突真实出现，引入 domain(一 domain 含多 graph)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-5","layer":"design-review","date":"2026-05-27","question":"conformance 硬场景?","decision":"必含：跨 graph diamond / async-result-at-paused-node / INVALIDATE×ctx.state×onInvalidate / mixed sync-async diamond / PAUSE lockset 多来源；spec amendment 清单(§5.10/5.11/6.1/7.1+3 新增)","rationale":"否则 behavioral parity 是空头支票","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-6","layer":"design-review","date":"2026-05-27","question":"dispatcher opts 结构?","decision":"分组 {limits, observability, policy}","rationale":"避免平铺十几个 key 的认知负担","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D34","layer":"L2.A","date":"2026-05-28","question":"CSP-0: canonical messageTier const table (numbering + START placement)?","decision":"7-tier const table: 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN; immediate <3, batch-deferred ≥3","rationale":"old-spec numbering with PAUSE/RESUME↔DIRTY swap (control before notification); START=10th handshake type, D9's 9 protocol types occupy tiers 1-6; amends R-tier numbering","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D35","layer":"L1.5","date":"2026-05-28","question":"CSP-0: dynamicNode/track(dep) disposition vs D4 8-verb + D22 rewire?","decision":"carry as intra-graph node construction variant (NOT a verb): superset deps declared at construction + track(dep) read-selection per invocation; unread-dep update fires fn then equals-absorbs; same first-run gate; inter-graph N/A (cross-graph deps only via wire bridge)","rationale":"distinct mechanism from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds all tracked deps to one causal domain","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D36","layer":"L1.3","date":"2026-05-28","question":"CSP-0: meta companion stores substrate or presentation?","decision":"presentation/graph-layer, NOT substrate: static annotations (description/type/range/...) → describe metadata via g.node opts; reactive annotations → explicit nodes (D23); substrate node carries zero meta machinery; meta.owner ABAC is presentation/multi-agent","rationale":"D5 node=thinnest with zero inspection cruft; meta is pure annotation feeding describe (graph owns inspection)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D37","layer":"L2-Q16","date":"2026-05-28","question":"B10: synchronous feedback-cycle / re-entrant fn semantics — queue (A), reject (B), or require-async (C)?","decision":"reject, not iterate (B, owned at graph level): a node fn that during its invocation transitively re-drives one of its own deps so the same node's fn would re-enter before its wave completes is a wave-level protocol ERROR. Detection is node-local and free — refuse to enter the fn-run while the node's own in-wave flag (_insideRunWave) is already set, and throw; the graph layer catches the throw → [[ERROR,e]] down (D30), located at the cycle-closing node, wave aborted. The core neither queues (A) nor bounds-then-runs the cycle. Legit accumulation = per-node ctx.state (scan), not a topological cycle. Async feedback crossing a turn boundary (async pool) is out of scope. No maxFnRerunDepth — precise flag detection supersedes the blunt depth cap","rationale":"A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; B fixes the root with zero new structure by checking the already-existing _insideRunWave flag; dispatcher stays a pure invoke funnel (F-DISPATCH-ALL); error ownership is graph-level per the wave-level error category (D30); surfaced by CSP-1 /qa (backlog B10)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D38","layer":"L2-Q17","date":"2026-05-28","question":"B11: what does a depless source do with an upstream-forwarded control message (INVALIDATE/DIRTY/TEARDOWN) at the terminus?","decision":"the source self-ACTS only on a message with a coherent round-trip: INVALIDATE → HONOR the invalidate-request (clear cache→SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never comes). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned, not destroyable by a downstream request; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediates only forward upstream control (no self-action); the source is the single actor, the down-cascade the effect","rationale":"R-ctx-up/DR-5 deliberately lists INVALIDATE as up-allowed (unlike PAUSE/RESUME which have lockset handling) — the only self-consistent reason to allow it up is for the terminus source to honor it (DS-1 L1.11 'invalidate-request'); it is a cache-drop request not an imperative WRITE (the next value still comes from the source side), so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN have no coherent terminus action. Closes the F-NO-IMPL-DEFINED gap (B11)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D39","layer":"L4-Q8.A","date":"2026-05-28","question":"pre-CSP-2 gate 3: pin the inspection data shapes (describe schema / observe stream protocol / profile metrics)?","decision":"describe = flat JSON-serializable snapshot {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}, DNode={id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (real operator name per D6/L1.5), status (R-status-enum), value? (absent=SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}; edges derived (R-edges-derived); explain mode = causal-chain subset; renderers are pure fns over the snapshot. observe = read-only enveloped EGRESS (NOT a graph node — avoids self-observation island, D19 read-only), item ObserveEvent={path, msg, tier, seq (graph-local clock, D26)}; one shape for single/subtree/whole-graph. profile = opt-in accumulated-counter snapshot {waves; nodes:Record<path,{invokes,emits,resolved,errored,duration?}>}, backed by an opt-in dispatcher/graph recorder (F-DISPATCH-ALL invoke funnel), NEVER on the thin node (R-node-thin), default-off (F-PERF). All three share the mount-aware :: path key + status/tier/seq metadata. Streaming describe / live-topology = an observe topology-event, DEFERRED to CSP-2 viz","rationale":"守 R-node-thin (profile→dispatcher recorder, not node); observe read-only egress avoids self-observation island + honors D19; consistent with the already-drafted R-describe/R-observe (only pins exact fields + adds R-profile). Inspection is per-language, never in parity (D24) — these rules DOCUMENT the cross-lang contract (covers_by:[], no conformance/TLA+), they do not gate parity","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D40","layer":"L1.5","date":"2026-05-28","question":"clean-slate @graphrefly/ts 如何从 pure-ts(~49 operator + 5 上层子系统)铺开 operator/上层库?","decision":"Catalog-first：CSP-8 dogfood 之前，以冻结的 pure-ts(D41)为权威参照系统性 re-derive 完整 operator 库 + 上层子系统(sources/composition/storage/data-structures/render)到新 substrate，不依赖 dogfood 拉动。re-derive 须对齐 clean-slate 新语义(R-rom-ram RAM 累加器 per B13、SENTINEL=prevData===undefined、push-on-subscribe、two-phase)，逐个重想 edge case 而非 1:1 搬运；每 operator 配 describe 快照测试(D39)。operator/sources/composition/storage/data-structures 是 per-language(D6/D24)永不进 parity；唯一例外是 rewire=substrate，走 conformance(C-8)。承接 cons：到 D1 价值更慢，已接受。排期 CSP-2.5(substrate rewire)→CSP-2.6(sources+operator-opts 底座)→CSP-2.7(operator catalog)→CSP-2.8(上层子系统)，CSP-8 消费完整库","rationale":"用户优先『上层零丢弃+完整性』高于 time-to-value；general operators 天然 ≥2 segment(满足 F-NO-WEDGE-CUT，非 R11 式 vertical wedge)；冻结 pure-ts 作参照避免知识流失；rewire 是 project_rewire_gap 已知缺口，Catalog-first 自然补上","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D41","layer":"L6","date":"2026-05-28","question":"旧包 @graphrefly/graphrefly(门面，D32 已退役 D080/D206)+ @graphrefly/pure-ts v0.49 怎么处置?","decision":"冻结为只读 reference：不再开发，作为 clean-slate re-derive operator/上层(D40)时『有哪些、什么语义、什么 edge case』的权威参照；待 @graphrefly/ts 达到 intent-parity 后删除。CLI/parity-tests/demos 对旧包的依赖在删除前需迁移或一并退役","rationale":"no-backward-compat 允许删，但 re-derive 期间知识价值最高，过早删=逼 git 考古；D32 已定门面架构退役","supersedes":[],"status":"locked","session":"DS-1"}],"phases":[{"id":"CSP-0","title":"spec finalize (rules + .proto IDL + .tla + conformance scenarios)","status":"done","deps":[],"sessions":["DS-1"],"gap":false,"note":"DONE 2026-05-28: 52 rules (B7 migration), protocol.proto IDL (DR-2), conformance C-1..C-5 detailed, formal modules wave_xgraph/wave_async/wave_async_paused (C-1/C-4/C-2) TLC-green + existing wave_protocol (C-3/C-5); dashboard gate green. Rules status=draft until CSP-1+ impl arms flip them active. Unblocks CSP-1/CSP-5/CSP-7"},{"id":"CSP-1","title":"TS substrate: node/dispatcher/pool(LocalSync+LocalAsync)/wave protocol","status":"impl","deps":["CSP-0"],"sessions":["DS-1"],"gap":true,"note":"kernel landed @graphrefly/ts 2026-05-28 (packages/ts): node + dispatcher + LocalSync/LocalAsync pools + wave protocol + lifecycle + control(PAUSE/async) + batch + dynamicNode; 36 tests + tsc + tsup(ESM/CJS/DTS) + biome all green. /qa DONE 2026-05-28 (41 tests; fixes EC1/EC2/EC3/BH1/BH3/BH6). Pending: CSP-3 conformance to flip draft rules active. Deferred refinements B8/B9 (impl polish). B10 (re-entrancy reject, D37/R-reentrancy) + B11 (up-at-source, D38/R-up-at-source) LANDED 2026-05-28 (node.ts _runWave guard + _up terminus rule; reentrancy.test + up-source.test). R-reentrancy/R-up-at-source flipped active via C-6/C-7 TS arm"},{"id":"CSP-2","title":"TS graph layer: graph/sugar(8 verb)/operators/inspection(describe·observe·profile)","status":"impl","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"graph layer landed @graphrefly/ts 2026-05-28: Graph + 8-verb sugar (node/state/producer/derived/effect/batch/mount + StateNode.set) with D27 sugar→ctx-fn wrapping + D30 throw→ERROR boundary; core operators map/filter/scan/merge/take/distinctUntilChanged (D6 real factory names); inspection describe (D39 flat snapshot + explain + mount ::) / observe (read-only enveloped egress) / profile (opt-in dispatcher-recorder, counters off the thin node). 76 tests + tsup(ESM/CJS/DTS) green. C-6/C-7 TS conformance green. /qa DONE 2026-05-28 (77 tests; fixes A-1 observe :: subtree boundary, A-2 up-INVALIDATE via _down for batch/pause consistency, D-2 profile totalInvokes graph-scoped; spec precision D-1 R-reentrancy/C-6 'located at a node on the cycle' + D-3 R-observe/D19 'read-only≠activation-free'; QA-deferred → B12/B13). rust/py arms (CSP-5/7) + R-describe/observe/profile per-language. Inspection streaming/live-topology deferred to viz"},{"id":"CSP-2.5","title":"substrate rewire (setDeps/addDep/removeDep, intra-graph; R-rewire active via C-8)","status":"design","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"D40 Catalog-first prerequisite: rewire is SUBSTRATE (not sugar) — needed by higher-order operators (mergeMap/switchMap/concatMap/exhaustMap/flatMap = runtime inner-subscription). NOT in @graphrefly/ts yet (only in pure-ts core/node+sugar+graph). R-rewire drafted since D22 (intra-graph only, D22 causal domain); author conformance C-8, implement in substrate, drive green, flip R-rewire active. PENDING before impl: pin mid-wave rewire semantics (dirty/first-run-gate re-arm on addDep; removeDep re-eval) — may need a design/spec pass (F-NO-IMPL-DEFINED)"},{"id":"CSP-2.6","title":"sources + operator-opts factory base","status":"design","deps":["CSP-2"],"sessions":["DS-1"],"gap":true,"note":"D40: per-language binding layer (feedback_async_sources_binding_layer). timer/interval/fromPromise/fromAsyncIter sources (async only at source/pool boundary, R-no-raw-async/F-SYNC-CORE) — prerequisite for time operators (debounce/throttle/delay/interval/timeout/sample). Shared operator-opts factory base (operatorOpts/partialOperatorOpts/gatedOperatorOpts equiv) to avoid 49x ctx-wiring duplication. pure-ts ref: extra/sources(6)"},{"id":"CSP-2.7","title":"operator catalog re-derive (~49 from pure-ts reference)","status":"design","deps":["CSP-2.5","CSP-2.6"],"sessions":["DS-1"],"gap":true,"note":"D40 main body: systematic re-derive grouped by pure-ts file (transform->combine->take->buffer->control->time->higher-order), ~49 operators. per-language sugar (D6, real factory names, never parity D24). Each operator: describe snapshot test (D39); edge-cases reworked for clean-slate semantics (R-rom-ram RAM accumulators B13, :"user vision: messaging-hub reactive jira built on clean-slate. Consumes the full re-derived operator/upper-layer catalog (D40 Catalog-first: CSP-2.7 operators + CSP-2.8 subsystems)"}],"backlog":[{"id":"B1","title":"WorkerPool + RemotePool 实现","state":"deferred","trigger":"cross-process / 同机多核 consumer 出现","lang":"all","ref":"D20"},{"id":"B2","title":"protobuf wire codec 实现","state":"deferred","trigger":"cross-runtime wire bridge 落地(L2.F)","lang":"all","ref":"D33"},{"id":"B3","title":"versioning v1-v3 content-addressing (cid/schema/caps)","state":"deferred","trigger":"post-1.0 audit-anchor / cross-graph ref demand","lang":"all","ref":"D26"},{"id":"B4","title":"live viz UI (topology + per-node cache)","state":"deferred","trigger":"post-1.0；substrate streaming describe/observe ready(L5-Q3)","lang":"all","ref":"DS-1"},{"id":"B5","title":"domain 概念(一 domain 含多 graph)","state":"deferred","trigger":"inspection 边界 vs 并发边界冲突真实出现","lang":"all","ref":"DR-4"},{"id":"B6","title":"end-user 说明书站(getting-started + 生成 API ref)","state":"deferred","trigger":"pre-1.0 public 发布前","lang":"per-package","ref":"DS-1"},{"id":"B7","title":"全 jsonl 文档迁移：现有 GRAPHREFLY-SPEC.md/COMPOSITION-GUIDE*.md → rules.jsonl/guide.jsonl","state":"open","trigger":"CSP-0 spec finalize","lang":"all","ref":"D14"},{"id":"B8","title":"batch full per-item coalescing (downstream fn receives [v1..vK]); CSP-1 kernel ships last-value coalescing","state":"deferred","trigger":"consumer needs per-item batch-drain accounting","lang":"ts","ref":"D12,R-batch-coalesce"},{"id":"B9","title":"PAUSE resumeAll R2.6.1 pre-pause baseline-equals replay (cache advances mid-pause); CSP-1 kernel buffers+replays on resume without mid-pause cache advance","state":"deferred","trigger":"resumeAll equals-collapse fidelity needed","lang":"ts","ref":"R-pause-modes"},{"id":"B10","title":"re-entrancy / synchronous feedback-cycle reject: a compute node fn that re-drives its own dep mid-wave is a wave-level ERROR, detected node-locally via _insideRunWave (surfaced QA on @graphrefly/ts CSP-1)","state":"open","trigger":"design LOCKED (D37) + spec-amended (R-reentrancy draft + conformance C-6 + formal wave_reentrancy.tla TLC-green, mutation-verified); NOW implement the in-wave reject in CSP-1 substrate + graph-layer throw→ERROR (D30) in CSP-2, drive C-6 green per arm, then flip R-reentrancy/C-6 active","lang":"all","ref":"D37,R-reentrancy,C-6"},{"id":"B11","title":"upstream control at a depless source: INVALIDATE-up self-invalidates + cascades down (honor invalidate-request); DIRTY/TEARDOWN-up drop","state":"open","trigger":"design LOCKED + spec-amended (D38 / R-up-at-source draft / conformance C-7 / formal wave_up_source.tla TLC-green); NOW implement the terminus rule in CSP-1 substrate _up (depless source: INVALIDATE→self _invalidate+down-cascade, DIRTY/TEARDOWN→drop) + guard opt-out, drive C-7 green per arm, then flip R-up-at-source/C-7 active","lang":"all","ref":"D38,R-up-at-source,C-7"},{"id":"B12","title":"CSP-2 inspection follow-ups (QA-deferred 2026-05-28): profile metric completeness (emits/resolved/errored via observe-aggregation — impl ships invokes+duration+status only); describe explain-mode is mount-blind (single-graph; a cross-mount explain returns partial); observe non-activating tap option (observe currently activates cold nodes, D19-clarified + accepted)","state":"deferred","trigger":"a consumer needs richer profile metrics / cross-mount explain / non-perturbing observe","lang":"ts","ref":"D39,R-profile,R-describe,R-observe"},{"id":"B13","title":"CSP-2 operator semantics follow-ups (QA-deferred 2026-05-28): scan/distinctUntilChanged accumulator resets on deactivate→reactivate (RAM-consistent per R-rom-ram; add ctx.state.persist opt-in if a consumer needs cross-reconnect continuity); merge drops RESOLVED-absorbed re-emits (changes-only stream; add equals/emitResolved option if needed)","state":"deferred","trigger":"a consumer needs persistent operator accumulators / RESOLVED-passthrough merge","lang":"ts","ref":"D6,R-rom-ram"}],"antipatterns":[{"id":"AP1","pattern":"把命令式 helper 包成 reactive primitive","why":"primitive 不可避免地再暴露命令式 helper 作 method","instead":"widen helper 的 args 到 T|Node<T>，caller opt-in reactive 控制","ref":"feedback_no_imperative_wrap_as_primitive"},{"id":"AP2","pattern":"eager-placeholder 上游污染 SENTINEL","why":"ctx 永远拿不到真正的 absence-of-DATA 状态","instead":"修上游别 eager-emit；用 prevData[i]===undefined 作 never-emitted 检测","ref":"feedback_use_prevdata_for_sentinel"},{"id":"AP3","pattern":";-chain 后台 cargo/长命令","why":"deadlock≠thrash 混淆；进程组杀不干净","instead":"一次一 target；bounded -j；按进程组杀；direct log + DONE sentinel","ref":"feedback_no_chained_background_cargo"},{"id":"AP4","pattern":"stale premise propagation","why":"design session task table lag code；按过期前提开 9Q","instead":"grep 命名符号+check landed marker；过期前提作 HALT 上报","ref":"feedback_verify_premise_before_greenfield"},{"id":"AP5","pattern":"自作主张做架构决策","why":"silently 选边，掩盖 spec↔code 冲突","instead":"surface 冲突让 user 拍；多文件重写按文件 review","ref":"feedback_no_autonomous_decisions"},{"id":"AP6","pattern":"在 archive 用文字标 active/superseded","why":"标记易腐，active 和 superseded 混在一个目录","instead":"物理目录分 active/archive；状态进 jsonl status 字段","ref":"P3"},{"id":"AP7","pattern":"canonical 职责分裂到多文档","why":"sequencer/decision-log 散多处，迁移期混乱","instead":"单一 canonical per 职责；decisions 单一 D# 序列","ref":"P1,P2"}],"rules":[{"id":"R-msg-format","area":"message","statement":"message = array of [Type, Data?] tuples; one array passed to ctx.down/ctx.up = one wave; in-process representation = tuple, wire representation = protobuf, decoupled at the wire-bridge boundary","rationale":"D8 up/down(msgs); D11 tuple/protobuf decoupled","status":"draft","since":"D8,D11","covers_by":[]},{"id":"R-msg-closed-set","area":"message","statement":"10 message types, CLOSED: START + DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN/PAUSE/RESUME. No open set, no user-defined custom types, no MessageTypeRegistry; the old unknown-type-forwarding rule is retired (vacuous under a closed set). Adding a tier/type = spec change (constitutional)","rationale":"D9 9-type closed set + START handshake; D18 messageTier compile-time const, custom types CUT","status":"draft","since":"D9,D18","covers_by":[]},{"id":"R-tier","area":"message","statement":"messageTier const table (7 tiers): 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN. Tiers <3 dispatch immediately; tiers ≥3 are batch-deferred (DATA/RESOLVED in the settle slice, INVALIDATE alongside, terminal after, TEARDOWN last). Closed const table — adding a tier is constitutional","rationale":"D34 ratified numbering (old-spec with PAUSE/RESUME↔DIRTY swap so control precedes notification); D9 closed set","status":"active","since":"D9,D34","covers_by":["C-1"]},{"id":"R-data-payload","area":"message","statement":"[DATA,v] requires a non-SENTINEL payload (v ≠ undefined/None/per-language sentinel); [ERROR,e] requires a non-SENTINEL payload; bare [DATA]/[ERROR] and [DATA,SENTINEL] are rejected at the dispatch boundary; null is a valid DATA value (domain-level absence)","rationale":"D16 SENTINEL = absence-of-DATA must stay decidable; DATA(SENTINEL) would be indistinguishable from never-emitted","status":"draft","since":"D16","covers_by":[]},{"id":"R-wave-boundary","area":"wave","statement":"batch 外: 一次 ctx.down(msgs)=一个 wave；batch 内: 累积到 commit=一个 wave","rationale":"","status":"active","since":"D8,D12","covers_by":[]},{"id":"R-dirty-before-data","area":"wave","statement":"every tier-3 (DATA/RESOLVED) emission is preceded by DIRTY in the same wave; the dispatcher synthesizes a [DIRTY] prefix when the caller omits it and the node is not already dirty; raw and framed emission paths are observationally identical on the wire","rationale":"glitch-free two-phase contract; D9 mechanism is impl freedom but the DIRTY-before-DATA ordering is observable","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-two-phase","area":"wave","statement":"DIRTY (phase 1) propagates through the entire reachable graph before DATA/RESOLVED (phase 2) begins — glitch-free diamond. Activation exemption: a compute fn's first run during subscribe() does not require a preceding DIRTY","rationale":"two-phase push guarantees a fan-in node sees all settled deps before recompute","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-diamond","area":"wave","statement":"diamond/fan-in: D recomputes exactly once after all changed deps settle in same wave","rationale":"spec 只写可观察行为；机制(dirtyMask)是 impl freedom","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-equals","area":"wave","statement":"equals 替换(DATA→RESOLVED) 仅在 wave 内恰好 1 个 DATA 时触发；0 无关；≥2 全 DATA. Within one wave at one node the tier-3 slot is ≥1 DATA XOR exactly 1 RESOLVED — never mixed (tier-3 wave exclusivity). Default equals = Object.is/is; custom equals via node opts; never invoked while cache is SENTINEL","rationale":"多 DATA 无跳过-fn 收益; exclusivity keeps cache coherent with last-delivered DATA","status":"active","since":"D15","covers_by":[]},{"id":"R-same-wave-merge","area":"wave","statement":"multiple settle-class messages on one node in one wave are resolved by tier-sort (DATA advances cache, a trailing INVALIDATE clears it; subscribers observe the full sequence). The sole explicit merge rule is INVALIDATE+INVALIDATE collapse (cleanup hook fires at most once). DATA+RESOLVED in the same wave on the same node is a protocol violation (R-equals)","rationale":"tier ordering produces the right end-state without silently eliding messages","status":"draft","since":"D8","covers_by":[]},{"id":"R-invalidate-idempotent","area":"wave","statement":"INVALIDATE is broadcast at most once per node per wave (diamond fan-in cascades it once, not once per arriving path); an INVALIDATE arriving at an already-reset OR never-populated cache is a no-op — neither the cleanup hook nor the downstream broadcast fires again","rationale":"prevents double-cleanup and wedged-DIRTY deadlock; the two reset states are observationally equivalent downstream","status":"active","since":"D9","covers_by":["C-3"]},{"id":"R-sentinel","area":"wave","statement":"SENTINEL=absence-of-DATA，protocol 可判定；具体哨兵值 per-language(TS undefined/Rust None/Py sentinel)","rationale":"","status":"active","since":"D16","covers_by":[]},{"id":"R-push-subscribe","area":"wave","statement":"push-on-subscribe: SENTINEL 态推 [START]；dirty 态推 [START,DIRTY]；cached DATA 推给新 subscriber. START is the handshake — the first message any sink receives on a subscription, emitted before any other downstream delivery, not forwarded through intermediate nodes","rationale":"","status":"active","since":"D9","covers_by":[]},{"id":"R-terminal","area":"wave","statement":"terminal-is-forever 默认；resubscribable opt-in 触发 fresh-lifecycle reset. A late subscribe to a non-resubscribable terminal node is REJECTED (idiomatic error); to a resubscribable terminal node it resets the lifecycle (clears terminal/has-fired-once/DepRecords, drains pause lockset, re-arms first-run gate) before installing the sink. TEARDOWN does not block reset","rationale":"D17; resubscribable IS the property gating late-subscribe re-activation","status":"active","since":"D17","covers_by":[]},{"id":"R-deps-terminal","area":"wave","statement":"completeWhenDepsComplete (default true): node auto-emits COMPLETE when ALL deps complete (not ANY — combineLatest semantics). errorWhenDepsError (default true): node auto-emits ERROR when any dep errors. Terminal-emission operators (last/reduce) set completeWhenDepsComplete:false; rescue/catch operators set errorWhenDepsError:false and read ctx.depRecords[i].terminal explicitly","rationale":"effect/derived completion is the join of all deps; rescue needs explicit terminal handling","status":"draft","since":"D30","covers_by":[]},{"id":"R-ctx-up","area":"protocol","statement":"ctx.up 仅 control tier(DIRTY/PAUSE/RESUME/INVALIDATE/TEARDOWN)；DATA/RESOLVED/COMPLETE/ERROR 是 down-only","rationale":"方向语义；DR-5 新增","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-node-thin","area":"node","statement":"node = thinnest primitive: holds fn handle + deps + wave state machine (dep_records, dirty_mask, pending_count, cache, status, subscribers, pause_lockset); ZERO inspection cruft. Bare node() works at the substrate level but loses naming/find/describe — those are graph-layer","rationale":"D5 Node↔Graph responsibility split; thin node ports cleanly to Rust","status":"draft","since":"D5","covers_by":[]},{"id":"R-node-iface","area":"node","statement":"node exposes: cache (readonly getter, never throws, never triggers computation), status, down(msgs), up(msgs) (restricted to control tier per R-ctx-up), subscribe(sink)→unsubscribe. cache replaces the old get()","rationale":"D5 minimal node surface; D8 up/down boundary","status":"draft","since":"D5,D8","covers_by":[]},{"id":"R-status-enum","area":"node","statement":"status ∈ {sentinel, pending, dirty, settled, resolved, completed, errored}; status is the source of truth for cache freshness (dirty → stale prior value, settled/resolved → fresh, completed/errored → final). cache never throws, never computes","rationale":"D5 inspection reads status not raw cache","status":"draft","since":"D5","covers_by":[]},{"id":"R-rom-ram","area":"node","statement":"state node (no deps) retains cache across disconnect — value is intrinsic/non-volatile (ROM). Compute node (deps and/or fn) clears cache on deactivation → status sentinel (RAM); reconnect re-runs fn from scratch with cleared DepRecords","rationale":"D5; compute value is a function of live subscriptions","status":"draft","since":"D5","covers_by":[]},{"id":"R-fn-contract","area":"node","statement":"node fn = (ctx)=>void; ctx = {up(msgs), down(msgs), depRecords[{latest, tier, prevData, terminal}], state, onDeactivation, onInvalidate}. NO return-value framing — all emission is explicit via ctx.down. Sugar (derived/effect/operator) value-level fn is wrapped to a ctx-fn in the graph layer at register time; node/producer are ctx-level (intentional tier power surface, DR-1)","rationale":"D8 ctx.up/down; D27 sugar→ctx-fn conversion strictly in graph layer feeds behavioral parity","status":"draft","since":"D8,D27","covers_by":[]},{"id":"R-cleanup-hooks","area":"node","statement":"two cleanup hooks: ctx.onDeactivation(fn) (release external resources on deactivation) + ctx.onInvalidate(fn) (flush on INVALIDATE). onRerun (0 callsites) and onResubscribableReset (1 callsite → absorbed by ctx.state lifecycle) are cut. fn return value is freed for sugar mapping","rationale":"D28; internal state reset belongs to ctx.state lifecycle, cleanup hooks only manage external resources + INVALIDATE","status":"active","since":"D28","covers_by":[]},{"id":"R-ctx-state","area":"node","statement":"ctx.state = per-node private cross-wave state (implicit OK — node-private, not shared). Default fresh-lifecycle wipe; ctx.state.persist(on?) keeps across lifecycle. Shared/observable state must be an explicit node + dep (not ctx.state). INVALIDATE is lifecycle-continue (not fresh-lifecycle) so it does NOT wipe ctx.state — manual flush via onInvalidate","rationale":"D23 private state OK, shared memory explicit; D29 fresh-lifecycle wipe + persist","status":"active","since":"D23,D29","covers_by":["C-3"]},{"id":"R-first-run-gate","area":"node","statement":"compute fn first-fires only after every declared dep has settled (delivered ≥1 real DATA this or a prior wave) under partial:false — producing one combined initial wave. partial:true turns the gate OFF (fn fires as soon as dirty-dep-count hits 0; fn body MUST guard SENTINEL per dep). terminalAsRealInput:true also lets a dep terminal settle the gate (Reduce-class). The gate is first-run-only (has-called-fn-once); INVALIDATE does not re-arm it; a resubscribable terminal reset does","rationale":"clean multi-dep activation handshake without phantom partial waves","status":"active","since":"D9,D17","covers_by":[]},{"id":"R-initial","area":"node","statement":"initial (non-SENTINEL): pre-populates cache and a source pushes [DATA,initial] on subscribe; first emit runs equals against initial. Absent/undefined initial → cache holds SENTINEL, no push-on-subscribe, first emit is always DATA. INVALIDATE and resetOnTeardown return cache to SENTINEL","rationale":"D16 sentinel semantics; initial is T|null never T|undefined","status":"draft","since":"D16","covers_by":[]},{"id":"R-dynamic-node","area":"node","statement":"dynamicNode = node construction variant (NOT a verb): declares a superset of all possible deps at construction, fn reads a subset per invocation via track(dep). All declared deps participate in wave tracking; an unused dep's update fires fn but equals-absorption prevents downstream propagation. Same first-run gate as static nodes. Intra-graph only — cross-graph deps go through the wire bridge (no inter-graph dynamicNode)","rationale":"D35 distinct from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds tracked deps to one causal domain","status":"draft","since":"D35","covers_by":[]},{"id":"R-pause-lockset","area":"control","statement":"PAUSE/RESUME 带 lock_id；lockset 语义：所有 lock RESUME 才真 resume；同 id 幂等；RESUME 未知 no-op","rationale":"","status":"active","since":"D10","covers_by":["C-5"]},{"id":"R-pause-modes","area":"control","statement":"pausable {true | 'resumeAll' | false}. true (default): skip fn while any lock held, fire fn once on final-lock RESUME with latest dep values; a leaf source's own external down() is NOT gated in default mode (delivered immediately). 'resumeAll': buffer the node's own tier-3/4 settle slice while paused (incl a leaf source's down()), replay per-entry in arrival order on final-lock RESUME against a pre-pause baseline (equals references the conceptual-timeline cache); tier-5/6 bypass the buffer. false: ignore PAUSE/RESUME (timer sources that must keep producing)","rationale":"PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job","status":"active","since":"D10","covers_by":["C-5"]},{"id":"R-async-paused","area":"control","statement":"async-result 到达 paused node: 进 pause buffer，RESUME 时 replay","rationale":"DR-3","status":"active","since":"DR-3","covers_by":["C-2"]},{"id":"R-teardown-complete","area":"control","statement":"a [[TEARDOWN]] arriving at a non-terminal node synthesizes a [COMPLETE] prefix in the same wave ([[COMPLETE],[TEARDOWN]]) so bridge subscribers resolve before unwiring. Idempotent (subsequent TEARDOWN arrives alone); skipped when the wave already carries COMPLETE/ERROR","rationale":"clean complete-then-teardown lifecycle pair; firstValueFrom-style bridges need the COMPLETE","status":"draft","since":"D9","covers_by":[]},{"id":"R-replay-buffer","area":"control","statement":"replayBuffer:N → node keeps a circular buffer of the last N outgoing DATA values; a late subscriber receives buffered DATA after the START handshake and before live updates","rationale":"replaces the replay() operator + subscribe-hook monkeypatching","status":"draft","since":"D9","covers_by":[]},{"id":"R-restore","area":"lifecycle","statement":"restore≠fresh-lifecycle: snapshot 序列化所有 ctx.state；restore 恢复全部(不 wipe)；wipe 仅 fresh-lifecycle transition","rationale":"Flag 1; DR-5 新增","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-snapshot","area":"lifecycle","statement":"snapshot = topology + cache + factory-name refs (NOT fn bodies — the fn lives in code). restore re-resolves nodes by factory name via the dispatcher registry; an anonymous inline fn (no name) is marked local-only and cannot restore cross-process (honestly labeled). Incremental restore via changeset. Storage tiers / WAL / codec / envelope are presentation-layer + deferred, not substrate rules","rationale":"D25; fn cannot serialize, factory-registry re-resolution model","status":"draft","since":"D25","covers_by":[]},{"id":"R-graph-role","area":"graph","statement":"Graph = convenience + inspection entry: register/name/find/describe/observe/profile/snapshot/mount/batch/operators. g.* sugar desugars to dispatcher.register + Node + auto-registers into the graph inspection index. Graph is optional convenience, not a mandatory container; multi-graph is natural","rationale":"D5 Graph holds all convenience+inspection; D3 graph-first mental anchor","status":"draft","since":"D5","covers_by":[]},{"id":"R-edges-derived","area":"graph","statement":"edges are derived on-demand from each node's construction-time deps + the mount hierarchy; there is no stored edge registry and no connect/disconnect. Every edge shown in describe has a real protocol subscription behind it — decorative edges are not representable","rationale":"D3 topology is a pure function of (nodes, deps, mounts)","status":"draft","since":"D3","covers_by":[]},{"id":"R-rewire","area":"graph","statement":"setDeps/addDep/removeDep = runtime rewire, INTRA-graph only (rewire scope = a single graph; there is no inter-graph rewire form). Cross-graph wiring is only via the wire bridge","rationale":"D22 graph = causal domain; rewire stays within one single-threaded domain","status":"draft","since":"D22","covers_by":["C-8"]},{"id":"R-mount","area":"graph","statement":"graph.mount(subgraph,{at}) embeds a child graph addressable under the parent namespace (:: delimited paths); lifecycle signals propagate parent→mounted children; mount has no deps (exempt from deps-first ordering)","rationale":"D4 mount verb; L4-Q4 mount exemption","status":"draft","since":"D4","covers_by":[]},{"id":"R-describe","area":"graph","statement":"describe(opts?) = static, JSON-serializable structure snapshot: {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}. DNode = {id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (operator real name per D6/L1.5, not 'derived'), status (R-status-enum), value? (field ABSENT = SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}. edges are derived from deps + mount hierarchy (R-edges-derived). value carries the cache snapshot at call time; fn bodies are never serialized (factory-name ref only, D25). describe({explain:{from,to}}) = causal-chain subset (same shape, filtered to the from→to chain). Renderers (pretty/mermaid/d2) are pure functions over the snapshot — NOT methods and NOT a describe({format}) option; there is no graph.explain(). Live-topology streaming (rewire deltas) is an observe topology-event, deferred to CSP-2 viz","rationale":"D3 describe first-class; D39 pins the field set; L4-Q8 renderers pure fns; D25 snapshot same source; per-language (D24, never in parity — documented contract, not conformance-tested)","status":"draft","since":"D3,D39","covers_by":[]},{"id":"R-observe","area":"graph","statement":"observe(path?) = read-only live message tap returning a subscribable EGRESS ({subscribe(sink)→unsubscribe}) — NOT a graph node (no self-observation island). observe is a REAL (lazily-activating) subscriber: it uses subscribe internally, so observing a COLD node activates it + its upstream (running their fns), and observing a cached node receives the [DATA,cached] push (R-push-subscribe). 'Read-only' (D19) means observe never EMITS or MUTATES node state — it does NOT mean activation-free; observing a cold graph activates it. Each stream item is an enveloped ObserveEvent = {path, msg (the Message), tier (messageTier), seq (graph-local monotonic clock, D26)}; the envelope carries node identity so single-node / subtree / whole-graph observe share ONE shape. Upstream control is a separate Graph affordance: single-node up(msgs) / all-nodes up(path,msgs) (e.g. PAUSE); a node guard denying an upstream message drops it silently (R-up-at-source)","rationale":"D5 Graph IS the introspection layer; D39 pins the ObserveEvent envelope + read-only egress (not a node); D19 inspection read-only; per-language (D24, never in parity)","status":"draft","since":"D5,D39","covers_by":[]},{"id":"R-inspection-set","area":"graph","statement":"inspection surface = describe (incl explain mode) + observe + profile — 3 first-class methods on Graph; no separate Inspector object","rationale":"L4-Q8 inspection consolidation","status":"draft","since":"D5","covers_by":[]},{"id":"R-meta-presentation","area":"graph","statement":"meta companion stores are presentation/graph-layer, NOT substrate. Static annotations (description/type/range/format/access/tags/unit) → describe metadata attached via g.node opts. Reactive annotations (a status/error that changes over time) → explicit nodes + dep (R-ctx-state / D23). The substrate node carries zero meta machinery. meta.owner ABAC is presentation/multi-agent, out of substrate scope","rationale":"D36; D5 node=thinnest, meta is annotation feeding describe (graph owns inspection)","status":"draft","since":"D36","covers_by":[]},{"id":"R-graph-lifecycle","area":"graph","statement":"graph.signal(msgs) broadcasts a message to all registered nodes (e.g. [[PAUSE,lockId]] or [[INVALIDATE]]); graph.destroy() broadcasts [[TEARDOWN]]. graph.set(name,v) = node.down([[DATA,v]]) sugar; graph.get(name) = cache read","rationale":"D5 graph convenience; L4-Q1 state.set = node.down sugar","status":"draft","since":"D5","covers_by":[]},{"id":"R-clock","area":"runtime","statement":"monotonic time = a graph-local counter (causal-domain ordering, folded into the graph); wall-clock = a system call; there is NO global clock singleton","rationale":"D26 / L3-Q9 config dissolution; graph = causal domain so ordering is graph-local","status":"draft","since":"D26","covers_by":[]},{"id":"R-dispatch-all","area":"runtime","statement":"all fn go through the dispatcher / FactoryRegistry; node((ctx)=>...) also runs through the LocalSync pool. There is no inline-fn-bypasses-dispatcher path","rationale":"F-DISPATCH-ALL; sacred L0.7 (all fn through dispatcher)","status":"draft","since":"D21","covers_by":[]},{"id":"R-sync-core","area":"runtime","statement":"dispatcher.invoke is sync void — wave-state mutation always serializes onto the graph's single thread; async/remote execution returns via a pool callback. 1.0 pools = LocalSync + LocalAsync; dispatcher keeps a pluggable pool trait for WorkerPool/RemotePool","rationale":"F-SYNC-CORE; D20 pool set; sacred L0.7 (wave protocol impl is sync)","status":"draft","since":"D20,D21","covers_by":[]},{"id":"R-handle","area":"runtime","statement":"handle = pure data (pool_id, handle_id), NO methods — serializable/snapshottable/wire-transferable; it is a dispatcher-table index. node ≠ handle (node has up/down methods at the external-world boundary)","rationale":"D7 handle is pure data","status":"draft","since":"D7","covers_by":[]},{"id":"R-graph-domain","area":"runtime","statement":"graph = causal domain = concurrency domain = single thread. Compute parallelism is via pool callback (results serialize back to the graph's thread); true parallelism is via multiple graphs + wire bridge. Disjoint waves in the same graph do not parallelize","rationale":"D22 wave protocol is lock-free because the graph boundary is the concurrency boundary","status":"active","since":"D22","covers_by":["C-1","C-4"]},{"id":"R-no-polling","area":"principle","statement":"state changes propagate reactively via messages; never poll a node's value on a timer or busy-wait for status; periodic behavior is a reactive timer source emitting through the graph","rationale":"spec §5.8 durable value","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-imperative","area":"principle","statement":"no imperative side-channel triggers (event emitters, callbacks, setTimeout+set) to drive graph behavior; all coordination uses ctx.up signals + message flow through topology; remove imperative paths when no caller depends on them","rationale":"spec §5.9 durable value (feedback_no_imperative)","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-raw-async","area":"principle","statement":"no bare async primitives in the reactive layer (TS: Promise/queueMicrotask/setTimeout/process.nextTick; PY: asyncio.create_task/threading.Timer/raw coroutines). Async boundaries live only in sources (fromPromise/fromAsyncIter) and the pool/runner layer","rationale":"spec §5.10; F-SYNC-CORE async only at pool/wire boundary","status":"draft","since":"D20","covers_by":[]},{"id":"R-data-not-peek","area":"principle","statement":"all data propagation — including initial values at connection time — flows through messages [[DATA,v]]; nodes do not peek a dep's .cache to seed computation; .cache is a read-only accessor for external consumers","rationale":"spec §5.12 single mental model: if data moved, a message carried it","status":"draft","since":"D3","covers_by":[]},{"id":"R-primary-api-clean","area":"principle","statement":"protocol internals (DIRTY/RESOLVED/bitmask) never surface in the value-level primary API (derived/effect/operator); ctx-level primitives (node/producer) intentionally expose tier as a power surface (DR-1 §5.11 amend). A developer using value-level sugar never reads the spec to start","rationale":"DR-1 ctx-level is a deliberate protocol-facing power surface; value-level is §5.11-compliant primary","status":"draft","since":"DR-1","covers_by":[]},{"id":"R-reentrancy","area":"wave","statement":"a synchronous feedback cycle — a node fn that, during its invocation, transitively re-drives one of its own (direct or indirect) deps so the same node's fn would re-enter before its wave completes — is a wave-level protocol ERROR. Detection is node-local and free: a node refuses to enter its fn-run while its own in-wave flag (_insideRunWave) is already set, and throws; the graph layer catches the throw and converts it to [[ERROR, e]] down (D30 — value-level throw → graph-layer ERROR), located at a node ON the cycle (the value-level catch nearest the throw on the synchronous unwind — implementation-determined, NOT necessarily the re-entered node), aborting the wave. The core neither queues nor bounds-then-runs the cycle (reject, not iterate). Legitimate accumulation uses per-node ctx.state (e.g. scan): not a topological cycle, never re-enters. Async feedback that crosses a turn boundary via an async pool is out of scope — it is not synchronous re-entry and does not desync the wave. No numeric rerun-depth cap is needed (precise in-wave flag detection supersedes the blunt maxFnRerunDepth)","rationale":"D37; surfaced by CSP-1 /qa (backlog B10); reject (B) over queue-to-wave-end (A) because A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; detection reuses the existing _insideRunWave flag, dispatcher stays a pure funnel (F-DISPATCH-ALL), error ownership graph-level (D30)","status":"active","since":"D37","covers_by":["C-6"]},{"id":"R-up-at-source","area":"protocol","statement":"a depless source is the terminus of upstream control forwarding (R-ctx-up). It self-ACTS only on a message with a coherent round-trip action: INVALIDATE → HONOR the invalidate-request (clear cache to SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never arrives). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediate nodes never self-act on upstream control — they forward toward deps only; the source is the single actor and the down-cascade is the effect","rationale":"D38; B11; R-ctx-up/DR-5 lists INVALIDATE up-allowed and the only self-consistent reason is terminus honoring (DS-1 L1.11 'invalidate-request'); INVALIDATE-up is a cache-drop request not an imperative write, so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN lack a coherent terminus action","status":"active","since":"D38","covers_by":["C-7"]},{"id":"R-profile","area":"graph","statement":"profile(opts?) = opt-in accumulated-counter snapshot: {waves; nodes:Record<path, NodeProfile>}, NodeProfile = {invokes, emits, resolved, errored, lastDurationNs?, totalDurationNs?}. Counters are backed by an opt-in dispatcher/graph-level recorder (DS-1 inspectorEnabled / globalInspector→dispatcher hook), NEVER stored on the thin node (R-node-thin); the dispatcher is the invoke funnel (F-DISPATCH-ALL) so it is the natural source of invoke counts + fn duration. Default OFF = zero runtime overhead (F-PERF). profile is a point-in-time snapshot (like describe); a streaming profile is an observe-aggregation, not a new mechanism. Shares the mount-aware :: path key with describe/observe","rationale":"D39; L4-Q8 third inspection method; R-node-thin keeps counters off the node; F-DISPATCH-ALL dispatcher sees every invoke; F-PERF opt-in; per-language (D24, never in parity)","status":"draft","since":"D39","covers_by":[]}],"conformance":[{"id":"C-1","name":"cross-graph diamond coalesce","covers":["R-diamond","R-tier","R-two-phase","R-dirty-before-data","R-graph-domain"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"A in g1; B,C in g2 (reached from g1 via wire bridge); D in g1. Edges A→B, A→C, B→D, C→D — a diamond split across two single-threaded graphs.","input":"A.down([[DATA, v]]) (one wave).","expect":"DIRTY crosses the wire to B and C at the same priority as DATA (R12). Phase 1 DIRTY reaches D via both legs before any phase-2 DATA. D recomputes EXACTLY ONCE after both B and C settle in the same logical wave; D's outgoing wave contains a single DATA. No glitch (D never fires on a half-settled diamond).","note":"L2.F mixed-locality survival proof — the diamond stays glitch-free even though B/C live in a different causal domain reached over the wire bridge.","blocked":"wire bridge (backlog B2) — not yet implementable; the in-process diamond core it leans on is green in packages/ts core.test.ts (R-diamond/R-two-phase)","ref":"DR-5"},{"id":"C-2","name":"async-result arriving at paused node","covers":["R-async-paused","R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"Producer P backed by an async (LocalAsync) pool → node N. N has one active pause lock.","input":"1) N.up([[PAUSE, L1]]). 2) P's async fn resolves while N is paused, delivering [[DATA, r]] toward N. 3) N.up([[RESUME, L1]]).","expect":"The async result does NOT drop and does NOT deliver mid-pause; it enters N's pause buffer. On final-lock RESUME (L1 released, lockset empty) the buffered result replays as a wave to N's sinks. lock_id scope = the node-level pause_lockset (consistent with PAUSE buffering DATA).","note":"DR-3 — async-result-at-paused-node is buffer+RESUME-replay, identical to how PAUSE buffers a synchronous DATA.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-3,DR-5"},{"id":"C-3","name":"INVALIDATE × ctx.state × onInvalidate","covers":["R-invalidate-idempotent","R-ctx-state","R-cleanup-hooks","R-sentinel"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"source S → derived D. D's fn sets ctx.state on each run and registers ctx.onInvalidate(flush). A second parent S2 → D exists (diamond) to exercise fan-in idempotency.","input":"1) S settles [[DATA, v]] → D runs, caches, sets ctx.state. 2) S.down([[INVALIDATE]]) — cascades to D via both fan-in paths in one wave.","expect":"D broadcasts INVALIDATE downstream exactly ONCE (not once per fan-in path). D's onInvalidate hook fires exactly once (external flush). ctx.state is NOT wiped — INVALIDATE is lifecycle-continue, not a fresh-lifecycle transition; any internal reset must be done manually in onInvalidate. D's per-dep prevData returns to SENTINEL so a downstream prevData===SENTINEL never-emitted detector reads correctly. A second INVALIDATE arrival in the same wave is a no-op (hook + broadcast do not re-fire).","note":"distinguishes lifecycle-continue (INVALIDATE) from fresh-lifecycle wipe (deactivation / resubscribable reset). TS arm covers single-parent cascade + idempotent no-op + state-preservation; fan-in-in-one-wave needs batch (covered by R-invalidate-idempotent _hasData guard).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-5"},{"id":"C-4","name":"mixed sync/async diamond","covers":["R-diamond","R-two-phase","R-graph-domain","R-first-run-gate","R-dirty-before-data"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"A → B (sync LocalSync leg) and A → C (async LocalAsync pool leg); B→D, C→D. One diamond, one sync leg + one remote/async leg.","input":"A.down([[DATA, v]]).","expect":"D joins EXACTLY ONCE after BOTH legs settle, even though the async leg C settles later via a pool callback. The async pool callback's wave-state mutation serializes back onto the graph's single thread (R-graph-domain), so D's dirty-dep accounting reconciles the sync and async settlements into one recompute. The first-run gate holds D until both deps have delivered real DATA. R-dirty-before-data: a post-activation re-join emits DIRTY before DATA in the same logical wave (observed ['DIRTY','DATA'], glitch-free two-phase).","note":"R8/R9 PoC validated; TS arm now a full conformance test (sync + async pool, same process — no wire bridge needed). R-dirty-before-data earned here via the post-activation re-join DIRTY-before-DATA assertion (CSP-3, 2026-05-28).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-5"},{"id":"C-5","name":"PAUSE lockset multi-source","covers":["R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"node N with two independent pause controllers, A and B.","input":"1) A.up([[PAUSE, LA]]). 2) B.up([[PAUSE, LB]]). 3) A.up([[PAUSE, LA]]) again (duplicate). 4) A.up([[RESUME, LA]]). 5) B.up([[RESUME, LX]]) for an unknown LX. 6) B.up([[RESUME, LB]]).","expect":"After step 1-2 lockset = {LA, LB}, N paused. Step 3 (same-id repeat PAUSE) is idempotent — lockset unchanged. Step 4 removes LA; lockset = {LB}; N STILL paused (B's lock holds). Step 5 (unknown id) is a no-op. Step 6 removes LB; lockset empty; N truly resumes (fires once with latest dep values under default mode). Releasing one controller never resumes the node while another's lock is held.","note":"multi-pauser correctness by construction — paused state derives from lockset.size > 0.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-5"},{"id":"C-6","name":"synchronous feedback cycle → ERROR","covers":["R-reentrancy"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"state S → derived D=([S], n=>n+1) → effect E=([D]); E's fn synchronously calls S.set(...) (a write back to S, an indirect dep of E), so S→D→E plus the feedback write closes a cycle.","input":"Kick the graph so E's fn runs and synchronously re-drives S (S.set) before E's wave completes.","expect":"The re-entrant attempt to run E's fn while E is already mid-wave is detected node-locally (E's in-wave flag is set) and rejected: a node ON the cycle emits [[ERROR, e]] (the graph layer catches the substrate throw at the value-level wrapper nearest the throw on the synchronous unwind — D30; which node is implementation-determined, e.g. D or E), and the wave aborts deterministically. NO silent _pending desync, NO unbounded synchronous recursion / stack overflow, NO surviving half-settled state. A legitimate accumulator over the same S built with ctx.state (scan) does NOT trigger the cycle (no topological re-entry).","note":"B10 / D37. Separates a disguised imperative control-flow loop (rejected) from ctx.state accumulation (allowed). Detection reuses the existing _insideRunWave flag (zero new structure); error ownership graph-level (D30); dispatcher uninvolved. Async feedback across a turn boundary (async pool) is a separate, out-of-scope case.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D37"},{"id":"C-7","name":"upstream control at a depless source","covers":["R-up-at-source"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"depless source S (cached value) → derived D → sink. D (or a sink on D) originates ctx.up([msg]) which forwards upstream to the terminus S.","input":"Three independent runs, one per upstream-allowed non-pause control kind: 1) D.up([[INVALIDATE]]). 2) D.up([[DIRTY]]). 3) D.up([[TEARDOWN]]).","expect":"INVALIDATE: S HONORS the invalidate-request — S.cache returns to SENTINEL, S's onInvalidate hook fires once, and S broadcasts INVALIDATE downstream so D (and the whole downstream cone) clears (D.cache → SENTINEL, D's onInvalidate fires). DIRTY: DROPPED at S — S unchanged (cache + status intact), NO downstream DIRTY, downstream is NOT left wedged awaiting a settle. TEARDOWN: DROPPED at S — S not terminated, NO downstream TEARDOWN. A node guard on S may deny the INVALIDATE (drops silently) — opt-out, not the default.","note":"B11 / D38. Closes the F-NO-IMPL-DEFINED gap on upstream control reaching a depless source. INVALIDATE-up is a cache-drop request (not an imperative write); DIRTY/TEARDOWN have no coherent terminus action. Dep-bearing intermediates forward only; source is the single actor, down-cascade the effect. Formal: wave_up_source.tla.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D38"},{"id":"C-8","name":"intra-graph runtime rewire","covers":["R-rewire"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"sources A, B; derived D = ([A], fn) — D initially depends only on A. All in one graph (D22 single causal domain).","input":"1) A settles [[DATA, a1]] → D computes from A. 2) D.addDep(B) at runtime. 3) B settles [[DATA, b1]]. 4) D.removeDep(A). 5) A settles [[DATA, a2]]. 6) D.setDeps([B]) (current set, idempotent).","expect":"CLEAR CONTRACT (from R-rewire/D22): after addDep(B) D's dep set = {A,B} and B's update drives D's recompute; after removeDep(A) a subsequent A update (a2) NO LONGER drives D; rewire is INTRA-graph only (no cross-graph rewire form — cross-graph is wire bridge); setDeps to the current set is idempotent (no spurious recompute). PENDING (CSP-2.5 design/spec pass, F-NO-IMPL-DEFINED): exact mid-wave semantics — first-run-gate re-arm on a newly added dep, dirty/pending accounting when rewiring mid-wave, removeDep re-evaluation timing. This scenario's expect is finalized once those are pinned.","note":"D40/CSP-2.5; R-rewire drafted since D22. SUBSTRATE prerequisite for higher-order operators (mergeMap/switchMap/...). Skeleton scenario — mid-wave edge cases pending the CSP-2.5 design pass before drive-green.","ref":"D22,D40"}],"flowcharts":[{"id":"FC-1","title":"wave 传播(diamond coalesce)","area":"wave","explains":["R-diamond","R-tier"],"mermaid":"flowchart TD\n  A[state A] -->|DIRTY then DATA| B[derived B]\n  A -->|DIRTY then DATA| C[derived C]\n  B -->|DIRTY| D[derived D]\n  C -->|DIRTY| D\n  B -->|DATA| D\n  C -->|DATA| D\n  D -->|fire once after both settle| OUT[down DATA]"},{"id":"FC-2","title":"batch commit / rollback","area":"batch","explains":["R-wave-boundary"],"mermaid":"flowchart TD\n  S[g.batch fn] --> A[accumulate ctx.down across nodes]\n  A --> Q{fn 正常退出?}\n  Q -->|yes| C[implicit commit: 一个 wave 推下游]\n  Q -->|throw| R[rollback: 丢弃累积]\n  A --> X[bctx.rollback 显式] --> R"},{"id":"FC-3","title":"dispatcher invoke + pool 路由","area":"substrate","explains":["R-ctx-up"],"mermaid":"flowchart LR\n  N[node] -->|invoke handle depWave| D[dispatcher]\n  D --> L{pool kind}\n  L -->|LocalSync| LS[同线程 pointer 调用 立即 ctx.down]\n  L -->|LocalAsync| LA[event loop 算 callback 回灌]\n  L -->|Remote| RM[wire bridge RTT callback 回灌]\n  LS --> N\n  LA -->|late-emit DIRTY pair| N\n  RM -->|late-emit DIRTY pair| N"}],"sessions":[{"id":"DS-1","title":"Clean-Slate Redesign (L0–L6 full-stack greenfield)","status":"active","opened":"2026-05-27","locks":["D1","D2","D3","D4","D5","D6","D7","D8","D9","D10","D11","D12","D13","D14","D15","D16","D17","D18","D19","D20","D21","D22","D23","D24","D25","D26","D27","D28","D29","D30","D31","D32","D33","DR-1","DR-2","DR-3","DR-4","DR-5","DR-6","D34","D35","D36","D37","D38","D39","D40","D41"],"path":"sessions/active/SESSION-clean-slate-redesign.md","supersedes":["R11"],"note":"top-down 6-layer design; design-review passed; CSP-0 spec-amend ratified D34(tier table)/D35(dynamicNode)/D36(meta); B10 R-reentrancy spec-amend ratified D37 (reject sync feedback-cycle→ERROR); B11 R-up-at-source spec-amend ratified D38 (depless source: INVALIDATE-up→honor, DIRTY/TEARDOWN-up→drop); inspection-shape ratified D39 (describe snapshot / observe egress / profile dispatcher-recorder, per-language non-parity); CSP-1/CSP-2 TS substrate+graph landed (@graphrefly/ts, 77 tests); CSP-3 TS conformance arm GREEN 2026-05-28 (C-2..C-7 pass, C-1 blocked on wire bridge B2), all conformance-covered rules active (R-dirty-before-data earned via C-4); CSP-4 bootstrap generator functional. D40 (Catalog-first operator/upper-layer re-derive) + D41 (freeze old @graphrefly/graphrefly+pure-ts as read-only reference) locked 2026-05-28. Next: CSP-2.5 substrate rewire (R-rewire active via C-8) → CSP-2.6 sources+operator-opts base → CSP-2.7 operator catalog (~49) → CSP-2.8 upper subsystems → CSP-8 dogfood → CSP-5/CSP-7 rust/py arms"}],"guide":[{"id":"G-composition","title":"Composition patterns (lazy activation, subscription order, null guards, feedback cycles)","path":"guide/COMPOSITION.md","lang":"all","area":"composition","status":"stub","migrate_from":"COMPOSITION-GUIDE*.md"},{"id":"G-docs","title":"Docs guidance (jsonl 数据层 + 仪表盘约定；何时写哪个文档)","path":"guide/DOCS.md","lang":"all","area":"meta","status":"stub"},{"id":"G-test","title":"Test guidance (单元/属性/conformance 场景分层)","path":"guide/TEST.md","lang":"all","area":"test","status":"stub"},{"id":"G-contribute","title":"Contrib
