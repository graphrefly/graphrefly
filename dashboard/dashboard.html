drops RESOLVED-absorbed re-emits (changes-only stream; add equals/emitResolved option if needed)","state":"deferred","trigger":"a consumer needs persistent operator accumulators / RESOLVED-passthrough merge","lang":"ts","ref":"D6,R-rom-ram"},{"id":"B14","title":"rewire cross-axis formal: model rewire×equals (R-equals output DATA→RESOLVED absorption) + rewire×multi-sink (one node's ≥2 downstream observers) — the downstream-emit dimension wave_rewire.tla omits","state":"done","trigger":"DONE 2026-05-28 via the focused companion module formal/wave_rewire_emit.tla (TLC-green 3003 states; CacheMatchesLastData + MultiSinkConsistent mutation-verified load-bearing) rather than a full wave_protocol.tla SetDeps integration — the focused-module convention satisfies the SD-2 'cross-axis modeled' bar. All four D42 cross-axes (INVALIDATE/terminal/equals/multi-sink) now formal. OPTIONAL deeper follow-up (NOT gating): integrate SetDeps into wave_protocol.tla for rewire×{the full protocol} composition","lang":"all","ref":"D42,R-rewire,C-8,SD-2"},{"id":"B15","title":"rewire fn-swap handle GC: each setDeps/addDep/removeDep re-registers the fn → a new dispatcher handle; old handles linger in the FactoryRegistry (no unregister). Bounded today, but CSP-2.7 higher-order operators (mergeMap/switchMap) rewire frequently → registry growth","state":"open","trigger":"before CSP-2.7 higher-order operators ship (frequent rewire), or if a long-running graph's registry growth is observed; add dispatcher.unregister(handle) + call it on fn-swap","lang":"ts","ref":"D42,R-rewire,R-dispatch-all"},{"id":"B16","title":"rewire robustness: if an added dep's push-on-subscribe recompute THROWS (a re-entrant rewire attempt, or the fn throws) mid-_subscribeDepAt, the new subscription's unsub is not yet recorded → subscription leak + half-applied rewire (arrays installed, atomic settle skipped). PRE-EXISTING property of _subscribeDepAt/_activate (subscribe() runs the sync push before returning the unsub), not new to rewire; rewire just widens the surface","state":"deferred","trigger":"a real consumer triggers rewire/throw from within a push-driven recompute; harden with a try/rollback around the added-dep subscribe loop, or restructure subscribe() to hand back the unsub before the sync push","lang":"ts","ref":"D42,R-rewire,/qa-2026-05-28"},{"id":"B17","title":"rewire × async-pool late ctx: a deferred async invocation whose ctx.up/ctx.down fires AFTER the node was rewired routes to the NEW dep set (ctx closes over `this`), not the deps live when the fn started. Arguably correct ('the node is whatever it is now') but unmodeled — R-rewire vs R-async-paused interaction","state":"deferred","trigger":"a consumer observes a surprising late-emit routing after rewiring an async-backed node; decide + spec-note the scoping (live-edge vs wave-snapshot) and add a conformance scenario","lang":"all","ref":"D42,R-rewire,R-async-paused,/qa-2026-05-28"},{"id":"B18","title":"rewire × paused coalesce flag: _pausedDepWaveOccurred is not reconciled when a rewire removes the very dep whose pending wave set it → one spurious post-RESUME recompute (self-heals on next settle, no corruption)","state":"deferred","trigger":"observed spurious recompute after resume-following-rewire; clear/recompute _pausedDepWaveOccurred consistency in _rewire","lang":"ts","ref":"D42,R-rewire,R-pause-modes,/qa-2026-05-28"},{"id":"B19","title":"rewire × batch: a tier-3 wave deferred into an open batch() (deferToBatch) then a rewire of the same node within the same batch → __commitBatchedWave commits the PRE-rewire value/fn against the rewired node at commit; ordering vs the rewire's atomic settle undefined. wave_rewire.tla models no batch axis","state":"deferred","trigger":"a consumer rewires a node mid-batch; either reject rewire while a batch defer is pending on this node, or model+pin the precedence (rewire-then-commit) + add the formal axis","lang":"ts","ref":"D42,R-rewire,D12,/qa-2026-05-28"},{"id":"B20","title":"async-pool source ignores pausable:false carve-out: _shouldBufferOnPause buffers async-pool late emits whenever paused, even when pausable===false (contradicts R-pause-modes 'false: ignore PAUSE/RESUME')","state":"done","trigger":"PREREQUISITE for any pool:'async'+pausable:false source (D43). packages/ts node._shouldBufferOnPause checks only resumeAll + _isAsyncPool, never the pausable===false carve-out; _pauseAcquire populates the lockset unconditionally so the branch is reachable. Resolve before shipping such a source: either keep timer/interval on pool:'sync'+pausable:false (sync branch not gated -> keeps producing, spec-correct, D43 default) OR fix _shouldBufferOnPause to honor pausable===false -> route through /spec-amend + conformance (touches R-pause-modes/R-async-paused). — RESOLVED 2026-05-29 via D44 (/spec-amend): pausable mode is the OUTER gate over R-async-paused. Amended R-pause-modes + R-async-paused; formal wave_async_paused.tla parameterized by Mode+IsLeaf with invariant NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified; _shouldBufferOnPause fixed (false→never buffer; true→buffer only async COMPUTE deps>0; resumeAll→buffer all); C-9 (pausable:false ignores PAUSE) + C-10 (true-mode async leaf source delivers immediately — B20's twin, also fixed) ts:pass; 108 tests + lint + build green. rust/py arms land in CSP-5/7 (C-9/C-10 rust/py todo).","lang":"ts","ref":"D43,R-pause-modes,R-async-paused,DR-3"},{"id":"B21","title":"R-no-raw-async has no automated enforcement in packages/ts: scripts/check-layer-boundary.ts scans the retired root src/ (D201), biome.json has no noRestrictedGlobals; CSP-2.6 sources introduce the first raw setTimeout/Promise","state":"done","trigger":"first async source lands (CSP-2.6/D43). Add a path-scoped lint confining raw setTimeout/setInterval/Promise/queueMicrotask to a sources/ dir (biome noRestrictedGlobals override or a packages/ts layer-boundary analog), else R-no-raw-async leaks anywhere in the clean-slate package. — RESOLVED 2026-05-29: added scripts/check-no-raw-async.ts (comment-aware scan of packages/ts/src, allowlist=graph/sources.ts only; matches setTimeout/setInterval/setImmediate/queueMicrotask/process.nextTick/new Promise/Promise.<combinator>/for await/async/await) wired into `pnpm lint` (+ lint:no-raw-async). Baseline green (sources.ts is the sole sanctioned boundary), teeth-verified (a probe setTimeout/new Promise is flagged). Matches the check-layer-boundary.ts custom-script precedent (biome GritQL/noRestrictedGlobals can't express the full R-no-raw-async surface). Add the pool/runner file to ALLOW when a real async pool (D20) lands.","lang":"ts","ref":"D43,R-no-raw-async,F-SYNC-CORE"},{"id":"B23","title":"wall-clock time-source primitive for time operators (delay/debounce(Time)/throttle(Time)/audit/timeout/bufferTime/windowTime): a resettable/cancellable timer source so these operators get elapsed-time without a raw setTimeout in the operator body","state":"open","trigger":"a consumer needs a wall-clock time operator; design a resettable/cancellable time-source (async confined to sources.ts, R-no-raw-async) or wait for a mature async pool (D20/B1). Until then the first CSP-2.7 cut ships only notifier-driven forms (sample/buffer/window).","lang":"ts","ref":"D46,R-no-raw-async,D20"},{"id":"B24","title":"rewire-deferred drain x batch/pause timing: R-rewire-deferred drains the ctx.rewireNext queue at the COMMITTED boundary (after batch() commit / final-lock RESUME), but wave_rewire_deferred.tla models the boundary as EndRun (insideRunWave false) WITHOUT a batch/pause-deferral axis (design-review option b)","state":"deferred","trigger":"a consumer issues ctx.rewireNext inside an open batch() or while a pause lock is held; pin + model the committed-boundary gating (shared semantics with the immediate-rewire x batch axis B19) + add a conformance variant","lang":"all","ref":"D47,R-rewire-deferred,B19,D12"}],"antipatterns":[{"id":"AP1","pattern":"wrapping an imperative helper as a reactive primitive","why":"the primitive inevitably re-exposes the imperative helper as a method","instead":"widen the helper's args to T|Node<T>; let the caller opt into reactive control","ref":"feedback_no_imperative_wrap_as_primitive"},{"id":"AP2","pattern":"eager-placeholder upstream pollutes SENTINEL","why":"ctx can never observe the true absence-of-DATA state","instead":"fix the upstream to stop eager-emitting; use prevData[i]===undefined as the never-emitted detector","ref":"feedback_use_prevdata_for_sentinel"},{"id":"AP3","pattern":";-chaining background cargo / long commands","why":"deadlock≠thrash confusion; the process group can't be killed cleanly","instead":"one target at a time; bounded -j; kill by process group; direct log + DONE sentinel","ref":"feedback_no_chained_background_cargo"},{"id":"AP4","pattern":"stale premise propagation","why":"the design session task table lags the code; opening a 9Q on a stale premise","instead":"grep the named symbols + check the landed marker; surface the stale premise as a HALT","ref":"feedback_verify_premise_before_greenfield"},{"id":"AP5","pattern":"making architectural decisions on your own initiative","why":"silently picking a side masks a spec↔code conflict","instead":"surface the conflict for the user to call; review multi-file rewrites file by file","ref":"feedback_no_autonomous_decisions"},{"id":"AP6","pattern":"marking active/superseded with prose inside the archive","why":"markers rot; active and superseded end up mixed in one directory","instead":"split active/archive into physical directories; put the state in a jsonl status field","ref":"P3"},{"id":"AP7","pattern":"canonical responsibility split across multiple documents","why":"the sequencer/decision-log is scattered in many places, causing migration-period confusion","instead":"a single canonical per responsibility; decisions in a single D# sequence","ref":"P1,P2"}],"rules":[{"id":"R-msg-format","area":"message","statement":"message = array of [Type, Data?] tuples; one array passed to ctx.down/ctx.up = one wave; in-process representation = tuple, wire representation = protobuf, decoupled at the wire-bridge boundary","rationale":"D8 up/down(msgs); D11 tuple/protobuf decoupled","status":"draft","since":"D8,D11","covers_by":[]},{"id":"R-msg-closed-set","area":"message","statement":"10 message types, CLOSED: START + DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN/PAUSE/RESUME. No open set, no user-defined custom types, no MessageTypeRegistry; the old unknown-type-forwarding rule is retired (vacuous under a closed set). Adding a tier/type = spec change (constitutional)","rationale":"D9 9-type closed set + START handshake; D18 messageTier compile-time const, custom types CUT","status":"draft","since":"D9,D18","covers_by":[]},{"id":"R-tier","area":"message","statement":"messageTier const table (7 tiers): 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN. Tiers <3 dispatch immediately; tiers ≥3 are batch-deferred (DATA/RESOLVED in the settle slice, INVALIDATE alongside, terminal after, TEARDOWN last). Closed const table — adding a tier is constitutional","rationale":"D34 ratified numbering (old-spec with PAUSE/RESUME↔DIRTY swap so control precedes notification); D9 closed set","status":"active","since":"D9,D34","covers_by":["C-1"]},{"id":"R-data-payload","area":"message","statement":"[DATA,v] requires a non-SENTINEL payload (v ≠ undefined/None/per-language sentinel); [ERROR,e] requires a non-SENTINEL payload; bare [DATA]/[ERROR] and [DATA,SENTINEL] are rejected at the dispatch boundary; null is a valid DATA value (domain-level absence)","rationale":"D16 SENTINEL = absence-of-DATA must stay decidable; DATA(SENTINEL) would be indistinguishable from never-emitted","status":"draft","since":"D16","covers_by":[]},{"id":"R-wave-boundary","area":"wave","statement":"outside batch: one ctx.down(msgs) = one wave; inside batch: accumulation until commit = one wave","rationale":"","status":"active","since":"D8,D12","covers_by":[]},{"id":"R-dirty-before-data","area":"wave","statement":"every tier-3 (DATA/RESOLVED) emission is preceded by DIRTY in the same wave; the dispatcher synthesizes a [DIRTY] prefix when the caller omits it and the node is not already dirty; raw and framed emission paths are observationally identical on the wire","rationale":"glitch-free two-phase contract; D9 mechanism is impl freedom but the DIRTY-before-DATA ordering is observable","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-two-phase","area":"wave","statement":"DIRTY (phase 1) propagates through the entire reachable graph before DATA/RESOLVED (phase 2) begins — glitch-free diamond. Activation exemption: a compute fn's first run during subscribe() does not require a preceding DIRTY","rationale":"two-phase push guarantees a fan-in node sees all settled deps before recompute","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-diamond","area":"wave","statement":"diamond/fan-in: D recomputes exactly once after all changed deps settle in same wave","rationale":"the spec only describes observable behavior; the mechanism (dirtyMask) is impl freedom","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-equals","area":"wave","statement":"the equals substitution (DATA→RESOLVED) fires only when there is exactly 1 DATA within the wave; 0 is irrelevant; with ≥2 they are all DATA. Within one wave at one node the tier-3 slot is ≥1 DATA XOR exactly 1 RESOLVED — never mixed (tier-3 wave exclusivity). Default equals = Object.is/is; custom equals via node opts; never invoked while cache is SENTINEL","rationale":"multiple DATA yield no skip-fn benefit; exclusivity keeps cache coherent with last-delivered DATA","status":"active","since":"D15","covers_by":[]},{"id":"R-same-wave-merge","area":"wave","statement":"multiple settle-class messages on one node in one wave are resolved by tier-sort (DATA advances cache, a trailing INVALIDATE clears it; subscribers observe the full sequence). The sole explicit merge rule is INVALIDATE+INVALIDATE collapse (cleanup hook fires at most once). DATA+RESOLVED in the same wave on the same node is a protocol violation (R-equals)","rationale":"tier ordering produces the right end-state without silently eliding messages","status":"draft","since":"D8","covers_by":[]},{"id":"R-invalidate-idempotent","area":"wave","statement":"INVALIDATE is broadcast at most once per node per wave (diamond fan-in cascades it once, not once per arriving path); an INVALIDATE arriving at an already-reset OR never-populated cache is a no-op — neither the cleanup hook nor the downstream broadcast fires again","rationale":"prevents double-cleanup and wedged-DIRTY deadlock; the two reset states are observationally equivalent downstream","status":"active","since":"D9","covers_by":["C-3"]},{"id":"R-sentinel","area":"wave","statement":"SENTINEL = absence-of-DATA, protocol-decidable; the concrete sentinel value is per-language (TS undefined/Rust None/Py sentinel)","rationale":"","status":"active","since":"D16","covers_by":[]},{"id":"R-push-subscribe","area":"wave","statement":"push-on-subscribe: in the SENTINEL state push [START]; in the dirty state push [START,DIRTY]; cached DATA is pushed to the new subscriber. START is the handshake — the first message any sink receives on a subscription, emitted before any other downstream delivery, not forwarded through intermediate nodes","rationale":"","status":"active","since":"D9","covers_by":[]},{"id":"R-terminal","area":"wave","statement":"terminal-is-forever by default; resubscribable opt-in triggers a fresh-lifecycle reset. A late subscribe to a non-resubscribable terminal node is REJECTED (idiomatic error); to a resubscribable terminal node it resets the lifecycle (clears terminal/has-fired-once/DepRecords, drains pause lockset, re-arms first-run gate) before installing the sink. TEARDOWN does not block reset","rationale":"D17; resubscribable IS the property gating late-subscribe re-activation","status":"active","since":"D17","covers_by":[]},{"id":"R-deps-terminal","area":"wave","statement":"completeWhenDepsComplete (default true): node auto-emits COMPLETE when ALL deps complete (not ANY — combineLatest semantics). errorWhenDepsError (default true): node auto-emits ERROR when any dep errors. Terminal-emission operators (last/reduce) set completeWhenDepsComplete:false; rescue/catch operators set errorWhenDepsError:false and read ctx.depRecords[i].terminal explicitly","rationale":"effect/derived completion is the join of all deps; rescue needs explicit terminal handling","status":"draft","since":"D30","covers_by":[]},{"id":"R-ctx-up","area":"protocol","statement":"ctx.up is control-tier only (DIRTY/PAUSE/RESUME/INVALIDATE/TEARDOWN); DATA/RESOLVED/COMPLETE/ERROR are down-only","rationale":"directional semantics; added in DR-5","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-node-thin","area":"node","statement":"node = thinnest primitive: holds fn handle + deps + wave state machine (dep_records, dirty_mask, pending_count, cache, status, subscribers, pause_lockset); ZERO inspection cruft. Bare node() works at the substrate level but loses naming/find/describe — those are graph-layer","rationale":"D5 Node↔Graph responsibility split; thin node ports cleanly to Rust","status":"draft","since":"D5","covers_by":[]},{"id":"R-node-iface","area":"node","statement":"node exposes: cache (readonly getter, never throws, never triggers computation), status, down(msgs), up(msgs) (restricted to control tier per R-ctx-up), subscribe(sink)→unsubscribe. cache replaces the old get()","rationale":"D5 minimal node surface; D8 up/down boundary","status":"draft","since":"D5,D8","covers_by":[]},{"id":"R-status-enum","area":"node","statement":"status ∈ {sentinel, pending, dirty, settled, resolved, completed, errored}; status is the source of truth for cache freshness (dirty → stale prior value, settled/resolved → fresh, completed/errored → final). cache never throws, never computes","rationale":"D5 inspection reads status not raw cache","status":"draft","since":"D5","covers_by":[]},{"id":"R-rom-ram","area":"node","statement":"state node (no deps) retains cache across disconnect — value is intrinsic/non-volatile (ROM). Compute node (deps and/or fn) clears cache on deactivation → status sentinel (RAM); reconnect re-runs fn from scratch with cleared DepRecords","rationale":"D5; compute value is a function of live subscriptions","status":"draft","since":"D5","covers_by":[]},{"id":"R-fn-contract","area":"node","statement":"node fn = (ctx)=>void; ctx = {up(msgs), down(msgs), depRecords[{latest, tier, prevData, terminal}], state, onDeactivation, onInvalidate}. NO return-value framing — all emission is explicit via ctx.down. Sugar (derived/effect/operator) value-level fn is wrapped to a ctx-fn in the graph layer at register time; node/producer are ctx-level (intentional tier power surface, DR-1)","rationale":"D8 ctx.up/down; D27 sugar→ctx-fn conversion strictly in graph layer feeds behavioral parity","status":"draft","since":"D8,D27","covers_by":[]},{"id":"R-cleanup-hooks","area":"node","statement":"two cleanup hooks: ctx.onDeactivation(fn) (release external resources on deactivation) + ctx.onInvalidate(fn) (flush on INVALIDATE). onRerun (0 callsites) and onResubscribableReset (1 callsite → absorbed by ctx.state lifecycle) are cut. fn return value is freed for sugar mapping","rationale":"D28; internal state reset belongs to ctx.state lifecycle, cleanup hooks only manage external resources + INVALIDATE","status":"active","since":"D28","covers_by":[]},{"id":"R-ctx-state","area":"node","statement":"ctx.state = per-node private cross-wave state (implicit OK — node-private, not shared). Default fresh-lifecycle wipe; ctx.state.persist(on?) keeps across lifecycle. Shared/observable state must be an explicit node + dep (not ctx.state). INVALIDATE is lifecycle-continue (not fresh-lifecycle) so it does NOT wipe ctx.state — manual flush via onInvalidate","rationale":"D23 private state OK, shared memory explicit; D29 fresh-lifecycle wipe + persist","status":"active","since":"D23,D29","covers_by":["C-3"]},{"id":"R-first-run-gate","area":"node","statement":"compute fn first-fires only after every declared dep has settled (delivered ≥1 real DATA this or a prior wave) under partial:false — producing one combined initial wave. partial:true turns the gate OFF (fn fires as soon as dirty-dep-count hits 0; fn body MUST guard SENTINEL per dep). terminalAsRealInput:true also lets a dep terminal settle the gate (Reduce-class). The gate is first-run-only (has-called-fn-once); INVALIDATE does not re-arm it; a resubscribable terminal reset does","rationale":"clean multi-dep activation handshake without phantom partial waves","status":"active","since":"D9,D17","covers_by":[]},{"id":"R-initial","area":"node","statement":"initial (non-SENTINEL): pre-populates cache and a source pushes [DATA,initial] on subscribe; first emit runs equals against initial. Absent/undefined initial → cache holds SENTINEL, no push-on-subscribe, first emit is always DATA. INVALIDATE and resetOnTeardown return cache to SENTINEL","rationale":"D16 sentinel semantics; initial is T|null never T|undefined","status":"draft","since":"D16","covers_by":[]},{"id":"R-dynamic-node","area":"node","statement":"dynamicNode = node construction variant (NOT a verb): declares a superset of all possible deps at construction, fn reads a subset per invocation via track(dep). All declared deps participate in wave tracking; an unused dep's update fires fn but equals-absorption prevents downstream propagation. Same first-run gate as static nodes. Intra-graph only — cross-graph deps go through the wire bridge (no inter-graph dynamicNode)","rationale":"D35 distinct from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds tracked deps to one causal domain","status":"draft","since":"D35","covers_by":[]},{"id":"R-pause-lockset","area":"control","statement":"PAUSE/RESUME carry a lock_id; lockset semantics: a true resume occurs only when every lock has RESUMEd; same-id is idempotent; RESUME of an unknown lock is a no-op","rationale":"","status":"active","since":"D10","covers_by":["C-5"]},{"id":"R-pause-modes","area":"control","statement":"pausable {true | 'resumeAll' | false}. true (default): skip fn while any lock held, fire fn once on final-lock RESUME with latest dep values; a leaf source's (depless) own external down() -- sync OR async (timer tick / promise resolve / state.set) -- is NOT gated in default mode (delivered immediately). 'resumeAll': buffer the node's own tier-3/4 settle slice while paused (incl a leaf source's own sync/async down()), replay per-entry in arrival order on final-lock RESUME against a pre-pause baseline (equals references the conceptual-timeline cache); tier-5/6 bypass the buffer. false: ignore PAUSE/RESUME ENTIRELY (timer sources that must keep producing) -- the lockset is never consulted, neither dep-driven recompute nor any (sync/async) own production is gated or buffered. pausable mode is the OUTER gate over R-async-paused (D44): an async-pool late emit buffers ONLY when pausable in {true,'resumeAll'} AND (for true) the node is a COMPUTE node (deps>0); a depless async leaf source delivers immediately in true mode (leaf-vs-compute discriminator = deps.length===0).","rationale":"PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job. D44 pins the precedence over R-async-paused -- production is gated only by resumeAll, never by true/false (formal wave_async_paused.tla: ShouldBuffer + NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified).","status":"active","since":"D10,D44","covers_by":["C-5","C-9","C-10"]},{"id":"R-async-paused","area":"control","statement":"an async result arriving at a paused node buffers and replays on final-lock RESUME -- BUT this is GATED by pausable mode (D44), not unconditional: it applies only when pausable in {true,'resumeAll'} and, in true mode, only to a COMPUTE node (deps>0). A pausable:false node never buffers (ignores PAUSE, keeps producing); a true-mode depless leaf source delivers its own async production immediately (R-pause-modes). The buffered result enters the node-level pause_lockset-scoped buffer (lock_id scope = node-level pause_lockset).","rationale":"DR-3; D44 conditions the buffering on pausable mode + node kind -- the C-2 node is an async COMPUTE node (deps>0), which is why it buffers; pausable:false (B20) and the async leaf source (B20's twin) are the cases the unconditional reading got wrong.","status":"active","since":"DR-3,D44","covers_by":["C-2","C-9","C-10"]},{"id":"R-teardown-complete","area":"control","statement":"a [[TEARDOWN]] arriving at a non-terminal node synthesizes a [COMPLETE] prefix in the same wave ([[COMPLETE],[TEARDOWN]]) so bridge subscribers resolve before unwiring. Idempotent (subsequent TEARDOWN arrives alone); skipped when the wave already carries COMPLETE/ERROR","rationale":"clean complete-then-teardown lifecycle pair; firstValueFrom-style bridges need the COMPLETE","status":"draft","since":"D9","covers_by":[]},{"id":"R-replay-buffer","area":"control","statement":"replayBuffer:N → node keeps a circular buffer of the last N outgoing DATA values; a late subscriber receives buffered DATA after the START handshake and before live updates","rationale":"replaces the replay() operator + subscribe-hook monkeypatching","status":"draft","since":"D9","covers_by":[]},{"id":"R-restore","area":"lifecycle","statement":"restore ≠ fresh-lifecycle: snapshot serializes all ctx.state; restore restores everything (no wipe); wipe occurs only on a fresh-lifecycle transition","rationale":"Flag 1; added in DR-5","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-snapshot","area":"lifecycle","statement":"snapshot = topology + cache + factory-name refs (NOT fn bodies — the fn lives in code). restore re-resolves nodes by factory name via the dispatcher registry; an anonymous inline fn (no name) is marked local-only and cannot restore cross-process (honestly labeled). Incremental restore via changeset. Storage tiers / WAL / codec / envelope are presentation-layer + deferred, not substrate rules","rationale":"D25; fn cannot serialize, factory-registry re-resolution model","status":"draft","since":"D25","covers_by":[]},{"id":"R-graph-role","area":"graph","statement":"Graph = convenience + inspection entry: register/name/find/describe/observe/profile/snapshot/mount/batch/operators. g.* sugar desugars to dispatcher.register + Node + auto-registers into the graph inspection index. Graph is optional convenience, not a mandatory container; multi-graph is natural","rationale":"D5 Graph holds all convenience+inspection; D3 graph-first mental anchor","status":"draft","since":"D5","covers_by":[]},{"id":"R-edges-derived","area":"graph","statement":"edges are derived on-demand from each node's construction-time deps + the mount hierarchy; there is no stored edge registry and no connect/disconnect. Every edge shown in describe has a real protocol subscription behind it — decorative edges are not representable","rationale":"D3 topology is a pure function of (nodes, deps, mounts)","status":"draft","since":"D3","covers_by":[]},{"id":"R-rewire","area":"graph","statement":"setDeps/addDep/removeDep = runtime topology rewire, INTRA-graph only (D22 single causal domain; no inter-graph form — cross-graph wiring is only via the wire bridge). Surgical/Option-C: a dep in both old and new sets is left untouched (subscription + DepRecord survive); only removed deps unsubscribe + discard their DepRecord, only added deps fresh-subscribe; DepRecord-ref dispatch lets kept deps reorder freely. Across a rewire: the first-run gate (_hasCalledFnOnce) is PRESERVED, never re-armed (re-arming would re-gate unchanged deps); an added dep enters prevData=SENTINEL and the fn guards via prevData===SENTINEL; the activated compute-node cache is PRESERVED (R-rom-ram); pause lockset + buffer PRESERVED. An added dep with a cached DATA pushes [DIRTY,DATA] on subscribe (R-push-subscribe); a SENTINEL dep delivers START only. removeDep clears the removed dep's dirty contribution; if it was the sole dirty contributor and the node was dirty, the wave auto-settles. A removed dep's queued messages (DIRTY/DATA/INVALIDATE) are DRAINED — nothing strands downstream. Rejects: self-dependency; a cycle (DFS O(V+E)); a terminal this (completed/errored); adding a non-resubscribable terminal dep (would wedge — resubscribable terminal deps are allowed). removeDep to zero deps is allowed (degenerate fn-no-deps; cache preserved; no auto-deactivate). Mid-wave rewire (between dep deliveries) is allowed; mid-fn rewire (while the node's fn is executing, _insideRunWave) and reentrant rewire (another setDeps/addDep/removeDep in flight) are REJECTED — a fn mutating its own topology mid-wave is the synchronous feedback-cycle ERROR (D37/R-reentrancy). Topology change does not bump a version counter (topology ≠ DATA). Every rewire API requires an explicit fn (fn-deps pairing: user fns read data[i]/prevData[i] positionally, so a dep-shape change must re-declare the fn). A SELF-triggered mutation (a fn changing its OWN deps in response to its own data) must use the deferred ctx.rewireNext path (R-rewire-deferred / D47), NOT an immediate in-fn call.","rationale":"D42 ratifies the TLA+-verified (port-model wave_protocol_rewire, 126k states) rewire design Q1–Q7 for the clean-slate substrate; D22 bounds it to one causal domain; the mid-fn reject is floor-mandated by D37/R-reentrancy; surgical/Option-C + required-fn come from the Phase 13.8 design iteration. Per D42 SD-2, the cross-axis formal coverage is COMPLETE (wave_rewire.tla INVALIDATE+terminal + wave_rewire_emit.tla equals+multi-sink, all TLC-green + mutation-verified) and the TS C-8 arm is green; flipped ACTIVE 2026-05-28 on the TS-arm-green+formal precedent (R-reentrancy/R-up-at-source/R-dirty-before-data), rust/py conformance arms tracked separately in C-8 runtimes","status":"active","since":"D22,D42","covers_by":["C-8"]},{"id":"R-mount","area":"graph","statement":"graph.mount(subgraph,{at}) embeds a child graph addressable under the parent namespace (:: delimited paths); lifecycle signals propagate parent→mounted children; mount has no deps (exempt from deps-first ordering)","rationale":"D4 mount verb; L4-Q4 mount exemption","status":"draft","since":"D4","covers_by":[]},{"id":"R-describe","area":"graph","statement":"describe(opts?) = static, JSON-serializable structure snapshot: {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}. DNode = {id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (operator real name per D6/L1.5, not 'derived'), status (R-status-enum), value? (field ABSENT = SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}. edges are derived from deps + mount hierarchy (R-edges-derived). value carries the cache snapshot at call time; fn bodies are never serialized (factory-name ref only, D25). describe({explain:{from,to}}) = causal-chain subset (same shape, filtered to the from→to chain). Renderers (pretty/mermaid/d2) are pure functions over the snapshot — NOT methods and NOT a describe({format}) option; there is no graph.explain(). Live-topology streaming (rewire deltas) is an observe topology-event, deferred to CSP-2 viz","rationale":"D3 describe first-class; D39 pins the field set; L4-Q8 renderers pure fns; D25 snapshot same source; per-language (D24, never in parity — documented contract, not conformance-tested)","status":"draft","since":"D3,D39","covers_by":[]},{"id":"R-observe","area":"graph","statement":"observe(path?) = read-only live message tap returning a subscribable EGRESS ({subscribe(sink)→unsubscribe}) — NOT a graph node (no self-observation island). observe is a REAL (lazily-activating) subscriber: it uses subscribe internally, so observing a COLD node activates it + its upstream (running their fns), and observing a cached node receives the [DATA,cached] push (R-push-subscribe). 'Read-only' (D19) means observe never EMITS or MUTATES node state — it does NOT mean activation-free; observing a cold graph activates it. Each stream item is an enveloped ObserveEvent = {path, msg (the Message), tier (messageTier), seq (graph-local monotonic clock, D26)}; the envelope carries node identity so single-node / subtree / whole-graph observe share ONE shape. Upstream control is a separate Graph affordance: single-node up(msgs) / all-nodes up(path,msgs) (e.g. PAUSE); a node guard denying an upstream message drops it silently (R-up-at-source)","rationale":"D5 Graph IS the introspection layer; D39 pins the ObserveEvent envelope + read-only egress (not a node); D19 inspection read-only; per-language (D24, never in parity)","status":"draft","since":"D5,D39","covers_by":[]},{"id":"R-inspection-set","area":"graph","statement":"inspection surface = describe (incl explain mode) + observe + profile — 3 first-class methods on Graph; no separate Inspector object","rationale":"L4-Q8 inspection consolidation","status":"draft","since":"D5","covers_by":[]},{"id":"R-meta-presentation","area":"graph","statement":"meta companion stores are presentation/graph-layer, NOT substrate. Static annotations (description/type/range/format/access/tags/unit) → describe metadata attached via g.node opts. Reactive annotations (a status/error that changes over time) → explicit nodes + dep (R-ctx-state / D23). The substrate node carries zero meta machinery. meta.owner ABAC is presentation/multi-agent, out of substrate scope","rationale":"D36; D5 node=thinnest, meta is annotation feeding describe (graph owns inspection)","status":"draft","since":"D36","covers_by":[]},{"id":"R-graph-lifecycle","area":"graph","statement":"graph.signal(msgs) broadcasts a message to all registered nodes (e.g. [[PAUSE,lockId]] or [[INVALIDATE]]); graph.destroy() broadcasts [[TEARDOWN]]. graph.set(name,v) = node.down([[DATA,v]]) sugar; graph.get(name) = cache read","rationale":"D5 graph convenience; L4-Q1 state.set = node.down sugar","status":"draft","since":"D5","covers_by":[]},{"id":"R-clock","area":"runtime","statement":"monotonic time = a graph-local counter (causal-domain ordering, folded into the graph); wall-clock = a system call; there is NO global clock singleton","rationale":"D26 / L3-Q9 config dissolution; graph = causal domain so ordering is graph-local","status":"draft","since":"D26","covers_by":[]},{"id":"R-dispatch-all","area":"runtime","statement":"all fn go through the dispatcher / FactoryRegistry; node((ctx)=>...) also runs through the LocalSync pool. There is no inline-fn-bypasses-dispatcher path","rationale":"F-DISPATCH-ALL; sacred L0.7 (all fn through dispatcher)","status":"draft","since":"D21","covers_by":[]},{"id":"R-sync-core","area":"runtime","statement":"dispatcher.invoke is sync void — wave-state mutation always serializes onto the graph's single thread; async/remote execution returns via a pool callback. 1.0 pools = LocalSync + LocalAsync; dispatcher keeps a pluggable pool trait for WorkerPool/RemotePool","rationale":"F-SYNC-CORE; D20 pool set; sacred L0.7 (wave protocol impl is sync)","status":"draft","since":"D20,D21","covers_by":[]},{"id":"R-handle","area":"runtime","statement":"handle = pure data (pool_id, handle_id), NO methods — serializable/snapshottable/wire-transferable; it is a dispatcher-table index. node ≠ handle (node has up/down methods at the external-world boundary)","rationale":"D7 handle is pure data","status":"draft","since":"D7","covers_by":[]},{"id":"R-graph-domain","area":"runtime","statement":"graph = causal domain = concurrency domain = single thread. Compute parallelism is via pool callback (results serialize back to the graph's thread); true parallelism is via multiple graphs + wire bridge. Disjoint waves in the same graph do not parallelize","rationale":"D22 wave protocol is lock-free because the graph boundary is the concurrency boundary","status":"active","since":"D22","covers_by":["C-1","C-4"]},{"id":"R-no-polling","area":"principle","statement":"state changes propagate reactively via messages; never poll a node's value on a timer or busy-wait for status; periodic behavior is a reactive timer source emitting through the graph","rationale":"spec §5.8 durable value","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-imperative","area":"principle","statement":"no imperative side-channel triggers (event emitters, callbacks, setTimeout+set) to drive graph behavior; all coordination uses ctx.up signals + message flow through topology; remove imperative paths when no caller depends on them","rationale":"spec §5.9 durable value (feedback_no_imperative)","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-raw-async","area":"principle","statement":"no bare async primitives in the reactive layer (TS: Promise/queueMicrotask/setTimeout/process.nextTick; PY: asyncio.create_task/threading.Timer/raw coroutines). Async boundaries live only in sources (fromPromise/fromAsyncIter) and the pool/runner layer","rationale":"spec §5.10; F-SYNC-CORE async only at pool/wire boundary","status":"draft","since":"D20","covers_by":[]},{"id":"R-data-not-peek","area":"principle","statement":"all data propagation — including initial values at connection time — flows through messages [[DATA,v]]; nodes do not peek a dep's .cache to seed computation; .cache is a read-only accessor for external consumers","rationale":"spec §5.12 single mental model: if data moved, a message carried it","status":"draft","since":"D3","covers_by":[]},{"id":"R-primary-api-clean","area":"principle","statement":"protocol internals (DIRTY/RESOLVED/bitmask) never surface in the value-level primary API (derived/effect/operator); ctx-level primitives (node/producer) intentionally expose tier as a power surface (DR-1 §5.11 amend). A developer using value-level sugar never reads the spec to start","rationale":"DR-1 ctx-level is a deliberate protocol-facing power surface; value-level is §5.11-compliant primary","status":"draft","since":"DR-1","covers_by":[]},{"id":"R-reentrancy","area":"wave","statement":"a synchronous feedback cycle — a node fn that, during its invocation, transitively re-drives one of its own (direct or indirect) deps so the same node's fn would re-enter before its wave completes — is a wave-level protocol ERROR. Detection is node-local and free: a node refuses to enter its fn-run while its own in-wave flag (_insideRunWave) is already set, and throws; the graph layer catches the throw and converts it to [[ERROR, e]] down (D30 — value-level throw → graph-layer ERROR), located at a node ON the cycle (the value-level catch nearest the throw on the synchronous unwind — implementation-determined, NOT necessarily the re-entered node), aborting the wave. The core neither queues nor bounds-then-runs the cycle (reject, not iterate). Legitimate accumulation uses per-node ctx.state (e.g. scan): not a topological cycle, never re-enters. Async feedback that crosses a turn boundary via an async pool is out of scope — it is not synchronous re-entry and does not desync the wave. No numeric rerun-depth cap is needed (precise in-wave flag detection supersedes the blunt maxFnRerunDepth)","rationale":"D37; surfaced by CSP-1 /qa (backlog B10); reject (B) over queue-to-wave-end (A) because A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; detection reuses the existing _insideRunWave flag, dispatcher stays a pure funnel (F-DISPATCH-ALL), error ownership graph-level (D30)","status":"active","since":"D37","covers_by":["C-6"]},{"id":"R-up-at-source","area":"protocol","statement":"a depless source is the terminus of upstream control forwarding (R-ctx-up). It self-ACTS only on a message with a coherent round-trip action: INVALIDATE → HONOR the invalidate-request (clear cache to SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never arrives). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediate nodes never self-act on upstream control — they forward toward deps only; the source is the single actor and the down-cascade is the effect","rationale":"D38; B11; R-ctx-up/DR-5 lists INVALIDATE up-allowed and the only self-consistent reason is terminus honoring (DS-1 L1.11 'invalidate-request'); INVALIDATE-up is a cache-drop request not an imperative write, so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN lack a coherent terminus action","status":"active","since":"D38","covers_by":["C-7"]},{"id":"R-profile","area":"graph","statement":"profile(opts?) = opt-in accumulated-counter snapshot: {waves; nodes:Record<path, NodeProfile>}, NodeProfile = {invokes, emits, resolved, errored, lastDurationNs?, totalDurationNs?}. Counters are backed by an opt-in dispatcher/graph-level recorder (DS-1 inspectorEnabled / globalInspector→dispatcher hook), NEVER stored on the thin node (R-node-thin); the dispatcher is the invoke funnel (F-DISPATCH-ALL) so it is the natural source of invoke counts + fn duration. Default OFF = zero runtime overhead (F-PERF). profile is a point-in-time snapshot (like describe); a streaming profile is an observe-aggregation, not a new mechanism. Shares the mount-aware :: path key with describe/observe","rationale":"D39; L4-Q8 third inspection method; R-node-thin keeps counters off the node; F-DISPATCH-ALL dispatcher sees every invoke; F-PERF opt-in; per-language (D24, never in parity)","status":"draft","since":"D39","covers_by":[]},{"id":"R-rewire-deferred","area":"graph","statement":"A node fn may, DURING its run, request a mutation of its OWN dep set via ctx.rewireNext(op), op in {addDep(node,fn) | removeDep(node,fn) | setDeps(nodes,fn)} (R-rewire surgical/Option-C semantics, D42). The request is QUEUED, not applied in place; the dispatcher DRAINS the queue at the COMMITTED wave boundary — after the current wave settles, and after a batch() commits or the final-lock RESUME (never on an un-committed or paused view) — applying each mutation as a fresh wave. Drain order is deterministic: per-node FIFO in issue order, nodes drained in causal order. This deferral is the ONLY legal self-triggered rewire: IMMEDIATE in-fn self-rewire remains the D37 mid-fn feedback-cycle ERROR (R-reentrancy); rewireNext moves application to a turn boundary where _insideRunWave is false. An added dep with cached DATA pushes [DIRTY,DATA] on the boundary wave (R-push-subscribe); a removed dep is unsubscribed and DRAINED, and if it loses its last subscriber it _deactivates and fires onDeactivation (input-side teardown — the basis for operator cancellation / abortInFlight). The first-run gate is PRESERVED across a deferred rewire (never re-armed, R-rewire). If the node goes terminal during the wave, its pending rewireNext queue is discarded. A rewireNext producing no net dep-set change is a no-op; a net-changing rewireNext re-issued every boundary (oscillation) is a user-level runaway (like an infinite producer), not a substrate-detected error. INTRA-graph only (D22).","rationale":"D47; *Map operators must grow/shrink their own dep set in response to their own data; the D37 mid-fn reject + the async-pool probe (the async pool does NOT defer the fn — _insideRunWave is set during any fn run, dispatcher/index.ts:48 + node.ts:692) leave the wave boundary as the only legal application point. removeDep is the only thing that stops an abandoned inner's source (read-gate masks output only). Complements R-rewire (external/immediate) with a self/deferred form, reusing its surgical semantics.","status":"draft","since":"D47","covers_by":["C-11"]}],"conformance":[{"id":"C-1","name":"cross-graph diamond coalesce","covers":["R-diamond","R-tier","R-two-phase","R-dirty-before-data","R-graph-domain"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"A in g1; B,C in g2 (reached from g1 via wire bridge); D in g1. Edges A→B, A→C, B→D, C→D — a diamond split across two single-threaded graphs.","input":"A.down([[DATA, v]]) (one wave).","expect":"DIRTY crosses the wire to B and C at the same priority as DATA (R12). Phase 1 DIRTY reaches D via both legs before any phase-2 DATA. D recomputes EXACTLY ONCE after both B and C settle in the same logical wave; D's outgoing wave contains a single DATA. No glitch (D never fires on a half-settled diamond).","note":"L2.F mixed-locality survival proof — the diamond stays glitch-free even though B/C live in a different causal domain reached over the wire bridge.","blocked":"wire bridge (backlog B2) — not yet implementable; the in-process diamond core it leans on is green in packages/ts core.test.ts (R-diamond/R-two-phase)","ref":"DR-5"},{"id":"C-2","name":"async-result arriving at paused node","covers":["R-async-paused","R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"Producer P backed by an async (LocalAsync) pool → node N. N has one active pause lock.","input":"1) N.up([[PAUSE, L1]]). 2) P's async fn resolves while N is paused, delivering [[DATA, r]] toward N. 3) N.up([[RESUME, L1]]).","expect":"The async result does NOT drop and does NOT deliver mid-pause; it enters N's pause buffer. On final-lock RESUME (L1 released, lockset empty) the buffered result replays as a wave to N's sinks. lock_id scope = the node-level pause_lockset (consistent with PAUSE buffering DATA).","note":"DR-3 — async-result-at-paused-node is buffer+RESUME-replay, identical to how PAUSE buffers a synchronous DATA.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-3,DR-5"},{"id":"C-3","name":"INVALIDATE × ctx.state × onInvalidate","covers":["R-invalidate-idempotent","R-ctx-state","R-cleanup-hooks","R-sentinel"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"source S → derived D. D's fn sets ctx.state on each run and registers ctx.onInvalidate(flush). A second parent S2 → D exists (diamond) to exercise fan-in idempotency.","input":"1) S settles [[DATA, v]] → D runs, caches, sets ctx.state. 2) S.down([[INVALIDATE]]) — cascades to D via both fan-in paths in one wave.","expect":"D broadcasts INVALIDATE downstream exactly ONCE (not once per fan-in path). D's onInvalidate hook fires exactly once (external flush). ctx.state is NOT wiped — INVALIDATE is lifecycle-continue, not a fresh-lifecycle transition; any internal reset must be done manually in onInvalidate. D's per-dep prevData returns to SENTINEL so a downstream prevData===SENTINEL never-emitted detector reads correctly. A second INVALIDATE arrival in the same wave is a no-op (hook + broadcast do not re-fire).","note":"distinguishes lifecycle-continue (INVALIDATE) from fresh-lifecycle wipe (deactivation / resubscribable reset). TS arm covers single-parent cascade + idempotent no-op + state-preservation; fan-in-in-one-wave needs batch (covered by R-invalidate-idempotent _hasData guard).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-5"},{"id":"C-4","name":"mixed sync/async diamond","covers":["R-diamond","R-two-phase","R-graph-domain","R-first-run-gate","R-dirty-before-data"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"A → B (sync LocalSync leg) and A → C (async LocalAsync pool leg); B→D, C→D. One diamond, one sync leg + one remote/async leg.","input":"A.down([[DATA, v]]).","expect":"D joins EXACTLY ONCE after BOTH legs settle, even though the async leg C settles later via a pool callback. The async pool callback's wave-state mutation serializes back onto the graph's single thread (R-graph-domain), so D's dirty-dep accounting reconciles the sync and async settlements into one recompute. The first-run gate holds D until both deps have delivered real DATA. R-dirty-before-data: a post-activation re-join emits DIRTY before DATA in the same logical wave (observed ['DIRTY','DATA'], glitch-free two-phase).","note":"R8/R9 PoC validated; TS arm now a full conformance test (sync + async pool, same process — no wire bridge needed). R-dirty-before-data earned here via the post-activation re-join DIRTY-before-DATA assertion (CSP-3, 2026-05-28).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-5"},{"id":"C-5","name":"PAUSE lockset multi-source","covers":["R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"node N with two independent pause controllers, A and B.","input":"1) A.up([[PAUSE, LA]]). 2) B.up([[PAUSE, LB]]). 3) A.up([[PAUSE, LA]]) again (duplicate). 4) A.up([[RESUME, LA]]). 5) B.up([[RESUME, LX]]) for an unknown LX. 6) B.up([[RESUME, LB]]).","expect":"After step 1-2 lockset = {LA, LB}, N paused. Step 3 (same-id repeat PAUSE) is idempotent — lockset unchanged. Step 4 removes LA; lockset = {LB}; N STILL paused (B's lock holds). Step 5 (unknown id) is a no-op. Step 6 removes LB; lockset empty; N truly resumes (fires once with latest dep values under default mode). Releasing one controller never resumes the node while another's lock is held.","note":"multi-pauser correctness by construction — paused state derives from lockset.size > 0.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"DR-5"},{"id":"C-6","name":"synchronous feedback cycle → ERROR","covers":["R-reentrancy"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"state S → derived D=([S], n=>n+1) → effect E=([D]); E's fn synchronously calls S.set(...) (a write back to S, an indirect dep of E), so S→D→E plus the feedback write closes a cycle.","input":"Kick the graph so E's fn runs and synchronously re-drives S (S.set) before E's wave completes.","expect":"The re-entrant attempt to run E's fn while E is already mid-wave is detected node-locally (E's in-wave flag is set) and rejected: a node ON the cycle emits [[ERROR, e]] (the graph layer catches the substrate throw at the value-level wrapper nearest the throw on the synchronous unwind — D30; which node is implementation-determined, e.g. D or E), and the wave aborts deterministically. NO silent _pending desync, NO unbounded synchronous recursion / stack overflow, NO surviving half-settled state. A legitimate accumulator over the same S built with ctx.state (scan) does NOT trigger the cycle (no topological re-entry).","note":"B10 / D37. Separates a disguised imperative control-flow loop (rejected) from ctx.state accumulation (allowed). Detection reuses the existing _insideRunWave flag (zero new structure); error ownership graph-level (D30); dispatcher uninvolved. Async feedback across a turn boundary (async pool) is a separate, out-of-scope case.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D37"},{"id":"C-7","name":"upstream control at a depless source","covers":["R-up-at-source"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"depless source S (cached value) → derived D → sink. D (or a sink on D) originates ctx.up([msg]) which forwards upstream to the terminus S.","input":"Three independent runs, one per upstream-allowed non-pause control kind: 1) D.up([[INVALIDATE]]). 2) D.up([[DIRTY]]). 3) D.up([[TEARDOWN]]).","expect":"INVALIDATE: S HONORS the invalidate-request — S.cache returns to SENTINEL, S's onInvalidate hook fires once, and S broadcasts INVALIDATE downstream so D (and the whole downstream cone) clears (D.cache → SENTINEL, D's onInvalidate fires). DIRTY: DROPPED at S — S unchanged (cache + status intact), NO downstream DIRTY, downstream is NOT left wedged awaiting a settle. TEARDOWN: DROPPED at S — S not terminated, NO downstream TEARDOWN. A node guard on S may deny the INVALIDATE (drops silently) — opt-out, not the default.","note":"B11 / D38. Closes the F-NO-IMPL-DEFINED gap on upstream control reaching a depless source. INVALIDATE-up is a cache-drop request (not an imperative write); DIRTY/TEARDOWN have no coherent terminus action. Dep-bearing intermediates forward only; source is the single actor, down-cascade the effect. Formal: wave_up_source.tla.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D38"},{"id":"C-8","name":"intra-graph runtime rewire","covers":["R-rewire"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"sources A, B (B carries a cached DATA b0); derived D = ([A], fn) — D initially depends only on A. All in one graph (D22 single causal domain).","input":"1) A settles [[DATA,a1]] → D's first-run gate opens, cache=fn(a1). 2) D.addDep(B, fn2). 3) B settles [[DATA,b1]]. 4) D.removeDep(A, fn3). 5) A settles [[DATA,a2]]. 6) D.setDeps([B], fn3) (current set, idempotent). Variants: remove A while A's DIRTY is mid-flight to D; A sends [[INVALIDATE]] then D.removeDep(A); A goes terminal then attempt D.addDep(A) / attempt a rewire on a terminal D / addDep(self) / a cycle / mid-fn rewire.","expect":"Surgical (Option-C): a rewire touches only changed deps — kept deps keep their subscription + DepRecord, no unsub/resub. (2) addDep(B) with B cached → B's cached value reaches D via the subscribe handshake (START then [DATA,b0] per R-push-subscribe) and D recomputes; the first-run gate is NOT re-armed (D already passed it — it does not re-wait for a fresh round of all deps); an added SENTINEL dep delivers START only, no recompute until it emits. (3) B's update drives D. (4) removeDep(A) discards A's DepRecord + clears A's dirty contribution; if A was the sole dirty contributor and D was dirty, D AUTO-SETTLES; D's cache is PRESERVED across every rewire (R-rom-ram). (5) after removeDep(A) a2 NO LONGER drives D — A's edge is DRAINED so no stale DIRTY/DATA/INVALIDATE strands. (6) setDeps to the current set is idempotent (no spurious recompute, no DepRecord churn). A mid-wave removal (A's DIRTY in flight) auto-settles per above; a removed dep's queued INVALIDATE is drained, never lands. REJECTS (throw → graph-layer ERROR, not silent): self-dependency; a cycle; setDeps/addDep/removeDep on a terminal D (completed/errored); adding a non-resubscribable terminal dep (resubscribable terminal allowed); mid-fn rewire (a fn mutating its own topology mid-wave = the D37 feedback-cycle ERROR) and reentrant rewire. removeDep to zero deps → degenerate fn-no-deps, cache preserved, no auto-deactivate. Every rewire requires an explicit fn (positional fn-deps pairing). INTRA-graph only (D22); no cross-graph rewire form.","note":"D42/CSP-2.5; R-rewire (since D22, refined by D42). SUBSTRATE prerequisite for higher-order operators (mergeMap/switchMap/concatMap/exhaustMap/flatMap). Formal (SD-2 gate, all four cross-axes): wave_rewire.tla = per-node Q1–Q7 + rewire×INVALIDATE (NoStaleEdgeMessages) + rewire×terminal (RewireOnlyOnLiveNode), TLC-green 603k states; wave_rewire_emit.tla = rewire×equals (CacheMatchesLastData) + rewire×multi-sink (MultiSinkConsistent), TLC-green 3003 states; all four new invariants mutation-verified load-bearing. TS arm GREEN 2026-05-28 (setDeps/addDep/removeDep in @graphrefly/ts node.ts; conformance.test.ts C-8 + rewire.test.ts 12 unit tests); rust/py arms pending CSP-5/CSP-7. R-rewire FLIPPED ACTIVE 2026-05-28 (TS-arm-green+formal precedent).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D22,D42"},{"id":"C-9","name":"pausable:false async source ignores PAUSE (keeps producing)","covers":["R-pause-modes","R-async-paused"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"depless async-pool source S with pausable:false (timer/interval-class) -> sink.","input":"1) subscribe a sink to S. 2) S.up([[PAUSE, L1]]). 3) S's async fn resolves, emitting [[DATA, r]] while the lock is held.","expect":"DATA is delivered to the sink IMMEDIATELY (DIRTY+DATA), NOT buffered -- pausable:false ignores PAUSE/RESUME entirely; the lockset is never consulted and production continues through the PAUSE (contrast C-2, where a pausable compute node buffers). A subsequent RESUME is a no-op (nothing buffered).","note":"D44 -- pausable mode is the outer gate over R-async-paused; false dominates (resolves B20).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D44,DR-3,B20"},{"id":"C-10","name":"true-mode async leaf source delivers own production immediately under PAUSE","covers":["R-pause-modes","R-async-paused"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"depless async-pool LEAF source S, pausable:true (default; fromPromise/fromAsyncIter-class) -> sink.","input":"1) subscribe a sink to S. 2) S.up([[PAUSE, L1]]). 3) S's async fn resolves, emitting [[DATA, r]] while the lock is held.","expect":"DATA is delivered to the sink IMMEDIATELY (DIRTY+DATA), NOT buffered -- in true mode PAUSE gates recomputation/propagation, not a leaf source's OWN production ('production-gating is resumeAll's job'). A COMPUTE node (deps>0) in the same position WOULD buffer (C-2); with pausable:'resumeAll' the leaf source WOULD buffer.","note":"D44 -- the true-mode leaf-source carve-out extends to async production (B20's twin).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D44,DR-3"},{"id":"C-11","name":"higher-order inner rewire at the wave boundary","covers":["R-rewire-deferred"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"outer source S; operator OP = ([S], fn) in one graph (D22). fn: on S DATA v -> inner = makeInner(v); ctx.rewireNext(addDep inner). on an inner COMPLETE -> ctx.rewireNext(removeDep that inner). switch-variant: on S DATA -> rewireNext(removeDep prevInner) + rewireNext(addDep newInner). Inners are leaf sources whose deactivation is observable (a flag set in onDeactivation).","input":"1) S [[DATA,v1]] -> OP requests addDep(innerA). 2) wave settles -> drain -> innerA added+subscribed, cached DATA pushed [DIRTY,DATA]. 3) innerA DATA -> forwarded. 4) (switch) S [[DATA,v2]] -> OP requests removeDep(innerA)+addDep(innerB). 5) drain -> innerA unsubscribed+drained, loses last subscriber -> _deactivate -> onDeactivation fires (cancellation observable); innerB added. 6) (merge) two inners live -> both forward. 7) an inner COMPLETEs -> removeDep -> drain removes it (bounding). Variants: IMMEDIATE in-fn this.addDep (not via rewireNext) -> REJECTED (D37); rewireNext then OP terminal same wave -> queue discarded; no-net-change rewireNext -> no-op.","expect":"A rewireNext NEVER mutates _deps while _insideRunWave is true (deferred to the post-settle drain). The drain runs at the COMMITTED boundary (after batch commit / final-lock RESUME, never on an un-committed/paused view). Each queued op applied exactly once, in deterministic order (per-node FIFO, causal node order), as a fresh wave. Added cached dep pushes [DIRTY,DATA]; first-run gate NOT re-armed. Removed dep DRAINED (no stale DIRTY/DATA/INVALIDATE strands) and, if last subscriber, _deactivates + fires onDeactivation = observable input-side teardown (switchMap cancel/abortInFlight; mergeMap bounding). switch: only the current inner forwarded AND the superseded inner's source torn down (not merely masked). IMMEDIATE in-fn self-rewire still throws -> graph-layer ERROR (D37). Terminal OP discards pending queue. No-net-change rewireNext = no-op (no boundary-drain loop). INTRA-graph only.","note":"D47/R-rewire-deferred; substrate prerequisite for higher-order operators. Distinct from C-8 (external/immediate rewire between waves) — C-11 is SELF-triggered/deferred-at-boundary. Formal DONE 2026-05-29: wave_rewire_deferred.tla TLC-green (5056 states, depth 23) + all 4 invariants (DeferredAppliedAtBoundary / DrainExactlyOnce / RemovedDepSilenced / NoBoundaryDrainLoop) mutation-verified load-bearing. R-rewire-deferred flips active once the C-11 TS arm is green + B15 (fn-swap handle GC) lands (SD-2). Batch/pause deferred-drain timing = backlog B24.","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D47,R-rewire-deferred,D42,D37"}],"flowcharts":[{"id":"FC-1","title":"wave propagation (diamond coalesce)","area":"wave","explains":["R-diamond","R-tier"],"mermaid":"flowchart TD\n  A[state A] -->|DIRTY then DATA| B[derived B]\n  A -->|DIRTY then DATA| C[derived C]\n  B -->|DIRTY| D[derived D]\n  C -->|DIRTY| D\n  B -->|DATA| D\n  C -->|DATA| D\n  D -->|fire once after both settle| OUT[down DATA]"},{"id":"FC-2","title":"batch commit / rollback","area":"batch","explains":["R-wave-boundary"],"mermaid":"flowchart TD\n  S[g.batch fn] --> A[accumulate ctx.down across nodes]\n  A --> Q{fn exits normally?}\n  Q -->|yes| C[implicit commit: one wave pushed downstream]\n  Q -->|throw| R[rollback: discard accumulated]\n  A --> X[bctx.rollback explicit] --> R"},{"id":"FC-3","title":"dispatcher invoke + pool routing","area":"substrate","explains":["R-ctx-up"],"mermaid":"flowchart LR\n  N[node] -->|invoke handle depWave| D[dispatcher]\n  D --> L{pool kind}\n  L -->|LocalSync| LS[same-thread pointer call, immediate ctx.down]\n  L -->|LocalAsync| LA[event loop, callback re-injects]\n  L -->|Remote| RM[wire bridge RTT, callback re-injects]\n  LS --> N\n  LA -->|late-emit DIRTY pair| N\n  RM -->|late-emit DIRTY pair| N"}],"sessions":[{"id":"DS-1","title":"Clean-Slate Redesign (L0–L6 full-stack greenfield)","status":"active","opened":"2026-05-27","locks":["D1","D2","D3","D4","D5","D6","D7","D8","D9","D10","D11","D12","D13","D14","D15","D16","D17","D18","D19","D20","D21","D22","D23","D24","D25","D26","D27","D28","D29","D30","D31","D32","D33","DR-1","DR-2","DR-3","DR-4","DR-5","DR-6","D34","D35","D36","D37","D38","D39","D40","D41","D42","D43","D44","D45","D46","D47"],"path":"sessions/active/SESSION-clean-slate-redesign.md","supersedes":["R11"],"note":"top-down 6-layer design; design-review passed; CSP-0 spec-amend ratified D34(tier table)/D35(dynamicNode)/D36(meta); B10 R-reentrancy spec-amend ratified D37 (reject sync feedback-cycle→ERROR); B11 R-up-at-source spec-amend ratified D38 (depless source: INVALIDATE-up→honor, DIRTY/TEARDOWN-up→drop); inspection-shape ratified D39 (describe snapshot / observe egress / profile dispatcher-recorder, per-language non-parity); CSP-1/CSP-2 TS substrate+graph landed (@graphrefly/ts, 77 tests); CSP-3 TS conformance arm GREEN 2026-05-28 (C-2..C-7 pass, C-1 blocked on wire bridge B2), all conformance-covered rules active (R-dirty-before-data earned via C-4); CSP-4 bootstrap generator functional. D40 (Catalog-first operator/upper-layer re-derive) + D41 (freeze old @graphrefly/graphrefly+pure-ts as read-only reference) locked 2026-05-28. Next: CSP-2.5 substrate rewire (R-rewire active via C-8) → CSP-2.6 sources+operator-opts base → CSP-2.7 operator catalog (~49) → CSP-2.8 upper subsystems → CSP-8 dogfood → CSP-5/CSP-7 rust/py arms. CSP-2.7 design-review 2026-05-29: D45 (operator wiring discipline — topology via declared deps or rewire only, internal subscribe-to-graph-node banned; multi-source = static deps + partial + ctx.state; DROP pausable + interval-as-operator) + D46 (time-operator reactive-core/time-sugar split; wall-clock forms deferred to B23 under R-no-raw-async) locked; FIRST CUT = ~30 dep-based operators each with a D39 describe snapshot test; higher-order (*Map) wired by a new SUBSTRATE wave-boundary-deferred self-rewire affordance ctx.rewireNext (add+remove, option beta) — D47 LOCKED 2026-05-29 via /spec-amend; R-rewire-deferred (draft, since D47) + C-11 + formal wave_rewire_deferred.tla (TLC-green 5056 states + 4 invariants mutation-verified) DONE 2026-05-29; PENDING impl (B15 -> ctx.rewireNext -> C-11 TS green) before flip-acti
