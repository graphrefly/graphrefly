es R11 (memory+harness wedge); every primitive must serve ≥2 segments (F-NO-WEDGE-CUT)","supersedes":["R11"],"status":"locked","session":"DS-1"},{"id":"D3","layer":"L0.3","date":"2026-05-27","question":"User mental anchor?","decision":"graph-first; describe() first-class output","rationale":"the graph is the shared cognitive anchor for humans + LLMs, faster to understand than line-by-line code","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D4","layer":"L1.1","date":"2026-05-27","question":"L4 verb set?","decision":"8 verb closed set: node/graph/batch/state + producer/derived/effect/mount","rationale":"operator is not a verb (it is node sugar)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D5","layer":"L1.3","date":"2026-05-27","question":"Node vs Graph responsibilities?","decision":"Node is thinnest (no inspection cruft); Graph piles on convenience+inspection, the sole entry point","rationale":"a bare node works but has no inspection; g.* sugar auto-registers the inspection index","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D6","layer":"L1.5","date":"2026-05-27","question":"What is an operator?","decision":"operator = node sugar (need not go through derived); not recorded in the spec; describe shows the real name","rationale":"each language implements independently, never enters parity","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D7","layer":"L1.12.A","date":"2026-05-27","question":"handle shape?","decision":"handle = pure data (pool_id, handle_id), no methods","rationale":"serializable/snapshotable/wire-transferable; node≠handle (node has up/down methods)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D8","layer":"L1.11","date":"2026-05-27","question":"fn-body send/receive message API?","decision":"ctx.up(msgs)/ctx.down(msgs); one msgs array = one Wave; may mix tiers","rationale":"abolishes actions.emit/forward/backward; the substrate boundary unifies on up/down","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D9","layer":"L2.A","date":"2026-05-27","question":"tier set?","decision":"9 tier: DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN + PAUSE/RESUME (control tier-0)","rationale":"closed set; PAUSE/RESUME are orthogonal to the value flow","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D10","layer":"L2.C","date":"2026-05-27","question":"PAUSE/RESUME shape?","decision":"[[PAUSE, lock_id]]; lockset; caller generates the id; same id is idempotent; RESUME of an unknown id is no-op","rationale":"so multiple pause sources do not fight each other","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D11","layer":"L2.D'","date":"2026-05-27","question":"message representation?","decision":"in-process tuple / wire protobuf decoupled; conversion happens at the wire-bridge boundary","rationale":"tuple is debug-friendly; protobuf is compact; the two layers are not forced to agree","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D12","layer":"L2.E","date":"2026-05-27","question":"batch shape?","decision":"declarative (success → commit / throw → rollback) + bctx.rollback escape; commit is always implicit","rationale":"eliminates the forgot-to-commit class of bugs; the 3 languages naturally align","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D13","layer":"L2.F","date":"2026-05-27","question":"cross-runtime?","decision":"each runtime has a local dispatcher + wire bridge; DIRTY across the wire has the same priority as DATA; the user wires the mesh themselves","rationale":"R12 DIRTY consistency; the mesh is not GraphReFly's concern","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D14","layer":"L2.H","date":"2026-05-27","question":"formalization depth?","decision":"γ: markdown spec + TLA+ + cross-impl property tests","rationale":"for our own discipline (prevent drift), not for multi-implementation (c aspirational)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D15","layer":"L2-Q9","date":"2026-05-27","question":"When does equals trigger?","decision":"equals substitution only when there is exactly 1 DATA within the wave; 0 is irrelevant; ≥2 does not intervene","rationale":"with multiple DATA there is no longer any skip-fn benefit","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D16","layer":"L2-Q10","date":"2026-05-27","question":"SENTINEL?","decision":"a protocol concept (absence-of-DATA is decidable); the concrete sentinel value is per-language (TS undefined / Rust None / Py sentinel)","rationale":"same semantics, representation decoupled","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D17","layer":"L2-Q11","date":"2026-05-27","question":"resubscribe after terminal?","decision":"terminal-is-forever by default; resubscribable is opt-in","rationale":"the default semantics are clean and the TLA+ state space is small","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D18","layer":"L2-Q13/Q14","date":"2026-05-27","question":"messageTier config?","decision":"messageTier = compile-time const table; custom message type extension is cut","rationale":"9 tier closed (D9); adding a tier = changing the spec","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D19","layer":"L2-Q15","date":"2026-05-27","question":"are onMessage/onSubscribe replaceable?","decision":"substrate-fixed, not replaceable; observation uses the inspector (read-only — does not modify/emit node state, but observe via subscribe still activates a cold node, see R-observe); to insert logic add a node","rationale":"F-NO-IMPL-DEFINED; cut the user-customized protocol stack","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D20","layer":"L3-Q1","date":"2026-05-27","question":"pool required for 1.0?","decision":"LocalSync + LocalAsync; the dispatcher keeps a pluggable pool trait","rationale":"WorkerPool/RemotePool etc. added once the wire bridge matures","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D21","layer":"L3-Q2","date":"2026-05-27","question":"ownership of dispatcher/pool?","decision":"dispatcher first-class; pool hangs off the dispatcher; graph binds a dispatcher (default process-global)","rationale":"multi-tenant/sandbox isolation is natural","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D22","layer":"L3.C","date":"2026-05-27","question":"unit of concurrency?","decision":"graph = causal domain = concurrency domain = single-threaded; compute parallelism via pool callback; true parallelism via multi-graph + wire bridge; Rust drops the actor model; Py drops the subgraph lock; rewire intra-graph only","rationale":"the wave protocol is lock-free; graph boundary = concurrency boundary is explainable; subgraph reverts to pure organization","supersedes":["D221","D222"],"status":"locked","session":"DS-1"},{"id":"D23","layer":"L3-Q6","date":"2026-05-27","question":"store?","decision":"ctx.state is per-node private (implicit is OK); graph-level shared memory = an explicit node+dep","rationale":"private state does not violate graph-first; shared memory must be inspectable","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D24","layer":"L3-Q7","date":"2026-05-27","question":"parity mechanism?","decision":"behavioral conformance replaces structural Impl; cross-track-ledger retired","rationale":"parity downgrades from symbol-set alignment to protocol-behavior conformance; operator/sugar/inspection are per-language and never enter parity","supersedes":["D196"],"status":"locked","session":"DS-1"},{"id":"D25","layer":"L3-Q8","date":"2026-05-27","question":"snapshot/restore?","decision":"topology + cache + factory-name; restore re-resolves by name; incremental changeset; inline fn marked local-only","rationale":"fn cannot be serialized, hence the factory registry pattern","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D26","layer":"L3-Q9/Q10/Q11","date":"2026-05-27","question":"central config singleton?","decision":"fully dissolved: messageTier=const; onMessage/onSubscribe=substrate-fixed; operational config=graph/dispatcher opts; clock=graph-local monotonic; the only global singleton=default dispatcher; the freeze mechanism disappears","rationale":"L3.C graph=causal domain is naturally isolated; config drift + freeze timing complexity is eliminated","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D27","layer":"L4-Q2","date":"2026-05-27","question":"how is sugar registered?","decision":"the sugar→ctx-fn conversion is strictly at the graph layer; dispatcher/node only accept (ctx)=>void","rationale":"each language's sugar is free, dispatcher/node are unified → this feeds behavioral parity (D24)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D28","layer":"L4-Q5","date":"2026-05-27","question":"cleanup hook?","decision":"ctx.onDeactivation + ctx.onInvalidate (2 hooks); cut onRerun (0 callsites) / onResubscribableReset (1 → ctx.state)","rationale":"internal state reset belongs to the ctx.state lifecycle, cleanup only handles external resources + INVALIDATE","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D29","layer":"L4-Q6","date":"2026-05-27","question":"ctx.state lifecycle?","decision":"default fresh-lifecycle wipe; ctx.state.persist(boolean?) retains","rationale":"latches like frozen-context auto-clear; persist crosses the lifecycle","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D30","layer":"L4-Q10","date":"2026-05-27","question":"error + cancellation?","decision":"throw → ERROR (graph-layer catch); cancellation defaults to no-cancel, {switch:true} opt-in + AbortSignal via ctx","rationale":"JS/Py throw is the norm; cancellation as an async pool feature is least-surprise","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D31","layer":"L4-Q11","date":"2026-05-27","question":"typed error?","decision":"error=unknown (Node<T> single generic)","rationale":"typed error causes a type-combinatorial explosion; cross-language Box<dyn Error>/Exception is the top type","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D32","layer":"L6-Q1","date":"2026-05-27","question":"package structure?","decision":"each language a self-contained complete package (@graphrefly/ts·rust·py) + a coarse-grained wire bridge; no cross-language peer-deps","rationale":"sheds D080/D206 + the 9.5× machine tax; abandons the never-functional TS-on-Rust-substrate fantasy","supersedes":["D080","D206"],"status":"locked","session":"DS-1"},{"id":"D33","layer":"L6-Q3","date":"2026-05-27","question":"wire codec?","decision":"wire=protobuf schema-codegen (a single .proto doubling as wire+protocol contract IDL); implementation deferred post-1.0","rationale":"DR-2 IDL single source","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-1","layer":"design-review","date":"2026-05-27","question":"§5.11 ctx-level exposes tier?","decision":"§5.11 amend: ctx-level (node/producer) is a protocol-facing power surface that deliberately exposes tier; value-level (derived/effect/operator) is the §5.11-compliant primary","rationale":"ctx.down's one-wave-multi-tier atomicity (terminal-with-final-value) is something the emit/error methods cannot express","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-2","layer":"design-review","date":"2026-05-27","question":"add IDL to parity?","decision":"A+C: behavioral conformance + the L6-Q3 .proto doubling as protocol contract IDL; codegen the interface skeleton (lightweight structural single source)","rationale":"pure behavioral loses the structural guarantee; the .proto has to be written anyway, so buying interface-shape consistency at zero extra cost","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-3","layer":"design-review","date":"2026-05-27","question":"async-result-at-paused-node?","decision":"goes into the pause buffer + RESUME replay","rationale":"consistent with PAUSE buffering DATA; lock_id scope = node-level pause_lockset","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-4","layer":"design-review","date":"2026-05-27","question":"graph responsibility overload?","decision":"do not introduce a separate domain concept yet (narrow-waist first); record the escape hatch","rationale":"if the inspection boundary vs concurrency boundary conflict actually materializes, introduce a domain (one domain contains multiple graphs)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-5","layer":"design-review","date":"2026-05-27","question":"conformance hard scenarios?","decision":"must include: cross-graph diamond / async-result-at-paused-node / INVALIDATE×ctx.state×onInvalidate / mixed sync-async diamond / PAUSE lockset multi-source; spec amendment list (§5.10/5.11/6.1/7.1 + 3 new)","rationale":"otherwise behavioral parity is an empty promise","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-6","layer":"design-review","date":"2026-05-27","question":"dispatcher opts structure?","decision":"grouped {limits, observability, policy}","rationale":"avoids the cognitive load of a flat dozen-plus keys","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D34","layer":"L2.A","date":"2026-05-28","question":"CSP-0: canonical messageTier const table (numbering + START placement)?","decision":"7-tier const table: 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN; immediate <3, batch-deferred ≥3","rationale":"old-spec numbering with PAUSE/RESUME↔DIRTY swap (control before notification); START=10th handshake type, D9's 9 protocol types occupy tiers 1-6; amends R-tier numbering","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D35","layer":"L1.5","date":"2026-05-28","question":"CSP-0: dynamicNode/track(dep) disposition vs D4 8-verb + D22 rewire?","decision":"carry as intra-graph node construction variant (NOT a verb): superset deps declared at construction + track(dep) read-selection per invocation; unread-dep update fires fn then equals-absorbs; same first-run gate; inter-graph N/A (cross-graph deps only via wire bridge)","rationale":"distinct mechanism from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds all tracked deps to one causal domain","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D36","layer":"L1.3","date":"2026-05-28","question":"CSP-0: meta companion stores substrate or presentation?","decision":"presentation/graph-layer, NOT substrate: static annotations (description/type/range/...) → describe metadata via g.node opts; reactive annotations → explicit nodes (D23); substrate node carries zero meta machinery; meta.owner ABAC is presentation/multi-agent","rationale":"D5 node=thinnest with zero inspection cruft; meta is pure annotation feeding describe (graph owns inspection)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D37","layer":"L2-Q16","date":"2026-05-28","question":"B10: synchronous feedback-cycle / re-entrant fn semantics — queue (A), reject (B), or require-async (C)?","decision":"reject, not iterate (B, owned at graph level): a node fn that during its invocation transitively re-drives one of its own deps so the same node's fn would re-enter before its wave completes is a wave-level protocol ERROR. Detection is node-local and free — refuse to enter the fn-run while the node's own in-wave flag (_insideRunWave) is already set, and throw; the graph layer catches the throw → [[ERROR,e]] down (D30), located at the cycle-closing node, wave aborted. The core neither queues (A) nor bounds-then-runs the cycle. Legit accumulation = per-node ctx.state (scan), not a topological cycle. Async feedback crossing a turn boundary (async pool) is out of scope. No maxFnRerunDepth — precise flag detection supersedes the blunt depth cap","rationale":"A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; B fixes the root with zero new structure by checking the already-existing _insideRunWave flag; dispatcher stays a pure invoke funnel (F-DISPATCH-ALL); error ownership is graph-level per the wave-level error category (D30); surfaced by CSP-1 /qa (backlog B10)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D38","layer":"L2-Q17","date":"2026-05-28","question":"B11: what does a depless source do with an upstream-forwarded control message (INVALIDATE/DIRTY/TEARDOWN) at the terminus?","decision":"the source self-ACTS only on a message with a coherent round-trip: INVALIDATE → HONOR the invalidate-request (clear cache→SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never comes). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned, not destroyable by a downstream request; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediates only forward upstream control (no self-action); the source is the single actor, the down-cascade the effect","rationale":"R-ctx-up/DR-5 deliberately lists INVALIDATE as up-allowed (unlike PAUSE/RESUME which have lockset handling) — the only self-consistent reason to allow it up is for the terminus source to honor it (DS-1 L1.11 'invalidate-request'); it is a cache-drop request not an imperative WRITE (the next value still comes from the source side), so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN have no coherent terminus action. Closes the F-NO-IMPL-DEFINED gap (B11)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D39","layer":"L4-Q8.A","date":"2026-05-28","question":"pre-CSP-2 gate 3: pin the inspection data shapes (describe schema / observe stream protocol / profile metrics)?","decision":"describe = flat JSON-serializable snapshot {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}, DNode={id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (real operator name per D6/L1.5), status (R-status-enum), value? (absent=SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}; edges derived (R-edges-derived); explain mode = causal-chain subset; renderers are pure fns over the snapshot. observe = read-only enveloped EGRESS (NOT a graph node — avoids self-observation island, D19 read-only), item ObserveEvent={path, msg, tier, seq (graph-local clock, D26)}; one shape for single/subtree/whole-graph. profile = opt-in accumulated-counter snapshot {waves; nodes:Record<path,{invokes,emits,resolved,errored,duration?}>}, backed by an opt-in dispatcher/graph recorder (F-DISPATCH-ALL invoke funnel), NEVER on the thin node (R-node-thin), default-off (F-PERF). All three share the mount-aware :: path key + status/tier/seq metadata. Streaming describe / live-topology = an observe topology-event, DEFERRED to CSP-2 viz","rationale":"upholds R-node-thin (profile→dispatcher recorder, not node); observe read-only egress avoids self-observation island + honors D19; consistent with the already-drafted R-describe/R-observe (only pins exact fields + adds R-profile). Inspection is per-language, never in parity (D24) — these rules DOCUMENT the cross-lang contract (covers_by:[], no conformance/TLA+), they do not gate parity","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D40","layer":"L1.5","date":"2026-05-28","question":"clean-slate @graphrefly/ts: how to roll out the operator/upper-layer libraries from pure-ts (~49 operators + 5 upper-layer subsystems)?","decision":"Catalog-first: before the CSP-8 dogfood, using the frozen pure-ts (D41) as the authoritative reference, systematically re-derive the complete operator library + upper-layer subsystems (sources/composition/storage/data-structures/render) onto the new substrate, NOT pulled by dogfood. The re-derivation must align with the clean-slate new semantics (R-rom-ram RAM accumulator per B13, SENTINEL=prevData===undefined, push-on-subscribe, two-phase), re-thinking each edge case rather than copying 1:1; each operator gets a describe snapshot test (D39). operator/sources/composition/storage/data-structures are per-language (D6/D24) and never enter parity; the sole exception is rewire=substrate, which goes through conformance (C-8). Accepting the con: time to D1 value is slower, accepted. Scheduling CSP-2.5 (substrate rewire) → CSP-2.6 (sources + operator-opts base) → CSP-2.7 (operator catalog) → CSP-2.8 (upper-layer subsystems), CSP-8 consumes the complete library","rationale":"the user prioritizes 'zero upper-layer discard + completeness' over time-to-value; general operators naturally serve ≥2 segments (satisfying F-NO-WEDGE-CUT, not an R11-style vertical wedge); freezing pure-ts as a reference avoids knowledge loss; rewire is the known gap in project_rewire_gap, which Catalog-first fills naturally","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D41","layer":"L6","date":"2026-05-28","question":"how to handle the old packages @graphrefly/graphrefly (facade, D32 already retired D080/D206) + @graphrefly/pure-ts v0.49?","decision":"freeze as read-only reference: no further development, used as the authoritative reference for 'what exists, what semantics, what edge cases' when re-deriving operators/upper-layers (D40) onto clean-slate; delete once @graphrefly/ts reaches intent-parity. The CLI/parity-tests/demos dependencies on the old packages must be migrated or retired together before deletion","rationale":"no-backward-compat permits deletion, but the knowledge value is highest during the re-derivation period, so deleting too early = forcing git archaeology; D32 already decided the facade architecture is retired","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D42","layer":"L2-Q18","date":"2026-05-28","question":"CSP-2.5: rewire (setDeps/addDep/removeDep) substrate semantics — mid-wave behavior, first-run gate, cache, rejects, API shape?","decision":"Ratify the TLA+-verified (126k states, 0 violations) + 34-integration-test-validated port-model rewire design (docs/research/rewire-design-notes.md Q1–Q7) for the clean-slate substrate, adapted to the floor: (Q2) PRESERVE the first-run gate _hasCalledFnOnce — rewire is partial, never re-arms (R-first-run-gate); added deps enter prevData=SENTINEL and the fn guards via prevData===undefined. (Q7) PRESERVE cache for activated compute nodes (R-rom-ram). (Q1) added dep with cached DATA pushes [DIRTY,DATA] (R-push-subscribe); SENTINEL dep → START only. (Q3/Q6) removeDep clears the dep's dirty contribution; if it was the sole dirty contributor and the node was dirty, auto-settle. Surgical/Option-C: kept deps untouched (subscription + DepRecord survive), only removed deps unsubscribe+discard, added deps fresh-subscribe; DepRecord-ref dispatch allows free reorder. Mid-wave rewire (between dep deliveries) ALLOWED; mid-fn rewire (_insideRunWave) REJECTED — now floor-mandated by D37/R-reentrancy (a fn re-driving its own topology mid-wave is the feedback-cycle ERROR), not merely a follow-up; reentrant rewire (another in flight) REJECTED. Rejects: self-dep, cycle (DFS O(V+E)), terminal this (completed/errored), adding a non-resubscribable-terminal dep (wedge); resubscribable-terminal deps allowed. removeDep to zero deps ALLOWED (degenerate fn-no-deps, cache preserved, no auto-deactivate; SD-3). No version bump (topology≠DATA). INTRA-graph only (D22); cross-graph via wire bridge; graph-layer mount-aware g.rewire wrapper is CSP-2.x. SD-1: required fn on all three APIs (fn-deps pairing lock — user fns read data[i]/prevData[i] positionally). SD-2: R-rewire flips active only AFTER cross-axis formal coverage (rewire×{INVALIDATE/terminal/equals/multi-sink}) is modeled, not just the per-node MC + integration tests (F-PROTO-SPEC).","rationale":"rewire was fully designed+TLA+-verified+34-test-validated in port-model; clean-slate wave-state concepts map 1:1 so this ratifies proven work rather than re-inventing (D40 Catalog-first: don't discard upper-layer design knowledge). The floor REINFORCES it — D37 upgrades mid-fn-reject to mandatory; R-push-subscribe/R-first-run-gate/R-rom-ram/D22 confirm the Q-resolutions. Substrate prerequisite for higher-order operators (CSP-2.7).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D43","layer":"L1.5","date":"2026-05-29","question":"CSP-2.6: surface shape for the re-derived catalog (sources + operators) + the operator-opts factory base, given describeKind is dead under D6/D39?","decision":"Operators (INCLUDING the 6 landed map/filter/scan/take/distinctUntilChanged/merge) become free-standing operator-factory definitions built on the `node` primitive (NOT the `derived` verb). A single generic graph funnel g.initNode(operator, deps, config?, opts?) instantiates ANY operator factory with the graph's wiring: dispatcher injection + the D30 throw->ERROR boundary + _add real-factory-name registration. This replaces the per-operator Graph methods (the 6 landed g.map/... methods are removed, no-backward-compat). Because instantiation flows through the graph, the factory name is recorded in the graph-layer _entries exactly as today -> describe/observe/profile/find stay UNCHANGED (_entries-based) and the node stays thin (R-node-thin intact, no new node field on the canonical path; NodeOptions.factory? reserved only for standalone graph-less operators). The pure-ts operatorOpts/partialOperatorOpts/gatedOperatorOpts trio is NOT ported: operatorOpts's sole job (describeKind:'derived') is dead under D6/D39/R-describe (factory = real operator name); only the partial / terminalAsRealInput flags survive, carried per-operator via the funnel's flags. Async sources (timer/interval/fromPromise/fromAsyncIter + fromAny/NodeInput<T>) are binding-layer producer-based sugar (D40, feedback_async_sources_binding_layer): timer/interval = pool:'sync'+pausable:false; fromPromise/fromAsyncIter = pool:'async'; cleanup via ctx.onDeactivation (D28); emit only via ctx.down, with setTimeout/Promise confined to source bodies (R-no-raw-async). No substrate change and NO spec amendment (per-language D6/D24, never parity; only rewire is substrate/conformance). SD: resolve the latent substrate edge first -- _shouldBufferOnPause buffers async-pool late emits even when pausable===false, contradicting R-pause-modes' false carve-out; ship async sources on the sync-pool default OR fix _shouldBufferOnPause via /spec-amend+conformance before any pool:'async'+pausable:false source ships (backlog).","rationale":"Free-standing operator defs are tree-shakeable + extensible (user priority: catalog completeness over 49 hardcoded Graph methods). The generic g.initNode funnel keeps the Graph as the single wiring + inspection point (D5) with MINIMAL change -- no DAG-walk discovery, no node->graph back-ref, node stays thin (R-node-thin), and describe/observe/profile are untouched. D27 preserved (the operator body is still a (ctx)=>void wrapped at the graph layer); D6 preserved (real factory names recorded at initNode->_add). The operatorOpts trio doesn't port because describeKind was its only purpose and that concept is dead in clean-slate. Sources are binding-layer per feedback_async_sources_binding_layer; substrate verified feasible (depless producer + captured ctx.down late-emit) without a spec change.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D44","layer":"L2-Q19","date":"2026-05-29","question":"PAUSE buffering precedence: how does `pausable` mode (R-pause-modes) interact with async-result buffering (R-async-paused) for `pausable:false` and for an async LEAF SOURCE in `true` mode? (B20 + its twin, surfaced by the D43 sources.)","decision":"`pausable` mode is the OUTER gate over R-async-paused buffering. (1) false: ignore PAUSE/RESUME ENTIRELY — never gate recompute, never buffer, regardless of pool (sync/async) or node kind (leaf/compute); the node keeps producing through any PAUSE. This DOMINATES R-async-paused (resolves B20). (2) true (default): PAUSE is backpressure on recomputation/propagation only — an async COMPUTE node's (deps>0) in-flight recomputation result buffers when paused (R-async-paused/C-2), but a LEAF SOURCE's (depless) own external down() — sync OR async (timer tick / promise resolve / state.set) — is NOT gated, delivered immediately. (3) 'resumeAll': production-gating mode — buffer the node's own tier-3/4 settle slice incl. a leaf source's own (sync/async) production, replay on final-lock RESUME. Discriminator leaf-vs-compute = deps.length===0. Impl in _shouldBufferOnPause: false->return false; resumeAll->buffer; true->buffer only `!_insideRunWave && asyncPool && deps>0`. Formal: wave_async_paused.tla parameterized by Mode+IsLeaf, invariant NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified.","rationale":"Resolves a genuine under-specification between two ACTIVE rules — R-pause-modes (false=ignore; true leaf-source carve-out) vs R-async-paused (async result at paused node buffers) — which gave OPPOSITE answers for pausable:false+async (B20) and true+async-leaf-source with no stated precedence. The chosen precedence follows R-pause-modes' OWN rationale ('PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job') — production is gated only by resumeAll, never by true/false. Surfaced by D43 (CSP-2.6 async sources: timer/interval pausable:false + fromPromise/fromAsyncIter async leaf sources). Extends D10 (pause modes) + DR-3 (async buffering); does not supersede them. C-2 baseline (async compute node) is preserved.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D45","layer":"L1.5","date":"2026-05-29","question":"CSP-2.7 — how do operators form topology, given D43 already locked the funnel/factory shape?","decision":"Operators form graph topology ONLY via [declared deps (static, construction-time)] or [rewire (D42, dynamic)]. Calling node.subscribe() on another graph node from inside an operator fn body to form ongoing topology is BANNED — it creates an edge describe cannot show (an island), violating D3/R-edges-derived/D39. A depless source bridging EXTERNAL async (no graph-node deps) is exempt (already D43). Multi-source combinators (merge/zip/concat/race/combine/combineLatest/withLatestFrom) = static deps + partial + ctx.state (queue/phase/winner/tuple-equals). Dead-inner handling is carried by the substrate via DepRecord.terminal + terminalAsRealInput; the pure-ts subscribeOr/trySubscribeOrDead helpers are NOT ported. The operatorOpts/partialOperatorOpts/gatedOperatorOpts trio is NOT ported (describeKind is dead, D43). DROP pausable (no-op identity — clean-slate nodes handle PAUSE/RESUME natively) and interval-as-operator (it is a source, lives in sources.ts).","rationale":"D3 graph-first requires describe to be truthful; internal subscribe = an unexplainable island. The landed merge factory already proves the dep-based shape works. Reusing the substrate wave machinery avoids a second subscription stack. Per-language (D6/D24), never in parity.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D46","layer":"L1.5","date":"2026-05-29","question":"CSP-2.7 — what shape do time-based operators take under R-no-raw-async?","decision":"Split reactive-core from time-sugar. Notifier-driven forms (sample/buffer/window gated on a reactive notifier node) = pure dep-based, shipped in the first cut. Wall-clock-arithmetic forms (delay/debounce/debounceTime/throttle/throttleTime/audit/auditTime/timeout/bufferTime/windowTime) MUST NOT use a raw setTimeout in the operator body (R-no-raw-async / check-no-raw-async.ts); they are ABSENT from the first cut and deferred to backlog (B23), triggered by a resettable/cancellable time-source primitive (async still confined to sources.ts) or a mature async pool. The first-cut docs must state the absence explicitly (no silent cap).","rationale":"Notifier-forms are more reactive-pure and immediately shippable; forcing wall-clock forms onto a fixed timer source yields semantically imprecise operators (violates D40 per-operator edge-case re-derivation). delay/timeout need multi-concurrent/resettable timers that are intrinsically a source-layer concern. Per-language (D6/D24).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D47","layer":"L2-Q20","date":"2026-05-29","question":"CSP-2.7 higher-order operators (switchMap/exhaustMap/concatMap/mergeMap/flatMap): what substrate mechanism wires the runtime-created inner nodes, given D45 bans internal subscribe and D37 + the async-pool probe block every in-fn / async path to self-rewire?","decision":"Add a SUBSTRATE self-triggered, wave-boundary-deferred dep-set mutation affordance (ctx.rewireNext) supporting BOTH addDep and removeDep (option beta). A node fn may, during its run, REQUEST a mutation of its OWN dep set; the request is queued and APPLIED by the dispatcher at the committed wave boundary (after the current wave settles, and after a batch() commits or the final-lock RESUME), as a fresh wave, reusing R-rewire surgical/Option-C semantics (D42). Drain is deterministic: per-node FIFO in issue order, nodes in causal order. A no-net-change request is a no-op; an oscillating net-changing request every boundary is a user-level runaway (like an infinite producer), not a substrate-detected error. This is NOT the D37 mid-fn reject — IMMEDIATE in-fn self-rewire still throws (R-reentrancy); the deferral moves application to a turn boundary where _insideRunWave is false. Inners become VISIBLE self-deps (D45/D3; a describe snapshot shows currently-live inners). removeDep is REQUIRED (beta over read-gate-only alpha): read-gating masks OUTPUT but cannot stop an abandoned inner's still-running source — only removeDep -> _deactivate -> onDeactivation tears down upstream work (switchMap abortInFlight: cancel the in-flight LLM/fetch) and bounds memory (drop completed inners). Architecture: ONE substrate dep-set with {read-mask(track) + add + remove + wave-boundary-deferred self-mutation}; dynamicNode (D35, construction superset + track-by-index) and a future autoTrackNode (runtime append-only discovery + track-by-ref) are read-mask sugars that NEVER remove; the *Map family are sugars that add+remove; sugar names stay distinct (D5/D6). *Map inner-lifecycle folding: inner COMPLETE -> rewireNext(remove) (no downstream COMPLETE unless source done AND no live inner; completeWhenDepsComplete:false + terminalAsRealInput); inner ERROR -> forward, mergeMap does NOT cancel siblings; inner INVALIDATE -> absorbed at the operator; source ERROR -> remove all inners; abortInFlight = the removeDep->onDeactivation teardown. PREREQUISITES (gating): R-rewire-deferred draft + formal wave_rewire_deferred.tla (rewire x wave-boundary axis) TLC-green + conformance C-11 green per arm BEFORE flip-active (F-PROTO-SPEC + SD-2); B15 (fn-swap handle GC) MUST land first. *Map EXCLUDED from the CSP-2.7 first cut until these clear.","rationale":"Read-gate (append-only, the dynamicNode/autoTrackNode model) is correct for OUTPUT but cannot stop upstream WORK (a subscribed source keeps running; only unsubscribe->_deactivate->onDeactivation cancels) — so switchMap cancel-the-superseded + abortInFlight + memory bounding require REMOVE, hence beta. Deferring to the wave boundary clears D37 by construction (turn boundary, not synchronous re-entry) and keeps inners visible (D45/D3). Unifying at the substrate (one dep-set, many sugars) avoids three overlapping primitives (D5/D6). Probe: the async pool does NOT defer the fn (dispatcher/index.ts:48 + node.ts:692, _insideRunWave set during any fn run), so the wave boundary is the only legal application point.","supersedes":[],"status":"locked","session":"DS-1"}],"phases":[{"id":"CSP-0","title":"spec finalize (rules + .proto IDL + .tla + conformance scenarios)","status":"done","deps":[],"sessions":["DS-1"],"gap":false,"note":"DONE 2026-05-28: 52 rules (B7 migration), protocol.proto IDL (DR-2), conformance C-1..C-5 detailed, formal modules wave_xgraph/wave_async/wave_async_paused (C-1/C-4/C-2) TLC-green + existing wave_protocol (C-3/C-5); dashboard gate green. Rules status=draft until CSP-1+ impl arms flip them active. Unblocks CSP-1/CSP-5/CSP-7"},{"id":"CSP-1","title":"TS substrate: node/dispatcher/pool(LocalSync+LocalAsync)/wave protocol","status":"impl","deps":["CSP-0"],"sessions":["DS-1"],"gap":true,"note":"kernel landed @graphrefly/ts 2026-05-28 (packages/ts): node + dispatcher + LocalSync/LocalAsync pools + wave protocol + lifecycle + control(PAUSE/async) + batch + dynamicNode; 36 tests + tsc + tsup(ESM/CJS/DTS) + biome all green. /qa DONE 2026-05-28 (41 tests; fixes EC1/EC2/EC3/BH1/BH3/BH6). Pending: CSP-3 conformance to flip draft rules active. Deferred refinements B8/B9 (impl polish). B10 (re-entrancy reject, D37/R-reentrancy) + B11 (up-at-source, D38/R-up-at-source) LANDED 2026-05-28 (node.ts _runWave guard + _up terminus rule; reentrancy.test + up-source.test). R-reentrancy/R-up-at-source flipped active via C-6/C-7 TS arm"},{"id":"CSP-2","title":"TS graph layer: graph/sugar(8 verb)/operators/inspection(describe·observe·profile)","status":"impl","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"graph layer landed @graphrefly/ts 2026-05-28: Graph + 8-verb sugar (node/state/producer/derived/effect/batch/mount + StateNode.set) with D27 sugar→ctx-fn wrapping + D30 throw→ERROR boundary; core operators map/filter/scan/merge/take/distinctUntilChanged (D6 real factory names); inspection describe (D39 flat snapshot + explain + mount ::) / observe (read-only enveloped egress) / profile (opt-in dispatcher-recorder, counters off the thin node). 76 tests + tsup(ESM/CJS/DTS) green. C-6/C-7 TS conformance green. /qa DONE 2026-05-28 (77 tests; fixes A-1 observe :: subtree boundary, A-2 up-INVALIDATE via _down for batch/pause consistency, D-2 profile totalInvokes graph-scoped; spec precision D-1 R-reentrancy/C-6 'located at a node on the c afety) → 94 tests pass, lint+build clean; 4 edges deferred to backlog B16–B19 (throw-during-add rollback, async late-ctx routing, paused-coalesce flag, rewire×batch) + B15 (handle GC). REMAINING: rust/py rewire arms (land in CSP-5/7 substrate) + graph-layer mount-aware g.rewire wrapper (CSP-2.x). TS substrate rewire = DONE"},{"id":"CSP-2.6","title":"sources + operator-opts factory base","status":"impl","deps":["CSP-2"],"sessions":["DS-1"],"gap":true,"note":"D40: per-language binding layer (feedback_async_sources_binding_layer). LANDED @graphrefly/ts 2026-05-29 (D43): operators (incl the 6 re-derived map/filter/scan/take/distinctUntilChanged/merge) are free-standing Operator<TIn,TOut> factory defs built on the bare `node` primitive (NOT derived); a single generic g.initNode(op,deps,opts) funnel wires dispatcher + D30 throw->ERROR boundary + _add real-factory-name registration (D6/R-describe) — describe/observe/profile UNCHANGED, node stays thin (R-node-thin); bare-node path via the exported free initNode. pure-ts operatorOpts/partial/gated trio NOT ported (describeKind dead under D6). Sources: timer/interval (pool:sync+pausable:false) + fromPromise/fromAsyncIter (pool:async) + of/fromIter + fromAny/NodeInput<T>, producer-based, async confined to sources.ts (R-no-raw-async, enforced by scripts/check-no-raw-async.ts per B21-DONE). D44 (pause precedence): pausable mode is the OUTER gate over R-async-paused — false->never buffer, true->buffer only async COMPUTE (deps>0), resumeAll->all; node._shouldBufferOnPause fixed + wave_async_paused.tla (Mode+IsLeaf, NoBufferWhenIgnoring TLC-green+mutation-verified) + C-9/C-10 ts:pass; resolved B20 + its async-leaf-source twin. /qa DONE 2026-05-29 (110 tests + lint(+check-no-raw-async) + build green; 1 fix F1 = source ERROR-payload undefined->Error coercion per R-data-payload + deactivate-stops-source test; SEAM-A ghost-emit + EC-4 TLA-divergence adversarially reviewed -> not bugs). REMAINING: rust/py source+operator arms (per-language D6/D24, CSP-5/7); C-9/C-10 rust/py todo. pure-ts ref: extra/sources(6)"},{"id":"CSP-2.7","title":"operator catalog re-derive (~49 from pure-ts reference)","status":"design","deps":["CSP-2.5","CSP-2.6"],"sessions":["DS-1"],"gap":true,"note":"D40 main body: systematic re-derive grouped by pure-ts file (transform->combine->take->buffer->control->time->higher-order), ~49 operators. per-language sugar (D6, real factory names, never parity D24). Each operator: describe snapshot test (D39); edge-cases reworked for clean-slate semantics (R-rom-ram RAM accumulators B13, prevData===undefined SENTINEL, two-phase) NOT 1:1 ported. pure-ts ref: extra/operators/*.ts DESIGN-REVIEW 2026-05-29 (/design-review csp-2.7 -> D45/D46): wiring discipline LOCKED (D45 — topology only via declared deps or rewire; internal subscribe-to-graph-node inside a fn body BANNED; multi-source = static deps + partial + ctx.state; operatorOpts trio + subscribeOr/trySubscribeOrDead NOT ported; DROP pausable + interval-as-operator). Time-operator shape LOCKED (D46 — notifier-driven forms ship; wall-clock-arithmetic forms deferred to B23 under R-no-raw-async). FIRST CUT = ~30 dep-based operators (transform/take/combine-static/control-reactive/buffer-count + sample), each with a D39 describe snapshot test. Higher-order (switchMap/exhaustMap/concatMap/mergeMap/flatMap): D47 LOCKED 2026-05-29 (/design-review higher-order -> /spec-amend) = a SUBSTRATE self-triggered wave-boundary-deferred dep-set mutation (ctx.rewireNext, add+remove); read-gate (append-only) handles OUTPUT but only removeDep->_deactivate->onDeactivation stops an abandoned inner's WORK (switchMap cancel/abortInFlight + memory bounding), hence option beta. SPEC-AMEND: R-rewire-deferred (draft) + C-11 + formal wave_rewire_deferred.tla (TLC-green 5056 states + all 4 invariants mutation-verified) DONE 2026-05-29; B15 (fn-swap handle GC) HARD PREREQUISITE. *Map EXCLUDED from the first cut until these clear. Impl order: B15 -> ctx.rewireNext substrate -> C-11 TS -> flip active -> *Map sugars (D39 snapshot tests, D47 lifecycle folding) -> rust/py arms (CSP-5/7)."},{"id":"CSP-2.8","title":"upper-level subsystems (composition/storage/data-structures/render)","status":"design","deps":["CSP-2.7"],"sessions":["DS-1"],"gap":true,"note":"D40 tail: re-derive composition(3)/storage(8)/data-structures(7: reactive-list/map/index/log)/render(1) from frozen pure-ts (D41). per-language (D6/D24). Closes the catalog before CSP-8 dogfood consumes it"},{"id":"CSP-3","title":"conformance suite (TS arm green; DR-5 hard scenarios)","status":"impl","deps":["CSP-2"],"sessions":["DS-1"],"gap":true,"note":"TS arm GREEN 2026-05-28: C-2..C-7 pass (conformance.test.ts 8 tests; full @graphrefly/ts suite 77 green). C-1 cross-graph diamond in-process core green (core.test.ts), full scenario blocked on wire bridge (backlog B2, post-1.0). R-dirty-before-data flipped active via C-4 earned-coverage (post-activation DIRTY-before-DATA assertion added to conformance.test.ts). All conformance-covered rules now active. rust/py arms pending CSP-5/CSP-7"},{"id":"CSP-4","title":"dashboard generator (jsonl→HTML static + consistency check)","status":"impl","deps":[],"sessions":["DS-1"],"gap":true,"note":"bootstrap static generator FUNCTIONAL (dashboard/build.mjs: jsonl→HTML + --check consistency gate, green). Visual styling = separate /frontend-design pass; reactive dogfood rebuild via GraphReFly at CSP-8"},{"id":"CSP-5","title":"Rust substrate (single-thread core, no actor model)","status":"design","deps":["CSP-0"],"sessions":["DS-1"],"gap":true},{"id":"CSP-6","title":"Rust conformance arm green","status":"design","deps":["CSP-3","CSP-5"],"sessions":["DS-1"],"gap":true},{"id":"CSP-7","title":"Py substrate + conformance arm","status":"design","deps":["CSP-0","CSP-3"],"sessions":["DS-1"],"gap":true},{"id":"CSP-8","title":"dogfood dashboard via GraphReFly (reactive jira / messaging-hub)","status":"design","deps":["CSP-2.7","CSP-2.8","CSP-4"],"sessions":["D
