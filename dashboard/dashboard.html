, and deferred boundary tasks (ctx.rewire_next/upNext + batch commit drains) now use graph-local queue/draining flags instead of thread-local globals; batch clears/drains per graph root. Behavior preserved (32 unit + 22 conformance + clippy -D warnings + build green). Seventh slice (2026-06-01): graph-local deferred boundary queue switched from Vec/remove(0) to VecDeque/pop_front (O(1) FIFO drain, same ordering semantics) as a B49 thin-core/perf housekeeping step; behavior preserved (32 unit + 22 conformance + clippy -D warnings + build green). Eighth slice (2026-06-01): added runtime example probe crates/graphrefly/examples/b49_probe.rs to quantify B49-adjacent costs (boundary FIFO queue, dirty/data fanout push, alternating rewire churn). On this host: queue 20,000 tasks Vec/remove(0)=55.730 ms vs VecDeque/pop_front=0.399 ms (139.56x); fanout 512 x 2,000 waves=301.940 ms; rewire churn 10,000 alternations=17.302 ms. Behavior gates still green (32 unit + 22 conformance + clippy -D warnings + build). Ninth slice (2026-06-01): expanded crates/graphrefly/examples/b49_probe.rs to cover remaining B49 probe axes: INVALIDATE traversal (fanout 256 x 2000), diamond pending/join cost (128 legs x 2000), sparse-vs-dense frontier/cache-locality proxy (256 sources), and retained-heap proxy (drop-completeness for closure-captured payloads). Host results: invalidate median 197.138 ms (98,568.92 ns/wave, deliveries 3,072,000 expected=3,072,000); diamond median 127.457 ms (63,728.71 ns/set); frontier sparse 0.415 ms vs dense 110.466 ms with near-linear per-set cost (519.06 ns sparse vs 539.38 ns dense); retained-heap proxy drop completeness 15,000/15,000 with payload 4 KiB and alloc+drop median 1.762 ms/round. Existing probes preserved: queue Vec/remove(0)=62.899 ms vs VecDeque/pop_front=0.412 ms (152.61x), fanout 512x2000=331.735 ms, rewire churn 10,000=18.009 ms. Behavior gates still green (32 unit + 22 conformance + clippy -D warnings + build). Decision gate for B-path: no conformance-visible drift and no immediate retention/locality red flag from this probe set; keep B49 open for optional frontier-structure rewrite only if future workloads show non-linear dirty/invalidate traversal or retained-memory pressure. Tenth slice (2026-06-01, QA pass): probe methodology tightened per adversarial review. (1) invalidate probe now reports set-only baseline, set+invalidate total, and invalidate-only estimate by subtraction (same topology), avoiding workload conflation; host: set-only 201.255 ms, set+invalidate 233.171 ms, invalidate-only 31.916 ms (~15,957.94 ns/wave), deliveries 3,072,000 expected=3,072,000. (2) retained-heap proxy now exercises ACTIVE lifecycle (subscribe -> one wave -> unsubscribe -> drop) before asserting capture drop completeness, so dep/subscription paths are included; host: drop completeness 15,000/15,000, alloc+drop 6.787 ms/round @ 2,500 nodes x 4 KiB payload. (3) frontier probe now guards sources_n>0 to avoid modulo panic in future sweeps. Updated host run (same binary): queue 72.842 vs 0.482 ms (151.10x), fanout 427.720 ms, diamond 145.082 ms, sparse/dense per-set 635.05 vs 584.61 ns, rewire 18.407 ms. Decision gate remains: no conformance-visible drift and no immediate retention red flag within this sampled active-lifecycle workload; keep B49 open and trigger B-path only on real non-linear dirty/invalidate traversal or retained-memory pressure in production-like workloads. TS PREP 2026-06-02: D76 locked the TS migration route. Next TS /dev-dispatch should treat B49 as approved for implementation prep, not as an open design fork. Recommended first slices: (1) introduce a behavior-neutral graph-local core/slot identity behind Node while preserving Node construction/API; (2) move dep-slot bookkeeping into side tables or packed arrays with a lazy ctx.depRecords view; (3) move own output state and transient wave flags; (4) move pause/batch/deferred-boundary queues graph-locally; (5) only after behavior gates and TS-local perf data, consider adjacency/frontier work. Explicit non-goals for first TS migration: Rust dependency, structural parity, changed public API, changed describe shape, object identity promises for depRecords, and double-bookkeeping frontier layers rejected by B50-B52. TS PREP/FIRST SLICE 2026-06-02: @graphrefly/ts introduced an internal NodeCore/NodeId/NodeSlot shape (packages/ts/src/node/core.ts) and migrated Node from direct per-node wave/bookkeeping fields to a public view over a core slot. QA clarified this slice is slot-extraction prep, not the graph-local shared-core landing: each standalone Node still owns its current core/slot container, while the hot Node view directly holds the created slot to avoid repeated Map lookups on wave paths. The first slice is behavior-preserving and deliberately does not add a frontier/adjacency transport or double-write layer; subscriber closure propagation remains the single transport source for now. Public Node cache/status/deps/handle/name/factory accessors and Graph describe/observe/profile behavior are preserved. Added B49 structural regressions proving the old direct-field shims (_deps/_depBatch/_pending/_cache/_status/_subscribers/_pauseLockset/_depRecords) are absent on the Node view and that the hot view keeps a direct slot reference. Verification after QA: pnpm --filter @graphrefly/ts test => 342 pass; pnpm run lint => biome + layer + no-raw-async + typecheck green; pnpm run build => green; node ~/src/graphrefly/dashboard/build.mjs --check => green. TS D77/B49 SECOND SLICE 2026-06-02: @graphrefly/ts migrated raw ctx dep input from depRecords/latest/prevData aliases to ctx.waveData + ctx.terminal, preserving wave boundaries with internal delivery metadata and derived helpers backed by implementation-owned dep cache; C-23 ts:pass; behavior gates green. TS THIRD SLICE 2026-06-02: @graphrefly/ts now gives graph-created nodes a shared graph-local NodeCore while preserving standalone node()/free initNode private-core isolation. Graph owns a NodeCore and injects it through an internal Node construction hook for g.node/state/producer/derived/effect/initNode; Node remains the public view over (core,nodeId,slot), and the existing direct slot reference stays on the hot view. This is behavior-neutral: no propagation engine/frontier rewrite, no second adjacency source of truth, no public API or describe shape change. Added B49 regression coverage proving same-graph nodes share core, different graphs and standalone nodes do not, and a graph-local core path still propagates through a real derived/operator wave. QA hardening: reviewer findings fixed by making the graph-core construction hook one-shot, pre-validating graph deps before graph-local core construction to avoid failed-construction slot retention, adding owner-token checks so graph-owned public rewire cannot attach another graph's node while bare/unowned inners remain allowed, and adding regression tests for free initNode isolation, failed cross-graph construction, nested dispatcher registration, and cross-graph subscribeDep rejection. Verification: pnpm --filter @graphrefly/ts test => 353 pass; pnpm run lint => green; pnpm run build => green. TS FOURTH SLICE 2026-06-02: @graphrefly/ts moved deferred-boundary queue ownership into NodeCore. boundary.ts now keeps only the synchronous wave-owner depth plus a pending-core scheduler; rewireNext/upNext and batch-after-commit deferrals enqueue on the owning graph-local/private core. This preserves the existing subscriber-closure propagation path and avoids any frontier/adjacency double-write layer (B50-B52 non-goals). Added a B49 structural regression proving an in-fn rewireNext task is queued on the owning core and drained at the outer wave boundary. Behavior preserved before /qa: pnpm --filter @graphrefly/ts test => 354 pass; pnpm run lint => green; pnpm run build => green. QA FIX 2026-06-02: /qa caught that draining all tasks for one core before the next could reorder mixed-core FIFO (A1,A2,B1 instead of A1,B1,A2) and used Array.shift on the scheduler path. Fixed boundary.ts to keep one pending core token per queued task and a head-index scheduler, preserving enqueue FIFO across private/graph cores while still storing task bodies on NodeCore. Added a teeth regression with two private cores in one batch: A1 queues A2 during drain, and expected order remains A1,B1,A2. Final gates: pnpm --filter @graphrefly/ts test => 355 pass; pnpm run lint => green; pnpm run build => green. TS FIFTH SLICE 2026-06-02: @graphrefly/ts moved own output/control/wave/private/hook/sync-ctx state out of NodeSlot into NodeCore side tables keyed by NodeId. NodeSlot now carries topology/config/subscribers plus DepBookkeeping only; Node view exposes typed accessors over core side tables, preserving public cache/status/deps/handle/factory accessors and protocol behavior. This deliberately does not touch DepBookkeeping/waveData/terminalInput, propagation transport, adjacency, frontier, describe shape, or public API. Added B49 structural regression coverage proving slot no longer owns value/wave/control/privateState/hooks/syncCtx and side-table cardinality tracks slots. Verification: pnpm --filter @graphrefly/ts test => 355 pass; pnpm run lint => green; pnpm run build => green. TS SIXTH SLICE 2026-06-02: @graphrefly/ts moved external subscriber lifecycle state (subscribers Set + activated flag) out of NodeSlot into a NodeCore lifecycle side table keyed by NodeId. NodeSlot now carries topology/config plus DepBookkeeping only; subscribe/unsubscribe, activation/deactivation, rewire activated guards, resetLifecycle, and emit snapshot semantics route through the lifecycle side table while preserving Set identity and current-wave subscriber snapshot behavior. This deliberately does not touch DepBookkeeping/waveData/terminalInput, propagation transport, adjacency, frontier, describe shape, or public API. Expanded B49 structural regression coverage proving slot no longer owns subscribers/activated and lifecycle side-table cardinality tracks slots. Verification: pnpm --filter @graphrefly/ts test => 355 pass; pnpm run lint => green; pnpm run build => green. TS SIXTH SLICE QA 2026-06-02: /qa fixed a resubscribable lifecycle leak: _resetLifecycle now clears terminal-era external subscribers before the fresh lifecycle attaches its new sink, so old COMPLETE/ERROR-era subscribers do not receive later DATA. Added lifecycle.test regression for R-terminal fresh lifecycle. Also kept hot-path direct references from Node view to side-table state objects (not duplicate state) to preserve F-PERF and the earlier B49 direct-hot-view precedent; rejected the alternative of repeated Map.get access on every wave-state touch. Final gates: pnpm --filter @graphrefly/ts test => 356 pass; pnpm run lint => green; pnpm run build => green. TS SEVENTH SLICE 2026-06-02: @graphrefly/ts moved DepBookkeeping out of NodeSlot into a NodeCore depStates side table keyed by NodeId, while preserving Node hot-path direct references to the dep state object. NodeSlot now carries topology/config only; dep waveData/terminalInput/latest, dirty/pending dep-slot arrays, subscriptions/idx boxes, and rewire dep-state rebuilds route through the side table. This remains behavior-neutral: subscriber closure propagation is still the single transport source, no adjacency/frontier layer was added, ctx.waveData/terminal/latest timing and describe/public API are preserved. Expanded B49 structural regression coverage proving slot no longer owns dep and side-table cardinality tracks slots. Verification: pnpm --filter @graphrefly/ts test => 357 pass; pnpm run lint => green; pnpm run build => green. TS EIGHTH SLICE 2026-06-02: @graphrefly/ts added an informational B49 TS-local probe (packages/ts/src/__bench__/b49-probe.ts, runnable with pnpm run probe:b49:ts) covering boundary FIFO, fanout DATA push, INVALIDATE set-only baseline vs set+invalidate, diamond pending join, rewire churn, and active lifecycle retained-cleanup proxy. This is explicitly not a CI gate and does not implement or authorize B50-B52 adjacency/frontier/transport changes; subscriber closure propagation remains the single transport source. Host run on node v24.10.0: boundary FIFO 20,000 tasks median 0.841 ms; fanout 512 x 2,000 waves median 499.606 ms with DATA deliveries 1,024,512/1,024,512; INVALIDATE set-only baseline fanout 256 x 2,000 median 232.337 ms with DATA 512,256/512,256; set+invalidate median 316.325 ms with source INVALIDATE 2,000/2,000; diamond 128 legs x 2,000 median 148.561 ms with join DATA 2,001/2,001; rewire churn 10,000 alternations median 41.386 ms with DATA 10,001; active lifecycle cleanup 2,500 nodes x 4 KiB median 23.693 ms with cleanup bytes 10,240,000/10,240,000. Verification: pnpm run probe:b49:ts => green; pnpm --filter @graphrefly/ts test => 357 pass; pnpm run lint => green; pnpm run build => green. TS EIGHTH SLICE ADDENDUM 2026-06-02: added a B49 structural guard in packages/ts/src/__tests__/core.test.ts asserting NodeCore has not grown parallel adjacency/frontier/ready/work queues over the existing subscriber propagation transport, explicitly keeping the TS slice outside B50-B52. Verification after the guard: pnpm --filter @graphrefly/ts test -- --run packages/ts/src/__tests__/core.test.ts => 358 pass; pnpm run lint => green; pnpm run probe:b49:ts => green. TS EIGHTH SLICE QA 2026-06-02: /qa hardened the TS probe/guard without touching runtime transport or B50-B52 adjacency/frontier paths. The probe now asserts sanity counters instead of only printing them, counts downstream sink INVALIDATE delivery for set+invalidate fanout, and keeps rewire/diamond/fanout/lifecycle checks fail-fast while remaining informational (not a CI gate). The B49 structural guard now inspects NodeCore own keys and rejects new adjacency/edge/frontier/queue/work transport-shaped fields unless they are known core fields, so it is no longer limited to exact field names. Verification after hardening: pnpm run probe:b49:ts => green with sink INVALIDATE 512,000/512,000; full package gates run in QA. TS NINTH SLICE 2026-06-02: @graphrefly/ts packed NodeCore side tables from Map<NodeId,...> into NodeId-indexed arrays while preserving the public Node view and hot-path direct references to the side-state objects. This is behavior-neutral and stays inside D76/B49: no propagation/frontier/adjacency transport, no public API or describe shape change, and subscriber closure propagation remains the single transport source. Expanded B49 structural coverage proving side tables are arrays keyed by NodeId while retaining the B50-B52 no-parallel-transport guard. Verification: pnpm --filter @graphrefly/ts test => 359 pass; pnpm run probe:b49:ts => green sanity counters; pnpm run lint => green; pnpm run build => green. TS B49 QA CLOSE-OUT 2026-06-02: /qa ran two static review arms (blind code review + spec-aware D76/B49 review), both returned no findings. No code fixes were needed. Final close-out gates GREEN: pnpm --filter @graphrefly/ts test => 359 pass; pnpm run probe:b49:ts => green sanity counters; pnpm run lint => green; pnpm run build => green; node ~/src/graphrefly/dashboard/build.mjs --check => green.","resolved_by":"2026-06-02 @graphrefly/ts B49 QA close-out","resolution":"TS B49 internal GraphCore/side-table migration is complete enough to unblock CSP-8: Node is a stable public view over graph-local/private NodeCore slots; raw ctx input is waveData+terminal; value/wave/control/lifecycle/dep/hook/sync-ctx state and deferred-boundary queues live behind NodeCore; side tables are NodeId-indexed arrays; public API, describe shape, conformance-observable wave behavior, and subscriber-closure propagation are preserved. B50-B52 remain binding negative evidence: no ready frontier layering, partial adjacency, or mechanical internal out_edges replacement landed. Reopen B49 only for a regression in this internal bookkeeping migration; future centralized PropagationEngine/adjacency/frontier work needs a new design gate with fresh TS-local evidence. D109 FOLLOW-UP 2026-06-04: @graphrefly/ts added node runtime version metadata to the same B49 NodeCore side-table architecture (versionStates keyed by NodeId). This closes the post-D26 node-versioning placement gap without reopening B49, reviving a config singleton, adding a companion node, or changing wave protocol/transport."},{"id":"B50","title":"RESOLVED Rust ready-run frontier A/B: do not land a sparse frontier index that queues ready-to-run nodes while keeping the existing per-message subscriber cascade as the source of truth.","state":"resolved","trigger":"RESOLVED 2026-06-02. Reopen only if a future B49 slice moves dirty/invalidate traversal into a true centralized adjacency/frontier structure instead of wrapping ready-run execution with an extra queue.","lang":"rust","ref":"B49,D71,F-PERF,R-dirty-before-data,R-diamond,D49","resolved_by":"2026-06-02 graphrefly-rs ready-frontier A/B perf gate","resolution":"Implemented a behavior-preserving GraphCore ready_frontier prototype with weak Core tokens and dense queued bits, then rejected it by same-host release perf. It passed 32 unit + 22 conformance after preserving immediate D49 occurrence timing and D37 feedback-cycle detection, but b49_probe showed no clear win: fanout and diamond hot paths regressed while invalidate-only improved only modestly/noisily. The patch was reverted. Final release baseline after revert/package rename: queue Vec/remove(0)=59.935 ms vs VecDeque=0.421 ms; fanout 512x2000=320.725 ms; invalidate-only estimate=33.213 ms; diamond 128x2000=127.138 ms; sparse frontier proxy=0.421 ms; retained heap=5.707 ms/round; rewire churn=17.374 ms. Conclusion: sparse/frontier remains worth pursuing only as a real dirty/INVALIDATE adjacency/workset centralization, not as a ready-run queue layered over existing bookkeeping."},{"id":"B51","title":"RESOLVED Rust INVALIDATE-only centralized adjacency A/B: do not land a partial B-path that adds GraphCore out_edges while retaining internal subscriber closures for the other tiers.","state":"resolved","trigger":"RESOLVED 2026-06-02. Reopen only as a post-1.0 C-path/full PropagationEngine design, or as a no-double-bookkeeping internal-edge rewrite that removes closure subscribers entirely without changing conformance behavior.","lang":"rust","ref":"B49,B50,D71,F-PERF,R-invalidate-idempotent,R-diamond,R-resolved-undirty","resolved_by":"2026-06-02 graphrefly-rs invalidate-only adjacency perf gate","resolution":"Per user direction, attempted B = internal GraphCore adjacency for INVALIDATE while leaving DATA/DIRTY/RESOLVED on existing internal subscriber closures. First implementation passed 32 unit + 22 conformance but regressed release b49_probe: invalidate-only ~40.609 ms vs same-window baseline ~31.316 ms, retained-heap proxy ~9.619 ms/round vs ~6.062 ms. Optimized obvious implementation tax (O(1) swap-remove internal-edge deletion and no external-observer fast path) and still failed same-window A/B: patch run invalidate-only ~34.004 ms, rewire ~18.124 ms; baseline run invalidate-only ~30.448 ms, rewire ~16.366 ms. The code patch was reverted. Conclusion: partial B is a double-bookkeeping design and does not satisfy F-PERF. C remains post-1.0: a full centralized PropagationEngine/settle frontier may be reconsidered only with no duplicated internal subscriber path and with conformance-preserving DATA occurrence, diamond, reentrancy, rewire, pause, and terminal semantics."},{"id":"B52","title":"RESOLVED Rust C-propagation replacement probe: do not land a first-cut GraphCore internal adjacency transport that replaces subscriber closures but still delivers per-message with weak-edge sorting/token checks.","state":"resolved","trigger":"RESOLVED 2026-06-02. Reopen only as a substantially different post-1.0 PropagationEngine design that centralizes scheduling/frontier settlement rather than merely translating the existing per-message cascade into GraphCore out_edges.","lang":"rust","ref":"B49,B50,B51,D71,F-PERF,R-dirty-before-data,R-diamond,D49,D37,R-rewire","resolved_by":"2026-06-02 graphrefly-rs C-propagation replacement perf gate","resolution":"Implemented an experimental C replacement on branch codex/c-propagation-probe: GraphCore owned internal out_edges with weak dst handles and dep-index tokens, internal node-to-node delivery stopped using subscriber closures as the main path, external subscribe()/observe sinks remained closure-based, and fn invocation still went only through dispatcher.invoke. The patch preserved conformance-visible behavior (cargo test -p graphrefly-rs: 32 unit + 22 conformance pass) but failed the same-session release perf gate. Baseline before patch: queue Vec/remove(0)=61.384 ms vs VecDeque=0.426 ms; fanout 512x2000=329.555 ms; invalidate-only estimate=31.598 ms; diamond 128x2000=189.695 ms; sparse frontier proxy=0.428 ms; retained heap=6.855 ms/round; rewire churn=17.538 ms. Patch run: queue Vec/remove(0)=64.275 ms vs VecDeque=0.426 ms; fanout=598.892 ms; invalidate-only=97.417 ms; diamond=158.323 ms; sparse frontier proxy=0.454 ms; retained heap=14.758 ms/round; rewire churn=18.779 ms. The only meaningful win was diamond; fanout, invalidate-only, retained heap, sparse proxy, and rewire regressed, so the implementation was reverted per the probe gate. Conclusion: replacing closures mechanically is not enough; C is still post-1.0 and needs a smaller centralized engine that reduces per-delivery borrow/refcount/sort/token overhead, or it should not be pursued."},{"id":"B53","title":"Rust product-completeness target: conformance parity is necessary but not sufficient; graphrefly-rs must also reach the current @graphrefly/ts feature surface.","state":"open","trigger":"Use at the start of future graphrefly-rs /dev-dispatch work. The Rust arm should continue from clean-slate with behavioral conformance parity (D24) as the protocol floor, while also implementing the product feature surface already landed in @graphrefly/ts: graph-first API, 8 verb sugar, sources, operators/combinators/higher-order/time/control/buffer families, reactive structures where sequenced, inspection/describe/observe/profile surfaces, and equivalent public ergonomics where appropriate. This is NOT structural parity: Rust may use Rust-native names/types/layouts and remains self-contained per D32; do not recreate the retired Impl/port model. If matching a TS feature reveals a protocol behavior gap or would change wave semantics, stop and route through spec-amend before code.","lang":"rust","ref":"D24,D32,D4,D6,D39,D40,D41,B49,B52,D123,F-GRAPH-FIRST-API,F-PERF","note":"User clarification 2026-06-02: 'conformance parity' names only the cross-runtime behavioral contract; the roadmap expectation is fuller product completeness with @graphrefly/ts, not merely satisfying spec/conformance.jsonl. Next Rust sessions should not require this to be re-explained. 2026-06-04 Rust B53 product catch-up: graphrefly-rs added higher_order::repeat(factory,count) as factory-fresh depless self-rewire sugar over existing D47/R-rewire-deferred, exported it from the root, and aligned buffer notifier empty-window flushing with the TS catalog. Static QA reviewers found no issues; Rust fmt/test/clippy/build green. 2026-06-05 Rust B53 product catch-up: graphrefly-rs added sources::from_timer(ms) as a Rust-native source alias preserving the TS-visible factory name `fromTimer`, exported it from the root, and added regression coverage for source factory names, fromTimer missing-driver diagnostics, timeout/buffer_time unsubscribe clock cleanup, switch_map reused-live-inner dedupe across separate source waves, and render direction/ascii value toggles. /qa fixed the alias diagnostic and strengthened the switch_map regression; Rust fmt/test/clippy/build green; dashboard check green. 2026-06-05 Rust B53 product catch-up: graphrefly-rs added sources::from_fs_watch / from_fs_watch_with_options as a Rust-native filesystem watcher source preserving the TS-visible factory name `fromFSWatch`, exported FsEvent/FsEventKind/FromFsWatchOptions from the root, and covered initial scan filtering, missing-driver diagnostics, cleanup cancellation, live event conversion, out-of-root dropping, file-root relative paths, access-event filtering, excluded dirs, and symlink-safe recursive scans. /qa fixed terminal notify-error cleanup, moved cleanup registration before synchronous initial-scan DATA, hardened recursive scan/path matching, and Rust fmt/test/clippy/build green. 2026-06-06 Rust B53 product catch-up: graphrefly-rs added pure DescribeSnapshot diagnostics (reachable, explain_path, validate_no_islands) as D39/R-describe inspection helpers, exported them from the root, and covered upstream/downstream/both traversal, max-depth truncation, shortest causal chains, mount-aware islands, synthetic snapshots, dangling edges, and cycle search. Rust cargo test -p graphrefly-rs green. 2026-06-06 design lock: D123 sets the next Rust storage/read-through catch-up path as a new clean-slate passive module inside the main graphrefly crate, with old graphrefly-storage reference-only and reactive_cascading_cache deferred to a graph-layer wrapper over that spine. 2026-06-06 Rust B53/B57 storage catch-up: graphrefly-rs added graph-layer reactive_cascading_cache as a free helper over the passive storage spine, returning visible value/status/events nodes, default-disabled promotion with explicit opt-in, D108 versioned promotion, loader fallback, policy/invalidate deps, Idle/loading/hit/miss/error status, and panic-to-cache-error handling. Targeted storage, graph_layer, conformance, full cargo test, clippy, and build green. 2026-06-07 Rust B53/B57 storage catch-up: graphrefly-rs added passive append-log plus D85 conditional-create multi-writer allocation over the in-crate KV spine, exported the Rust-native append-log API, and covered ordered/page reads, truncation, malformed/torn listings, put_if_absent, unsupported multi-writer truncation, and retry-window refresh. 2026-06-07 Rust B53/B57 storage catch-up: graphrefly-rs added a neutral strict/canonical JSON module shared by checkpoint validation and storage, Rust-native JsonCodec/StrictJsonCodec plus decimal scalar helpers, and passive content-addressed KV/storage helpers over the in-crate KV spine using D113 canonical bytes + SHA-256 with read/write/read-write/read-strict modes; no Graph storage methods, environment backends, restore/hydration ownership, WAL replay-as-restore, protocol/conformance changes, or old graphrefly-storage dependency. 2026-06-07 Rust B53/B57 observe-event log catch-up: graphrefly-rs added passive change/observe-event storage envelopes and strict codecs, attach_observe_event_log over Graph.observe() read-only egress, and read_observe_event_log_page over the append-log spine; frames preserve observeSeq/path/stream and page by append sequence without projection/restore semantics; no Graph storage methods, environment backends, WAL replay-as-restore, storage-owned hydration/restore, protocol/conformance changes, or old graphrefly-storage dependency. 2026-06-07 Rust B53/B57 environment-backend catch-up: graphrefly-rs added a passive filesystem byte backend with namespace-safe percent-encoded keys, atomic replace writes, D85 put_if_absent, typed codec KV lifting, and file-backed append-log helpers; no SQLite/IndexedDB dependency, no Graph storage methods, no storage-owned hydration/restore, no WAL replay-as-restore, no protocol/conformance changes, and no old graphrefly-storage dependency. 2026-06-07 Rust B57-adjacent passive WAL closeout: graphrefly-rs added Rust-native passive WAL frame key/prefix helpers, strict WAL frame codec, canonical body SHA-256 checksum/verification, WAL frame construction with D84 timestamp metadata, append-log paging coverage, and restore/checkpoint extra-field rejection; no WAL replay-as-restore, graph checkpoint WAL replay, Graph storage methods, protocol/conformance changes, or old graphrefly-storage dependency. Rust B57 final /qa fixes: graphrefly-rs now queues observe-event log frames until flush/dispose so storage writes do not run on the observe hot path, makes file put_if_absent publish only fully-written temp files via no-replace hard-link, uses process/nonce create-new temp files for replace writes, preserves already-committed multi-writer append slots instead of deleting them after a fresher tail appears, and skips other namespaces when listing the default filesystem namespace."},{"id":"B54","title":"DR-8 Rust arena/index next-slice design gate: start with owner-execution over arena indices, keep subscriber transport unchanged, and measure DR-7 typed-vs-erased cost before any hybrid implementation.","state":"open","trigger":"Use before the next graphrefly-rs B49/DR-8 design or /dev-dispatch. The next DR-8 slice should design a graph-owner execution path that reduces Rc<RefCell>/Core-clone/dynamic-borrow tax while preserving the current subscriber-closure transport and all observable wave semantics. It is NOT a C' PropagationEngine retry: B50-B52 remain binding negative evidence, so do not add ready-frontier layering, INVALIDATE-only adjacency, or a mechanical internal out_edges replacement. C' may reopen only with new probe evidence of nonlinear traversal or retained-memory pressure and with a substantially different one-source-of-truth design. DR-7 remains a measurement gate: add typed-vs-erased probes for Rc<dyn Any>/downcast/typed emit-read cost first; if the gap is small, keep erased for simplicity rather than implementing hybrid special cases.","lang":"rust","ref":"DR-7,DR-8,D71,B49,B50,B51,B52,F-PERF,R-node-thin,R-dispatch-all,R-dirty-before-data,R-diamond,R-rewire","note":"Design-review 2026-06-02 narrowed the path: DR-8 is already locked as the Rust perf end-state, but the implementation entry should be owner-execution/arena-index rather than propagation-engine replacement. Expected sketch: Core becomes an external handle/token over graph_id/node_id/generation; hot wave entry borrows the graph arena by index, mutates side tables in short scopes, snapshots callable/sinks/messages, then releases the borrow before dispatcher.invoke or user sinks. Required invariants: stale-handle generation checks, push-on-subscribe ordering, D37 reentrancy error, R-dirty-before-data, R-diamond exactly-once, R-rewire surgical/deferred behavior, panic cleanup, unsubscribe/drop safety, and describe/GraphSpec invisibility. Add apples-to-apples probes before claiming improvement: topology-build-in/out, fanout, INVALIDATE set-only/set+invalidate, diamond, rewire churn, retained cleanup, sparse/dense frontier proxy, and typed-vs-erased micro/protocol axes. MEASUREMENT 2026-06-03 (graphrefly-rs b49_probe Probe E added, Rc/AnyValue objects black_boxed): typed read Rc<T> 0.98 ns/op vs erased Rc<dyn Any> clone+downcast 1.57 ns/op (1.61x, tiny absolute); typed emit alloc 28.03 ns/op vs erased emit+cast 28.72 ns/op (1.02x, no material erased penalty in this probe); current graph ctx.data+ctx.emit path 576.89 ns/source.set. Interpretation: DR-7 de-erasure is NOT the obvious next bottleneck on the current protocol path; prefer continuing DR-8 owner-execution/arena-index measurement over starting a hybrid typed hot-path implementation unless a more protocol-real probe shows a larger erased tax."},{"id":"B55","title":"TS storage completeness migration: re-derive the frozen pure-ts full storage tiers/WAL/hydration/content-addressed stack after the observe-sink first cut.","state":"resolved","trigger":"DONE -- B55 closed as passive storage completion only. Reopen only for a regression inside D103/D106 passive storage helpers, not for graph restore/hydration/WAL replay convenience APIs.","lang":"ts","ref":"D40,D41,D57,D74,D75,D82,D96,D103,D106,D108,D112,D113,R-snapshot,R-restore,F-SYNC-CORE,D6,D24","note":"User correction 2026-06-02 after TS keepalive slice: the remembered future migration target was full storage tiers/WAL/hydration/content-addressed stack, not the retired facade/Impl/operator/window/internal-subscribe shapes. Resolved 2026-06-05 by @graphrefly/ts passive storage closeout: byte backends (memory/web/file/sqlite/idb), typed KV, D85 conditional-create/multi-writer append log, D108 narrow versioned KV promotion, read-through helper, content-addressed KV/storage, scalar/timestamp codecs, strict JSON codec boundary via D96/D113, passive WAL frame codec/checksum helpers, observe-event append-log sink/pages, browser/node storage subpaths, and strict corruption/export-boundary tests. QA fix tightened append-log size() to validate listed canonical padded sequence keys like read/append. Explicitly not part of this closeout: Graph.attachSnapshotStorage, restoreSnapshot/restoreFromStorage/hydrateGraph, WAL replay-as-restore, storage-owned hydration, graph checkpoint WAL replay, same-process host-value checkpoint, graph storage methods, broad CAS/transactions/locks/leases, append-log compaction/truncation capability, or observe-event projection/fold helper; those remain separate design/spec gates if ever needed.","resolved_by":"2026-06-05 @graphrefly/ts B55 passive storage closeout QA","resolution":"B55 deletion-risk storage knowledge gap is closed for the TS binding layer under D103/D106. Storage remains per-language/passive/async outside the sync wave core, with graph restore semantics owned by R-restore/R-snapshot and separate restoreGraph(checkpoint,{registry}) work over already-loaded checkpoints."},{"id":"B56","title":"C-24 checkpoint/restore completion hardening: D117 locked restored-cache late subscribe; conformance pass still needs TS/Rust implementation plus Rust strict canonical JSON, node runtime version handling, and ERROR payload preservation.","state":"resolved","trigger":"Before flipping C-24 runtimes.ts or runtimes.rust to pass, implement/verify D117 restored-cache late subscribe semantics: after restore commit, a late subscriber to a restored dep-bearing node receives the restored cache directly, and restored dep activation/push-on-subscribe does not by itself recompute or overwrite it. Also complete Rust strict canonical JSON validation over checkpoint decode/encode, optional node version metadata handling (validate/preserve or fail honestly until runtime versioning lands), and ERROR terminal payload capture/fail-honestly behavior without placeholders.","lang":"ts/rust","ref":"D83,D90,D94,D96,D109,D112,D116,D117,R-snapshot,R-restore,C-24","note":"Surfaced by QA during the 2026-06-05 D116 implementation. D117 now resolves the design fork in favor of direct restored-cache push-on-subscribe, not fresh lifecycle replay. Current state: TS checkpoint version literal is neutral (`graphrefly.checkpoint.v1`); Rust has first-cut Graph::checkpoint/restore_graph with one registry, declarative descriptor definitions, default JSON state restore, local-only/missing/version/configVersion failures, and no storage-owned restore. Rust tests assert cache/ctx.state preservation at restore commit but still need D117 late-subscribe semantics, strict canonical JSON decode/encode, node version metadata handling, and ERROR payload preservation before C-24 flips pass. 2026-06-06 RUST CLOSE: graphrefly-rs added restored activation handshake suppression plus C-24 conformance coverage; checkpoint hardening now rejects unsupported runtime version metadata, non-strict-canonical JSON numbers, and ERROR terminal payload restore until payload preservation lands. Gates: conformance C-24, checkpoint::tests, full conformance, graph_layer, cargo test -p graphrefly-rs, clippy --workspace --all-targets, cargo build.","resolved_by":"2026-06-06 Rust C-24 restore hardening","resolution":"C-24 TS and Rust pass gates are no longer blocked by B56. TS D117 restore coverage is green. Rust now covers restored-cache late subscribe, no hidden recompute during restored dep activation, ctx.state preservation, post-commit DATA as ordinary wave, local-only/missing factory failure, unsupported runtime version metadata failure, strict canonical JSON number validation on checkpoint/restore JSON fields, and ERROR terminal payload fail-honestly behavior until preservation lands."},{"id":"B57","title":"Storage product-completeness matrix: use TS as the product sample and advance Rust by closable storage/read-through slices, not structural parity or conformance.","state":"resolved","trigger":"DONE -- B57 closed as Rust passive storage product-completeness matrix plus TS passive WAL-adjacent helpers. Reopen only for regressions in the D103/D106/D123 passive storage spine, not for graph restore/hydration/WAL replay convenience APIs or runtime-specific backend expansion.","lang":"rust/ts","ref":"B53,B55,D57,D82,D103,D104,D105,D107,D108,D123,D80,D121,D122,D24,F-SYNC-CORE,F-GRAPH-FIRST-API","note":"Design-review 2026-06-06 approved matrix-driven product catch-up as the execution discipline: TS remains the product sample; Rust stays self-contained and Rust-native; parity means behavioral conformance only for protocol, not storage symbol shape. Passive storage helpers may lookup/promote/return facts but must not create graph nodes, own hydration/restore, replay WAL as graph restore, or act as graph commit barriers. Graph-layer reactive_cascading_cache should be a free helper over the passive spine returning visible value/status/events nodes from declared request/policy/invalidate deps, with requestSeq stale-fill guard and explicit promotion policy. No new D# is required for this discipline because D103/D104/D105/D107/D108/D123 already lock the architecture; add a new design-review only for Rust-specific public API forks or any proposal outside those bounds. 2026-06-06 Rust reactive_cascading_cache slice landed under the matrix discipline: no Graph method, no imperative cache object, no storage-owned restore/hydration/WAL replay, no protocol/conformance change; TS product semantics mapped to Rust-native enums and Rc-backed passive tiers. 2026-06-07 Rust append-log/condi ependency, no Graph storage methods, no storage-owned hydration/restore, no WAL replay-as-restore, no protocol/conformance changes, and no old graphrefly-storage dependency. 2026-06-07 Rust B57-adjacent passive WAL closeout: graphrefly-rs added Rust-native passive WAL frame key/prefix helpers, strict WAL frame codec, canonical body SHA-256 checksum/verification, WAL frame construction with D84 timestamp metadata, append-log paging coverage, and restore/checkpoint extra-field rejection; no WAL replay-as-restore, graph checkpoint WAL replay, Graph storage methods, protocol/conformance changes, or old graphrefly-storage dependency. Rust B57 final /qa fixes: graphrefly-rs now queues observe-event log frames until flush/dispose so storage writes do not run on the observe hot path, makes file put_if_absent publish only fully-written temp files via no-replace hard-link, uses process/nonce create-new temp files for replace writes, preserves already-committed multi-writer append slots instead of deleting them after a fresher tail appears, and skips other namespaces when listing the default filesystem namespace.","resolved_by":"2026-06-07 graphrefly-rs B57 passive storage closeout + WAL-adjacent QA","resolution":"B57 is closed for Rust-native passive storage product completeness against the TS B55 sample: KV/read-through, D85 append-log/conditional append, codecs/scalars/strict canonical JSON, content-addressed helpers, observe-event log helpers, filesystem environment backend, graph-layer reactive_cascading_cache, and passive WAL frame key/codec/checksum helpers are implemented and exported from graphrefly-rs. Explicitly out of scope remain Graph storage methods, storage-owned hydration/restore, WAL replay-as-restore, graph checkpoint WAL replay, observe projection/fold helpers, broad transactions/leases, and extra runtime-specific backends such as SQLite/IndexedDB unless a future design gate opens them."},{"id":"B58","title":"RESOLVED CSP-9 package surface: @graphrefly/ts h p. 2026-06-07 TS B63 first D130/D131 slice landed EnvironmentDrivers in @graphrefly/ts: GraphOptions.environment installs a graph-owned driver bag, ctx.environment() exposes it to dispatched node/source functions, and driver-backed source factories runProcess/runProcessWithOptions/fromProcess/fromHttp/fromHttpWithOptions/fromSSE/fromSSEWithOptions/fromWebSocket/fromWebSocketWithOptions/fromWebhook/fromWebhookWithOptions route process, HTTP, SSE, WebSocket, and webhook DATA/COMPLETE/ERROR through graph-local drivers with active/cancel fencing. The universal @graphrefly/ts/sources barrel remains browser-safe by excluding process sources while exporting network/webhook driver shapes; process remains available from root/graph surfaces. No protocol/conformance change. 2026-06-07 TS B63 D132 slice completed outbound/message-bus/resilience app-infra: @graphrefly/ts/adapters now exports toHttp/toProcess/toWebSocket outbound bundles with declared source deps, attempt/status/error nodes, graph-local EnvironmentDrivers, and bounded RetryPolicy/BackoffPolicy retry facts; @graphrefly/ts/messaging now exposes finite-topic messageBus/fromTopic/toTopic over graph-owned topic nodes; @graphrefly/ts/orchestration now exposes passive retry/backoff helpers plus retryStatusBundle, breakerBundle, rateLimitBundle, and timeoutBundle; graph/environment adds structural fetchHttpDriver and domWebSocketDriver optional runtime drivers. SSE remains inbound-only in this slice because SSE has no standard outbound send surface. Raw async guard updated to recognize D130 driver/adapter boundary while keeping sync core protected. No protocol/conformance change. 2026-06-08 TS B63 optional runtime-driver closeout added nodeProcessDriver under @graphrefly/ts/sources/node as a Node-only LocalProcessDriver for EnvironmentDrivers.withProcess; it backs fromProcess/runProcess and toProcess with child_process.spawn, stdout/stderr aggregation with maxBufferBytes ERROR fencing, ignored stdin for no-input command shape, exitCode/signal DATA, spawn/setup ERROR, and cancellation kill fencing. The universal @graphrefly/ts/sources barrel remains browser-safe and no protocol/conformance behavior changed. 2026-06-08 TS B63 D133 first slice added webSocketSession under @graphrefly/ts/adapters as a graph-visible SessionBundle with command/inbound/lifecycle/status/errors/attempts nodes, command-only start/send/close sugar, bounded RetryPolicy reconnect, and no protocol/conformance behavior change. QA hardened the slice by requiring LocalWebSocketDriver.connectSession/WebSocketSessionHandle for same-connection outbound sends while keeping toWebSocket on the one-shot send path; late send callbacks after close are suppressed, remote closes clean up the live session, explicit starts are ignored while a retry timer is pending, and normal code 1000 close is lifecycle-only by default. 2026-06-08 TS B63 D134 first slice added wireBridge under @graphrefly/ts/adapters as a transport-free graph-visible bridge bundle with command/outbound/inbound/events/ack/nack/status/errors/cursor/attempts nodes, per-session seq/cursor/idempotency metadata, and bounded ack-timeout retry facts using RetryPolicy/BackoffPolicy. Convenience start/send/ack/nack/close publish command DATA only. Remote receipt enters only as later inbound envelope DATA; remote error is a bridge error fact, not a local protocol ERROR. No protocol/conformance behavior changed. 2026-06-08 TS B63 D135 first slice added dynamicHub/fromHubTopic/toHubTopic under @graphrefly/ts/messaging as a facts-dynamic, topology-static hub bundle with fixed command/events/status/errors and optional deadLetter nodes. Unknown-topic behavior is explicit with default graph-visible error plus drop/dead-letter/create-as-fact policies; create/delete/publish/subscribe-like intents are command DATA facts only, convenience helpers publish command facts, and topic keys remain data rather than graph topology. QA hardened the slice by retaining the fixed events reducer through graph-owned lifecycle, persisting JSON-friendly hub runtime state across deactivation/checkpoint, rolling back failed toHubTopic wiring, and adding explicit maxTopics/maxTopicLength bounds whose violations become graph-visible hub error facts. No runtime topic node creation/removal, hidden EventEmitter hub, fake topology event, protocol, conformance, tier, message, or ctx.up/down change was added. 2026-06-08 TS B63 CQRS first slice added @graphrefly/ts/cqrs as a graph-visible CQRS bundle/helper: command DATA facts enter through a graph-owned command node; command handlers run inside the dispatched runtime node and append ordered event facts only after full validation; status/errors/audit/cursor are ordinary derived graph facts; projections derive from declared event deps and route reducer failures to graph-visible projection error facts. Runtime state is JSON-friendly ctx.state for checkpoint capture. No CqrsGraph subclass, guard/policy/factoryTag/domainMeta public semantics, hidden EventEmitter/subscribe island, process manager, storage-owned restore, protocol, conformance, tier, message, or ctx.up/down change was added. 2026-06-09 TS B63 passive messaging vocabulary slice rehomed the old root src/utils/messaging/message.ts data-only contract into @graphrefly/ts/messaging: JsonSchema, TopicMessage, PROMPTS_TOPIC, RESPONSES_TOPIC, INJECTIONS_TOPIC, DEFERRED_TOPIC, SPAWNS_TOPIC, CONTEXT_TOPIC, TODOS_TOPIC, STANDARD_TOPICS, and StandardTopic. This is passive application-infrastructure vocabulary only: no TopicGraph/SubscriptionGraph/messagingHub class port, no GraphSpec/factoryTag/Actor owner, no hidden EventEmitter, no topology lifecycle, no protocol/conformance change, and no utils/base/compat/presets barrel resurrection. 2026-06-09 TS B63 D158 semantic-memory passive vocabulary slice landed under @graphrefly/ts/patterns: MemoryFragment/FactId/FactStore/StoreReadHandle/MemoryQuery/MemoryAnswer/OutcomeSignal, collection/retrieval vocabulary types, validate
