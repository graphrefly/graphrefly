ursuing only as a real dirty/INVALIDATE adjacency/workset centralization, not as a ready-run queue layered over existing bookkeeping."},{"id":"B51","title":"RESOLVED Rust INVALIDATE-only centralized adjacency A/B: do not land a partial B-path that adds GraphCore out_edges while retaining internal subscriber closures for the other tiers.","state":"resolved","trigger":"RESOLVED 2026-06-02. Reopen only as a post-1.0 C-path/full PropagationEngine design, or as a no-double-bookkeeping internal-edge rewrite that removes closure subscribers entirely without changing conformance behavior.","lang":"rust","ref":"B49,B50,D71,F-PERF,R-invalidate-idempotent,R-diamond,R-resolved-undirty","resolved_by":"2026-06-02 graphrefly-rs invalidate-only adjacency perf gate","resolution":"Per user direction, attempted B = internal GraphCore adjacency for INVALIDATE while leaving DATA/DIRTY/RESOLVED on existing internal subscriber closures. First implementation passed 32 unit + 22 conformance but regressed release b49_probe: invalidate-only ~40.609 ms vs same-window baseline ~31.316 ms, retained-heap proxy ~9.619 ms/round vs ~6.062 ms. Optimized obvious implementation tax (O(1) swap-remove internal-edge deletion and no external-observer fast path) and still failed same-window A/B: patch run invalidate-only ~34.004 ms, rewire ~18.124 ms; baseline run invalidate-only ~30.448 ms, rewire ~16.366 ms. The code patch was reverted. Conclusion: partial B is a double-bookkeeping design and does not satisfy F-PERF. C remains post-1.0: a full centralized PropagationEngine/settle frontier may be reconsidered only with no duplicated internal subscriber path and with conformance-preserving DATA occurrence, diamond, reentrancy, rewire, pause, and terminal semantics."},{"id":"B52","title":"RESOLVED Rust C-propagation replacement probe: do not land a first-cut GraphCore internal adjacency transport that replaces subscriber closures but still delivers per-message with weak-edge sorting/token checks.","state":"resolved","trigger":"RESOLVED 2026-06-02. Reopen only as a substantially different post-1.0 PropagationEngine design that centralizes scheduling/frontier settlement rather than merely translating the existing per-message cascade into GraphCore out_edges.","lang":"rust","ref":"B49,B50,B51,D71,F-PERF,R-dirty-before-data,R-diamond,D49,D37,R-rewire","resolved_by":"2026-06-02 graphrefly-rs C-propagation replacement perf gate","resolution":"Implemented an experimental C replacement on branch codex/c-propagation-probe: GraphCore owned internal out_edges with weak dst handles and dep-index tokens, internal node-to-node delivery stopped using subscriber closures as the main path, external subscribe()/observe sinks remained closure-based, and fn invocation still went only through dispatcher.invoke. The patch preserved conformance-visible behavior (cargo test -p graphrefly-rs: 32 unit + 22 conformance pass) but failed the same-session release perf gate. Baseline before patch: queue Vec/remove(0)=61.384 ms vs VecDeque=0.426 ms; fanout 512x2000=329.555 ms; invalidate-only estimate=31.598 ms; diamond 128x2000=189.695 ms; sparse frontier proxy=0.428 ms; retained heap=6.855 ms/round; rewire churn=17.538 ms. Patch run: queue Vec/remove(0)=64.275 ms vs VecDeque=0.426 ms; fanout=598.892 ms; invalidate-only=97.417 ms; diamond=158.323 ms; sparse frontier proxy=0.454 ms; retained heap=14.758 ms/round; rewire churn=18.779 ms. The only meaningful win was diamond; fanout, invalidate-only, retained heap, sparse proxy, and rewire regressed, so the implementation was reverted per the probe gate. Conclusion: replacing closures mechanically is not enough; C is still post-1.0 and needs a smaller centralized engine that reduces per-delivery borrow/refcount/sort/token overhead, or it should not be pursued."},{"id":"B53","title":"Rust product-completeness target: conformance parity is necessary but not sufficient; graphrefly-rs must also reach the current @graphrefly/ts feature surface.","state":"open","trigger":"Use at the start of future graphrefly-rs /dev-dispatch work. The Rust arm should continue from clean-slate with behavioral conformance parity (D24) as the protocol floor, while also implementing the product feature surface already landed in @graphrefly/ts: graph-first API, 8 verb sugar, sources, operators/combinators/higher-order/time/control/buffer families, reactive structures where sequenced, inspection/describe/observe/profile surfaces, and equivalent public ergonomics where appropriate. This is NOT structural parity: Rust may use Rust-native names/types/layouts and remains self-contained per D32; do not recreate the retired Impl/port model. If matching a TS feature reveals a protocol behavior gap or would change wave semantics, stop and route through spec-amend before code.","lang":"rust","ref":"D24,D32,D4,D6,D39,D40,D41,B49,B52,F-GRAPH-FIRST-API,F-PERF","note":"User clarification 2026-06-02: 'conformance parity' names only the cross-runtime behavioral contract; the roadmap expectation is fuller product completeness with @graphrefly/ts, not merely satisfying spec/conformance.jsonl. Next Rust sessions should not require this to be re-explained."},{"id":"B54","title":"DR-8 Rust arena/index next-slice design gate: start with owner-execution over arena indices, keep subscriber transport unchanged, and measure DR-7 typed-vs-erased cost before any hybrid implementation.","state":"open","trigger":"Use before the next graphrefly-rs B49/DR-8 design or /dev-dispatch. The next DR-8 slice should design a graph-owner execution path that reduces Rc<RefCell>/Core-clone/dynamic-borrow tax while preserving the current subscriber-closure transport and all observable wave semantics. It is NOT a C' PropagationEngine retry: B50-B52 remain binding negative evidence, so do not add ready-frontier layering, INVALIDATE-only adjacency, or a mechanical internal out_edges replacement. C' may reopen only with new probe evidence of nonlinear traversal or retained-memory pressure and with a substantially different one-source-of-truth design. DR-7 remains a measurement gate: add typed-vs-erased probes for Rc<dyn Any>/downcast/typed emit-read cost first; if the gap is small, keep erased for simplicity rather than implementing hybrid special cases.","lang":"rust","ref":"DR-7,DR-8,D71,B49,B50,B51,B52,F-PERF,R-node-thin,R-dispatch-all,R-dirty-before-data,R-diamond,R-rewire","note":"Design-review 2026-06-02 narrowed the path: DR-8 is already locked as the Rust perf end-state, but the implementation entry should be owner-execution/arena-index rather than propagation-engine replacement. Expected sketch: Core becomes an external handle/token over graph_id/node_id/generation; hot wave entry borrows the graph arena by index, mutates side tables in short scopes, snapshots callable/sinks/messages, then releases the borrow before dispatcher.invoke or user sinks. Required invariants: stale-handle generation checks, push-on-subscribe ordering, D37 reentrancy error, R-dirty-before-data, R-diamond exactly-once, R-rewire surgical/deferred behavior, panic cleanup, unsubscribe/drop safety, and describe/GraphSpec invisibility. Add apples-to-apples probes before claiming improvement: topology-build-in/out, fanout, INVALIDATE set-only/set+invalidate, diamond, rewire churn, retained cleanup, sparse/dense frontier proxy, and typed-vs-erased micro/protocol axes. MEASUREMENT 2026-06-03 (graphrefly-rs b49_probe Probe E added, Rc/AnyValue objects black_boxed): typed read Rc<T> 0.98 ns/op vs erased Rc<dyn Any> clone+downcast 1.57 ns/op (1.61x, tiny absolute); typed emit alloc 28.03 ns/op vs erased emit+cast 28.72 ns/op (1.02x, no material erased penalty in this probe); current graph ctx.data+ctx.emit path 576.89 ns/source.set. Interpretation: DR-7 de-erasure is NOT the obvious next bottleneck on the current protocol path; prefer continuing DR-8 owner-execution/arena-index measurement over starting a hybrid typed hot-path implementation unless a more protocol-real probe shows a larger erased tax."},{"id":"B55","title":"TS storage completeness migration: re-derive the frozen pure-ts full storage tiers/WAL/hydration/content-addressed stack after the observe-sink first cut.","state":"open","trigger":"Before deleting the frozen old packages under D41, revisit the D57/D74 storage gap: @graphrefly/ts currently exposes attachObserveSink as the first storage binding helper, while frozen pure-ts still contains the fuller tier interfaces/codecs, memory/file/sqlite/IndexedDB backends, WAL framing/restore errors, snapshot/append-log/KV helpers, cascading cache, content-addressed storage, and hydration/restore intent. Re-derive this stack on clean-slate as binding-layer APIs with async outside the sync wave core; do not silently add Graph methods or snapshot/restore protocol semantics without the required design/spec gate.","lang":"ts","ref":"D40,D41,D57,D74,D75,R-snapshot,R-restore,F-SYNC-CORE,D6,D24","note":"User correction 2026-06-02 after TS keepalive slice: the remembered future migration target is full storage tiers/WAL/hydration/content-addressed stack, not the retired facade/Impl/operator/window/internal-subscribe shapes. D57/D74 deliberately kept the first TS storage cut to observe-sink binding; this backlog item preserves the intent to return for the fuller storage stack later."}],"antipatterns":[{"id":"AP1","pattern":"wrapping an imperative helper as a reactive primitive","why":"the primitive inevitably re-exposes the imperative helper as a method","instead":"widen the helper's args to T|Node<T>; let the caller opt into reactive control","ref":"feedback_no_imperative_wrap_as_primitive"},{"id":"AP2","pattern":"eager-placeholder upstream pollutes SENTINEL","why":"ctx can never observe the true absence-of-DATA state","instead":"fix the upstream to stop eager-emitting; use prevData[i]===undefined as the never-emitted detector","ref":"feedback_use_prevdata_for_sentinel"},{"id":"AP3","pattern":";-chaining background cargo / long commands","why":"deadlock≠thrash confusion; the process group can't be killed cleanly","instead":"one target at a time; bounded -j; kill by process group; direct log + DONE sentinel","ref":"feedback_no_chained_background_cargo"},{"id":"AP4","pattern":"stale premise propagation","why":"the design session task table lags the code; opening a 9Q on a stale premise","instead":"grep the named symbols + check the landed marker; surface the stale premise as a HALT","ref":"feedback_verify_premise_before_greenfield"},{"id":"AP5","pattern":"making architectural decisions on your own initiative","why":"silently picking a side masks a spec↔code conflict","instead":"surface the conflict for the user to call; review multi-file rewrites file by file","ref":"feedback_no_autonomous_decisions"},{"id":"AP6","pattern":"marking active/superseded with prose inside the archive","why":"markers rot; active and superseded end up mixed in one directory","instead":"split active/archive into physical directories; put the state in a jsonl status field","ref":"P3"},{"id":"AP7","pattern":"canonical responsibility split across multiple documents","why":"the sequencer/decision-log is scattered in many places, causing migration-period confusion","instead":"a single canonical per responsibility; decisions in a single D# sequence","ref":"P1,P2"}],"rules":[{"id":"R-msg-format","area":"message","statement":"message = array of [Type, Data?] tuples; one array passed to ctx.down/ctx.up = one wave; in-process representation = tuple, wire representation = protobuf, decoupled at the wire-bridge boundary","rationale":"D8 up/down(msgs); D11 tuple/protobuf decoupled","status":"draft","since":"D8,D11","covers_by":[]},{"id":"R-msg-closed-set","area":"message","statement":"10 message types, CLOSED: START + DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN/PAUSE/RESUME. No open set, no user-defined custom types, no MessageTypeRegistry; the old unknown-type-forwarding rule is retired (vacuous under a closed set). Adding a tier/type = spec change (constitutional)","rationale":"D9 9-type closed set + START handshake; D18 messageTier compile-time const, custom types CUT","status":"draft","since":"D9,D18","covers_by":[]},{"id":"R-tier","area":"message","statement":"messageTier const table (7 tiers): 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN. Tiers <3 dispatch immediately; tiers ≥3 are batch-deferred (DATA/RESOLVED in the settle slice, INVALIDATE alongside, terminal after, TEARDOWN last). Closed const table — adding a tier is constitutional","rationale":"D34 ratified numbering (old-spec with PAUSE/RESUME↔DIRTY swap so control precedes notification); D9 closed set","status":"active","since":"D9,D34","covers_by":["C-1"]},{"id":"R-data-payload","area":"message","statement":"[DATA,v] requires a non-SENTINEL payload (v ≠ undefined/None/per-language sentinel); [ERROR,e] requires an explicit non-SENTINEL, non-boolean diagnostic payload; bare [DATA]/[ERROR], [DATA,SENTINEL], [ERROR,SENTINEL], [ERROR,false], and [ERROR,true] are rejected at the dispatch boundary; binding/source adapters that receive host-language undefined/boolean failures must coerce them to a valid diagnostic payload before emitting ERROR; null is a valid DATA value (domain-level absence)","rationale":"D16 SENTINEL = absence-of-DATA must stay decidable; DATA(SENTINEL) would be indistinguishable from never-emitted. D78 keeps D77 terminal metadata lightweight (`false` none, `true` COMPLETE, payload ERROR) by excluding boolean ERROR payloads, so ERROR false/true cannot collide with terminal shorthand.","status":"draft","since":"D16,D78","covers_by":["C-23"]},{"id":"R-wave-boundary","area":"wave","statement":"outside batch: one ctx.down(msgs) = one wave; inside batch: accumulation until commit = one wave","rationale":"","status":"active","since":"D8,D12","covers_by":[]},{"id":"R-dirty-before-data","area":"wave","statement":"every tier-3 (DATA/RESOLVED) emission is preceded by DIRTY in the same wave; the dispatcher synthesizes a [DIRTY] prefix when the caller omits it and the node is not already dirty; raw and framed emission paths are observationally identical on the wire","rationale":"glitch-free two-phase contract; D9 mechanism is impl freedom but the DIRTY-before-DATA ordering is observable","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-two-phase","area":"wave","statement":"DIRTY (phase 1) propagates through the entire reachable graph before DATA/RESOLVED (phase 2) begins — glitch-free diamond. Activation exemption: a compute fn's first run during subscribe() does not require a preceding DIRTY","rationale":"two-phase push guarantees a fan-in node sees all settled deps before recompute","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-diamond","area":"wave","statement":"diamond/fan-in: D recomputes exactly once after all changed deps settle in same wave","rationale":"the spec only describes observable behavior; the mechanism (dirtyMask) is impl freedom","status":"active","since":"D9","covers_by":["C-1","C-4"]},{"id":"R-equals","area":"wave","statement":"the equals substitution (DATA→RESOLVED) fires only when there is exactly 1 DATA within the wave; 0 is irrelevant; with ≥2 they are all DATA. Within one wave at one node the tier-3 slot is ≥1 DATA XOR exactly 1 RESOLVED — never mixed (tier-3 wave exclusivity). Default equals = Object.is/is; custom equals via node opts; never invoked while cache is SENTINEL","rationale":"multiple DATA yield no skip-fn benefit; exclusivity keeps cache coherent with last-delivered DATA -- RETIRED by D49 (Opt-3: no auto-equals-substitution; replaced by R-resolved-undirty)","status":"retired","since":"D15","covers_by":[]},{"id":"R-same-wave-merge","area":"wave","statement":"multiple settle-class messages on one node in one wave are resolved by tier-sort (DATA advances cache, a trailing INVALIDATE clears it; subscribers observe the full sequence). The sole explicit merge rule is INVALIDATE+INVALIDATE collapse (cleanup hook fires at most once). DATA+RESOLVED in the same wave on the same node is a protocol violation (R-resolved-undirty / D49)","rationale":"tier ordering produces the right end-state without silently eliding messages","status":"draft","since":"D8","covers_by":[]},{"id":"R-invalidate-idempotent","area":"wave","statement":"INVALIDATE is broadcast at most once per node per wave (diamond fan-in cascades it once, not once per arriving path); an INVALIDATE arriving at an already-reset OR never-populated cache is a no-op — neither the cleanup hook nor the downstream broadcast fires again","rationale":"prevents double-cleanup and wedged-DIRTY deadlock; the two reset states are observationally equivalent downstream","status":"active","since":"D9","covers_by":["C-3"]},{"id":"R-sentinel","area":"wave","statement":"SENTINEL = absence-of-DATA, protocol-decidable; the concrete sentinel value is per-language (TS undefined/Rust None/Py sentinel)","rationale":"","status":"active","since":"D16","covers_by":[]},{"id":"R-push-subscribe","area":"wave","statement":"push-on-subscribe: in the SENTINEL state push [START]; in the dirty state push [START,DIRTY]; cached DATA is pushed to the new subscriber. START is the handshake — the first message any sink receives on a subscription, emitted before any other downstream delivery, not forwarded through intermediate nodes. EXCEPTION (R-pull / D55): a pull-mode node while QUIET pushes [START] ONLY — its cached value is NOT pushed on subscribe (it stays silent until demanded).","rationale":"","status":"active","since":"D9,D55","covers_by":[]},{"id":"R-terminal","area":"wave","statement":"terminal-is-forever by default; resubscribable opt-in triggers a fresh-lifecycle reset. A late subscribe to a non-resubscribable terminal node is REJECTED (idiomatic error); to a resubscribable terminal node it resets the lifecycle (clears terminal/has-fired-once/DepRecords, drains pause lockset, re-arms first-run gate) before installing the sink. TEARDOWN does not block reset","rationale":"D17; resubscribable IS the property gating late-subscribe re-activation","status":"active","since":"D17","covers_by":[]},{"id":"R-deps-terminal","area":"wave","statement":"completeWhenDepsComplete (default true): node auto-emits COMPLETE when ALL deps are TERMINAL — each dep has reached COMPLETE *or* an ABSORBED ERROR (errorWhenDepsError:false); an absorbed-error dep COUNTS as terminal-done (it is settled — no more input can arrive), it does NOT block completion (B42). Completion is 'all deps TERMINAL', NOT 'all deps Complete' and NOT 'ANY' (combineLatest semantics — fires once all sources settle). errorWhenDepsError (default true): node auto-emits ERROR when any dep errors (this auto-ERROR fires BEFORE the complete-check, so an error-terminal dep only reaches the completion logic when errorWhenDepsError:false has absorbed it). Terminal-emission operators (last/reduce) set completeWhenDepsComplete:false; rescue/catch operators set errorWhenDepsError:false and read ctx.depRecords[i].terminal explicitly. SCOPE: a dep TERMINAL = COMPLETE | ERROR; TEARDOWN is a destroy-cascade (tears the node down, not a settle) and does NOT count (B33-adjacent, out of scope). IMPL (TWO parts): (1) _allDepsComplete counts a TERMINAL dep as done — block only on a LIVE dep (TS `dep_terminal === undefined` blocks; NOT `!== true/Complete`), Rust all_deps_complete mirrors. (2) BOTH the COMPLETE receive-arm AND the absorbed-ERROR receive-arm (errorWhenDepsError:false) must check `completeWhenDepsComplete && all-deps-terminal -> COMPLETE`: the COMPLETE arm already does, but the ERROR-absorbed arm currently routes straight to _settleAfterAbsorbedTerminal/_maybeRun WITHOUT the check, so an absorbed-error dep terminating LAST would not fire the cascade — it must MIRROR the COMPLETE arm's check (Rust receive_from_dep ERROR arm same). Order-independent: whichever terminal lands last triggers the auto-COMPLETE.","rationale":"effect/derived completion is the join of all deps reaching a terminal state — once every dep is terminal (Complete or absorbed-Error) no more input can arrive, so the node MUST settle (COMPLETE); rescue needs explicit terminal handling. B42 fix: the prior 'all deps Complete' (TS _allDepsComplete `tm!==true`, Rust all_deps_complete) wedged a node whose errorWhenDepsError:false dep ERRORed (terminal=payload≠Complete) — it never auto-completed even after all OTHER deps completed. Counting an absorbed-error dep as terminal-done fixes the wedge AND lets a rescue/catch operator with completeWhenDepsComplete:true auto-COMPLETE after recovery (RxJS catchError(()=>of(x)) parity). NOT hit by the landed catalog (rescue/race/sample use completeWhenDepsComplete:false so the auto-cascade is skipped → zero behavior change; a dep error on a default errorWhenDepsError:true node auto-ERRORs before the complete-check) — a pure latent-wedge fix. FLIPPED ACTIVE 2026-05-30 on the TS-arm-green (C-17 a/b/c ts:pass) + formal (wave_deps_complete.tla TLC-green + mutation-verified) precedent, like R-terminal-settles-dirty/R-rewire; rust+py arms (C-17 rust/py) follow in CSP-6/7.","status":"active","since":"D30","covers_by":["C-17"]},{"id":"R-ctx-up","area":"protocol","statement":"ctx.up is control-tier only (DIRTY/PAUSE/RESUME/INVALIDATE/TEARDOWN); DATA/RESOLVED/COMPLETE/ERROR are down-only","rationale":"directional semantics; added in DR-5","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-node-thin","area":"node","statement":"node = thinnest primitive: holds fn handle + deps + wave state machine (dep_records, dirty_mask, pending_count, cache, status, subscribers, pause_lockset); ZERO inspection cruft. Bare node() works at the substrate level but loses naming/find/describe — those are graph-layer","rationale":"D5 Node↔Graph responsibility split; thin node ports cleanly to Rust","status":"draft","since":"D5","covers_by":[]},{"id":"R-node-iface","area":"node","statement":"node exposes: cache (readonly getter, never throws, never triggers computation), status, down(msgs), up(msgs) (restricted to control tier per R-ctx-up), subscribe(sink)→unsubscribe. cache replaces the old get()","rationale":"D5 minimal node surface; D8 up/down boundary","status":"draft","since":"D5,D8","covers_by":[]},{"id":"R-status-enum","area":"node","statement":"status ∈ {sentinel, pending, dirty, settled, resolved, completed, errored}; status is the source of truth for cache freshness (dirty → stale prior value, settled/resolved → fresh, completed/errored → final). cache never throws, never computes","rationale":"D5 inspection reads status not raw cache","status":"draft","since":"D5","covers_by":[]},{"id":"R-rom-ram","area":"node","statement":"state node (no deps) retains cache across disconnect — value is intrinsic/non-volatile (ROM). Compute node (deps and/or fn) clears cache on deactivation → status sentinel (RAM); reconnect re-runs fn from scratch with cleared DepRecords","rationale":"D5; compute value is a function of live subscriptions","status":"draft","since":"D5","covers_by":[]},{"id":"R-fn-contract","area":"node","statement":"node fn = (ctx)=>void; ctx = {up(msgs), down(msgs), waveData, terminal, state, onDeactivation, onInvalidate}. `ctx.waveData` is the ONLY raw ctx dep-value input surface (R-ctx-wave-data): a two-dimensional structure indexed as dep -> waves -> per-wave value/dirty-clear projection. `ctx.terminal[i]` is separate terminal metadata for the same invocation, NOT a value source: false = dep i did not deliver COMPLETE/ERROR, true = dep i delivered COMPLETE, any non-boolean non-SENTINEL ERROR payload = dep i delivered ERROR with that payload. R-data-payload rejects boolean ERROR payloads, so the false/true shorthand cannot collide with legal ERROR payloads. No stored `latest`, `prevData`, `latestData`, or parallel dep-value alias exists on raw ctx; any current/latest/read helper is derived from waveData plus node-owned cache/state outside the raw ctx value contract, never a second source of truth. NO return-value framing — all emission is explicit via ctx.down. Sugar (derived/effect/operator) value-level fn is wrapped to a ctx-fn in the graph layer at register time; node/producer are ctx-level (intentional tier power surface, DR-1)","rationale":"D8 ctx.up/down; D27 sugar→ctx-fn conversion strictly in graph layer feeds behavioral parity; D77 removes the ambiguous raw ctx `latest`/`prevData` aliases and pins waveData as the single canonical per-wave dep value input while keeping terminal metadata separate; D78 narrows ERROR payloads so the lightweight false/true/error-payload terminal metadata shape remains collision-free.","status":"draft","since":"D8,D27,D77,D78","covers_by":["C-23"]},{"id":"R-ctx-wave-data","area":"node","statement":"ctx.waveData is indexed by declared dep position. `waveData[i]` is a list of wave projections delivered by dep i to THIS fn invocation; each inner projection corresponds to exactly one upstream msgs array / wave (D8). An empty outer list `waveData[i] = []` means dep i delivered NO wave to this invocation. An inner empty list represents a RESOLVED-only wave: `waveData[i] = [[]]` means one RESOLVED wave. DATA payloads are stored directly in the inner list, in order: upstream `[[DATA,1],[DATA,2],[INVALIDATE]]` projects as `[[1,2,SENTINEL]]` for that dep. INVALIDATE is represented inside the inner list by the protocol SENTINEL marker (TS `undefined`, Rust/Py sentinel equivalent); DATA(SENTINEL) is already illegal by R-data-payload, so this marker cannot collide with a legal DATA payload. DATA null remains legal and projects as `[[null]]`; DATA with empty-array payload projects as `[[[]]]`; two waves DATA null then DATA [] project as `[[null],[[]]]`. RESOLVED never appears as a DATA payload and, by R-resolved-undirty, is not mixed with DATA in the same inner wave. COMPLETE/ERROR terminal information is NOT written into waveData because it is not value data; use ctx.terminal[i] (R-fn-contract) to distinguish false/no terminal, true/COMPLETE, or a legal non-boolean ERROR payload while a dirty contribution is being cleared. Implementations may store caches or dep bookkeeping internally, but raw ctx must expose exactly one dep-value input structure: waveData. Any ergonomic read/track/current helper MUST be a pure derivation from waveData plus the implementation-owned dep cache; it MUST NOT add a second raw ctx field that can drift from waveData.","rationale":"D77. The raw fn input must preserve the distinctions the protocol needs: no wave this invocation vs RESOLVED/no-occurrence vs INVALIDATE/SENTINEL-clearing vs DATA with any legal payload including null or an empty array. A single two-dimensional waveData structure avoids `latest`/`prevData` ambiguity and keeps occurrence information intact under D49; terminal is separate metadata, not a value alias. D78 keeps the false/true/error-payload terminal shape collision-free by excluding boolean ERROR payloads.","status":"draft","since":"D77,D78","covers_by":["C-23"]},{"id":"R-cleanup-hooks","area":"node","statement":"two cleanup hooks: ctx.onDeactivation(fn) (release external resources on deactivation) + ctx.onInvalidate(fn) (flush on INVALIDATE). onRerun (0 callsites) and onResubscribableReset (1 callsite → absorbed by ctx.state lifecycle) are cut. fn return value is freed for sugar mapping. PER-RUN LIFECYCLE (D28 clarification): both hook lists are CLEARED before each fn invocation and re-registered by the fn body — only the LATEST run's registrations are live (React effect-cleanup model). A re-run SUPERSEDES the prior run's hooks; superseded registrations are DISCARDED WITHOUT firing (consistent with the cut onRerun — there is no fire-on-rerun hook). So after K fn runs, an INVALIDATE fires onInvalidate exactly once (the current run's), and deactivation fires onDeactivation exactly once (NOT K times). Contract: a fn must (re-)register its cleanup on EVERY run that needs it (a registration guarded to a single run is dropped on the next run). A single-run node keeps its single registration (no re-run = no clear). deactivate() fires the live onDeactivation hooks then clears both lists.","rationale":"D28; internal state reset belongs to ctx.state lifecycle, cleanup hooks only manage external resources + INVALIDATE. Per-run clear (D28 clarification) fixes the push-only accumulation bug surfaced by the CSP-5 Rust /qa (finding E, parity-consistent in both arms): re-registering each run grew the hook list unbounded and fired K stale hooks on the K-th INVALIDATE. Uniform clear-and-re-register for BOTH hooks (user-approved 2026-05-29); discard-without-firing keeps D28's onRerun-cut (fire-on-rerun would resurrect it).","status":"active","since":"D28","covers_by":["C-14"]},{"id":"R-ctx-state","area":"node","statement":"ctx.state = per-node private cross-wave state (implicit OK — node-private, not shared). Default fresh-lifecycle wipe; ctx.state.persist(on?) keeps across lifecycle. Shared/observable state must be an explicit node + dep (not ctx.state). INVALIDATE is lifecycle-continue (not fresh-lifecycle) so it does NOT wipe ctx.state — manual flush via onInvalidate","rationale":"D23 private state OK, shared memory explicit; D29 fresh-lifecycle wipe + persist","status":"active","since":"D23,D29","covers_by":["C-3"]},{"id":"R-first-run-gate","area":"node","statement":"compute fn first-fires only after every declared dep has settled (delivered ≥1 real DATA this or a prior wave) under partial:false — producing one combined initial wave. partial:true turns the gate OFF (fn fires as soon as dirty-dep-count hits 0; fn body MUST guard SENTINEL per dep). terminalAsRealInput:true also lets a dep terminal settle the gate (Reduce-class). The gate is first-run-only (has-called-fn-once); INVALIDATE does not re-arm it; a resubscribable terminal reset does","rationale":"clean multi-dep activation handshake without phantom partial waves","status":"active","since":"D9,D17","covers_by":[]},{"id":"R-initial","area":"node","statement":"initial (non-SENTINEL): pre-populates cache and a source pushes [DATA,initial] on subscribe; first emit runs equals against initial. Absent/undefined initial → cache holds SENTINEL, no push-on-subscribe, first emit is always DATA. INVALIDATE and resetOnTeardown return cache to SENTINEL","rationale":"D16 sentinel semantics; initial is T|null never T|undefined","status":"draft","since":"D16","covers_by":[]},{"id":"R-dynamic-node","area":"node","statement":"dynamicNode = node construction variant (NOT a verb): declares a superset of all possible deps at construction, fn reads a subset per invocation via track(dep). All declared deps participate in wave tracking; an unread dep's update fires the fn (a ctx-fn with explicit ctx.down). The fn DECIDES whether to propagate: it inspects which deps delivered waves via ctx.waveData[i] (R-ctx-wave-data) and either re-emits via ctx.down (DATA) OR early-returns to stay QUIET, in which case the substrate synthesizes ONE undirty RESOLVED (D49: RESOLVED = UNDIRTY) that clears the downstream dirty WITHOUT a redundant DATA (D53). The suppress-vs-propagate decision on an unread-dep change is use-case-dependent, so it belongs to the fn (D53), NOT an automatic substrate read-mask (REJECTED D53 -- it would hard-code one policy and be the lone exception to D49's opt-in-dedup-everywhere). A downstream distinctUntilChanged remains an alternative for value-based dedup. track() is a pure per-invocation value-reader derived from ctx.waveData plus the implementation-owned dep cache; it is NOT a stored raw ctx `latest` field. Same first-run gate as static nodes. Intra-graph only — cross-graph deps go through the wire bridge (no inter-graph dynamicNode)","rationale":"D35 distinct from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds tracked deps to one causal domain; D77 replaces depRecords.latest/batch wording with the single raw ctx waveData contract","status":"draft","since":"D35,D77","covers_by":["C-23"]},{"id":"R-pause-lockset","area":"control","statement":"PAUSE/RESUME carry a lock_id; lockset semantics: a true resume occurs only when every lock has RESUMEd; same-id is idempotent; RESUME of an unknown lock is a no-op (D59) The routing of a RESUME for a lock NOT held HERE is governed by R-up-routing -- it FORWARDS up the declared cone to find the holder (release-if-held-else-forward-up) rather than a flat no-op; a lock no node up the cone holds drops at the depless-source terminus (net no-op). The held-release/idempotent/every-lock-resumed lockset semantics above are unchanged.","rationale":"","status":"active","since":"D10,D59","covers_by":["C-5"]},{"id":"R-pause-modes","area":"control","statement":"pausable {true | 'resumeAll' | false}. true (default): skip fn while any lock held, fire fn once on final-lock RESUME with latest dep values; a leaf source's (depless) own external down() -- sync OR async (timer tick / promise resolve / state.set) -- is NOT gated in default mode (delivered immediately). 'resumeAll': buffer the node's own tier-3/4 settle slice while paused (incl a leaf source's own sync/async down()), replay per-entry in arrival order on final-lock RESUME against a pre-pause baseline (equals references the conceptual-timeline cache); tier-5/6 bypass the buffer. false: ignore PAUSE/RESUME ENTIRELY (timer sources that must keep producing) -- the lockset is never consulted, neither dep-driven recompute nor any (sync/async) own production is gated or buffered. pausable mode is the OUTER gate over R-async-paused (D44): an async-pool late emit buffers ONLY when pausable in {true,'resumeAll'} AND (for true) the node is a COMPUTE node (deps>0); a depless async leaf source delivers immediately in true mode (leaf-vs-compute discriminator = deps.length===0). The ORTHOGONAL pull axis (NodeOptions.pull:true, R-pull / D55) sits ON TOP of pausable mode: a pull node is quiet-by-default (self-holds a per-node demand lock) and RE-QUIETS after each demand pulse; while quiet it suppresses the downstream DIRTY relay + push-on-subscribe; the pausable mode then determines the DEMAND DELIVERY CONTENT (true → coalesced latest; 'resumeAll' → buffered backlog drained). pull+pausable:false is REJECTED (pull needs RESUME as the demand signal).","rationale":"PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job. D44 pins the precedence over R-async-paused -- production is gated only by resumeAll, never by true/false (formal wave_async_paused.tla: ShouldBuffer + NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified). D55 adds the orthogonal pull axis (delivery-content = mode).","status":"active","since":"D10,D44,D55","covers_by":["C-5","C-9","C-10","C-16"]},{"id":"R-async-paused","area":"control","statement":"an async result arriving at a paused node buffers and replays on final-lock RESUME -- BUT this is GATED by pausable mode (D44), not unconditional: it applies only when pausable in {true,'resumeAll'} and, in true mode, only to a COMPUTE node (deps>0). A pausable:false node never buffers (ignores PAUSE, keeps producing); a true-mode depless leaf source delivers its own async production immediately (R-pause-modes). The buffered result enters the node-level pause_lockset-scoped buffer (lock_id scope = node-level pause_lockset).","rationale":"DR-3; D44 conditions the buffering on pausable mode + node kind -- the C-2 node is an async COMPUTE node (deps>0), which is why it buffers; pausable:false (B20) and the async leaf source (B20's twin) are the cases the unconditional reading got wrong.","status":"active","since":"DR-3,D44","covers_by":["C-2","C-9","C-10"]},{"id":"R-teardown-complete","area":"control","statement":"a [[TEARDOWN]] arriving at a non-terminal node synthesizes a [COMPLETE] prefix in the same wave ([[COMPLETE],[TEARDOWN]]) so bridge subscribers resolve before unwiring. Idempotent (subsequent TEARDOWN arrives alone); skipped when the wave already carries COMPLETE/ERROR","rationale":"clean complete-then-teardown lifecycle pair; firstValueFrom-style bridges need the COMPLETE","status":"draft","since":"D9","covers_by":[]},{"id":"R-replay-buffer","area":"control","statement":"replayBuffer:N → node keeps a circular buffer of the last N outgoing DATA values; a late subscriber receives buffered DATA after the START handshake and before live updates","rationale":"replaces the replay() operator + subscribe-hook monkeypatching","status":"draft","since":"D9","covers_by":[]},{"id":"R-restore","area":"lifecycle","statement":"restore/hydration is a graph lifecycle operation, NOT a fresh-lifecycle transition and NOT a sync-core I/O operation. Async loading, decoding, storage reads, and WAL/diff materialization happen outside the sync wave core; the resolved checkpoint commits at a graph boundary as one bootstrap/batch restore transaction. Restore restores the checkpointed graph state: all serialized ctx.state (including non-persist state), caches/value absence, terminal/lifecycle state when represented, and topology/factory bindings. It MUST NOT wipe ctx.state, reset restored caches to SENTINEL, re-arm first-run as if never run, fire fresh-lifecycle cleanup hooks merely because a checkpoint was restored, or mutate a live graph invisibly behind subscribers. After ready/commit, restored cached values participate in normal push-on-subscribe. Incremental restore/diff replay, when supported, applies changes through the normal graph boundary/wave machinery rather than direct hidden state mutation. A restore with a missing or local-only factory reference fails honestly; it does not synthesize placeholder function bodies.","rationale":"D83 closes DS-1 Flag 1: restore is state-preserving, while wipe occurs only on an actual fresh-lifecycle reset (R-terminal resubscribable reset / deactivation lifecycle). D57 keeps hydration's async work outside F-SYNC-CORE, and D82 keeps storage/WAL/envelope APIs in the binding layer. The protocol obligation is the observable lifecycle: a restored graph resumes from the checkpointed graph state and any live/diff observers see restore effects only through graph-boundary ordering, not hidden mutation.","status":"draft","since":"DR-5,D57,D82,D83","covers_by":["C-24"]},{"id":"R-snapshot","area":"lifecycle","statement":"snapshot/checkpoint captures the graph's live inspectable topology (the same current/live dep + mount path truth source as R-describe/R-edges-derived), each restorable node's factory reference/name, cache/value state including SENTINEL absence, terminal/lifecycle state when represented, and ALL node-private ctx.state regardless of ctx.state.persist flags. Function bodies are never serialized; restore re-resolves nodes by factory reference through the dispatcher/graph factory registry. Anonymous inline or unregistered functions are marked local-only and cannot restore cross-process; missing factory refs fail restore honestly. Snapshot records may carry incremental changeset/diff intent, but storage tiers, WAL frame shape, codecs, content addressing, and durability policy are presentation/binding-layer concerns, not substrate rules.","rationale":"D25 pins factory-name refs because fn bodies cannot serialize; D51/R-describe pins live topology as the truthful graph snapshot source after rewire; D83 adds the explicit ctx.state/cache/lifecycle payload and local-only failure contract. D82 deliberately keeps storage substrate and WAL/diff codecs separate from graph restore semantics.","status":"draft","since":"D25,D51,D82,D83","covers_by":["C-24"]},{"id":"R-graph-role","area":"graph","statement":"Graph = convenience + inspection entry: register/name/find/describe/observe/profile/snapshot/mount/batch/operators. g.* sugar desugars to dispatcher.register + Node + auto-registers into the graph inspection index. Graph is optional convenience, not a mandatory container; multi-graph is natural","rationale":"D5 Graph holds all convenience+inspection; D3 graph-first mental anchor","status":"draft","since":"D5","covers_by":[]},{"id":"R-edges-derived","area":"graph","statement":"edges are derived on-demand from each node's CURRENT/LIVE deps (the node's live _deps, RE-READ at describe() call time — NOT a construction-time snapshot, so a rewire C-8/C-11 is reflected; D51) + the mount hierarchy; there is no stored edge registry and no connect/disconnect. Every edge shown in describe has a real protocol subscription behind it — decorative edges are not representable (the live-deps reading is what KEEPS this true post-rewire: a construction-time edge would be decorative after removeDep). A live dep absent from the graph inspection index (a runtime *Map inner / bare graph-less node) is auto-discovered as a snapshot node, factory from its NodeOptions.factory (R-describe); auto-discovery follows transitive live reachability through unregistered deps, so an auto-discovered inner's own current deps are also emitted as nodes+edges when reachable.","rationale":"D3 topology is a pure function of (nodes, CURRENT deps, mounts); D51 — 'construction-time deps' self-contradicted 'every edge has a real subscription' once rewire (D42/D47) made topology dynamic (a removeDep'd construction edge is decorative after removeDep). Live-deps reading restores truthfulness + realizes D47/C-11 'describe shows currently-live inners'. B38 resolves the D51 follow-up by treating auto-discovery as a live-reachability walk rather than a one-level leaf capture, preserving edge truthfulness for composed graph-less inners.","status":"draft","since":"D3,D51","covers_by":[]},{"id":"R-rewire","area":"graph","statement":"setDeps/addDep/removeDep = runtime topology rewire, INTRA-graph only (D22 single causal domain; no inter-graph form — cross-graph wiring is only via the wire bridge). Surgical/Option-C: a dep in both old and new sets is left untouched (subscription + DepRecord survive); only removed deps unsubscribe + discard their DepRecord, only added deps fresh-subscribe; DepRecord-ref dispatch lets kept deps reorder freely. Across a rewire: the first-run gate (_hasCalledFnOnce) is PRESERVED, never re-armed (re-arming would re-gate unchanged deps); an added dep enters prevData=SENTINEL and the fn guards via prevData===SENTINEL; the activated compute-node cache is PRESERVED (R-rom-ram); pause lockset + buffer PRESERVED. An added dep with a cached DATA pushes [DIRTY,DATA] on subscribe (R-push-subscribe); a SENTINEL dep delivers START only. removeDep clears the removed dep's dirty contribution; if it was the sole dirty contributor and the node was dirty, the wave auto-settles. A removed dep's queued messages (DIRTY/DATA/INVALIDATE) are DRAINED — nothing strands downstream. Rejects: self-dependency; a cycle (DFS O(V+E)); a terminal this (completed/errored) for IMMEDIATE/external rewire; adding a non-resubscribable terminal dep (would wedge — resubscribable terminal deps are allowed). Deferred self-rewire queued before terminal is the D62 exception: R-rewire-deferred may apply addDep/removeDep/setDeps after the owner becomes terminal, while terminal remains an output guard. removeDep to zero deps is allowed (degenerate fn-no-deps; cache preserved; no auto-deactivate). Mid-wave rewire (between dep deliveries) is allowed; mid-fn rewire (while the node's fn is executing, _insideRunWave) and reentrant rewire (another setDeps/addDep/removeDep in flight) are REJECTED — a fn mutating its own topology mid-wave is the synchronous feedback-cycle ERROR (D37/R-reentrancy). Topology change does not bump a version counter (topology ≠ DATA). Every rewire API requires an explicit fn (fn-deps pairing: user fns read data[i]/prevData[i] positionally, so a dep-shape change must re-declare the fn). A SELF-triggered mutation (a fn changing its OWN deps in response to its own data) must use the deferred ctx.rewireNext path (R-rewire-deferred / D47), NOT an immediate in-fn call.","rationale":"D42 ratifies the TLA+-verified (port-model wave_protocol_rewire, 126k states) rewire design Q1–Q7 for the clean-slate substrate; D22 bounds it to one causal domain; the mid-fn reject is floor-mandated by D37/R-reentrancy; surgical/Option-C + required-fn come from the Phase 13.8 design iteration. D62 narrows the terminal-this reject to immediate/external rewire only: queued self-rewire drains after terminal, with terminal sealing output rather than freezing topology. Per D42 SD-2, the cross-axis formal coverage is COMPLETE (wave_rewire.tla INVALIDATE+terminal + wave_rewire_emit.tla equals+multi-sink, all TLC-green + mutation-verified) and the TS C-8 arm is green; flipped ACTIVE 2026-05-28 on the TS-arm-green+formal precedent (R-reentrancy/R-up-at-source/R-dirty-before-data), rust/py conformance arms tracked separately in C-8 runtimes","status":"active","since":"D22,D42","covers_by":["C-8"]},{"id":"R-mount","area":"graph","statement":"graph.mount(subgraph,{at}) embeds a child graph addressable under the parent namespace (:: delimited paths); lifecycle signals propagate parent→mounted children; mount has no deps (exempt from deps-first ordering)","rationale":"D4 mount verb; L4-Q4 mount exemption","status":"draft","since":"D4","covers_by":[]},{"id":"R-describe","area":"graph","statement":"describe(opts?) = static, JSON-serializable structure snapshot: {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}. DNode = {id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (operator real name per D6/L1.5, not 'derived'), status (R-status-enum), value? (field ABSENT = SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}. edges are derived from each node's CURRENT/LIVE deps + the mount hierarchy (R-edges-derived / D51) — re-read at call time, so a rewire (C-8 immediate / C-11 *Map deferred) is reflected (the snapshot is point-in-time live, NOT a construction snapshot). A live dep absent from the graph index (a runtime *Map inner / bare graph-less node) is AUTO-DISCOVERED as a snapshot node: synthesized stable id, status/value from the node getters, factory from its OWN NodeOptions.factory (the field D43 reserved for standalone graph-less operators, set by the free initNode) else '?'; auto-discovered inners are NOT persistently registered in the graph index (best-effort live capture, no register/unregister churn — D51 chose B2 over a persistent registry). Auto-discovery is a transitive live-reachability walk: after the registered-node pass, every discovered unregistered node is recursively expanded through its own CURRENT/LIVE deps, emitting reachable unregistered nodes+edges with stable synthesized ids; cycles are represented by edges but each discovered node is emitted once per snapshot. value carries the cache snapshot at call time; fn bodies are never serialized (factory-name ref only, D25). describe({explain:{from,to}}) = causal-chain subset (same shape, filtered to the from→to chain). Renderers (pretty/mermaid/d2) are pure functions over the snapshot — NOT methods and NOT a describe({format}) option; there is no graph.explain(). Live-topology streaming (rewire deltas) is an observe topology-event, deferred to CSP-2 viz","rationale":"D3 describe first-class; D39 pins the field set; L4-Q8 renderers pure fns; D25 snapshot same source; per-language (D24, never in parity — documented contract, not conformance-tested); D51 — the snapshot reflects LIVE deps (truthful post-rewire) + auto-discovers unregistered inners (factory via the D43-reserved NodeOptions.factory); B38 closes the D51 transitive-discovery follow-up by making auto-discovery a live-reachability walk rather than a one-level leaf capture; live-topology STREAMING (deltas) stays deferred to viz (a point-in-time read is not streaming)","status":"draft","since":"D3,D39,D51","covers_by":[]},{"id":"R-observe","area":"graph","statement":"observe(path?) = read-only live message tap returning a subscribable EGRESS ({subscribe(sink)→unsubscribe}) — NOT a graph node (no self-observation island). observe is a REAL (lazily-activating) subscriber: it uses subscribe internally, so observing a COLD node activates it + its upstream (running their fns), and observing a cached node receives the [DATA,cached] push (R-push-subscribe). 'Read-only' (D19) means observe never EMITS or MUTATES node state — it does NOT mean activation-free; observing a cold graph activates it. Each stream item is an enveloped ObserveEvent = {path, msg (the Message), tier (messageTier), seq (graph-local monotonic clock, D26)}; the envelope carries node identity so single-node / subtree / whole-graph observe share ONE shape. Upstream control is a separate Graph affordance: single-node up(msgs) / all-nodes up(path,msgs) (e.g. PAUSE); a node guard denying an upstream message drops it silently (R-up-at-source)","rationale":"D5 Graph IS the introspection layer; D39 pins the ObserveEvent envelope + read-only egress (not a node); D19 inspection read-only; per-language (D24, never in parity)","status":"draft","since":"D5,D39","covers_by":[]},{"id":"R-inspection-set","area":"graph","statement":"inspection surface = describe (incl explain mode) + observe + profile — 3 first-class methods on Graph; no separate Inspector object","rationale":"L4-Q8 inspection consolidation","status":"draft","since":"D5","covers_by":[]},{"id":"R-meta-presentation","area":"graph","statement":"meta companion stores are presentation/graph-layer, NOT substrate. Static annotations (description/type/range/format/access/tags/unit) → describe metadata attached via g.node opts. Reactive annotations (a status/error that changes over time) → explicit nodes + dep (R-ctx-state / D23). The substrate node carries zero meta machinery. meta.owner ABAC is presentation/multi-agent, out of substrate scope","rationale":"D36; D5 node=thinnest, meta is annotation feeding describe (graph owns inspection)","status":"draft","since":"D36","covers_by":[]},{"id":"R-graph-lifecycle","area":"graph","statement":"graph.signal(msgs) broadcasts a message to all registered nodes (e.g. [[PAUSE,lockId]] or [[INVALIDATE]]); graph.destroy() broadcasts [[TEARDOWN]]. graph.set(name,v) = node.down([[DATA,v]]) sugar; graph.get(name) = cache read","rationale":"D5 graph convenience; L4-Q1 state.set = node.down sugar","status":"draft","since":"D5","covers_by":[]},{"id":"R-clock","area":"runtime","statement":"monotonic time = a graph-local counter (causal-domain ordering, folded into the graph); wall-clock = a system call; there is NO global clock singleton","rationale":"D26 / L3-Q9 config dissolution; graph = single-thread concurrency domain so ordering is domain-local (refined 2026-05-31 with D22 option-A; was 'causal domain', see R-graph-domain)","status":"draft","since":"D26","covers_by":[]},{"id":"R-dispatch-all","area":"runtime","statement":"all fn go through the dispatcher / FactoryRegistry; node((ctx)=>...) also runs through the LocalSync pool. There is no inline-fn-bypasses-dispatcher path","rationale":"F-DISPATCH-ALL; sacred L0.7 (all fn through dispatcher)","status":"draft","since":"D21","covers_by":[]},{"id":"R-sync-core","area":"runtime","statement":"dispatcher.invoke is sync void — wave-state mutation always serializes onto the graph's single thread; async/remote execution returns via a pool callback. 1.0 pools = LocalSync + LocalAsync; dispatcher keeps a pluggable pool trait for WorkerPool/RemotePool","rationale":"F-SYNC-CORE; D20 pool set; sacred L0.7 (wave protocol impl is sync)","status":"draft","since":"D20,D21","covers_by":[]},{"id":"R-handle","area":"runtime","statement":"handle = pure data (pool_id, handle_id), NO methods — serializable/snapshottable/wire-transferable; it is a dispatcher-table index. node ≠ handle (node has up/down methods at the external-world boundary)","rationale":"D7 handle is pure data","status":"draft","since":"D7","covers_by":[]},{"id":"R-graph-domain","area":"runtime","statement":"graph = single-thread CONCURRENCY domain (the unit of concurrency, NOT the bound of causal influence). In-domain propagation is ONE synchronous causal wave: same-tick, glitch-free, diamonds RESOLVED-merged so a fan-in sees one consistent version of its source. Causal influence is NOT bounded by the graph — it CROSSES domains via the async wire bridge as DELAYED CONSISTENCY (a value produced in wave N is consumed one tick later in the peer domain; the two-phase wire gate preserves cross-domain consistency — wave_xgraph.tla L2.F). Compute parallelism is via pool callback (results serialize back to the domain's thread); true parallelism is via multiple graphs + wire bridge. Disjoint waves in the same graph do not parallelize (one concurrency domain = one dispatcher).","rationale":"D22 wave protocol is lock-free because the graph boundary is the CONCURRENCY boundary. Wording refined 2026-05-31 (D22 option-A in-place edit; SESSION-reactive-linear-and-git M4): 'causal domain = concurrency domain' conflated two things — causal influence spans the wire bridge, so the graph bounds the concurrency unit, not the causal range; cross-domain causal propagation is delayed-consistency (wave_xgraph.tla L2.F two-phase gate). Behavior unchanged (C-1/C-4 unaffected).","status":"active","since":"D22","covers_by":["C-1","C-4"]},{"id":"R-no-polling","area":"principle","statement":"state changes propagate reactively via messages; never poll a node's value on a timer or busy-wait for status; periodic behavior is a reactive timer source emitting through the graph","rationale":"spec §5.8 durable value","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-imperative","area":"principle","statement":"no imperative side-channel triggers (event emitters, callbacks, setTimeout+set) to drive graph behavior; all coordination uses ctx.up signals + message flow through topology; remove imperative paths when no caller depends on them","rationale":"spec §5.9 durable value (feedback_no_imperative)","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-raw-async","area":"principle","statement":"no bare async primitives in the reactive layer (TS: Promise/queueMicrotask/setTimeout/process.nextTick; PY: asyncio.create_task/threading.Timer/raw coroutines). Async boundaries live only in sources (fromPromise/fromAsyncIter) and the pool/runner layer","rationale":"spec §5.10; F-SYNC-CORE async only at pool/wire boundary","status":"draft","since":"D20","covers_by":[]},{"id":"R-data-not-peek","area":"principle","statement":"all data propagation — including initial values at connection time — flows through messages [[DATA,v]]; nodes do not peek a dep's .cache to seed computation; .cache is a read-only accessor for external consumers","rationale":"spec §5.12 single mental model: if data moved, a message carried it","status":"draft","since":"D3","covers_by":[]},{"id":"R-primary-api-clean","area":"principle","statement":"protocol internals (DIRTY/RESOLVED/bitmask) never surface in the value-level primary API (derived/effect/operator); ctx-level primitives (node/producer) intentionally expose tier as a power surface (DR-1 §5.11 amend). A developer using value-level sugar never reads the spec to start","rationale":"DR-1 ctx-level is a deliberate protocol-facing power surface; value-level is §5.11-compliant primary","status":"draft","since":"DR-1","covers_by":[]},{"id":"R-reentrancy","area":"wave","statement":"a synchronous feedback cycle — a node fn that, during its invocation, transitively re-drives one of its own (direct or indirect) deps so the same node's fn would re-enter before its wave completes — is a wave-level protocol ERROR. Detection is node-local and free: a node refuses to enter its fn-run while its own in-wave flag (_insideRunWave) is already set, and throws; the graph layer catches the throw and converts it to [[ERROR, e]] down (D30 — value-level throw → graph-layer ERROR), located at a node ON the cycle (the value-level catch nearest the throw on the synchronous unwind — implementation-determined, NOT necessarily the re-entered node), aborting the wave. The core neither queues nor bounds-then-runs the cycle (reject, not iterate). Legitimate accumulation uses per-node ctx.state (e.g. scan): not a topological cycle, never re-enters. Async feedback that crosses a turn boundary via an async pool is out of scope — it is not synchronous re-entry and does not desync the wave. No numeric rerun-depth cap is needed (precise in-wave flag detection supersedes the blunt maxFnRerunDepth)","rationale":"D37; surfaced by CSP-1 /qa (backlog B10); reject (B) over queue-to-wave-end (A) because A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; detection reuses the existing _insideRunWave flag, dispatcher stays a pure funnel (F-DISPATCH-ALL), error ownership graph-level (D30)","status":"active","since":"D37","covers_by":["C-6"]},{"id":"R-up-at-source","area":"protocol","statement":"a depless source is the terminus of upstream control forwarding (R-ctx-up). It self-ACTS only on a message with a coherent round-trip action: INVALIDATE → HONOR the invalidate-request (clear cache to SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never arrives). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediate nodes never self-act on upstream control — they forward toward deps only; the source is the single actor and the down-cascade is the effect (D59/R-up-routing) A forwarded RESUME (a routed pull DEMAND, R-pull) whose pullId this depless source does NOT hold -> DROP at the terminus, like DIRTY; a source that DOES hold the pullId (a pull source) releases its quiet lock and FIRES one delivery (R-pull). Dep-bearing intermediates forward an unheld RESUME up toward deps (release-if-held-else-forward-up), never self-acting.","rationale":"D38; B11; R-ctx-up/DR-5 lists INVALIDATE up-allowed and the only self-consistent reason is terminus honoring (DS-1 L1.11 'invalidate-request'); INVALIDATE-up is a cache-drop request not an imperative write, so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN lack a coherent terminus action","status":"active","since":"D38,D59","covers_by":["C-7","C-16"]},{"id":"R-profile","area":"graph","statement":"profile(opts?) = opt-in accumulated-counter snapshot: {waves; nodes:Record<path, NodeProfile>}, NodeProfile = {invokes, emits, resolved, errored, lastDurationNs?, totalDurationNs?}. Counters are backed by an opt-in dispatcher/graph-level recorder (DS-1 inspectorEnabled / globalInspector→dispatcher hook), NEVER stored on the thin node (R-node-thin); the dispatcher is the invoke funnel (F-DISPATCH-ALL) so it is the natural source of invoke counts + fn duration. Default OFF = zero runtime overhead (F-PERF). profile is a point-in-time snapshot (like describe); a streaming profile is an observe-aggregation, not a new mechanism. Shares the mount-aware :: path key with describe/observe","rationale":"D39; L4-Q8 third inspection method; R-node-thin keeps counters off the node; F-DISPATCH-ALL dispatcher sees every invoke; F-PERF opt-in; per-language (D24, never in parity)","status":"draft","since":"D39","covers_by":[]},{"id":"R-rewire-deferred","area":"graph","statement":"A node fn may, DURING its run, request a mutation of its OWN dep set via ctx.rewireNext(op), op in {addDep(node,fn) | removeDep(node,fn) | setDeps(nodes,fn)} (R-rewire surgical/Option-C semantics, D42). The request is QUEUED, not applied in place; the dispatcher DRAINS the queue at the COMMITTED wave boundary — after the current wave settles, and after a batch() commits or the final-lock RESUME (never on an un-committed or paused view) — applying each mutation as a fresh wave. Drain order is deterministic: per-node FIFO in issue order, nodes drained in causal order. This deferral is the ONLY legal self-triggered rewire: IMMEDIATE in-fn self-rewire remains the D37 mid-fn feedback-cycle ERROR (R-reentrancy); rewireNext moves application to a turn boundary where _insideRunWave is false. An added dep with cached DATA pushes [DIRTY,DATA] on the boundary wave (R-push-subscribe); a removed dep is unsubscribed and DRAINED, and if it loses its last subscriber it _deactivates and fires onDeactivation (input-side teardown — the basis for operator cancellation / abortInFlight). The first-run gate is PRESERVED across a deferred rewire (never re-armed, R-rewire). If the node goes terminal during the wave, its pending rewireNext queue is still drained: terminal is an output/lifecycle guard, NOT a deferred-topology cancellation condition. Applied addDep/removeDep/setDeps may change live deps after terminal, but terminal status remains final and no post-terminal downstream DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR may escape; non-resubscribable late subscribe is still rejected by R-terminal, while a resubscribable reset starts the next lifecycle from the current drained dep set. A rewireNext producing no net dep-set change is a no-op; a net-changing rewireNext re-issued every boundary (oscillation) is a user-level runaway (like an infinite producer), not a substrate-detected error. The wave-boundary drain ALSO hosts a SELF-TRIGGERED DEMAND — a CONE-ROUTED RESUME(pullId) demand to a pull-mode node (R-pull / R-up-routing / D55,D59), not only dep-set mutations — for the same D37-avoidance reason (an immediate in-fn demand whose delivery loops back re-enters the consumer); same committed-boundary drain, same deferral semantics. INTRA-graph only (D22).","rationale":"D47; *Map operators must grow/shrink their own dep set in response to their own data; the D37 mid-fn reject + the async-pool probe (the async pool does NOT defer the fn — _insideRunWave is set during any fn run, dispatcher/index.ts:48 + node.ts:692) leave the wave boundary as the only legal application point. removeDep is the only thing that stops an abandoned inner's source (read-gate masks output only), and D62 extends that cleanup through terminal waves so helper-owned timer/interval deps can be released by ordinary rewireNext.removeDep. Complements R-rewire (external/immediate) with a self/deferred form, reusing its surgical semantics. Pre-D62 this rule flipped active on 2026-05-30 with TS/Rust arms green under the terminal-discards-queue facet. D62 revises that facet to terminal-drains-queue; wave_rewire_deferred.tla is TLC-green with the new NoPostTerminalOutput invariant; TS re-passed the amended C-11 arm on 2026-05-31, so the rule returns to active on TS-arm-green + formal precedent. rust/py arms remain todo (CSP-5/7). Batch/pause cross-axis drain timing = backlog B24; describe-renders-live-inners (R-edges-derived construction-deps tension) = backlog B34. D55 reuses this boundary to host a self-triggered pull DEMAND (R-pull).","status":"active","since":"D47,D55,D59,D62","covers_by":["C-11","C-16"]},{"id":"R-resolved-undirty","area":"wave","statement":"RESOLVED is the UNDIRTY / no-occurrence settle: a node DIRTY'd in phase 1 that produces NO tier-3 value this wave emits exactly one RESOLVED to clear the downstream dirty (filter-reject / no-emit fn, zero-dep un-dirty, INVALIDATE at a never-populated cache, batch-rollback DIRTY-balance). RESOLVED NEVER substitutes for a DATA and NEVER signals 'value unchanged' -- every value-occurrence is emitted as DATA regardless of value-equality (no auto-equals-substitution; the substrate does not inspect per-wave DATA count for substitution). The undirty RESOLVED is SUBSTRATE-SYNTHESIZED: a value-level operator simply returns without emitting and the substrate emits the balancing RESOLVED (R-primary-api-clean -- operator bodies carry no protocol tier); an operator MAY emit its own DATA/RESOLVED explicitly as an escape hatch. Tier-3 wave exclusivity holds: one node's settle this wave is >=1 DATA (occurrence) XOR exactly 1 RESOLVED (undirty), never mixed. RESOLVED is preceded by DIRTY in the same wave (R-dirty-before-data) like DATA. Dedup (suppress an unchanged emission / skip an expensive recompute) is OPT-IN at the operator layer (distinctUntilChanged / fn early-return), never a substrate behavior; NodeOptions.equals does not exist.","rationale":"D49 supersedes D15/R-equals: equals-absorption overloaded RESOLVED (occurrence-unchanged vs dirty-clear) and destroyed occurrence info, breaking event-counting operators. Narrowing RESOLVED to undirty-only keeps occurrences as DATA (take/scan/snapshot correct) and simplifies the emit path. Glitch-free diamond (R-two-phase/R-diamond) is orthogonal and preserved.","status":"active","since":"D49","covers_by":["C-12"]},{"id":"R-paused-invalidate","area":"control","statement":"INVALIDATE × PAUSE precedence (default/'true' mode). A dep's INVALIDATE arriving while a compute node N is paused: (1) PROPAGATES downstream immediately (consistent with immediate DIRTY — not buffered in default mode; the downstream's N-DIRTY is balanced by this INVALIDATE's dirty-clear); (2) SUPERSEDES that dep's buffered paused dep-wave — N clears the dep to SENTINEL + drops its pending change, then re-derives the pending-recompute flag from whether ANY dep still carries a buffered value-change (ATTRIBUTED). On final-lock RESUME N recomputes once with the latest dep values ONLY if some dep still has a live buffered change; if none remains the recompute is CANCELLED (N already settled to SENTINEL via its own INVALIDATE — it never recomputes against an all-SENTINEL dep set). A later DATA on the same dep re-arms the buffer ([DATA,INVALIDATE,DATA2] → recompute with DATA2). resumeAll mode buffers+replays tier-3/4 on its own path; this rule is the default-mode coalesce semantics.","rationale":"D50; the INVALIDATE-side analogue of D44 (async×PAUSE). Prevents a spurious recompute against a vanished input — a redundant undirty RESOLVED (guarded fn) or a spurious terminal ERROR (non-guarding fn → panic → D30). Attributed cancellation preserves multi-dep updates (no lost update). Formal wave_paused_invalidate.tla (ChangedImpliesLive + PendingReflectsChanges + NoAllSentinelRecompute), TLC-green + mutation-verified. FLIPPED ACTIVE 2026-05-29 on the TS+Rust-arms-green + formal precedent (C-13 ts:pass+rust:pass, both impl-fixes teeth-verified); py arm CSP-7.","status":"active","since":"D50","covers_by":["C-13"]},{"id":"R-terminal-settles-dirty","area":"wave","statement":"A dep's TERMINAL (COMPLETE/ERROR) RELEASES that dep's outstanding in-wave DIRTY contribution: if the dep went DIRTY this wave (phase 1) and has NOT yet settled with DATA/RESOLVED, the receiving node clears that dep's dirty flag and decrements its pending count — exactly as the DATA/RESOLVED/INVALIDATE arms do. This is the EXACTLY-ONE-SETTLE invariant: every dep that goes DIRTY in phase 1 has its contribution released in phase 2 by exactly one settle-class event in {DATA, RESOLVED, INVALIDATE, COMPLETE, ERROR}. It applies in the ABSORBED-terminal cases where the node stays live — completeWhenDepsComplete:false (last/reduce, the *Map higher-order operators) and errorWhenDepsError:false (rescue/catch, R-deps-terminal); the AUTO-CASCADE cases (completeWhenDepsComplete && all deps complete -> node COMPLETE; errorWhenDepsError && a dep errors -> node ERROR) make the node itself terminal, so pending is moot there. If releasing the terminal dep's contribution drains pending to 0 while the node has already broadcast DIRTY this wave AND no terminal cascade fires, the node SETTLES: it recomputes (-> DATA from the remaining live deps' latest values) or, producing no tier-3 value, the substrate synthesizes exactly one undirty RESOLVED (R-resolved-undirty) to balance the downstream DIRTY. WITHOUT this release, a dep that emits DIRTY-then-COMPLETE/ERROR-without-a-value strands pending>0 -> the node never recomputes/settles and the DIRTY it broadcast wedges the downstream cone (the deadlock R-invalidate-idempotent already prevents for the INVALIDATE case). Restores R-diamond / R-two-phase for a diamond whose one leg terminates mid-wave. SCOPE: COMPLETE/ERROR only; a TEARDOWN arriving at a dirtied dep is the terminal-relay question (R-teardown-complete / B33), out of scope here.","rationale":"surfaced by the CSP-2.7 /qa (edge-case review of the *Map operators): node._receiveFromDep's COMPLETE/ERROR arms did not clear a dep's dirty contribution the way the DATA/RESOLVED/INVALIDATE arms do, so a DIRTY-then-terminal-without-DATA dep wedged a multi-dep node (B35). Pins TERMINAL as a settle-class event for dirty-accounting — the missing exactly-one-settle invariant — mirroring the INVALIDATE wedge-guard (the EC3 fix). Locked via /design-review (recommendation A-via-partial-C: a shared release-dirty + post-settle-undirty helper called by COMPLETE/ERROR alongside DATA/RESOLVED). PRE-EXISTING latent gap since CSP-1 (NOT introduced by D47); parity-consistent — the Rust dep-terminal receive arm is not yet built (node.rs _ => {}), so lock-BEFORE-build. No new D# (a dirty-accounting clarification of the two-phase contract D9, surfaced under D30 terminal handling). Formal: wave_terminal_dirty.tla (PendingCountsDirty + NoWedge, mutation-verified — dropping the terminal's release trips PendingCountsDirty). FLIPPED ACTIVE 2026-05-30 on the TS-arm-green + formal precedent (R-rewire/R-reentrancy/R-rewire-deferred): TS impl = node.ts _receiveFromDep COMPLETE/ERROR arms _releaseDepDirty(idx) + _settleAfterAbsorbedTerminal (sawData→recompute, else undirty RESOLVED) / _maybeRun for terminalAsRealInput; C-15 ts:pass (a/b/c). rust:todo = the CSP-6 dep-terminal slice (builds the propagation machinery WITH the release first time, lock-before-build); py:todo CSP-7.","status":"active","since":"D9,D30","covers_by":["C-15"]},{"id":"R-pull","area":"node","statement":"pull-mode node (NodeOptions.pullId:<LockId> -- an author-supplied UNIQUE Symbol written verbatim into the demander's fn; NEVER the node name (non-load-bearing debug metadata), NEVER a bare string (string-equality collides with a same-string pause lock); REPLACES the D55 pull:true boolean) = a quiet-until-demanded source; the demand is a RESUME (NO new message type -- R-msg-closed-set's 10-message set is intact). QUIET (default -- the node self-holds its pullId as its demand lock): (1) ABSORBS an upstream DIRTY WITHOUT relaying it downstream -- internal per-dep dirty/pending accounting is kept, only the DOWNSTREAM DIRTY broadcast is suppressed (the WEDGE FIX); (2) does NOT push-on-subscribe its cached value (START only) -- overrides R-push-subscribe while quiet; (3) tracks dep changes per its ORTHOGONAL pausable mode (true -> coalesce to latest; 'resumeAll' -> buffer the backlog). DEMAND = a CONE-ROUTED RESUME of the node's pullId (R-up-routing): the demander issues ctx.up([[RESUME, pullId]]) (broadcast up the declared cone) or ctx.up(towardDep, [[RESUME, pullId]]) (directed first-hop prune) WITHOUT holding the node's reference; the RESUME travels up declared edges to the pullId-holder, matched by SYMBOL IDENTITY (zero collision; siblings disambiguated). The holder fires EXACTLY ONE delivery then RE-QUIETS (1:1), emitting a fresh DIRTY-before-DATA wave (R-dirty-before-data) so the downstream dirty is balanced. Delivery CONTENT = the pausable mode: true -> the coalesced LATEST (one DATA); 'resumeAll' -> the buffered BACKLOG drained (first-demand backlog INCLUDES the activation value). A demand with NO intervening change -> NO delivery (silent). A demand arriving while a dep DIRTY is in flight (pending>0) fires once the node is settle-ready. pullId + pausable:false is REJECTED at construction (contradiction -- pull needs RESUME as the demand). A SELF-triggered demand (a consumer fn demanding a dep it ALSO reads) MUST defer to the committed wave boundary via R-rewire-deferred (D47) -- an immediate routed RESUME whose delivery loops back re-enters the consumer (D37/R-reentrancy); the consumer accepts one-wave latency. INTRA-graph only (D22). String-LABEL ergonomics (a label->pullId mint + a label->token registry with DUPLICATE-DETECTION) are graph-layer sugar (D6/D24). pull is SUBSTRATE (conformance C-16); the reactiveList two-port shape (stream push + snapshot pull) built on it is per-language (D6/D24, never parity).","rationale":"D55 introduced the pull-mode node + delivery; D59 REVISES the TRIGGER/ROUTING + API (supersedes D55's per-node-opaque-symbol + direct-target ctx.demandNext, RETAINS delivery). A demand must reach the pull node WITHOUT a node reference -- a reference IS the .cache anti-pattern (reach the node, read .cache, an UNORDERED + invisible side-channel) -- so the demand is a RESUME routed up the DECLARED cone (R-up-routing): inspectable (describe/observe), wave-ORDERED (DIRTY-before-DATA), needs only the author-known pullId. RESUME reused (no new message): a pull node is a perpetually-self-paused node, a demand a momentary resume. pullId = author Symbol via pullId:<id> (identity match, zero collision; bare string collides with pause-lock strings; name is non-load-bearing); RESUME payload type LockId=string|symbol UNCHANGED. label ergonomics + duplicate-detection are graph-layer sugar. The original probe-verified delivery (P0b wedge -> absorb-DIRTY fix; P4/P5 matrix) is unchanged.","status":"active","since":"D55,D59","covers_by":["C-16"]},{"id":"R-up-routing","area":"control","statement":"Up-going control messages (R-ctx-up) route along DECLARED dep-edges. ctx.up(msgs) broadcasts up ALL deps; ctx.up(towardDep, msgs) routes up ONE declared edge (directed -- prunes other branches; also for branch-targeted PAUSE/RESUME/INVALIDATE). RESUME routing = RELEASE-IF-HELD-ELSE-FORWARD-UP: a node HOLDING the lock releases it LOCALLY and does NOT forward (normal pause/resume -- a controller targets the holder directly; a pull node holds its own pullId-lock); a node NOT holding it FORWARDS the RESUME up its deps (broadcast or the single towardDep edge) to find the holder. This makes a DEMAND (R-pull) a CONE-ROUTED RESUME of a pull node's pullId that travels up declared edges (inspectable, wave-ordered) WITHOUT the demander holding the target's reference; the pullId disambiguates which holder fires (siblings up one branch are told apart by pullId identity). PAUSE stays NODE-TARGETED (it ACQUIRES a lock, so there is no pre-existing holder to find -- a controller targets the node directly). DIRTY/INVALIDATE/TEARDOWN forward toward deps to the depless-source terminus (R-up-at-source). A forwarded RESUME whose lock NO node up the cone holds reaches the source terminus and is DROPPED (net no-op, R-pause-lockset / R-up-at-source). INTRA-graph only (D22).","rationale":"D59. A demand must reach an upstream pull node WITHOUT a node reference (a reference IS the .cache anti-pattern: reach the node, read .cache) and WITHOUT an out-of-protocol side-channel; routing a RESUME up the DECLARED cone keeps the demand on inspectable, wave-ordered edges (describe/observe see it; .cache is an unordered invisible side-channel that bypasses wave ordering). 'release-if-held-else-forward-up' preserves normal pause/resume (the holder is targeted directly -> local release) while enabling cone-routed demand (a pull node pre-holds its pullId-lock from birth, so a routed RESUME always finds it); PAUSE needs no symmetric change (it creates a lock, no holder to find). Supersedes the old node-local-only RESUME: R-pause-lockset's 'RESUME of an unknown lock is a no-op' becomes 'forward up; drop at the terminus if unheld'. ctx.up(towardDep) prunes dead branches and is the general branch-targeted-control primitive.","status":"active","since":"D59","covers_by":["C-16"]},{"id":"R-up-routing-diamond","area":"control","statement":"A broadcast routed RESUME(pullId) over a DAG is idempotent per pullId-holder per routed control wave. If the same holder is reachable through multiple declared paths, it releases/fires at most once for that RESUME wave; duplicate same-wave arrivals at the already-fired holder are consumed silently and do not trigger a second pull delivery. This is a routing guarantee, not a reliance on R-pull's quiet coalescing after the first delivery. Directed ctx.up(towardDep,msgs) may still prune to one branch when the author wants a single path.","rationale":"D63 / B47. D59's tree model left a diamond-to-one-holder gap: the current impl can invoke the holder once per path, harmless today only because the second delivery is silent. Idempotence per holder per routed wave preserves R-pull's exactly-one-demand delivery promise for future multi-path pull consumers and keeps routing truthful over declared DAG topology.","status":"active","since":"D63","covers_by":["C-18"]},{"id":"R-undirty-settle-timing","area":"wave","statement":"A substrate-synthesized undirty RESOLVED used to balance a previously broadcast DIRTY follows normal tier-3/4 delivery timing. In pausable:true default mode it may deliver immediately even while a pause lock is held; in pausable:'resumeAll' it is buffered and replayed on final-lock RESUME; inside an open batch it is deferred until the outermost batch commit. This applies to undirty RESOLVED produced by terminal dirty-release (R-terminal-settles-dirty) and by INVALIDATE dirty-clear paths. Implementations must not bypass the normal delivery path with a bare subscriber send for these balancing RESOLVEDs.","rationale":"D64 / B39. Non-paused terminal dirty-release is already correct under C-15; the latent gap is only resumeAll/batch timing. Routing the balancing RESOLVED through normal delivery preserves D50 default-mode immediacy while honoring R-pause-modes and R-wave-boundary.","status":"active","since":"D64","covers_by":["C-19"]},{"id":"R-teardown-terminal-relay","area":"control","statement":"TEARDOWN relays through an already-terminal intermediate. A terminal node receiving upstream TEARDOWN forwards TEARDOWN downstream without emitting a new COMPLETE/ERROR, without clearing terminal, and without allowing post-terminal DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR. A non-terminal node receiving TEARDOWN keeps R-teardown-complete behavior: synthesize COMPLETE before TEARDOWN unless the same wave already carries COMPLETE/ERROR. TEARDOWN is a destroy/unwire cascade, not a value/lifecycle resurrection.","rationale":"D65 / B33. terminal-is-forever seals value output, but bridge/resource unwire must still reach downstream subscribers. Dropping TEARDOWN at a terminal guard leaks resources; relaying TEARDOWN is a narrow exception that does not reopen the node.","status":"active","since":"D65","covers_by":["C-20"]},{"id":"R-rewire-async-live-edge","area":"graph","statement":"A ctx captured by an async pool callback routes through the node's LIVE topology at emission time. If the node is rewired after the async invocation starts and before the callback calls ctx.up/ctx.down, the callback observes the current dep set/fn shape, not an invocation-time dep snapshot. Removed deps are drained and receive no late ctx traffic; added deps participate if they are live at emission time. Terminal output guards still seal post-terminal down emission.","rationale":"D66 / B17. Live-edge ctx matches graph-first inspection and current TS behavior: describe shows live deps, and hidden invocation-snapshot edges would be invisible topology. Async remains outside the sync wave core; the callback re-enters through the normal live node boundary.","status":"active","since":"D66","covers_by":["C-21"]},{"id":"R-rewire-batch-boundary","area":"graph","statement":"If setDeps/addDep/removeDep is requested while an outer batch is open and the target node has an uncommitted batched tier-3/4 settle slice, the rewire is accepted but deferred until after the outermost batch commits. The pending batched wave commits first against the pre-rewire topology/fn shape; then queued re
