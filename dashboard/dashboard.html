wire requests drain FIFO as fresh boundary waves. Topology mutation never applies to an uncommitted batch view, and old-shape pending DATA is never committed against the new dep set. Outside an open batch, immediate/external rewire remains immediate between waves.","rationale":"D67 / B19. This aligns external/immediate rewire with ctx.rewireNext's committed-boundary discipline while avoiding both a special reject and the unsafe rewire-before-commit ordering. Batch owns the current wave; topology changes begin after that wave commits.","status":"active","since":"D67","covers_by":["C-22"]}],"conformance":[{"id":"C-1","name":"cross-graph diamond coalesce","covers":["R-diamond","R-tier","R-two-phase","R-dirty-before-data","R-graph-domain"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"A in g1; B,C in g2 (reached from g1 via wire bridge); D in g1. Edges A→B, A→C, B→D, C→D — a diamond split across two single-threaded graphs.","input":"A.down([[DATA, v]]) (one wave).","expect":"DIRTY crosses the wire to B and C at the same priority as DATA (R12). Phase 1 DIRTY reaches D via both legs before any phase-2 DATA. D recomputes EXACTLY ONCE after both B and C settle in the same logical wave; D's outgoing wave contains a single DATA. No glitch (D never fires on a half-settled diamond).","note":"L2.F mixed-locality survival proof — the diamond stays glitch-free even though B/C live in a different causal domain reached over the wire bridge.","blocked":"wire bridge (backlog B2) — not yet implementable; the in-process diamond core it leans on is green in packages/ts core.test.ts (R-diamond/R-two-phase)","ref":"DR-5"},{"id":"C-2","name":"async-result arriving at paused node","covers":["R-async-paused","R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"Producer P backed by an async (LocalAsync) pool → node N. N has one active pause lock.","input":"1) N.up([[PAUSE, L1]]). 2) P's async fn resolves while N is paused, delivering [[DATA, r]] toward N. 3) N.up([[RESUME, L1]]).","expect":"The async result does NOT drop and does NOT deliver mid-pause; it enters N's pause buffer. On final-lock RESUME (L1 released, lockset empty) the buffered result replays as a wave to N's sinks. lock_id scope = the node-level pause_lockset (consistent with PAUSE buffering DATA).","note":"DR-3 — async-result-at-paused-node is buffer+RESUME-replay, identical to how PAUSE buffers a synchronous DATA. Rust arm GREEN 2026-05-30 (CSP-6 Slice A): graphrefly-rs LocalAsync pool (dispatcher Vec<Pool> + register_async; invoke stays sync void, R-sync-core) + DeferredCtx (ctx.defer() owned late-emit, the Rust analogue of TS capturing ctx) + node pause_buffer. should_buffer_on_pause True-branch buffers an async COMPUTE node (deps>0); on_resume drains+replays [DIRTY,DATA]. Teeth-verified (disable the async-compute buffer → DATA delivers mid-pause). conformance.rs::c2_async_result_at_paused_node.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-3,DR-5"},{"id":"C-3","name":"INVALIDATE × ctx.state × onInvalidate","covers":["R-invalidate-idempotent","R-ctx-state","R-cleanup-hooks","R-sentinel"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"source S → derived D. D's fn sets ctx.state on each run and registers ctx.onInvalidate(flush). A second parent S2 → D exists (diamond) to exercise fan-in idempotency.","input":"1) S settles [[DATA, v]] → D runs, caches, sets ctx.state. 2) S.down([[INVALIDATE]]) — cascades to D via both fan-in paths in one wave.","expect":"D broadcasts INVALIDATE downstream exactly ONCE (not once per fan-in path). D's onInvalidate hook fires exactly once (external flush). ctx.state is NOT wiped — INVALIDATE is lifecycle-continue, not a fresh-lifecycle transition; any internal reset must be done manually in onInvalidate. D's per-dep prevData returns to SENTINEL so a downstream prevData===SENTINEL never-emitted detector reads correctly. A second INVALIDATE arrival in the same wave is a no-op (hook + broadcast do not re-fire).","note":"distinguishes lifecycle-continue (INVALIDATE) from fresh-lifecycle wipe (deactivation / resubscribable reset). TS arm covers single-parent cascade + idempotent no-op + state-preservation; fan-in-in-one-wave needs batch (covered by R-invalidate-idempotent _hasData guard). Rust arm GREEN 2026-05-29 (CSP-5 control/terminal slice): graphrefly-rs node.rs INVALIDATE branch (idempotent !has_data guard, dep_prev→SENTINEL, dirty un-wedge) + ctx.on_invalidate (re-callable, cleared on deactivate); conformance.rs::c3 covers single-parent cascade + idempotent no-op + state-preservation, matching the TS arm (diamond fan-in-in-one-wave still needs batch, deferred).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-4","name":"mixed sync/async diamond","covers":["R-diamond","R-two-phase","R-graph-domain","R-first-run-gate","R-dirty-before-data"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"A → B (sync LocalSync leg) and A → C (async LocalAsync pool leg); B→D, C→D. One diamond, one sync leg + one remote/async leg.","input":"A.down([[DATA, v]]).","expect":"D joins EXACTLY ONCE after BOTH legs settle, even though the async leg C settles later via a pool callback. The async pool callback's wave-state mutation serializes back onto the graph's single thread (R-graph-domain), so D's dirty-dep accounting reconciles the sync and async settlements into one recompute. The first-run gate holds D until both deps have delivered real DATA. R-dirty-before-data: a post-activation re-join emits DIRTY before DATA in the same logical wave (observed ['DIRTY','DATA'], glitch-free two-phase).","note":"R8/R9 PoC validated; TS arm now a full conformance test (sync + async pool, same process — no wire bridge needed). R-dirty-before-data earned here via the post-activation re-join DIRTY-before-DATA assertion (CSP-3, 2026-05-28). Rust arm GREEN 2026-05-30 (CSP-6 Slice A): the async leg is a derived_async node whose fn stashes ctx.defer() and emits later; the first-run gate holds the join until it delivers, and the async leg's no-emit run is EXEMPT from the undirty-RESOLVED synthesis (deferred ≠ rejected — else the join settles early). Teeth-verified (remove the async exemption → the join fires before the async leg settles, runs=2 not 1). conformance.rs::c4_mixed_sync_async_diamond.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-5","name":"PAUSE lockset multi-source","covers":["R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"node N with two independent pause controllers, A and B.","input":"1) A.up([[PAUSE, LA]]). 2) B.up([[PAUSE, LB]]). 3) A.up([[PAUSE, LA]]) again (duplicate). 4) A.up([[RESUME, LA]]). 5) B.up([[RESUME, LX]]) for an unknown LX. 6) B.up([[RESUME, LB]]).","expect":"After step 1-2 lockset = {LA, LB}, N paused. Step 3 (same-id repeat PAUSE) is idempotent — lockset unchanged. Step 4 removes LA; lockset = {LB}; N STILL paused (B's lock holds). Step 5 (unknown id) is a no-op. Step 6 removes LB; lockset empty; N truly resumes (fires once with latest dep values under default mode). Releasing one controller never resumes the node while another's lock is held.","note":"multi-pauser correctness by construction — paused state derives from lockset.size > 0. Rust arm GREEN 2026-05-29 (CSP-5): graphrefly-rs node.rs pause_lockset (HashSet) + up() PAUSE/RESUME (same-id idempotent, unknown-RESUME no-op) + default-mode coalesce (maybe_run skip-while-paused → on_resume fire-once-with-latest); conformance.rs::c5. The resumeAll/false modes + async-paused buffering = C-9/C-10 (deferred to the async pool).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-6","name":"synchronous feedback cycle → ERROR","covers":["R-reentrancy"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"state S → derived D=([S], n=>n+1) → effect E=([D]); E's fn synchronously calls S.set(...) (a write back to S, an indirect dep of E), so S→D→E plus the feedback write closes a cycle.","input":"Kick the graph so E's fn runs and synchronously re-drives S (S.set) before E's wave completes.","expect":"The re-entrant attempt to run E's fn while E is already mid-wave is detected node-locally (E's in-wave flag is set) and rejected: a node ON the cycle emits [[ERROR, e]] (the graph layer catches the substrate throw at the value-level wrapper nearest the throw on the synchronous unwind — D30; which node is implementation-determined, e.g. D or E), and the wave aborts deterministically. NO silent _pending desync, NO unbounded synchronous recursion / stack overflow, NO surviving half-settled state. A legitimate accumulator over the same S built with ctx.state (scan) does NOT trigger the cycle (no topological re-entry).","note":"B10 / D37. Separates a disguised imperative control-flow loop (rejected) from ctx.state accumulation (allowed). Detection reuses the existing _insideRunWave flag (zero new structure); error ownership graph-level (D30); dispatcher uninvolved. Async feedback across a turn boundary (async pool) is a separate, out-of-scope case. Rust arm GREEN 2026-05-29 (CSP-5): Rust has no graph layer yet, so the D30 catch is a catch_unwind at the substrate WAVE-OWNER (the outermost subscribe/down/up/set entry). A panic = the Rust analogue of a value-level throw (the fn signature is Fn(&Ctx)->(); R-reentrancy mandates unwind, not graceful return); it converts to [[ERROR,e]] on the blamed cycle node (the innermost fn that ran = the effect E). Whole-cascade wave-flag recovery via the thread-local WaveScope touched-set closes B25 (conformance.rs::c6 also asserts the post-error source re-emits its leading DIRTY — teeth-verified by disabling the emitted_dirty reset). Per-language impl (D24, like the AnyValue value-rep decision) — no spec-amend / no D#.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D37"},{"id":"C-7","name":"upstream control at a depless source","covers":["R-up-at-source"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"depless source S (cached value) → derived D → sink. D (or a sink on D) originates ctx.up([msg]) which forwards upstream to the terminus S.","input":"Three independent runs, one per upstream-allowed non-pause control kind: 1) D.up([[INVALIDATE]]). 2) D.up([[DIRTY]]). 3) D.up([[TEARDOWN]]).","expect":"INVALIDATE: S HONORS the invalidate-request — S.cache returns to SENTINEL, S's onInvalidate hook fires once, and S broadcasts INVALIDATE downstream so D (and the whole downstream cone) clears (D.cache → SENTINEL, D's onInvalidate fires). DIRTY: DROPPED at S — S unchanged (cache + status intact), NO downstream DIRTY, downstream is NOT left wedged awaiting a settle. TEARDOWN: DROPPED at S — S not terminated, NO downstream TEARDOWN. A node guard on S may deny the INVALIDATE (drops silently) — opt-out, not the default.","note":"B11 / D38. Closes the F-NO-IMPL-DEFINED gap on upstream control reaching a depless source. INVALIDATE-up is a cache-drop request (not an imperative write); DIRTY/TEARDOWN have no coherent terminus action. Dep-bearing intermediates forward only; source is the single actor, down-cascade the effect. Formal: wave_up_source.tla. Rust arm GREEN 2026-05-30 (CSP-6): Core::up — PAUSE/RESUME self-handle the lockset; otherwise a depless source (deps empty) is the terminus (INVALIDATE → self.down([INVALIDATE]) honor, DIRTY/TEARDOWN drop) and a dep-bearing intermediate forwards toward each dep (dup_control reconstructs the payload-free kind, Msg not Clone). Teeth-verified (disable the terminus INVALIDATE → S keeps its cache). conformance.rs::c7_upstream_control_at_depless_source.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D38"},{"id":"C-8","name":"intra-graph runtime rewire","covers":["R-rewire"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"sources A, B (B carries a cached DATA b0); derived D = ([A], fn) — D initially depends only on A. All in one graph (D22 single causal domain).","input":"1) A settles [[DATA,a1]] → D's first-run gate opens, cache=fn(a1). 2) D.addDep(B, fn2). 3) B settles [[DATA,b1]]. 4) D.removeDep(A, fn3). 5) A settles [[DATA,a2]]. 6) D.setDeps([B], fn3) (current set, idempotent). Variants: remove A while A's DIRTY is mid-flight to D; A sends [[INVALIDATE]] then D.removeDep(A); A goes terminal then attempt D.addDep(A) / attempt a rewire on a terminal D / addDep(self) / a cycle / mid-fn rewire.","expect":"Surgical (Option-C): a rewire touches only changed deps — kept deps keep their subscription + DepRecord, no unsub/resub. (2) addDep(B) with B cached → B's cached value reaches D via the subscribe handshake (START then [DATA,b0] per R-push-subscribe) and D recomputes; the first-run gate is NOT re-armed (D already passed it — it does not re-wait for a fresh round of all deps); an added SENTINEL dep delivers START only, no recompute until it emits. (3) B's update drives D. (4) removeDep(A) discards A's DepRecord + clears A's dirty contribution; if A was the sole dirty contributor and D was dirty, D AUTO-SETTLES; D's cache is PRESERVED across every rewire (R-rom-ram). (5) after removeDep(A) a2 NO LONGER drives D — A's edge is DRAINED so no stale DIRTY/DATA/INVALIDATE strands. (6) setDeps to the current set is idempotent (no spurious recompute, no DepRecord churn). A mid-wave removal (A's DIRTY in flight) auto-settles per above; a removed dep's queued INVALIDATE is drained, never lands. REJECTS (throw → graph-layer ERROR, not silent): self-dependency; a cycle; setDeps/addDep/removeDep on a terminal D (completed/errored); adding a non-resubscribable terminal dep (resubscribable terminal allowed); mid-fn rewire (a fn mutating its own topology mid-wave = the D37 feedback-cycle ERROR) and reentrant rewire. removeDep to zero deps → degenerate fn-no-deps, cache preserved, no auto-deactivate. Every rewire requires an explicit fn (positional fn-deps pairing). INTRA-graph only (D22); no cross-graph rewire form.","note":"D42/CSP-2.5; R-rewire (since D22, refined by D42). SUBSTRATE prerequisite for higher-order operators (mergeMap/switchMap/concatMap/exhaustMap/flatMap). Formal (SD-2 gate, all four cross-axes): wave_rewire.tla = per-node Q1–Q7 + rewire×INVALIDATE (NoStaleEdgeMessages) + rewire×terminal (RewireOnlyOnLiveNode), TLC-green 603k states; wave_rewire_emit.tla = rewire×equals (CacheMatchesLastData) + rewire×multi-sink (MultiSinkConsistent), TLC-green 3003 states; all four new invariants mutation-verified load-bearing. TS arm GREEN 2026-05-28 (setDeps/addDep/removeDep in @graphrefly/ts node.ts; conformance.test.ts C-8 + rewire.test.ts 12 unit tests); rust/py arms pending CSP-5/CSP-7. R-rewire FLIPPED ACTIVE 2026-05-28 (TS-arm-green+formal precedent). Rust arm GREEN 2026-05-30 (CSP-6): graphrefly-rs node.rs setDeps/addDep/removeDep on Node<T> + Core::rewire — surgical Option-C via per-dep CURRENT-index boxes (Rc<Cell<i64>>: kept-dep reorder = O(1) box reroute, removed dep box→-1 drain), fn-swap re-register + B32 unregister-old (slotmap GC, freeing the rewired-away closure), push-on-subscribe for an added cached dep, atomic multi-add settle (in_dep_mutation defers maybe_run → ONE two-phase DIRTY→DATA via settle_rewire), Q6 removeDep auto-settle (+ zero-dep un-dirty RESOLVED), first-run gate + cache preserved (Q2/Q7). Rejects panic-propagate externally (self-dep/cycle-DFS/terminal-self/terminal-dep/reentrant); a MID-FN rewire becomes ivation fires (cancellation observable); innerB added. 6) (merge) two inners live -> both forward. 7) an inner COMPLETEs -> removeDep -> drain removes it (bounding). Variants: IMMEDIATE in-fn this.addDep (not via rewireNext) -> REJECTED (D37); rewireNext then OP terminal same wave -> queue still drains after terminal; no-net-change rewireNext -> no-op.","expect":"A rewireNext NEVER mutates _deps while _insideRunWave is true (deferred to the post-settle drain). The drain runs at the COMMITTED boundary (after batch commit / final-lock RESUME, never on an un-committed/paused view). Each queued op applied exactly once, in deterministic order (per-node FIFO, causal node order), as a fresh wave. Added cached dep pushes [DIRTY,DATA]; first-run gate NOT re-armed. Removed dep DRAINED (no stale DIRTY/DATA/INVALIDATE strands) and, if last subscriber, _deactivates + fires onDeactivation = observable input-side teardown (switchMap cancel/abortInFlight; mergeMap bounding). switch: only the current inner forwarded AND the superseded inner's source torn down (not merely masked). IMMEDIATE in-fn self-rewire still throws -> graph-layer ERROR (D37). Terminal OP still drains pending rewireNext requests at the boundary: removeDep releases the auxiliary dep (observable deactivation), addDep/setDeps may change topology, and any later dep messages are absorbed by the terminal output guard (no downstream post-terminal DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR). No-net-change rewireNext = no-op (no boundary-drain loop). INTRA-graph only.","note":"D47/R-rewire-deferred, amended by D62. Distinct from C-8 (external/immediate rewire between waves): C-11 is SELF-triggered/deferred-at-boundary. D62 revises the prior terminal facet: a node going terminal no longer discards already-queued rewireNext requests; the queue drains at the committed boundary, while terminal remains an output/lifecycle guard. Formal: wave_rewire_deferred.tla TLC-green after D62 (41,137 generated / 15,367 distinct / depth 24) with five invariants: DeferredAppliedAtBoundary, DrainExactlyOnce, RemovedDepSilenced, NoBoundaryDrainLoop, NoPostTerminalOutput. Runtime arms were reset because the previous TS/Rust passes implemented/tested terminal-discard. Required implementation update: remove the terminal-discard guard from deferred rewire application; add terminal-drain tests proving (a) queued removeDep after terminal deactivates/releases the helper dep, (b) queued addDep/setDeps after terminal may change deps, and (c) later dep messages produce no downstream post-terminal output. Batch/pause deferred-drain timing remains backlog B24. TS IMPL LANDED 2026-05-31 (/dev-dispatch): node.ts no longer discards deferred rewire on terminal; _applyRewireNext applies queued add/remove/set through the internal rewire path with terminal-owner allowance while the public terminal rewire reject remains intact; C-11 terminal-drain variants prove queued add/set may change topology but post-terminal output is sealed, and queued removeDep releases helper-owned work. time.test adds regression coverage for timeout/bufferTime/audit terminal/error timer cleanup. 263 TS tests green. rust:todo CSP-5; py:todo CSP-7. Rust arm GREEN 2026-05-31: D62 catch-up -- queued ctx.rewire_next drains even if the owner becomes terminal in the same wave; terminal remains an output guard (no post-terminal DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR). conformance.rs::c11 updated from terminal-discard to terminal-drains-topology.","harness":"packages/ts/src/__tests__/conformance.test.ts + rewire-deferred.test.ts","ref":"D47,R-rewire-deferred,D42,D37"},{"id":"C-12","name":"occurrences stay DATA; RESOLVED is undirty-only (no equals-substitution)","covers":["R-resolved-undirty"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"(a) a source emitting a repeated value (fromIter([1,1,1])-class) -> sink. (b) the same source -> take(3) -> sink. (c) source -> filter(pred rejecting every value) -> downstream node -> sink. (d) source -> distinctUntilChanged -> sink. All intra-graph (D22).","input":"(a) source emits 1,1,1 then COMPLETE. (b) same into take(3). (c) source emits values all failing the filter pred (each a dirty+settle round). (d) source emits 1,1,2.","expect":"(a) the sink observes THREE DATA (1,1,1) then COMPLETE -- a repeated value is a distinct occurrence, NEVER collapsed to RESOLVED (no equals-substitution). (b) take(3) emits [1,1,1] then COMPLETE (counts occurrences, not distinct values). (c) the filter, DIRTY'd but rejecting (no tier-3 value), has the substrate SYNTHESIZE one undirty RESOLVED per wave to clear the downstream dirty -- no DATA, no wedge; RESOLVED here means dirtied-but-no-value, never value-unchanged. (d) distinctUntilChanged (opt-in dedup, its own eq) emits [1,2] -- dedup is the OPERATOR's job, not the substrate's. Every node settle is >=1 DATA XOR 1 RESOLVED, never mixed. NodeOptions.equals does not exist.","note":"D49/R-resolved-undirty supersedes D15/R-equals. Pins the un-overloaded RESOLVED (undirty-only, substrate-synthesized) + no substrate dedup. Formal: wave_protocol.tla equals-substitution axis removed (+ retire wave_protocol_custom_equals_MC / wave_protocol_equals_false_MC); wave_rewire_emit.tla equals axis revised. RUST ARM GREEN 2026-05-30 (CSP-6): the D49 behavior already landed in the substrate (CSP-5 /qa); conformance.rs::c12 expresses take/distinctUntilChanged as inline ctx.state derived nodes (no operator library yet — per-language D6/D24): (a) a producer emitting [1,1,1]->3 DATA (no equals-substitution); (b) take(3)->[1,1,1] (occurrences, not distinct values); (c) filter-reject->one substrate-synthesized undirty RESOLVED per wave, no wedge; (d) distinctUntilChanged opt-in dedup->[1,2] with the deduped repeat an undirty RESOLVED. rust:pass. py:todo (CSP-7).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D49,R-resolved-undirty,D15"},{"id":"C-13","name":"INVALIDATE arriving at a paused compute node","covers":["R-paused-invalidate"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"compute node N = ([D1,D2], fn) paused via its own lockset (default/'true' mode); D1, D2 are sources. fn guards SENTINEL deps (reads prevData/data, emits only when present).","input":"Three runs. (a) SOLE-DEP CANCEL: N has run once; PAUSE N; D1 settles [[DATA,v1]] (buffered, N does not recompute); D1 sends [[INVALIDATE]]; RESUME N. (b) RE-ARM: PAUSE N; D1 [[DATA,v1]]; D1 [[INVALIDATE]]; D1 [[DATA,v2]]; RESUME N. (c) MULTI-DEP SURVIVE: PAUSE N; D1 [[DATA,v1]]; D2 [[DATA,v2]]; D1 [[INVALIDATE]]; RESUME N.","expect":"(a) the INVALIDATE PROPAGATES downstream immediately while paused (N broadcasts INVALIDATE, cache→SENTINEL, onInvalidate fires); on RESUME N does NOT recompute (the paused dep-wave was superseded — N is SENTINEL, nothing to recompute) — NO spurious undirty RESOLVED, and crucially NO recompute against a SENTINEL dep (so a non-guarding fn does NOT panic→spurious terminal ERROR). (b) on RESUME N recomputes ONCE with D1=v2 (the post-INVALIDATE DATA re-armed the buffer; v1 was superseded). (c) on RESUME N recomputes ONCE with D2=v2 and D1=SENTINEL (the fn guards D1) — the D1 INVALIDATE did not cancel the recompute D2's buffered change warrants (no lost update). In all cases the downstream dirty bookkeeping stays balanced (N's leading DIRTY is cleared by either the INVALIDATE or the resume settle).","note":"D50 / R-paused-invalidate. The INVALIDATE×PAUSE analogue of D44/C-9/C-10 (async×PAUSE). Surfaced by the CSP-5 Rust /qa (finding A): the impl left paused_dep_wave_occurred set after an INVALIDATE → resume recompute against a SENTINEL dep → spurious ERROR (Rust) / garbage value (TS). Formal: wave_paused_invalidate.tla (ChangedImpliesLive + PendingReflectsChanges + NoAllSentinelRecompute), TLC-green 327 states + ChangedImpliesLive mutation-verified. BOTH ARMS GREEN 2026-05-29: TS (node.ts INVALIDATE branch + conformance.test.ts C-13 a/b/c) + Rust (node.rs recei
