ean-slate TS.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D107","layer":"L3","date":"2026-06-03","question":"What exact first public shape should reactiveCascadingCache expose, and how should callback/event storage APIs feed it?","decision":"The first TS reactiveCascadingCache implementation exposes a free-standing graph-layer bundle factory returning value, status, and events nodes. It takes declared request, optional policy, and optional invalidation deps plus passive tiers/load options; it does not add a Graph method or imperative getOrLoad/cache object. Status and event payloads use explicit discriminated unions and carry a requestSeq token so slow fills from older requests cannot overwrite newer visible state. The first public event vocabulary includes request, lookup, promotion, fill, invalidate, and error facts; status includes idle, loading, hit, miss, and error. Browser/native callback storage APIs such as IndexedDB are normalized inside passive binding-layer adapters into one-shot PromiseLike StorageBackend/KvStorageTier facts; they are wrapped into graph sources/pool work only by graph-layer factories such as reactiveCascadingCache, not by the passive backend itself.","rationale":"D105 already locks reactiveCascadingCache as a free-standing graph factory, but the status/event bundle and stale-fill token are the long-lived public contract needed before implementation. Keeping callback/event storage APIs behind one-shot passive storage contracts preserves D103/D106 environment backend reuse across browser/node runtimes and avoids smuggling browser transaction callbacks into graph topology as hidden side channels. requestSeq makes async completion order explicit without changing the sync wave protocol, while value/status/events nodes keep cache behavior inspectable through declared graph topology.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D108","layer":"L3","date":"2026-06-04","question":"How should storage support stale-proof read-through promotion without introducing broad CAS/transactions?","decision":"Add a narrow optional versioned-KV capability: a tier may expose a versioned read that returns an opaque per-key generation for both present and absent observations, plus a conditional set that succeeds only if the generation still matches. reactiveCascadingCache and passive read-through helpers may use this capability for stale-proof promotion when present; otherwise promotion remains explicit best-effort or disabled by default in the graph factory. Do not introduce general transactions, locks, leases, or a broad capability registry.","rationale":"D107 requestSeq protects visible graph state but cannot make passive storage writes stale-proof after async set begins. D89 rejects premature broad CAS, but safe promotion is now a concrete consumer for a narrow method-shaped capability. Keeping generation opaque and optional preserves D82 passive storage boundaries, avoids graph restore/protocol coupling, and lets unsupported backends fail capability checks honestly.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D109","layer":"L3","date":"2026-06-04","question":"How should clean-slate restore node runtime versioning after D26 dissolved the central config singleton and B49 moved TS nodes toward a NodeCore/slot view?","decision":"Add node runtime versioning as constructor-time policy plus NodeCore-held runtime metadata. The package default is V0 (`nodev0`): every node constructed without an override gets runtime version metadata `{level:0,counter}` and the counter advances only on DATA emissions. Graph options may set a graph-owned default versioning policy for graph-owned nodes, and per-node options may override it; free-standing nodes use the package default or their explicit node options. Use a policy option shaped as `versioning: false | 0 | 1 | {level:0|1, hash?: HashFn}`. Do not require or expose a user-supplied versioning id; graph-owned nodes already have graph ids/paths, and free-standing node ids are process-local. V1 adds runtime `{level:1,counter,cid,prev}` computed synchronously from strict/canonical JSON-compatible DATA using the selected hash function. V2/V3 are reserved and must fail honestly until separately locked. This runtime versioning lane is distinct from D108 KV generations, checkpoint envelope versions, storage schema versions, and companion-node topology.","rationale":"The frozen pure-ts reference established node runtime versioning as V0 id+counter and V1 cid+prev, while DS-1/D26 moved defaultVersioning/defaultHashFn from the central config singleton into graph/dispatcher opts instead of deleting the capability. The clean-slate/B49 shape should not revive mutable global config, companion nodes, or public imperative version mutation. Constructor-time policy keeps Node thin: versioning is not a public mutation/control surface, only runtime metadata advanced synchronously at the DATA boundary and stored in NodeCore slot/side-table state. Default V0 provides a cheap audit/change anchor for both graph-owned and free-standing nodes, while V1 serves content-addressed consumers without forcing hash cost when disabled.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D110","layer":"L2.E","date":"2026-06-04","question":"When a batch rolls back or fails before commit completes, what happens to ctx.rewireNext/ctx.upNext boundary tasks queued under that uncommitted batch?","decision":"Deferred self-boundary tasks queued under an uncommitted batch inherit that batch's commit fate. If the batch rolls back explicitly, throws before commit, or fails before the batch is marked committed, all boundary tasks whose cause belongs to that batch are discarded rather than drained. The already-emitted DIRTY is still balanced by the normal rollback RESOLVED, but no dep topology mutation, added-dep activation/push-on-subscribe, removeDep cleanup, setDeps, or self-demand RESUME effect survives the rollback. If the batch commits successfully, queued boundary tasks drain after commit under R-rewire-deferred-committed-boundary. Storage durability failure remains governed by D93 and does not retroactively roll back graph commits.","rationale":"GraphReFly batch rollback is wave-local: DIRTY may already be visible, while tier-3/4 settle slices are uncommitted and discarded on rollback. Letting a boundary task from the same uncommitted cause mutate topology or route demand after rollback would create a hidden committed effect from a failed reactive transaction. A cleanup-only exception for removeDep is rejected because removeDep is also topology mutation and would make rollback semantics depend on intent classification rather than observable protocol shape. Unconditional cleanup should be expressed through committed terminal/deactivation paths, including D62 terminal-drain behavior when that terminal wave commits.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D111","layer":"rust-product/B53","date":"2026-06-04","question":"How should Rust source/time APIs handle timers and async without making Tokio part of the sync core?","decision":"Rust async/time sources use a feature-gated injectable local async driver. Tokio is provided as an optional adapter, not a core dependency. Timer, interval, future, and stream sources run only at the source/driver boundary; the wave core remains sync and Dispatcher::invoke remains sync void. Graph/Dispatcher may carry the driver so graph-bound sources compose without per-source runtime plumbing. Missing driver reports ERROR on source activation. Time operators are compositions over higher-order plus timer; no new protocol primitive is added.","rationale":"This preserves F-SYNC-CORE, D22 single-thread graph semantics, and Rust's current Rc/RefCell local graph shape while avoiding ambient Tokio LocalSet panics as the only API failure mode. An injectable driver is testable, keeps Tokio optional, and gives Rust the B53 product surface needed for source/time completeness without changing protocol behavior; D52/D47 already cover source/time and rewire composition semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D112","layer":"L3","date":"2026-06-04","question":"What input contract should D109 V1 node runtime HashFn use so custom CID hashing is deterministic across TS/Rust/Py?","decision":"Refine D109's HashFn contract so V1 node runtime hashing receives the strict canonical JSON UTF-8 bytes of the DATA payload, not the host-language raw value. Implementations must validate and encode the DATA payload through the neutral strict canonical JSON surface first, then pass those exact bytes to the selected hash function synchronously. TS uses Uint8Array, Rust uses &[u8], and Python uses bytes. Convenience helpers may expose canonical JSON text or default hashing, but the policy callback's load-bearing input is canonical bytes. Invalid non-strict-JSON DATA fails before any version/cache mutation or downstream DIRTY/DATA observation. This does not add a versioning id, companion node, global config singleton, public imperative version mutation, protocol message, or tier.","rationale":"D109 requires V1 {counter,cid,prev} to be computed from strict/canonical JSON-compatible DATA, while D96 makes strict JSON a neutral single source shared by storage and checkpoints. Passing host values to a custom hash leaves cross-runtime CID semantics dependent on TS object/value representation and user JSON.stringify choices. Passing canonical UTF-8 bytes gives every runtime the same digest input, keeps hashing synchronous in the wave core, avoids duplicate canonicalization, and keeps runtime versioning distinct from storage generations, schema versions, and checkpoint envelope versions.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D113","layer":"L3","date":"2026-06-04","question":"Should D112 expose a public canonical bytes helper, and where should it live?","decision":"Expose canonical DATA bytes as a neutral JSON/encoding helper, e.g. strictCanonicalJsonBytes(value): Uint8Array, implemented by the existing strictJsonCodec.encode path. Do not expose node-version policy helpers such as assertNodeVersionDataCompatible or snapshotNodeVersionData as public API. NodeVersionHashFn and defaultNodeVersionHash remain bytes-contract APIs.","rationale":"D112 requires V1 HashFn input to be strict canonical JSON UTF-8 bytes, while D96 keeps strict JSON/canonicalization in a neutral single source. A neutral helper improves D112 DX without duplicating scanners or exposing node runtime policy internals, and avoids confusing V1 DATA strictness with checkpoint/restore strictness.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D114","layer":"rust-product/B53","date":"2026-06-04","question":"What public shape should Rust subscribe-armed time helpers timeout/buffer_time use?","decision":"Rust ships timeout(&Node<T>, ms) -> Node<T> and buffer_time(&Node<T>, ms) -> Node<Vec<T>> as graph-scoped free helper constructors anchored on the source node's arena/dispatcher/local async driver. They are not ordinary Operator<T> factories and not Graph methods. They construct construction-time timer/interval deps so clocks arm on activation before first source DATA, carry real factory names for describe auto-discovery, and clean helper clocks through rewireNext/removeDep and normal deactivation. Raw time work remains confined to timer/interval sources.","rationale":"TS B41 proved timeout(source, ms)/bufferTime(source, ms) need subscribe-armed helper nodes. A plain Operator cannot arm the first clock at activation with only a source dep, while Graph methods would reverse D43's generic init_node funnel and grow per-operator surface. This preserves D52/D111, R-no-raw-async, R-dispatch-all, R-node-thin, and D6/D24 per-language sugar boundaries.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D115","layer":"L2 graph substrate API","date":"2026-06-05","question":"Should runtime dep topology APIs be named as dep-set mutation or as dep subscription lifecycle?","decision":"Rename the public immediate and deferred dep topology APIs from set-editing names to dep-subscription names, with no legacy shims: addDep/add_dep becomes subscribeDep/subscribe_dep, removeDep/remove_dep becomes unsubscribeDep/unsubscribe_dep, and setDeps/set_deps becomes replaceDeps/replace_deps. ctx.rewireNext keeps its group name but exposes subscribeDep, unsubscribeDep, and replaceDeps. Semantics remain D42/D47 surgical rewire semantics: kept deps preserve subscription and DepRecord, removed deps unsubscribe and drain, added deps fresh-subscribe, and deferred requests apply at the committed boundary.","rationale":"The observable graph edge is a live protocol subscription, not merely membership in a mutable collection. The new names align public API vocabulary with R-edges-derived/R-describe, make cancellation via dep unsubscription explicit, and prepare same-node repeat design to compose normal unsubscribe plus later subscribe rather than a force-resubscribe primitive. Because GraphReFly is pre-1.0 and no-backward-compat is locked, retaining add/remove/set aliases would create two truth sources for the same substrate operation.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D116","layer":"L3 / Rust+TS checkpoint restore","date":"2026-06-05","question":"How should TS and Rust align checkpoint data while keeping storage separate from graph restore?","decision":"Use one language-neutral public checkpoint data shape for TS and Rust from the first real C-24 restore arm. The checkpoint schema/version, strict JSON discriminants, topology/factory/config/cache/SENTINEL/terminal/lifecycle/ctx.state fields, and canonical JSON compatibility rules are shared across runtimes. Fresh restore remains a per-runtime graph lifecycle API: restore_graph/restoreGraph consumes an already-loaded checkpoint plus an explicit restore registry and constructs a fresh graph. Storage may load, store, encode, decode, or return checkpoint values as ordinary strict-JSON data, but storage does not own restore semantics, replay WAL as restore, mutate graphs, or provide storage-owned restore APIs. Cross-runtime restore succeeds only when the target runtime has matching registry refs/descriptors/config support; missing or local-only factories fail honestly. Reactive collection Node-driven input/policy remains graph-bound and describe-visible per D61/D68.","rationale":"D83/R-restore define restore as graph lifecycle over checkpointed topology/state, while D82/D103 keep storage passive and separate. Aligning TS/Rust checkpoint data avoids drifting C-24 behavior into runtime-specific envelopes, and D96/D112 already make strict canonical JSON a neutral cross-runtime data contract. Keeping restore APIs per-runtime preserves self-contained implementations and graph-local dispatcher ownership, while allowing storage to persist checkpoints without interpreting graph lifecycle. The graph-bound collection clause carries the user's implementation choice without changing protocol semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D117","layer":"L3 / checkpoint restore","date":"2026-06-05","question":"What should a late subscriber observe after a dep-bearing node is restored with checkpointed cache/state?","decision":"After a successful fresh restore commit, a late subscriber to a restored node observes that node's checkpointed cache directly through normal push-on-subscribe. Restore is state-preserving: restored dep-bearing/derived nodes are not treated as never-run, their first-run gate is not re-armed, and dependency activation or push-on-subscribe caused by reconnecting restored topology must not by itself recompute, overwrite, or clear the restored cache. A restored SENTINEL/value-absent cache still behaves as value-absent and pushes START only; a restored terminal node preserves terminal semantics. New upstream DATA/INVALIDATE/terminal events that occur after the restore commit are ordinary graph waves and may update the node normally.","rationale":"B56 surfaced an ambiguity in C-24: restored deps may push cached values when topology is activated, which could accidentally make a restored derived node look like a fresh lifecycle and replay computation. That would contradict D83/R-restore's state-preserving contract and make checkpoint caches non-load-bearing. Direct restored-cache push-on-subscribe keeps restore as a graph lifecycle commit over checkpointed state, not a hidden re-execution pass, while preserving normal wave semantics for post-commit changes.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D118","layer":"L1.5 / inspection","date":"2026-06-06","question":"Should describe/topology gain a public watchTopology stream before GraphReFly has topology-event egress?","decision":"Do not expose a public watchTopology API until a real topology-event egress exists. describe() remains a snapshot surface, and topologyDiff(prev,next) remains a pure snapshot diff. Observe-triggered topology reads may exist only under an honest sampling name and must not claim to be a live topology stream.","rationale":"D39 locks observe as read-only message egress and describe as an inspectable snapshot. Driving describe() from DATA observe events samples graph state at message boundaries; it does not observe topology mutation as a first-class event and would mislead callers if named watchTopology. Keeping the boundary explicit avoids a self-observation island, preserves describe's snapshot role, and leaves any future topology-event egress as a separate design decision rather than an accidental Graph.observe expansion.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D119","layer":"L1.5 / composition","date":"2026-06-06","question":"Should stratify auto-create runtime branches for unknown keys, or should dynamic topic lifecycle be a separate primitive?","decision":"stratify routes into a declared branch superset; it must not auto-create branches for unknown runtime keys. Unknown-topic lifecycle, including naming, subscription, deletion, COMPLETE/error behavior, and reuse, belongs to a separate hub/router primitive design rather than being smuggled into stratify.","rationale":"D56 made stratify a declared-dep branch-builder composition whose branches are inspectable topology. Auto-creating unknown branches would introduce topic lifecycle semantics that are broader than sift/router sugar and would make branch existence a hidden runtime side effect. A declared branch superset keeps topology predictable and describe-visible, while preserving room for a future hub/router primitive with an honest lifecycle contract.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D120","layer":"L1.5 / data structures","date":"2026-06-06","question":"What public shape should reactive collection views have so they remain derived surfaces rather than second writable state?","decision":"Reactive collection views are derived collection surfaces. Light views may depend on a parent delta and recompute by reading the parent backend; materialized derived views may own a private view backend behind declared nodes. In both cases, the public view surface remains derived delta + snapshot and must not expose a writable state-node cache as a second authority.","rationale":"D60 made the collection backend the single materialized state for each collection, with delta and snapshot as explicit ports. Views should preserve that single-source discipline: parent.delta -> view.apply -> view.delta/snapshot is topology that can be described, while a public writable cache would duplicate authority and invite drift. The shape supports cheap light views first and materialized views later without changing protocol behavior or promoting private view internals into public state.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D121","layer":"L1.5 / data structures","date":"2026-06-06","question":"What first public shape should reactive collection views use for log.page, index.range, and map.select?","decision":"Reactive collection views use a shared derived view surface shaped as {delta, snapshot, pullId, dispose}. The first implementation should be light views: parent.delta arms/recomputes the view, and view.snapshot is a pull node that materializes the derived view on demand. The view may read the parent collection's own backend or a private view backend, but it must not expose a writable state-node cache. log.page and index.range should land before map.select; materialized derived views are a later optimization behind the same public view shape.","rationale":"D120 locks collection views as derived delta+snapshot surfaces rather than writable second state. A shared ReactiveView shape matches D60's collectionCore ports, keeps topology describe-visible, composes across log/index/map, and avoids freezing Node-only view APIs as the long-term public contract. Light views are simpler and sufficient for the first slice; materialized views add private-backend delta correctness and should wait for a concrete performance or selection use case.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D122","layer":"L4 graph lifecycle / L1.5 collection views","date":"2026-06-06","question":"How should graph-registered derived view nodes leave the graph lifecycle when their owning view is disposed?","decision":"Derived view nodes created for ReactiveView surfaces are graph-registered ephemeral node groups. The owning view dispose() releases the whole group from the graph lifecycle atomically: released nodes disappear from describe/find/profile/checkpoint, their ids are retired and not reused in the same graph, and their runtime deps/dispatcher handles are cleaned through an internal graph-owned release path. This is graph-layer lifecycle management, not a public Node.dispose API and not a protocol change.","rationale":"D39/D51 make describe a live point-in-time topology snapshot, not a historical tombstone list. D120/D121 make collection views derived surfaces owned by the parent collection, so their helper nodes should be visible while live and absent after dispose. Group release avoids transient auto-discovery/id drift and keeps graph inspection truthful without adding protocol behavior.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D123","layer":"rust-product/B53","date":"2026-06-06","question":"How should Rust add storage/read-through support for B53 reactiveCascadingCache catch-up without reviving the old graphrefly-storage graph integration?","decision":"Add a new clean-slate passive storage/read-through spine inside the main graphrefly Rust crate as per-language product surface. The first Rust slice may expose a storage module with typed string-key KV tiers, memory KV, optional opaque-generation versioned KV reads plus set-if-match promotion support, and a graph-agnostic tiered_read_through helper. The old graphrefly-storage crate may be mined only as implementation reference material for backend and test ideas; it must not be imported, depended on, re-exported, or used to restore its old Graph.attachSnapshotStorage/restoreSnapshot/WAL-replay graph integration. The later reactive_cascading_cache Rust factory should be a graph-layer free helper over this passive spine, returning visible value/status/events nodes from declared request/policy/invalidate deps. This decision adds no Graph storage methods, no storage-owned hydration or restore, no graph checkpoint WAL replay, no broad CAS/transactions/locks/leases capability, and no protocol message/tier/wave semantic change.","rationale":"B53 requires Rust product completeness to catch up with the already-landed TS storage and reactiveCascadingCache surfaces, while D57/D82/D103 keep storage passive and separate from graph restore/hydration. D104 split the reusable passive cascading read-through mechanics from the graph-layer reactive factory, D105/D107 locked reactiveCascadingCache as a free-standing graph helper with value/status/events nodes, and D108 allows only the narrow optional versioned KV capability needed for safe promotion. Placing the new Rust surface inside the main crate keeps graphrefly-rs self-contained per D32 and avoids freezing the retired old storage crate's port-model graph integration into the clean-slate API.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D124","layer":"L4 graph lifecycle / L1.5 collection views","date":"2026-06-06","question":"What should ReactiveView.dispose() do if called while one of its graph-registered view nodes is participating in an in-flight wave?","decision":"ReactiveView.dispose() is quiescent-only for graph-registered ephemeral view groups. If any node in the release group is currently dirty, pending, inside a wave/function delivery, or otherwise on an uncommitted in-flight wave view, dispose rejects without releasing or hiding the group. The caller may retry after the synchronous wave/batch boundary returns. Successful dispose remains D122 atomic release: the whole group disappears from describe/find/profile/checkpoint, ids are retired, and runtime deps/handles are cleaned through the graph-owned internal release path. This does not add public Node.dispose, does not cascade to external dependents, and does not emit COMPLETE/TEARDOWN or any synthetic settling messages.","rationale":"Mid-wave release can either strand DIRTY accounting or force new terminal/teardown/settle semantics. Boundary-deferred release would need additional rules for describe/checkpoint visibility, batch rollback, pause, and committed-boundary ordering. Quiescent-only rejection is the smallest graph-layer lifecycle rule that preserves D122 atomic disappearance, D39 truthful live inspection, and R-dirty-before-data/R-two-phase without changing the wave protocol.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D125","layer":"L6 / CSP-9 TS package surface","date":"2026-06-07","question":"How should @graphrefly/ts name and layer upper package surfaces after absorbing the old root and pure-ts packages?","decision":"Use capability and application-layer subpaths rather than old split-era base/utils vocabulary. Delete public base and utils staging surfaces. Rename compat to adapters and presets to patterns. Add solutions for vertical application kits such as agentic-memory, harness, and data-agent. Keep messaging, orchestration, and cqrs as reusable application-infrastructure subpaths below patterns/solutions. Keep storage passive only: no Graph dependency, no observe attachment, no graph restore/hydration ownership. Graph-bound storage egress such as attachObserveSink and observe-event-log attachment lives under adapters/observe-storage. Dependency direction is encoding/json plus core/protocol -> passive storage and graph runtime -> graph capabilities -> adapters and application infrastructure -> patterns -> solutions -> examples/testing.","rationale":"D32 makes @graphrefly/ts a single self-contained package, so old base/utils names from the pure-ts/root split are misleading. D40/D41 require intent re-derivation, not structural copying. D57/D74/D82/D103/D106 keep storage passive and separate from graph restore/hydration, while observe-based persistence is a graph-bound adapter. Explicit layers prevent catch-all exports, preserve tree-shaking, and give CSP-9 B60-B66 a stable target DAG without changing protocol behavior.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D126","layer":"L1.5 / composition / CSP-10 B70","date":"2026-06-07","question":"How should stratify support dynamic rules without hidden runtime branch lifecycle?","decision":"stratify is a source-event stream router over a finite declared branch universe. The initial rules list declares the branch superset and creates all visible branch nodes at construction. Later writes to the rules node may change the active classification config for those declared branch names; omitting a declared branch name makes that branch drop future source DATA until the name is reintroduced. Unknown rule names in later rules do not auto-create branches and do not mutate topology. stratifyBranch emits only source DATA occurrences classified against the latest available rules; rules-only waves do not reclassify or re-emit the latest source value. Latest/current-state membership classification requires a separately named view or pattern helper. True runtime branch creation/removal or hub/router lifecycle remains a separate design gate, not stratify.","rationale":"D56 already locked stratify as a declared-dep, static-branch first cut and D119 rejected unknown-topic auto-creation. This refinement keeps the useful TS shape of dynamic rule data over predeclared branch nodes while preserving D39/D51 explainable topology, R-edges-derived truthfulness, and D6/D24 per-language composition sugar boundaries. Treating rules-only updates as latest-source reclassification blends stream routing with state membership, risks duplicate emissions, and diverges from the clean-slate TS precedent that rules changes affect future source items only.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D127","layer":"L6 / CSP-9 B63 Graph authoring surface","date":"2026-06-07","question":"How should @graphrefly/ts rehome old GraphSpec/surface utilities without reviving old runtime ownership or restore semantics?","decision":"Split old GraphSpec/surface into clean-slate authoring helpers: pure projection and validation over DescribeSnapshot/GraphCheckpoint data, plus an optional solution-level fresh-graph authoring DSL through explicit registries. Do not reintroduce public GraphSpec as runtime owner, factoryTag/meta.factory as authoritative restore, compileSpec placeholder fallback, surface restoreSnapshot/saveSnapshot/diffSnapshot over storage tiers, Graph.attachSnapshotStorage interop, or storage-owned hydration. Restore remains restoreGraph(checkpoint,{registry}) over an already loaded checkpoint.","rationale":"This preserves LLM/tool authoring value while honoring D39/D51 inspection as live point-in-time graph truth, D82/D103/D106 passive storage and restore boundaries, R-restore/R-snapshot strict checkpoint semantics, and D125 capability/application-layer subpaths. It also keeps CSP-9 B63 from becoming a blind utils import rewrite while still allowing retainable projection, validation, catalog, and fresh-graph authoring intent to be re-derived on the clean-slate substrate.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D128","layer":"L6 / CSP-9 B63 orchestration surface","date":"2026-06-07","question":"How should @graphrefly/ts expose public orchestration/process helpers from the old utils without reviving imperative workflow engines or Graph subclasses?","decision":"Expose orchestration as free graph-authoring helpers under @graphrefly/ts/orchestration that add or return graph-owned, describe-visible nodes/bundles. Retain workflow-DAG intent such as task, classify, keyed combine, approval/approvalGate, and terminal catch only when implemented through declared deps, graph-owned state nodes, ordinary node emissions, and clean-slate graph APIs. Do not reintroduce PipelineGraph as a public Graph subclass, legacy pipeline/branch/join/loop/subPipeline migration aliases, factoryTag/describeKind/domainMeta as public semantics, internal subscribe-to-graph-node topology islands, or processManager as an imperative saga/runtime owner in this slice. Long-running process/saga semantics, humanInput/tracker correlation channels, and CQRS process managers require separate design gates after messaging/cqrs surfaces are locked.","rationale":"D125 places orchestration as reusable application infrastructure below patterns/solutions, while D45/D51/R-edges-derived require topology to be explainable through declared deps or rewire and D39 makes describe the public inspection truth. The old PipelineGraph subclass and processManager preserve useful product intent but mix Graph method expansion, closure queues, imperative controls, internal subscriptions, raw async/timers, and storage/restore-adjacent lifecycle concerns. Free graph-authoring helpers keep the public API graph-first and tree-shakeable without adding verbs or protocol behavior.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D129","layer":"L6 / CSP-9 B63 process orchestration surface","date":"2026-06-07","question":"How should @graphrefly/ts expose long-running process/saga orchestration without reviving the old imperative processManager runtime?","decision":"Expose process orchestration as graph-visible command/event/process-state composition, not as an imperative workflow engine. A public process bundle may provide command/event topics or nodes, derived process state, instance/audit logs, and optional effect-request outputs. Convenience methods such as start/cancel may exist only as boundary sugar that publishes command facts; they must not directly mutate hidden process state. Process steps must be modeled as declared event deps, reducers, graph-owned state nodes, or explicit effect-request outputs. Do not reintroduce the old processManager closure-owned Map/Set state as source of truth, internal watched-event subscriptions that are absent from describe, private CQRS _appendEvent calls, fire-and-forget storage restore/hydration, raw retry timers inside the reactive layer, or storage-owned process recovery. Persistence stores process command/event/state facts or ordinary checkpoints outside the sync core; restore/hydration remains governed by existing checkpoint/storage decisions.","rationale":"The old processManager captures valuable saga intent: correlation ids, start/cancel, retries, compensation, scheduling, audit, and recovery. But its implementation makes imperative coordinator state authoritative and uses invisible subscriptions, private CQRS hooks, raw async/timers, and storage-adjacent restore behavior. D39/D51/D45 require public topology to be inspectable through graph deps or rewire, D125 places orchestration below patterns/solutions as reusable application infrastructure, and D82/D103/D127 keep storage passive and separate from restore ownership. Modeling process as facts plus graph-visible projections preserves the product value while keeping GraphReFly graph-first.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D130","layer":"L6 / environment adapters / CSP-9 B63 / CSP-10 B72","date":"2026-06-07","question":"How should GraphReFly expose production-grade process, network, messaging, and resilience adapters across TS and Rust without smuggling async or lifecycle behavior into the sync wave core?","decision":"TS and Rust share a conceptual environment-adapter architecture. Graph cores remain synchronous and graph-local; process, network, messaging, time, and runtime work lives behind graph-local EnvironmentDrivers or runtime-native equivalent capability groups. Inbound adapters expose from_* source nodes. Outbound adapters expose attach_* or to_* sinks, or graph-visible status bundles. Bidirectional protocols such as WebSocket, MCP, long-lived subprocess stdin/stdout, and message-session APIs expose bundles with explicit inbound, outbound/status, lifecycle, and error nodes rather than a single hidden side-channel. EnvironmentDrivers may grow concrete process, network, messaging, and task/runtime drivers as product needs require; missing driver capability is an implementation gap, not a reason to omit basic adapters such as HTTP, SSE, WebSocket, webhook ingress, or message-bus consumers/producers. Resilience is unified across adapters and graph compositions: passive BackoffPolicy/RetryPolicy helpers are shared; graph-visible retry, breaker, rate-limit, and timeout bundles expose attempts/status/errors; adapter-native retry/reconnect is allowed only when attempts/status/errors are observable and bounded or explicitly configured. Cross-graph causal propagation, remote node dependencies, and remote dispatcher functions remain wire-bridge/design-gated and must not be represented as ordinary graph deps.","rationale":"This preserves F-SYNC-CORE, R-sync-core, D22/R-graph-domain, D39/R-describe inspectability, D45 no hidden subscribe islands, D125 package layering, and D24 behavioral-not-structural parity while making the product usable for real IO. The shape gives TS and Rust the same product mental model without requiring identical symbols or runtime dependencies: browser TS can use fetch/WebSocket/EventSource drivers; Node TS can use child_process/http/ws drivers; Rust can use tokio or other optional adapters behind EnvironmentDrivers. Resilience remains graph-visible and policy-owned rather than an imperative singleton scheduler, while concrete adapters can still provide practical reconnect/retry defaults.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D131","layer":"rust-product/B72 / environment adapter ownership","date":"2026-06-07","question":"Where should EnvironmentDrivers live and how should Rust/TS adapters access them without thickening Dispatcher or duplicating runtime state?","decision":"EnvironmentDrivers is a graph-owned capability bag, installed through GraphOptions and attached to graph-owned node cores/ctx for source/adapter access. Dispatcher remains fn-pool/profile owner and must not grow process/network/messaging drivers. Existing Rust local_async_driver migrates into EnvironmentDrivers.local_async; temporary internal fallback may exist during migration, but the final public shape is graph-owned environment. Source/adapter factories read drivers from ctx/graph environment and emit missing-driver ERROR on activation. Bidirectional and outbound adapters return graph-visible bundles/handles rather than hiding environment state.","rationale":"D22 defines graph as the concurrency domain, while Dispatcher may be shared or process-global. Keeping environment IO on the graph preserves F-SYNC-CORE/R-sync-core, D39 inspectability, D130 environment adapter architecture, and avoids per-source driver plumbing while keeping Dispatcher thin.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D132","layer":"L6 / environment adapters / CSP-9 B63 / CSP-10 B72","date":"2026-06-07","question":"What exact public shape should outbound adapters, message-bus, and resilience use after D130/D131?","decision":"Complete D130 with typed graph-visible bundles, not a public generic sink super-primitive. Outbound process/network/message adapters expose focused `to_*` or `attach_*` helpers that create declared graph deps and status/error/attempt nodes, while shared implementation helpers stay private. Bidirectional protocols expose bundles with explicit inbound, outbound/status, lifecycle, and error nodes. Message-bus lives in reusable application infrastructure and exposes topic/message/cursor facts plus `from_*` consumers and `to_*` producers over graph-local EnvironmentDrivers or runtime-native driver groups. Resilience exposes passive BackoffPolicy/RetryPolicy helpers plus graph-visible retry, breaker, rate-limit, and timeout bundles; async scheduling remains in drivers/sources/pools/adapters and every attempt/status/error is observable and bounded or explicitly configured. TS and Rust should preserve this conceptual shape with runtime-idiomatic names rather than structural symbol parity.","rationale":"This refines D130/D131 into an implementable public API shape without changing protocol semantics. Typed bundles keep topology inspectable through declared deps (D39/R-describe/R-edges-derived), avoid hidden subscribe islands and imperative coordinator state (D45/D129/R-no-imperative), preserve F-SYNC-CORE by confining async work to adapter boundaries, and keep D125 package layering clear. A public generic sink super-primitive would freeze too broad a contract and obscure transport-specific status/lifecycle behavior; private shared helpers still reduce duplication.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D133","layer":"L6 / bidirectional environment sessions","date":"2026-06-08","question":"How should GraphReFly expose WebSocket, MCP, long-lived subprocess, and message-session style bidirectional transports without hidden side channels?","decision":"Bidirectional transports expose a graph-visible SessionBundle shape rather than extending one-shot outbound adapters or concrete runtime drivers into hidden session owners. The shared conceptual bundle has a command node for outbound commands plus typed inbound, lifecycle, status, errors, and attempts nodes. Transport-specific adapters such as WebSocket, MCP, long-lived subprocess stdio, and message-session APIs may specialize the command and inbound payload unions, but they preserve the same visible ports. Reconnect and retry reuse the existing RetryPolicy/BackoffPolicy vocabulary and must surface attempts/status/errors; adapter-native reconnect is allowed only when bounded or explicitly configured and observable through the bundle. Convenience send/start/close helpers may exist only as boundary sugar that publishes command facts; they must not directly mutate hidden session state.","rationale":"D130/D132 already require bidirectional protocols to expose explicit inbound/outbound/status/lifecycle/error nodes. Locking the command-node SessionBundle shape prevents an imperative `send()` or EventEmitter-style session island from becoming the public API, keeps D39 describe/profile visibility through declared graph nodes, preserves R-no-imperative and F-SYNC-CORE by confining transport async to drivers/adapters, and gives TS and Rust a common product contract without structural symbol parity. Sharing RetryPolicy/BackoffPolicy keeps reconnect behavior aligned with graph-visible resilience rather than a transport-specific scheduler singleton.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D134","layer":"L6 / wire bridge and remote graph boundary","date":"2026-06-08","question":"How should GraphReFly represent cross-graph wire bridge ordering and future remote dispatcher calls without violating the graph causal-domain boundary?","decision":"A wire bridge is an explicit graph/application-layer bridge node or bundle. The local wave ends at the bridge boundary; remote receipt starts a new wave in the remote graph. Bridge messages use ordered, acknowledged causal envelopes scoped to a bridge session, with monotonic sequence/cursor/idempotency metadata and graph-visible ack/nack/status/error facts. The first public bridge shape must not represent a remote node as an ordinary local dep, must not keep one wave open across the network, and must not let remote COMPLETE/ERROR participate directly in local pending/diamond settlement. Remote dispatcher functions are deferred as an immediate follow-up built on the same request/response envelope model: a call request is an outbound command fact and its return/error is an inbound fact, not a synchronous local dispatcher invocation.","rationale":"D22 defines a graph as the single-thread causal/concurrency domain and D130 leaves cross-graph causal propagation, remote deps, and remote dispatcher functions wire-bridge/design-gated. Per-session ordered ack envelopes give enough delivery, retry, dedupe, and future request/response structure for real wire bridges while preserving F-SYNC-CORE and avoiding distributed same-wave semantics. Best-effort event bridges are too weak for the planned remote dispatcher follow-up; distributed transactions or remote ordinary deps would require protocol/spec changes and risk smuggling network latency into the sync wave core. This lock keeps the first bridge in the application/adapter layer and names the spec-amend boundary explicitly.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D135","layer":"L6 / dynamic messaging hub","date":"2026-06-08","question":"How should dynamic topics and routers compose with the existing finite messageBus/fromTopic/toTopic surface without hidden runtime topology mutation?","decision":"Dynamic topic/router support is facts-dynamic and topology-static in the first public shape. A dynamic hub exposes always-present graph-visible event, command, status, error, and optional dead-letter/cursor nodes. Topic creation and deletion are DATA facts on the hub event stream, not automatic graph node creation/removal. `fromTopic(key)`-style helpers are static filters/projections over the hub facts, and `toTopic(key)` publishes ordinary command/event facts. Unknown-topic behavior is an explicit policy such as drop, error, dead-letter, or create-as-fact; it must not silently mutate graph topology. True runtime branch/node creation, topic deletion causing describe-visible node disappearance, and hub-owned topology lifecycle are deferred until a topology-event/ephemeral-group design exists.","rationale":"D119/D126 lock stratify as a finite declared branch router and reject hidden runtime branch creation. Keeping dynamic hubs facts-dynamic preserves product utility for unbounded topics while retaining D39 explainable topology and D51/R-edges-derived truth: describe can show the hub and its static projections even though topic facts are open-ended data. The shape composes with the existing D132 message-bus and resilience surfaces, avoids internal subscribe islands or invisible branches, and leaves a clean future path for true dynamic topology after a topology-event/ephemeral lifecycle lock rather than smuggling that behavior into messaging.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D136","layer":"L6 / process and saga orchestration","date":"2026-06-08","question":"What first public process/saga orchestration shape should GraphReFly expose after locking command/event process facts?","decision":"Process and saga orchestration starts with a facts-plus-reducer ProcessBundle, not a workflow engine. The first public shape exposes command, event, state, audit, effect-request, status, and error nodes. Start, cancel, approval/input, retry, timeout, and compensation requests are command or effect facts flowing through the bundle; convenience methods may publish those facts but must not mutate hidden process state. Process state is reducer-derived from visible events and graph-owned state nodes. External IO is modeled as effect-request facts consumed by existing outbound/session adapters, and retry/timeout/compensation compose existing orchestration/resilience helpers before any higher-level DSL is added. Persistence stores process facts or ordinary graph checkpoints outside the sync core; the process bundle does not own storage restore/hydration.","rationale":"D128/D129 reject resurrecting PipelineGraph/processManager-style imperative engines while preserving the product value of correlation ids, lifecycle, retries, compensation, audit, and recovery. A facts-plus-reducer bundle keeps every process transition inspectable, testable, and portable across TS/Rust as application infrastructure below patterns/solutions. It prevents closure-owned Map/Set state, invisible watched subscriptions, private CQRS append paths, raw timers, and storage-owned recovery from becoming public semantics. A declarative process DSL can later compile to this bundle, but locking the bundle first gives the DSL a graph-first target instead of an engine-shaped escape hatch.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D137","layer":"L3 / L6 worker-pool taxonomy / B72","date":"2026-06-08","question":"How should GraphReFly distinguish environment task drivers, dispatcher WorkerPools, and cross-graph wire bridge work?","decision":"Use a three-way taxonomy. EnvironmentDrivers task/runtime drivers host graph-external work and return results through graph-visible source/adapter/session bundles; they do not execute node functions or change dispatcher pool semantics. Dispatcher WorkerPool is the graph-internal compute execution lane for node functions; dispatcher.invoke remains sync void, node functions still enter through the dispatcher funnel, and any asynchronous or parallel completion must re-enter the owning graph through its single-thread boundary before mutating wave state. Cross-graph remote dependencies, remote dispatcher functions, and multi-graph causal propagation are neither EnvironmentDrivers tasks nor ordinary WorkerPool features; they belong to the explicit wire bridge design line and must not be modeled as ordinary intra-graph deps.","rationale":"D20 keeps a pluggable dispatcher pool trait, D22 makes each graph the single-thread concurrency domain, D130/D131 place process/network/messaging/runtime IO on graph-owned EnvironmentDrivers, and D133/D134 separately lock bidirectional session bundles plus wire bridge envelopes. This taxonomy prevents B72 worker-style integrations from sliding into hidden imperative runtimes, Dispatcher-owned IO, fake remote deps, or distributed same-wave semantics while preserving F-SYNC-CORE, F-DISPATCH-ALL, and graph-visible adapter/status surfaces.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D138","layer":"L3 / WorkerPool v0 / B1-B72","date":"2026-06-08","question":"What first public WorkerPool shape should GraphReFly expose without affecting the wave protocol?","decision":"WorkerPool v0 is graph-helper-first. The first public surface should be a graph helper such as worker_derived/workerDerived, not a low-level scheduler API as the primary user entry. The helper runs a kickoff node function on the graph thread, reads current dep data through the normal ctx/waveData surface, prepares an owned Send/static input, submits only that owned compute job to a dispatcher-owned WorkerPool, and returns the worker result through DeferredCtx as a later, brand-new graph wave. Ctx, Node handles, Rc/RefCell graph state, AnyValue host objects, and live graph topology must not cross the worker boundary. dispatcher.invoke remains sync void; worker completion must use the existing late-emit path and must not keep the original wave pending or participate in the original wave pending/diamond accounting. Errors/panics from worker compute are coerced to valid ERROR payloads on the later wave. The low-level WorkerPool trait may exist as internal or driver-facing infrastructure, but broad public scheduler controls, remote workers, and environment task execution are deferred or routed to their own D137/D134 categories.","rationale":"This keeps the API graph-first (F-GRAPH-FIRST-API) and preserves F-SYNC-CORE/F-DISPATCH-ALL: node functions still enter through the dispatcher funnel, while only owned compute work leaves the graph thread. It reuses the existing LocalAsync/DeferredCtx late-result semantics, so no protocol/tier/message/ctx.up/down change is needed. It also respects the current Rust single-thread Rc/RefCell core and D22 graph concurrency boundary by refusing to make Node or Ctx Send. A helper-first surface avoids prematurely freezing a scheduler contract while still giving users the product value of CPU-heavy derived computation.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D139","layer":"L3 / WorkerPool scheduler and cancellation","date":"2026-06-08","question":"How should future public/custom WorkerPool scheduler APIs and worker cancellation semantics compose across TS and Rust?","decision":"Public/custom WorkerPool design, if added, is a language-neutral semantic contract shared by TS and Rust. The public graph API remains helper-first; custom scheduling is installed as a dispatcher/graph-owned WorkerPool backend capability, not exposed as ordinary imperative worker submission. Cancellation guarantees stale completions do not mutate the graph via invocation/liveness fences; hard cancellation of already-running compute is not guaranteed and may only be cooperative. Worker submission must remain cold until the graph-local completion/fence path is installed. Remote/cross-graph worker execution is excluded and belongs to the wire-bridge design line.","rationale":"This extends D138 without broadening its public surface: node functions still enter through the dispatcher funnel, only owned Send/static compute work leaves the graph thread, and completion returns as a later fresh wave. It preserves D20 pluggable pool intent, D22 graph concurrency boundaries, D24 behavioral conformance over structural API parity, D32 self-contained packages, D137 taxonomy, F-SYNC-CORE, and F-DISPATCH-ALL. Defining cancellation as a graph-correctness fence rather than a hard runtime-stop guarantee keeps TS AbortSignal-style cancellation and Rust blocking/thread-pool realities aligned without making protocol behavior implementation-defined.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D140","layer":"L6 / remote worker and cross-graph execution","date":"2026-06-08","question":"How should remote worker and cross-graph worker execution compose with WorkerPool and wire bridge?","decision":"Remote worker and cross-graph worker execution are wire-bridge request/response patterns, not Dispatcher WorkerPool backends and not ordinary remote graph dependencies. A local graph emits request/command facts through an explicit bridge bundle; the remote graph receives them as a new wave, may run local graph or worker computation there, and returns result/error/status facts through the bridge. Local projection of a remote result may emit DATA or ERROR only as a later fresh local wave. Ctx, Node handles, function bodies, live topology, and local pending/diamond accounting never cross the bridge. TS and Rust share the semantic envelope contract, while public helper names and adapter shapes remain per-language.","rationale":"This preserves D22 graph concurrency boundaries, D32 self-contained runtimes, D134 ordered acknowledged bridge envelopes, D137 taxonomy, and D138/D139 WorkerPool helper-first local compute. It avoids distributed same-wave semantics, fake remote deps, and WorkerPool/EnvironmentDrivers category drift while keeping remote dispatcher-style work expressible as graph-visible bridge facts with session, sequence, cursor, idempotency, ack/nack, status, and error metadata.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D141","layer":"L6 / wire bridge envelope payload shape","date":"2026-06-08","question":"How should TS and Rust represent heterogeneous wire bridge envelope payloads for data, nack/error, status, and close reason without erasing graph values across the bridge?","decision":"Use a tagged bridge payload sum type/union inside wire bridge envelopes. Data/send envelopes carry a data payload variant. Nack, error, status, and close carry explicit non-data fact payload variants, while ack/nack correlation remains in metadata such as ack_for_seq. Payload variants are bridge facts, not protocol messages; remote ERROR/COMPLETE remain DATA envelope facts and never become local protocol terminals. Do not silently cast control payloads into the data type parameter or drop them. Do not allow AnyValue, Ctx, Node handles, functions, live topology, or graph-owned mutable state across the bridge.","rationale":"D134/D140 require TS and Rust to share the semantic envelope contract for request/response wire bridges, while D137 keeps remote work out of WorkerPool and EnvironmentDrivers. A tagged payload makes heterogeneous bridge facts explicit without changing protocol tiers/messages or ctx.up/down semantics, and preserves graph-visible error/status/close facts for future remote dispatcher patterns.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D142","layer":"L6 / CQRS dedupe policy / CSP-9 B63 / CSP-10 B67","date":"2026-06-08","question":"How should TS and Rust bound CQRS command/event id dedupe state without weakening clean-slate graph visibility or restore boundaries?","decision":"CQRS dedupe is an application-infrastructure policy, not a protocol rule. The default command/event id dedupe policy is exact and unbounded for backwards safety within the clean-slate slice. TS and Rust may expose a static bounded dedupe policy with independent command and event id windows; bounded windows are insertion-order retention windows, and ids evicted from the window are no longer recognized as duplicates. The policy is installed as CQRS bundle configuration, not as a storage-owned restore mechanism, imperative permission system, hidden EventEmitter, or protocol/tier/message change. Dedupe state remains graph-owned runtime state and must be JSON/checkpoint friendly; optional runtime counters such as retained/evicted command and event ids should be graph-visible via cursor/status facts where the language surface supports them. Dynamic Node-valued dedupe policies and standalone generic dedupe/eviction engines are deferred until a real cross-surface consumer exists.","rationale":"The first TS CQRS slice used JSON-friendly seenCommandIds/seenEventIds arrays, which preserves exact duplicate recognition but grows unbounded and scans linearly in long-lived CQRS bundles. D125 places CQRS under reusable application infrastructure, D129 requires command/event/process state to be graph-visible facts rather than hidden coordinator maps, D80 warns against premature public policy engines, and R-restore/D103/D106 keep storage passive rather than the owner of graph restore/hydration. A static bounded window gives production users explicit memory control while making the weaker idempotency contract visible and preserving exact behavior by default. Because this does not change wave semantics, tiers, messages, ctx.up/down, terminal behavior, or graph restore protocol, no spec-amend is required.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D145","layer":"L4 graph inspection/lifecycle / topology events","date":"2026-06-08","question":"How should GraphReFly expose live topology events and dynamic ephemeral topology without adding a second node registry or changing wave protocol semantics?","decision":"Topology events are graph inspection/lifecycle egress, not protocol messages and not graph nodes. The existing graph node registry remains the only node registry and the source of truth for describe/find/profile/checkpoint. observeTopology(path?) may expose a read-only egress stream of graph lifecycle facts such as node registered, node released, deps changed, and mount changed, produced only from existing graph mutation points. Optional release/topology groups are lifecycle labels and release handles over already graph-registered node ids; they are not registries, dispatch owners, dep registries, or event hubs. Group release is quiescent-only and follows D124-style atomic release: released nodes disappear from describe/find/profile/checkpoint only after the graph-owned release succeeds. With no topology observers and no group use, implementations should pay no event allocation or queue cost beyond existing graph bookkeeping. Dynamic topic/view/router node lifecycle must use explicit topology/release-group APIs; unknown data keys must not silently mutate topology.","rationale":"D39/R-describe and D51/R-edges-derived make the graph registry plus live deps the inspection truth. D135 deferred true dynamic topic/node lifecycle until topology events and ephemeral lifecycle were designed. A second registry would duplicate graph ownership, hurt F-PERF, and create maintenance burden; a read-only egress over existing mutation points preserves explainability without changing tiers/messages/ctx semantics. D124 already locks quiescent-only group release for graph-registered ephemeral view groups, so extending that lifecycle model avoids synthetic COMPLETE/TEARDOWN or hidden imperative cleanup.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D146","layer":"L6 process/saga DSL and effect runner ownership","date":"2026-06-08","question":"How should process/saga DSLs and effect runners compose with the D136 ProcessBundle without becoming workflow engines or hidden runtime owners?","decision":"A process/saga DSL is an authoring layer that compiles to a D136 ProcessBundle and declared graph wiring; it is not a runtime owner. Effect runners are graph-visible adapter/bundle compositions that consume effect-request facts and publish result/failure/cancel/timeout command facts back into the process bundle. They may use EnvironmentDrivers, outbound/session adapters, retry/backoff/timeout helpers, and wire bridge helpers at their boundaries, but they must not own process state, private retry timers, hidden subscriptions, storage restore/hydration, or imperative process maps. Process state remains reducer-derived from visible command/event/effect facts and graph-owned state. Persistence stores facts or ordinary checkpoints outside the sync core.","rationale":"D136 locks process orchestration as facts-plus-reducer, while D128/D129 reject PipelineGraph/processManager-style imperative owners. Keeping DSLs as compilers and effect runners as visible fact adapters preserves D39/D51 inspectability, R-no-imperative, F-SYNC-CORE, and D125 layering. This gives users workflow ergonomics without making GraphReFly a black-box workflow engine.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D147","layer":"L6 wire bridge remote dispatcher helpers","date":"2026-06-08","question":"How should GraphReFly expose remote dispatcher-style calls on top of the wire bridge without creating remote ordinary deps or synchronous cross-graph invocation?","decision":"Remote dispatcher helpers are wire-bridge request/response fact helpers. A local remoteCall-style helper emits request command facts through an explicit bridge bundle and exposes graph-visible result, status, and error projection nodes. A remote responder consumes inbound request facts, dispatches only within the remote graph/runtime, and sends response/error/status facts back through the bridge. Operation names, request ids, idempotency keys, sequence/cursor metadata, timeout/retry policy, and typed payload/result wrappers are bridge/application facts, not protocol messages. The local wave ends at the bridge; the remote handler runs in a fresh remote wave; the local result/error projection emits only as a later fresh local wave. Remote nodes must not be represented as ordinary local deps, remote COMPLETE/ERROR must not become local protocol terminals, and function bodies, Ctx, Node handles, live topology, or graph mutable state must not cross the bridge. Auth, discovery, schema-codegen, and remote ordinary deps remain deferred or spec-gated.","rationale":"D134/D140 already lock cross-graph work as ordered acknowledged bridge envelopes and request/response facts. This decision pins the helper surface so product ergonomics do not smuggle distributed same-wave semantics or hidden RPC side channels into the graph. Keeping remote execution as visible bridge facts preserves D22/R-graph-domain, F-SYNC-CORE, D39/R-describe, and D141 tagged payloads while leaving transport/auth/discovery to later adapter-level design.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D148","layer":"L3 WorkerPool public customization","date":"2026-06-08","question":"What public/custom WorkerPool scheduler shape can GraphReFly expose without turning worker execution into an imperative graph mutation API?","decision":"Public WorkerPool customization is a graph/dispatcher-owned backend capability selected by helper options or construction options; it is not a public imperative submit API. The primary user API remains helper-first, such as workerDerived/worker_derived. Backends receive cold owned jobs only after the graph-local completion/fence path is installed, and jobs may carry only owned worker input plus static compute closures permitted by the language runtime. Ctx, Node handles, graph mutable state, AnyValue host objects, live topology, and original wave pending/diamond state never cross the worker boundary. Cancellation is a graph-correctness fence by default: stale completions must not mutate the graph; hard cancellation of already-running compute is optional/cooperative and must be surfaced as status/error facts if exposed. Remote workers remain wire-bridge request/response patterns, not WorkerPool backends.","rationale":"D138 locks WorkerPool v0 helper-first and D139 locks cold submission plus liveness fencing. Exposing a raw submit API would bypass graph topology and invite imperative mutation; backend capability preserves F-DISPATCH-ALL and F-SYNC-CORE while allowing production scheduling choices. Keeping remote execution on D134/D140 prevents category drift between local compute, EnvironmentDrivers, and cross-graph work.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D149","layer":"L6 / CQRS bundle lifecycle / CSP-9 B63 / CSP-10 B67","date":"2026-06-08","question":"How should CQRS bundle and projection lifecycle compose with graph-owned retain roots across TS and Rust without becoming topology deletion or protocol lifecycle?","decision":"CQRS bundle and projection lifecycle is an application-infrastructure retain-root lifecycle. A CQRS bundle or projection may retain its graph-owned internal fact/projection nodes so command, event, status, error, audit, cursor, and projection facts remain graph-visible even before external observation. Any public lifecycle surface may release only the keepalive retain roots created by that bundle/projection. It must not synthesize protocol COMPLETE/ERROR/TEARDOWN/control messages, delete graph topology, clear cached facts or ctx.state, cancel external subscriptions, mutate hidden process state, or act as a command/query permission path. After release, ordinary graph deps and external subscriptions determine liveness. TS may expose a deterministic release/dispose-style method for this retain-root release; Rust may use RAII Drop and/or an explicit release method with the same semantics.","rationale":"D69 makes Graph.retain the sanctioned graph-owned activation shape for helper internals, and the CQRS first slice already needs retained runtime/projection nodes so command facts are reduced even when dispatch precedes external subscription. TS and Rust diverged after QA: TS retained graph roots without a public release handle, while Rust stored retain handles in the returned bundle/projection and releases them on Drop. Locking the lifecycle as retain-root release preserves graph-visible CQRS facts while avoiding a broader topology or protocol lifecycle surface. Deleting graph nodes, sending terminal/control messages, or making release a permission/cancel mechanism would cross into R-describe/R-edges-derived, R-sync-core, and restore/protocol semantics that CQRS does not own.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D150","layer":"L6 / CQRS checkpoint and export contract / CSP-9 B63 / CSP-10 B67","date":"2026-06-08","question":"What checkpoint/export promise does CQRS make for runtime state and public payload facts without turning CQRS into storage or restore ownership?","decision":"CQRS only guarantees that its own internal runtime cursor/dedupe state is graph-owned and JSON/checkpoint-friendly. Command, event, audit, status, error, and projection payloads remain ordinary graph values governed by the existing graph checkpoint contract; CQRS does not automatically make arbitrary host payloads durable, serializable, replayable, or cross-process restorable. CQRS does not own storage, hydration, restore, WAL replay, event-log replay, or checkpoint commit barriers. Durable CQRS export, when needed, is modeled as a passive fact sink/projection over CQRS fact nodes or as a separately reviewed codec/helper surface, not as CQRS-owned restore/hydration.","rationale":"D127, D103, D106, R-snapshot, and R-restore keep storage passive and graph restore/hydration graph-owned rather than helper-owned. D142 intentionally promised JSON/checkpoint-friendly CQRS runtime dedupe state, but that must not be inflated into a promise that arbitrary command/event/projection payloads are serializable or that CQRS owns event-store replay. This honesty contract preserves useful checkpoint behavior for cursor/dedupe recovery while keeping payload durability explicit and binding-layer storage/export separate from the sync graph core.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D151","layer":"L6 / idempotency and dedupe vocabulary / B79","date":"2026-06-08","question":"Should GraphReFly extract a generic idempotency/dedupe engine across CQRS and wireBridge?","decision":"Do not add a standalone public generic dedupe/idempotency reducer engine yet. Lock a narrow application-infrastructure vocabulary/contract: dedupe windows are membership-based duplicate recognition; ordered receipt uses monotonic seq/cursor; idempotencyKey is correlation/idempotency metadata unless a surface explicitly owns key-based recognition; ack/nack correlation uses ackForSeq. CQRS and wireBridge retain domain-specific graph-visible reducers/status/error/cursor facts and graph-owned state. Shared public types/helpers may exist only for passive vocabulary/validation; any public reducer bundle, dynamic Node-valued policy, or key-store/replay/idempotency engine requires a later design review with an additional concrete consumer and must expose accepted/duplicate/error/cursor/status facts through ordinary graph nodes and declared deps. No protocol/tier/message/ctx/restore semantics change.","rationale":"CQRS and wireBridge share duplicate/idempotency/cursor vocabulary, but their authoritative semantics differ: CQRS uses command/event id windows while wireBridge uses ordered seq/cursor receipt plus ack/nack correlation. A generic engine now would either under-specify bridge ordering or overfit CQRS membership windows, violating D80's shared-vocabulary-before-engine rule and risking hidden state ownership. This preserves D134/D140/D141 bridge boundaries, D142 CQRS dedupe policy, and D149/D150 CQRS lifecycle/checkpoint locks.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D152","layer":"L4 graph lifecycle / L1.5 dynamic topology","date":"2026-06-09","question":"How should dynamic topic/view/router surfaces truly create and release graph nodes without hidden topology mutation?","decision":"True runtime topic/view/router node lifecycle must use an explicit graph-owned topology/release-group surface. Unknown data keys, publish commands, rule updates, or hub facts must not silently create or delete graph nodes. A dynamic topology group may create named child node groups through ordinary graph node construction, and release them only through graph-owned quiescent-only atomic release semantics: released nodes disappear from describe/find/profile/checkpoint, ids are retired, runtime deps/handles are cleaned, and no COMPLETE/ERROR/TEARDOWN/control messages are synthesized. The existing graph registry remains the only node registry and source of truth; any helper-local maps are memo/lookup indexes only, never authoritative topology. D135 facts-dynamic/topology-static hubs remain the default dynamic messaging shape; true node lifecycle is an opt-in lifecycle surface layered on D145 topology events and D122/D124 release semantics.","rationale":"D135 intentionally deferred true runtime node creation until topology-event and ephemeral lifecycle design existed. D145 allows topology/release groups but rejects second registries, hidden event hubs, and unknown-key topology mutation. D39/R-describe and D51/R-edges-derived require describe to reflect the graph registry and live deps, while D122/D124 already define atomic quiescent release for graph-registered view groups. An explicit topology group gives dynamic topics/views/routers real inspectable topology without changing protocol tiers/messages/ctx semantics or making data facts mutate topology invisibly.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D153","layer":"D145-D148 public API closeout / topology-process-remote-worker slices","date":"2026-06-09","question":"What concrete first public API shapes close the D145-D148 follow-up design without reopening broad architecture?","decision":"Close the next D145-D148 implementation choices as narrow public API shapes. (1) Mount/release topology lifecycle uses lifecycle events plus optional quiescent release handles/groups: node-released and mount-changed are observeTopology read-only egress facts over the existing graph registry; release groups are labels/handles over already registered node ids, not registries; successful release is atomic/quiescent and may make nodes disappear from describe/find/profile/checkpoint only after commit; node-released payloads carry the final known path/factory/deps, and mounted-child forwarding is part of the mount-changed slice rather than an implicit first-slice widening. (2) Process orchestration proceeds bundle-first: implement D136 ProcessBundle before DSLs; DSLs compile to bundle wiring, and effect runners later consume effect-request facts and publish visible result/failure/cancel/timeout command facts without owning process state, private timers, hidden maps, or restore. (3) Remote dispatcher helper proceeds as a remoteCall plus remoteResponder pair over D134/D147 wireBridge facts: operation names are application facts, requestId is logical call correlation, bridge seq/cursor/ackForSeq remain transport receipt/correlation metadata, timeout is a local status/error fact unless an explicit cancel request is sent, and first-slice handlers are sync graph-dispatched functions; auth, discovery, schema-codegen, async handler runtimes, and remote ordinary deps stay deferred or spec-gated. (4) WorkerPool customization proceeds as graph/dispatcher-owned backend capability selected by helper or construction options; workerDerived/worker_derived remains the primary API, jobs are cold owned compute work after completion fencing is installed, cancellation correctness is stale-completion fencing with optional cooperative hard cancel, and no public imperative submit API is exposed.","rationale":"D145-D148 already lock the broad architecture; this decision closes the remaining API-polish choices so implementation can proceed without repeatedly reopening topology ownership, workflow-engine, remote-RPC, or scheduler debates. The choices preserve D39/R-describe and D51/R-edges-derived for topology, D136/D146 facts-plus-reducer process ownership, D134/D140/D141/D147 wire-bridge request/response boundaries, and D137-D139/D148 helper-first WorkerPool semantics. No protocol tier/message/ctx semantics, structural parity requirement, hidden EventEmitter/processManager/GraphSpec owner, remote ordinary dep, or public scheduler submit surface is added.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D154","layer":"L6 process cursor vocabulary / ProcessBundle","date":"2026-06-09","question":"What does the public ProcessBundle cursor node mean, and may it double as a consumer/read pagination offset?","decision":"ProcessBundle public `process.cursor` is a process-owned ledger high-water position after a command attempt closes. It is not a consumer/read cursor, pagination offset, replay checkpoint, or external subscription position. Cursors embedded on status, audit, error, event, and effect-request facts are provenance positions for those facts at the moment they were emitted. The standalone `process.cursor` projection is the final high-water position after the whole command attempt, including audit/error/status bookkeeping, has closed. Future consumer/read offsets must use distinct names and APIs rather than overloading `process.cursor`.","rationale":"D136/D146 define ProcessBundle as visible command/event/state/audit/effect/status/error facts, not a workflow engine or storage owner. The existing TS bundle already exposes per-fact cursor provenance plus a standalone cursor projection; without a vocabulary lock, callers could treat `process.cursor` like append-log pagination and accidentally couple read-consumer progress to process-owned ledger progress. Keeping consumer offsets distinct preserves single source of truth, avoids storage/restore ownership drift, and leaves future process fact readers free to define their own read cursor API without changing the D136 bundle semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D155","layer":"D147/D148 implementation shape / remote responder and worker backend","date":"2026-06-09","question":"What narrow implementation shape keeps remoteResponder and workerDerived from becoming hidden imperative channels?","decision":"remoteResponder must consume only inbound-only wireBridge request facts, never the bridge events node that also depends on outbound command facts. It may emit RemoteCallResponse facts only through a declared responseCommands node that is wired into bridge.command as a real graph edge; direct hidden command publication from responder internals is rejected. remoteCall result projections ignore stale or unknown responses unless their requestId is currently pending; implementations must not buffer unknown responses for future calls, and duplicate requestId registration must keep pending seq/request indexes coherent. Worker backend customization remains a graph/dispatcher-owned capability, not a public imperative submit API: public worker jobs may carry only owned input plus the static compute closure, while completion is routed through a helper-owned opaque one-shot settlement capability installed after graph-local fencing. Ctx, Node handles, graph mutable state, AnyValue/host objects, live topology, original wave pending/diamond state, and public job.complete/job.error-style mutation methods must not cross the worker boundary.","rationale":"D147/D153 already lock remote dispatcher helpers as wireBridge request/response facts, and D148 locks WorkerPool customization as helper-first backend capability. The remaining implementation risk is accidentally expressing those helpers as hidden command emitters, cyclic bridge topology, future-response buffers, or scheduler-like completion callbacks. This lock keeps topology explainable by describe, preserves R-edges-derived/R-no-imperative/R-no-raw-async/R-dispatch-all, and leaves async handler runtimes, auth/discovery/schema codegen, remote ordinary deps, broad scheduler controls, and hard cancellation as later design-gated surfaces.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D156","layer":"L6 process/effect-runner outcome command vocabulary / B85","date":"2026-06-09","question":"What exact public TS effect-runner command-fact vocabulary and bundle shape should close D146 over the D136 ProcessBundle without creating a hidden async workflow runtime?","decision":"A ProcessBundle effect runner is a graph-visible outcome-command adapter bundle, not an async handler runtime. The first public TS shape consumes a ProcessBundle.effectRequests node plus explicit outcome fact nodes and projects those outcomes into visible ProcessCommand facts on a runner.commands node, which is then declared as a real graph dep of the ProcessBundle command node. The locked outcome vocabulary is effect.result, effect.failure, effect.cancel, and effect.timeout; each command payload carries the source effectId, effectType, optional processId/correlationId/causationId, and the outcome-specific value/error/reason. The runner may expose requests, outcomes, commands, status, and errors nodes plus a graph-owned release handle; it must not own process state, private in-flight maps as authority, raw async handlers, private retry timers, hidden subscriptions, storage restore/hydration, or a workflow engine. EnvironmentDrivers, outbound/session adapters, retry/backoff/timeout helpers, and wireBridge helpers may feed the outcome fact nodes at the boundary, but the runner itself remains declared graph wiring over visible facts.","rationale":"D136/D146 already require effect runners to consume effect-request facts and publish result/failure/cancel/timeout command f
