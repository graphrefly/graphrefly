acts back into the bundle, but B85 left the public command vocabulary and API shape unpinned. The outcome-command adapter shape preserves R-describe/R-edges-derived because every runner edge is a real dep, preserves R-no-raw-async because async work lives in adapter/session/driver boundaries, and avoids reviving processManager/PipelineGraph-style hidden runtimes. It also keeps process cursor semantics from D154 intact: runner commands are ordinary process commands whose downstream reducer/audit/cursor effects belong to ProcessBundle, not to the runner.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D157","layer":"L6 remoteResponder responseCommands lifecycle / B86","date":"2026-06-09","question":"How should remoteResponder detach its responseCommands source from a long-lived wireBridge command node when the responder is released?","decision":"remoteResponder responseCommands attachment is graph-owned and releasable. A responder bundle owns a graph topology/release group over its helper nodes and exposes a runtime-idiomatic release handle. Release is idempotent and quiescent-only: before releasing responder nodes, it detaches the responder.responseCommands node from bridge.command by rewiring bridge.command to the remaining attached command sources through the same declared-dep command-source fan-in used at attach time. The detach and release path must be rollback-safe: if detach or release fails, the bridge command deps and attachment memo remain consistent so the responder can be retried or still used. This lifecycle removes only the graph edge and helper topology; it emits no protocol messages, creates no second topology store or hidden EventEmitter, and does not publish bridge commands imperatively.","rationale":"D155 correctly forced remoteResponder responses through a real responseCommands -> bridge.command edge, but B86 identified the lifecycle gap: long-lived bridges with dynamic responders need old responder command sources to leave bridge.command deps. Detaching through the existing graph rewire/release machinery preserves R-edges-derived and R-describe, keeps D145/D152/D153 graph-owned lifecycle semantics, and avoids hidden registries or ad-hoc dispose methods that bypass graph ownership. This is a helper lifecycle/API lock only; it does not change wire protocol envelopes, seq/cursor/requestId semantics, protocol tiers/messages, or remote ordinary dep boundaries.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D158","layer":"L6 semantic memory layering / CSP-9 B63","date":"2026-06-09","question":"How should GraphReFly layer semantic memory so reusable building blocks do not collapse into a vertical agentic-memory runtime?","decision":"Semantic memory is split into horizontal patterns and vertical solutions. Passive storage memory remains under storage only. Reusable semantic memory vocabulary, knowledge-graph reducers, vector/retrieval/ranking patterns, and retention/consolidation command vocabulary may live under patterns when they expose ordinary graph nodes, declared deps, and graph-visible facts. Agentic memory, reflection loops, prompt assembly, LLM extraction/summarization, and harness/data-agent integrations live under solutions or adapters. No semantic memory surface owns storage restore/hydration, hidden schedulers, GraphSpec/Actor/factoryTag runtime ownership, or protocol semantics.","rationale":"D125 already separates reusable application/pattern layers from vertical solutions and keeps storage passive. Semantic memory has clear reusable building blocks across agentic-memory, harness, data-agent, inbox, and knowledge-graph use cases, but the old root memory stack mixed graph subclasses, imperative mutation, GraphSpec-era metadata, hidden runtime ownership, and LLM-facing orchestration. Splitting horizontal patterns from vertical solutions preserves F-NO-WEDGE-CUT, graph-visible topology, and declared deps while giving agentic-memory room to compose opinionated extraction, retrieval, reflection, and harness flows without turning those choices into lower-layer primitives.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D159","layer":"L6 / messaging vocabulary and explicit validation / CSP-10 B74","date":"2026-06-09","question":"Should Rust expose TopicMessage/JsonSchema/standard-topic vocabulary and validation as public messaging API?","decision":"Rust should expose TopicMessage<T>, JsonSchema, standard topic string constants, and explicit pure JSON-schema validation helpers under messaging. This is core reusable messaging/hub vocabulary, not structural TS parity and not a semantic-memory solution runtime. Validation is caller-invoked, synchronous, side-effect-free, and limited to JSON-like payloads; message buses and dynamic hubs do not automatically enforce schemas. Schema metadata, expiresAt, correlationId, and TopicMessage metadata are application facts only and do not imply protocol messages, storage durability, restore/hydration, compatibility negotiation, retention, expiration scheduling, topic authorization, or schema registry ownership. Future schema registries, compatibility policies, retention/expiration engines, and semantic-memory pattern APIs require later design review.","rationale":"Messaging will underpin many GraphReFly patterns, so a passive envelope alone would force repeated follow-up patches. A C-lite API gives reusable patterns a stable message/schema vocabulary and explicit validation primitive while preserving D132/D135 graph-visible hub semantics, D158 layering, F-SYNC-CORE, R-no-imperative, and D24/D32 intent parity. Keeping validation explicit avoids hidden hub/runtime ownership and prevents schema metadata from becoming protocol, storage, or solution-layer behavior.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D160","layer":"L1.5/L3 reactive data structures persistence/checkpoint","date":"2026-06-09","question":"How should reactive data structures persist, checkpoint, and restore their materialized backend state without duplicating authority in ctx.state or storage-owned graph restore?","decision":"Reactive collection backends remain the single live materialized owner. Full collection contents must not be mirrored into ctx.state; ctx.state is limited to runtime bookkeeping such as cursors, dedupe windows, temporary progress, or policy state. Graph checkpoint may capture a reactive collection backend only through an explicit collection-owned checkpoint contributor/factory-owned backend-state hook that serializes the backend at checkpoint time and seeds the backend at restore time; snapshot node cache is not authoritative. Durable collection persistence is a separate data-structure/persistence adapter over collection delta/snapshot facts, typically snapshot plus append-log/change-log, exposing ready/status/error/cursor DATA facts. Storage may load/store collection snapshots/logs as passive data, but does not own graph restore, hydration semantics, WAL replay-as-restore, or hidden graph mutation. Large/domain collections should treat persistence snapshots/logs as durable truth and graph checkpoint as optional acceleration or explicit non-restorable/reference metadata; backend data must never be silently dropped.","rationale":"D60 makes the backend the single materialized state and rejects ACC/state-node duplication. D83/D90/D116 make graph checkpoint a strict JSON runtime snapshot, while D57/D103 keep storage passive and separate from restore. KG and semantic memory need data-structure-backed durable truth, not large ctx.state blobs. The hybrid keeps live authority single, makes checkpoint honest, and gives large collections a persistence path without changing wave protocol semantics.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D161","layer":"L1.5/L3 reactive data structures storage/restore API / B87","date":"2026-06-10","question":"What layered API should TS use for unified reactive collection storage and restore without making storage own graph restore or conflating persistence cursors with domain cursors?","decision":"Reactive collection storage/restore uses four explicit layers. (1) Passive load/fold helpers read already-chosen storage tiers and return a CollectionRestoreState or an explicit empty state; they perform async I/O outside the graph and never mutate graph topology. (2) restoreReactiveList/restoreReactiveMap/restoreReactiveIndex/restoreReactiveLog are synchronous collection-owned restore helpers that seed a reactive* backend from a CollectionRestoreState; graph/name options are optional, so the same helper can produce graphless standalone nodes or graph-registered delta/snapshot nodes. (3) persistReactiveCollection is a graph-bound sidecar adapter over an existing reactive* collection's delta/snapshot facts; it writes passive snapshot/change-log frames asynchronously and exposes ready/status/error/persistence.cursor DATA facts plus flush/dispose controls. The persistence cursor is adapter write progress only, not a KG/CQRS/wireBridge/domain replay cursor and not collection backend authority. (4) openPersistentReactiveList/openPersistentReactiveMap/openPersistentReactiveIndex/openPersistentReactiveLog are convenience wrappers that compose passive load, restoreReactive*, and persistReactiveCollection in that order. Snapshot storage is required for the durable baseline; change log is optional. Missing snapshot plus missing/empty change log means an explicit empty state, and wrappers use their provided initial value. Snapshot cadence is adapter policy (for example manual or every-N changes); no full snapshot is written for every delta by default. Default frames use strict JSON and versioned format tags; host-value same-process restore is out of v1. Corrupt snapshots/changes fail honestly by default. Single-writer per storage prefix is the v1 assumption; multi-writer conflict/merge is deferred. flush only means the adapter queue drained to settled storage promises, not fsync/remote durability. Collection clear/delete are ordinary change frames; physical compaction/truncation is a separate helper. restore never reads storage, persist never restores, and storage never owns graph restore, hydration, WAL replay-as-restore, or hidden graph mutation.","rationale":"D160 separates collection-owned backend restore hooks, durable collection persistence, and passive storage. The four-layer shape keeps each responsibility inspectable and testable: passive loading owns async I/O; restoreReactive* owns backend seeding; persistReactiveCollection owns graph-visible durability progress; openPersistentReactive* owns ergonomics only. Optional graph/name on restore helpers preserves graphless composition while keeping graph-registered restore available for checkpoint/describe/KG use. Exposing persistence.cursor as a namespaced adapter fact prevents collision with domain cursors. Strict JSON frames, explicit empty state, honest corruption failure, single-writer scope, and limited flush semantics avoid quietly turning collection persistence into a database, storage-owned hydration system, or graph lifecycle restore surface.","supersedes":[],"status":"locked","session":"DS-1"}],"phases":[{"id":"CSP-0","title":"spec finalize (rules + .proto IDL + .tla + conformance scenarios)","status":"done","deps":[],"sessions":["DS-1"],"gap":false,"note":"DONE 2026-05-28: 52 rules (B7 migration), protocol.proto IDL (DR-2), conformance C-1..C-5 detailed, formal modules wave_xgraph/wave_async/wave_async_paused (C-1/C-4/C-2) TLC-green + existing wave_protocol (C-3/C-5); dashboard gate green. Rules status=draft until CSP-1+ impl arms flip them active. Unblocks CSP-1/CSP-5/CSP-7"},{"id":"CSP-1","title":"TS substrate: node/dispatcher/pool(LocalSync+LocalAsync)/wave protocol","status":"impl","deps":["CSP-0"],"sessions":["DS-1"],"gap":true,"note":"kernel landed @graphrefly/ts 2026-05-28 (packages/ts): node + dispatcher + LocalSync/LocalAsync pools + wave protocol + lifecycle + control(PAUSE/async) + batch + dynamicNode; 36 tests + tsc + tsup(ESM/CJS/DTS) + biome all green. /qa DONE 2026-05-28 (41 tests; fixes EC1/EC2/EC3/BH1/BH3/BH6). Pending: CSP-3 conformance to flip draft rules active. Deferred refinements B8/B9 (impl polish). B10 (re-entrancy reject, D37/R-reentrancy) + B11 (up-at-source, D38/R-up-at-source) LANDED 2026-05-28 (node.ts _runWave guard + _up terminus rule; reentrancy.test + up-source.test). R-reentrancy/R-up-at-source flipped active via C-6/C-7 TS arm"},{"id":"CSP-2","title":"TS graph layer: graph/sugar(8 verb)/operators/inspection(describe·observe·profile)","status":"impl","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"graph layer landed @graphrefly/ts 2026-05-28: Graph + 8-verb sugar (node/state/producer/derived/effect/batch/mount + StateNode.set) with D27 sugar→ctx-fn wrapping + D30 throw→ERROR boundary; core operators map/filter/scan/merge/take/distinctUntilChanged (D6 real factory names); inspection describe (D39 flat snapshot + explain + mount ::) / observe (read-only enveloped egress) / profile (opt-in dispatcher-recorder, counters off the thin node). 76 tests + tsup(ESM/CJS/DTS) green. C-6/C-7 TS conformance green. /qa DONE 2026-05-28 (77 tests; fixes A-1 observe :: subtree boundary, A-2 up-INVALIDATE via _down for batch/pause consistency, D-2 profile totalInvokes graph-scoped; spec precision D-1 R-reentrancy/C-6 'located at a node on the cycle' + D-3 R-observe/D19 'read-only≠activation-free'; QA-deferred → B12/B13). rust/py arms (CSP-5/7) + R-describe/observe/profile per-language. Inspection streaming/live-topology deferred to viz | D43 (2026-05-29): the 6 operators refactored from g.* methods to free-standing factory definitions instantiated via the generic g.initNode funnel (CSP-2.6); describe/observe/profile inspection UNCHANGED (_entries-based)."},{"id":"CSP-2.5","title":"substrate rewire (setDeps/addDep/removeDep, intra-graph; R-rewire active via C-8)","status":"impl","deps":["CSP-1"],"sessions":["DS-1"],"gap":true,"note":"D40 Catalog-first prerequisite: rewire is SUBSTRATE (not sugar) — needed by higher-order operators (mergeMap/switchMap/concatMap/exhaustMap/flatMap = runtime inner-subscription). SEMANTICS LOCKED D42 (ratifies port-model Q1–Q7 + clean-slate floor; SD-1 required-fn; SD-2 cross-axis formal before active). SPEC-AMEND DONE 2026-05-28: R-rewire refined; formal/wave_rewire.tla (per-node Q1–Q7 + rewire×INVALIDATE + rewire×terminal) TLC-green 603k states, 2 new invariants mutation-verified; C-8 finalized. TS IMPL LANDED 2026-05-28: setDeps/addDep/removeDep on @graphrefly/ts Node (dynamic-index dep dispatch for surgical reorder, fn-swap re-register, push-on-subscribe for added cached dep, drain-on-remove, Q6 auto-settle, all D42 rejects); C-8 TS arm GREEN + rewire.test.ts (12 unit) → 91 tests pass, lint clean. B14 DONE 2026-05-28: formal/wave_rewire_emit.tla (rewire×equals + rewire×multi-sink) TLC-green 3003 states, 2 invariants mutation-verified — SD-2 cross-axis formal gate FULLY met (all four cross-axes modeled). R-rewire FLIPPED ACTIVE 2026-05-28 on the TS-arm-green+formal precedent (R-reentrancy/R-up-at-source/R-dirty-before-data). /qa DONE 2026-05-28: 3 fixes landed (P2 atomic multi-add settle — fn no longer fires on a partial added-dep view; D1 rewire settle emits DIRTY-before-DATA via the new _settleRewire; P1 zero-dep auto-settle RESOLVED routed through _down for pause/batch safety) → 94 tests pass, lint+build clean; 4 edges deferred to backlog B16–B19 (throw-during-add rollback, async late-ctx routing, paused-coalesce flag, rewire×batch) + B15 (handle GC). REMAINING: rust/py rewire arms (land in CSP-5/7 substrate) + graph-layer mount-aware g.rewire wrapper (CSP-2.x). TS substrate rewire = DONE"},{"id":"CSP-2.6","title":"sources + operator-opts factory base","status":"impl","deps":["CSP-2"],"sessions":["DS-1"],"gap":true,"note":"D40: per-language binding layer (feedback_async_sources_binding_layer). LANDED @graphrefly/ts 2026-05-29 (D43): operators (incl th md → rules.jsonl/guide.jsonl","state":"open","trigger":"CSP-0 spec finalize","lang":"all","ref":"D14"},{"id":"B8","title":"batch full per-item coalescing (downstream fn receives [v1..vK]); CSP-1 kernel ships last-value coalescing","state":"deferred","trigger":"consumer needs per-item batch-drain accounting","lang":"ts","ref":"D12,R-batch-coalesce"},{"id":"B9","title":"PAUSE resumeAll R2.6.1 pre-pause baseline-equals replay (cache advances mid-pause); CSP-1 kernel buffers+replays on resume without mid-pause cache advance","state":"deferred","trigger":"resumeAll equals-collapse fidelity needed","lang":"ts","ref":"R-pause-modes"},{"id":"B10","title":"re-entrancy / synchronous feedback-cycle reject: a compute node fn that re-drives its own dep mid-wave is a wave-level ERROR, detected node-locally via _insideRunWave (surfaced QA on @graphrefly/ts CSP-1)","state":"open","trigger":"design LOCKED (D37) + spec-amended (R-reentrancy draft + conformance C-6 + formal wave_reentrancy.tla TLC-green, mutation-verified); NOW implement the in-wave reject in CSP-1 substrate + graph-layer throw→ERROR (D30) in CSP-2, drive C-6 green per arm, then flip R-reentrancy/C-6 active","lang":"all","ref":"D37,R-reentrancy,C-6"},{"id":"B11","title":"upstream control at a depless source: INVALIDATE-up self-invalidates + cascades down (honor invalidate-request); DIRTY/TEARDOWN-up drop","state":"open","trigger":"design LOCKED + spec-amended (D38 / R-up-at-source draft / conformance C-7 / formal wave_up_source.tla TLC-green); NOW implement the terminus rule in CSP-1 substrate _up (depless source: INVALIDATE→self _invalidate+down-cascade, DIRTY/TEARDOWN→drop) + guard opt-out, drive C-7 green per arm, then flip R-up-at-source/C-7 active","lang":"all","ref":"D38,R-up-at-source,C-7"},{"id":"B12","title":"CSP-2 inspection follow-ups (QA-deferred 2026-05-28): profile metric completeness (emits/resolved/errored via observe-aggregation — impl ships invokes+duration+status only); describe explain-mode is mount-blind (single-graph; a cross-mount explain returns partial); observe non-activating tap option (observe currently activates cold nodes, D19-clarified + accepted)","state":"deferred","trigger":"a consumer needs richer profile metrics / cross-mount explain / non-perturbing observe","lang":"ts","ref":"D39,R-profile,R-describe,R-observe"},{"id":"B13","title":"CSP-2 operator semantics follow-ups (QA-deferred 2026-05-28): scan/distinctUntilChanged accumulator resets on deactivate→reactivate (RAM-consistent per R-rom-ram; add ctx.state.persist opt-in if a consumer needs cross-reconnect continuity); merge drops RESOLVED-absorbed re-emits (changes-only stream; add equals/emitResolved option if needed)","state":"deferred","trigger":"a consumer needs persistent operator accumulators / RESOLVED-passthrough merge","lang":"ts","ref":"D6,R-rom-ram"},{"id":"B14","title":"rewire cross-axis formal: model rewire×equals (R-equals output DATA→RESOLVED absorption) + rewire×multi-sink (one node's ≥2 downstream observers) — the downstream-emit dimension wave_rewire.tla omits","state":"done","trigger":"DONE 2026-05-28 via the focused companion module formal/wave_rewire_emit.tla (TLC-green 3003 states; CacheMatchesLastData + MultiSinkConsistent mutation-verified load-bearing) rather than a full wave_protocol.tla SetDeps integration — the focused-module convention satisfies the SD-2 'cross-axis modeled' bar. All four D42 cross-axes (INVALIDATE/terminal/equals/multi-sink) now formal. OPTIONAL deeper follow-up (NOT gating): integrate SetDeps into wave_protocol.tla for rewire×{the full protocol} composition","lang":"all","ref":"D42,R-rewire,C-8,SD-2"},{"id":"B15","title":"rewire fn-swap handle GC: each setDeps/addDep/removeDep re-registers the fn → a new dispatcher handle; old handles linger in the FactoryRegistry (no unregister). Bounded today, but CSP-2.7 higher-order operators (mergeMap/switchMap) rewire frequently → registry growth — DONE 2026-05-30 (@graphrefly/ts /dev-dispatch + /qa): dispatcher PoolTable free-list (register reuses a freed handleId before growing; unregister tombstones the slot → closure GC + id reuse, bounded to peak-live) + Dispatcher.unregister(handle) (also drops the profile stat UNCONDITIONALLY per QA F2.1 so a reused id never inherits a prior tenant's counters); node._rewire fn-swap now register-new-then-unregister-old. Safe per D22 single causal domain + D37 (no mid-fn self-rewire). Tests: dispatcher.test.ts (5, incl F2.1 stat-clear-when-recording-off) + rewire.test.ts B15 integration (50 swaps → registry bounded), mutation-verified load-bearing. 130 tests + lint + build green. Unblocks the *Map chain (ctx.rewireNext → C-11).","state":"done","trigger":"before CSP-2.7 higher-order operators ship (frequent rewire), or if a long-running graph's registry growth is observed; add dispatcher.unregister(handle) + call it on fn-swap","lang":"ts","ref":"D42,R-rewire,R-dispatch-all"},{"id":"B16","title":"rewire robustness: if an added dep's push-on-subscribe recompute THROWS (a re-entrant rewire attempt, or the fn throws) mid-_subscribeDepAt, the new subscription's unsub is not yet recorded → subscription leak + half-applied rewire (arrays installed, atomic settle skipped). PRE-EXISTING property of _subscribeDepAt/_activate (subscribe() runs the sync push before returning the unsub), not new to rewire; rewire just widens the surface. RUST ARM has the SAME class (CSP-6 /qa 2026-05-30): a panic mid-rewire_apply — an added dep's activation fn (subscribe_dep→activate→run_wave) or a removed dep's onDeactivation hook (u()→deactivate→user closure) — leaves a half-installed subscription (the added dep's unsub not yet recorded) + half-applied state (fn-swapped to the new fn but dep arrays still old-shape, since the fn-swap precedes the removed-drain). graphrefly-rs node.rs rewire_apply. The in_dep_mutation-stuck wedge (a DISTINCT, Rust-only facet, absent in TS due to its finally) was FIXED in the same /qa (DepMutationGuard, QA-F1); this B16 leftover (sub-leak + half-applied arrays on a rewire-internal panic) remains deferred in BOTH arms. After the fix the rewiring node goes ERROR via the wave-owner catch when blame lands on it, but when blame lands elsewhere (an added producer that ran) it survives non-terminal with the half-applied arrays.","state":"deferred","trigger":"a real consumer triggers rewire/throw from within a push-driven recompute (or a user onDeactivation hook / added-dep activation fn panics mid-rewire); harden with a try/rollback around the added-dep subscribe loop (TS) / perform the full dep-array rebuild BEFORE any re-entrant u()/subscribe and roll back on a rewire-internal panic (Rust), or restructure subscribe() to hand back the unsub before the sync push","lang":"all","ref":"D42,R-rewire,/qa-2026-05-28,/qa-2026-05-30"},{"id":"B17","title":"rewire × async-pool late ctx: a deferred async invocation whose ctx.up/ctx.down fires AFTER the node was rewired routes to the NEW dep set (ctx closes over `this`), not the deps live when the fn started. Arguably correct ('the node is whatever it is now') but unmodeled — R-rewire vs R-async-paused interaction","state":"deferred","trigger":"a consumer observes a surprising late-emit routing after rewiring an async-backed node; decide + spec-note the scoping (live-edge vs wave-snapshot) and add a conformance scenario","lang":"all","ref":"D42,R-rewire,R-async-paused,/qa-2026-05-28"},{"id":"B18","title":"rewire × paused coalesce flag: _pausedDepWaveOccurred is not reconciled when a rewire removes the very dep whose pending wave set it → one spurious post-RESUME recompute (self-heals on next settle, no corruption)","state":"deferred","trigger":"observed spurious recompute after resume-following-rewire; clear/recompute _pausedDepWaveOccurred consistency in _rewire","lang":"ts","ref":"D42,R-rewire,R-pause-modes,/qa-2026-05-28"},{"id":"B19","title":"rewire × batch: a tier-3 wave deferred into an open batch() (deferToBatch) then a rewire of the same node within the same batch → __commitBatchedWave commits the PRE-rewire value/fn against the rewired node at commit; ordering vs the rewire's atomic settle undefined. wave_rewire.tla models no batch axis","state":"resolved","trigger":"RESOLVED by D67/R-rewire-batch-boundary + C-22: TS and Rust arms pass; py remains tracked by conformance/CSP-7. Reopen only if py surfaces a spec/code conflict or a new batch/rewire axis appears.","lang":"ts","ref":"D42,R-rewire,D12,/qa-2026-05-28","note":"Original TS rewire×batch undefined-order backlog is closed: batch commit precedes rewire; Rust implemented the same boundary on 2026-06-01."},{"id":"B20","title":"async-pool source ignores pausable:false carve-out: _shouldBufferOnPause buffers async-pool late emits whenever paused, even when pausable===false (contradicts R-pause-modes 'false: ignore PAUSE/RESUME')","state":"done","trigger":"PREREQUISITE for any pool:'async'+pausable:false source (D43). packages/ts node._shouldBufferOnPause checks only resumeAll + _isAsyncPool, never the pausable===false carve-out; _pauseAcquire populates the lockset unconditionally so the branch is reachable. Resolve before shipping such a source: either keep timer/interval on pool:'sync'+pausable:false (sync branch not gated -> keeps producing, spec-correct, D43 default) OR fix _shouldBufferOnPause to honor pausable===false -> route through /spec-amend + conformance (touches R-pause-modes/R-async-paused). — RESOLVED 2026-05-29 via D44 (/spec-amend): pausable mode is the OUTER gate over R-async-paused. Amended R-pause-modes + R-async-paused; formal wave_async_paused.tla parameterized by Mode+IsLeaf with invariant NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified; _shouldBufferOnPause fixed (false→never buffer; true→buffer only async COMPUTE deps>0; resumeAll→buffer all); C-9 (pausable:false ignores PAUSE) + C-10 (true-mode async leaf source delivers immediately — B20's twin, also fixed) ts:pass; 108 tests + lint + build green. rust/py arms land in CSP-5/7 (C-9/C-10 rust/py todo).","lang":"ts","ref":"D43,R-pause-modes,R-async-paused,DR-3"},{"id":"B21","title":"R-no-raw-async has no automated enforcement in packages/ts: scripts/check-layer-boundary.ts scans the retired root src/ (D201), biome.json has no noRestrictedGlobals; CSP-2.6 sources introduce the first raw setTimeout/Promise","state":"done","trigger":"first async source lands (CSP-2.6/D43). Add a path-scoped lint confining raw setTimeout/setInterval/Promise/queueMicrotask to a sources/ dir (biome noRestrictedGlobals override or a packages/ts layer-boundary analog), else R-no-raw-async leaks anywhere in the clean-slate package. — RESOLVED 2026-05-29: added scripts/check-no-raw-async.ts (comment-aware scan of packages/ts/src, allowlist=graph/sources.ts only; matches setTimeout/setInterval/setImmediate/queueMicrotask/process.nextTick/new Promise/Promise.<combinator>/for await/async/await) wired into `pnpm lint` (+ lint:no-raw-async). Baseline green (sources.ts is the sole sanctioned boundary), teeth-verified (a probe setTimeout/new Promise is flagged). Matches the check-layer-boundary.ts custom-script precedent (biome GritQL/noRestrictedGlobals can't express the full R-no-raw-async surface). Add the pool/runner file to ALLOW when a real async pool (D20) lands.","lang":"ts","ref":"D43,R-no-raw-async,F-SYNC-CORE"},{"id":"B23","title":"wall-clock time-source primitive for time operators (delay/debounce(Time)/throttle(Time)/audit/timeout/bufferTime/windowTime): a resettable/cancellable timer source so these operators get elapsed-time without a raw setTimeout in the operator body","state":"resolved","trigger":"a consumer needs a wall-clock time operator; design a resettable/cancellable time-source (async confined to sources.ts, R-no-raw-async) or wait for a mature async pool (D20/B1). Until then the first CSP-2.7 cut ships only notifier-driven forms (sample/buffer/window). RESOLVED 2026-05-30 by D52: no new primitive needed — wall-clock time operators decompose into *Map(switchMap/exhaustMap/mergeMap/concatMap)+timer (the timer's onDeactivation clearTimeout = the reset/cancel) and buffer/window(notifier)+interval; probe-verified (switchMap+timer debounce, boundary-deferred cancel). They REJOIN the CSP-2.7 implementable catalog (per-language, no substrate change). The original 'design a resettable time-source primitive' framing is dissolved (stale premise: predated the D47 *Map landing).","lang":"ts","ref":"D46,R-no-raw-async,D20"},{"id":"B24","title":"rewire-deferred drain x batch/pause timing: R-rewire-deferred drains the ctx.rewireNext queue at the COMMITTED boundary (after batch() commit / final-lock RESUME), but wave_rewire_deferred.tla models the boundary as EndRun (insideRunWave false) WITHOUT a batch/pause-deferral axis (design-review option b)","state":"done","trigger":"DONE 2026-06-04 via /spec-amend: added R-rewire-deferred-committed-boundary (draft), C-25 (required; ts/rust/py todo), and formal/wave_rewire_deferred_committed.tla + cfg. This closes the spec/formal/conformance gap; runtime implementation remains tracked by C-25 arms.","lang":"all","ref":"D47,D67,R-rewire-deferred,R-rewire-batch-boundary,C-25"},{"id":"B25","title":"graphrefly-rs: a panicking user fn corrupts wave-flags on the unwind path (source down() + receive_from_dep leave emitted_dirty/dep_batch stale; only run_wave's own node is reset by WaveGuard inside_run_wave)","state":"done","trigger":"RESOLVED 2026-05-29 (CSP-5 control/terminal slice, /dev-dispatch) — chose 'catch at a single wave-owner boundary and reset the touched set' (the second listed option; user-approved Phase 2). A thread-local WaveScope {owner, touched: Vec<Core>, blamed} is installed by the outermost public mutating entry (subscribe/down/up/set via with_wave_owner); the cascade runs under catch_unwind. Every node that mutates a transient wave-flag enrolls in touched (receive_from_dep / down / run_wave). On a caught panic, reset_wave_flags() restores each touched node to its between-wave baseline (inside_run_wave/emitted_dirty/emitted_tier3/pending/dep_batch/dep_dirty), leaving PERSISTED state (cache/dep_prev/dep_has_data/status/ctx.state) intact; then [[ERROR,e]] is emitted from blamed (the innermost fn that ran = a node ON the cycle, D30). The decentralized RAII alternative was rejected (can't cleanly reset dep-level dep_dirty/pending that span multiple receive calls). Teeth-verified: disabling the emitted_dirty reset makes conformance.rs::c6 fail (source drops its leading DIRTY). The WaveScope is forward-load-bearing — the same committed wave boundary batch (D12) + ctx.rewire_next deferred drain (D47) will reuse. Per-language impl (D24), no spec-amend/D#. node.rs + tests/conformance.rs::c6.","lang":"rust","ref":"D30,D37,R-dirty-before-data,CSP-5,C-6"},{"id":"B26","title":"formal cleanup: sweep the now-dead perSourceEmitCount ghost var in wave_protocol.tla — write-only since D49 removed its only reader (EqualsFaithful); decl/init/var-list/increment sites remain, accurately annotated at ~line 378","state":"deferred","trigger":"a future wave_protocol.tla pass; PURE-COSMETIC (no behavior/correctness impact, all 16 MCs green with it present). Removal touches ~6 sites + re-runs the 16 wave_protocol MCs; not worth a standalone pass.","lang":"all","ref":"D49,R-resolved-undirty"},{"id":"B27","title":"D49 TS substrate impl -- NEXT /dev-dispatch (packages/ts): remove auto-equals-substitution per D49/R-resolved-undirty (Opt-3). Queued continuation of the D49 spec-amend; spec + formal are already DONE.","state":"done","trigger":"next chat session, via /dev-dispatch on packages/ts. STEPS: (1) node.ts -- remove the DATA->RESOLVED equals-substitution (~lines 846-849: if dataCount===1 && _hasData && _equals(cache,v) -> emit RESOLVED) so every value-occurrence emits DATA; remove NodeOptions.equals + the _equals field + defaultEquals; KEEP every undirty RESOLVED path (filter-reject/no-emit, zero-dep un-dirty ~421, INVALIDATE-no-populate ~527, batch-rollback balance ~1053) -- those are R-resolved-undirty (substrate-synthesized). The tier-3 exclusivity guard (~814-820) stays, re-justified as occurrence(>=1 DATA) XOR undirty(1 RESOLVED). (2) drive conformance C-12 green (fromIter([1,1,1])->3 DATA; take(3)->[1,1,1]; filter-reject-all->synthesized undirty RESOLVED, no wedge; distinctUntilChanged->[1,2] opt-in dedup) -> flip R-resolved-undirty draft->active. (3) landed operators: distinctUntilChanged is THE dedup primitive (own eq via ctx.state, unchanged); map/filter/scan/take/merge now emit DATA on unchanged output (behavior change) -- fix any test asserting RESOLVED-on-unchanged. (4) FOLD packages/ts/src/__tests__/_probe.test.ts (the fromIter([1,1,1])/take(3)/state-set-same probes that surfaced this) into C-12 regression tests, then remove _probe.test.ts. (5) rust/py substrate arms + C-12 rust/py (CSP-5/7). THEN CSP-2.7 Slice A resumes correct-by-construction (occurrences are DATA -> take/scan count occurrences). Run /qa after. — DONE 2026-05-29 (/dev-dispatch TS arm): node.ts removed equals-substitution (NodeOptions.equals/_equals/defaultEquals deleted) + ADDED substrate-synthesized undirty RESOLVED (_emittedSettleThisWave flag; status resolved/sentinel by cache freshness; ASYNC-pool exempt -- deferred fn-return != reject, else premature diamond settle C-4); operators.ts unchanged (already D49-style); C-12 ts:pass (folded _probe + trashed); R-resolved-undirty flipped active; dynamicNode Option A (read-mask -> B28); 117 tests + lint + build green. rust D49 substrate ALREADY landed (CSP-5); C-12 rust/py + py substrate pending CSP-6/7. /qa next.","lang":"ts","ref":"D49,R-resolved-undirty,C-12"},{"id":"B28","title":"dynamicNode unread-dep silence via read-mask (D47 'track=read-mask'): under D49 a dynamicNode re-emits as DATA on an unread-dep change (no equals-absorption), losing its auto-quiet-on-unread-deps property; restore via a substrate read-mask that suppresses a wave driven only by untracked deps","state":"resolved","trigger":"a consumer needs dynamicNode to stay silent when only unread deps change (today: pair with distinctUntilChanged). Design via /design-review + /spec-amend (amend R-dynamic-node behavior + add a conformance scenario + formal); D47 frames track() as a read-mask. NOT in D49/B27 scope (D49 chose opt-in dedup everywhere, user-approved Option A 2026-05-29) RESOLVED 2026-05-30 by D53: substrate read-mask REJECTED -- dynamicNode auto-quiet is opt-in composition (dynamicNode + distinctUntilChanged), consistent with D49. The read-mask (A) was verified SOUND (causal-irrelevance absorption) but is documented + re-openable, not implemented (noise-not-correctness, trigger-gated, F-PERF). Zero behavior change; R-dynamic-node statement updated.","lang":"all","ref":"D49,D35,D47,R-dynamic-node,R-resolved-undirty"},{"id":"B29","title":"graphrefly-rs D30 catch depends on panic=unwind: the CSP-5 wave-owner catch_unwind converts a feedback-cycle / user-fn panic -> [[ERROR,e]] (the Rust throw analogue). Under a consumer's panic=abort release profile catch_unwind is a no-op and the process aborts instead -> the C-6 mechanism fails (no ERROR, hard crash on a sync feedback cycle)","state":"open","trigger":"before the Rust pre-1.0 release, or as soon as a consumer ships with panic=abort. Two-part fix: (1) NEAR-TERM document the panic=unwind requirement on the crate (and consider a compile-time assert / build.rs guard so panic=abort is caught loudly). (2) CLEANER LONG-TERM once the Rust graph layer (CSP-2-rs) lands: give value-level sugar a Result-returning fn channel (Err -> [[ERROR,e]] WITHOUT panic), reserving panic-catch only for the reentrancy guard + genuine substrate bugs. Constraint to weigh: R-sync-core's fn is Fn(&Ctx)->() (no Result today) and R-reentrancy mandates an UNWIND (the guard must throw, not gracefully return) -> panic-catch can be narrowed but not fully eliminated. Surfaced by the CSP-5 control/terminal slice /dev-dispatch (D30 catch landed via catch_unwind).","lang":"rust","ref":"D30,D37,R-reentrancy,R-sync-core,CSP-5,C-6"},{"id":"B30","title":"@graphrefly/ts node.ts _down lacks a terminal-is-forever guard at entry: a self-emit DATA via set()/ctx.down on a Completed/Errored node runs the DATA arm unconditionally and resurrects the node (overwrites cache, emits DATA). Only the COMPLETE/ERROR arms self-guard; terminal-is-forever is enforced only in _receiveFromDep — DONE 2026-05-30 (@graphrefly/ts /dev-dispatch + /qa): node._down gained an entry terminal-is-forever guard (if (_terminal !== undefined) return) so a post-terminal self-emit (state.set / ctx.down) is a no-op — DATA/RESOLVED/INVALIDATE had no entry guard before, only COMPLETE/ERROR self-guarded; matches the upstream _receiveFromDep guard + the Rust Core::down blanket guard (D17/R-terminal). lifecycle.test.ts B30 self-emit test, mutation-verified. NOTE: QA F1 (TEARDOWN-relay-past-COMPLETE) was mis-attributed to B30 — the drop is the pre-existing _receiveFromDep terminal guard, a separate spec gap filed as B33; QA F3.1 (rollback post-terminal RESOLVED) is unreachable (batch defers all tier≥3 incl COMPLETE, so a node cannot go terminal synchronously mid-batch). Both reverted; only the F2.1 stat-clear hardening landed (folded into B15).","state":"done","trigger":"the Rust arm fixed this in the CSP-5 control/terminal slice (node.rs Core::down early-returns when terminal — QA finding F, parity-consistent gap found in BOTH arms). Mirror in @graphrefly/ts: add an `if (this._terminal !== undefined) return;` (or per-arm guards on DATA/RESOLVED/INVALIDATE) at the top of _down so self-emission after terminal is a no-op (terminal-is-forever, R-terminal / D17). Low reachability (a state node explicitly completed then set()), but it is an active-rule invariant. Add a regression test (set on a terminal node is a no-op).","lang":"ts","ref":"D17,R-terminal,CSP-5"},{"id":"B31","title":"on_invalidate (+ on_deactivation) cleanup hooks accumulate across fn re-runs (push-only, cleared only on deactivate) -> the K-th INVALIDATE fires K hooks (unbounded growth + multi-flush). Parity-consistent: BOTH @graphrefly/ts and @graphrefly/rust","state":"done","trigger":"RESOLUTION CHOSEN 2026-05-29 (/qa finding E, user pick = option 1): clear-at-run-start + re-register (React effect-cleanup semantics) -- at run_wave start clear on_invalidate before the fn re-registers, so only the current run's hooks survive. DESIGN NUANCE to settle: on_deactivation may want DIFFERENT semantics per-hook (a fn that acquires a NEW resource each run + registers its release wants accumulate-all; a fn re-registering ONE logical cleanup wants clear-and-re-register). Route via /spec-amend (refine R-cleanup-hooks per-run lifecycle) + a conformance scenario, applied to BOTH arms together (NOT a unilateral per-arm patch). Not urgent (C-3 invalidates once, doesn't expose it). — DONE 2026-05-29 (/spec-amend, user-approved: on_deactivation UNIFIED with on_invalidate = clear-and-re-register both; no new D# = D28 clarification). R-cleanup-hooks amended (per-run lifecycle: clear both hook lists before each fn invoke, re-register from the fn body, superseded discarded WITHOUT firing per the onRerun-cut); C-14 added ts:pass+rust:pass. TS: _runWave clears both lists + effect sugar simplified (dropped register-once+ctx.state pattern → re-register every run, since the per-run clear makes accumulation impossible). Rust: run_wave clears both. Both teeth-verified (disable clear → C-14 flush=3 not 1). 123 TS + 19 Rust tests + lint/clippy/fmt green; dashboard gate green. py:todo (CSP-7).","lang":"all","ref":"D28,R-cleanup-hooks,C-14"},{"id":"B32","title":"@graphrefly/rust dispatcher Pool::fns (Vec<NodeFn>) only pushes, never removes -- a registered fn (capturing Node/Core handles) lives for the process; deactivate/drop never frees it, so the node's NodeInner never drops. Node:Clone (CSP-5) makes capturing handles-into-fns idiomatic (C-6 does it), so the leak bites harder","state":"done","trigger":"RESOLUTION CHOSEN 2026-05-29 (/qa finding H, user pick = option 3): slotmap/generational pool -- handle = (slot, generation); deactivate/drop recycles the slot, invoke validates the generation. Replaces the index-as-handle_id Vec. RUST-ONLY -- TS is UNAFFECTED (TS has its own FactoryRegistry; the pool/registry is a per-language impl detail D24; conformance does not test pool internals). Sibling of B15 (TS rewire fn-swap handle GC): same problem shape, separate code -- design together for consistency, fix separately. Trigger: before CSP-2.7 higher-order operators (frequent rewire/fn-swap) ship, or if a long-running graph's pool growth is observed. Pre-existing (dispatcher predates the control/terminal slice). — DONE 2026-05-29 (/dev-dispatch, Rust-only): dispatcher.rs Pool = slotmap {slots: Vec<Slot{f:Option<NodeFn>, generation}>, free: Vec<u32>}; register reuses freed slots, unregister frees+bumps-gen+recycles, invoke validates generation (stale handle -> silent no-op, forward-safe for the future async pool's deferred callbacks). UNREGISTER TRIGGER = NodeInner::Drop (the only point a node is truly gone; deactivate can't, the node doesn't hold its fn to re-register). KEY INSIGHT: the registering node isn't pinned by the pool (the fn captures UPSTREAMS, not self), so its Drop fires and unregisters, releasing the captured Core(s). CAVEAT: a fn capturing its OWN node is a genuine Rc cycle this can't break (pool keeps it alive -> Drop never runs) -- documented as a user-level self-cycle (Weak self-handle). HANDLE WIDENED to {pool_id, handle_id, generation} (user-approved 2026-05-29): generation is a PER-LANGUAGE impl detail (D24), NOT in the protocol/IDL Handle (D7/DR-2 stays (pool_id, handle_id)) -- wire-meaningless, dropped at the wire boundary. Recorded in CLEAN-SLATE.md. b32 leak test (a fn-captured guard's Drop fires when the node drops) + 20 Rust tests + clippy + fmt green. B15 (TS sibling) still OPEN; Rust rewire fn-swap unregister lands when Rust rewire (C-8) does.","lang":"rust","ref":"D20,D21,B15,CSP-5,D7,DR-2"},{"id":"B33","title":"TEARDOWN relay past a node's own COMPLETE: a terminal intermediate currently DROPS an upstream TEARDOWN at _receiveFromDep (the terminal-is-forever guard), so downstream never receives it for wire/bridge unwire. Pre-existing since CSP-1, NOT introduced by B30; B30's _down terminal guard is a second drop point on the same axis.","state":"deferred","trigger":"a real consumer (firstValueFrom-style bridge / wire-bridge resource release, D33/B2) needs TEARDOWN to propagate through an already-COMPLETEd intermediate to unwire downstream. Resolve via /spec-amend on draft R-teardown-complete (pin whether terminal nodes relay TEARDOWN) + a conformance scenario; mirror in both TS (_receiveFromDep + _down) and Rust (Core::down) arms. Surfaced by /qa on B30 2026-05-30 (QA F1 was mis-attributed to B30; the actual drop is the pre-existing _receiveFromDep terminal guard).","lang":"all","ref":"D17,R-terminal,R-teardown-complete,B30"},{"id":"B34","title":"higher-order *Map first-cut limitations (@graphrefly/ts, D47/CSP-2.7 landed 2026-05-30): (a) describe does NOT render runtime-added inner deps — graph.describe reads construction-time entry.deps (R-edges-derived) and inners are bare fromAny nodes not registered in the graph index, so a switchMap/mergeMap snapshot shows only [S]->op, NOT the live inners. SPEC TENSION: R-edges-derived 'edges from construction-time deps' + R-describe 'live-topology deferred to viz' vs the D47/C-11 rationale 'a describe snapshot shows currently-live inners'. (b) projected inners coerced via fromAny bind to the DEFAULT dispatcher (D26), not the operator's own — wrong for a non-default-dispatcher graph + a non-Node projection (a Node projection stays dispatcher-correct, keeping its own). (c) a terminal operator does not tear down still-subscribed siblings, and a source ERROR does not explicitly unsubscribeDep all inners (errorWhenDepsError auto-errors the op; inners orphaned until GC).","state":"open","trigger":"(a) LOCKED D51 2026-05-30 (/design-review, B2 over A over B1): describe() = LIVE point-in-time snapshot — edges from each node's CURRENT _deps (re-read at call time, so rewire C-8/C-11 reflected, truthful per D3); a live dep absent from _entries (a runtime *Map inner) is AUTO-DISCOVERED as a snapshot node, factory from the inner's own NodeOptions.factory (D43-reserved, set by the free initNode) else '?'; inners NEVER persistently registered (best-effort live capture, no churn — B1 persistent-registry/graph-in-body REJECTED as it pierces D27/R-node-thin); streaming-deltas stay deferred to viz/B4; initial TS cut discovered one level, then B38 resolved transitive auto-discovery. R-edges-derived ('construction-time'->'current/live') + R-describe amended. (a) DONE 2026-05-30 (/dev-dispatch @graphrefly/ts): Node.deps readonly getter (live _deps) + Node.factory public field realizing NodeOptions.factory? (set in the free initNode = op.factory, so bare *Map inners self-carry their name) + graph.describe reads LIVE deps (entry.node.deps, not construction entry.deps) + one-level auto-discovers unregistered live deps via a per-graph WeakMap<Node,id>+_synthSeq (synth id `~<factory|?>#n`, can't collide with registered name/factory#seq; describe bumps _synthSeq only, not _seq, so registered ids are describe-call-independent); discovered inners originally shown as leaves; B38 follow-up now recursively expands unregistered live deps as nodes+edges. Tests: higher-order.test.ts (live inner after S emits; bare initNode(of) dep named 'of'; transitive unregistered inner graph), TS checks green. (b) DONE 2026-06-02 (@graphrefly/ts): higher-order operators now receive an internal symbol-backed ctx node binding that exposes only the owner dispatcher plus graph-core construction wrapper; fromAny-coerced runtime inners are created in the operator owner's dispatcher/core context, preserving D22 without adding a public ctx.dispatcher or Graph method. Test: higher-order.test.ts custom dispatcher regression for mergeMap array projection. (c) STILL OPEN: a consumer needs explicit source-error/terminal sibling teardown; broader sibling cancellation remains design-gated because D47 says mergeMap inner ERROR forwards and does not cancel siblings. None block the first cut: Node projections remain dispatcher-correct, fromAny coercion is now dispatcher-correct, and describe shows truthful live topology.","lang":"ts","ref":"D47,R-rewire-deferred,R-edges-derived,R-describe,D22,D45,CSP-2.7"},{"id":"B35","title":"COMPLETE-from-a-dep does NOT release that dep's pending DIRTY contribution (wedges a multi-dep node): a dep that emits DIRTY then COMPLETE WITHOUT an intervening DATA/RESOLVED leaves _depDirty[idx]=true and _pending>0 — the INVALIDATE arm clears this (EC3) but the COMPLETE/ERROR arms do not. A multi-dep node (e.g. deps [D,E], D dirties then completes, E live) then has _pending stuck >0 → _maybeRun/_tryRun is gated forever → the node never recomputes or settles. PRE-EXISTING since CSP-1 (not introduced by D47); surfaced by the CSP-2.7 /qa Edge-Case review of the *Map operators (an inner that DIRTY-then-COMPLETEs without a value would wedge the operator). NOT hit by the normal inner lifecycle (sources emit DATA-then-COMPLETE, or bare COMPLETE with no prior DIRTY), so the *Map first cut is unaffected.","state":"deferred","trigger":"TS and Rust are DONE for C-15/R-terminal-settles-dirty; only the py arm remains (CSP-7). Reopen only when implementing py C-15 or when TEARDOWN-at-a-dirtied-dep / terminal x PAUSE/batch timing is in scope (see B39/B33). No current TS design-review blocker.","lang":"all","ref":"R-terminal-settles-dirty,R-invalidate-idempotent,R-deps-terminal,R-dirty-before-data,C-15,CSP-1,CSP-2.7","note":"TS ARM DONE 2026-05-30; RUST ARM DONE 2026-05-30; py:todo per conformance C-15. Historical design/spec context retained in the title."},{"id":"B36","title":"@graphrefly/ts resumeAll spurious undirty RESOLVED while paused: a buffered tier-3 emit does NOT set _emittedSettleThisWave (it is set only in the post-buffer down loop, node.ts ~line 900), so a COMPUTE node recomputing while paused under pausable:'resumeAll' has its DATA buffered yet still hits the _runWave undirty synthesis (wasDirty && !_emittedSettleThisWave) → emits a spurious RESOLVED via _emitToSubs that BYPASSES the pause buffer and reaches subscribers mid-pause","state":"resolved","trigger":"RESOLVED. Reopen only if B9 expands resumeAll baseline/equality replay semantics or if a future conformance scenario requires changing the raw-subscriber duplicate-DIRTY replay shape.","lang":"ts","ref":"D44,D49,R-resolved-undirty,R-pause-modes,B9","resolved_by":"@graphrefly/ts node.ts + control.test.ts (2026-05-31)","resolution":"TS now marks _emittedSettleThisWave when a tier-3/4 settle slice is buffered by pause/resumeAll, so _runWave does not synthesize a mid-pause undirty RESOLVED. Regression coverage: control.test.ts resumeAll compute DATA stays buffered while paused (subscriber sees DIRTY only), then resume replays DATA. This aligns TS with the Rust reading that a buffered settle counts as a produced settle."},{"id":"B37","title":"graphrefly-rs DeferredCtx holds a STRONG Core (Rc<RefCell<NodeInner>>): an async fn that stashes ctx.defer() and never emits (abandoned/cancelled work, a never-resolving backend) pins the node's NodeInner — and thus its fn slot (blocking the B32 unregister), its captured upstream Cores, and its dep_unsubs subscriptions — alive until the DeferredCtx drops. In correct usage the DeferredCtx drops when the async work completes/aborts (no leak), and the strong hold MATCHES TS's GC-reachability (the async callback closure keeps the TS node alive until it resolves). But it makes the dispatcher invoke's stale-handle no-op comment unreachable for this path (a strong Core can't have dropped+recycled), and a switchMap-style cancel that drops the DeferredCtx late over-retains until then","state":"deferred","trigger":"the real async-pool runner lands (B1) — decide strong-vs-Weak hold for DeferredCtx. Weak<RefCell<NodeInner>> (upgrade at emit, drop silently if gone — matching the dep-sink discipline) makes Drop/B32 reachable + the stale-handle no-op real, but silently drops an async result if the Node handle was dropped first (arguably wrong for an async source you want the result from). Surfaced by the CSP-6 Slice A /qa (2026-05-30, Blind Hunter). Low urgency: no leak in correct usage, no conformance path; revisit with the async runner.","lang":"rust","ref":"D20,B1,R-sync-core,DR-3"},{"id":"B38","title":"describe() transitive auto-discovery of unregistered live deps (D51 follow-up): the D51 first cut auto-discovers ONE level — a registered node's DIRECT live deps that aren't in _entries (a *Map inner). An inner that ITSELF carries a subtree of unregistered nodes (e.g. project returns a composed node, not a leaf source) shows the inner but NOT its sub-deps. Reframe describe as a call-time LIVE-REACHABILITY walk (seed = registered nodes, follow live _deps, emit every reached node incl. transitively-unregistered ones) so deeper inner topology falls out for free.","state":"resolved","trigger":"RESOLVED 2026-06-01 (@graphrefly/ts). Reopen only if a future inspection requirement needs depth/shape controls (for example depth cap, filter policy, or mount-path explain semantics), not basic transitive reachability.","lang":"ts","ref":"D51,R-describe,R-edges-derived,B34","resolved_by":"TS graph.describe() transitive unregistered-live-dep expansion + higher-order transitive snapshot test (B38)","resolution":"describe now performs live-reachability expansion for auto-discovered unregistered nodes: after registered-node pass, discovered unregistered nodes are recursively expanded through their own live deps, emitting nodes+edges transitively with stable synthetic ids (existing WeakMap id cache). This closes the D51 one-level leaf limitation while keeping edge truthfulness (R-edges-derived)."},{"id":"B39","title":"R-terminal-settles-dirty x PAUSE/batch cross-axis (CSP-2.7 /qa 2026-05-30): the absorbed-terminal undirty RESOLVED (node.ts _settleAfterAbsorbedTerminal) emits via bare _emitToSubs. FRAMING (matters — do NOT prejudge as a plain bug): default('true')-mode is ALREADY correct — D50/R-paused-invalidate Q1 locked the INVALIDATE-side undirty as IMMEDIATE in default mode (buffer-replay is resumeAll's job), and this terminal undirty is its DIRECT analogue, so the current bare immediate emit is right for default-pause. The gap is ONLY resumeAll-pause (must buffer the tier-3 settle slice, R-pause-modes) + open-batch (must defer to commit, D12) — a PARTIAL LATENT VIOLATION of those already-locked rules, not a fresh open question. The SAME bare-emit sits in the PRE-EXISTING INVALIDATE receive-arm (node.ts ~616-621, since CSP-1) with the same partial violation. The fix = route BOTH undirty RESOLVEDs through _down, which PRESERVES default-mode immediacy (_shouldBufferOnPause returns false for a default-mode sync emit) while buffering resumeAll + deferring batch. (The sawData->_maybeRun recompute already coalesces correctly under pause via _pausedDepWaveOccurred; only the RESOLVED balance bypasses.) Non-paused/non-batch is correct + conformance-covered (C-15 a-d, mutation-verified). THEORETICAL — no consumer, no failing test — parallel to B24 (rewireNext x batch/pause), deferred; contrast D44/D50 which were locked on a CONCRETE /qa symptom (garbage value / spurious ERROR), which this lacks. User chose DEFER 2026-05-30.","state":"resolved","trigger":"RESOLVED by D64/R-undirty-settle-timing + C-19: TS and Rust arms pass; py remains tracked by conformance/CSP-7. Reopen only for a new pause/batch timing axis not covered by C-19.","lang":"all","ref":"R-terminal-settles-dirty,R-resolved-undirty,R-pause-modes,D12,D50,B24,C-15","note":"Original terminal/INVALIDATE dirty-release bare-RESOLVED timing backlog is closed for TS/Rust: balancing RESOLVED routes through normal delivery, so default true may be immediate, resumeAll buffers, and batch defers to commit."},{"id":"B42","title":"RESOLVED 2026-05-30 (/design-review approved option A -> /spec-amend, TS+Rust arms green; py CSP-7): completeWhenDepsComplete now counts an absorbed-error dep as TERMINAL-done. R-deps-terminal amended (all-deps-complete -> all-deps-TERMINAL) + active; C-17 (ts+rust pass) + formal wave_deps_complete.tla (TLC-green + mutation-verified); impl = _allDepsComplete->_allDepsTerminal (block on live) + the ERROR-absorbed receive-arm mirrors the COMPLETE arm (both TS node.ts + Rust node.rs). ORIGINAL: completeWhenDepsComplete x an absorbed (errorWhenDepsError:false) errored dep never auto-completes [renumbered from a duplicate B40 2026-05-30 -- the protocol-pull Fork-B item keeps B40]: all_deps_complete requires EVERY dep_terminal==Some(Complete), so a dep that ERRORed (recorded Some(Error)) blocks the auto-COMPLETE cascade forever, even after all OTHER deps complete. A rescue/catch operator (errorWhenDepsError:false + completeWhenDepsComplete:true) over a stream whose one source errors-then-others-complete never emits its terminal COMPLETE. Parity-consistent: TS _allDepsComplete is identical (tm!==true -> false for an errored dep). Surfaced by the CSP-6 Rust /qa (Blind Hunter, finding 4).","state":"resolved","trigger":"RESOLVED; no further design-review needed. Reopen only if TEARDOWN is added to the terminal-counting semantics or py implementation surfaces a spec/code conflict.","lang":"all","ref":"R-deps-terminal,D31,CSP-6","resolved_by":"R-deps-terminal + C-17 (TS/Rust pass; py todo tracked in conformance)","resolution":"D/R decision completed: an absorbed-error dep counts as TERMINAL for completeWhenDepsComplete. R-deps-terminal active; C-17 TS+Rust pass; py remains tracked by conformance/CSP-7, not by this backlog item."},{"id":"B40","title":"PROTOCOL-PULL design question (Fork B blocker, deferred to a NEW /design-review session): should GraphReFly add a protocol-level PULL -- a DEMAND/REQUEST tier (the callbag type-1-up analogue) so a sink can REQUEST data UP the conveyor belt and the source responds with DATA DOWN on demand, creating a DECLARED, inspectable pull-edge? USER'S LOAD-BEARING FRAMING (reframes the naive view): a PROTOCOL pull HONORS the guard -- a declared DEMAND edge appears in describe (D3/L0.7 inspectable topology satisfied); whereas the EXISTING method-pull (node.cache / lineage get()) is the actual BYPASS -- an invisible side-channel read outside the protocol. So 'pull breaks inspectability' is TRUE ONLY for method-pull (.cache); a declared protocol-pull is inspectable. LINEAGE: raw callbag HAS talkback pull (sink sends type-1-up no-payload = 'give me' -> source sends type-1-down = value; same type-1 both directions); callbag-recharge (the foundation GraphReFly is built on) ALREADY dropped it -- REFLOW-SPEC §1.4 up = PAUSE/RESUME/INVALIDATE/TEARDOWN (control only), chose METHOD-pull node.get() (cached read, MAY recompute-when-disconnected) over message-pull because of F-SYNC-CORE (message-pull is an async-style request/response round-trip, awkward in a sync wave core; get() is synchronous recursive DAG eval, glitch-free by construction); clean-slate inherited this (.cache = renamed get(), node.ts:200; R-data-not-peek scopes .cache to EXTERNAL consumers, bans in-graph .cache-peek to keep topology inspectable).","state":"resolved","resolved_by":"D55","resolution":"RESOLVED 2026-05-30 by D55: NO new DEMAND tier. Protocol-pull is realized as a SUBSTRATE pull-mode node (NodeOptions.pull:true) reusing RESUME as the demand + the D47 wave-boundary for self-demands. The naive design wedged downstream (a quiet compute node relayed phase-1 DIRTY but withheld the settle) -- the fix is quiet-DIRTY ABSORPTION + no-push-on-subscribe + deferred demand; spike-verified (_probe-pull P0b/P4/P5). pull:true -> R-pull/wave_pull.tla/C-1x via /spec-amend; reactiveList two-port (stream push + snapshot pull) is per-language. DESIGN CHALLENGES dissolved: no DAG pull-coordination (demand targets one cache-warm source), no F-SYNC-CORE round-trip (synchronous cache-warm flush), no constitutional D9 change.","trigger":"DONE -- /spec-amend (B) pending to land R-pull. Original trigger (for record): a fresh /decision-guard -> /design-review -> (if approved) /spec-amend to assess 'how much trouble vs how much benefit' of protocol-pull. BLOCKERS to amend: D9 (closed 9-tier set has NO DEMAND/REQUEST tier -- 'adding a tier is a constitutional change') + D8/R-ctx-up (up = control-tier only). DESIGN CHALLENGES to assess: (1) DAG pull-coordination -- a sink D pulling through a diamond (B,C over A): request fan-out, response fan-in, compute-A-once memoization; (2) F-SYNC-CORE reconciliation -- a synchronous request/response round-trip in the sync wave core (the reason the lineage chose method-pull); (3) interaction with two-phase push + ROM/RAM caching + lazy activation (does protocol-pull COMPLEMENT push or REPLACE part of it?); (4) tier/wave semantics (is DEMAND its own tier? how does it coexist with DIRTY/DATA?). BENEFITS to weigh: inspectable on-demand pull (vs the invisible .cache bypass), restored callbag pull/push duality, lazy eval through the protocol, a cleaner reactiveCollection (delta-stream push + snapshot pull ALL through the belt -- no external .cache side-channel). GATES Fork B (CSP-2.8 data-structures emit/delivery shape): whether reactiveCollection's snapshot is delivered via lazy-push items (no protocol change) OR a protocol-pull determines the emit design. Until resolved, Fork B (D55) is NOT locked; CSP-2.8 data-structures is ~90% designed (Fork A=D54 locked, shared scan-accumulator core + mechanical dissolutions set, composition=D56, storage=D57, render mechanical) with ONLY the snapshot-delivery/emit shape pending on this.","lang":"all","ref":"D8,D9,R-ctx-up,R-data-not-peek,D1,D3,D54,callbag-recharge REFLOW-SPEC,CSP-2.8,Fork-B"},{"id":"B41","title":"RESOLVED TS catalog deferred operators: D58 intentionally does not port window/windowCount/windowTime; repeat(factory,count), audit/auditTime, timeout(source,ms), and bufferTime(source,ms) are landed in @graphrefly/ts with tests. Historical context: these were the CSP-2.7 tail operators excluded from the first ~30-op cut because they needed D47/D52/D62 shapes beyond a clean declared-dep node / simple *Map+timer projector.","state":"resolved","trigger":"RESOLVED. Reopen only if a real consumer needs one of the deferred alternatives: opaque live window sub-streams despite D58 default; same-node repeat requiring a later-subscribe design; debounce RxJS immediate complete-flush; throttle trailing option; or a different bufferTime windowing shape.","lang":"ts","ref":"D40,D45,D46,D52,B23,B38,CSP-2.7","resolved_by":"D58 + TS time.ts B41 tail (2026-05-31)","resolution":"Resolved for TS: window/windowCount/windowTime are intentionally NOT ported by D58; repeat(factory,count) landed in higher-order.ts; audit/auditTime landed as value-triggered trailing operators; timeout(source,ms) and bufferTime(source,ms) landed as subscribe-armed helper nodes with tests in time.test.ts. Future enhancements (opaque live sub-window escape hatch, repeat over same resubscribable node, debounce immediate complete-flush, throttle trailing option) are trigger-gated and should get separate backlog/design records if needed."},{"id":"B43","title":"single-dep transform/take operators read ctx.depRecords[0].latest (last-of-batch), NOT iterate .batch -- so under a COALESCED multi-DATA batch they see only the last value + counters under-count. Affects map/filter/scan/distinctUntilChanged (pre-existing since CSP-2.6) + the CSP-2.7 additions skip/take/takeWhile/first/pairwise; contrast reduce/last/find/elementAt/tap/settle/merge/bufferCount which DO iterate r.batch. Surfaced by the CSP-2.7 /qa (Blind Hunter + Edge Case Hunter). REACHABILITY is narrow: for a SINGLE dep, _depBatch only accumulates >1 value before one fn run via pause-coalescing (R-pause-modes default mode = fire-once-with-latest-on-RESUME, where latest-only is the SPEC'd behavior, NOT a bug) or a first-run-gate-held / diamond-gated window; in the normal one-DATA-per-wave path each DATA drives its own _runWave (node.ts:886 resets _depBatch), so .latest == the only value. So this is an INTERNAL-CONSISTENCY + D49-occurrence-fidelity observation, NOT a confirmed correctness bug (the only reachable multi-batch path is pause-coalescing, which is latest-only by R-pause-modes).","state":"resolved","trigger":"RESOLVED 2026-06-01 (@graphrefly/ts). Reopen only if a new operator deliberately chooses coalesced-latest semantics over occurrence semantics, or if a pause-coalescing-specific counting policy is introduced.","lang":"ts","ref":"D49,R-pause-modes,R-sentinel,CSP-2.6,CSP-2.7","resolved_by":"TS operators.ts batch-first single-dep occurrence handling + regression coverage","resolution":"Single-dep transform/take operators now consume depRecords[0].batch occurrences instead of depRecords[0].latest for map/filter/scan/distinctUntilChanged/skip/take/takeWhile/first/pairwise. This aligns operator counting with D49 occurrence semantics, prevents stale re-emits on undirty RESOLVED-only waves (no fresh DATA), and handles in-wave multi-DATA batches deterministically. Regression tests were added in operators.test.ts for in-batch occurrence behavior and RESOLVED no-stale-reemit behavior."},{"id":"B44","title":"RxJS-7 time-operator complete-edge reference (context7-verified /reactivex/rxjs 7.8.2, 2026-05-30) -- pins the per-operator source-COMPLETE behavior so it is settled BEFORE implementation, NOT left to discover. (A) DEFERRED ops (B41), the behavior to MATCH when authored: audit/auditTime -> FLUSH the pending latest value on source COMPLETE (RxJS 6->7 CHANGE: v6 dropped it, v7 emits the last value; the frozen pure-ts audit also flushes -> agree, author with flush-on-complete). bufferTime -> FLUSH the final buffer on COMPLETE (RxJS 7 'final buffered values are always emitted'; matches the LANDED buffer/bufferCount which already flush remainder + COMPLETE). timeout -> NO flush edge (it ERRORs only on an idle gap > ms; a normal source COMPLETE just forwards COMPLETE). (B) LANDED ops -- known RxJS DIVERGENCES (acceptable, recorded): debounce/debounceTime (switchMap+timer) emits its pending trailing value at (last-value-time + ms) when the in-flight timer fires -- RxJS debounceTime instead FLUSHES the pending value IMMEDIATELY at source-COMPLETE time (its _complete calls debouncedNext() before complete()). So if the source completes mid-window, RxJS emits the trailing value at complete-time; this impl emits it ms later (the *Map+timer composition cannot flush early without detecting COMPLETE inside the switchMap inner -- inherent to the declarative composition). throttle/throttleTime is leading-ONLY (matches RxJS default leading:true/trailing:false) but does NOT expose the leading/trailing options RxJS provides (a capability gap, not a divergence).","state":"deferred","trigger":"B41 time-tail implementation is DONE. Reopen only if a consumer hits a remaining RxJS divergence/capability gap: debounce/debounceTime flushes pending trailing value at timer-fire time rather than immediately on source COMPLETE; throttle/throttleTime exposes only the RxJS default leading:true/trailing:false shape. Per-language (D6/D24), NO /spec-amend.","lang":"ts","ref":"D52,B41,B23,CSP-2.7,rxjs-7.8.2","resolution":"Reference behavior was applied to the landed B41 tail: audit/auditTime flush pending latest on source COMPLETE; bufferTime flushes final buffer on COMPLETE; timeout forwards normal source COMPLETE without error. Remaining divergence/capability notes stay trigger-gated in this backlog row."},{"id":"B45","title":"Rust perf track toward the Stage-3 ceiling (DR-7+DR-8): de-erasure (hybrid typed-internal / erased-boundary) THEN arena + index/generational handles -- move the hot path off Rc<RefCell> (refcount + dynamic-borrow tax) onto arena-owned nodes addressed by index handles (the dispatcher slotmap pattern B32, generalized to the node graph). Beats both Rc<RefCell> and a GC; reclaims the CPU edges where Rust structurally beats TS (GC/alloc, cache-bound, integer/bit, cold-start, polymorphic-no-deopt, SIMD, latency). Probes (crates/graphrefly/examples/perf_probe.rs + perf-probes/ts_probe.mjs) are AUTHORED but NOT RUN.","state":"open","trigger":"Runs IN PARALLEL with the ongoing TS implementation (DR-8 scheduling). STEPS: (a) RUN the authored probes for REAL numbers (own-measurement was deferred) + add a Python/GIL + arena-vs-GC + complex-marshal probe; (b) de-erasure per DR-7 (hybrid) keeping the conformance arm C-2..C-15 GREEN (D24 behavior-preserving); (c) arena+index refactor; stop at the ceiling-ratio target (within 1.5-2x of hand-rolled, near-linear core scaling). Per-language (F-PERF/L5-Q1), NO spec-amend.","lang":"rust","ref":"DR-7,DR-8,B32,D22,F-PERF,L5-Q1","note":"2026-06-01 baseline probes rerun on same host (10 cores visible). Rust DR-7 perf_probe (dev): Probe A typed 158.0 ms vs erased 1430.6 ms over 16,000,000 value ops => erasure tax 9.05x (+805%). Probe B ceiling (N=40,W=10,000,000): 1-thread 6658.3 ms, 10-thread 1289.2 ms => 5.16x speedup (52% efficiency), single-thread constant-factor 16.646 ns/iter. TS probe (node v26.0.0, same N/W): 1-thread 2852.7 ms, 10-worker 834.9 ms => 3.42x speedup (34% efficiency), single-thread constant-factor 7.132 ns/iter. Interpretation: Rust parallel scaling headroom looks better, but current erased-path single-thread constant factor is slower than TS in this synthetic loop; this keeps B45/B49 priority on de-erasure + arena bookkeeping before claiming runtime wins."},{"id":"B46","title":"R-pull DEMAND-TRIGGER surface + routing (the per-language trigger of a pull demand, NOT the delivery). User (CSP-2.8 /dev-dispatch+/qa 2026-05-30) prefers NOT a new ctx.demandNext API but a CONE-PROPAGATING ctx.up([[RESUME, lock_id]]): the RESUME travels UP the declared dep-cone like DIRTY does and STOPS at the node holding that lock (the pull:true node / source), which fires DATA down -- so the demand follows DECLARED edges (inspectable). The landed TS impl instead uses DIRECT-TARGET: ctx.demandNext(dep) (a new ctx affordance) / node.up([[RESUME, node.demandLock]]) calls _up on the pull node itself; _up handles PAUSE/RESUME LOCALLY and does NOT propagate them up the cone (only DIRTY/INVALIDATE/TEARDOWN propagate). Folds in 3 QA findings the routing model resolves: (F3) demandNext does not verify dep is a DECLARED dep -- a non-pull dep is a silent no-op (no typo signal) and a non-dep pull node can be demanded, creating an undeclared (uninspectable) demand edge -- contradicts the user's own declared-edge-not-.cache-bypass principle; (F4/F5) a demand coinciding with an EXTERNAL pause lock is LOST -- the per-node demand lock shares the single _pauseLockset with ordinary PAUSE locks, so a RESUME(demandLock) with another lock still held early-returns without servicing and drops the lock (pull x pausable not truly orthogonal -- entangled through one Set); (B1/F6) an owed demand (pin 5, demand-while-_pending>0) is STRANDED/misfired when the in-flight dep settles via INVALIDATE or COMPLETE/ERROR -- those receive-arms drain _pending without calling _fireOwedDemandIfReady (only the DATA/RESOLVED arms do). The DELIVERY behavior (quiet-absorb-DIRTY / no-push-on-subscribe / fire-once-DIRTY-before-DATA / re-quiet / true=latest, resumeAll=backlog) is UNAFFECTED and stays conformant -- R-pull ACTIVE + C-16 ts:pass + wave_pull.tla stand; only C-16's (defer)/(immediate) facets and the trigger surface would change.","state":"resolved","trigger":"A /design-review to LOCK the demand-trigger routing model (cone-propagate-RESUME vs direct-target), reconciling: (1) per-node-lock precision (D55 (d)) -- cone-propagation still needs the lock id, so the consumer needs the pull node's demandLock either way; (2) the SELF-demand D37 deferral (R-pull / R-rewire-deferred) -- ctx.up is IMMEDIATE, so a self-read demand via it re-enters (D37); a deferred path is still required regardless of name; (3) whether _up should propagate RESUME up the cone (stop-at-holder) -- this CHANGES control-message routing in _up (today PAUSE/RESUME are node-local; DIRTY/INVALIDATE/TEARDOWN propagate) and interacts with how PAUSE targets a node, so it is a WAVE-PROTOCOL behavior change -> /spec-amend (clarify R-ctx-up routing + possibly R-pause-lockset PAUSE/RESUME targeting; R-pull's routing semantic (d)); (4) make the demand a DECLARED, inspectable edge (resolve F3) and decide demandNext-on-non-pull = throw vs no-op; (5) separate the demand lock from _pauseLockset (or route owed-demand through it) to make pull x pausable orthogonal (resolve F4/F5) and wire _fireOwedDemandIfReady into the INVALIDATE/terminal settle paths (resolve B1/F6). Then re-implement the trigger surface + add C-16 routing/cross-axis facets (demand-up-the-cone, demand x external-PAUSE, demand x INVALIDATE/terminal) and model in wave_pull.tla if routing becomes spec.","lang":"all","ref":"R-pull,R-ctx-up,R-pause-lockset,R-rewire-deferred,D55,D37,D47,D8,CSP-2.8,Fork-B,C-16","resolved_by":"D59 + /dev-dispatch impl 2026-05-31","resolution":"RESOLVED by D59 (RESUME-routed pull: pullId + R-up-routing release-if-held-else-forward-up + ctx.upNext deferred self-demand, drop ctx.demandNext) + the TS impl 2026-05-31. F3 (declared-edge) -> demand routes the DECLARED cone (inspectable); F4/F5 (demand x external PAUSE) + B1/F6 (owed-demand on INVALIDATE/terminal) -> unified _demandOwed serviced across all settle/resume paths (_onDemand/_canFireDemand/_deliverPullDemand + _fireOwedDemandIfReady in DATA/RESOLVED/INVALIDATE/terminal arms + _pauseRelease). C-16 ts:pass (routing facets) + wave_pull_routing.tla TLC-green (RoutedResumeReachesHolder + DisambiguatesSiblings, both mutation-verified). rust=CSP-6 / py=CSP-7."},{"id":"B47","title":"R-up-routing: a BROADCAST routed RESUME (no towardDep) over a DIAMOND (the pullId-holder reachable from one demander via 2+ declared paths) invokes the holder's _onDemand ONCE PER PATH. Harmless TODAY -- the 1st delivers, the 2nd is SILENT (true mode: _pausedDepWaveOccurred cleared by the 1st; resumeAll: buffer already drained), so net delivery is 1 (1:1 preserved by COALESCING, not by routing). wave_pull_routing.tla models a strict TREE (G->{F,H}, distinct holders), so the impl diverges from the model in a diamond-to-single-holder topology. _forwardUp (node.ts) broadcasts to all deps with NO visited-set; adding one would also change the PRE-EXISTING DIRTY/INVALIDATE/TEARDOWN up-broadcast (idempotent today) -> out of scope for the D59 QA. Surfaced by the D59 /qa (3 reviewers).","state":"deferred","trigger":"Before a MULTI-PATH pull consumer ships (a pullId-holder reachable from one demander via 2+ declared paths). The reactiveList Fork-B snapshot is single-holder/tree, so NOT hit today. Then: add a per-routed-wave visited / already-demanded guard (or make _onDemand idempotent within one routed RESUME), + a diamond facet to C-16 + a diamond topology in wave_pull_routing.tla asserting fire-once.","lang":"all","ref":"R-up-routing,D59,C-16,wave_pull_routing.tla"},{"id":"B48","title":"RESOLVED 2026-05-31: D61 pull snapshot-prep TTL prune delta edge fixed in @graphrefly/ts by splitting reactiveMap into internal mutationDelta + internal pull snapshotPrep + public delta/snapshot declared deps.","state":"resolved","trigger":"RESOLVED. Reopen only if a later collection core unification removes the snapshotPrep split or if another structure needs snapshot-prep side-effect deltas.","lang":"ts","ref":"D61,D60,R-pull,D37,CSP-2.8","resolved_by":"CSP-2.8 reactiveMap snapshotPrep refactor","resolution":"snapshotPrep(pullId) depends on internal mutationDelta, prunes expired entries and emits an internal {snapshot, expired[]} payload on demand. Public snapshot depends on snapshotPrep and forwards snapshot. Public delta depends on [mutationDelta, snapshotPrep] and forwards normal mutation changes plus snapshotPrep expired deletes. Backend remains the single materialized state; no snapshot fn drives its own dep, so D37 reentrancy is avoided; D61 snapshot-prep expired deletes enter the public delta stream."},{"id":"B49","title":"Centralized wave bookkeeping / thin Node view migration (Rust-proven, TS authorized by D76): move per-node depRecords, pending counts, dirty/terminal dep-slot state, output-slot/wave scratch, internal sinks, and rewire/deferred-boundary queues into a graph-local core/side-table shape when it avoids double bookkeeping. User insight 2026-06-01 remains: bookkeeping is the main opportunity; sparse frontier propagation is a possible later side-effect, not the primary goal. Preserve graph-first GraphSpec/describe and public API; users should observe only performance, memory, and profiling improvements, not a different programming model. Node becomes a handle/view over graphCore+nodeId with public cache/status/up/down/subscribe affordances; ctx.depRecords remains a logical contract, likely implemented as a lazy view over arrays, and record object identity should not be promised. Optional sidecars stay allocation-on-use: ctx.state, pause buffers/locks, replay buffers, cleanup hooks, external subscribers. Must preserve observable protocol: DIRTY-before-DATA, diamond exactly-once, INVALIDATE dedupe, push-on-subscribe, PAUSE/RESUME, terminal propagation, rewire dep-slot semantics. Avoid double-write designs: either keep current per-node state, or centralize it; do not add frontier indexes while retaining full Node bookkeeping as a second source of truth.","state":"resolved","trigger":"D71 authorized Rust as the pre-1.0 proving ground and the Rust arm produced clean behavior-preserving B49 slices/probes. B50-B52 resolved the losing Rust paths: do not land ready-run frontier layering, INVALIDATE-only adjacency while retaining subscriber closures, or a mechanical GraphCore internal-edge replacement that regresses fanout/invalidate/heap. D76 now authorizes @graphrefly/ts to adopt B49 during the current migration as a self-contained JS/TS internal architecture change. Start TS with staged side-table/GraphCore extraction around node.ts, keeping the public Node API and GraphSpec/describe stable. No spec-amend if behavior is preserved; if ctx.depRecords contents/timing, wave ordering, DIRTY-before-DATA, diamond, pause/batch timing, terminal/teardown semantics, describe/GraphSpec observability, or any protocol behavior changes, halt and route through design/spec first.","lang":"ts/rust/all","ref":"D3,D20,D21,D22,D24,D25,D27,D32,D71,R-node-thin,R-fn-contract,R-dirty-before-data,R-two-phase,R-diamond,R-ctx-up,R-rewire,B45,F-PERF,D76,B50,B51,B52","note":"2026-06-01 Rust D71 first mainline B49 slice landed and passed QA in @graphrefly/rust: Core is now a graph-local arena slot handle (GraphCore + NodeId + external checked refcount) instead of Rc<RefCell<NodeInner>>. QA fixed ownership/drop hazards exposed by the single GraphCore borrow domain: per-run hook clearing drops captured Core handles borrow-free; added-dep activation panic rolls back partial subscriber registration only during rewire dep mutation; Core::drop returns arena slots even if cleanup hooks panic. Public API and protocol behavior preserved; cargo test -p graphrefly passes 32 unit + 22 conformance, build passes, clippy -D warnings passes, node.rs rustfmt check passes. Full cargo fmt --all --check is blocked only by pre-existing formatting in crates/graphrefly/examples/perf_probe.rs. Next slices: centralize dep-slot arrays/frontier bookkeeping instead of keeping NodeInner as the slot payload; then measure B49/B45 cache locality, dirty/invalidate traversal, diamond pending, rewire churn, subscriber fanout, and retained heap. Second slice (2026-06-01): dep-slot bookkeeping in Rust node.rs is now grouped under a dedicated DepBookkeeping structure (batch/prev/has_data/dirty/tier/pending/terminal/unsubs/idx_boxes) with call sites migrated from flat NodeInner fields to n.dep.*; behavior preserved (32 unit + 22 conformance + clippy -D warnings + build green). This is a prep slice for moving dep bookkeeping into GraphCore side-tables without repeating protocol-touching rewrites. Third slice (2026-06-01): moved per-dep edge bookkeeping (dep unsubs + callback index indirection boxes) out of NodeInner into GraphCore side-tables (edge_slots) keyed by NodeId; Core drop now takes/releases both node slot and edge slot together, and activate/deactivate/subscribe_dep/rewire_apply operate through combined (NodeInner, DepEdges) mutation helpers. Behavior preserved (32 unit + 22 conformance + clippy -D warnings + build green). Fourth slice (2026-06-01): migrated remaining dep wave bookkeeping from NodeInner into GraphCore side-tables by expanding DepEdges with DepState (batch/prev/has_data/dirty/tier/pending/terminal). Core paths now read/write dep state through paired (NodeInner, DepEdges) access helpers; first-run gate and dep-record snapshotting are now edge-state driven. Behavior preserved (32 unit + 22 conformance + clippy -D warnings + build green). Fifth slice (2026-06-01): moved per-node transient wave/mutation flags (inside-run-wave, emitted-dirty/tier3, rewire-in-mutation, rewire-run-pending, batch-dirty-owed) out of NodeInner into GraphCore side-table state (DepEdges.wave). Core wave/rewire/down paths now mutate these flags via paired NodeInner+DepEdges helpers, further thinning NodeInner without protocol behavior drift. Behavior preserved (32 unit + 22 conformance + clippy -D warnings + build green); full cargo fmt --all --check remains blocked only by pre-existing crates/graphrefly/examples/perf_probe.rs formatting. Sixth slice (2026-06-01): centralized own output-slot state and boundary queue in Rust GraphCore -- cache/has_data/status/terminal moved from NodeInner into GraphCore side-table state (DepEdges.value)
