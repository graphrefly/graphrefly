  <script type="application/json" id="payload">{"builtAt":"2026-06-04T04:29:21.017Z","counts":{"decisions":117,"phases":13,"backlog":54,"antipatterns":7,"rules":67,"conformance":24,"flowcharts":3,"sessions":1,"guide":4},"gaps":{"designPhases":["CSP-1","CSP-2","CSP-2.5","CSP-2.6","CSP-2.7","CSP-2.8","CSP-3","CSP-4","CSP-5","CSP-6","CSP-7","CSP-8"],"openDecisions":[],"deferredBacklog":["B1","B2","B3","B4","B5","B6","B8","B9","B12","B13","B16","B17","B18","B24","B26","B33","B35","B37","B44","B47"],"uncoveredRules":["R-msg-format","R-msg-closed-set","R-wave-boundary","R-equals","R-same-wave-merge","R-terminal","R-ctx-up","R-node-thin","R-node-iface","R-status-enum","R-rom-ram","R-initial","R-teardown-complete","R-replay-buffer","R-graph-role","R-edges-derived","R-mount","R-describe","R-observe","R-inspection-set","R-meta-presentation","R-graph-lifecycle","R-clock","R-dispatch-all","R-sync-core","R-handle","R-no-polling","R-no-imperative","R-no-raw-async","R-data-not-peek","R-primary-api-clean","R-profile"],"todoConformance":["C-1","C-2","C-3","C-4","C-5","C-6","C-7","C-8","C-9","C-10","C-11","C-12","C-13","C-14","C-15","C-16","C-17","C-18","C-19","C-20","C-21","C-22","C-23","C-24"]},"broken":[],"orphans":[],"legacyRefs":["D2 supersedes legacy R11","D22 supersedes legacy D221","D22 supersedes legacy D222","D24 supersedes legacy D196","D32 supersedes legacy D080","D32 supersedes legacy D206"],"gateOk":true,"model":{"decisions":[{"id":"D1","layer":"L0.1","date":"2026-05-27","question":"What is GraphReFly's first-principles identity?","decision":"reactive universal reduction layer; not LLM-limited; performance first-class","rationale":"any high fan-in/fan-out → information reduction → push is a legitimate segment; LLM is the current primary focus, not the boundary","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D2","layer":"L0.5","date":"2026-05-27","question":"pre-1.0: lock the wedge or not?","decision":"do not lock the wedge, horizontal narrow-waist","rationale":"reverses R11 (memory+harness wedge); every primitive must serve ≥2 segments (F-NO-WEDGE-CUT)","supersedes":["R11"],"status":"locked","session":"DS-1"},{"id":"D3","layer":"L0.3","date":"2026-05-27","question":"User mental anchor?","decision":"graph-first; describe() first-class output","rationale":"the graph is the shared cognitive anchor for humans + LLMs, faster to understand than line-by-line code","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D4","layer":"L1.1","date":"2026-05-27","question":"L4 verb set?","decision":"8 verb closed set: node/graph/batch/state + producer/derived/effect/mount","rationale":"operator is not a verb (it is node sugar)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D5","layer":"L1.3","date":"2026-05-27","question":"Node vs Graph responsibilities?","decision":"Node is thinnest (no inspection cruft); Graph piles on convenience+inspection, the sole entry point","rationale":"a bare node works but has no inspection; g.* sugar auto-registers the inspection index","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D6","layer":"L1.5","date":"2026-05-27","question":"What is an operator?","decision":"operator = node sugar (need not go through derived); not recorded in the spec; describe shows the real name","rationale":"each language implements independently, never enters parity","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D7","layer":"L1.12.A","date":"2026-05-27","question":"handle shape?","decision":"handle = pure data (pool_id, handle_id), no methods","rationale":"serializable/snapshotable/wire-transferable; node≠handle (node has up/down methods)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D8","layer":"L1.11","date":"2026-05-27","question":"fn-body send/receive message API?","decision":"ctx.up(msgs)/ctx.down(msgs); one msgs array = one Wave; may mix tiers","rationale":"abolishes actions.emit/forward/backward; the substrate boundary unifies on up/down","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D9","layer":"L2.A","date":"2026-05-27","question":"tier set?","decision":"9 tier: DIRTY/DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR/TEARDOWN + PAUSE/RESUME (control tier-0)","rationale":"closed set; PAUSE/RESUME are orthogonal to the value flow","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D10","layer":"L2.C","date":"2026-05-27","question":"PAUSE/RESUME shape?","decision":"[[PAUSE, lock_id]]; lockset; caller generates the id; same id is idempotent; RESUME of an unknown id is no-op","rationale":"so multiple pause sources do not fight each other","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D11","layer":"L2.D'","date":"2026-05-27","question":"message representation?","decision":"in-process tuple / wire protobuf decoupled; conversion happens at the wire-bridge boundary","rationale":"tuple is debug-friendly; protobuf is compact; the two layers are not forced to agree","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D12","layer":"L2.E","date":"2026-05-27","question":"batch shape?","decision":"declarative (success → commit / throw → rollback) + bctx.rollback escape; commit is always implicit","rationale":"eliminates the forgot-to-commit class of bugs; the 3 languages naturally align","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D13","layer":"L2.F","date":"2026-05-27","question":"cross-runtime?","decision":"each runtime has a local dispatcher + wire bridge; DIRTY across the wire has the same priority as DATA; the user wires the mesh themselves","rationale":"R12 DIRTY consistency; the mesh is not GraphReFly's concern","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D14","layer":"L2.H","date":"2026-05-27","question":"formalization depth?","decision":"γ: markdown spec + TLA+ + cross-impl property tests","rationale":"for our own discipline (prevent drift), not for multi-implementation (c aspirational)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D15","layer":"L2-Q9","date":"2026-05-27","question":"When does equals trigger?","decision":"equals substitution only when there is exactly 1 DATA within the wave; 0 is irrelevant; ≥2 does not intervene","rationale":"with multiple DATA there is no longer any skip-fn benefit -- SUPERSEDED by D49 (Opt-3: no auto-equals-substitution; see R-resolved-undirty)","supersedes":[],"status":"superseded","session":"DS-1"},{"id":"D16","layer":"L2-Q10","date":"2026-05-27","question":"SENTINEL?","decision":"a protocol concept (absence-of-DATA is decidable); the concrete sentinel value is per-language (TS undefined / Rust None / Py sentinel)","rationale":"same semantics, representation decoupled","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D17","layer":"L2-Q11","date":"2026-05-27","question":"resubscribe after terminal?","decision":"terminal-is-forever by default; resubscribable is opt-in","rationale":"the default semantics are clean and the TLA+ state space is small","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D18","layer":"L2-Q13/Q14","date":"2026-05-27","question":"messageTier config?","decision":"messageTier = compile-time const table; custom message type extension is cut","rationale":"9 tier closed (D9); adding a tier = changing the spec","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D19","layer":"L2-Q15","date":"2026-05-27","question":"are onMessage/onSubscribe replaceable?","decision":"substrate-fixed, not replaceable; observation uses the inspector (read-only — does not modify/emit node state, but observe via subscribe still activates a cold node, see R-observe); to insert logic add a node","rationale":"F-NO-IMPL-DEFINED; cut the user-customized protocol stack","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D20","layer":"L3-Q1","date":"2026-05-27","question":"pool required for 1.0?","decision":"LocalSync + LocalAsync; the dispatcher keeps a pluggable pool trait","rationale":"WorkerPool/RemotePool etc. added once the wire bridge matures","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D21","layer":"L3-Q2","date":"2026-05-27","question":"ownership of dispatcher/pool?","decision":"dispatcher first-class; pool hangs off the dispatcher; graph binds a dispatcher (default process-global)","rationale":"multi-tenant/sandbox isolation is natural","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D22","layer":"L3.C","date":"2026-05-27","question":"unit of concurrency?","decision":"graph = single-thread CONCURRENCY domain (the unit of concurrency, NOT the bound of causal influence); in-domain propagation is one synchronous causal wave; CAUSAL INFLUENCE crosses domains via async wire bridge as delayed consistency; compute parallelism via pool callback; true parallelism via multi-graph + wire bridge; Rust drops the actor model; Py drops the subgraph lock; rewire intra-graph only","rationale":"the wave protocol is lock-free; graph boundary = CONCURRENCY boundary is explainable; subgraph reverts to pure organization. WORDING REFINED IN PLACE 2026-05-31 (option A, SESSION-reactive-linear-and-git M4): the original 'graph = causal domain = concurrency domain' conflated two distinct things — causal influence SPANS the wire (A->wire->B makes A's cause B's effect regardless of sync/async), so a graph bounds the single-thread concurrency UNIT, not the causal influence RANGE. Behavior unchanged (wave_xgraph.tla L2.F already models cross-domain causal propagation as delayed consistency with a two-phase gate); this is a precision edit, not a behavior change.","supersedes":["D221","D222"],"status":"locked","session":"DS-1"},{"id":"D23","layer":"L3-Q6","date":"2026-05-27","question":"store?","decision":"ctx.state is per-node private (implicit is OK); graph-level shared memory = an explicit node+dep","rationale":"private state does not violate graph-first; shared memory must be inspectable","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D24","layer":"L3-Q7","date":"2026-05-27","question":"parity mechanism?","decision":"behavioral conformance replaces structural Impl; cross-track-ledger retired","rationale":"parity downgrades from symbol-set alignment to protocol-behavior conformance; operator/sugar/inspection are per-language and never enter parity","supersedes":["D196"],"status":"locked","session":"DS-1"},{"id":"D25","layer":"L3-Q8","date":"2026-05-27","question":"snapshot/restore?","decision":"topology + cache + factory-name; restore re-resolves by name; incremental changeset; inline fn marked local-only","rationale":"fn cannot be serialized, hence the factory registry pattern","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D26","layer":"L3-Q9/Q10/Q11","date":"2026-05-27","question":"central config singleton?","decision":"fully dissolved: messageTier=const; onMessage/onSubscribe=substrate-fixed; operational config=graph/dispatcher opts; clock=graph-local monotonic; the only global singleton=default dispatcher; the freeze mechanism disappears","rationale":"L3.C graph=causal domain is naturally isolated; config drift + freeze timing complexity is eliminated","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D27","layer":"L4-Q2","date":"2026-05-27","question":"how is sugar registered?","decision":"the sugar→ctx-fn conversion is strictly at the graph layer; dispatcher/node only accept (ctx)=>void","rationale":"each language's sugar is free, dispatcher/node are unified → this feeds behavioral parity (D24)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D28","layer":"L4-Q5","date":"2026-05-27","question":"cleanup hook?","decision":"ctx.onDeactivation + ctx.onInvalidate (2 hooks); cut onRerun (0 callsites) / onResubscribableReset (1 → ctx.state)","rationale":"internal state reset belongs to the ctx.state lifecycle, cleanup only handles external resources + INVALIDATE","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D29","layer":"L4-Q6","date":"2026-05-27","question":"ctx.state lifecycle?","decision":"default fresh-lifecycle wipe; ctx.state.persist(boolean?) retains","rationale":"latches like frozen-context auto-clear; persist crosses the lifecycle","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D30","layer":"L4-Q10","date":"2026-05-27","question":"error + cancellation?","decision":"throw → ERROR (graph-layer catch); cancellation defaults to no-cancel, {switch:true} opt-in + AbortSignal via ctx","rationale":"JS/Py throw is the norm; cancellation as an async pool feature is least-surprise","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D31","layer":"L4-Q11","date":"2026-05-27","question":"typed error?","decision":"error=unknown (Node<T> single generic)","rationale":"typed error causes a type-combinatorial explosion; cross-language Box<dyn Error>/Exception is the top type","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D32","layer":"L6-Q1","date":"2026-05-27","question":"package structure?","decision":"each language a self-contained complete package (@graphrefly/ts·rust·py) + a coarse-grained wire bridge; no cross-language peer-deps","rationale":"sheds D080/D206 + the 9.5× machine tax; abandons the never-functional TS-on-Rust-substrate fantasy","supersedes":["D080","D206"],"status":"locked","session":"DS-1"},{"id":"D33","layer":"L6-Q3","date":"2026-05-27","question":"wire codec?","decision":"wire=protobuf schema-codegen (a single .proto doubling as wire+protocol contract IDL); implementation deferred post-1.0","rationale":"DR-2 IDL single source","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-1","layer":"design-review","date":"2026-05-27","question":"§5.11 ctx-level exposes tier?","decision":"§5.11 amend: ctx-level (node/producer) is a protocol-facing power surface that deliberately exposes tier; value-level (derived/effect/operator) is the §5.11-compliant primary","rationale":"ctx.down's one-wave-multi-tier atomicity (terminal-with-final-value) is something the emit/error methods cannot express","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-2","layer":"design-review","date":"2026-05-27","question":"add IDL to parity?","decision":"A+C: behavioral conformance + the L6-Q3 .proto doubling as protocol contract IDL; codegen the interface skeleton (lightweight structural single source)","rationale":"pure behavioral loses the structural guarantee; the .proto has to be written anyway, so buying interface-shape consistency at zero extra cost","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-3","layer":"design-review","date":"2026-05-27","question":"async-result-at-paused-node?","decision":"goes into the pause buffer + RESUME replay","rationale":"consistent with PAUSE buffering DATA; lock_id scope = node-level pause_lockset","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-4","layer":"design-review","date":"2026-05-27","question":"graph responsibility overload?","decision":"do not introduce a separate domain concept yet (narrow-waist first); record the escape hatch","rationale":"if the inspection boundary vs concurrency boundary conflict actually materializes, introduce a domain (one domain contains multiple graphs)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-5","layer":"design-review","date":"2026-05-27","question":"conformance hard scenarios?","decision":"must include: cross-graph diamond / async-result-at-paused-node / INVALIDATE×ctx.state×onInvalidate / mixed sync-async diamond / PAUSE lockset multi-source; spec amendment list (§5.10/5.11/6.1/7.1 + 3 new)","rationale":"otherwise behavioral parity is an empty promise","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-6","layer":"design-review","date":"2026-05-27","question":"dispatcher opts structure?","decision":"grouped {limits, observability, policy}","rationale":"avoids the cognitive load of a flat dozen-plus keys","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D34","layer":"L2.A","date":"2026-05-28","question":"CSP-0: canonical messageTier const table (numbering + START placement)?","decision":"7-tier const table: 0 START(handshake) / 1 PAUSE·RESUME(control) / 2 DIRTY(notification) / 3 DATA·RESOLVED(value) / 4 INVALIDATE(settle) / 5 COMPLETE·ERROR(terminal) / 6 TEARDOWN; immediate <3, batch-deferred ≥3","rationale":"old-spec numbering with PAUSE/RESUME↔DIRTY swap (control before notification); START=10th handshake type, D9's 9 protocol types occupy tiers 1-6; amends R-tier numbering","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D35","layer":"L1.5","date":"2026-05-28","question":"CSP-0: dynamicNode/track(dep) disposition vs D4 8-verb + D22 rewire?","decision":"carry as intra-graph node construction variant (NOT a verb): superset deps declared at construction + track(dep) read-selection per invocation; unread-dep update fires fn then equals-absorbs; same first-run gate; inter-graph N/A (cross-graph deps only via wire bridge)","rationale":"distinct mechanism from rewire (per-invocation read-selection vs dep-set mutation); D22 bounds all tracked deps to one causal domain","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D36","layer":"L1.3","date":"2026-05-28","question":"CSP-0: meta companion stores substrate or presentation?","decision":"presentation/graph-layer, NOT substrate: static annotations (description/type/range/...) → describe metadata via g.node opts; reactive annotations → explicit nodes (D23); substrate node carries zero meta machinery; meta.owner ABAC is presentation/multi-agent","rationale":"D5 node=thinnest with zero inspection cruft; meta is pure annotation feeding describe (graph owns inspection)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D37","layer":"L2-Q16","date":"2026-05-28","question":"B10: synchronous feedback-cycle / re-entrant fn semantics — queue (A), reject (B), or require-async (C)?","decision":"reject, not iterate (B, owned at graph level): a node fn that during its invocation transitively re-drives one of its own deps so the same node's fn would re-enter before its wave completes is a wave-level protocol ERROR. Detection is node-local and free — refuse to enter the fn-run while the node's own in-wave flag (_insideRunWave) is already set, and throw; the graph layer catches the throw → [[ERROR,e]] down (D30), located at the cycle-closing node, wave aborted. The core neither queues (A) nor bounds-then-runs the cycle. Legit accumulation = per-node ctx.state (scan), not a topological cycle. Async feedback crossing a turn boundary (async pool) is out of scope. No maxFnRerunDepth — precise flag detection supersedes the blunt depth cap","rationale":"A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; B fixes the root with zero new structure by checking the already-existing _insideRunWave flag; dispatcher stays a pure invoke funnel (F-DISPATCH-ALL); error ownership is graph-level per the wave-level error category (D30); surfaced by CSP-1 /qa (backlog B10)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D38","layer":"L2-Q17","date":"2026-05-28","question":"B11: what does a depless source do with an upstream-forwarded control message (INVALIDATE/DIRTY/TEARDOWN) at the terminus?","decision":"the source self-ACTS only on a message with a coherent round-trip: INVALIDATE → HONOR the invalidate-request (clear cache→SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never comes). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned, not destroyable by a downstream request; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediates only forward upstream control (no self-action); the source is the single actor, the down-cascade the effect","rationale":"R-ctx-up/DR-5 deliberately lists INVALIDATE as up-allowed (unlike PAUSE/RESUME which have lockset handling) — the only self-consistent reason to allow it up is for the terminus source to honor it (DS-1 L1.11 'invalidate-request'); it is a cache-drop request not an imperative WRITE (the next value still comes from the source side), so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN have no coherent terminus action. Closes the F-NO-IMPL-DEFINED gap (B11)","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D39","layer":"L4-Q8.A","date":"2026-05-28","question":"pre-CSP-2 gate 3: pin the inspection data shapes (describe schema / observe stream protocol / profile metrics)?","decision":"describe = flat JSON-serializable snapshot {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}, DNode={id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (real operator name per D6/L1.5), status (R-status-enum), value? (absent=SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}; edges derived (R-edges-derived); explain mode = causal-chain subset; renderers are pure fns over the snapshot. observe = read-only enveloped EGRESS (NOT a graph node — avoids self-observation island, D19 read-only), item ObserveEvent={path, msg, tier, seq (graph-local clock, D26)}; one shape for single/subtree/whole-graph. profile = opt-in accumulated-counter snapshot {waves; nodes:Record<path,{invokes,emits,resolved,errored,duration?}>}, backed by an opt-in dispatcher/graph recorder (F-DISPATCH-ALL invoke funnel), NEVER on the thin node (R-node-thin), default-off (F-PERF). All three share the mount-aware :: path key + status/tier/seq metadata. Streaming describe / live-topology = an observe topology-event, DEFERRED to CSP-2 viz","rationale":"upholds R-node-thin (profile→dispatcher recorder, not node); observe read-only egress avoids self-observation island + honors D19; consistent with the already-drafted R-describe/R-observe (only pins exact fields + adds R-profile). Inspection is per-language, never in parity (D24) — these rules DOCUMENT the cross-lang contract (covers_by:[], no conformance/TLA+), they do not gate parity","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D40","layer":"L1.5","date":"2026-05-28","question":"clean-slate @graphrefly/ts: how to roll out the operator/upper-layer libraries from pure-ts (~49 operators + 5 upper-layer subsystems)?","decision":"Catalog-first: before the CSP-8 dogfood, using the frozen pure-ts (D41) as the authoritative reference, systematically re-derive the complete operator library + upper-layer subsystems (sources/composition/storage/data-structures/render) onto the new substrate, NOT pulled by dogfood. The re-derivation must align with the clean-slate new semantics (R-rom-ram RAM accumulator per B13, SENTINEL=prevData===undefined, push-on-subscribe, two-phase), re-thinking each edge case rather than copying 1:1; each operator gets a describe snapshot test (D39). operator/sources/composition/storage/data-structures are per-language (D6/D24) and never enter parity; the sole exception is rewire=substrate, which goes through conformance (C-8). Accepting the con: time to D1 value is slower, accepted. Scheduling CSP-2.5 (substrate rewire) → CSP-2.6 (sources + operator-opts base) → CSP-2.7 (operator catalog) → CSP-2.8 (upper-layer subsystems), CSP-8 consumes the complete library","rationale":"the user prioritizes 'zero upper-layer discard + completeness' over time-to-value; general operators naturally serve ≥2 segments (satisfying F-NO-WEDGE-CUT, not an R11-style vertical wedge); freezing pure-ts as a reference avoids knowledge loss; rewire is the known gap in project_rewire_gap, which Catalog-first fills naturally","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D41","layer":"L6","date":"2026-05-28","question":"how to handle the old packages @graphrefly/graphrefly (facade, D32 already retired D080/D206) + @graphrefly/pure-ts v0.49?","decision":"freeze as read-only reference: no further development, used as the authoritative reference for 'what exists, what semantics, what edge cases' when re-deriving operators/upper-layers (D40) onto clean-slate; delete once @graphrefly/ts reaches intent-parity. The CLI/parity-tests/demos dependencies on the old packages must be migrated or retired together before deletion","rationale":"no-backward-compat permits deletion, but the knowledge value is highest during the re-derivation period, so deleting too early = forcing git archaeology; D32 already decided the facade architecture is retired","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D42","layer":"L2-Q18","date":"2026-05-28","question":"CSP-2.5: rewire (setDeps/addDep/removeDep) substrate semantics — mid-wave behavior, first-run gate, cache, rejects, API shape?","decision":"Ratify the TLA+-verified (126k states, 0 violations) + 34-integration-test-validated port-model rewire design (docs/research/rewire-design-notes.md Q1–Q7) for the clean-slate substrate, adapted to the floor: (Q2) PRESERVE the first-run gate _hasCalledFnOnce — rewire is partial, never re-arms (R-first-run-gate); added deps enter prevData=SENTINEL and the fn guards via prevData===undefined. (Q7) PRESERVE cache for activated compute nodes (R-rom-ram). (Q1) added dep with cached DATA pushes [DIRTY,DATA] (R-push-subscribe); SENTINEL dep → START only. (Q3/Q6) removeDep clears the dep's dirty contribution; if it was the sole dirty contributor and the node was dirty, auto-settle. Surgical/Option-C: kept deps untouched (subscription + DepRecord survive), only removed deps unsubscribe+discard, added deps fresh-subscribe; DepRecord-ref dispatch allows free reorder. Mid-wave rewire (between dep deliveries) ALLOWED; mid-fn rewire (_insideRunWave) REJECTED — now floor-mandated by D37/R-reentrancy (a fn re-driving its own topology mid-wave is the feedback-cycle ERROR), not merely a follow-up; reentrant rewire (another in flight) REJECTED. Rejects: self-dep, cycle (DFS O(V+E)), terminal this (completed/errored), adding a non-resubscribable-terminal dep (wedge); resubscribable-terminal deps allowed. removeDep to zero deps ALLOWED (degenerate fn-no-deps, cache preserved, no auto-deactivate; SD-3). No version bump (topology≠DATA). INTRA-graph only (D22); cross-graph via wire bridge; graph-layer mount-aware g.rewire wrapper is CSP-2.x. SD-1: required fn on all three APIs (fn-deps pairing lock — user fns read data[i]/prevData[i] positionally). SD-2: R-rewire flips active only AFTER cross-axis formal coverage (rewire×{INVALIDATE/terminal/equals/multi-sink}) is modeled, not just the per-node MC + integration tests (F-PROTO-SPEC).","rationale":"rewire was fully designed+TLA+-verified+34-test-validated in port-model; clean-slate wave-state concepts map 1:1 so this ratifies proven work rather than re-inventing (D40 Catalog-first: don't discard upper-layer design knowledge). The floor REINFORCES it — D37 upgrades mid-fn-reject to mandatory; R-push-subscribe/R-first-run-gate/R-rom-ram/D22 confirm the Q-resolutions. Substrate prerequisite for higher-order operators (CSP-2.7).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D43","layer":"L1.5","date":"2026-05-29","question":"CSP-2.6: surface shape for the re-derived catalog (sources + operators) + the operator-opts factory base, given describeKind is dead under D6/D39?","decision":"Operators (INCLUDING the 6 landed map/filter/scan/take/distinctUntilChanged/merge) become free-standing operator-factory definitions built on the `node` primitive (NOT the `derived` verb). A single generic graph funnel g.initNode(operator, deps, config?, opts?) instantiates ANY operator factory with the graph's wiring: dispatcher injection + the D30 throw->ERROR boundary + _add real-factory-name registration. This replaces the per-operator Graph methods (the 6 landed g.map/... methods are removed, no-backward-compat). Because instantiation flows through the graph, the factory name is recorded in the graph-layer _entries exactly as today -> describe/observe/profile/find stay UNCHANGED (_entries-based) and the node stays thin (R-node-thin intact, no new node field on the canonical path; NodeOptions.factory? reserved only for standalone graph-less operators). The pure-ts operatorOpts/partialOperatorOpts/gatedOperatorOpts trio is NOT ported: operatorOpts's sole job (describeKind:'derived') is dead under D6/D39/R-describe (factory = real operator name); only the partial / terminalAsRealInput flags survive, carried per-operator via the funnel's flags. Async sources (timer/interval/fromPromise/fromAsyncIter + fromAny/NodeInput<T>) are binding-layer producer-based sugar (D40, feedback_async_sources_binding_layer): timer/interval = pool:'sync'+pausable:false; fromPromise/fromAsyncIter = pool:'async'; cleanup via ctx.onDeactivation (D28); emit only via ctx.down, with setTimeout/Promise confined to source bodies (R-no-raw-async). No substrate change and NO spec amendment (per-language D6/D24, never parity; only rewire is substrate/conformance). SD: resolve the latent substrate edge first -- _shouldBufferOnPause buffers async-pool late emits even when pausable===false, contradicting R-pause-modes' false carve-out; ship async sources on the sync-pool default OR fix _shouldBufferOnPause via /spec-amend+conformance before any pool:'async'+pausable:false source ships (backlog).","rationale":"Free-standing operator defs are tree-shakeable + extensible (user priority: catalog completeness over 49 hardcoded Graph methods). The generic g.initNode funnel keeps the Graph as the single wiring + inspection point (D5) with MINIMAL change -- no DAG-walk discovery, no node->graph back-ref, node stays thin (R-node-thin), and describe/observe/profile are untouched. D27 preserved (the operator body is still a (ctx)=>void wrapped at the graph layer); D6 preserved (real factory names recorded at initNode->_add). The operatorOpts trio doesn't port because describeKind was its only purpose and that concept is dead in clean-slate. Sources are binding-layer per feedback_async_sources_binding_layer; substrate verified feasible (depless producer + captured ctx.down late-emit) without a spec change.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D44","layer":"L2-Q19","date":"2026-05-29","question":"PAUSE buffering precedence: how does `pausable` mode (R-pause-modes) interact with async-result buffering (R-async-paused) for `pausable:false` and for an async LEAF SOURCE in `true` mode? (B20 + its twin, surfaced by the D43 sources.)","decision":"`pausable` mode is the OUTER gate over R-async-paused buffering. (1) false: ignore PAUSE/RESUME ENTIRELY — never gate recompute, never buffer, regardless of pool (sync/async) or node kind (leaf/compute); the node keeps producing through any PAUSE. This DOMINATES R-async-paused (resolves B20). (2) true (default): PAUSE is backpressure on recomputation/propagation only — an async COMPUTE node's (deps>0) in-flight recomputation result buffers when paused (R-async-paused/C-2), but a LEAF SOURCE's (depless) own external down() — sync OR async (timer tick / promise resolve / state.set) — is NOT gated, delivered immediately. (3) 'resumeAll': production-gating mode — buffer the node's own tier-3/4 settle slice incl. a leaf source's own (sync/async) production, replay on final-lock RESUME. Discriminator leaf-vs-compute = deps.length===0. Impl in _shouldBufferOnPause: false->return false; resumeAll->buffer; true->buffer only `!_insideRunWave && asyncPool && deps>0`. Formal: wave_async_paused.tla parameterized by Mode+IsLeaf, invariant NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified.","rationale":"Resolves a genuine under-specification between two ACTIVE rules — R-pause-modes (false=ignore; true leaf-source carve-out) vs R-async-paused (async result at paused node buffers) — which gave OPPOSITE answers for pausable:false+async (B20) and true+async-leaf-source with no stated precedence. The chosen precedence follows R-pause-modes' OWN rationale ('PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job') — production is gated only by resumeAll, never by true/false. Surfaced by D43 (CSP-2.6 async sources: timer/interval pausable:false + fromPromise/fromAsyncIter async leaf sources). Extends D10 (pause modes) + DR-3 (async buffering); does not supersede them. C-2 baseline (async compute node) is preserved.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D45","layer":"L1.5","date":"2026-05-29","question":"CSP-2.7 — how do operators form topology, given D43 already locked the funnel/factory shape?","decision":"Operators form graph topology ONLY via [declared deps (static, construction-time)] or [rewire (D42, dynamic)]. Calling node.subscribe() on another graph node from inside an operator fn body to form ongoing topology is BANNED — it creates an edge describe cannot show (an island), violating D3/R-edges-derived/D39. A depless source bridging EXTERNAL async (no graph-node deps) is exempt (already D43). Multi-source combinators (merge/zip/concat/race/combine/combineLatest/withLatestFrom) = static deps + partial + ctx.state (queue/phase/winner/tuple-equals). Dead-inner handling is carried by the substrate via DepRecord.terminal + terminalAsRealInput; the pure-ts subscribeOr/trySubscribeOrDead helpers are NOT ported. The operatorOpts/partialOperatorOpts/gatedOperatorOpts trio is NOT ported (describeKind is dead, D43). DROP pausable (no-op identity — clean-slate nodes handle PAUSE/RESUME natively) and interval-as-operator (it is a source, lives in sources.ts).","rationale":"D3 graph-first requires describe to be truthful; internal subscribe = an unexplainable island. The landed merge factory already proves the dep-based shape works. Reusing the substrate wave machinery avoids a second subscription stack. Per-language (D6/D24), never in parity.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D46","layer":"L1.5","date":"2026-05-29","question":"CSP-2.7 — what shape do time-based operators take under R-no-raw-async?","decision":"Split reactive-core from time-sugar. Notifier-driven forms (sample/buffer/window gated on a reactive notifier node) = pure dep-based, shipped in the first cut. Wall-clock-arithmetic forms (delay/debounce/debounceTime/throttle/throttleTime/audit/auditTime/timeout/bufferTime/windowTime) MUST NOT use a raw setTimeout in the operator body (R-no-raw-async / check-no-raw-async.ts); they are ABSENT from the first cut and deferred to backlog (B23), triggered by a resettable/cancellable time-source primitive (async still confined to sources.ts) or a mature async pool. The first-cut docs must state the absence explicitly (no silent cap).","rationale":"Notifier-forms are more reactive-pure and immediately shippable; forcing wall-clock forms onto a fixed timer source yields semantically imprecise operators (violates D40 per-operator edge-case re-derivation). delay/timeout need multi-concurrent/resettable timers that are intrinsically a source-layer concern. Per-language (D6/D24).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D47","layer":"L2-Q20","date":"2026-05-29","question":"CSP-2.7 higher-order operators (switchMap/exhaustMap/concatMap/mergeMap/flatMap): what substrate mechanism wires the runtime-created inner nodes, given D45 bans internal subscribe and D37 + the async-pool probe block every in-fn / async path to self-rewire?","decision":"Add a SUBSTRATE self-triggered, wave-boundary-deferred dep-set mutation affordance (ctx.rewireNext) supporting BOTH addDep and removeDep (option beta). A node fn may, during its run, REQUEST a mutation of its OWN dep set; the request is queued and APPLIED by the dispatcher at the committed wave boundary (after the current wave settles, and after a batch() commits or the final-lock RESUME), as a fresh wave, reusing R-rewire surgical/Option-C semantics (D42). Drain is deterministic: per-node FIFO in issue order, nodes in causal order. A no-net-change request is a no-op; an oscillating net-changing request every boundary is a user-level runaway (like an infinite producer), not a substrate-detected error. This is NOT the D37 mid-fn reject — IMMEDIATE in-fn self-rewire still throws (R-reentrancy); the deferral moves application to a turn boundary where _insideRunWave is false. Inners become VISIBLE self-deps (D45/D3; a describe snapshot shows currently-live inners). removeDep is REQUIRED (beta over read-gate-only alpha): read-gating masks OUTPUT but cannot stop an abandoned inner's still-running source — only removeDep -> _deactivate -> onDeactivation tears down upstream work (switchMap abortInFlight: cancel the in-flight LLM/fetch) and bounds memory (drop completed inners). Architecture: ONE substrate dep-set with {read-mask(track) + add + remove + wave-boundary-deferred self-mutation}; dynamicNode (D35, construction superset + track-by-index) and a future autoTrackNode (runtime append-only discovery + track-by-ref) are read-mask sugars that NEVER remove; the *Map family are sugars that add+remove; sugar names stay distinct (D5/D6). *Map inner-lifecycle folding: inner COMPLETE -> rewireNext(remove) (no downstream COMPLETE unless source done AND no live inner; completeWhenDepsComplete:false + terminalAsRealInput); inner ERROR -> forward, mergeMap does NOT cancel siblings; inner INVALIDATE -> absorbed at the operator; source ERROR -> remove all inners; abortInFlight = the removeDep->onDeactivation teardown. PREREQUISITES (gating): R-rewire-deferred draft + formal wave_rewire_deferred.tla (rewire x wave-boundary axis) TLC-green + conformance C-11 green per arm BEFORE flip-active (F-PROTO-SPEC + SD-2); B15 (fn-swap handle GC) MUST land first. *Map EXCLUDED from the CSP-2.7 first cut until these clear.","rationale":"Read-gate (append-only, the dynamicNode/autoTrackNode model) is correct for OUTPUT but cannot stop upstream WORK (a subscribed source keeps running; only unsubscribe->_deactivate->onDeactivation cancels) — so switchMap cancel-the-superseded + abortInFlight + memory bounding require REMOVE, hence beta. Deferring to the wave boundary clears D37 by construction (turn boundary, not synchronous re-entry) and keeps inners visible (D45/D3). Unifying at the substrate (one dep-set, many sugars) avoids three overlapping primitives (D5/D6). Probe: the async pool does NOT defer the fn (dispatcher/index.ts:48 + node.ts:692, _insideRunWave set during any fn run), so the wave boundary is the only legal application point.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D48","layer":"L4-Q7","date":"2026-05-29","question":"Do operators ship tiered across packages (L4-Q7: core in main, time+higher-order in @graphrefly/<lang>-operators) or all in the main package?","decision":"All operators ship in the main @graphrefly/ts package as free-standing tree-shakable factory definitions (graph/operators.ts), exported from the single index; there is NO @graphrefly/<lang>-operators subpackage. The main package is sideEffects:false + ESM (tsup), so an unused operator is dropped at the consumer's bundle step — pay only for what you import, without a package split. SUPERSEDES the L4-Q7 tiered-subpackage lock (and the @graphrefly/<lang>-operators mention in L6-Q2): its bundle-size rationale is obviated by ESM tree-shaking, and clean-slate has no heavy operator deps (time operators deferred to B23; async confined to sources). Per-language (D6/D24); higher-order *Map (pending D47 substrate) also lands in main.","rationale":"D43 already made operators free-standing tree-shakable factories citing tree-shakability, and the 6 landed operators + sources sit in the main package (sideEffects:false). A separate package adds build/version/peer-dep complexity for zero bundle-size benefit under ESM tree-shaking. Retiring L4-Q7's split keeps the decision log consistent with the code (single source of truth).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D49","layer":"L2-Q9","date":"2026-05-29","question":"Auto-substitute DATA->RESOLVED on value-equality (D15), or keep every occurrence as DATA and push dedup to the operator layer?","decision":"REMOVE substrate auto-equals-substitution (Opt-3, supersedes D15). (1) Every value-occurrence is ALWAYS emitted as DATA; a node never substitutes DATA->RESOLVED on value-equality, and the substrate no longer inspects the per-wave DATA count for substitution. fromIter([1,1,1]) -> [DATA,DATA,DATA]. (2) RESOLVED is RETAINED, narrowed to ONE meaning: a node DIRTY'd in phase 1 that produced NO tier-3 value this wave emits exactly one RESOLVED to clear the downstream dirty (filter-reject, zero-dep un-dirty, INVALIDATE arriving at a never-populated cache, batch-rollback DIRTY-balance). It never means 'value unchanged'. This undirty RESOLVED is SUBSTRATE-SYNTHESIZED (a value-level operator just returns without emitting; the substrate emits the balancing RESOLVED) so operator bodies stay clean (R-primary-api-clean); an operator MAY emit its own DATA/RESOLVED explicitly as an escape hatch if a corner case needs it. Tier-3 wave exclusivity holds (>=1 DATA XOR 1 RESOLVED), re-justified as occurrence-vs-undirty. (3) Dedup ('skip an expensive recompute / suppress an unchanged emission') is OPT-IN at the operator layer (distinctUntilChanged with its own eq via ctx.state, or an operator fn early-return); NodeOptions.equals (substrate) is REMOVED. Glitch-free diamond (R-two-phase + R-diamond) is orthogonal and PRESERVED.","rationale":"equals-absorption overloaded RESOLVED (occurrence-with-unchanged-value vs dirty-clear) and destroyed 'an occurrence happened' info, breaking event-counting/accumulating operators (probe: fromIter([1,1,1]) -> [DATA,RESOLVED,RESOLVED]; take(3) -> [1] not [1,1,1]). Narrowing RESOLVED to undirty-only keeps occurrences as DATA (take/scan/skip/elementAt/reduce/snapshot correct without special-casing), turns RESOLVED into a clean undirty signal, and drops a per-emit equals check on the common path. Accepted cost (F-PERF): auto-suppression of unchanged-value cascades is gone; dedup is now opt-in via distinctUntilChanged (explicit control).","supersedes":["D15"],"status":"locked","session":"DS-1"},{"id":"D50","layer":"L2-Q21","date":"2026-05-29","question":"INVALIDATE × PAUSE precedence: what does a dep's INVALIDATE do to a paused (default-mode) compute node's coalesced recompute? (cross-axis gap surfaced by the CSP-5 Rust control/terminal slice /qa, finding A — the INVALIDATE-side analogue of D44's async×PAUSE precedence)","decision":"(Q1) a dep INVALIDATE while N is paused PROPAGATES downstream IMMEDIATELY (consistent with immediate DIRTY; not gated/buffered in default mode — buffer-replay is resumeAll's job; the downstream un-wedges its DIRTY via the INVALIDATE's dirty-clear, no wedge). (Q2) it SUPERSEDES that dep's buffered paused dep-wave: clear the dep to SENTINEL + drop its pending change, then RE-DERIVE pendingRecompute (paused_dep_wave_occurred) from whether ANY dep still carries a buffered change (ATTRIBUTED cancellation). N recomputes on final-lock RESUME ONLY if some dep still has a live buffered change; if the INVALIDATE leaves no buffered change the paused recompute is CANCELLED (N already settled to SENTINEL via its own INVALIDATE — nothing to recompute). A later DATA on the same dep RE-ARMS the buffer: [DATA(v1),INVALIDATE,DATA(v2)] → N recomputes with v2 on RESUME. Scoped to default ('true') mode; resumeAll buffers+replays tier-3/4 on its own path.","rationale":"the current impl leaves paused_dep_wave_occurred set after an INVALIDATE clears the sole buffered dep → on RESUME N recomputes against a now-SENTINEL dep: a redundant undirty RESOLVED for a SENTINEL-guarding fn, and a spurious TERMINAL ERROR for a non-guarding fn (its .unwrap() panics → [[ERROR,e]] via D30). Attributed cancellation kills the spurious recompute without dropping a surviving dep's legitimate update (multi-dep). Parity-consistent latent gap in BOTH arms (TS yields a garbage value instead of ERROR). Extends D10/D44 (pause modes); references R-invalidate-idempotent. Formal wave_paused_invalidate.tla TLC-green (327 states) + ChangedImpliesLive mutation-verified load-bearing.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D51","layer":"L4-Q8","date":"2026-05-30","question":"Does describe() render construction-time deps or current/live deps after a rewire (C-8 immediate / C-11 *Map deferred), and how are runtime-created inner deps (bare graph-less nodes) shown?","decision":"describe() is a LIVE point-in-time snapshot: edges derive from each registered node's CURRENT deps (live _deps, re-read at call time), NOT the construction-time snapshot — so every edge corresponds to a REAL current subscription (D3 / R-edges-derived truthfulness) and rewire (C-8 + C-11) is reflected. A live dep absent from the graph inspection index (a runtime-created *Map inner / bare fromAny node) is AUTO-DISCOVERED on each describe() call as a snapshot node — synthesized stable id; status/value from the node getters; factory taken from the inner's OWN NodeOptions.factory (the field D43 RESERVED for 'standalone graph-less operators', set by the free initNode at the inner's creation), else '?' when absent. Chosen variant = B2 (live auto-discovery + the D43-reserved factory): inners are NEVER persistently registered in _entries — best-effort live capture, no register/unregister churn on fast inner turnover (switchMap creates/destroys an inner per source value). The persistent-registry variant B1 (graph-in-body / ctx.graph / a node→graph backref) is REJECTED: it pierces D27 (node/dispatcher see only (ctx)=>void) + R-node-thin and churns the index. First cut auto-discovers ONE level (the direct inner deps); transitive discovery (an inner carrying its own subtree) is a follow-up. Live-topology STREAMING (rewire deltas) stays an observe topology-event, deferred to viz (R-describe / B4) — a point-in-time read is NOT streaming. Adds an optional Node.deps readonly getter (R-node-iface) + realizes NodeOptions.factory? (D43-reserved, OFF the canonical wave path, R-node-thin intact).","rationale":"R-edges-derived self-contradicts once rewire exists: 'construction-time deps' vs 'every edge has a real protocol subscription' — after removeDep (C-8) a construction edge is decorative (no subscription), violating D3; for *Map (C-11) construction deps OMIT the live inners. A live-dep snapshot restores truthfulness and realizes D47/C-11 ('a describe snapshot shows currently-live inners'). B2 gives NAMED inners WITHOUT graph-in-body or a persistent registry — matching the user's best-effort-capture intent (point-in-time, no churn) by reusing D43's already-reserved factory field. Per-language inspection (D24, never in parity, no conformance). Amends R-edges-derived ('construction-time'->'current/live') + R-describe (snapshot reflects live deps + auto-discovery + NodeOptions.factory naming). Surfaced as backlog B34(a) by the CSP-2.7 /qa; locked via /design-review (B2 over A over B1).","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D52","layer":"L1.5","date":"2026-05-30","question":"CSP-2.7 wall-clock time operators (delay/debounce(Time)/throttle(Time)/audit(Time)/timeout/bufferTime/windowTime) were deferred by D46/B23 pending 'a resettable/cancellable time-source primitive or a mature async pool'. Given the higher-order *Map machinery (D47/ctx.rewireNext) landed 2026-05-30 AFTER D46/D47 were locked (2026-05-29), do these still need a new primitive?","decision":"No new primitive. Wall-clock time operators are authored as COMPOSITIONS over the already-active substrate. debounce/throttle/delay/audit/timeout = *Map(switchMap/exhaustMap/mergeMap/concatMap) over the EXISTING timer(ms) source: the timer's onDeactivation clearTimeout IS the reset/cancel — switchMap's removeDep->onDeactivation cancels an in-flight timer, the declarative equivalent of pure-ts's imperative clearTimeout-then-setTimeout debounce (frozen ref time.ts, D41). bufferTime/windowTime = buffer/window(notifier) over the EXISTING interval(ms) source (notifier-driven forms already first-cut per D46). setTimeout/setInterval stay confined to the timer/interval source bodies (R-no-raw-async clean, check-no-raw-async passes); operator bodies carry ZERO raw async. REFINES D46's deferral RATIONALE ONLY (D46's notifier-driven first-cut shape UNCHANGED): the 'needs a resettable time-source primitive OR a mature async pool' premise is obsoleted by the D47 *Map landing — the *Map+timer swap is the third path D46 could not rely on (D46/D47 locked 2026-05-29; *Map landed 2026-05-30). Time operators REJOIN the CSP-2.7 implementable catalog: per-language (D6/D24), NO /spec-amend, NO substrate change, NO conformance (operators never in parity). REJECTED (B) a dedicated resettable-timer source — its reset channel would need a new tier (D9 constitutional) or an imperative reset (R-no-imperative); (C) allowlisting a time/ operator dir for raw setTimeout — D46 forbids raw setTimeout in operator bodies + spreads async beyond sources. Per-operator edge: trailing-value-flush-on-source-COMPLETE defaults to DROP (clean-slate changes-only, consistent with merge B13); opt-in flushOnComplete for RxJS parity. VERIFIED before lock: a throwaway switchMap+timer debounceTime probe is GREEN incl. the discriminating boundary-deferred removeDep->onDeactivation->clearTimeout cancel timing (v1 then v2 within the window emits only v2; the cancelled timer-1 never fires) — load-bearing premise empirical, not assumed.","rationale":"Reuses the landed + conformance-green *Map(C-11)+timer+buffer(notifier) machinery — zero substrate change (F-PERF/F-NO-WEDGE-CUT), no new primitive to maintain. It is the declarative reactive equivalent of pure-ts's own clearTimeout/setTimeout debounce, so the semantics have precedent. Alternatives B and C both fight the floor (new tier / imperative reset / async-outside-sources). The B23/D46 blocking premise was a stale-by-one-day artifact (the *Map mechanism that dissolves it landed the day after D46 locked) — a verify-premise-before-greenfield catch; probe-verified before lock per the three-gate edge-case-design discipline.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D53","layer":"L1.5","date":"2026-05-30","question":"B28 -- under D49 (no equals-absorption) a dynamicNode re-emits DATA when an UNREAD (untracked) dep changes, losing the auto-quiet-on-unread-deps property. Restore it via a substrate read-mask (track records the per-invocation read-set; a wave whose DIRTY contributors are all outside the last read-set is absorbed), or keep auto-quiet as an opt-in composition?","decision":"Keep fn-controlled / opt-in (Option B, enriched per user). NO substrate read-mask. A dynamicNode's fn (a ctx-fn with EXPLICIT ctx.down -- node.ts dynamicNode = NodeFn) ALREADY fully controls whether an unread-dep change propagates: it inspects which deps delivered this wave (ctx.depRecords[i].batch non-empty) and DECIDES. To stay QUIET on an unread-dep-only wave it early-returns WITHOUT ctx.down -> the substrate synthesizes ONE undirty RESOLVED (D49/R-resolved-undirty, RESOLVED's single meaning = UNDIRTY) -> downstream sees DIRTY->RESOLVED = no new value, quiet. To PROPAGATE it calls ctx.down([[DATA,..]]). VERIFIED (throwaway probe GREEN): prime A,B; unread B-change -> fn early-return -> DIRTY,RESOLVED downstream (NO redundant DATA); read A-change -> DIRTY,DATA. ctx.track(i) stays a pure value-reader (depRecords[i].latest = this-wave value if delivered else cache). Downstream distinctUntilChanged remains an ALTERNATIVE for value-based dedup. CLOSES B28. REJECTED (A) the substrate read-mask: although VERIFIED sound (read-set = f(read-values, ctx.state), both stable on an unread-only wave -> output provably unchanged), it HARD-CODES ONE policy ('a wave driven only by unread deps is always absorbed') -- but whether an unread-dep change SHOULD re-trigger the node is USE-CASE-DEPENDENT (some compositions want B to re-fire D, some do not; both legitimate). An automatic substrate mask REMOVES that choice; leaving it to the fn PRESERVES both at zero substrate cost and keeps dynamicNode from being the lone exception to D49's opt-in-dedup-everywhere. RE-OPENABLE only if a real consumer needs the mask AND per-invocation read-set recording proves cheap. ZERO behavior change (fn-controlled quiet already works on the landed substrate); NO /spec-amend formal/conformance; R-dynamic-node statement updated.","rationale":"The suppress-vs-propagate decision on an unread-dep change is a POLICY that varies by use case (user's framing) -- so it belongs to the dynamicNode fn, not an automatic substrate read-mask that hard-codes 'always suppress'. D49 already narrowed RESOLVED to exactly UNDIRTY, which is the clean quiet signal: fn early-return -> substrate undirty RESOLVED -> downstream un-dirtied without a redundant DATA. This gives per-composition control + value-based distinctUntilChanged as a complement, at zero substrate cost (F-PERF), and keeps dynamicNode from being the lone exception to D49's opt-in-dedup-everywhere. The sound-but-heavier read-mask (A) is documented + re-openable. Probe-verified before locking the refinement (verify-premise discipline). Per-language: track + undirty RESOLVED are substrate, but no arm needs an impl change -- current behavior already IS this.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D54","layer":"L1.5","date":"2026-05-30","question":"CSP-2.8 data-structures (reactive-list/map/index/log) -- what shape is the mutation INPUT surface, given the floor's no-imperative-triggers + the user's allergy, and that the frozen pure-ts reference exposes 4-6 imperative mutation methods (.append/.set/.delete/.upsert/...) per structure? (Fork A, the gating decision for CSP-2.8.)","decision":"A3 (hybrid dual boundary). The reactive structure's CORE is a reactive RAM accumulator over a command/value stream (R-rom-ram; the exact scan-vs-state-snapshot core + snapshot-vs-delta primary emission = the shared-core / Fork-B follow-up, NOT this decision). The mutation INPUT surface is DUAL-FORM: (1) imperative methods (.append(v)/.set(k,v)/.delete(k)/.upsert(..)/.clear()/...) as the EXTERNAL input boundary -- legitimate `state`-verb sugar (D4: state.set IS the sanctioned way external non-reactive values enter a graph; a data-structure mutation is a state transition, not a forbidden reactive-recompute trigger); AND (2) the SAME surface WIDENED to accept a reactive source -- a method/constructor takes `T | Node<T>` (and/or construct-from-command-source) so an in-graph reactive producer drives the structure with ZERO imperative glue (feedback_no_imperative_wrap_as_primitive: widen the helper's args to T|Node<T> so callers opt into reactive control without forcing the abstraction). REJECTED A2 (pure-reactive scan over a command stream, no methods): the EXTERNAL input boundary is UNAVOIDABLY imperative -- a non-reactive event (UI click / network callback) must enter the graph through some imperative call; A2's 'zero imperative' is ILLUSORY at that boundary (it only relocates `.append(v)` to 'emit a command', forcing external callers to construct command messages, with in-graph composition the sole real gain). REJECTED A1 (imperative-only): forces imperative glue for in-graph composition. A3 keeps the CORE purely reactive (scan/state -- describe-able, no island, D3/R-edges-derived) while serving BOTH the external boundary (ergonomic imperative methods, state-verb-legitimate) and in-graph composition (Node-accepting widening). The imperative methods are NOT the 'remove when no caller depends' case -- the external boundary always has a caller (the structure exists to receive external input). Per-language (D6/D24, never in parity, no conformance). Old-core dissolutions carried into impl (NOT forks): equals:a===b REMOVED (D49 -- idempotent no-op judged by the structure's own version counter, not substrate equals); describeKind dropped (D6/D39/D43 -- real factory names); reactive-log empty/never-set lastValue = SENTINEL (D49 narrowed RESOLVED to undirty -- replaces the old [[RESOLVED]]-for-empty dual-role; prevData===undefined detection); reactive-index byPrimary = a derived node over the ordered snapshot.","rationale":"The external input boundary cannot be made non-imperative (the non-reactive world must enter somewhere) -- so the floor's no-imperative-TRIGGERS rule (which targets faking reactive recomputation via emit/callback) is NOT violated by a state-input boundary (D4 sanctions state.set). The user's own durable pattern (no_imperative_wrap_as_primitive) prescribes exactly the T|Node<T> widening for a primitive that inevitably re-exposes an imperative helper. A3 yields a reactive, inspectable core + ergonomic external boundary + glue-free in-graph composition; A2 trades external ergonomics for an illusory purity; A1 forces glue. No probe needed (API-shape design; substrate facts scan=R-rom-ram accumulator, state verb, D49 commands-as-DATA already established). GATING decision for CSP-2.8 data-structures; the shared reactiveCollection core, scan-vs-state, and snapshot-vs-delta (Fork B) build on this boundary shape.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D56","layer":"L1.5","date":"2026-05-30","question":"CSP-2.8 composition (stratify / stratifyBranch / topologyDiff) re-derivation onto the clean-slate substrate (describe = flat live snapshot D39/D51; topology only via declared deps or rewire D45/D42)?","decision":"(1) topologyDiff = pure static analysis over two describe snapshots -> DescribeChangeset; ZERO old-core deps; MECHANICAL port, adapted to the D39 DescribeSnapshot shape (nodes/edges/subgraphs). (2) stratifyBranch = re-derived as a DECLARED-DEP 2-dep node (deps=[source, rules], classifier fn), NOT the frozen reference's direct cross-graph node.subscribe() -- which forms an edge describe cannot show (a D45/D3/R-edges-derived ISLAND VIOLATION in the frozen ref). The two-dep gating is the normal two-phase wave (both deps settle); the rules.cache peek is replaced by reading the dep value (R-push-subscribe delivers it on subscribe); describeKind dropped (D6/D39, real factory name). (3) stratify = a branch-builder composition over stratifyBranch; FIRST CUT = STATIC rules (N fixed branches declared at construction, each a stratifyBranch declared-dep node -- inspectable, zero rewire). DYNAMIC rules (a rules-node change adds/removes branches at runtime via ctx.rewireNext/D47) DEFERRED to a follow-up (backlog), matching the operator first-cut discipline (static before dynamic) + no-silent-cap disclosure. The cross-graph source case = wire bridge (D22/D33), not an in-process node proxy. Per-language (D6/D24, never parity, no conformance).","rationale":"topologyDiff is already clean (pure data over snapshots). stratifyBranch's frozen direct cross-graph subscribe is a latent D45 island violation; declared-deps fix it for free AND make the branch inspectable. Static-rules-first keeps the first cut declarative + rewire-free; dynamic rules reuse the just-landed rewireNext (D47) when a real consumer needs runtime branch reconfiguration.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D57","layer":"L3","date":"2026-05-30","question":"CSP-2.8 storage (tiers / WAL / content-addressed / cascading-cache) -- substrate/spec or binding-layer, and how does its pervasive async I/O interact with the sync wave core (F-SYNC-CORE)?","decision":"Storage is BINDING-LAYER (per-language D6/D24, never in parity -- same disposition as async sources D43), NOT substrate/spec. The async I/O (IndexedDB/fs/sqlite/SHA-256/WAL) is confined to the storage adapter, NEVER entering the sync wave core (F-SYNC-CORE). Integration: (1) PERSISTENCE = an OBSERVE-SINK (D39 observe = read-only enveloped egress) the adapter subscribes to, plus an async writer that persists snapshots/diffs at the wave-close boundary. flush = FIRE-AND-FORGET by default (low reactive latency; durability errors absorbed, mirroring the frozen cascading-cache fireAndForget) + opt-in SYNC-FLUSH for durability-critical consumers (blocks the next commit until the write settles). (2) HYDRATION/restore = a BOOTSTRAP-PHASE pooled async op (D20 pool) that batch()-replays persisted frames into the graph through the normal input boundary (D12 batch), NOT a wave-core operation; a ready() signal gates on hydration. (3) ROLLBACK on wave-throw = best-effort async discard in the adapter, not a sync-core guarantee. (4) cascading-cache = a GRAPH-LAYER REACTIVE read-through cache (each entry a state node, R-rom-ram) fronting the async tiers as a miss-source (fromPromise-style async source, D43) -- distinct from the persistence adapter. Tier interfaces (StorageBackend/SnapshotTier/AppendLogTier/WAL/content-addressed) are binding-layer APIs, async-aware per runtime. Versioning (cid/schema/caps, B3) stays deferred.","rationale":"Storage is async I/O; F-SYNC-CORE confines async to pools/sources/wire-bridge, and D43 already set the precedent that async, per-language concerns are binding-layer (never parity). Storage attaches as an OBSERVER (reads egress + writes async), never participating in the sync cascade -- so the observe-sink + bootstrap-pool model fits cleanly. Fire-and-forget default keeps reactive latency low (most apps); durability-critical opts into sync-flush. cascading-cache is genuinely reactive (state nodes) so it lives at the graph layer, the async tier as a fromPromise miss-source.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-7","layer":"design-review","date":"2026-05-30","question":"Rust-core value representation for extreme single-thread perf + Model-B readiness: keep erased (AnyValue=Rc<dyn Any> everywhere), fully monomorphize (Node<T> typed end-to-end), or hybrid (typed/monomorphized internal hot path + erasure confined to genuine boundaries)?","decision":"Adopt the HYBRID shape as the perf DIRECTION (design-review option C): a typed/monomorphized internal wave-state hot path, with erasure CONFINED to genuine boundaries -- heterogeneous fan-in, cache()/snapshot, and the future FFI edge (Model B dynamic Python/Ruby frontends). Refines the prior per-language choice (erased AnyValue=Rc<dyn Any> + typed Node<T> facade; a /dev-dispatch Phase-2 per-language call, not previously a D#). Per-language (D24/F-PERF), behavior-preserving -- the conformance arm (C-2..C-15) is the validation GATE, not argument; describe-invisible (D39, value-rep is not a topology concern). LOCKED HERE: (1) the SHAPE = hybrid; (2) the validation METHODOLOGY = ceiling-ratio discipline (optimize until within 1.5-2x of hand-rolled no-framework Rust AND near-linear core scaling; a stopping criterion, NOT a Stage-N target). GATED, NOT locked here: the build GO, the marshal-layer design, and the WorkerPool graph-thread re-entry mechanism -- all DEFERRED to two measurement probes: Stage-0 ceiling (N-thread vs 1-thread on a tunable CPU-bound kernel in Rust/TS/Py, exposing the GIL reality = the cross-language kill-switch) + typed-vs-erased (quantify the box+downcast tax = de-gates the GO). If typed-vs-erased shows a small gap, option A (keep erased) wins on simplicity and the build GO is dropped. Strategic frame (NOT locked here, deferred to a future /design-review gated on the probe data): Model B = TS stays self-contained native JS (browser/V8, the napi loss>gain finding holds for TS); Python/Ruby and other slow+FFI-friendly languages ride the Rust core as thin frontends, collapsing cross-language parity from N-way to TS<->Rust 2-way -- node bodies must be Rust (the constraint that closes the parity gap).","rationale":"Only the hybrid (C) BOTH removes the hot-path box/downcast tax (the self-imposed Axis-2 ceiling) AND preserves a dynamic erased boundary, which Model B runtime-typed Python/Ruby frontends require -- full monomorphization (B) cannot expose a dynamic boundary; keep-erased (A) pays the box tax everywhere to serve the minority heterogeneous-fan-in case. Matches the proven Polars/Arrow/PyTorch pattern (typed native engine + dynamic frontend), de-risking the architecture. Behavior-preserving + describe-invisible = pure upside on correctness; de-erasure also removes a downcast().unwrap() bug surface on the hot path. Magnitude is unknowable without measurement (F-PERF: budget every abstraction with DATA, not assertion), hence the probe gate. Surfaced + reviewed via /design-review (Q5-Q9) 2026-05-30; perf is per-language so NO spec-amend, NO parity impact (D24). Numbered DR-7 (design-review namespace) to avoid a D-number race with a concurrent authority-repo writer.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"DR-8","layer":"design-review","date":"2026-05-30","question":"Following DR-7 (value-rep hybrid) + a Go-vs-Rust + Model-B strategic review: what is the Rust performance END-STATE direction, is Go a better native-core language, and how does the cross-language strategy + scheduling settle?","decision":"(1) Rust perf END-STATE = arena + index/generational handles (the dispatcher already uses this slotmap pattern, B32), NOT merely de-erasure: move the hot path OFF Rc<RefCell> (refcount + dynamic-borrow tax) onto arena-owned nodes addressed by index handles -- beats BOTH the current Rc<RefCell> AND a tracing GC. De-erasure (DR-7) brings Rust to compute-PARITY with TS; arena+index is the path to the cases where Rust STRUCTURALLY wins (GC/alloc-heavy, cache-bound large-graph, integer/bit work where JS is f64-only, cold-start no-JIT-warmup, polymorphic real-engine no-V8-deopt, SIMD, predictable latency). Call this the Stage-3 target. (2) Go EVALUATED + REJECTED as the native core: Go HAS a GC (forfeits the GC-avoidance edge -- it sits in the GC bucket with TS/Python, not Rust) and is a POOR FFI host (cgo slow + ships a whole runtime/GC/scheduler -> cannot cleanly be the Model-B Python/Ruby core, where the Rust no-runtime C-ABI is ideal: Polars/pydantic-core/tokenizers). The Go edge over Rust is WRITING-EASE (goroutine/channel ergonomics, compile speed) -- MOOT here because the code is AI-written (meta-principle). (3) META-PRINCIPLE (durable; mirrored as feedback_ai_writes_weight_runtime): when code is AI-written, architecture/language decisions weight RUNTIME / user-facing properties (perf, latency, memory, FFI-host quality, safety) OVER writing-ease -- the borrow-checker cost is writing-time friction (AI-absorbed), its benefit (no-GC safety, data-race freedom, the arena ceiling humans skip for effort) is runtime-retained -> systematically favors Rust. (4) LANGUAGE STRATEGY DIRECTION (firms the DR-7 Model-B frame; FULL lock deferred to a future /design-review when the binding work is scheduled): TS stays SELF-CONTAINED native JS (browser/V8; napi loss>gain holds for TS); all other slow + FFI-friendly languages (Python/Ruby/...) ride the Rust core as thin frontends, collapsing parity from N-way to TS<->Rust 2-way; node bodies must be Rust (the constraint that closes the parity gap). (5) D22 HONORED: intra-graph multi-threading stays OUT (causal chain + lock-overhead > savings); parallelism = multi-graph (one thread per graph) where TS workers TIE Rust on independent graphs -- the Rust case rests on GC-avoidance + Model-B-FFI + constant-factor CPU edges, NOT on parallelism. (6) SCHEDULING: the Rust perf track (toward the Stage-3 arena+index target) runs IN PARALLEL with the ongoing TS implementation.","rationale":"Grounded in FIRST PRINCIPLES + established facts, NOT own-measurement: the DR-7 probes (crates/graphrefly/examples/perf_probe.rs + perf-probes/ts_probe.mjs) were AUTHORED but NOT RUN (the user chose reasoning over measurement for now) -- so NO own benchmark number is cited (V8 JIT excellence on warm monomorphic loops => Rust ties TS on pure compute; Rc<dyn Any>/Rc<RefCell> heap-box+refcount+dynamic-borrow = a real but UNMEASURED hot-path tax; the GIL serializes CPU-bound Python threading ~1x; Go GC + cgo cost are documented). Conclusions are number-INDEPENDENT. AI-written code is the pivotal new variable: it nullifies the Go edge (ease) and unlocks the Rust arena ceiling human effort-budgets usually skip. Per-language (D24/F-PERF/L5-Q1): NO spec-amend, NO parity impact; the conformance arm (C-2..C-15) stays the behavior gate for any value-rep/arena change. Extends DR-7.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D55","layer":"L2-Q22 / L1.5","date":"2026-05-30","question":"CSP-2.8 Fork B -- how is a reactiveList's full SNAPSHOT delivered (lazy-push vs protocol-pull), and does protocol-pull require a new DEMAND tier?","decision":"Introduce a SUBSTRATE pull-mode node (NodeOptions.pull:true) -- NOT a new tier (RESUME is the demand; the D9/R-msg-closed-set 10-message set stays INTACT, non-constitutional). A pull node is QUIET by default: it ABSORBS an upstream DIRTY WITHOUT relaying it downstream (the WEDGE FIX -- a quiet compute node that relayed phase-1 DIRTY but withheld the phase-2 settle wedges every downstream's two-phase _pending) and does NOT push-on-subscribe its cached value; it tracks dep changes per its (orthogonal) pausable mode. A RESUME targeting the pull node is the DEMAND: it fires exactly ONE delivery then re-quiets (1:1). Delivery content = the pausable mode: pausable:true -> the coalesced LATEST (one value); pausable:'resumeAll' -> the buffered BACKLOG; pull+pausable:false is REJECTED (contradiction -- pull needs RESUME). A SELF-triggered demand (a consumer fn demanding a dep it also reads) MUST defer to the committed wave boundary, riding R-rewire-deferred (D47) -- an immediate in-fn demand re-enters the consumer (D37); the consumer accepts one-wave latency (HTTP-request model). Fork B: reactiveList exposes a STREAM port (push deltas) + a SNAPSHOT port (a pull-mode node over the RAM accumulator, R-rom-ram); a consumer watches the stream cheaply and DEMANDs the snapshot on its own logic. The .cache external read stays as the deliberately-non-reactive fast peek. SPLIT: pull:true is SUBSTRATE (-> R-pull spec rule + wave_pull.tla + a C-1x conformance scenario, via /spec-amend); the reactiveList port shape is per-language (D6/D24, never parity). Fine wave-semantics PINNED in R-pull (/spec-amend, recommended -- adjustable): (a) demand-on-no-change -> NO delivery (coalesce); (b) the resumeAll first-demand backlog INCLUDES the activation value; (c) the demand wave emits DIRTY-before-DATA (R-dirty-before-data); (d) PRECISE routing via a PER-NODE demand lock (not a process-shared symbol); (e) a demand arriving with pending>0 fires once the node is settle-ready. RESOLVES backlog B40-protocol-pull.","rationale":"Probe-verified BEFORE lock (verify-premise / three-gate): P0b surfaced the quiet-pull DIRTY-relay WEDGE; P4 confirmed pull:true (absorb-DIRTY + no-push-on-subscribe + deferred RESUME demand) un-wedges the consumer and delivers the on-demand snapshot with no D37; P5a/P5b confirmed the pull x pausable delivery matrix (latest / backlog); full TS suite GREEN = zero regression. FAR below the REJECTED reverse-two-phase DEMAND-tier (no reverse coordination -- demand targets one cache-warm source, response reuses forward push; no async hard-wall at the snapshot since the live stream keeps it warm; no constitutional D9 change). Reuses RESUME + the D47 wave-boundary drain (sub-decisions: #1 pull:true flag, #2 1:1, #3 ride R-rewire-deferred). The two-port split (stream push / snapshot pull) is LOAD-BEARING, not cosmetic -- it is WHY the snapshot can stay fully silent (pull) while the stream notifies (push). callbag-recharge dropped talkback-pull for F-SYNC-CORE; this restores an inspectable on-demand pull WITHOUT a tier by confining it to a cache-warm single-source node. Locked via /decision-guard -> /design-review -> spike (A, _probe-pull) 2026-05-30; /spec-amend (B) next.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D58","layer":"L1.5","date":"2026-05-30","question":"CSP-2.7: port the window family (window/windowCount/windowTime, emitting Node<Node<T>> higher-order sub-streams) to clean-slate?","decision":"NO -- the Node<Node<T>> higher-order window forms are NOT ported. The array forms (buffer/bufferCount + deferred bufferTime, B41/B44) are the graph-first inspectable equivalent and cover the windowing need. An emitted sub-stream is a DATA value, not a declared dep, so it is invisible to describe (D3/R-edges-derived/D51 derive edges only from live _deps) and the frozen pure-ts impl (child nodes built + driven imperatively inside the fn body) is a D45 island. ESCAPE HATCH (only if a real consumer needs live independent sub-windows): ship as opaque-value sub-streams -- describe shows the window node + its source dep, the emitted Node<T> values documented as DATA describe does not traverse -- but the DEFAULT is not-ported.","rationale":"a higher-order observable (a Node emitting Nodes) conflicts with graph-first inspectability (D3): its emitted sub-streams carry topology describe cannot show. The array forms (buffer*) are the clean-slate-faithful windowing primitive. Per-language (D6/D24, never in parity); trigger-gated (no consumer). Surfaced by the CSP-2.7 /design-review 2026-05-30.","supersedes":[],"status":"locked","session":"DS-1"},{"id":"D59","layer":"L2-Q22 / L1.5","date":"2026-05-30","question":"How does a downstream node DEMAND a pull-mode node WITHOUT holding its reference (else .cache defeats the purpose) -- inspectably and in protocol-order? How is the pull target identified without collision? (revises D55's trigger/routing + API + names)","decision":"RESUME-ROUTED pull with an author-supplied pullId. (1) API: NodeOptions.pullId: <LockId> (REPLACES D55's pull:true boolean) -- the option's VALUE is the author-generated pullId; the node self-holds it as its quiet lock. The author writes the SAME pullId into the demander's fn (no node reference, no announce -- the pullId is construction-time-static and the demander's author wired the graph). Inspection accessor: node.pullId (pure data; undefined for a non-pull node; REPLACES the landed node.demandLock). (2) DEMAND = a routed RESUME: ctx.up([[RESUME, pullId]]) (broadcast up the declared cone) or ctx.up(towardDep, [[RESUME, pullId]]) (directed first-hop prune). NO new message type -- RESUME reused (D9/R-msg-closed-set 10-message set INTACT). (3) ROUTING (the wave-protocol change): _up on RESUME = RELEASE-IF-HELD-ELSE-FORWARD-UP -- a node holding the lock releases it LOCALLY (normal PAUSE/RESUME unchanged: a controller targets the holder directly); a node NOT holding it FORWARDS the RESUME up its declared deps (broadcast, or the single towardDep edge). A routed RESUME thus travels UP declared edges (describe/observe-visible) until the pullId-holding node FIRES DATA DOWN through the protocol (two-phase DIRTY-before-DATA, glitch-free-ordered -- NOT an unordered .cache peek). pullId disambiguates siblings (F vs H up one branch). (4) CONVENTION: pullId is author-generated and matched by IDENTITY; RECOMMEND a unique Symbol (zero collision with pause locks / other pull nodes; RESUME payload type LockId=string|symbol UNCHANGED). A bare string works but collides with a same-string pause lock (a routed RESUME intercepted + mis-released by an intermediate holding that string) -- author's responsibility; NEVER the node name (non-load-bearing debug metadata). String-LABEL ergonomics (mint a symbol from a label + a label->token registry with DUPLICATE-DETECTION) are graph-layer sugar (per-language, D6/D24), NOT substrate. (5) NEW PRIMITIVE: directed up -- ctx.up(towardDep, msgs) routes a control message up ONE declared edge (also serves branch-targeted PAUSE/RESUME/INVALIDATE). (6) DROP the landed ctx.demandNext direct-target (it required a node reference = the .cache anti-pattern). (7) Self-demand still DEFERS to the committed wave boundary (R-rewire-deferred/D37; one-wave latency, HTTP-request model). RETAINS D55 delivery: quiet / absorb-upstream-DIRTY / no-push-on-subscribe / fire-once / re-quiet (1:1) + semantics (a)(b)(c)(e). (8) NAME CORRECTIONS (pre-1.0, no-compat, one pass in /dev-dispatch): NodeOptions.pull -> pullId; Node._demandLock -> _pullLock; get demandLock() -> get pullId(); delete ctx.demandNext + _requestDemandNext; PULL_DEMAND export already removed; _pull boolean retained (= pullId!==undefined).","rationale":".cache is rejected not only for invisibility (describe can't see it) but because it is an UNORDERED side-channel -- read at an arbitrary fn-body point, bypassing wave ordering ('a knife inserted at an unknown time'), so it can observe a glitchy mid-wave value. A protocol-routed RESUME-up / DATA-down pull is wave-ORDERED (DIRTY-before-DATA, two-phase) AND describe/observe-visible. The landed direct-target ctx.demandNext required a node reference -- which IS the .cache anti-pattern (reach the node = read .cache). Routing RESUME up the DECLARED cone keeps the demand on declared edges (inspectable) and needs only the author-known pullId. RESUME reused (no new message): a pull node is conceptually a perpetually-self-paused node and a demand is a momentary resume; 'release-if-held-else-forward-up' preserves normal pause/resume (target holds its lock -> local) while enabling cone-routed demand (a pull node pre-holds its pullId-lock from birth, so a routed RESUME always finds it; PAUSE needs no symmetric change). pullId = author-supplied Symbol via pullId:<id>: name is non-load-bearing debug metadata; a bare-string id collides with pause-lock strings -- symbol IDENTITY eliminates this; RESUME payload type unchanged (no protocol-shape change); label ergonomics + duplicate-detection live in graph-layer sugar. DEMAND-as-new-message considered + REJECTED: only needed to pull arbitrary EAGER nodes (not the use case -- pull nodes are designated quiet nodes) and to decouple pull from the pause lockset (the QA F4/F5 entanglement, a rare edge -> refinement, B46). Names corrected pre-1.0 in one pass (no-compat): pull->pullId, _demandLock->_pullLock, demandLock getter->pullId, ctx.demandNext deleted. Residuals (author-facing, non-fatal): a mistyped/unknown pullId routes to no holder -> silent no-op (describe lists each pull node's pullId for verification); a duplicate pullId -> multiple responders (graph-layer registry detects this).","supersedes":["D55"],"status":"locked","session":"DS-1"},{"id":"D60","layer":"L1.5","date":"2026-05-31","question":"CSP-2.8 shared reactiveCollection core (the scan-vs-state + snapshot-vs-delta follow-ups D54 explicitly deferred): where does the materialized state live, and what are the two output ports?","decision":"(1) SINGLE MATERIALIZED STATE = the BACKEND. Each reactive* structure owns ONE plain mutable backend object (the array/Map/index-tree/log) with a monotonic version counter; it applies deltas and IS the materialized snapshot -- there is NO separate ACC state node and NO effect/derived bridge duplicating the backend's accumulation (a misdesign rejected here: the backend already does the integration, its cost is intrinsic and paid once). The backend is a closure object, NOT a graph node, so its durability is structural (survives last-subscriber disconnect independent of node lifecycle) -- the earlier ROM-vs-RAM question on the snapshot node is therefore MOOT (durability comes from the backend, not a node cache). (2) TWO OUTPUT PORTS, neither 'primary': (a) DELTA = an always-on push stream -- every mutation pushes ONE delta event (O(1) per mutation), downstream observes events anytime; (b) SNAPSHOT = a PULL-mode node (pullId:<Symbol>, R-pull/D59) that is QUIET by default and, on a cone-routed RESUME demand, LAZILY materializes the backend's CURRENT state (one toArray()-class read, O(n)) and pushes it once, then re-quiets. The O(n) snapshot build happens ONLY when actually demanded -- NOT eagerly on each mutation (an eager state.set(toArray()) on every change would re-impose M*O(n) and make the pull port pointless; lazy makes it P*O(n) with
