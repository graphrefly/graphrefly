mutation); D22 bounds tracked deps to one causal domain","status":"draft","since":"D35","covers_by":[]},{"id":"R-pause-lockset","area":"control","statement":"PAUSE/RESUME carry a lock_id; lockset semantics: a true resume occurs only when every lock has RESUMEd; same-id is idempotent; RESUME of an unknown lock is a no-op (D59) The routing of a RESUME for a lock NOT held HERE is governed by R-up-routing -- it FORWARDS up the declared cone to find the holder (release-if-held-else-forward-up) rather than a flat no-op; a lock no node up the cone holds drops at the depless-source terminus (net no-op). The held-release/idempotent/every-lock-resumed lockset semantics above are unchanged.","rationale":"","status":"active","since":"D10,D59","covers_by":["C-5"]},{"id":"R-pause-modes","area":"control","statement":"pausable {true | 'resumeAll' | false}. true (default): skip fn while any lock held, fire fn once on final-lock RESUME with latest dep values; a leaf source's (depless) own external down() -- sync OR async (timer tick / promise resolve / state.set) -- is NOT gated in default mode (delivered immediately). 'resumeAll': buffer the node's own tier-3/4 settle slice while paused (incl a leaf source's own sync/async down()), replay per-entry in arrival order on final-lock RESUME against a pre-pause baseline (equals references the conceptual-timeline cache); tier-5/6 bypass the buffer. false: ignore PAUSE/RESUME ENTIRELY (timer sources that must keep producing) -- the lockset is never consulted, neither dep-driven recompute nor any (sync/async) own production is gated or buffered. pausable mode is the OUTER gate over R-async-paused (D44): an async-pool late emit buffers ONLY when pausable in {true,'resumeAll'} AND (for true) the node is a COMPUTE node (deps>0); a depless async leaf source delivers immediately in true mode (leaf-vs-compute discriminator = deps.length===0). The ORTHOGONAL pull axis (NodeOptions.pull:true, R-pull / D55) sits ON TOP of pausable mode: a pull node is quiet-by-default (self-holds a per-node demand lock) and RE-QUIETS after each demand pulse; while quiet it suppresses the downstream DIRTY relay + push-on-subscribe; the pausable mode then determines the DEMAND DELIVERY CONTENT (true → coalesced latest; 'resumeAll' → buffered backlog drained). pull+pausable:false is REJECTED (pull needs RESUME as the demand signal).","rationale":"PAUSE is backpressure on recomputation/propagation; production-gating is resumeAll's job. D44 pins the precedence over R-async-paused -- production is gated only by resumeAll, never by true/false (formal wave_async_paused.tla: ShouldBuffer + NoBufferWhenIgnoring, TLC-green across true/false/leaf/resumeAll + mutation-verified). D55 adds the orthogonal pull axis (delivery-content = mode).","status":"active","since":"D10,D44,D55","covers_by":["C-5","C-9","C-10","C-16"]},{"id":"R-async-paused","area":"control","statement":"an async result arriving at a paused node buffers and replays on final-lock RESUME -- BUT this is GATED by pausable mode (D44), not unconditional: it applies only when pausable in {true,'resumeAll'} and, in true mode, only to a COMPUTE node (deps>0). A pausable:false node never buffers (ignores PAUSE, keeps producing); a true-mode depless leaf source delivers its own async production immediately (R-pause-modes). The buffered result enters the node-level pause_lockset-scoped buffer (lock_id scope = node-level pause_lockset).","rationale":"DR-3; D44 conditions the buffering on pausable mode + node kind -- the C-2 node is an async COMPUTE node (deps>0), which is why it buffers; pausable:false (B20) and the async leaf source (B20's twin) are the cases the unconditional reading got wrong.","status":"active","since":"DR-3,D44","covers_by":["C-2","C-9","C-10"]},{"id":"R-teardown-complete","area":"control","statement":"a [[TEARDOWN]] arriving at a non-terminal node synthesizes a [COMPLETE] prefix in the same wave ([[COMPLETE],[TEARDOWN]]) so bridge subscribers resolve before unwiring. Idempotent (subsequent TEARDOWN arrives alone); skipped when the wave already carries COMPLETE/ERROR","rationale":"clean complete-then-teardown lifecycle pair; firstValueFrom-style bridges need the COMPLETE","status":"draft","since":"D9","covers_by":[]},{"id":"R-replay-buffer","area":"control","statement":"replayBuffer:N → node keeps a circular buffer of the last N outgoing DATA values; a late subscriber receives buffered DATA after the START handshake and before live updates","rationale":"replaces the replay() operator + subscribe-hook monkeypatching","status":"draft","since":"D9","covers_by":[]},{"id":"R-restore","area":"lifecycle","statement":"restore ≠ fresh-lifecycle: snapshot serializes all ctx.state; restore restores everything (no wipe); wipe occurs only on a fresh-lifecycle transition","rationale":"Flag 1; added in DR-5","status":"draft","since":"DR-5","covers_by":[]},{"id":"R-snapshot","area":"lifecycle","statement":"snapshot = topology + cache + factory-name refs (NOT fn bodies — the fn lives in code). restore re-resolves nodes by factory name via the dispatcher registry; an anonymous inline fn (no name) is marked local-only and cannot restore cross-process (honestly labeled). Incremental restore via changeset. Storage tiers / WAL / codec / envelope are presentation-layer + deferred, not substrate rules","rationale":"D25; fn cannot serialize, factory-registry re-resolution model","status":"draft","since":"D25","covers_by":[]},{"id":"R-graph-role","area":"graph","statement":"Graph = convenience + inspection entry: register/name/find/describe/observe/profile/snapshot/mount/batch/operators. g.* sugar desugars to dispatcher.register + Node + auto-registers into the graph inspection index. Graph is optional convenience, not a mandatory container; multi-graph is natural","rationale":"D5 Graph holds all convenience+inspection; D3 graph-first mental anchor","status":"draft","since":"D5","covers_by":[]},{"id":"R-edges-derived","area":"graph","statement":"edges are derived on-demand from each node's CURRENT/LIVE deps (the node's live _deps, RE-READ at describe() call time — NOT a construction-time snapshot, so a rewire C-8/C-11 is reflected; D51) + the mount hierarchy; there is no stored edge registry and no connect/disconnect. Every edge shown in describe has a real protocol subscription behind it — decorative edges are not representable (the live-deps reading is what KEEPS this true post-rewire: a construction-time edge would be decorative after removeDep). A live dep absent from the graph inspection index (a runtime *Map inner / bare graph-less node) is auto-discovered as a snapshot node, factory from its NodeOptions.factory (R-describe).","rationale":"D3 topology is a pure function of (nodes, CURRENT deps, mounts); D51 — 'construction-time deps' self-contradicted 'every edge has a real subscription' once rewire (D42/D47) made topology dynamic (a removeDep'd construction edge is decorative). Live-deps reading restores truthfulness + realizes D47/C-11 'describe shows currently-live inners'.","status":"draft","since":"D3,D51","covers_by":[]},{"id":"R-rewire","area":"graph","statement":"setDeps/addDep/removeDep = runtime topology rewire, INTRA-graph only (D22 single causal domain; no inter-graph form — cross-graph wiring is only via the wire bridge). Surgical/Option-C: a dep in both old and new sets is left untouched (subscription + DepRecord survive); only removed deps unsubscribe + discard their DepRecord, only added deps fresh-subscribe; DepRecord-ref dispatch lets kept deps reorder freely. Across a rewire: the first-run gate (_hasCalledFnOnce) is PRESERVED, never re-armed (re-arming would re-gate unchanged deps); an added dep enters prevData=SENTINEL and the fn guards via prevData===SENTINEL; the activated compute-node cache is PRESERVED (R-rom-ram); pause lockset + buffer PRESERVED. An added dep with a cached DATA pushes [DIRTY,DATA] on subscribe (R-push-subscribe); a SENTINEL dep delivers START only. removeDep clears the removed dep's dirty contribution; if it was the sole dirty contributor and the node was dirty, the wave auto-settles. A removed dep's queued messages (DIRTY/DATA/INVALIDATE) are DRAINED — nothing strands downstream. Rejects: self-dependency; a cycle (DFS O(V+E)); a terminal this (completed/errored) for IMMEDIATE/external rewire; adding a non-resubscribable terminal dep (would wedge — resubscribable terminal deps are allowed). Deferred self-rewire queued before terminal is the D62 exception: R-rewire-deferred may apply addDep/removeDep/setDeps after the owner becomes terminal, while terminal remains an output guard. removeDep to zero deps is allowed (degenerate fn-no-deps; cache preserved; no auto-deactivate). Mid-wave rewire (between dep deliveries) is allowed; mid-fn rewire (while the node's fn is executing, _insideRunWave) and reentrant rewire (another setDeps/addDep/removeDep in flight) are REJECTED — a fn mutating its own topology mid-wave is the synchronous feedback-cycle ERROR (D37/R-reentrancy). Topology change does not bump a version counter (topology ≠ DATA). Every rewire API requires an explicit fn (fn-deps pairing: user fns read data[i]/prevData[i] positionally, so a dep-shape change must re-declare the fn). A SELF-triggered mutation (a fn changing its OWN deps in response to its own data) must use the deferred ctx.rewireNext path (R-rewire-deferred / D47), NOT an immediate in-fn call.","rationale":"D42 ratifies the TLA+-verified (port-model wave_protocol_rewire, 126k states) rewire design Q1–Q7 for the clean-slate substrate; D22 bounds it to one causal domain; the mid-fn reject is floor-mandated by D37/R-reentrancy; surgical/Option-C + required-fn come from the Phase 13.8 design iteration. D62 narrows the terminal-this reject to immediate/external rewire only: queued self-rewire drains after terminal, with terminal sealing output rather than freezing topology. Per D42 SD-2, the cross-axis formal coverage is COMPLETE (wave_rewire.tla INVALIDATE+terminal + wave_rewire_emit.tla equals+multi-sink, all TLC-green + mutation-verified) and the TS C-8 arm is green; flipped ACTIVE 2026-05-28 on the TS-arm-green+formal precedent (R-reentrancy/R-up-at-source/R-dirty-before-data), rust/py conformance arms tracked separately in C-8 runtimes","status":"active","since":"D22,D42","covers_by":["C-8"]},{"id":"R-mount","area":"graph","statement":"graph.mount(subgraph,{at}) embeds a child graph addressable under the parent namespace (:: delimited paths); lifecycle signals propagate parent→mounted children; mount has no deps (exempt from deps-first ordering)","rationale":"D4 mount verb; L4-Q4 mount exemption","status":"draft","since":"D4","covers_by":[]},{"id":"R-describe","area":"graph","statement":"describe(opts?) = static, JSON-serializable structure snapshot: {name?; nodes:DNode[]; edges:{from,to}[]; subgraphs?}. DNode = {id (stable mount-aware :: path, auto-numbered when unnamed), name?, factory (operator real name per D6/L1.5, not 'derived'), status (R-status-enum), value? (field ABSENT = SENTINEL/never-emitted), deps:id[], meta? (static annotations, R-meta-presentation)}. edges are derived from each node's CURRENT/LIVE deps + the mount hierarchy (R-edges-derived / D51) — re-read at call time, so a rewire (C-8 immediate / C-11 *Map deferred) is reflected (the snapshot is point-in-time live, NOT a construction snapshot). A live dep absent from the graph index (a runtime *Map inner / bare graph-less node) is AUTO-DISCOVERED as a snapshot node: synthesized stable id, status/value from the node getters, factory from its OWN NodeOptions.factory (the field D43 reserved for standalone graph-less operators, set by the free initNode) else '?'; auto-discovered inners are NOT persistently registered in the graph index (best-effort live capture, no register/unregister churn — D51 chose B2 over a persistent registry; first cut discovers ONE level, transitive = follow-up). value carries the cache snapshot at call time; fn bodies are never serialized (factory-name ref only, D25). describe({explain:{from,to}}) = causal-chain subset (same shape, filtered to the from→to chain). Renderers (pretty/mermaid/d2) are pure functions over the snapshot — NOT methods and NOT a describe({format}) option; there is no graph.explain(). Live-topology streaming (rewire deltas) is an observe topology-event, deferred to CSP-2 viz","rationale":"D3 describe first-class; D39 pins the field set; L4-Q8 renderers pure fns; D25 snapshot same source; per-language (D24, never in parity — documented contract, not conformance-tested); D51 — the snapshot reflects LIVE deps (truthful post-rewire) + auto-discovers unregistered inners (factory via the D43-reserved NodeOptions.factory); live-topology STREAMING (deltas) stays deferred to viz (a point-in-time read is not streaming)","status":"draft","since":"D3,D39,D51","covers_by":[]},{"id":"R-observe","area":"graph","statement":"observe(path?) = read-only live message tap returning a subscribable EGRESS ({subscribe(sink)→unsubscribe}) — NOT a graph node (no self-observation island). observe is a REAL (lazily-activating) subscriber: it uses subscribe internally, so observing a COLD node activates it + its upstream (running their fns), and observing a cached node receives the [DATA,cached] push (R-push-subscribe). 'Read-only' (D19) means observe never EMITS or MUTATES node state — it does NOT mean activation-free; observing a cold graph activates it. Each stream item is an enveloped ObserveEvent = {path, msg (the Message), tier (messageTier), seq (graph-local monotonic clock, D26)}; the envelope carries node identity so single-node / subtree / whole-graph observe share ONE shape. Upstream control is a separate Graph affordance: single-node up(msgs) / all-nodes up(path,msgs) (e.g. PAUSE); a node guard denying an upstream message drops it silently (R-up-at-source)","rationale":"D5 Graph IS the introspection layer; D39 pins the ObserveEvent envelope + read-only egress (not a node); D19 inspection read-only; per-language (D24, never in parity)","status":"draft","since":"D5,D39","covers_by":[]},{"id":"R-inspection-set","area":"graph","statement":"inspection surface = describe (incl explain mode) + observe + profile — 3 first-class methods on Graph; no separate Inspector object","rationale":"L4-Q8 inspection consolidation","status":"draft","since":"D5","covers_by":[]},{"id":"R-meta-presentation","area":"graph","statement":"meta companion stores are presentation/graph-layer, NOT substrate. Static annotations (description/type/range/format/access/tags/unit) → describe metadata attached via g.node opts. Reactive annotations (a status/error that changes over time) → explicit nodes + dep (R-ctx-state / D23). The substrate node carries zero meta machinery. meta.owner ABAC is presentation/multi-agent, out of substrate scope","rationale":"D36; D5 node=thinnest, meta is annotation feeding describe (graph owns inspection)","status":"draft","since":"D36","covers_by":[]},{"id":"R-graph-lifecycle","area":"graph","statement":"graph.signal(msgs) broadcasts a message to all registered nodes (e.g. [[PAUSE,lockId]] or [[INVALIDATE]]); graph.destroy() broadcasts [[TEARDOWN]]. graph.set(name,v) = node.down([[DATA,v]]) sugar; graph.get(name) = cache read","rationale":"D5 graph convenience; L4-Q1 state.set = node.down sugar","status":"draft","since":"D5","covers_by":[]},{"id":"R-clock","area":"runtime","statement":"monotonic time = a graph-local counter (causal-domain ordering, folded into the graph); wall-clock = a system call; there is NO global clock singleton","rationale":"D26 / L3-Q9 config dissolution; graph = single-thread concurrency domain so ordering is domain-local (refined 2026-05-31 with D22 option-A; was 'causal domain', see R-graph-domain)","status":"draft","since":"D26","covers_by":[]},{"id":"R-dispatch-all","area":"runtime","statement":"all fn go through the dispatcher / FactoryRegistry; node((ctx)=>...) also runs through the LocalSync pool. There is no inline-fn-bypasses-dispatcher path","rationale":"F-DISPATCH-ALL; sacred L0.7 (all fn through dispatcher)","status":"draft","since":"D21","covers_by":[]},{"id":"R-sync-core","area":"runtime","statement":"dispatcher.invoke is sync void — wave-state mutation always serializes onto the graph's single thread; async/remote execution returns via a pool callback. 1.0 pools = LocalSync + LocalAsync; dispatcher keeps a pluggable pool trait for WorkerPool/RemotePool","rationale":"F-SYNC-CORE; D20 pool set; sacred L0.7 (wave protocol impl is sync)","status":"draft","since":"D20,D21","covers_by":[]},{"id":"R-handle","area":"runtime","statement":"handle = pure data (pool_id, handle_id), NO methods — serializable/snapshottable/wire-transferable; it is a dispatcher-table index. node ≠ handle (node has up/down methods at the external-world boundary)","rationale":"D7 handle is pure data","status":"draft","since":"D7","covers_by":[]},{"id":"R-graph-domain","area":"runtime","statement":"graph = single-thread CONCURRENCY domain (the unit of concurrency, NOT the bound of causal influence). In-domain propagation is ONE synchronous causal wave: same-tick, glitch-free, diamonds RESOLVED-merged so a fan-in sees one consistent version of its source. Causal influence is NOT bounded by the graph — it CROSSES domains via the async wire bridge as DELAYED CONSISTENCY (a value produced in wave N is consumed one tick later in the peer domain; the two-phase wire gate preserves cross-domain consistency — wave_xgraph.tla L2.F). Compute parallelism is via pool callback (results serialize back to the domain's thread); true parallelism is via multiple graphs + wire bridge. Disjoint waves in the same graph do not parallelize (one concurrency domain = one dispatcher).","rationale":"D22 wave protocol is lock-free because the graph boundary is the CONCURRENCY boundary. Wording refined 2026-05-31 (D22 option-A in-place edit; SESSION-reactive-linear-and-git M4): 'causal domain = concurrency domain' conflated two things — causal influence spans the wire bridge, so the graph bounds the concurrency unit, not the causal range; cross-domain causal propagation is delayed-consistency (wave_xgraph.tla L2.F two-phase gate). Behavior unchanged (C-1/C-4 unaffected).","status":"active","since":"D22","covers_by":["C-1","C-4"]},{"id":"R-no-polling","area":"principle","statement":"state changes propagate reactively via messages; never poll a node's value on a timer or busy-wait for status; periodic behavior is a reactive timer source emitting through the graph","rationale":"spec §5.8 durable value","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-imperative","area":"principle","statement":"no imperative side-channel triggers (event emitters, callbacks, setTimeout+set) to drive graph behavior; all coordination uses ctx.up signals + message flow through topology; remove imperative paths when no caller depends on them","rationale":"spec §5.9 durable value (feedback_no_imperative)","status":"draft","since":"D1","covers_by":[]},{"id":"R-no-raw-async","area":"principle","statement":"no bare async primitives in the reactive layer (TS: Promise/queueMicrotask/setTimeout/process.nextTick; PY: asyncio.create_task/threading.Timer/raw coroutines). Async boundaries live only in sources (fromPromise/fromAsyncIter) and the pool/runner layer","rationale":"spec §5.10; F-SYNC-CORE async only at pool/wire boundary","status":"draft","since":"D20","covers_by":[]},{"id":"R-data-not-peek","area":"principle","statement":"all data propagation — including initial values at connection time — flows through messages [[DATA,v]]; nodes do not peek a dep's .cache to seed computation; .cache is a read-only accessor for external consumers","rationale":"spec §5.12 single mental model: if data moved, a message carried it","status":"draft","since":"D3","covers_by":[]},{"id":"R-primary-api-clean","area":"principle","statement":"protocol internals (DIRTY/RESOLVED/bitmask) never surface in the value-level primary API (derived/effect/operator); ctx-level primitives (node/producer) intentionally expose tier as a power surface (DR-1 §5.11 amend). A developer using value-level sugar never reads the spec to start","rationale":"DR-1 ctx-level is a deliberate protocol-facing power surface; value-level is §5.11-compliant primary","status":"draft","since":"DR-1","covers_by":[]},{"id":"R-reentrancy","area":"wave","statement":"a synchronous feedback cycle — a node fn that, during its invocation, transitively re-drives one of its own (direct or indirect) deps so the same node's fn would re-enter before its wave completes — is a wave-level protocol ERROR. Detection is node-local and free: a node refuses to enter its fn-run while its own in-wave flag (_insideRunWave) is already set, and throws; the graph layer catches the throw and converts it to [[ERROR, e]] down (D30 — value-level throw → graph-layer ERROR), located at a node ON the cycle (the value-level catch nearest the throw on the synchronous unwind — implementation-determined, NOT necessarily the re-entered node), aborting the wave. The core neither queues nor bounds-then-runs the cycle (reject, not iterate). Legitimate accumulation uses per-node ctx.state (e.g. scan): not a topological cycle, never re-enters. Async feedback that crosses a turn boundary via an async pool is out of scope — it is not synchronous re-entry and does not desync the wave. No numeric rerun-depth cap is needed (precise in-wave flag detection supersedes the blunt maxFnRerunDepth)","rationale":"D37; surfaced by CSP-1 /qa (backlog B10); reject (B) over queue-to-wave-end (A) because A normalizes imperative-control-flow-as-topology (feedback_no_imperative) and does not root-fix; detection reuses the existing _insideRunWave flag, dispatcher stays a pure funnel (F-DISPATCH-ALL), error ownership graph-level (D30)","status":"active","since":"D37","covers_by":["C-6"]},{"id":"R-up-at-source","area":"protocol","statement":"a depless source is the terminus of upstream control forwarding (R-ctx-up). It self-ACTS only on a message with a coherent round-trip action: INVALIDATE → HONOR the invalidate-request (clear cache to SENTINEL, fire onInvalidate, broadcast INVALIDATE downstream = self _invalidate; the down-cascade clears the reachable downstream cone; a node guard may deny it per R-observe, dropping silently). DIRTY → DROP/no-op (a source has no downstream-driven recompute; self-dirty would wedge downstream awaiting a settle that never arrives). TEARDOWN → DROP/no-op (source lifecycle is source/graph-owned; revisit on a real cascade-teardown-up consumer). Dep-bearing intermediate nodes never self-act on upstream control — they forward toward deps only; the source is the single actor and the down-cascade is the effect (D59/R-up-routing) A forwarded RESUME (a routed pull DEMAND, R-pull) whose pullId this depless source does NOT hold -> DROP at the terminus, like DIRTY; a source that DOES hold the pullId (a pull source) releases its quiet lock and FIRES one delivery (R-pull). Dep-bearing intermediates forward an unheld RESUME up toward deps (release-if-held-else-forward-up), never self-acting.","rationale":"D38; B11; R-ctx-up/DR-5 lists INVALIDATE up-allowed and the only self-consistent reason is terminus honoring (DS-1 L1.11 'invalidate-request'); INVALIDATE-up is a cache-drop request not an imperative write, so it respects no-imperative + source-owns-value; DIRTY/TEARDOWN lack a coherent terminus action","status":"active","since":"D38,D59","covers_by":["C-7","C-16"]},{"id":"R-profile","area":"graph","statement":"profile(opts?) = opt-in accumulated-counter snapshot: {waves; nodes:Record<path, NodeProfile>}, NodeProfile = {invokes, emits, resolved, errored, lastDurationNs?, totalDurationNs?}. Counters are backed by an opt-in dispatcher/graph-level recorder (DS-1 inspectorEnabled / globalInspector→dispatcher hook), NEVER stored on the thin node (R-node-thin); the dispatcher is the invoke funnel (F-DISPATCH-ALL) so it is the natural source of invoke counts + fn duration. Default OFF = zero runtime overhead (F-PERF). profile is a point-in-time snapshot (like describe); a streaming profile is an observe-aggregation, not a new mechanism. Shares the mount-aware :: path key with describe/observe","rationale":"D39; L4-Q8 third inspection method; R-node-thin keeps counters off the node; F-DISPATCH-ALL dispatcher sees every invoke; F-PERF opt-in; per-language (D24, never in parity)","status":"draft","since":"D39","covers_by":[]},{"id":"R-rewire-deferred","area":"graph","statement":"A node fn may, DURING its run, request a mutation of its OWN dep set via ctx.rewireNext(op), op in {addDep(node,fn) | removeDep(node,fn) | setDeps(nodes,fn)} (R-rewire surgical/Option-C semantics, D42). The request is QUEUED, not applied in place; the dispatcher DRAINS the queue at the COMMITTED wave boundary — after the current wave settles, and after a batch() commits or the final-lock RESUME (never on an un-committed or paused view) — applying each mutation as a fresh wave. Drain order is deterministic: per-node FIFO in issue order, nodes drained in causal order. This deferral is the ONLY legal self-triggered rewire: IMMEDIATE in-fn self-rewire remains the D37 mid-fn feedback-cycle ERROR (R-reentrancy); rewireNext moves application to a turn boundary where _insideRunWave is false. An added dep with cached DATA pushes [DIRTY,DATA] on the boundary wave (R-push-subscribe); a removed dep is unsubscribed and DRAINED, and if it loses its last subscriber it _deactivates and fires onDeactivation (input-side teardown — the basis for operator cancellation / abortInFlight). The first-run gate is PRESERVED across a deferred rewire (never re-armed, R-rewire). If the node goes terminal during the wave, its pending rewireNext queue is still drained: terminal is an output/lifecycle guard, NOT a deferred-topology cancellation condition. Applied addDep/removeDep/setDeps may change live deps after terminal, but terminal status remains final and no post-terminal downstream DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR may escape; non-resubscribable late subscribe is still rejected by R-terminal, while a resubscribable reset starts the next lifecycle from the current drained dep set. A rewireNext producing no net dep-set change is a no-op; a net-changing rewireNext re-issued every boundary (oscillation) is a user-level runaway (like an infinite producer), not a substrate-detected error. The wave-boundary drain ALSO hosts a SELF-TRIGGERED DEMAND — a CONE-ROUTED RESUME(pullId) demand to a pull-mode node (R-pull / R-up-routing / D55,D59), not only dep-set mutations — for the same D37-avoidance reason (an immediate in-fn demand whose delivery loops back re-enters the consumer); same committed-boundary drain, same deferral semantics. INTRA-graph only (D22).","rationale":"D47; *Map operators must grow/shrink their own dep set in response to their own data; the D37 mid-fn reject + the async-pool probe (the async pool does NOT defer the fn — _insideRunWave is set during any fn run, dispatcher/index.ts:48 + node.ts:692) leave the wave boundary as the only legal application point. removeDep is the only thing that stops an abandoned inner's source (read-gate masks output only), and D62 extends that cleanup through terminal waves so helper-owned timer/interval deps can be released by ordinary rewireNext.removeDep. Complements R-rewire (external/immediate) with a self/deferred form, reusing its surgical semantics. Pre-D62 this rule flipped active on 2026-05-30 with TS/Rust arms green under the terminal-discards-queue facet. D62 revises that facet to terminal-drains-queue; wave_rewire_deferred.tla is TLC-green with the new NoPostTerminalOutput invariant; TS re-passed the amended C-11 arm on 2026-05-31, so the rule returns to active on TS-arm-green + formal precedent. rust/py arms remain todo (CSP-5/7). Batch/pause cross-axis drain timing = backlog B24; describe-renders-live-inners (R-edges-derived construction-deps tension) = backlog B34. D55 reuses this boundary to host a self-triggered pull DEMAND (R-pull).","status":"active","since":"D47,D55,D59,D62","covers_by":["C-11","C-16"]},{"id":"R-resolved-undirty","area":"wave","statement":"RESOLVED is the UNDIRTY / no-occurrence settle: a node DIRTY'd in phase 1 that produces NO tier-3 value this wave emits exactly one RESOLVED to clear the downstream dirty (filter-reject / no-emit fn, zero-dep un-dirty, INVALIDATE at a never-populated cache, batch-rollback DIRTY-balance). RESOLVED NEVER substitutes for a DATA and NEVER signals 'value unchanged' -- every value-occurrence is emitted as DATA regardless of value-equality (no auto-equals-substitution; the substrate does not inspect per-wave DATA count for substitution). The undirty RESOLVED is SUBSTRATE-SYNTHESIZED: a value-level operator simply returns without emitting and the substrate emits the balancing RESOLVED (R-primary-api-clean -- operator bodies carry no protocol tier); an operator MAY emit its own DATA/RESOLVED explicitly as an escape hatch. Tier-3 wave exclusivity holds: one node's settle this wave is >=1 DATA (occurrence) XOR exactly 1 RESOLVED (undirty), never mixed. RESOLVED is preceded by DIRTY in the same wave (R-dirty-before-data) like DATA. Dedup (suppress an unchanged emission / skip an expensive recompute) is OPT-IN at the operator layer (distinctUntilChanged / fn early-return), never a substrate behavior; NodeOptions.equals does not exist.","rationale":"D49 supersedes D15/R-equals: equals-absorption overloaded RESOLVED (occurrence-unchanged vs dirty-clear) and destroyed occurrence info, breaking event-counting operators. Narrowing RESOLVED to undirty-only keeps occurrences as DATA (take/scan/snapshot correct) and simplifies the emit path. Glitch-free diamond (R-two-phase/R-diamond) is orthogonal and preserved.","status":"active","since":"D49","covers_by":["C-12"]},{"id":"R-paused-invalidate","area":"control","statement":"INVALIDATE × PAUSE precedence (default/'true' mode). A dep's INVALIDATE arriving while a compute node N is paused: (1) PROPAGATES downstream immediately (consistent with immediate DIRTY — not buffered in default mode; the downstream's N-DIRTY is balanced by this INVALIDATE's dirty-clear); (2) SUPERSEDES that dep's buffered paused dep-wave — N clears the dep to SENTINEL + drops its pending change, then re-derives the pending-recompute flag from whether ANY dep still carries a buffered value-change (ATTRIBUTED). On final-lock RESUME N recomputes once with the latest dep values ONLY if some dep still has a live buffered change; if none remains the recompute is CANCELLED (N already settled to SENTINEL via its own INVALIDATE — it never recomputes against an all-SENTINEL dep set). A later DATA on the same dep re-arms the buffer ([DATA,INVALIDATE,DATA2] → recompute with DATA2). resumeAll mode buffers+replays tier-3/4 on its own path; this rule is the default-mode coalesce semantics.","rationale":"D50; the INVALIDATE-side analogue of D44 (async×PAUSE). Prevents a spurious recompute against a vanished input — a redundant undirty RESOLVED (guarded fn) or a spurious terminal ERROR (non-guarding fn → panic → D30). Attributed cancellation preserves multi-dep updates (no lost update). Formal wave_paused_invalidate.tla (ChangedImpliesLive + PendingReflectsChanges + NoAllSentinelRecompute), TLC-green + mutation-verified. FLIPPED ACTIVE 2026-05-29 on the TS+Rust-arms-green + formal precedent (C-13 ts:pass+rust:pass, both impl-fixes teeth-verified); py arm CSP-7.","status":"active","since":"D50","covers_by":["C-13"]},{"id":"R-terminal-settles-dirty","area":"wave","statement":"A dep's TERMINAL (COMPLETE/ERROR) RELEASES that dep's outstanding in-wave DIRTY contribution: if the dep went DIRTY this wave (phase 1) and has NOT yet settled with DATA/RESOLVED, the receiving node clears that dep's dirty flag and decrements its pending count — exactly as the DATA/RESOLVED/INVALIDATE arms do. This is the EXACTLY-ONE-SETTLE invariant: every dep that goes DIRTY in phase 1 has its contribution released in phase 2 by exactly one settle-class event in {DATA, RESOLVED, INVALIDATE, COMPLETE, ERROR}. It applies in the ABSORBED-terminal cases where the node stays live — completeWhenDepsComplete:false (last/reduce, the *Map higher-order operators) and errorWhenDepsError:false (rescue/catch, R-deps-terminal); the AUTO-CASCADE cases (completeWhenDepsComplete && all deps complete -> node COMPLETE; errorWhenDepsError && a dep errors -> node ERROR) make the node itself terminal, so pending is moot there. If releasing the terminal dep's contribution drains pending to 0 while the node has already broadcast DIRTY this wave AND no terminal cascade fires, the node SETTLES: it recomputes (-> DATA from the remaining live deps' latest values) or, producing no tier-3 value, the substrate synthesizes exactly one undirty RESOLVED (R-resolved-undirty) to balance the downstream DIRTY. WITHOUT this release, a dep that emits DIRTY-then-COMPLETE/ERROR-without-a-value strands pending>0 -> the node never recomputes/settles and the DIRTY it broadcast wedges the downstream cone (the deadlock R-invalidate-idempotent already prevents for the INVALIDATE case). Restores R-diamond / R-two-phase for a diamond whose one leg terminates mid-wave. SCOPE: COMPLETE/ERROR only; a TEARDOWN arriving at a dirtied dep is the terminal-relay question (R-teardown-complete / B33), out of scope here.","rationale":"surfaced by the CSP-2.7 /qa (edge-case review of the *Map operators): node._receiveFromDep's COMPLETE/ERROR arms did not clear a dep's dirty contribution the way the DATA/RESOLVED/INVALIDATE arms do, so a DIRTY-then-terminal-without-DATA dep wedged a multi-dep node (B35). Pins TERMINAL as a settle-class event for dirty-accounting — the missing exactly-one-settle invariant — mirroring the INVALIDATE wedge-guard (the EC3 fix). Locked via /design-review (recommendation A-via-partial-C: a shared release-dirty + post-settle-undirty helper called by COMPLETE/ERROR alongside DATA/RESOLVED). PRE-EXISTING latent gap since CSP-1 (NOT introduced by D47); parity-consistent — the Rust dep-terminal receive arm is not yet built (node.rs _ => {}), so lock-BEFORE-build. No new D# (a dirty-accounting clarification of the two-phase contract D9, surfaced under D30 terminal handling). Formal: wave_terminal_dirty.tla (PendingCountsDirty + NoWedge, mutation-verified — dropping the terminal's release trips PendingCountsDirty). FLIPPED ACTIVE 2026-05-30 on the TS-arm-green + formal precedent (R-rewire/R-reentrancy/R-rewire-deferred): TS impl = node.ts _receiveFromDep COMPLETE/ERROR arms _releaseDepDirty(idx) + _settleAfterAbsorbedTerminal (sawData→recompute, else undirty RESOLVED) / _maybeRun for terminalAsRealInput; C-15 ts:pass (a/b/c). rust:todo = the CSP-6 dep-terminal slice (builds the propagation machinery WITH the release first time, lock-before-build); py:todo CSP-7.","status":"active","since":"D9,D30","covers_by":["C-15"]},{"id":"R-pull","area":"node","statement":"pull-mode node (NodeOptions.pullId:<LockId> -- an author-supplied UNIQUE Symbol written verbatim into the demander's fn; NEVER the node name (non-load-bearing debug metadata), NEVER a bare string (string-equality collides with a same-string pause lock); REPLACES the D55 pull:true boolean) = a quiet-until-demanded source; the demand is a RESUME (NO new message type -- R-msg-closed-set's 10-message set is intact). QUIET (default -- the node self-holds its pullId as its demand lock): (1) ABSORBS an upstream DIRTY WITHOUT relaying it downstream -- internal per-dep dirty/pending accounting is kept, only the DOWNSTREAM DIRTY broadcast is suppressed (the WEDGE FIX); (2) does NOT push-on-subscribe its cached value (START only) -- overrides R-push-subscribe while quiet; (3) tracks dep changes per its ORTHOGONAL pausable mode (true -> coalesce to latest; 'resumeAll' -> buffer the backlog). DEMAND = a CONE-ROUTED RESUME of the node's pullId (R-up-routing): the demander issues ctx.up([[RESUME, pullId]]) (broadcast up the declared cone) or ctx.up(towardDep, [[RESUME, pullId]]) (directed first-hop prune) WITHOUT holding the node's reference; the RESUME travels up declared edges to the pullId-holder, matched by SYMBOL IDENTITY (zero collision; siblings disambiguated). The holder fires EXACTLY ONE delivery then RE-QUIETS (1:1), emitting a fresh DIRTY-before-DATA wave (R-dirty-before-data) so the downstream dirty is balanced. Delivery CONTENT = the pausable mode: true -> the coalesced LATEST (one DATA); 'resumeAll' -> the buffered BACKLOG drained (first-demand backlog INCLUDES the activation value). A demand with NO intervening change -> NO delivery (silent). A demand arriving while a dep DIRTY is in flight (pending>0) fires once the node is settle-ready. pullId + pausable:false is REJECTED at construction (contradiction -- pull needs RESUME as the demand). A SELF-triggered demand (a consumer fn demanding a dep it ALSO reads) MUST defer to the committed wave boundary via R-rewire-deferred (D47) -- an immediate routed RESUME whose delivery loops back re-enters the consumer (D37/R-reentrancy); the consumer accepts one-wave latency. INTRA-graph only (D22). String-LABEL ergonomics (a label->pullId mint + a label->token registry with DUPLICATE-DETECTION) are graph-layer sugar (D6/D24). pull is SUBSTRATE (conformance C-16); the reactiveList two-port shape (stream push + snapshot pull) built on it is per-language (D6/D24, never parity).","rationale":"D55 introduced the pull-mode node + delivery; D59 REVISES the TRIGGER/ROUTING + API (supersedes D55's per-node-opaque-symbol + direct-target ctx.demandNext, RETAINS delivery). A demand must reach the pull node WITHOUT a node reference -- a reference IS the .cache anti-pattern (reach the node, read .cache, an UNORDERED + invisible side-channel) -- so the demand is a RESUME routed up the DECLARED cone (R-up-routing): inspectable (describe/observe), wave-ORDERED (DIRTY-before-DATA), needs only the author-known pullId. RESUME reused (no new message): a pull node is a perpetually-self-paused node, a demand a momentary resume. pullId = author Symbol via pullId:<id> (identity match, zero collision; bare string collides with pause-lock strings; name is non-load-bearing); RESUME payload type LockId=string|symbol UNCHANGED. label ergonomics + duplicate-detection are graph-layer sugar. The original probe-verified delivery (P0b wedge -> absorb-DIRTY fix; P4/P5 matrix) is unchanged.","status":"active","since":"D55,D59","covers_by":["C-16"]},{"id":"R-up-routing","area":"control","statement":"Up-going control messages (R-ctx-up) route along DECLARED dep-edges. ctx.up(msgs) broadcasts up ALL deps; ctx.up(towardDep, msgs) routes up ONE declared edge (directed -- prunes other branches; also for branch-targeted PAUSE/RESUME/INVALIDATE). RESUME routing = RELEASE-IF-HELD-ELSE-FORWARD-UP: a node HOLDING the lock releases it LOCALLY and does NOT forward (normal pause/resume -- a controller targets the holder directly; a pull node holds its own pullId-lock); a node NOT holding it FORWARDS the RESUME up its deps (broadcast or the single towardDep edge) to find the holder. This makes a DEMAND (R-pull) a CONE-ROUTED RESUME of a pull node's pullId that travels up declared edges (inspectable, wave-ordered) WITHOUT the demander holding the target's reference; the pullId disambiguates which holder fires (siblings up one branch are told apart by pullId identity). PAUSE stays NODE-TARGETED (it ACQUIRES a lock, so there is no pre-existing holder to find -- a controller targets the node directly). DIRTY/INVALIDATE/TEARDOWN forward toward deps to the depless-source terminus (R-up-at-source). A forwarded RESUME whose lock NO node up the cone holds reaches the source terminus and is DROPPED (net no-op, R-pause-lockset / R-up-at-source). INTRA-graph only (D22).","rationale":"D59. A demand must reach an upstream pull node WITHOUT a node reference (a reference IS the .cache anti-pattern: reach the node, read .cache) and WITHOUT an out-of-protocol side-channel; routing a RESUME up the DECLARED cone keeps the demand on inspectable, wave-ordered edges (describe/observe see it; .cache is an unordered invisible side-channel that bypasses wave ordering). 'release-if-held-else-forward-up' preserves normal pause/resume (the holder is targeted directly -> local release) while enabling cone-routed demand (a pull node pre-holds its pullId-lock from birth, so a routed RESUME always finds it); PAUSE needs no symmetric change (it creates a lock, no holder to find). Supersedes the old node-local-only RESUME: R-pause-lockset's 'RESUME of an unknown lock is a no-op' becomes 'forward up; drop at the terminus if unheld'. ctx.up(towardDep) prunes dead branches and is the general branch-targeted-control primitive.","status":"active","since":"D59","covers_by":["C-16"]}],"conformance":[{"id":"C-1","name":"cross-graph diamond coalesce","covers":["R-diamond","R-tier","R-two-phase","R-dirty-before-data","R-graph-domain"],"runtimes":{"ts":"todo","rust":"todo","py":"todo"},"status":"required","topology":"A in g1; B,C in g2 (reached from g1 via wire bridge); D in g1. Edges A→B, A→C, B→D, C→D — a diamond split across two single-threaded graphs.","input":"A.down([[DATA, v]]) (one wave).","expect":"DIRTY crosses the wire to B and C at the same priority as DATA (R12). Phase 1 DIRTY reaches D via both legs before any phase-2 DATA. D recomputes EXACTLY ONCE after both B and C settle in the same logical wave; D's outgoing wave contains a single DATA. No glitch (D never fires on a half-settled diamond).","note":"L2.F mixed-locality survival proof — the diamond stays glitch-free even though B/C live in a different causal domain reached over the wire bridge.","blocked":"wire bridge (backlog B2) — not yet implementable; the in-process diamond core it leans on is green in packages/ts core.test.ts (R-diamond/R-two-phase)","ref":"DR-5"},{"id":"C-2","name":"async-result arriving at paused node","covers":["R-async-paused","R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"Producer P backed by an async (LocalAsync) pool → node N. N has one active pause lock.","input":"1) N.up([[PAUSE, L1]]). 2) P's async fn resolves while N is paused, delivering [[DATA, r]] toward N. 3) N.up([[RESUME, L1]]).","expect":"The async result does NOT drop and does NOT deliver mid-pause; it enters N's pause buffer. On final-lock RESUME (L1 released, lockset empty) the buffered result replays as a wave to N's sinks. lock_id scope = the node-level pause_lockset (consistent with PAUSE buffering DATA).","note":"DR-3 — async-result-at-paused-node is buffer+RESUME-replay, identical to how PAUSE buffers a synchronous DATA. Rust arm GREEN 2026-05-30 (CSP-6 Slice A): graphrefly-rs LocalAsync pool (dispatcher Vec<Pool> + register_async; invoke stays sync void, R-sync-core) + DeferredCtx (ctx.defer() owned late-emit, the Rust analogue of TS capturing ctx) + node pause_buffer. should_buffer_on_pause True-branch buffers an async COMPUTE node (deps>0); on_resume drains+replays [DIRTY,DATA]. Teeth-verified (disable the async-compute buffer → DATA delivers mid-pause). conformance.rs::c2_async_result_at_paused_node.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-3,DR-5"},{"id":"C-3","name":"INVALIDATE × ctx.state × onInvalidate","covers":["R-invalidate-idempotent","R-ctx-state","R-cleanup-hooks","R-sentinel"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"source S → derived D. D's fn sets ctx.state on each run and registers ctx.onInvalidate(flush). A second parent S2 → D exists (diamond) to exercise fan-in idempotency.","input":"1) S settles [[DATA, v]] → D runs, caches, sets ctx.state. 2) S.down([[INVALIDATE]]) — cascades to D via both fan-in paths in one wave.","expect":"D broadcasts INVALIDATE downstream exactly ONCE (not once per fan-in path e-data: a post-activation re-join emits DIRTY before DATA in the same logical wave (observed ['DIRTY','DATA'], glitch-free two-phase).","note":"R8/R9 PoC validated; TS arm now a full conformance test (sync + async pool, same process — no wire bridge needed). R-dirty-before-data earned here via the post-activation re-join DIRTY-before-DATA assertion (CSP-3, 2026-05-28). Rust arm GREEN 2026-05-30 (CSP-6 Slice A): the async leg is a derived_async node whose fn stashes ctx.defer() and emits later; the first-run gate holds the join until it delivers, and the async leg's no-emit run is EXEMPT from the undirty-RESOLVED synthesis (deferred ≠ rejected — else the join settles early). Teeth-verified (remove the async exemption → the join fires before the async leg settles, runs=2 not 1). conformance.rs::c4_mixed_sync_async_diamond.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-5","name":"PAUSE lockset multi-source","covers":["R-pause-lockset","R-pause-modes"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"node N with two independent pause controllers, A and B.","input":"1) A.up([[PAUSE, LA]]). 2) B.up([[PAUSE, LB]]). 3) A.up([[PAUSE, LA]]) again (duplicate). 4) A.up([[RESUME, LA]]). 5) B.up([[RESUME, LX]]) for an unknown LX. 6) B.up([[RESUME, LB]]).","expect":"After step 1-2 lockset = {LA, LB}, N paused. Step 3 (same-id repeat PAUSE) is idempotent — lockset unchanged. Step 4 removes LA; lockset = {LB}; N STILL paused (B's lock holds). Step 5 (unknown id) is a no-op. Step 6 removes LB; lockset empty; N truly resumes (fires once with latest dep values under default mode). Releasing one controller never resumes the node while another's lock is held.","note":"multi-pauser correctness by construction — paused state derives from lockset.size > 0. Rust arm GREEN 2026-05-29 (CSP-5): graphrefly-rs node.rs pause_lockset (HashSet) + up() PAUSE/RESUME (same-id idempotent, unknown-RESUME no-op) + default-mode coalesce (maybe_run skip-while-paused → on_resume fire-once-with-latest); conformance.rs::c5. The resumeAll/false modes + async-paused buffering = C-9/C-10 (deferred to the async pool).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"DR-5"},{"id":"C-6","name":"synchronous feedback cycle → ERROR","covers":["R-reentrancy"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"state S → derived D=([S], n=>n+1) → effect E=([D]); E's fn synchronously calls S.set(...) (a write back to S, an indirect dep of E), so S→D→E plus the feedback write closes a cycle.","input":"Kick the graph so E's fn runs and synchronously re-drives S (S.set) before E's wave completes.","expect":"The re-entrant attempt to run E's fn while E is already mid-wave is detected node-locally (E's in-wave flag is set) and rejected: a node ON the cycle emits [[ERROR, e]] (the graph layer catches the substrate throw at the value-level wrapper nearest the throw on the synchronous unwind — D30; which node is implementation-determined, e.g. D or E), and the wave aborts deterministically. NO silent _pending desync, NO unbounded synchronous recursion / stack overflow, NO surviving half-settled state. A legitimate accumulator over the same S built with ctx.state (scan) does NOT trigger the cycle (no topological re-entry).","note":"B10 / D37. Separates a disguised imperative control-flow loop (rejected) from ctx.state accumulation (allowed). Detection reuses the existing _insideRunWave flag (zero new structure); error ownership graph-level (D30); dispatcher uninvolved. Async feedback across a turn boundary (async pool) is a separate, out-of-scope case. Rust arm GREEN 2026-05-29 (CSP-5): Rust has no graph layer yet, so the D30 catch is a catch_unwind at the substrate WAVE-OWNER (the outermost subscribe/down/up/set entry). A panic = the Rust analogue of a value-level throw (the fn signature is Fn(&Ctx)->(); R-reentrancy mandates unwind, not graceful return); it converts to [[ERROR,e]] on the blamed cycle node (the innermost fn that ran = the effect E). Whole-cascade wave-flag recovery via the thread-local WaveScope touched-set closes B25 (conformance.rs::c6 also asserts the post-error source re-emits its leading DIRTY — teeth-verified by disabling the emitted_dirty reset). Per-language impl (D24, like the AnyValue value-rep decision) — no spec-amend / no D#.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D37"},{"id":"C-7","name":"upstream control at a depless source","covers":["R-up-at-source"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"depless source S (cached value) → derived D → sink. D (or a sink on D) originates ctx.up([msg]) which forwards upstream to the terminus S.","input":"Three independent runs, one per upstream-allowed non-pause control kind: 1) D.up([[INVALIDATE]]). 2) D.up([[DIRTY]]). 3) D.up([[TEARDOWN]]).","expect":"INVALIDATE: S HONORS the invalidate-request — S.cache returns to SENTINEL, S's onInvalidate hook fires once, and S broadcasts INVALIDATE downstream so D (and the whole downstream cone) clears (D.cache → SENTINEL, D's onInvalidate fires). DIRTY: DROPPED at S — S unchanged (cache + status intact), NO downstream DIRTY, downstream is NOT left wedged awaiting a settle. TEARDOWN: DROPPED at S — S not terminated, NO downstream TEARDOWN. A node guard on S may deny the INVALIDATE (drops silently) — opt-out, not the default.","note":"B11 / D38. Closes the F-NO-IMPL-DEFINED gap on upstream control reaching a depless source. INVALIDATE-up is a cache-drop request (not an imperative write); DIRTY/TEARDOWN have no coherent terminus action. Dep-bearing intermediates forward only; source is the single actor, down-cascade the effect. Formal: wave_up_source.tla. Rust arm GREEN 2026-05-30 (CSP-6): Core::up — PAUSE/RESUME self-handle the lockset; otherwise a depless source (deps empty) is the terminus (INVALIDATE → self.down([INVALIDATE]) honor, DIRTY/TEARDOWN drop) and a dep-bearing intermediate forwards toward each dep (dup_control reconstructs the payload-free kind, Msg not Clone). Teeth-verified (disable the terminus INVALIDATE → S keeps its cache). conformance.rs::c7_upstream_control_at_depless_source.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D38"},{"id":"C-8","name":"intra-graph runtime rewire","covers":["R-rewire"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"sources A, B (B carries a cached DATA b0); derived D = ([A], fn) — D initially depends only on A. All in one graph (D22 single causal domain).","input":"1) A settles [[DATA,a1]] → D's first-run gate opens, cache=fn(a1). 2) D.addDep(B, fn2). 3) B settles [[DATA,b1]]. 4) D.removeDep(A, fn3). 5) A settles [[DATA,a2]]. 6) D.setDeps([B], fn3) (current set, idempotent). Variants: remove A while A's DIRTY is mid-flight to D; A sends [[INVALIDATE]] then D.removeDep(A); A goes terminal then attempt D.addDep(A) / attempt a rewire on a terminal D / addDep(self) / a cycle / mid-fn rewire.","expect":"Surgical (Option-C): a rewire touches only changed deps — kept deps keep their subscription + DepRecord, no unsub/resub. (2) addDep(B) with B cached → B's cached value reaches D via the subscribe handshake (START then [DATA,b0] per R-push-subscribe) and D recomputes; the first-run gate is NOT re-armed (D already passed it — it does not re-wait for a fresh round of all deps); an added SENTINEL dep delivers START only, no recompute until it emits. (3) B's update drives D. (4) removeDep(A) discards A's DepRecord + clears A's dirty contribution; if A was the sole dirty contributor and D was dirty, D AUTO-SETTLES; D's cache is PRESERVED across every rewire (R-rom-ram). (5) after removeDep(A) a2 NO LONGER drives D — A's edge is DRAINED so no stale DIRTY/DATA/INVALIDATE strands. (6) setDeps to the current set is idempotent (no spurious recompute, no DepRecord churn). A mid-wave removal (A's DIRTY in flight) auto-settles per above; a removed dep's queued INVALIDATE is drained, never lands. REJECTS (throw → graph-layer ERROR, not silent): self-dependency; a cycle; setDeps/addDep/removeDep on a terminal D (completed/errored); adding a non-resubscribable terminal dep (resubscribable terminal allowed); mid-fn rewire (a fn mutating its own topology mid-wave = the D37 feedback-cycle ERROR) and reentrant rewire. removeDep to zero deps → degenerate fn-no-deps, cache preserved, no auto-deactivate. Every rewire requires an explicit fn (positional fn-deps pairing). INTRA-graph only (D22); no cross-graph rewire form.","note":"D42/CSP-2.5; R-rewire (since D22, refined by D42). SUBSTRATE prerequisite for higher-order operators (mergeMap/switchMap/concatMap/exhaustMap/flatMap). Formal (SD-2 gate, all four cross-axes): wave_rewire.tla = per-node Q1–Q7 + rewire×INVALIDATE (NoStaleEdgeMessages) + rewire×terminal (RewireOnlyOnLiveNode), TLC-green 603k states; wave_rewire_emit.tla = rewire×equals (CacheMatchesLastData) + rewire×multi-sink (MultiSinkConsistent), TLC-green 3003 states; all four new invariants mutation-verified load-bearing. TS arm GREEN 2026-05-28 (setDeps/addDep/removeDep in @graphrefly/ts node.ts; conformance.test.ts C-8 + rewire.test.ts 12 unit tests); rust/py arms pending CSP-5/CSP-7. R-rewire FLIPPED ACTIVE 2026-05-28 (TS-arm-green+formal precedent). Rust arm GREEN 2026-05-30 (CSP-6): graphrefly-rs node.rs setDeps/addDep/removeDep on Node<T> + Core::rewire — surgical Option-C via per-dep CURRENT-index boxes (Rc<Cell<i64>>: kept-dep reorder = O(1) box reroute, removed dep box→-1 drain), fn-swap re-register + B32 unregister-old (slotmap GC, freeing the rewired-away closure), push-on-subscribe for an added cached dep, atomic multi-add settle (in_dep_mutation defers maybe_run → ONE two-phase DIRTY→DATA via settle_rewire), Q6 removeDep auto-settle (+ zero-dep un-dirty RESOLVED), first-run gate + cache preserved (Q2/Q7). Rejects panic-propagate externally (self-dep/cycle-DFS/terminal-self/terminal-dep/reentrant); a MID-FN rewire becomes [[ERROR,e]] via the wave-owner catch (R-reentrancy/D37, Rust substrate bundles the D30 catch). conformance.rs::c8 (surgical + terminal-reject) + node.rs 11 rewire unit tests; teeth-verified (disable box-reroute → reorder fails; disable atomic defer → fires on a partial SENTINEL view). rust uses the existing TLA+ (wave_rewire.tla + wave_rewire_emit.tla, SD-2 already met). py:todo (CSP-7).","harness":"packages/ts/src/__tests__/conformance.test.ts","ref":"D22,D42"},{"id":"C-9","name":"pausable:false async source ignores PAUSE (keeps producing)","covers":["R-pause-modes","R-async-paused"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"depless async-pool source S with pausable:false (timer/interval-class) -> sink.","input":"1) subscribe a sink to S. 2) S.up([[PAUSE, L1]]). 3) S's async fn resolves, emitting [[DATA, r]] while the lock is held.","expect":"DATA is delivered to the sink IMMEDIATELY (DIRTY+DATA), NOT buffered -- pausable:false ignores PAUSE/RESUME entirely; the lockset is never consulted and production continues through the PAUSE (contrast C-2, where a pausable compute node buffers). A subsequent RESUME is a no-op (nothing buffered).","note":"D44 -- pausable mode is the outer gate over R-async-paused; false dominates (resolves B20). Rust arm GREEN 2026-05-30 (CSP-6 Slice A): Node::producer_opts(pool:Async, pausable:False); should_buffer_on_pause returns false for Pausable::False, so the leaf source's deferred production delivers immediately ([DIRTY,DATA]) under a held lock. conformance.rs::c9_pausable_false_async_source_ignores_pause.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D44,DR-3,B20"},{"id":"C-10","name":"true-mode async leaf source delivers own production immediately under PAUSE","covers":["R-pause-modes","R-async-paused"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"depless async-pool LEAF source S, pausable:true (default; fromPromise/fromAsyncIter-class) -> sink.","input":"1) subscribe a sink to S. 2) S.up([[PAUSE, L1]]). 3) S's async fn resolves, emitting [[DATA, r]] while the lock is held.","expect":"DATA is delivered to the sink IMMEDIATELY (DIRTY+DATA), NOT buffered -- in true mode PAUSE gates recomputation/propagation, not a leaf source's OWN production ('production-gating is resumeAll's job'). A COMPUTE node (deps>0) in the same position WOULD buffer (C-2); with pausable:'resumeAll' the leaf source WOULD buffer.","note":"D44 -- the true-mode leaf-source carve-out extends to async production (B20's twin). Rust arm GREEN 2026-05-30 (CSP-6 Slice A): Node::producer_async (pausable:true default); the should_buffer_on_pause True-branch requires deps>0, so a depless async LEAF source delivers its own production immediately under PAUSE (the deps.is_empty() leaf-vs-compute discriminator). conformance.rs::c10_true_mode_async_leaf_source_delivers_immediately.","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D44,DR-3"},{"id":"C-11","name":"higher-order inner rewire at the wave boundary","covers":["R-rewire-deferred"],"runtimes":{"ts":"pass","rust":"todo","py":"todo"},"status":"required","topology":"outer source S; operator OP = ([S], fn) in one graph (D22). fn: on S DATA v -> inner = makeInner(v); ctx.rewireNext(addDep inner). on an inner COMPLETE -> ctx.rewireNext(removeDep that inner). switch-variant: on S DATA -> rewireNext(removeDep prevInner) + rewireNext(addDep newInner). Inners are leaf sources whose deactivation is observable (a flag set in onDeactivation).","input":"1) S [[DATA,v1]] -> OP requests addDep(innerA). 2) wave settles -> drain -> innerA added+subscribed, cached DATA pushed [DIRTY,DATA]. 3) innerA DATA -> forwarded. 4) (switch) S [[DATA,v2]] -> OP requests removeDep(innerA)+addDep(innerB). 5) drain -> innerA unsubscribed+drained, loses last subscriber -> _deactivate -> onDeactivation fires (cancellation observable); innerB added. 6) (merge) two inners live -> both forward. 7) an inner COMPLETEs -> removeDep -> drain removes it (bounding). Variants: IMMEDIATE in-fn this.addDep (not via rewireNext) -> REJECTED (D37); rewireNext then OP terminal same wave -> queue still drains after terminal; no-net-change rewireNext -> no-op.","expect":"A rewireNext NEVER mutates _deps while _insideRunWave is true (deferred to the post-settle drain). The drain runs at the COMMITTED boundary (after batch commit / final-lock RESUME, never on an un-committed/paused view). Each queued op applied exactly once, in deterministic order (per-node FIFO, causal node order), as a fresh wave. Added cached dep pushes [DIRTY,DATA]; first-run gate NOT re-armed. Removed dep DRAINED (no stale DIRTY/DATA/INVALIDATE strands) and, if last subscriber, _deactivates + fires onDeactivation = observable input-side teardown (switchMap cancel/abortInFlight; mergeMap bounding). switch: only the current inner forwarded AND the superseded inner's source torn down (not merely masked). IMMEDIATE in-fn self-rewire still throws -> graph-layer ERROR (D37). Terminal OP still drains pending rewireNext requests at the boundary: removeDep releases the auxiliary dep (observable deactivation), addDep/setDeps may change topology, and any later dep messages are absorbed by the terminal output guard (no downstream post-terminal DATA/RESOLVED/INVALIDATE/COMPLETE/ERROR). No-net-change rewireNext = no-op (no boundary-drain loop). INTRA-graph only.","note":"D47/R-rewire-deferred, amended by D62. Distinct from C-8 (external/immediate rewire between waves): C-11 is SELF-triggered/deferred-at-boundary. D62 revises the prior terminal facet: a node going terminal no longer discards already-queued rewireNext requests; the queue drains at the committed boundary, while terminal remains an output/lifecycle guard. Formal: wave_rewire_deferred.tla TLC-green after D62 (41,137 generated / 15,367 distinct / depth 24) with five invariants: DeferredAppliedAtBoundary, DrainExactlyOnce, RemovedDepSilenced, NoBoundaryDrainLoop, NoPostTerminalOutput. Runtime arms were reset because the previous TS/Rust passes implemented/tested terminal-discard. Required implementation update: remove the terminal-discard guard from deferred rewire application; add terminal-drain tests proving (a) queued removeDep after terminal deactivates/releases the helper dep, (b) queued addDep/setDeps after terminal may change deps, and (c) later dep messages produce no downstream post-terminal output. Batch/pause deferred-drain timing remains backlog B24. TS IMPL LANDED 2026-05-31 (/dev-dispatch): node.ts no longer discards deferred rewire on terminal; _applyRewireNext applies queued add/remove/set through the internal rewire path with terminal-owner allowance while the public terminal rewire reject remains intact; C-11 terminal-drain variants prove queued add/set may change topology but post-terminal output is sealed, and queued removeDep releases helper-owned work. time.test adds regression coverage for timeout/bufferTime/audit terminal/error timer cleanup. 263 TS tests green. rust:todo CSP-5; py:todo CSP-7.","harness":"packages/ts/src/__tests__/conformance.test.ts + rewire-deferred.test.ts","ref":"D47,R-rewire-deferred,D42,D37"},{"id":"C-12","name":"occurrences stay DATA; RESOLVED is undirty-only (no equals-substitution)","covers":["R-resolved-undirty"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"(a) a source emitting a repeated value (fromIter([1,1,1])-class) -> sink. (b) the same source -> take(3) -> sink. (c) source -> filter(pred rejecting every value) -> downstream node -> sink. (d) source -> distinctUntilChanged -> ","rust":"pass","py":"todo"},"status":"required","topology":"compute node N = ([D1,D2], fn) paused via its own lockset (default/'true' mode); D1, D2 are sources. fn guards SENTINEL deps (reads prevData/data, emits only when present).","input":"Three runs. (a) SOLE-DEP CANCEL: N has run once; PAUSE N; D1 settles [[DATA,v1]] (buffered, N does not recompute); D1 sends [[INVALIDATE]]; RESUME N. (b) RE-ARM: PAUSE N; D1 [[DATA,v1]]; D1 [[INVALIDATE]]; D1 [[DATA,v2]]; RESUME N. (c) MULTI-DEP SURVIVE: PAUSE N; D1 [[DATA,v1]]; D2 [[DATA,v2]]; D1 [[INVALIDATE]]; RESUME N.","expect":"(a) the INVALIDATE PROPAGATES downstream immediately while paused (N broadcasts INVALIDATE, cache→SENTINEL, onInvalidate fires); on RESUME N does NOT recompute (the paused dep-wave was superseded — N is SENTINEL, nothing to recompute) — NO spurious undirty RESOLVED, and crucially NO recompute against a SENTINEL dep (so a non-guarding fn does NOT panic→spurious terminal ERROR). (b) on RESUME N recomputes ONCE with D1=v2 (the post-INVALIDATE DATA re-armed the buffer; v1 was superseded). (c) on RESUME N recomputes ONCE with D2=v2 and D1=SENTINEL (the fn guards D1) — the D1 INVALIDATE did not cancel the recompute D2's buffered change warrants (no lost update). In all cases the downstream dirty bookkeeping stays balanced (N's leading DIRTY is cleared by either the INVALIDATE or the resume settle).","note":"D50 / R-paused-invalidate. The INVALIDATE×PAUSE analogue of D44/C-9/C-10 (async×PAUSE). Surfaced by the CSP-5 Rust /qa (finding A): the impl left paused_dep_wave_occurred set after an INVALIDATE → resume recompute against a SENTINEL dep → spurious ERROR (Rust) / garbage value (TS). Formal: wave_paused_invalidate.tla (ChangedImpliesLive + PendingReflectsChanges + NoAllSentinelRecompute), TLC-green 327 states + ChangedImpliesLive mutation-verified. BOTH ARMS GREEN 2026-05-29: TS (node.ts INVALIDATE branch + conformance.test.ts C-13 a/b/c) + Rust (node.rs receive_from_dep INVALIDATE branch attributed-cancellation + conformance.rs::c13) — both impl-fixes teeth-verified (disable the cancellation → C-13(a) fails: superseded wave recomputes). R-paused-invalidate flipped active. py:todo (CSP-7).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D50,D44"},{"id":"C-14","name":"cleanup hooks are per-run (cleared + re-registered each fn run)","covers":["R-cleanup-hooks"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"source S → derived D. D's fn registers BOTH ctx.onInvalidate(flush++) and ctx.onDeactivation(cleanup++) on EVERY run, then emits.","input":"1) S settles [[DATA,v1]] → D runs (registers run-1 hooks). 2) S [[DATA,v2]] → D re-runs. 3) S [[DATA,v3]] → D re-runs (D has now run 3×). 4) S.down([[INVALIDATE]]). 5) unsubscribe D's last sink (D deactivates).","expect":"After 3 runs, the INVALIDATE (step 4) fires onInvalidate EXACTLY ONCE (the current/run-3 registration), NOT 3× — the prior runs' onInvalidate registrations were cleared at each run-start and discarded without firing (D28 onRerun-cut). Deactivation (step 5) fires onDeactivation EXACTLY ONCE (run-3's), NOT 3×. A single-run node keeps its one registration (no re-run → no clear). Both hooks behave uniformly (clear-and-re-register).","note":"R-cleanup-hooks per-run lifecycle (D28 clarification, no new D#). Surfaced by the CSP-5 Rust /qa (finding E, parity-consistent): push-only hook lists fired K stale hooks after K runs. Fix = clear BOTH hook lists before each fn invocation (run_wave/_runWave), re-register from the fn body. No TLA+ (cleanup hooks are a registration-list lifecycle, not in the wave_protocol formal state model). User-approved uniform clear-and-re-register + no-new-D# 2026-05-29. BOTH ARMS GREEN 2026-05-29: TS (_runWave clears _onInvalidate+_onDeactivation; effect sugar simplified to re-register every run — dropped the register-once+ctx.state pattern that relied on cross-run persistence; conformance.test.ts C-14 + single-run keep-test) + Rust (run_wave clears on_invalidate+on_deactivation; conformance.rs::c14) — both teeth-verified (disable the clear → C-14 fails: flush=3 not 1). py:todo (CSP-7).","harness":"packages/ts/src/__tests__/conformance.test.ts + graphrefly-rs crates/graphrefly/tests/conformance.rs","ref":"D28,D29"},{"id":"C-15","name":"a dep's terminal releases its in-wave DIRTY contribution (no wedge)","covers":["R-terminal-settles-dirty"],"runtimes":{"ts":"pass","rust":"pass","py":"todo"},"status":"required","topology":"diamond: sources A, A2; leg B = ([A], fn) and leg C = ([A2], fn); join D = ([B,C], fn) that ABSORBS leg terminals — completeWhenDepsComplete:false (and reads ctx.depRecords[i].terminal). Variant-rescue: D' = ([B,C], fn) with errorWhenDepsError:false.","input":"(a) COMPLETE-mid-dirty: drive A so B goes DIRTY toward D (phase 1); B then settles by going terminal with NO DATA (its source ended -> B COMPLETE); separately A2 drives C to settle [[DATA,c]]. (b) sole-dirty: only B dirties then COMPLETEs (C unchanged this wave). (c) rescue: B goes DIRTY then ERRORs with no value; D' has errorWhenDepsError:false; C settles [[DATA,c]].","expect":"(a) B's COMPLETE RELEASES B's outstanding DIRTY contribution at D (D's pending for B clears) EXACTLY as a DATA/RESOLVED/INVALIDATE would; D then joins EXACTLY ONCE on the live leg (R-diamond) emitting one DATA (or, if its fn produces no value, one substrate-synthesized undirty RESOLVED, R-resolved-undirty) — the leading DIRTY D broadcast is balanced, never left wedged. (b) sole-dirty-contributor: B's COMPLETE drains D's pending to 0 -> D settles via the undirty RESOLVED, downstream un-dirties (no wedge, no spurious DATA). (c) the rescued ERROR likewise releases B's dirty; D' recomputes once reading depRecords[B].terminal, no stranded pending. In ALL cases a dep that went DIRTY-then-terminal-without-DATA never leaves D's pending>0 and D never wedges. The exactly-one-settle invariant: every dirtied dep is released by exactly one of {DATA,RESOLVED,INVALIDATE,COMPLETE,ERROR}.","note":"R-terminal-settles-dirty (B35). The terminal analogue of the INVALIDATE wedge-guard (R-invalidate-idempotent / EC3). Surfaced by the CSP-2.7 /qa; PRE-EXISTING since CSP-1 (not introduced by D47). Formal: wave_terminal_dirty.tla (PendingCountsDirty + NoWedge), TLC-green 61 states + PendingCountsDirty mutation-verified load-bearing (drop the terminal's release -> trips). SCOPE COMPLETE/ERROR; TEARDOWN-at-a-dirtied-dep = B33-adjacent, out of scope. TS ARM GREEN 2026-05-30 (/spec-amend → impl): node.ts _receiveFromDep COMPLETE/ERROR arms call _releaseDepDirty(idx) (clear dep dirty + pending--) before the branch logic; absorbed-terminal (completeWhenDepsComplete:false && !terminalAsRealInput) routes to _settleAfterAbsorbedTerminal (sawData → recompute → DATA; else undirty RESOLVED, cache preserved); terminalAsRealInput → _maybeRun (rescue/*Map read the terminal); auto-cascade unchanged. conformance.test.ts C-15 a/b/c (COMPLETE-mid-dirty join-once / sole-dirty undirty-RESOLVED / rescue ERROR) ts:pass; 157 tests + lint + build green. R-terminal-settles-dirty FLIPPED ACTIVE on the TS-arm-green + formal precedent. rust:pass via the CSP-6 dep-terminal-propagation slice; py:todo CSP-7. /qa 2026-05-30 added sub-case (d) GATE-HOLDS: a dirtied dep completing-empty on a PRE-first-run multi-dep node (another dep has DATA but the first-run gate still holds since the terminated dep never delivered + terminalAsRealInput:false) must un-dirty via RESOLVED, never wedge — the naive sawData->_maybeRun missed this corner (the recompute is gated, leaving the broadcast DIRTY stranded). FIXED: _settleAfterAbsorbedTerminal now falls back to the undirty RESOLVED whenever it still owes a settle after _maybeRun (mutation-verified — revert the fallback -> (d) fails); status corrected to the undirty convention hasData?resolved:sentinel (was 'settled'). terminal-release x PAUSE/batch coalescing = backlog B39 (bar
