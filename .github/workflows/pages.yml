name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and check public docs
        run: npm run docs:public:check

      - name: Checkout Python host package
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly-py
          ref: main
          path: package-docs/graphrefly-py

      - name: Checkout Rust native engine
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly-rs
          ref: main
          path: package-docs/graphrefly-rs

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python docs dependencies and native extension
        working-directory: package-docs/graphrefly-py
        run: |
          uv sync --group dev --group docs
          uv run maturin develop --release

      - name: Check Python API docs coverage
        working-directory: package-docs/graphrefly-py
        run: uv run python scripts/check_api_docs.py

      - name: Build Python package docs
        working-directory: package-docs/graphrefly-py
        run: uv run zensical build --strict

      - name: Compose Python docs route
        run: |
          rm -rf website/dist/py
          mkdir -p website/dist/py
          cp -R package-docs/graphrefly-py/site/. website/dist/py/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
